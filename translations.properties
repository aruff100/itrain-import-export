help.statusBarText.de=Am unteren Rand des Fensters zeigt die Statusleiste drei Angaben zum aktuell geöffneten Kategorie-Reiter, jeweils durch "|" voneinander getrennt:\n- die Anzahl der Einträge in dieser Kategorie, z.B. "Lokomotiven: 16 Einträge"\n- die Anzahl der aktuell markierten Einträge, z.B. "Ausgewählt: 1"\n- die Anzahl der damit verbundenen Datensätze, z.B. "Verbundene Datensätze: 200"\n\n**Verbundene Datensätze** sind die Einträge aus anderen Kategorien, die von der aktuellen Auswahl referenziert werden und beim Export automatisch mitgenommen würden (siehe Abschnitt "Verknüpfte Einträge"). Die Zahl entspricht genau der Anzahl, die vor einem Export im Bestätigungsdialog genannt wird.\n\nAlle drei Angaben aktualisieren sich automatisch beim Wechseln des Reiters sowie bei jeder Änderung der Auswahl oder der Einträge.
help.statusBarText.en=At the bottom edge of the window the status bar shows three pieces of information about the currently open category tab, each separated by a "|":\n- the number of entries in this category, e.g. "Locomotives: 16 entries"\n- the number of currently selected entries, e.g. "Selected: 1"\n- the number of linked records, e.g. "Linked records: 200"\n\n**Linked records** are the entries from other categories that are referenced by the current selection and that would automatically be taken along on export (see the section "Linked entries"). The number is exactly the one stated in the confirmation dialog before an export.\n\nAll three are updated automatically when switching tabs and on every change of the selection or of the entries.
help.statusBarText.nl=Onderaan het venster toont de statusbalk drie gegevens over het momenteel geopende categorietabblad, telkens gescheiden door een "|":\n- het aantal items in deze categorie, bijv. "Locomotieven: 16 items"\n- het aantal momenteel geselecteerde items, bijv. "Geselecteerd: 1"\n- het aantal gekoppelde records, bijv. "Gekoppelde records: 200"\n\n**Gekoppelde records** zijn de items uit andere categorieën waarnaar de huidige selectie verwijst en die bij een export automatisch worden meegenomen (zie het hoofdstuk "Gekoppelde items"). Het getal komt precies overeen met het aantal dat vóór een export in het bevestigingsvenster wordt genoemd.\n\nAlle drie de gegevens worden automatisch bijgewerkt bij het wisselen van tabblad en bij elke wijziging van de selectie of van de items.
help.statusBarText.fr=En bas de la fenêtre, la barre d'état affiche trois informations sur l'onglet de catégorie actuellement ouvert, séparées par un "|" :\n- le nombre d'entrées de cette catégorie, p. ex. "Locomotives : 16 entrées"\n- le nombre d'entrées actuellement sélectionnées, p. ex. "Sélectionné : 1"\n- le nombre d'enregistrements liés, p. ex. "Enregistrements liés : 200"\n\nLes **enregistrements liés** sont les entrées d'autres catégories référencées par la sélection actuelle et qui seraient automatiquement emportées lors d'un export (voir la section "Entrées liées"). Ce nombre correspond exactement à celui indiqué dans la boîte de confirmation avant un export.\n\nLes trois informations se mettent à jour automatiquement lors du changement d'onglet ainsi qu'à chaque modification de la sélection ou des entrées.
help.statusBarText.es=En el borde inferior de la ventana, la barra de estado muestra tres datos sobre la pestaña de categoría abierta actualmente, separados por "|":\n- el número de entradas de esa categoría, p. ej. "Locomotoras: 16 entradas"\n- el número de entradas actualmente seleccionadas, p. ej. "Seleccionado: 1"\n- el número de registros vinculados, p. ej. "Registros vinculados: 200"\n\nLos **registros vinculados** son las entradas de otras categorías a las que hace referencia la selección actual y que se llevarían automáticamente al exportar (véase el apartado "Entradas vinculadas"). La cifra coincide exactamente con la que se indica en el diálogo de confirmación antes de una exportación.\n\nLos tres datos se actualizan automáticamente al cambiar de pestaña y con cada cambio de la selección o de las entradas.
help.statusBarText.it=Nel bordo inferiore della finestra la barra di stato mostra tre informazioni sulla scheda di categoria attualmente aperta, separate da "|":\n- il numero di voci in questa categoria, ad es. "Locomotive: 16 voci"\n- il numero di voci attualmente selezionate, ad es. "Selezionato: 1"\n- il numero di record collegati, ad es. "Record collegati: 200"\n\nI **record collegati** sono le voci di altre categorie referenziate dalla selezione attuale, che verrebbero automaticamente incluse in un'esportazione (vedi la sezione "Voci collegate"). Il numero corrisponde esattamente a quello indicato nella finestra di conferma prima di un'esportazione.\n\nTutte e tre le informazioni si aggiornano automaticamente al cambio di scheda e a ogni modifica della selezione o delle voci.
help.statusBarText.pt=Na margem inferior da janela, a barra de estado mostra três informações sobre o separador de categoria atualmente aberto, separadas por "|":\n- o número de entradas nesta categoria, p. ex. "Locomotivas: 16 entradas"\n- o número de entradas atualmente marcadas, p. ex. "Selecionadas: 1"\n- o número de registos ligados, p. ex. "Registos ligados: 200"\n\nOs **registos ligados** são as entradas de outras categorias referenciadas pela seleção atual e que seriam automaticamente levadas numa exportação (ver a secção "Entradas ligadas"). O número corresponde exatamente ao que é indicado na caixa de confirmação antes de uma exportação.\n\nAs três informações são atualizadas automaticamente ao mudar de separador, bem como sempre que a seleção ou as entradas são alteradas.
help.statusBarText.pl=W dolnej części okna pasek stanu pokazuje trzy informacje dotyczące aktualnie otwartej karty kategorii, oddzielone znakiem "|":\n- liczbę wpisów w tej kategorii, np. "Lokomotywy: 16 wpisów"\n- liczbę aktualnie zaznaczonych wpisów, np. "Zaznaczono: 1"\n- liczbę powiązanych rekordów, np. "Powiązane rekordy: 200"\n\n**Powiązane rekordy** to wpisy z innych kategorii, do których odwołuje się bieżące zaznaczenie i które zostałyby automatycznie zabrane przy eksporcie (patrz rozdział "Powiązane wpisy"). Liczba ta odpowiada dokładnie tej podawanej w oknie potwierdzenia przed eksportem.\n\nWszystkie trzy informacje aktualizują się automatycznie przy zmianie karty oraz przy każdej zmianie zaznaczenia lub wpisów.
help.statusBarText.da=Nederst i vinduet viser statuslinjen tre oplysninger om den aktuelt åbne kategorifane, adskilt af "|":\n- antallet af poster i denne kategori, f.eks. "Lokomotiver: 16 poster"\n- antallet af aktuelt markerede poster, f.eks. "Valgt: 1"\n- antallet af forbundne datasæt, f.eks. "Forbundne datasæt: 200"\n\n**Forbundne datasæt** er de poster fra andre kategorier, som den aktuelle markering henviser til, og som automatisk ville blive taget med ved en eksport (se afsnittet "Sammenkædede poster"). Tallet svarer nøjagtigt til det, der nævnes i bekræftelsesdialogen inden en eksport.\n\nAlle tre oplysninger opdateres automatisk, når fanen skiftes, samt ved enhver ændring af markeringen eller posterne.
help.statusBarText.sv=Längst ner i fönstret visar statusraden tre uppgifter om den aktuellt öppna kategorifliken, åtskilda av "|":\n- antalet poster i den kategorin, t.ex. "Lok: 16 poster"\n- antalet för närvarande markerade poster, t.ex. "Markerade: 1"\n- antalet länkade poster, t.ex. "Länkade poster: 200"\n\n**Länkade poster** är de poster från andra kategorier som den aktuella markeringen hänvisar till och som automatiskt skulle följa med vid en export (se avsnittet "Länkade poster"). Antalet motsvarar exakt det som anges i bekräftelsedialogen före en export.\n\nAlla tre uppgifterna uppdateras automatiskt när man byter flik samt vid varje ändring av markeringen eller posterna.

