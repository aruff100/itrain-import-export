help.settingsMenuText.de=**Voreinstellungen** öffnet ein Fenster mit drei Reitern.\n\n**Pfade:**\n- **Pfad für iTrain-Dateien** (Standardordner, der beim Öffnen/Speichern vorgeschlagen wird)\n- **Pfad für Exports** (Standardordner für CSV-Exporte/-Importe der Kategorie-Ansicht)\n- **Pfad für Backups** (ist er gesetzt, wird beim Öffnen einer Datei automatisch eine unveränderte Sicherheitskopie dort abgelegt)\n\nUnd das, bevor irgendetwas bearbeitet wird - bis zu 10 Generationen je Datei, danach wird die älteste überschrieben. Ungenutzte Backups werden beim Schließen/Ersetzen der Datei wieder gelöscht.\nFür alle drei Pfade lässt sich über "Durchsuchen..." ein Ordner wählen. Sind bei der allerersten Programmnutzung noch keine Pfade gesetzt, fragt das Programm einmalig danach.\n\n**Sprache:** wechselt die Oberflächensprache (mit Flagge) unter den 10 verfügbaren Sprachen - wirkt sofort auf das ganze Programm.\n\n**Ansicht:** Farbschema (hell/dunkel) sowie drei Kontrollkästchen, ob\n- die Typ-Spalte\n- die Auswahlbox-Spalte\n- Daten ändern\n\nin der Kategorie-Ansicht angezeigt werden (alle standardmäßig ausgeblendet, um die Ansicht übersichtlich zu halten).\nDazu kommt noch:\n- Beim Start automatisch nach Updates suchen
help.settingsMenuText.en=**Preferences** opens a window with three tabs.\n\n**Paths:**\n- **Path for iTrain Files** (default folder suggested when opening/saving)\n- **Path for Exports** (default folder for the CSV exports/imports of the category view)\n- **Path for Backups** (if set, an unmodified safety copy is placed there automatically whenever a file is opened)\n\nAnd that happens before anything is edited - up to 10 generations per file, after which the oldest one is overwritten. Unused backups are deleted again when the file is closed or replaced.\nFor all three paths a folder can be chosen via "Browse...". If no paths are set the very first time the program is used, it asks for them once.\n\n**Language:** switches the interface language (with flag) between the 10 available languages - takes effect immediately throughout the program.\n\n**View:** colour scheme (light/dark) plus three check boxes controlling whether\n- the type column\n- the selection check box column\n- change data\n\nare shown in the category view (all hidden by default, to keep the view uncluttered).\nIn addition:\n- Automatically check for updates on startup
help.settingsMenuText.nl=**Voorkeuren** opent een venster met drie tabbladen.\n\n**Paden:**\n- **Pad voor iTrain-bestanden** (standaardmap die bij openen/opslaan wordt voorgesteld)\n- **Pad voor exports** (standaardmap voor de CSV-exports/-imports van de categorieweergave)\n- **Pad voor back-ups** (als dit is ingesteld, wordt bij het openen van een bestand automatisch een ongewijzigde veiligheidskopie daar geplaatst)\n\nEn dat nog voordat er iets bewerkt wordt - tot 10 generaties per bestand, daarna wordt de oudste overschreven. Ongebruikte back-ups worden bij het sluiten/vervangen van het bestand weer verwijderd.\nVoor alle drie de paden kan via "Bladeren..." een map gekozen worden. Zijn bij het allereerste gebruik van het programma nog geen paden ingesteld, dan vraagt het programma er eenmalig naar.\n\n**Taal:** wisselt de taal van de gebruikersinterface (met vlag) tussen de 10 beschikbare talen - werkt onmiddellijk in het hele programma.\n\n**Weergave:** kleurenschema (licht/donker) en drie selectievakjes, of\n- de typekolom\n- de selectievakjeskolom\n- gegevens wijzigen\n\nin de categorieweergave getoond worden (standaard alle verborgen, om de weergave overzichtelijk te houden).\nDaar komt nog bij:\n- Bij het starten automatisch naar updates zoeken
help.settingsMenuText.fr=**Préférences** ouvre une fenêtre comportant trois onglets.\n\n**Chemins :**\n- **Chemin des fichiers iTrain** (dossier proposé par défaut à l'ouverture/l'enregistrement)\n- **Chemin des exports** (dossier par défaut des exports/imports CSV de la vue par catégorie)\n- **Chemin des sauvegardes** (s'il est renseigné, une copie de sécurité inchangée y est déposée automatiquement à l'ouverture d'un fichier)\n\nEt ce, avant toute modification - jusqu'à 10 générations par fichier, ensuite la plus ancienne est écrasée. Les sauvegardes inutilisées sont supprimées à la fermeture ou au remplacement du fichier.\nPour les trois chemins, un dossier peut être choisi via "Parcourir...". Si aucun chemin n'est défini lors de la toute première utilisation, le programme les demande une fois.\n\n**Langue :** change la langue de l'interface (avec drapeau) parmi les 10 langues disponibles - l'effet est immédiat dans tout le programme.\n\n**Affichage :** thème de couleurs (clair/sombre) ainsi que trois cases à cocher indiquant si\n- la colonne de type\n- la colonne de la case de sélection\n- modifier les données\n\nsont affichés dans la vue par catégorie (tous masqués par défaut, afin de garder la vue claire).\nS'y ajoute :\n- Rechercher automatiquement les mises à jour au démarrage
help.settingsMenuText.es=**Preferencias** abre una ventana con tres pestañas.\n\n**Rutas:**\n- **Ruta de archivos iTrain** (carpeta predeterminada que se propone al abrir/guardar)\n- **Ruta de exportaciones** (carpeta predeterminada para las exportaciones/importaciones CSV de la vista de categoría)\n- **Ruta de copias de seguridad** (si está definida, al abrir un archivo se deposita allí automáticamente una copia de seguridad sin modificar)\n\nY eso ocurre antes de editar nada - hasta 10 generaciones por archivo; después se sobrescribe la más antigua. Las copias de seguridad no utilizadas se eliminan de nuevo al cerrar o sustituir el archivo.\nPara las tres rutas puede elegirse una carpeta mediante "Examinar...". Si en el primerísimo uso del programa aún no hay rutas definidas, el programa las pide una sola vez.\n\n**Idioma:** cambia el idioma de la interfaz (con bandera) entre los 10 idiomas disponibles - surte efecto de inmediato en todo el programa.\n\n**Vista:** tema de color (claro/oscuro) y tres casillas de verificación que indican si\n- la columna de tipo\n- la columna de la casilla de selección\n- modificar datos\n\nse muestran en la vista de categoría (todas ocultas de forma predeterminada, para mantener la vista despejada).\nA esto se añade:\n- Buscar actualizaciones automáticamente al iniciar
help.settingsMenuText.it=**Preferenze** apre una finestra con tre schede.\n\n**Percorsi:**\n- **Percorso file iTrain** (cartella predefinita proposta all'apertura/al salvataggio)\n- **Percorso esportazioni** (cartella predefinita per le esportazioni/importazioni CSV della vista per categoria)\n- **Percorso backup** (se impostato, all'apertura di un file vi viene depositata automaticamente una copia di sicurezza non modificata)\n\nE questo prima che venga modificato qualsiasi cosa - fino a 10 generazioni per file, dopodiché la più vecchia viene sovrascritta. I backup non utilizzati vengono nuovamente eliminati alla chiusura o alla sostituzione del file.\nPer tutti e tre i percorsi è possibile scegliere una cartella tramite "Sfoglia...". Se al primissimo utilizzo del programma non è ancora impostato alcun percorso, il programma li chiede una sola volta.\n\n**Lingua:** cambia la lingua dell'interfaccia (con bandiera) tra le 10 lingue disponibili - ha effetto immediato su tutto il programma.\n\n**Visualizzazione:** tema di colori (chiaro/scuro) e tre caselle di controllo che stabiliscono se\n- la colonna del tipo\n- la colonna della casella di selezione\n- modifica dati\n\nvengono mostrate nella vista per categoria (tutte nascoste per impostazione predefinita, per mantenere la vista ordinata).\nA ciò si aggiunge:\n- Cerca automaticamente aggiornamenti all'avvio
help.settingsMenuText.pt=**Preferências** abre uma janela com três separadores.\n\n**Caminhos:**\n- **Caminho para ficheiros iTrain** (pasta predefinida proposta ao abrir/guardar)\n- **Caminho para exportações** (pasta predefinida para as exportações/importações CSV da vista de categoria)\n- **Caminho para cópias de segurança** (se estiver definido, ao abrir um ficheiro é aí colocada automaticamente uma cópia de segurança inalterada)\n\nE isso antes de ser editado o que quer que seja - até 10 gerações por ficheiro, sendo depois substituída a mais antiga. As cópias de segurança não utilizadas são novamente eliminadas ao fechar ou substituir o ficheiro.\nPara os três caminhos é possível escolher uma pasta através de "Procurar...". Se, na primeiríssima utilização do programa, ainda não houver caminhos definidos, o programa pergunta por eles uma única vez.\n\n**Idioma:** muda o idioma da interface (com bandeira) entre os 10 idiomas disponíveis - tem efeito imediato em todo o programa.\n\n**Vista:** esquema de cores (claro/escuro) e três caixas de verificação que determinam se\n- a coluna de tipo\n- a coluna da caixa de seleção\n- alterar dados\n\nsão apresentadas na vista de categoria (todas ocultas por predefinição, para manter a vista arrumada).\nA isto acresce ainda:\n- Verificar automaticamente se há atualizações ao iniciar
help.settingsMenuText.pl=**Preferencje** otwierają okno z trzema kartami.\n\n**Ścieżki:**\n- **Ścieżka do plików iTrain** (folder domyślnie proponowany przy otwieraniu/zapisywaniu)\n- **Ścieżka do eksportów** (folder domyślny dla eksportów/importów CSV widoku kategorii)\n- **Ścieżka do kopii zapasowych** (jeśli jest ustawiona, przy otwarciu pliku automatycznie umieszczana jest tam niezmieniona kopia bezpieczeństwa)\n\nI to zanim cokolwiek zostanie zmienione - do 10 generacji na plik, potem najstarsza jest nadpisywana. Niewykorzystane kopie zapasowe są ponownie usuwane przy zamknięciu lub zastąpieniu pliku.\nDla wszystkich trzech ścieżek folder można wybrać przyciskiem "Przeglądaj...". Jeśli przy pierwszym uruchomieniu programu nie ma jeszcze ustawionych ścieżek, program pyta o nie jednorazowo.\n\n**Język:** przełącza język interfejsu (z flagą) pomiędzy 10 dostępnymi językami - działa natychmiast w całym programie.\n\n**Widok:** motyw kolorystyczny (jasny/ciemny) oraz trzy pola wyboru określające, czy\n- kolumna typu\n- kolumna pola wyboru\n- zmiana danych\n\nsą wyświetlane w widoku kategorii (wszystkie domyślnie ukryte, aby zachować przejrzystość widoku).\nDo tego dochodzi jeszcze:\n- Automatycznie sprawdzaj dostępność aktualizacji przy uruchomieniu
help.settingsMenuText.da=**Præferencer** åbner et vindue med tre faner.\n\n**Stier:**\n- **Sti til iTrain-filer** (standardmappe, der foreslås ved åbning/lagring)\n- **Sti til eksporter** (standardmappe til kategorivisningens CSV-eksporter/-importer)\n- **Sti til sikkerhedskopier** (er den angivet, lægges der automatisk en uændret sikkerhedskopi der, når en fil åbnes)\n\nOg det, før der overhovedet redigeres noget - op til 10 generationer pr. fil, derefter overskrives den ældste. Ubrugte sikkerhedskopier slettes igen, når filen lukkes eller erstattes.\nFor alle tre stier kan der vælges en mappe via "Gennemse...". Er der ved allerførste brug af programmet endnu ikke angivet nogen stier, spørger programmet én gang efter dem.\n\n**Sprog:** skifter brugerfladens sprog (med flag) mellem de 10 tilgængelige sprog - virker straks i hele programmet.\n\n**Visning:** farveskema (lyst/mørkt) samt tre afkrydsningsfelter for, om\n- typekolonnen\n- valgbokskolonnen\n- rediger data\n\nvises i kategorivisningen (alle skjult som standard for at holde visningen overskuelig).\nDertil kommer:\n- Søg automatisk efter opdateringer ved start
help.settingsMenuText.sv=**Preferenser** öppnar ett fönster med tre flikar.\n\n**Sökvägar:**\n- **Sökväg för iTrain-filer** (standardmapp som föreslås vid öppning/sparande)\n- **Sökväg för exporter** (standardmapp för kategorivyns CSV-exporter/-importer)\n- **Sökväg för säkerhetskopior** (om den är angiven placeras automatiskt en oförändrad säkerhetskopia där när en fil öppnas)\n\nOch det innan något alls redigeras - upp till 10 generationer per fil, därefter skrivs den äldsta över. Oanvända säkerhetskopior tas bort igen när filen stängs eller ersätts.\nFör alla tre sökvägarna kan en mapp väljas via "Bläddra...". Om inga sökvägar är angivna allra första gången programmet används frågar programmet efter dem en gång.\n\n**Språk:** byter gränssnittets språk (med flagga) bland de 10 tillgängliga språken - får omedelbar effekt i hela programmet.\n\n**Visning:** färgschema (ljust/mörkt) samt tre kryssrutor för om\n- typkolumnen\n- markeringsrutekolumnen\n- ändra data\n\nska visas i kategorivyn (alla dolda som standard, för att hålla vyn överskådlig).\nTill detta kommer även:\n- Sök automatiskt efter uppdateringar vid start

