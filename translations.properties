help.introText.de=**iTrain Import/Export ist ein Werkzeug zum Betrachten und Bearbeiten von iTrain-Modellbahn-Steuerungsdateien (.tcd/.tcdz).**\nDer Hauptzweck ist der kategorienweise Import und Export einzelner Einträge zwischen bestehenden iTrain-Dateien - zum Beispiel um ein Gleisbild-Element, eine Aktion oder eine Lokomotive aus einer Datei in eine andere zu übernehmen.\nReferenzierte Einträge (z.B. die Rückmeldungen und Signale, die eine Aktion oder ein Gleisabschnitt verwendet) werden dabei automatisch erkannt und mit exportiert bzw. importiert, damit die Zieldatei in iTrain vollständig und ohne Fehlermeldung geöffnet werden kann.\n\nDer Export erfolgt als .csv-Datei. Eine solche, kommaseparierte Datei ist zwar in einer Tabellenkalkulation sichtbar und bearbeitbar. Das ist aber, aufgrund der vielen Referenzen, fast unmöglich und sollte nur von sehr erfahrenen Anwendern benutzt werden.\n\nDer **richtige** Weg ist:\n- Datei öffnen\n- Datensätze markieren (siehe unten)\n- Exportieren\n- Andere Datei öffnen\n- Den Export wieder importieren\n\nDabei werden alle Referenzen mit exportiert und auch wieder importiert.
help.introText.en=**iTrain Import/Export is a tool for viewing and editing iTrain model railway control files (.tcd/.tcdz).**\nIts main purpose is the category-by-category import and export of individual entries between existing iTrain files - for example to transfer a track diagram element, an action or a locomotive from one file into another.\nReferenced entries (e.g. the feedbacks and signals used by an action or a track section) are detected automatically and exported and imported along with it, so that the target file can be opened in iTrain completely and without an error message.\n\nThe export is written as a .csv file. Such a comma-separated file can of course be viewed and edited in a spreadsheet program. Because of the many references, however, this is almost impossible in practice and should only be attempted by very experienced users.\n\nThe **correct** way is:\n- Open the file\n- Select the records (see below)\n- Export\n- Open the other file\n- Import the export again\n\nAll references are exported and imported along with the selection.
help.introText.nl=**iTrain Import/Export is een hulpmiddel om iTrain-modelspoorbesturingsbestanden (.tcd/.tcdz) te bekijken en te bewerken.**\nHet hoofddoel is het per categorie importeren en exporteren van afzonderlijke items tussen bestaande iTrain-bestanden - bijvoorbeeld om een spoorplanelement, een actie of een locomotief uit het ene bestand in het andere over te nemen.\nItems waarnaar wordt verwezen (bijv. de terugmeldingen en seinen die een actie of een blok gebruikt) worden daarbij automatisch herkend en mee geëxporteerd respectievelijk geïmporteerd, zodat het doelbestand in iTrain volledig en zonder foutmelding geopend kan worden.\n\nDe export gebeurt als .csv-bestand. Zo'n door komma's gescheiden bestand is weliswaar zichtbaar en bewerkbaar in een spreadsheetprogramma. Door de vele verwijzingen is dat echter vrijwel onmogelijk en zou het alleen door zeer ervaren gebruikers gedaan moeten worden.\n\nDe **juiste** werkwijze is:\n- Bestand openen\n- Records selecteren (zie hieronder)\n- Exporteren\n- Ander bestand openen\n- De export weer importeren\n\nDaarbij worden alle verwijzingen mee geëxporteerd en ook weer geïmporteerd.
help.introText.fr=**iTrain Import/Export est un outil permettant de consulter et de modifier les fichiers de commande de réseau ferroviaire miniature d'iTrain (.tcd/.tcdz).**\nSon but principal est l'import et l'export, catégorie par catégorie, d'entrées individuelles entre des fichiers iTrain existants - par exemple pour reprendre un élément du plan de voies, une action ou une locomotive d'un fichier dans un autre.\nLes entrées référencées (p. ex. les rétrosignalisations et les signaux utilisés par une action ou par un canton) sont détectées automatiquement et exportées puis importées avec elles, afin que le fichier cible puisse être ouvert dans iTrain de manière complète et sans message d'erreur.\n\nL'export se fait sous forme de fichier .csv. Un tel fichier séparé par des virgules peut certes être consulté et modifié dans un tableur. En raison du grand nombre de références, cela est toutefois quasiment impossible et ne devrait être tenté que par des utilisateurs très expérimentés.\n\nLa **bonne** manière de procéder est :\n- Ouvrir le fichier\n- Sélectionner les enregistrements (voir ci-dessous)\n- Exporter\n- Ouvrir l'autre fichier\n- Réimporter l'export\n\nToutes les références sont alors exportées puis réimportées avec la sélection.
help.introText.es=**iTrain Import/Export es una herramienta para ver y editar archivos de control de maquetas de tren de iTrain (.tcd/.tcdz).**\nSu finalidad principal es la importación y exportación, categoría por categoría, de entradas individuales entre archivos iTrain existentes - por ejemplo, para llevar un elemento del esquema de vías, una acción o una locomotora de un archivo a otro.\nLas entradas referenciadas (p. ej. las retroseñalizaciones y las señales que utiliza una acción o un tramo de vía) se detectan automáticamente y se exportan e importan junto con ellas, de modo que el archivo de destino pueda abrirse en iTrain de forma completa y sin mensajes de error.\n\nLa exportación se realiza como archivo .csv. Un archivo así, separado por comas, puede verse y editarse en una hoja de cálculo. Sin embargo, debido a la gran cantidad de referencias, eso resulta casi imposible y solo deberían hacerlo usuarios muy experimentados.\n\nLa forma **correcta** de proceder es:\n- Abrir el archivo\n- Marcar los registros (véase más abajo)\n- Exportar\n- Abrir el otro archivo\n- Volver a importar la exportación\n\nDe este modo todas las referencias se exportan y se vuelven a importar.
help.introText.it=**iTrain Import/Export è uno strumento per visualizzare e modificare i file di controllo per modellismo ferroviario di iTrain (.tcd/.tcdz).**\nLo scopo principale è l'importazione e l'esportazione, categoria per categoria, di singole voci tra file iTrain esistenti - ad esempio per trasferire un elemento dello schema dei binari, un'azione o una locomotiva da un file a un altro.\nLe voci referenziate (ad es. i sensori di retroazione e i segnali usati da un'azione o da una sezione di binario) vengono riconosciute automaticamente ed esportate e importate insieme ad esse, in modo che il file di destinazione possa essere aperto in iTrain in modo completo e senza messaggi di errore.\n\nL'esportazione avviene come file .csv. Un file di questo tipo, separato da virgole, è certamente visualizzabile e modificabile in un foglio di calcolo. A causa dei numerosi riferimenti ciò è però quasi impossibile e dovrebbe essere fatto solo da utenti molto esperti.\n\nIl modo **corretto** di procedere è:\n- Aprire il file\n- Selezionare i record (vedi sotto)\n- Esportare\n- Aprire l'altro file\n- Importare di nuovo l'esportazione\n\nIn questo modo tutti i riferimenti vengono esportati e anche reimportati.
help.introText.pt=**iTrain Import/Export é uma ferramenta para ver e editar ficheiros de comando de modelismo ferroviário do iTrain (.tcd/.tcdz).**\nO objetivo principal é a importação e exportação, categoria a categoria, de entradas individuais entre ficheiros iTrain existentes - por exemplo, para transferir um elemento do diagrama de via, uma ação ou uma locomotiva de um ficheiro para outro.\nAs entradas referenciadas (p. ex. as retrossinalizações e os sinais utilizados por uma ação ou por um troço de via) são reconhecidas automaticamente e exportadas e importadas em conjunto, para que o ficheiro de destino possa ser aberto no iTrain de forma completa e sem mensagens de erro.\n\nA exportação é feita como ficheiro .csv. Um ficheiro deste tipo, separado por vírgulas, pode ser visto e editado numa folha de cálculo. Devido à grande quantidade de referências isso é, no entanto, quase impossível e só deveria ser feito por utilizadores muito experientes.\n\nA forma **correta** de proceder é:\n- Abrir o ficheiro\n- Marcar os registos (ver abaixo)\n- Exportar\n- Abrir o outro ficheiro\n- Voltar a importar a exportação\n\nDeste modo todas as referências são exportadas e novamente importadas.
help.introText.pl=**iTrain Import/Export to narzędzie do przeglądania i edytowania plików sterowania kolejką modelarską programu iTrain (.tcd/.tcdz).**\nGłównym celem jest import i eksport pojedynczych wpisów - kategoria po kategorii - pomiędzy istniejącymi plikami iTrain, na przykład aby przenieść element planu torów, akcję lub lokomotywę z jednego pliku do drugiego.\nWpisy, do których istnieją odwołania (np. czujniki zwrotne i semafory używane przez akcję lub odcinek toru), są przy tym rozpoznawane automatycznie i eksportowane oraz importowane razem z nimi, dzięki czemu plik docelowy da się otworzyć w iTrain w komplecie i bez komunikatu o błędzie.\n\nEksport odbywa się w postaci pliku .csv. Taki plik z wartościami rozdzielonymi przecinkami można wprawdzie obejrzeć i edytować w arkuszu kalkulacyjnym. Ze względu na dużą liczbę odwołań jest to jednak niemal niemożliwe i powinni to robić wyłącznie bardzo doświadczeni użytkownicy.\n\n**Właściwa** droga jest następująca:\n- Otworzyć plik\n- Zaznaczyć rekordy (patrz niżej)\n- Wyeksportować\n- Otworzyć drugi plik\n- Ponownie zaimportować eksport\n\nWszystkie odwołania są przy tym eksportowane i ponownie importowane.
help.introText.da=**iTrain Import/Export er et værktøj til at se og redigere iTrains styringsfiler til modeljernbaner (.tcd/.tcdz).**\nHovedformålet er import og eksport af enkelte poster kategori for kategori mellem eksisterende iTrain-filer - for eksempel for at overføre et sporplanelement, en handling eller et lokomotiv fra én fil til en anden.\nPoster, der henvises til (f.eks. de tilbagemeldinger og signaler, som en handling eller en sporsektion bruger), genkendes automatisk og eksporteres og importeres med, så målfilen kan åbnes komplet og uden fejlmeddelelse i iTrain.\n\nEksporten sker som .csv-fil. En sådan kommasepareret fil kan ganske vist ses og redigeres i et regneark. På grund af de mange henvisninger er det dog næsten umuligt og bør kun gøres af meget erfarne brugere.\n\nDen **rigtige** fremgangsmåde er:\n- Åbn filen\n- Markér posterne (se nedenfor)\n- Eksportér\n- Åbn den anden fil\n- Importér eksporten igen\n\nDerved bliver alle henvisninger eksporteret og også importeret igen.
help.introText.sv=**iTrain Import/Export är ett verktyg för att visa och redigera iTrains styrfiler för modelljärnväg (.tcd/.tcdz).**\nHuvudsyftet är import och export av enskilda poster kategori för kategori mellan befintliga iTrain-filer - till exempel för att föra över ett spårplanselement, en åtgärd eller ett lok från en fil till en annan.\nPoster som det hänvisas till (t.ex. de återkopplingar och signaler som en åtgärd eller ett spåravsnitt använder) känns automatiskt igen och exporteras respektive importeras med, så att målfilen kan öppnas fullständigt och utan felmeddelande i iTrain.\n\nExporten sker som .csv-fil. En sådan kommaseparerad fil går visserligen att se och redigera i ett kalkylprogram. På grund av de många hänvisningarna är det dock nästan omöjligt och bör bara göras av mycket erfarna användare.\n\nDet **rätta** tillvägagångssättet är:\n- Öppna filen\n- Markera posterna (se nedan)\n- Exportera\n- Öppna den andra filen\n- Importera exporten igen\n\nDärvid exporteras och importeras alla hänvisningar med.

