help.categoryViewText.de=Jeder Reiter zeigt eine der iTrain-Kategorien (z.B. Rückmeldungen, Blöcke, Aktionen).\n- **Markierte exportieren** speichert die ausgewählten Einträge als CSV-Datei, inklusive automatisch erkannter, referenzierter Einträge aus anderen Kategorien (siehe nächster Abschnitt zur "~"-Kennzeichnung).\n- **Importieren** liest eine solche CSV-Datei wieder ein und verteilt jede Zeile automatisch in ihre passende Kategorie.\n- Ein **Rechtsklick** auf eine Zeile öffnet das Menü mit **Bearbeiten...** (Name und Beschreibung des Eintrags ändern, Eingabetaste bestätigt) und **Export...**. Wird ein Eintrag umbenannt, auf den andere Einträge verweisen, fragt das Programm, ob diese Verweise mit umbenannt werden sollen - ohne das könnte iTrain die Datei danach nicht mehr öffnen.\n- Ein neuer Eintrag wird über das **"+"**-Symbol angelegt.\n- Löschen über das rote **"X"** - beide rechts über der Tabelle.
help.categoryViewText.en=Each tab shows one of the iTrain categories (e.g. feedbacks, blocks, actions).\n- **Export Selected** saves the selected entries as a CSV file, including automatically detected referenced entries from other categories (see the next section on the "~" marking).\n- **Import...** reads such a CSV file back in and distributes every row automatically into its matching category.\n- A **right click** on a row opens the menu with **Edit...** (change the name and description of the entry, Enter confirms) and **Export...**. If an entry is renamed that other entries refer to, the program asks whether those references should be renamed as well - without that iTrain might no longer be able to open the file.\n- A new entry is created with the **"+"** symbol.\n- Deleting is done with the red **"X"** - both are located above the table on the right.
help.categoryViewText.nl=Elk tabblad toont een van de iTrain-categorieën (bijv. terugmeldingen, blokken, acties).\n- **Selectie exporteren** slaat de geselecteerde items op als CSV-bestand, inclusief automatisch herkende items uit andere categorieën waarnaar verwezen wordt (zie het volgende hoofdstuk over de "~"-aanduiding).\n- **Importeren...** leest zo'n CSV-bestand weer in en verdeelt elke regel automatisch over de bijbehorende categorie.\n- Een **rechtsklik** op een rij opent het menu met **Bewerken...** (naam en omschrijving van het item wijzigen, Enter bevestigt) en **Exporteren...**. Wordt een item hernoemd waarnaar andere items verwijzen, dan vraagt het programma of die verwijzingen mee moeten worden hernoemd - zonder dat zou iTrain het bestand daarna mogelijk niet meer kunnen openen.\n- Een nieuw item wordt aangemaakt via het **"+"**-symbool.\n- Verwijderen gaat via de rode **"X"** - beide rechts boven de tabel.
help.categoryViewText.fr=Chaque onglet affiche l'une des catégories iTrain (p. ex. rétrosignalisations, cantons, actions).\n- **Exporter la sélection** enregistre les entrées sélectionnées dans un fichier CSV, y compris les entrées référencées d'autres catégories détectées automatiquement (voir la section suivante sur le marquage "~").\n- **Importer...** relit un tel fichier CSV et répartit automatiquement chaque ligne dans la catégorie qui lui correspond.\n- Un **clic droit** sur une ligne ouvre le menu avec **Modifier...** (changer le nom et la description de l'entrée, Entrée valide) et **Exporter...**. Si une entrée référencée par d'autres entrées est renommée, le programme demande si ces références doivent également être renommées - sans cela, iTrain risquerait de ne plus pouvoir ouvrir le fichier.\n- Une nouvelle entrée se crée via le symbole **"+"**.\n- La suppression se fait via le **"X"** rouge - les deux se trouvent en haut à droite du tableau.
help.categoryViewText.es=Cada pestaña muestra una de las categorías de iTrain (p. ej. retroseñalizaciones, bloques, acciones).\n- **Exportar selección** guarda las entradas seleccionadas como archivo CSV, incluidas las entradas referenciadas de otras categorías detectadas automáticamente (véase el apartado siguiente sobre el marcado "~").\n- **Importar...** vuelve a leer un archivo CSV de ese tipo y reparte cada línea automáticamente en la categoría que le corresponde.\n- Un **clic derecho** sobre una fila abre el menú con **Editar...** (cambiar el nombre y la descripción de la entrada; Intro confirma) y **Exportar...**. Si se renombra una entrada a la que hacen referencia otras, el programa pregunta si esas referencias deben renombrarse también; sin ello, iTrain podría no poder abrir el archivo después.\n- Una entrada nueva se crea con el símbolo **"+"**.\n- Se elimina con la **"X"** roja - ambos se encuentran arriba a la derecha de la tabla.
help.categoryViewText.it=Ogni scheda mostra una delle categorie di iTrain (ad es. sensori di retroazione, blocchi, azioni).\n- **Esporta selezionati** salva le voci selezionate come file CSV, comprese le voci referenziate di altre categorie riconosciute automaticamente (vedi la sezione seguente sul contrassegno "~").\n- **Importa...** rilegge un file CSV di questo tipo e distribuisce ogni riga automaticamente nella categoria corrispondente.\n- Un **clic destro** su una riga apre il menu con **Modifica...** (cambiare nome e descrizione della voce, Invio conferma) ed **Esporta...**. Se viene rinominata una voce a cui altre voci fanno riferimento, il programma chiede se rinominare anche quei riferimenti: senza, iTrain potrebbe non riuscire più ad aprire il file.\n- Una nuova voce si crea con il simbolo **"+"**.\n- L'eliminazione avviene con la **"X"** rossa - entrambi si trovano in alto a destra sopra la tabella.
help.categoryViewText.pt=Cada separador mostra uma das categorias do iTrain (p. ex. retrossinalizações, blocos, ações).\n- **Exportar Selecionados** guarda as entradas selecionadas como ficheiro CSV, incluindo as entradas referenciadas de outras categorias reconhecidas automaticamente (ver a secção seguinte sobre a identificação "~").\n- **Importar...** volta a ler um ficheiro CSV desse tipo e distribui cada linha automaticamente pela categoria correspondente.\n- Um **clique com o botão direito** numa linha abre o menu com **Editar...** (alterar o nome e a descrição da entrada; Enter confirma) e **Exportar...**. Se for renomeada uma entrada referenciada por outras, o programa pergunta se essas referências devem ser renomeadas também - sem isso, o iTrain poderá deixar de conseguir abrir o ficheiro.\n- Uma nova entrada é criada através do símbolo **"+"**.\n- A eliminação faz-se através do **"X"** vermelho - ambos se encontram por cima da tabela, à direita.
help.categoryViewText.pl=Każda karta pokazuje jedną z kategorii iTrain (np. czujniki zwrotne, bloki, akcje).\n- **Eksportuj Zaznaczone** zapisuje wybrane wpisy jako plik CSV, wraz z automatycznie rozpoznanymi wpisami z innych kategorii, do których istnieją odwołania (patrz następny rozdział o oznaczeniu "~").\n- **Importuj...** wczytuje taki plik CSV z powrotem i automatycznie rozdziela każdy wiersz do pasującej mu kategorii.\n- **Kliknięcie prawym przyciskiem** na wierszu otwiera menu z pozycjami **Edytuj...** (zmiana nazwy i opisu wpisu, Enter zatwierdza) oraz **Eksportuj...**. Jeśli zmieniana jest nazwa wpisu, do którego odwołują się inne wpisy, program pyta, czy zmienić także te odwołania - bez tego iTrain mógłby nie otworzyć już pliku.\n- Nowy wpis tworzy się symbolem **"+"**.\n- Usuwanie odbywa się czerwonym **"X"** - oba znajdują się po prawej stronie nad tabelą.
help.categoryViewText.da=Hver fane viser en af iTrain-kategorierne (f.eks. tilbagemeldinger, blokke, handlinger).\n- **Eksportér Markerede** gemmer de valgte poster som CSV-fil, inklusive automatisk genkendte poster fra andre kategorier, som der henvises til (se næste afsnit om "~"-markeringen).\n- **Importér...** indlæser en sådan CSV-fil igen og fordeler hver linje automatisk til den kategori, den hører til.\n- Et **højreklik** på en række åbner menuen med **Rediger...** (ændr postens navn og beskrivelse, Enter bekræfter) og **Eksportér...**. Omdøbes en post, som andre poster henviser til, spørger programmet, om disse henvisninger skal omdøbes med - uden det kunne iTrain muligvis ikke åbne filen bagefter.\n- En ny post oprettes med **"+"**-symbolet.\n- Sletning sker med det røde **"X"** - begge findes til højre over tabellen.
help.categoryViewText.sv=Varje flik visar en av iTrain-kategorierna (t.ex. återkopplingar, block, åtgärder).\n- **Exportera Markerade** sparar de valda posterna som CSV-fil, inklusive automatiskt igenkända poster från andra kategorier som det hänvisas till (se nästa avsnitt om "~"-märkningen).\n- **Importera...** läser in en sådan CSV-fil igen och fördelar varje rad automatiskt till den kategori den hör till.\n- Ett **högerklick** på en rad öppnar menyn med **Redigera...** (ändra postens namn och beskrivning, Retur bekräftar) och **Exportera...**. Byter man namn på en post som andra poster hänvisar till frågar programmet om även dessa referenser ska byta namn - utan det skulle iTrain kanske inte längre kunna öppna filen.\n- En ny post skapas via symbolen **"+"**.\n- Borttagning sker via det röda **"X"** - båda finns till höger ovanför tabellen.

