help.fileMenuText.de=**Öffnen...** lädt eine bestehende .tcd- oder .tcdz-Datei.\n**Speichern unter...** speichert die aktuell geladene Datei unter einem neuen Namen bzw. Ort - bei .tcdz wird das Archiv dabei automatisch neu erzeugt.\n**Zuletzt verwendete öffnen** listet die letzten 5 geöffneten Dateien zum schnellen erneuten Öffnen auf (die älteste wird verdrängt, sobald eine 6. hinzukommt).\n**Backup laden...** öffnet den Datei-Dialog direkt im eingestellten Backup-Ordner (siehe Einstellungen → Pfade), um eine automatisch angelegte Sicherheitskopie wieder zu laden.\n**Export Dateien** öffnet eine zuvor exportierte CSV-Datei aus dem Export-Ordner und importiert deren Einträge in das aktuell geöffnete Dokument - das entspricht dem Button "Importieren" in der Kategorie-Ansicht, nur ohne dass zuerst zu einem bestimmten Reiter gewechselt werden muss.
help.fileMenuText.en=**Open...** loads an existing .tcd or .tcdz file.\n**Save as...** saves the currently loaded file under a new name or location - for .tcdz the archive is recreated automatically.\n**Open Recent Files** lists the last 5 files opened, so they can be reopened quickly (the oldest one drops off as soon as a 6th is added).\n**Load Backup...** opens the file dialog directly in the configured backup folder (see Settings → Paths) in order to reload an automatically created safety copy.\n**Export Files** opens a previously exported CSV file from the export folder and imports its entries into the currently open document - this is the same as the "Import..." button in the category view, only without having to switch to a particular tab first.
help.fileMenuText.nl=**Openen...** laadt een bestaand .tcd- of .tcdz-bestand.\n**Opslaan als...** slaat het geladen bestand onder een nieuwe naam of locatie op - bij .tcdz wordt het archief daarbij automatisch opnieuw aangemaakt.\n**Recent gebruikte openen** toont de laatste 5 geopende bestanden om ze snel opnieuw te openen (het oudste verdwijnt zodra er een 6e bij komt).\n**Back-up laden...** opent het bestandsvenster direct in de ingestelde back-upmap (zie Instellingen → Paden) om een automatisch aangemaakte veiligheidskopie weer te laden.\n**Exportbestanden** opent een eerder geëxporteerd CSV-bestand uit de exportmap en importeert de items daarvan in het momenteel geopende document - dat komt overeen met de knop "Importeren..." in de categorieweergave, alleen zonder dat eerst naar een bepaald tabblad gewisseld moet worden.
help.fileMenuText.fr=**Ouvrir...** charge un fichier .tcd ou .tcdz existant.\n**Enregistrer sous...** enregistre le fichier chargé sous un nouveau nom ou à un nouvel emplacement - pour un .tcdz, l'archive est automatiquement recréée.\n**Ouvrir les fichiers récents** liste les 5 derniers fichiers ouverts afin de les rouvrir rapidement (le plus ancien disparaît dès qu'un 6e s'ajoute).\n**Charger une sauvegarde...** ouvre la boîte de dialogue directement dans le dossier de sauvegarde configuré (voir Paramètres → Chemins) afin de recharger une copie de sécurité créée automatiquement.\n**Fichiers exportés** ouvre un fichier CSV précédemment exporté depuis le dossier d'export et importe ses entrées dans le document actuellement ouvert - cela correspond au bouton "Importer..." de la vue par catégorie, mais sans devoir d'abord basculer vers un onglet particulier.
help.fileMenuText.es=**Abrir...** carga un archivo .tcd o .tcdz existente.\n**Guardar como...** guarda el archivo cargado con un nombre o en una ubicación nuevos - en el caso de .tcdz, el archivo comprimido se vuelve a generar automáticamente.\n**Abrir usados recientemente** muestra los últimos 5 archivos abiertos para volver a abrirlos rápidamente (el más antiguo desaparece en cuanto se añade un 6º).\n**Cargar copia de seguridad...** abre el diálogo de archivos directamente en la carpeta de copias de seguridad configurada (véase Ajustes → Rutas) para volver a cargar una copia creada automáticamente.\n**Archivos exportados** abre un archivo CSV exportado previamente desde la carpeta de exportación e importa sus entradas en el documento abierto actualmente - equivale al botón "Importar..." de la vista de categoría, solo que sin tener que cambiar antes a una pestaña concreta.
help.fileMenuText.it=**Apri...** carica un file .tcd o .tcdz esistente.\n**Salva con nome...** salva il file caricato con un nuovo nome o in una nuova posizione - per i .tcdz l'archivio viene ricreato automaticamente.\n**Apri utilizzati di recente** elenca gli ultimi 5 file aperti per riaprirli rapidamente (il più vecchio viene eliminato non appena se ne aggiunge un 6°).\n**Carica backup...** apre la finestra dei file direttamente nella cartella di backup impostata (vedi Impostazioni → Percorsi) per ricaricare una copia di sicurezza creata automaticamente.\n**File esportati** apre un file CSV esportato in precedenza dalla cartella di esportazione e ne importa le voci nel documento attualmente aperto - equivale al pulsante "Importa..." della vista per categoria, solo senza dover passare prima a una determinata scheda.
help.fileMenuText.pt=**Abrir...** carrega um ficheiro .tcd ou .tcdz existente.\n**Guardar como...** guarda o ficheiro carregado com um novo nome ou noutra localização - no caso de .tcdz o arquivo é recriado automaticamente.\n**Abrir ficheiros recentes** lista os últimos 5 ficheiros abertos, para os reabrir rapidamente (o mais antigo desaparece assim que é acrescentado um 6.º).\n**Carregar cópia de segurança...** abre a caixa de diálogo diretamente na pasta de cópias de segurança configurada (ver Definições → Caminhos), para voltar a carregar uma cópia criada automaticamente.\n**Ficheiros de exportação** abre um ficheiro CSV exportado anteriormente a partir da pasta de exportação e importa as suas entradas para o documento atualmente aberto - corresponde ao botão "Importar..." da vista de categoria, só que sem ser preciso mudar primeiro para um separador específico.
help.fileMenuText.pl=**Otwórz...** wczytuje istniejący plik .tcd lub .tcdz.\n**Zapisz jako...** zapisuje wczytany plik pod nową nazwą lub w nowym miejscu - w przypadku .tcdz archiwum jest przy tym tworzone na nowo automatycznie.\n**Otwórz ostatnio używane** wyświetla 5 ostatnio otwartych plików, aby szybko otworzyć je ponownie (najstarszy wypada, gdy tylko dojdzie 6.).\n**Wczytaj kopię zapasową...** otwiera okno wyboru plików bezpośrednio w ustawionym folderze kopii zapasowych (patrz Ustawienia → Ścieżki), aby ponownie wczytać automatycznie utworzoną kopię bezpieczeństwa.\n**Pliki eksportu** otwiera wcześniej wyeksportowany plik CSV z folderu eksportu i importuje jego wpisy do aktualnie otwartego dokumentu - odpowiada to przyciskowi "Importuj..." w widoku kategorii, tylko bez konieczności przechodzenia najpierw na określoną kartę.
help.fileMenuText.da=**Åbn...** indlæser en eksisterende .tcd- eller .tcdz-fil.\n**Gem som...** gemmer den indlæste fil under et nyt navn eller sted - ved .tcdz oprettes arkivet automatisk på ny.\n**Åbn senest brugte** viser de sidste 5 åbnede filer, så de hurtigt kan åbnes igen (den ældste falder fra, så snart en 6. kommer til).\n**Indlæs sikkerhedskopi...** åbner fildialogen direkte i den indstillede mappe til sikkerhedskopier (se Indstillinger → Stier) for at indlæse en automatisk oprettet sikkerhedskopi igen.\n**Eksportfiler** åbner en tidligere eksporteret CSV-fil fra eksportmappen og importerer dens poster i det aktuelt åbne dokument - det svarer til knappen "Importér..." i kategorivisningen, blot uden at man først skal skifte til en bestemt fane.
help.fileMenuText.sv=**Öppna...** läser in en befintlig .tcd- eller .tcdz-fil.\n**Spara som...** sparar den inlästa filen under ett nytt namn eller på en ny plats - vid .tcdz skapas arkivet automatiskt på nytt.\n**Öppna senast använda** listar de 5 senast öppnade filerna så att de snabbt kan öppnas igen (den äldsta faller bort så snart en 6:e tillkommer).\n**Läs in säkerhetskopia...** öppnar fildialogen direkt i den inställda mappen för säkerhetskopior (se Inställningar → Sökvägar) för att läsa in en automatiskt skapad säkerhetskopia igen.\n**Exportfiler** öppnar en tidigare exporterad CSV-fil från exportmappen och importerar dess poster till det för närvarande öppna dokumentet - det motsvarar knappen "Importera..." i kategorivyn, fast utan att man först behöver byta till en viss flik.

