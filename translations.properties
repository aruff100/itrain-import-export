help.helpMenuText.de=**Hilfe** zeigt diesen Text.\n**Update** prüft manuell auf neue Programmversionen (siehe Abschnitt "Update" unten).\n**Über** zeigt Programmname, Autor und die aktuelle Versions-/Build-Nummer.
help.helpMenuText.en=**Help** shows this text.\n**Update** checks manually for new program versions (see the "Update" section below).\n**About** shows the program name, the author and the current version/build number.
help.helpMenuText.nl=**Help** toont deze tekst.\n**Update** controleert handmatig op nieuwe programmaversies (zie het hoofdstuk "Update" hieronder).\n**Over** toont de programmanaam, de auteur en het huidige versie-/buildnummer.
help.helpMenuText.fr=**Aide** affiche ce texte.\n**Mise à jour** recherche manuellement de nouvelles versions du programme (voir la section "Mise à jour" ci-dessous).\n**À propos** affiche le nom du programme, l'auteur ainsi que le numéro de version/de build actuel.
help.helpMenuText.es=**Ayuda** muestra este texto.\n**Actualización** comprueba manualmente si hay nuevas versiones del programa (véase el apartado "Actualización" más abajo).\n**Acerca de** muestra el nombre del programa, el autor y el número de versión/compilación actual.
help.helpMenuText.it=**Guida** mostra questo testo.\n**Aggiornamento** verifica manualmente la presenza di nuove versioni del programma (vedi la sezione "Aggiornamento" più sotto).\n**Informazioni** mostra il nome del programma, l'autore e il numero di versione/build attuale.
help.helpMenuText.pt=**Ajuda** mostra este texto.\n**Atualização** verifica manualmente se existem novas versões do programa (ver a secção "Atualização" mais abaixo).\n**Sobre** mostra o nome do programa, o autor e o número de versão/compilação atual.
help.helpMenuText.pl=**Pomoc** wyświetla ten tekst.\n**Aktualizacja** ręcznie sprawdza dostępność nowych wersji programu (patrz rozdział "Aktualizacja" poniżej).\n**O programie** pokazuje nazwę programu, autora oraz aktualny numer wersji/kompilacji.
help.helpMenuText.da=**Hjælp** viser denne tekst.\n**Opdatering** søger manuelt efter nye programversioner (se afsnittet "Opdatering" nedenfor).\n**Om** viser programnavn, forfatter og det aktuelle versions-/buildnummer.
help.helpMenuText.sv=**Hjälp** visar den här texten.\n**Uppdatering** söker manuellt efter nya programversioner (se avsnittet "Uppdatering" nedan).\n**Om** visar programnamn, upphovsman samt aktuellt versions-/buildnummer.

