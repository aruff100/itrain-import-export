help.editMenuText.de=**Rückgängig** macht die letzte Änderung an den Daten rückgängig (Eintrag hinzugefügt/gelöscht, Attribut/Text geändert, Import...).\n**Wiederholen** stellt eine so rückgängig gemachte Änderung wieder her.\nBeides funktioniert auch über die beiden Symbole im Ribbon. Der Verlauf wird beim Öffnen einer neuen Datei geleert.
help.editMenuText.en=**Undo** reverts the last change made to the data (entry added/deleted, attribute/text changed, import...).\n**Redo** restores a change that was undone in this way.\nBoth are also available through the two icons in the ribbon. The history is cleared whenever a new file is opened.
help.editMenuText.nl=**Ongedaan maken** maakt de laatste wijziging aan de gegevens ongedaan (item toegevoegd/verwijderd, attribuut/tekst gewijzigd, import...).\n**Opnieuw** herstelt een zo ongedaan gemaakte wijziging.\nBeide werken ook via de twee symbolen in het lint. De geschiedenis wordt gewist zodra een nieuw bestand geopend wordt.
help.editMenuText.fr=**Annuler** annule la dernière modification apportée aux données (entrée ajoutée/supprimée, attribut/texte modifié, import...).\n**Rétablir** restaure une modification ainsi annulée.\nLes deux fonctionnent également via les deux icônes du ruban. L'historique est vidé à l'ouverture d'un nouveau fichier.
help.editMenuText.es=**Deshacer** deshace el último cambio en los datos (entrada añadida/eliminada, atributo/texto modificado, importación...).\n**Rehacer** restablece un cambio deshecho de ese modo.\nAmbas funciones están también disponibles en los dos símbolos de la cinta. El historial se vacía al abrir un archivo nuevo.
help.editMenuText.it=**Annulla** annulla l'ultima modifica ai dati (voce aggiunta/eliminata, attributo/testo modificato, importazione...).\n**Ripeti** ripristina una modifica annullata in questo modo.\nEntrambi funzionano anche tramite i due simboli nella barra multifunzione. La cronologia viene svuotata all'apertura di un nuovo file.
help.editMenuText.pt=**Desfazer** anula a última alteração aos dados (entrada adicionada/eliminada, atributo/texto alterado, importação...).\n**Refazer** repõe uma alteração assim anulada.\nAmbos funcionam também através dos dois símbolos no friso. O histórico é limpo sempre que é aberto um novo ficheiro.
help.editMenuText.pl=**Cofnij** cofa ostatnią zmianę danych (dodanie/usunięcie wpisu, zmiana atrybutu/tekstu, import...).\n**Ponów** przywraca tak cofniętą zmianę.\nObie funkcje działają również poprzez dwie ikony na wstążce. Historia jest czyszczona przy otwarciu nowego pliku.
help.editMenuText.da=**Fortryd** fortryder den seneste ændring af dataene (post tilføjet/slettet, attribut/tekst ændret, import...).\n**Gentag** genskaber en ændring, der er fortrudt på den måde.\nBegge dele fungerer også via de to symboler på båndet. Historikken ryddes, når en ny fil åbnes.
help.editMenuText.sv=**Ångra** ångrar den senaste ändringen av data (post tillagd/borttagen, attribut/text ändrad, import...).\n**Gör om** återställer en ändring som ångrats på det sättet.\nBåda fungerar även via de två symbolerna i menyfliksområdet. Historiken töms när en ny fil öppnas.

