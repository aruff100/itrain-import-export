help.decoderText.de=In den Reitern **Lokomotiven** und **Wagen** beschreibt der Unterbereich **configuration** im Daten-Explorer den eingebauten Decoder: seine CV-Werte samt Beschreibungen. Weil diese Angaben je Decoder-Typ gleich sind, lassen sie sich als **Vorlage** speichern und in andere Fahrzeuge übernehmen. Dafür gibt es im **Decoder-Fenster** (Knopf **Decoder** rechts im Ribbon des Hauptfensters) zwei Schaltflächen in der Werkzeugleiste:\n\n- **Decoder exportieren** speichert den configuration-Bereich des markierten Fahrzeugs als Vorlage im Ordner für Decoder-Vorlagen. Abgefragt werden eine Bezeichnung (sie erscheint später in der Auswahl) und wahlweise eine Beschreibung.\n- **Decoder importieren** übernimmt eine Vorlage in das markierte Fahrzeug. Es öffnet sich eine Liste aller installierten Vorlagen mit Suchfeld; ein Tastendruck springt zur ersten Vorlage mit diesem Anfangsbuchstaben, und über die Spaltenköpfe lässt sich umsortieren. Mit **Datei wählen...** kann stattdessen eine beliebige Vorlagen-Datei von der Festplatte geladen werden.\n\nEs muss dabei immer **genau ein** Fahrzeug markiert sein, denn eine Decoder-Konfiguration gehört zu genau einem Fahrzeug.\n\n**Eine iTrain-Datei für alle Programmteile:** Das Decoder-Fenster arbeitet auf derselben iTrain-Datei wie das Hauptfenster und das Systeme-Fenster. Egal in welchem Programmteil eine .tcdz/.tcd geladen wird - sie gilt bis zum Beenden des Programms (oder bis eine andere geladen wird) in allen Teilen. Im Ribbon und im Menü **Datei** des Decoder-Fensters stehen dafür zwei Knöpfe:\n- **iTrain-Datei laden** lädt eine Datei; sie erscheint sofort auch im Hauptfenster und im Systeme-Fenster.\n- **In iTrain-Datei schreiben** speichert alle Änderungen nach einer Rückfrage direkt in die geladene Datei. Vorher legt das Programm eine Sicherung im Sicherungsordner an. iTrain sollte die Datei dabei nicht geöffnet haben.\n\n**Spalten Decoder und Decoder-Vorlage:** In den Reitern Lokomotiven und Wagen zeigen zwei zusätzliche Spalten, welcher Decoder eingetragen ist und welche Vorlage dazu passt. Die Vorlage wird an den CV-Nummern der vorhandenen Konfiguration erkannt. Passt keine installierte Vorlage, steht dort **eigene (n CVs)**; ohne Konfiguration bleibt die Spalte leer.\n\n**Sprung zur Konfiguration:** Nach dem Laden ist im Decoder-Fenster das erste Fahrzeug markiert, und im Daten-Explorer steht sein Knoten **configuration** hervorgehoben im Fokus - ebenso bei jedem Wechsel auf ein anderes Fahrzeug. **Decoder-CVs bearbeiten** öffnet die Werte dann direkt.\n\n**Vorlage im Bearbeitungsfenster zuordnen:** Ein Doppelklick oder Rechtsklick auf eine Zeile öffnet das Bearbeitungsfenster. Die Zeile **Decoder-Vorlage** zeigt die derzeit erkannte Vorlage und bietet eine Auswahl aller installierten Vorlagen. Bei **unverändert** bleibt die Konfiguration, wie sie ist. Wird eine Vorlage gewählt, ersetzt sie beim Übernehmen die vorhandene Konfiguration. Fehlt beim Fahrzeug der Decoder, wird er mit dem Protokoll dcc angelegt. Es gelten dieselben Protokoll-Regeln wie beim Import (siehe unten): bei sx1 werden nur die ersten 5 Werte übernommen, bei mot, multi und analog wird die Zuordnung abgewiesen. Danach erscheint der Hinweis zur Digital-Adresse. Auch dieser Schritt lässt sich mit **Rückgängig** zurücknehmen.\n\nSo lässt sich eine Lokomotive zunächst in iTrain mit Standardwerten anlegen und speichern; die Decoder-Daten kommen anschließend hier an der richtigen Stelle hinzu.\nFehlt der configuration-Bereich im Fahrzeug noch ganz, wird er beim Import neu angelegt. Ist er bereits vorhanden, wird er **vollständig ersetzt** - das Programm fragt vorher nach, und **Rückgängig** macht den Vorgang wieder rückgängig.\n\n**Mitgelieferte Vorlagen:** Seit Version 2.5 sind die Decoder-Vorlagen im Programm enthalten. Beim ersten Start - und nach jeder neuen Programmversion - werden sie in den Ordner für Decoder-Vorlagen übertragen; der Ordner wird bei der Ersteinrichtung abgefragt und lässt sich jederzeit unter Voreinstellungen → Pfade ändern. Welche Fassung dabei ankommt, hängt von der Programmsprache ab: Deutsch und Niederländisch erhalten die deutschen Vorlagen, alle anderen Sprachen die englischen; weitere Übersetzungen folgen. Bei der Übertragung werden gleichnamige Dateien aus einer früheren Lieferung ersetzt - eigene Vorlagen mit anderen Namen bleiben unberührt.\n\n**Vorlagen aktualisieren und ergänzen:** Im Menü **Decoder** des Decoder-Fensters gibt es zwei Punkte. **Decoder-Vorlagen installieren** liest einzelne, neuere oder geänderte Vorlagen ein - sie werden über denselben Proton-Drive-Link wie das Programm bereitgestellt, als .csv oder .zip. Ebenso lassen sich damit eine selbst erfasste oder eine zugeschickte Vorlage einlesen, auch mehrere auf einmal; jede wird vor dem Kopieren geprüft, damit keine gewöhnliche Export-Datei im Vorlagen-Ordner landet. **Decoder-Vorlagen** öffnet ein eigenes, in der Größe veränderbares Fenster mit allen vorhandenen Vorlagen samt Suchfeld. Dort sind bewusst nur Bezeichnung, Beschreibung und die Anzahl der CV-Einträge zu sehen - die Werte selbst zeigt erst der Import in ein Fahrzeug. Unten im Fenster stehen Stand und Übertragungsdatum der mitgelieferten Sammlung.\n\nDas Herunterladen erfolgt mit Betriebssystem-Mitteln: **Herunterladen** öffnet die Proton-Drive-Freigabe im Browser, darin gibt es den Ordner **Decoder** mit den Aktualisierungen. In den meisten Browsern landet die Datei im **Download**-Ordner des Betriebssystems.\n\nEine Vorlagen-Datei enthält nur den configuration-Bereich, keinen vollständigen Eintrag. Der normale Knopf **In Kategorie importieren** weist solche Dateien deshalb mit einem Hinweis ab.\n\n**Wichtig - die Digital-Adresse:** Eine Vorlage enthält immer auch die Digital-Adresse (CV 1 bzw. CV 17/18) des Fahrzeugs, aus dem sie ursprünglich stammt. Nach dem Import zeigt das Programm deshalb einen Hinweis: Der Wert im Decoder des Zielfahrzeugs ist ein anderer und muss nach dem Start von iTrain über POM (Programmierung auf dem Hauptgleis) oder von Hand richtiggestellt werden. Andernfalls spricht iTrain das Fahrzeug unter einer falschen Adresse an.\n\n**Fassung eines Vorlagen-Archivs:** Enthält eine heruntergeladene .zip eine Versionsangabe, wird sie beim Installieren mit dem bereits vorhandenen Stand verglichen. Ist das gewählte Archiv nicht neuer, fragt das Programm nach und bietet **Alte behalten** an - so überschreibt eine versehentlich gewählte ältere Datei nicht stillschweigend die neueren Vorlagen. Ein bewusster Schritt zurück bleibt über **Trotzdem installieren** möglich.\n\n**CV-Werte ansehen und ändern:** Im Fenster **Decoder-Vorlagen** öffnet **Decoder-CVs bearbeiten** - oder ein Doppelklick auf die Zeile - die markierte Vorlage in der großen CV-Tabelle. Dort lassen sich die Werte ansehen und ändern; **Speichern** schreibt sie in dieselbe Datei zurück, **Speichern als...** legt unter neuem Namen eine zusätzliche Vorlage an. Die Werte eines Fahrzeugs bearbeitest du auf demselben Weg über den Daten-Explorer: Knoten **configuration** auswählen und **Decoder-CVs bearbeiten** anklicken.\n\n**Anmerkung zu den Vorlagen:** Die mitgelieferten Vorlagen wurden aus den .pdf-Anleitungen der Hersteller abgeleitet und enthalten oft nur Teile der gesamten Decoder-Konfiguration - im Fall von ZIMO etwa sehr lange Texte, die kaum in eine Beschreibung passen. Trotzdem ist damit schon einiges brauchbar: Der Decoder lässt sich in iTrain über POM oder das Programmiergleis umfänglich abfragen. Kommt dabei an manchen Stellen keine Information zurück, ist der Decoder mit der Vorlage womöglich nicht vollständig kompatibel. Genau deshalb sind die Vorlagen anpassbar und unter anderem Namen speicherbar.\n\n**Nicht jedes Protokoll kennt CV-Werte:** Welches Digital-Protokoll ein Fahrzeug verwendet, steht im Daten-Explorer unter **decoder** im Feld **protocol**. Davon hängt ab, was ein Import übernehmen darf:\n- **dcc**, **fmz**, **ctc** und **sx2**: die vollständige Vorlage.\n- **sx1**: höchstens 5 Werte. Enthält die Vorlage mehr, fragt das Programm nach und übernimmt nur die ersten 5.\n- **mot**, **multi** und **analog**: kein Import. Diese Protokolle haben keine CV-Konfiguration; das Programm weist den Versuch mit einer Meldung ab.\n\nDie Regel gilt für beide Wege gleichermaßen - für **Decoder importieren** in der Werkzeugleiste wie für **Vorlage einlesen** im Bearbeiten-Fenster. Von Hand eingetragene Werte bleiben davon unberührt.\n\n**Wagen ohne Decoder:** Viele Wagen haben in iTrain gar keinen Decoder eingetragen. Dort genügt es **nicht**, nur die Konfiguration einzufügen - ohne zugehörigen Decoder zeigt iTrain die CV-Werte überhaupt nicht an. Das Programm fragt deshalb nach und legt auf Wunsch gleich einen Decoder mit an; das Protokoll wählst du dabei aus (dcc, fmz, ctc, sx2, sx1). Bei Lokomotiven bleibt es bei einer Warnung - eine Lok ohne Decoder deutet eher auf einen Fehler in der Datei hin.
help.decoderText.en=In the **Locomotives** and **Wagons** tabs, the **configuration** sub-area in the data explorer describes the built-in decoder: its CV values along with descriptions. Because these details are the same for a given decoder type, they can be saved as a **template** and applied to other vehicles. For this, the **Decoder window** (button **Decoder** on the right of the ribbon of the main window) has two buttons in the toolbar:\n\n- **Export decoder** saves the configuration area of the selected vehicle as a template in the decoder templates folder. It asks for a name (which later appears in the selection list) and, optionally, a description.\n- **Import decoder** applies a template to the selected vehicle. A list of all installed templates opens with a search field; pressing a key jumps to the first template with that initial letter, and the column headers allow re-sorting. **Choose file...** can instead load any template file from disk.\n\nExactly **one** vehicle must always be selected, because a decoder configuration belongs to exactly one vehicle.\n\n**One iTrain file for all program parts:** The Decoder window works on the same iTrain file as the main window and the Systems window. No matter in which program part a .tcdz/.tcd is loaded - it applies in all parts until the program is closed (or another file is loaded). The ribbon and the **File** menu of the Decoder window offer two buttons for this:\n- **Load iTrain file** loads a file; it immediately also appears in the main window and the Systems window.\n- **Write to iTrain file** saves all changes directly into the loaded file after a confirmation. Beforehand the program makes a backup in the backup folder. iTrain should not have the file open.\n\n**Decoder and Decoder template columns:** In the Locomotives and Wagons tabs, two additional columns show which decoder is entered and which template matches it. The template is recognised by the CV numbers of the existing configuration. If no installed template matches, it shows **own (n CVs)**; without a configuration the column stays empty.\n\n**Jump to the configuration:** After loading, the first vehicle is selected in the Decoder window, and its **configuration** node is highlighted and focused in the data explorer - likewise whenever you switch to another vehicle. **Edit decoder CVs** then opens the values directly.\n\n**Assigning a template in the editing window:** Double-clicking or right-clicking a row opens the editing window. The **Decoder template** row shows the currently recognised template and offers a choice of all installed templates. With **unchanged** the configuration stays as it is. If a template is chosen, it replaces the existing configuration when applying. If the vehicle has no decoder, one is created with the protocol dcc. The same protocol rules as for importing apply (see below): with sx1 only the first 5 values are taken over, with mot, multi and analog the assignment is rejected. Afterwards the note about the digital address appears. This step, too, can be reverted with **Undo**.\n\nThis way a locomotive can first be created and saved in iTrain with default values; the decoder data is then added here in the right place afterwards.\nIf the configuration area is still completely missing from the vehicle, it is created anew on import. If it already exists, it is **completely replaced** - the program asks beforehand, and **Undo** reverts the operation.\n\n**Bundled templates:** Since version 2.5, the decoder templates are included in the program. On first start - and after every new program version - they are transferred to the decoder templates folder; the folder is asked for during initial setup and can be changed at any time under Preferences → Paths. Which version arrives depends on the program language: German and Dutch receive the German templates, all other languages the English ones; more translations will follow. During transfer, files with the same name from an earlier delivery are replaced - your own templates with different names remain untouched.\n\n**Updating and adding templates:** The **Decoder** menu of the Decoder window has two items. **Install decoder templates** reads in individual, newer or changed templates - they are provided via the same Proton Drive link as the program, as .csv or .zip. It can likewise be used to read in a self-captured or received template, even several at once; each one is checked before copying, so that no ordinary export file ends up in the templates folder. **Decoder templates** opens its own resizable window with all existing templates plus a search field. There, deliberately, only name, description and the number of CV entries are visible - the values themselves are only shown by importing into a vehicle. The bottom of the window shows the version and transfer date of the bundled collection.\n\nThe download uses operating-system means: **Download** opens the Proton Drive share in the browser, which contains the **Decoder** folder with the updates. In most browsers the file ends up in the operating system's **Downloads** folder.\n\nA template file contains only the configuration area, not a complete entry. The normal **Import into category** button therefore rejects such files with a notice.\n\n**Important - the digital address:** A template always also contains the digital address (CV 1 or CV 17/18) of the vehicle it originally came from. After the import, the program therefore shows a notice: the value in the target vehicle's decoder is a different one and must be corrected after starting iTrain via POM (programming on the main track) or by hand. Otherwise iTrain will address the vehicle under the wrong address.\n\n**Version of a template archive:** If a downloaded .zip contains a version number, it is compared with the version already present when installing. If the selected archive is not newer, the program asks and offers **Keep old** - so that an accidentally selected older file does not silently overwrite the newer templates. A deliberate step back remains possible via **Install anyway**.\n\n**Viewing and changing CV values:** In the **Decoder templates** window, **Edit decoder CVs** - or a double-click on the row - opens the selected template in the large CV table. There the values can be viewed and changed; **Save** writes them back into the same file, **Save as...** creates an additional template under a new name. You edit the values of a vehicle the same way via the data explorer: select the **configuration** node and click **Edit decoder CVs**.\n\n**Note on the templates:** The bundled templates were derived from the manufacturers' PDF manuals and often contain only parts of the full decoder configuration - in the case of ZIMO, for instance, very long texts that barely fit into a description. Even so, quite a lot is already usable: the decoder can be extensively queried in iTrain via POM or the programming track. If no information comes back at some points, the decoder may not be fully compatible with the template. That is exactly why the templates are adjustable and can be saved under a different name.\n\n**Not every protocol knows CV values:** Which digital protocol a vehicle uses is shown in the data explorer under **decoder** in the **protocol** field. This determines what an import may take over:\n- **dcc**, **fmz**, **ctc** and **sx2**: the complete template.\n- **sx1**: at most 5 values. If the template contains more, the program asks and applies only the first 5.\n- **mot**, **multi** and **analog**: no import. These protocols have no CV configuration; the program rejects the attempt with a message.\n\nThe rule applies equally to both paths - for **Import decoder** in the toolbar as well as for **Read in template** in the editing window. Manually entered values are not affected by this.\n\n**Wagons without a decoder:** Many wagons have no decoder entered at all in iTrain. There it is **not** enough to just insert the configuration - without an associated decoder, iTrain does not display the CV values at all. The program therefore asks and, if desired, creates a decoder right away; you choose the protocol in the process (dcc, fmz, ctc, sx2, sx1). For locomotives it remains at a warning - a locomotive without a decoder is more likely a sign of an error in the file.
help.decoderText.nl=In de tabbladen **Locomotieven** en **Wagons** beschrijft het subgebied **configuration** in de data-explorer de ingebouwde decoder: zijn CV-waarden inclusief beschrijvingen. Omdat deze gegevens per decodertype gelijk zijn, kunnen ze als **sjabloon** worden opgeslagen en op andere voertuigen worden toegepast. Daarvoor zijn er in het **Decoder-venster** (knop **Decoder** rechts in het lint van het hoofdvenster) twee knoppen in de werkbalk:\n\n- **Decoder exporteren** slaat het configuration-gebied van het geselecteerde voertuig op als sjabloon in de map voor decodersjablonen. Er wordt gevraagd om een naam (die later in de selectie verschijnt) en eventueel een beschrijving.\n- **Decoder importeren** past een sjabloon toe op het geselecteerde voertuig. Er verschijnt een lijst van alle geïnstalleerde sjablonen met zoekveld; een toetsaanslag springt naar het eerste sjabloon met die beginletter, en via de kolomkoppen kan worden gesorteerd. Met **Bestand kiezen...** kan in plaats daarvan een willekeurig sjabloonbestand van de harde schijf worden geladen.\n\nEr moet daarbij altijd **precies één** voertuig geselecteerd zijn, want een decoderconfiguratie hoort bij precies één voertuig.\n\n**Eén iTrain-bestand voor alle programmadelen:** Het Decoder-venster werkt op hetzelfde iTrain-bestand als het hoofdvenster en het Systemen-venster. Ongeacht in welk programmadeel een .tcdz/.tcd wordt geladen - het geldt tot het afsluiten van het programma (of tot een ander wordt geladen) in alle delen. In het lint en het menu **Bestand** van het Decoder-venster staan daarvoor twee knoppen:\n- **iTrain-bestand laden** laadt een bestand; het verschijnt direct ook in het hoofdvenster en het Systemen-venster.\n- **Naar iTrain-bestand schrijven** slaat na een bevestiging alle wijzigingen direct op in het geladen bestand. Vooraf maakt het programma een back-up in de back-upmap. iTrain mag het bestand daarbij niet geopend hebben.\n\n**Kolommen Decoder en Decodersjabloon:** In de tabbladen Locomotieven en Wagons tonen twee extra kolommen welke decoder is ingevoerd en welk sjabloon erbij past. Het sjabloon wordt herkend aan de CV-nummers van de bestaande configuratie. Past geen geïnstalleerd sjabloon, dan staat er **eigen (n CV's)**; zonder configuratie blijft de kolom leeg.\n\n**Sprong naar de configuratie:** Na het laden is in het Decoder-venster het eerste voertuig geselecteerd en staat in de gegevensverkenner zijn knooppunt **configuration** gemarkeerd in focus - net zo bij elke wissel naar een ander voertuig. **Decoder-CV's bewerken** opent de waarden dan direct.\n\n**Sjabloon in het bewerkingsvenster toewijzen:** Een dubbelklik of rechtsklik op een rij opent het bewerkingsvenster. De rij **Decodersjabloon** toont het momenteel herkende sjabloon en biedt een keuze uit alle geïnstalleerde sjablonen. Bij **onveranderd** blijft de configuratie zoals ze is. Wordt een sjabloon gekozen, dan vervangt het bij het overnemen de bestaande configuratie. Heeft het voertuig geen decoder, dan wordt die aangemaakt met het protocol dcc. Dezelfde protocolregels als bij het importeren gelden (zie hieronder): bij sx1 worden alleen de eerste 5 waarden overgenomen, bij mot, multi en analog wordt de toewijzing geweigerd. Daarna verschijnt de melding over het digitale adres. Ook deze stap kan met **Ongedaan maken** worden teruggedraaid.\n\nZo kan een locomotief eerst in iTrain met standaardwaarden worden aangemaakt en opgeslagen; de decodergegevens komen vervolgens hier op de juiste plek erbij.\nOntbreekt het configuration-gebied bij het voertuig nog helemaal, dan wordt het bij de import nieuw aangemaakt. Bestaat het al, dan wordt het **volledig vervangen** - het programma vraagt vooraf om bevestiging, en **Ongedaan maken** maakt de handeling weer ongedaan.\n\n**Meegeleverde sjablonen:** Sinds versie 2.5 zijn de decodersjablonen in het programma opgenomen. Bij de eerste start - en na elke nieuwe programmaversie - worden ze overgezet naar de map voor decodersjablonen; de map wordt bij de eerste instelling gevraagd en kan op elk moment onder Voorkeuren → Paden worden gewijzigd. Welke versie daarbij aankomt, hangt af van de programmataal: Duits en Nederlands krijgen de Duitse sjablonen, alle andere talen de Engelse; meer vertalingen volgen. Bij de overdracht worden gelijknamige bestanden uit een eerdere levering vervangen - eigen sjablonen met andere namen blijven onaangeroerd.\n\n**Sjablonen bijwerken en aanvullen:** In het menu **Decoder** van het Decoder-venster staan twee punten. **Decodersjablonen installeren** leest afzonderlijke, nieuwere of gewijzigde sjablonen in - deze worden via dezelfde Proton-Drive-link als het programma aangeboden, als .csv of .zip. Hiermee kan ook een zelf vastgelegd of toegezonden sjabloon worden ingelezen, ook meerdere tegelijk; elk wordt vóór het kopiëren gecontroleerd, zodat er geen gewoon exportbestand in de sjablonenmap terechtkomt. **Decodersjablonen** opent een eigen, in grootte aanpasbaar venster met alle aanwezige sjablonen inclusief zoekveld. Daar zijn bewust alleen naam, beschrijving en het aantal CV-items te zien - de waarden zelf toont pas de import in een voertuig. Onderin het venster staan stand en overdrachtsdatum van de meegeleverde verzameling.\n\nHet downloaden gebeurt met besturingssysteemmiddelen: **Downloaden** opent de Proton-Drive-share in de browser, daarin staat de map **Decoder** met de updates. In de meeste browsers komt het bestand in de map **Downloads** van het besturingssysteem terecht.\n\nEen sjabloonbestand bevat alleen het configuration-gebied, geen volledig item. De normale knop **In categorie importeren** wijst zulke bestanden daarom met een melding af.\n\n**Belangrijk - het digitale adres:** Een sjabloon bevat altijd ook het digitale adres (CV 1 resp. CV 17/18) van het voertuig waar het oorspronkelijk vandaan komt. Na de import toont het programma daarom een melding: de waarde in de decoder van het doelvoertuig is een andere en moet na het starten van iTrain via POM (programmering op de hoofdrail) of handmatig worden gecorrigeerd. Anders spreekt iTrain het voertuig onder een verkeerd adres aan.\n\n**Versie van een sjablonenarchief:** Bevat een gedownloade .zip een versieopgave, dan wordt deze bij het installeren vergeleken met de al aanwezige stand. Is het gekozen archief niet nieuwer, dan vraagt het programma en biedt **Oude behouden** aan - zo overschrijft een per ongeluk gekozen ouder bestand niet stilzwijgend de nieuwere sjablonen. Een bewuste stap terug blijft mogelijk via **Toch installeren**.\n\n**CV-waarden bekijken en wijzigen:** In het venster **Decodersjablonen** opent **Decoder-CV's bewerken** - of een dubbelklik op de rij - het geselecteerde sjabloon in de grote CV-tabel. Daar kunnen de waarden worden bekeken en gewijzigd; **Opslaan** schrijft ze terug in hetzelfde bestand, **Opslaan als...** legt onder een nieuwe naam een extra sjabloon aan. De waarden van een voertuig bewerk je op dezelfde manier via de data-explorer: knooppunt **configuration** selecteren en op **Decoder-CV's bewerken** klikken.\n\n**Opmerking over de sjablonen:** De meegeleverde sjablonen zijn afgeleid uit de pdf-handleidingen van de fabrikanten en bevatten vaak slechts delen van de volledige decoderconfiguratie - bij ZIMO bijvoorbeeld zeer lange teksten die nauwelijks in een beschrijving passen. Toch is daarmee al veel bruikbaar: de decoder kan in iTrain via POM of het programmeerspoor uitgebreid worden bevraagd. Komt daarbij op sommige plekken geen informatie terug, dan is de decoder met het sjabloon mogelijk niet volledig compatibel. Precies daarom zijn de sjablonen aanpasbaar en onder een andere naam op te slaan.\n\n**Niet elk protocol kent CV-waarden:** Welk digitaal protocol een voertuig gebruikt, staat in de data-explorer onder **decoder** in het veld **protocol**. Daarvan hangt af wat een import mag overnemen:\n- **dcc**, **fmz**, **ctc** en **sx2**: het volledige sjabloon.\n- **sx1**: maximaal 5 waarden. Bevat het sjabloon er meer, dan vraagt het programma en neemt alleen de eerste 5 over.\n- **mot**, **multi** en **analog**: geen import. Deze protocollen hebben geen CV-configuratie; het programma wijst de poging met een melding af.\n\nDe regel geldt voor beide wegen gelijk - voor **Decoder importeren** in de werkbalk zoals voor **Sjabloon inlezen** in het bewerkingsvenster. Handmatig ingevoerde waarden blijven daarbij ongewijzigd.\n\n**Wagons zonder decoder:** Veel wagons hebben in iTrain helemaal geen decoder ingevoerd. Daar is het **niet** genoeg om alleen de configuratie in te voegen - zonder bijbehorende decoder toont iTrain de CV-waarden helemaal niet. Het programma vraagt daarom en legt op verzoek meteen een decoder mee aan; het protocol kies je daarbij zelf (dcc, fmz, ctc, sx2, sx1). Bij locomotieven blijft het bij een waarschuwing - een locomotief zonder decoder wijst eerder op een fout in het bestand.
help.decoderText.fr=Dans les onglets **Locomotives** et **Wagons**, la sous-zone **configuration** de l'explorateur de données décrit le décodeur intégré : ses valeurs de CV avec leurs descriptions. Comme ces informations sont identiques pour un même type de décodeur, elles peuvent être enregistrées comme **modèle** et reprises sur d'autres véhicules. Pour cela, la **fenêtre Décodeur** (bouton **Décodeur** à droite du ruban de la fenêtre principale) dispose de deux boutons dans la barre d'outils :\n\n- **Exporter le décodeur** enregistre la zone configuration du véhicule sélectionné comme modèle dans le dossier des modèles de décodeur. Un nom (qui apparaîtra plus tard dans la sélection) et, au choix, une description sont demandés.\n- **Importer le décodeur** applique un modèle au véhicule sélectionné. Une liste de tous les modèles installés s'ouvre avec un champ de recherche ; une frappe au clavier saute au premier modèle commençant par cette lettre, et les en-têtes de colonnes permettent de retrier. **Choisir un fichier...** permet à la place de charger n'importe quel fichier de modèle depuis le disque.\n\nIl faut toujours qu'**exactement un** véhicule soit sélectionné, car une configuration de décodeur appartient à exactement un véhicule.\n\n**Un seul fichier iTrain pour toutes les parties du programme :** La fenêtre Décodeur travaille sur le même fichier iTrain que la fenêtre principale et la fenêtre Systèmes. Quelle que soit la partie dans laquelle un .tcdz/.tcd est chargé, il vaut dans toutes les parties jusqu'à la fermeture du programme (ou jusqu'au chargement d'un autre). Le ruban et le menu **Fichier** de la fenêtre Décodeur proposent pour cela deux boutons :\n- **Charger un fichier iTrain** charge un fichier ; il apparaît aussitôt aussi dans la fenêtre principale et la fenêtre Systèmes.\n- **Écrire dans le fichier iTrain** enregistre toutes les modifications directement dans le fichier chargé après confirmation. Auparavant, le programme fait une sauvegarde dans le dossier de sauvegarde. iTrain ne doit pas avoir le fichier ouvert.\n\n**Colonnes Décodeur et Modèle de décodeur :** Dans les onglets Locomotives et Wagons, deux colonnes supplémentaires indiquent quel décodeur est saisi et quel modèle lui correspond. Le modèle est reconnu aux numéros de CV de la configuration existante. Si aucun modèle installé ne correspond, la colonne affiche **propre (n CV)** ; sans configuration, elle reste vide.\n\n**Saut vers la configuration :** Après le chargement, le premier véhicule est sélectionné dans la fenêtre Décodeur, et son nœud **configuration** est mis en évidence et reçoit le focus dans l'explorateur de données - de même à chaque passage à un autre véhicule. **Modifier les CV du décodeur** ouvre alors directement les valeurs.\n\n**Attribuer un modèle dans la fenêtre d'édition :** Un double clic ou un clic droit sur une ligne ouvre la fenêtre d'édition. La ligne **Modèle de décodeur** affiche le modèle actuellement reconnu et propose tous les modèles installés. Avec **inchangé**, la configuration reste telle quelle. Si un modèle est choisi, il remplace la configuration existante lors de la validation. Si le véhicule n'a pas de décodeur, celui-ci est créé avec le protocole dcc. Les mêmes règles de protocole que pour l'import s'appliquent (voir ci-dessous) : avec sx1, seules les 5 premières valeurs sont reprises ; avec mot, multi et analog, l'attribution est refusée. Ensuite apparaît la remarque sur l'adresse numérique. Cette étape aussi peut être annulée avec **Annuler**.\n\nAinsi, une locomotive peut d'abord être créée et enregistrée dans iTrain avec des valeurs par défaut ; les données du décodeur sont ensuite ajoutées ici, au bon endroit.\nSi la zone configuration manque encore complètement dans le véhicule, elle est créée à nouveau lors de l'import. Si elle existe déjà, elle est **entièrement remplacée** - le programme le demande au préalable, et **Annuler** défait l'opération.\n\n**Modèles fournis :** Depuis la version 2.5, les modèles de décodeur sont inclus dans le programme. Au premier démarrage - et après chaque nouvelle version du programme - ils sont transférés dans le dossier des modèles de décodeur ; ce dossier est demandé lors de la configuration initiale et peut être modifié à tout moment sous Préférences → Chemins. La version reçue dépend de la langue du programme : l'allemand et le néerlandais reçoivent les modèles allemands, toutes les autres langues les modèles anglais ; d'autres traductions suivront. Lors du transfert, les fichiers de même nom provenant d'une livraison antérieure sont remplacés - les modèles personnels portant d'autres noms restent intacts.\n\n**Mettre à jour et compléter les modèles :** Le menu **Décodeur** de la fenêtre Décodeur comporte deux points. **Installer des modèles de décodeur** lit des modèles individuels, plus récents ou modifiés - ils sont fournis via le même lien Proton Drive que le programme, en .csv ou .zip. Cela permet également de lire un modèle réalisé soi-même ou reçu, y compris plusieurs à la fois ; chacun est vérifié avant la copie, afin qu'aucun simple fichier d'export n'atterrisse dans le dossier des modèles. **Modèles de décodeur** ouvre une fenêtre à part, redimensionnable, avec tous les modèles existants ainsi qu'un champ de recherche. On n'y voit volontairement que le nom, la description et le nombre d'entrées CV - les valeurs elles-mêmes ne s'affichent qu'à l'import dans un véhicule. Le bas de la fenêtre indique l'état et la date de transfert de la collection fournie.\n\nLe téléchargement se fait avec les moyens du système d'exploitation : **Télécharger** ouvre le partage Proton Drive dans le navigateur, qui contient le dossier **Decoder** avec les mises à jour. Dans la plupart des navigateurs, le fichier atterrit dans le dossier **Téléchargements** du système d'exploitation.\n\nUn fichier de modèle ne contient que la zone configuration, pas une entrée complète. Le bouton normal **Importer dans la catégorie** rejette donc de tels fichiers avec un avis.\n\n**Important - l'adresse numérique :** Un modèle contient toujours aussi l'adresse numérique (CV 1 ou CV 17/18) du véhicule d'où il provient à l'origine. Après l'import, le programme affiche donc un avis : la valeur dans le décodeur du véhicule cible est différente et doit être corrigée après le démarrage d'iTrain via POM (programmation sur la voie principale) ou manuellement. Sinon, iTrain adresse le véhicule sous une adresse erronée.\n\n**Version d'une archive de modèles :** Si un .zip téléchargé contient une indication de version, celle-ci est comparée lors de l'installation à l'état déjà présent. Si l'archive choisie n'est pas plus récente, le programme le demande et propose **Conserver l'ancienne** - ainsi, un fichier plus ancien choisi par erreur n'écrase pas silencieusement les modèles plus récents. Un retour en arrière volontaire reste possible via **Installer malgré tout**.\n\n**Consulter et modifier les valeurs CV :** Dans la fenêtre **Modèles de décodeur**, **Modifier les CV du décodeur** - ou un double clic sur la ligne - ouvre le modèle sélectionné dans le grand tableau de CV. On peut y consulter et modifier les valeurs ; **Enregistrer** les réécrit dans le même fichier, **Enregistrer sous...** crée un modèle supplémentaire sous un nouveau nom. Les valeurs d'un véhicule se modifient de la même manière via l'explorateur de données : sélectionner le nœud **configuration** et cliquer sur **Modifier les CV du décodeur**.\n\n**Remarque sur les modèles :** Les modèles fournis ont été dérivés des manuels PDF des fabricants et ne contiennent souvent que des parties de la configuration complète du décodeur - dans le cas de ZIMO par exemple, des textes très longs qui tiennent à peine dans une description. Malgré cela, beaucoup de choses sont déjà utilisables : le décodeur peut être interrogé de manière approfondie dans iTrain via POM ou la voie de programmation. Si aucune information ne revient à certains endroits, le décodeur n'est peut-être pas entièrement compatible avec le modèle. C'est exactement pour cela que les modèles sont modifiables et peuvent être enregistrés sous un autre nom.\n\n**Tous les protocoles ne connaissent pas les valeurs CV :** Le protocole numérique utilisé par un véhicule figure dans l'explorateur de données sous **decoder** dans le champ **protocol**. Cela déterminera ce qu'un import peut reprendre :\n- **dcc**, **fmz**, **ctc** et **sx2** : le modèle complet.\n- **sx1** : au maximum 5 valeurs. Si le modèle en contient plus, le programme le demande et n'applique que les 5 premières.\n- **mot**, **multi** et **analog** : pas d'import. Ces protocoles n'ont pas de configuration CV ; le programme rejette la tentative avec un message.\n\nLa règle s'applique de la même manière aux deux voies - pour **Importer le décodeur** dans la barre d'outils comme pour **Lire un modèle** dans la fenêtre d'édition. Les valeurs saisies à la main n'en sont pas affectées.\n\n**Wagons sans décodeur :** De nombreux wagons n'ont dans iTrain aucun décodeur renseigné. Il ne suffit alors **pas** d'insérer seulement la configuration - sans décodeur associé, iTrain n'affiche pas du tout les valeurs CV. Le programme le demande donc et crée aussitôt un décodeur si souhaité ; le protocole est choisi à cette occasion (dcc, fmz, ctc, sx2, sx1). Pour les locomotives, on en reste à un avertissement - une locomotive sans décodeur laisse plutôt supposer une erreur dans le fichier.
help.decoderText.es=En las pestañas **Locomotoras** y **Vagones**, la subárea **configuration** del explorador de datos describe el decodificador incorporado: sus valores de CV junto con sus descripciones. Como estos datos son iguales para cada tipo de decodificador, se pueden guardar como **plantilla** y aplicar a otros vehículos. Para ello, la **ventana Decoder** (botón **Decoder** a la derecha de la cinta de la ventana principal) tiene dos botones en la barra de herramientas:\n\n- **Exportar decodificador** guarda el área configuration del vehículo seleccionado como plantilla en la carpeta de plantillas de decodificador. Se pide un nombre (que luego aparecerá en la selección) y, opcionalmente, una descripción.\n- **Importar decodificador** aplica una plantilla al vehículo seleccionado. Se abre una lista de todas las plantillas instaladas con un campo de búsqueda; al pulsar una tecla se salta a la primera plantilla con esa letra inicial, y los encabezados de columna permiten reordenar. Con **Elegir archivo...** se puede cargar en su lugar cualquier archivo de plantilla desde el disco.\n\nSiempre debe estar seleccionado **exactamente un** vehículo, porque una configuración de decodificador pertenece a exactamente un vehículo.\n\n**Un archivo de iTrain para todas las partes del programa:** La ventana Decoder trabaja sobre el mismo archivo de iTrain que la ventana principal y la ventana Sistemas. No importa en qué parte del programa se cargue un .tcdz/.tcd: vale en todas las partes hasta cerrar el programa (o hasta cargar otro). En la cinta y en el menú **Archivo** de la ventana Decoder hay dos botones para ello:\n- **Cargar archivo de iTrain** carga un archivo; aparece de inmediato también en la ventana principal y en la ventana Sistemas.\n- **Escribir en el archivo de iTrain** guarda todos los cambios directamente en el archivo cargado tras una confirmación. Antes, el programa hace una copia de seguridad en la carpeta de copias. iTrain no debe tener el archivo abierto.\n\n**Columnas Decoder y Plantilla de decoder:** En las pestañas Locomotoras y Vagones, dos columnas adicionales muestran qué decodificador está indicado y qué plantilla le corresponde. La plantilla se reconoce por los números de CV de la configuración existente. Si no coincide ninguna plantilla instalada, aparece **propia (n CV)**; sin configuración la columna queda vacía.\n\n**Salto a la configuración:** Tras cargar, en la ventana Decoder está seleccionado el primer vehículo, y en el explorador de datos su nodo **configuration** aparece resaltado y con el foco; lo mismo al cambiar a otro vehículo. **Editar CV del decodificador** abre entonces los valores directamente.\n\n**Asignar una plantilla en la ventana de edición:** Un doble clic o clic derecho en una fila abre la ventana de edición. La fila **Plantilla de decoder** muestra la plantilla reconocida actualmente y ofrece todas las plantillas instaladas. Con **sin cambios** la configuración se queda como está. Si se elige una plantilla, al aplicar sustituye la configuración existente. Si el vehículo no tiene decodificador, se crea uno con el protocolo dcc. Se aplican las mismas reglas de protocolo que al importar (ver abajo): con sx1 solo se toman los 5 primeros valores; con mot, multi y analog se rechaza la asignación. Después aparece el aviso sobre la dirección digital. También este paso puede revertirse con **Deshacer**.\n\nDe este modo, una locomotora puede crearse y guardarse primero en iTrain con valores predeterminados; los datos del decodificador se añaden después aquí, en el lugar correcto.\nSi al vehículo le falta todavía por completo el área configuration, se crea de nuevo al importar. Si ya existe, se **sustituye por completo** - el programa lo pregunta antes, y **Deshacer** revierte la operación.\n\n**Plantillas incluidas:** Desde la versión 2.5, las plantillas de decodificador están incluidas en el programa. En el primer inicio - y tras cada nueva versión del programa - se transfieren a la carpeta de plantillas de decodificador; se pregunta por esta carpeta en la configuración inicial y se puede cambiar en cualquier momento en Preferencias → Rutas. Qué versión llega depende del idioma del programa: alemán y neerlandés reciben las plantillas en alemán, todos los demás idiomas las plantillas en inglés; seguirán más traducciones. Durante la transferencia se sustituyen los archivos con el mismo nombre de una entrega anterior - las plantillas propias con otros nombres permanecen intactas.\n\n**Actualizar y añadir plantillas:** El menú **Decoder** de la ventana Decoder tiene dos elementos. **Instalar plantillas de decodificador** lee plantillas individuales, más nuevas o modificadas - se proporcionan a través del mismo enlace de Proton Drive que el programa, como .csv o .zip. También se puede usar para leer una plantilla creada por uno mismo o recibida, incluso varias a la vez; cada una se comprueba antes de copiarla, para que no acabe un archivo de exportación normal en la carpeta de plantillas. **Plantillas de decodificador** abre una ventana propia, de tamaño ajustable, con todas las plantillas existentes más un campo de búsqueda. Allí, deliberadamente, solo se ven el nombre, la descripción y el número de entradas CV - los valores en sí solo se muestran al importar en un vehículo. En la parte inferior de la ventana figuran la versión y la fecha de transferencia de la colección incluida.\n\nLa descarga se realiza con los medios del sistema operativo: **Descargar** abre el enlace compartido de Proton Drive en el navegador, que contiene la carpeta **Decoder** con las actualizaciones. En la mayoría de los navegadores el archivo termina en la carpeta **Descargas** del sistema operativo.\n\nUn archivo de plantilla contiene solo el área configuration, no una entrada completa. El botón normal **Importar en categoría** rechaza por eso esos archivos con un aviso.\n\n**Importante - la dirección digital:** Una plantilla siempre contiene también la dirección digital (CV 1 o CV 17/18) del vehículo del que procede originalmente. Tras la importación, el programa muestra por eso un aviso: el valor en el decodificador del vehículo de destino es distinto y debe corregirse tras iniciar iTrain mediante POM (programación en la vía principal) o a mano. De lo contrario, iTrain se dirigirá al vehículo con una dirección equivocada.\n\n**Versión de un archivo de plantillas:** Si un .zip descargado contiene una indicación de versión, se compara al instalar con la versión ya presente. Si el archivo elegido no es más nuevo, el programa lo pregunta y ofrece **Mantener el antiguo** - así, un archivo antiguo elegido por error no sobrescribe silenciosamente las plantillas más nuevas. Un paso atrás deliberado sigue siendo posible mediante **Instalar de todos modos**.\n\n**Ver y cambiar valores de CV:** En la ventana **Plantillas de decodificador**, **Editar CV del decodificador** - o un doble clic en la fila - abre la plantilla seleccionada en la gran tabla de CV. Allí se pueden ver y cambiar los valores; **Guardar** los escribe de nuevo en el mismo archivo, **Guardar como...** crea una plantilla adicional con un nuevo nombre. Los valores de un vehículo se editan del mismo modo a través del explorador de datos: seleccionar el nodo **configuration** y hacer clic en **Editar CV del decodificador**.\n\n**Nota sobre las plantillas:** Las plantillas incluidas se derivaron de los manuales en PDF de los fabricantes y a menudo contienen solo partes de la configuración completa del decodificador - en el caso de ZIMO, por ejemplo, textos muy largos que apenas caben en una descripción. Aun así, ya hay bastante utilizable: el decodificador se puede consultar ampliamente en iTrain mediante POM o la vía de programación. Si en algunos puntos no vuelve ninguna información, es posible que el decodificador no sea totalmente compatible con la plantilla. Precisamente por eso las plantillas son ajustables y se pueden guardar con otro nombre.\n\n**No todos los protocolos conocen valores CV:** Qué protocolo digital usa un vehículo se muestra en el explorador de datos bajo **decoder** en el campo **protocol**. De ello depende lo que una importación puede asumir:\n- **dcc**, **fmz**, **ctc** y **sx2**: la plantilla completa.\n- **sx1**: como máximo 5 valores. Si la plantilla contiene más, el programa lo pregunta y aplica solo los primeros 5.\n- **mot**, **multi** y **analog**: sin importación. Estos protocolos no tienen configuración CV; el programa rechaza el intento con un mensaje.\n\nLa regla se aplica igual para ambas vías - para **Importar decodificador** en la barra de herramientas como para **Leer plantilla** en la ventana de edición. Los valores introducidos a mano no se ven afectados por esto.\n\n**Vagones sin decodificador:** Muchos vagones no tienen ningún decodificador introducido en iTrain. Ahí **no** basta con insertar solo la configuración - sin un decodificador asociado, iTrain no muestra en absoluto los valores CV. El programa lo pregunta por eso y, si se desea, crea directamente un decodificador; el protocolo se elige en ese momento (dcc, fmz, ctc, sx2, sx1). En las locomotoras se queda en una advertencia - una locomotora sin decodificador apunta más bien a un error en el archivo.
help.decoderText.it=Nelle schede **Locomotive** e **Carri**, la sottoarea **configuration** dell'esploratore dati descrive il decoder integrato: i suoi valori CV con le relative descrizioni. Poiché questi dati sono uguali per ogni tipo di decoder, possono essere salvati come **modello** e applicati ad altri veicoli. A questo scopo, la **finestra Decoder** (pulsante **Decoder** a destra nella barra multifunzione della finestra principale) ha due pulsanti nella barra degli strumenti:\n\n- **Esporta decoder** salva l'area configuration del veicolo selezionato come modello nella cartella dei modelli di decoder. Viene richiesto un nome (che poi appare nella selezione) e, facoltativamente, una descrizione.\n- **Importa decoder** applica un modello al veicolo selezionato. Si apre un elenco di tutti i modelli installati con un campo di ricerca; premendo un tasto si salta al primo modello con quella lettera iniziale, e le intestazioni delle colonne permettono di riordinare. Con **Scegli file...** si può invece caricare un qualsiasi file di modello dal disco.\n\nDeve sempre essere selezionato **esattamente un** veicolo, perché una configurazione decoder appartiene a esattamente un veicolo.\n\n**Un unico file iTrain per tutte le parti del programma:** La finestra Decoder lavora sullo stesso file iTrain della finestra principale e della finestra Sistemi. In qualunque parte del programma venga caricato un .tcdz/.tcd, vale in tutte le parti fino alla chiusura del programma (o finché non se ne carica un altro). Nella barra e nel menu **File** della finestra Decoder ci sono a questo scopo due pulsanti:\n- **Carica file iTrain** carica un file; compare subito anche nella finestra principale e nella finestra Sistemi.\n- **Scrivi nel file iTrain** salva tutte le modifiche direttamente nel file caricato dopo una conferma. Prima il programma crea una copia nella cartella di backup. iTrain non deve avere il file aperto.\n\n**Colonne Decoder e Modello decoder:** Nelle schede Locomotive e Carri, due colonne aggiuntive mostrano quale decoder è indicato e quale modello gli corrisponde. Il modello viene riconosciuto dai numeri CV della configurazione esistente. Se nessun modello installato corrisponde, compare **propria (n CV)**; senza configurazione la colonna resta vuota.\n\n**Salto alla configurazione:** Dopo il caricamento, nella finestra Decoder è selezionato il primo veicolo e nell'esploratore dati il suo nodo **configuration** è evidenziato e ha il focus - lo stesso a ogni passaggio a un altro veicolo. **Modifica CV del decoder** apre quindi direttamente i valori.\n\n**Assegnare un modello nella finestra di modifica:** Un doppio clic o un clic destro su una riga apre la finestra di modifica. La riga **Modello decoder** mostra il modello attualmente riconosciuto e offre la scelta tra tutti i modelli installati. Con **invariato** la configurazione resta com'è. Se si sceglie un modello, all'applicazione sostituisce la configurazione esistente. Se il veicolo non ha decoder, ne viene creato uno con il protocollo dcc. Valgono le stesse regole di protocollo dell'importazione (vedi sotto): con sx1 vengono ripresi solo i primi 5 valori, con mot, multi e analog l'assegnazione viene rifiutata. Poi compare l'avviso sull'indirizzo digitale. Anche questo passo si può annullare con **Annulla**.\n\nCosì una locomotiva può prima essere creata e salvata in iTrain con valori predefiniti; i dati del decoder vengono poi aggiunti qui, al posto giusto.\nSe l'area configuration manca ancora del tutto nel veicolo, viene creata nuovamente durante l'importazione. Se esiste già, viene **completamente sostituita** - il programma lo chiede prima, e **Annulla** ripristina l'operazione.\n\n**Modelli forniti:** Dalla versione 2.5, i modelli di decoder sono inclusi nel programma. Al primo avvio - e dopo ogni nuova versione del programma - vengono trasferiti nella cartella dei modelli di decoder; la cartella viene richiesta durante la configurazione iniziale e può essere cambiata in qualsiasi momento in Preferenze → Percorsi. La versione che arriva dipende dalla lingua del programma: tedesco e olandese ricevono i modelli tedeschi, tutte le altre lingue quelli inglesi; altre traduzioni seguiranno. Durante il trasferimento vengono sostituiti i file con lo stesso nome di una consegna precedente - i propri modelli con nomi diversi restano intatti.\n\n**Aggiornare e integrare i modelli:** Il menu **Decoder** della finestra Decoder ha due voci. **Installa modelli di decoder** legge modelli singoli, più recenti o modificati - vengono forniti tramite lo stesso link Proton Drive del programma, come .csv o .zip. Allo stesso modo si può leggere un modello acquisito autonomamente o ricevuto, anche più di uno alla volta; ognuno viene controllato prima della copia, in modo che nessun normale file di esportazione finisca nella cartella dei modelli. **Modelli di decoder** apre una propria finestra ridimensionabile con tutti i modelli esistenti più un campo di ricerca. Lì si vedono deliberatamente solo nome, descrizione e numero di voci CV - i valori stessi vengono mostrati solo importando in un veicolo. In fondo alla finestra sono indicati stato e data di trasferimento della raccolta fornita.\n\nIl download avviene con i mezzi del sistema operativo: **Scarica** apre la condivisione Proton Drive nel browser, che contiene la cartella **Decoder** con gli aggiornamenti. Nella maggior parte dei browser il file finisce nella cartella **Download** del sistema operativo.\n\nUn file di modello contiene solo l'area configuration, non una voce completa. Il normale pulsante **Importa in categoria** rifiuta quindi tali file con un avviso.\n\n**Importante - l'indirizzo digitale:** Un modello contiene sempre anche l'indirizzo digitale (CV 1 oppure CV 17/18) del veicolo da cui proviene originariamente. Dopo l'importazione il programma mostra quindi un avviso: il valore nel decoder del veicolo di destinazione è diverso e deve essere corretto dopo l'avvio di iTrain tramite POM (programmazione sul binario principale) o a mano. Altrimenti iTrain si rivolgerà al veicolo con un indirizzo errato.\n\n**Versione di un archivio di modelli:** Se uno .zip scaricato contiene un'indicazione di versione, viene confrontata durante l'installazione con quella già presente. Se l'archivio scelto non è più recente, il programma lo chiede e offre **Mantieni il vecchio** - così un file più vecchio scelto per errore non sovrascrive silenziosamente i modelli più recenti. Un passo indietro consapevole resta possibile tramite **Installa comunque**.\n\n**Visualizzare e modificare i valori CV:** Nella finestra **Modelli di decoder**, **Modifica CV del decoder** - o un doppio clic sulla riga - apre il modello selezionato nella grande tabella CV. Lì i valori possono essere visualizzati e modificati; **Salva** li riscrive nello stesso file, **Salva come...** crea un modello aggiuntivo con un nuovo nome. I valori di un veicolo si modificano allo stesso modo tramite l'esploratore dati: selezionare il nodo **configuration** e fare clic su **Modifica CV del decoder**.\n\n**Nota sui modelli:** I modelli forniti sono stati derivati dai manuali PDF dei produttori e spesso contengono solo parti dell'intera configurazione del decoder - nel caso di ZIMO, ad esempio, testi molto lunghi che difficilmente rientrano in una descrizione. Ciò nonostante già molto è utilizzabile: il decoder può essere interrogato ampiamente in iTrain tramite POM o il binario di programmazione. Se in alcuni punti non torna alcuna informazione, il decoder potrebbe non essere completamente compatibile con il modello. Proprio per questo i modelli sono personalizzabili e possono essere salvati con un altro nome.\n\n**Non tutti i protocolli conoscono i valori CV:** Quale protocollo digitale usa un veicolo è indicato nell'esploratore dati sotto **decoder** nel campo **protocol**. Da ciò dipende cosa un'importazione può recepire:\n- **dcc**, **fmz**, **ctc** e **sx2**: il modello completo.\n- **sx1**: al massimo 5 valori. Se il modello ne contiene di più, il programma lo chiede e applica solo i primi 5.\n- **mot**, **multi** e **analog**: nessuna importazione. Questi protocolli non hanno configurazione CV; il programma rifiuta il tentativo con un messaggio.\n\nLa regola vale allo stesso modo per entrambe le vie - per **Importa decoder** nella barra degli strumenti come per **Leggi modello** nella finestra di modifica. I valori inseriti manualmente non ne sono influenzati.\n\n**Carri senza decoder:** Molti carri non hanno alcun decoder inserito in iTrain. Lì **non** basta inserire solo la configurazione - senza un decoder associato, iTrain non mostra affatto i valori CV. Il programma lo chiede quindi e, se lo si desidera, crea subito anche un decoder; il protocollo si scegli in quel momento (dcc, fmz, ctc, sx2, sx1). Per le locomotive resta un semplice avviso - una locomotiva senza decoder indica piuttosto un errore nel file.
help.decoderText.pt=Nos separadores **Locomotivas** e **Vagões**, a subárea **configuration** no explorador de dados descreve o descodificador incorporado: os seus valores CV com as respetivas descrições. Como estes dados são iguais para cada tipo de descodificador, podem ser guardados como **modelo** e aplicados a outros veículos. Para isso, a **janela Descodificador** (botão **Descodificador** à direita na faixa da janela principal) tem dois botões na barra de ferramentas:\n\n- **Exportar descodificador** guarda a área configuration do veículo selecionado como modelo na pasta de modelos de descodificador. É pedido um nome (que aparecerá depois na seleção) e, opcionalmente, uma descrição.\n- **Importar descodificador** aplica um modelo ao veículo selecionado. Abre-se uma lista de todos os modelos instalados com um campo de pesquisa; premir uma tecla salta para o primeiro modelo com essa letra inicial, e os cabeçalhos das colunas permitem reordenar. Com **Escolher ficheiro...** pode em vez disso carregar-se qualquer ficheiro de modelo do disco.\n\nDeve estar sempre selecionado **exatamente um** veículo, porque uma configuração de descodificador pertence a exatamente um veículo.\n\n**Um ficheiro iTrain para todas as partes do programa:** A janela Descodificador trabalha sobre o mesmo ficheiro iTrain que a janela principal e a janela Sistemas. Seja qual for a parte do programa em que um .tcdz/.tcd é carregado, vale em todas as partes até o programa ser fechado (ou até ser carregado outro). Na faixa e no menu **Ficheiro** da janela Descodificador há para isso dois botões:\n- **Carregar ficheiro iTrain** carrega um ficheiro; aparece de imediato também na janela principal e na janela Sistemas.\n- **Escrever no ficheiro iTrain** grava todas as alterações diretamente no ficheiro carregado após uma confirmação. Antes, o programa faz uma cópia na pasta de cópias de segurança. O iTrain não deve ter o ficheiro aberto.\n\n**Colunas Descodificador e Modelo de descodificador:** Nos separadores Locomotivas e Vagões, duas colunas adicionais mostram que descodificador está indicado e que modelo lhe corresponde. O modelo é reconhecido pelos números de CV da configuração existente. Se nenhum modelo instalado corresponder, aparece **própria (n CV)**; sem configuração a coluna fica vazia.\n\n**Salto para a configuração:** Depois de carregar, na janela Descodificador fica selecionado o primeiro veículo, e no explorador de dados o seu nó **configuration** fica realçado e com o foco - o mesmo ao mudar para outro veículo. **Editar CVs do descodificador** abre então os valores diretamente.\n\n**Atribuir um modelo na janela de edição:** Um duplo clique ou clique direito numa linha abre a janela de edição. A linha **Modelo de descodificador** mostra o modelo atualmente reconhecido e oferece todos os modelos instalados. Com **inalterado** a configuração fica como está. Se for escolhido um modelo, ao aplicar substitui a configuração existente. Se o veículo não tiver descodificador, é criado um com o protocolo dcc. Aplicam-se as mesmas regras de protocolo que na importação (ver abaixo): com sx1 só são aceites os primeiros 5 valores; com mot, multi e analog a atribuição é recusada. Depois aparece o aviso sobre o endereço digital. Também este passo pode ser revertido com **Anular**.\n\nAssim, uma locomotiva pode primeiro ser criada e guardada no iTrain com valores predefinidos; os dados do descodificador são depois acrescentados aqui, no lugar certo.\nSe a área configuration ainda faltar completamente no veículo, é criada de novo na importação. Se já existir, é **totalmente substituída** - o programa pergunta antes, e **Anular** revoga a operação.\n\n**Modelos incluídos:** Desde a versão 2.5, os modelos de descodificador estão incluídos no programa. No primeiro arranque - e após cada nova versão do programa - são transferidos para a pasta de modelos de descodificador; a pasta é pedida na configuração inicial e pode ser alterada em qualquer momento em Preferências → Caminhos. A versão que chega depende do idioma do programa: alemão e neerlandês recebem os modelos alemães, todos os outros idiomas os modelos ingleses; seguir-se-ão mais traduções. Durante a transferência são substituídos ficheiros com o mesmo nome de uma entrega anterior - os modelos próprios com outros nomes permanecem intactos.\n\n**Atualizar e completar modelos:** O menu **Descodificador** da janela Descodificador tem dois itens. **Instalar modelos de descodificador** lê modelos individuais, mais recentes ou alterados - são fornecidos através da mesma ligação Proton Drive que o programa, como .csv ou .zip. Também permite ler um modelo criado por si próprio ou recebido, mesmo vários de uma vez; cada um é verificado antes de ser copiado, para que nenhum ficheiro de exportação comum acabe na pasta de modelos. **Modelos de descodificador** abre uma janela própria, redimensionável, com todos os modelos existentes mais um campo de pesquisa. Aí veem-se deliberadamente apenas o nome, a descrição e o número de entradas CV - os próprios valores só são mostrados ao importar para um veículo. Na parte inferior da janela constam a versão e a data de transferência da coleção incluída.\n\nO download é feito com os meios do sistema operativo: **Descarregar** abre a partilha Proton Drive no navegador, que contém a pasta **Decoder** com as atualizações. Na maioria dos navegadores o ficheiro acaba na pasta **Transferências** do sistema operativo.\n\nUm ficheiro de modelo contém apenas a área configuration, não uma entrada completa. O botão normal **Importar para categoria** rejeita por isso esses ficheiros com um aviso.\n\n**Importante - o endereço digital:** Um modelo contém sempre também o endereço digital (CV 1 ou CV 17/18) do veículo de onde originalmente provém. Após a importação, o programa mostra por isso um aviso: o valor no descodificador do veículo de destino é diferente e deve ser corrigido após iniciar o iTrain através de POM (programação na via principal) ou manualmente. Caso contrário, o iTrain dirige-se ao veículo com um endereço errado.\n\n**Versão de um arquivo de modelos:** Se um .zip descarregado contiver uma indicação de versão, esta é comparada ao instalar com a versão já presente. Se o arquivo escolhido não for mais recente, o programa pergunta e oferece **Manter o antigo** - assim, um ficheiro mais antigo escolhido por engano não sobrescreve silenciosamente os modelos mais recentes. Um passo atrás deliberado continua possível através de **Instalar mesmo assim**.\n\n**Ver e alterar valores CV:** Na janela **Modelos de descodificador**, **Editar CVs do descodificador** - ou um duplo clique na linha - abre o modelo selecionado na grande tabela de CV. Aí os valores podem ser vistos e alterados; **Guardar** escreve-os de novo no mesmo ficheiro, **Guardar como...** cria um modelo adicional com um novo nome. Os valores de um veículo editam-se da mesma forma através do explorador de dados: selecionar o nó **configuration** e clicar em **Editar CVs do descodificador**.\n\n**Nota sobre os modelos:** Os modelos incluídos foram derivados dos manuais em PDF dos fabricantes e muitas vezes contêm apenas partes da configuração completa do descodificador - no caso da ZIMO, por exemplo, textos muito longos que dificilmente cabem numa descrição. Mesmo assim, já há bastante utilizável: o descodificador pode ser consultado amplamente no iTrain via POM ou a via de programação. Se em alguns pontos não voltar nenhuma informação, o descodificador poderá não ser totalmente compatível com o modelo. É exatamente por isso que os modelos são ajustáveis e podem ser guardados com outro nome.\n\n**Nem todos os protocolos conhecem valores CV:** Que protocolo digital um veículo utiliza é mostrado no explorador de dados sob **decoder** no campo **protocol**. Disso depende o que uma importação pode assumir:\n- **dcc**, **fmz**, **ctc** e **sx2**: o modelo completo.\n- **sx1**: no máximo 5 valores. Se o modelo contiver mais, o programa pergunta e aplica apenas os primeiros 5.\n- **mot**, **multi** e **analog**: sem importação. Estes protocolos não têm configuração CV; o programa rejeita a tentativa com uma mensagem.\n\nA regra aplica-se igualmente às duas vias - para **Importar descodificador** na barra de ferramentas como para **Ler modelo** na janela de edição. Os valores introduzidos manualmente não são afetados por isto.\n\n**Vagões sem descodificador:** Muitos vagões não têm nenhum descodificador inserido no iTrain. Aí **não** basta inserir apenas a configuração - sem um descodificador associado, o iTrain não mostra de todo os valores CV. O programa pergunta por isso e, se desejado, cria logo um descodificador; o protocolo é escolhido nesse momento (dcc, fmz, ctc, sx2, sx1). Nas locomotivas fica-se por um aviso - uma locomotiva sem descodificador indica antes um erro no ficheiro.
help.decoderText.pl=W zakładkach **Lokomotywy** i **Wagony** podobszar **configuration** w eksploratorze danych opisuje wbudowany dekoder: jego wartości CV wraz z opisami. Ponieważ te dane są takie same dla danego typu dekodera, można je zapisać jako **szablon** i przenieść na inne pojazdy. Do tego w **oknie Dekoder** (przycisk **Dekoder** po prawej stronie wstążki w oknie głównym) znajdują się dwa przyciski na pasku narzędzi:\n\n- **Eksportuj dekoder** zapisuje obszar configuration wybranego pojazdu jako szablon w folderze szablonów dekoderów. Pyta o nazwę (która potem pojawi się w wyborze) i opcjonalnie o opis.\n- **Importuj dekoder** przenosi szablon na wybrany pojazd. Otwiera się lista wszystkich zainstalowanych szablonów z polem wyszukiwania; naciśnięcie klawisza przeskakuje do pierwszego szablonu zaczynającego się na tę literę, a nagłówki kolumn pozwalają zmienić sortowanie. Za pomocą **Wybierz plik...** można natomiast wczytać dowolny plik szablonu z dysku.\n\nZawsze musi być wybrany **dokładnie jeden** pojazd, ponieważ konfiguracja dekodera należy do dokładnie jednego pojazdu.\n\n**Jeden plik iTrain dla wszystkich części programu:** Okno Dekoder pracuje na tym samym pliku iTrain co okno główne i okno Systemy. Niezależnie od tego, w której części programu wczytano plik .tcdz/.tcd, obowiązuje on we wszystkich częściach aż do zamknięcia programu (lub wczytania innego). Na wstążce i w menu **Plik** okna Dekoder są do tego dwa przyciski:\n- **Wczytaj plik iTrain** wczytuje plik; pojawia się on od razu także w oknie głównym i w oknie Systemy.\n- **Zapisz do pliku iTrain** po potwierdzeniu zapisuje wszystkie zmiany bezpośrednio we wczytanym pliku. Wcześniej program tworzy kopię zapasową w folderze kopii. iTrain nie powinien mieć wtedy otwartego pliku.\n\n**Kolumny Dekoder i Szablon dekodera:** W zakładkach Lokomotywy i Wagony dwie dodatkowe kolumny pokazują, jaki dekoder jest wpisany i który szablon do niego pasuje. Szablon jest rozpoznawany po numerach CV istniejącej konfiguracji. Jeśli żaden zainstalowany szablon nie pasuje, widnieje **własna (n CV)**; bez konfiguracji kolumna pozostaje pusta.\n\n**Skok do konfiguracji:** Po wczytaniu w oknie Dekoder zaznaczony jest pierwszy pojazd, a w eksploratorze danych jego węzeł **configuration** jest wyróżniony i ma fokus - tak samo przy każdej zmianie na inny pojazd. **Edytuj CV dekodera** otwiera wtedy wartości bezpośrednio.\n\n**Przypisanie szablonu w oknie edycji:** Dwuklik lub prawy klik na wierszu otwiera okno edycji. Wiersz **Szablon dekodera** pokazuje aktualnie rozpoznany szablon i oferuje wybór spośród wszystkich zainstalowanych szablonów. Przy **bez zmian** konfiguracja pozostaje taka, jaka jest. Jeśli wybrano szablon, przy zatwierdzeniu zastępuje on istniejącą konfigurację. Jeśli pojazd nie ma dekodera, zostaje on utworzony z protokołem dcc. Obowiązują te same zasady protokołu co przy imporcie (patrz niżej): przy sx1 przejmowanych jest tylko pierwszych 5 wartości, przy mot, multi i analog przypisanie jest odrzucane. Następnie pojawia się uwaga o adresie cyfrowym. Również ten krok można wycofać przez **Cofnij**.\n\nW ten sposób lokomotywę można najpierw utworzyć i zapisać w iTrain z wartościami domyślnymi; dane dekodera dodaje się później tutaj, w odpowiednim miejscu.\nJeśli w pojeździe obszar configuration jeszcze całkowicie nie istnieje, jest tworzony na nowo przy imporcie. Jeśli już istnieje, jest **całkowicie zastępowany** - program pyta o to wcześniej, a **Cofnij** odwraca tę operację.\n\n**Dołączone szablony:** Od wersji 2.5 szablony dekoderów są zawarte w programie. Przy pierwszym starcie - i po każdej nowej wersji programu - są przenoszone do folderu szablonów dekoderów; o folder pyta się podczas pierwszej konfiguracji, a zmienić go można w każdej chwili w Preferencjach → Ścieżki. Która wersja dociera, zależy od języka programu: niemiecki i niderlandzki otrzymują niemieckie szablony, wszystkie inne języki - angielskie; kolejne tłumaczenia będą dodawane. Podczas przenoszenia zastępowane są pliki o tej samej nazwie z wcześniejszej dostawy - własne szablony o innych nazwach pozostają nietknięte.\n\n**Aktualizowanie i uzupełnianie szablonów:** W menu **Dekoder** okna Dekoder znajdują się dwie pozycje. **Zainstaluj szablony dekoderów** wczytuje pojedyncze, nowsze lub zmienione szablony - są one dostępne przez ten sam link Proton Drive co program, jako .csv lub .zip. Można w ten sposób wczytać także samodzielnie utworzony lub przesłany szablon, nawet kilka na raz; każdy jest sprawdzany przed skopiowaniem, aby do folderu szablonów nie trafił zwykły plik eksportu. **Szablony dekoderów** otwiera własne, skalowalne okno z wszystkimi istniejącymi szablonami oraz polem wyszukiwania. Widoczne są tam celowo tylko nazwa, opis i liczba wpisów CV - same wartości pokazuje dopiero import do pojazdu. Na dole okna znajdują się stan i data przeniesienia dołączonej kolekcji.\n\nPobieranie odbywa się środkami systemu operacyjnego: **Pobierz** otwiera udział Proton Drive w przeglądarce, gdzie znajduje się folder **Decoder** z aktualizacjami. W większości przeglądarek plik trafia do folderu **Pobrane** systemu operacyjnego.\n\nPlik szablonu zawiera tylko obszar configuration, nie pełny wpis. Zwykły przycisk **Importuj do kategorii** odrzuca więc takie pliki z komunikatem.\n\n**Ważne - adres cyfrowy:** Szablon zawiera zawsze także adres cyfrowy (CV 1 lub CV 17/18) pojazdu, z którego pierwotnie pochodzi. Po imporcie program wyświetla więc komunikat: wartość w dekoderze pojazdu docelowego jest inna i musi zostać poprawiona po starcie iTrain przez POM (programowanie na torze głównym) lub ręcznie. W przeciwnym razie iTrain będzie adresować pojazd pod błędnym adresem.\n\n**Wersja archiwum szablonów:** Jeśli pobrany plik .zip zawiera oznaczenie wersji, jest ono podczas instalacji porównywane z już obecnym stanem. Jeśli wybrane archiwum nie jest nowsze, program pyta i proponuje **Zachowaj starą** - dzięki temu przypadkowo wybrany starszy plik nie nadpisuje po cichu nowszych szablonów. Świadomy powrót jest wciąż możliwy przez **Zainstaluj mimo to**.\n\n**Przeglądanie i zmiana wartości CV:** W oknie **Szablony dekoderów** opcja **Edytuj CV dekodera** - lub dwuklik na wierszu - otwiera wybrany szablon w dużej tabeli CV. Tam wartości można przeglądać i zmieniać; **Zapisz** zapisuje je z powrotem w tym samym pliku, **Zapisz jako...** tworzy dodatkowy szablon pod nową nazwą. Wartości pojazdu edytuje się w ten sam sposób przez eksplorator danych: wybrać węzeł **configuration** i kliknąć **Edytuj CV dekodera**.\n\n**Uwaga dotycząca szablonów:** Dołączone szablony powstały na podstawie instrukcji PDF producentów i często zawierają tylko część całej konfiguracji dekodera - w przypadku ZIMO na przykład bardzo długie teksty, które z trudem mieszczą się w opisie. Mimo to już wiele z tego jest przydatne: dekoder można obszernie odpytać w iTrain przez POM lub tor programujący. Jeśli w niektórych miejscach nie wraca żadna informacja, dekoder może nie być w pełni kompatybilny z szablonem. Właśnie dlatego szablony można dostosowywać i zapisywać pod inną nazwą.\n\n**Nie każdy protokół zna wartości CV:** Jaki protokół cyfrowy używa pojazd, widać w eksploratorze danych pod **decoder** w polu **protocol**. Od tego zależy, co import może przejąć:\n- **dcc**, **fmz**, **ctc** i **sx2**: cały szablon.\n- **sx1**: maksymalnie 5 wartości. Jeśli szablon zawiera więcej, program pyta i przejmuje tylko pierwsze 5.\n- **mot**, **multi** i **analog**: brak importu. Te protokoły nie mają konfiguracji CV; program odrzuca próbę z komunikatem.\n\nReguła obowiązuje jednakowo dla obu ścieżek - dla **Importuj dekoder** na pasku narzędzi, jak i dla **Wczytaj szablon** w oknie edycji. Wartości wpisane ręcznie nie są przez to naruszane.\n\n**Wagony bez dekodera:** Wiele wagonów nie ma w iTrain wpisanego żadnego dekodera. Tam **nie** wystarczy wstawić samej konfiguracji - bez powiązanego dekodera iTrain wcale nie wyświetla wartości CV. Program pyta więc o to i na życzenie od razu tworzy dekoder; protokół wybiera się przy tym samodzielnie (dcc, fmz, ctc, sx2, sx1). Przy lokomotywach pozostaje przy ostrzeżeniu - lokomotywa bez dekodera wskazuje raczej na błąd w pliku.
help.decoderText.da=I fanerne **Lokomotiver** og **Vogne** beskriver underområdet **configuration** i dataudforskeren den indbyggede dekoder: dens CV-værdier med beskrivelser. Da disse oplysninger er ens for en given dekodertype, kan de gemmes som en **skabelon** og overføres til andre køretøjer. Til dette har **Dekoder-vinduet** (knappen **Dekoder** til højre i hovedvinduets bånd) to knapper i værktøjslinjen:\n\n- **Eksporter dekoder** gemmer configuration-området for det valgte køretøj som skabelon i mappen til dekoderskabeloner. Der spørges om en betegnelse (den vises senere i udvalget) og eventuelt en beskrivelse.\n- **Importer dekoder** overfører en skabelon til det valgte køretøj. Der åbnes en liste over alle installerede skabeloner med søgefelt; et tastetryk springer til den første skabelon med dette forbogstav, og via kolonneoverskrifterne kan der omsorteres. Med **Vælg fil...** kan en vilkårlig skabelonfil i stedet indlæses fra harddisken.\n\nDer skal altid være markeret **præcis ét** køretøj, fordi en dekoderkonfiguration hører til præcis ét køretøj.\n\n**Én iTrain-fil for alle programdele:** Dekoder-vinduet arbejder på samme iTrain-fil som hovedvinduet og Systemer-vinduet. Uanset i hvilken programdel en .tcdz/.tcd indlæses, gælder den i alle dele, indtil programmet afsluttes (eller en anden indlæses). I båndet og menuen **Fil** i Dekoder-vinduet findes to knapper til dette:\n- **Indlæs iTrain-fil** indlæser en fil; den vises straks også i hovedvinduet og Systemer-vinduet.\n- **Skriv til iTrain-fil** gemmer efter en bekræftelse alle ændringer direkte i den indlæste fil. Forinden laver programmet en sikkerhedskopi i backup-mappen. iTrain må ikke have filen åben.\n\n**Kolonnerne Dekoder og Dekoderskabelon:** I fanerne Lokomotiver og Vogne viser to ekstra kolonner, hvilken dekoder der er angivet, og hvilken skabelon der passer til den. Skabelonen genkendes på CV-numrene i den eksisterende konfiguration. Passer ingen installeret skabelon, står der **egen (n CV'er)**; uden konfiguration forbliver kolonnen tom.\n\n**Spring til konfigurationen:** Efter indlæsning er det første køretøj markeret i Dekoder-vinduet, og i dataudforskeren er dets knude **configuration** fremhævet og har fokus - ligeledes ved hvert skift til et andet køretøj. **Rediger dekoder-CV'er** åbner så værdierne direkte.\n\n**Tildel skabelon i redigeringsvinduet:** Et dobbeltklik eller højreklik på en linje åbner redigeringsvinduet. Linjen **Dekoderskabelon** viser den aktuelt genkendte skabelon og tilbyder et valg mellem alle installerede skabeloner. Ved **uændret** forbliver konfigurationen, som den er. Vælges en skabelon, erstatter den ved overtagelsen den eksisterende konfiguration. Mangler køretøjet en dekoder, oprettes den med protokollen dcc. Samme protokolregler som ved import gælder (se nedenfor): ved sx1 overtages kun de første 5 værdier, ved mot, multi og analog afvises tildelingen. Derefter vises bemærkningen om den digitale adresse. Også dette trin kan fortrydes med **Fortryd**.\n\nSådan kan et lokomotiv først oprettes og gemmes i iTrain med standardværdier; dekoderdataene tilføjes derefter her på det rigtige sted.\nMangler configuration-området helt i køretøjet, oprettes det på ny ved importen. Findes det allerede, bliver det **fuldstændig udskiftet** - programmet spørger forinden, og **Fortryd** gør handlingen om igen.\n\n**Medfølgende skabeloner:** Siden version 2.5 er dekoderskabelonerne indeholdt i programmet. Ved første start - og efter hver ny programversion - overføres de til mappen til dekoderskabeloner; mappen efterspørges ved den første opsætning og kan til enhver tid ændres under Præferencer → Stier. Hvilken udgave der ankommer, afhænger af programsproget: tysk og hollandsk får de tyske skabeloner, alle andre sprog de engelske; flere oversættelser følger. Ved overførslen udskiftes filer med samme navn fra en tidligere levering - egne skabeloner med andre navne forbliver urørte.\n\n**Opdatere og udbygge skabeloner:** Menuen **Dekoder** i Dekoder-vinduet har to punkter. **Installer dekoderskabeloner** indlæser enkelte, nyere eller ændrede skabeloner - de stilles til rådighed via samme Proton Drive-link som programmet, som .csv eller .zip. Der kan på samme måde indlæses en selv registreret eller tilsendt skabelon, også flere på én gang; hver enkelt kontrolleres før kopieringen, så der ikke lander en almindelig eksportfil i skabelonmappen. **Dekoderskabeloner** åbner et eget, størrelsesændringsbart vindue med alle tilstedeværende skabeloner plus søgefelt. Der ses med vilje kun betegnelse, beskrivelse og antallet af CV-poster - selve værdierne vises først ved importen til et køretøj. Nederst i vinduet står stand og overførselsdato for den medfølgende samling.\n\nDownloadet sker med operativsystemets midler: **Download** åbner Proton Drive-delingen i browseren, hvori mappen **Decoder** med opdateringerne findes. I de fleste browsere lander filen i operativsystemets **Downloads**-mappe.\n\nEn skabelonfil indeholder kun configuration-området, ikke en fuldstændig post. Den normale knap **Importer i kategori** afviser derfor sådanne filer med en meddelelse.\n\n**Vigtigt - digitaladressen:** En skabelon indeholder altid også digitaladressen (CV 1 hhv. CV 17/18) for det køretøj, den oprindeligt stammer fra. Efter importen viser programmet derfor en meddelelse: værdien i målkøretøjets dekoder er en anden og skal rettes efter start af iTrain via POM (programmering på hovedskinnen) eller manuelt. I modsat fald tiltaler iTrain køretøjet under en forkert adresse.\n\n**Version af et skabelonarkiv:** Indeholder en downloadet .zip en versionsangivelse, sammenlignes den ved installationen med den allerede tilstedeværende stand. Er det valgte arkiv ikke nyere, spørger programmet og tilbyder **Bevar gammel** - så en ved en fejl valgt ældre fil ikke i stilhed overskriver de nyere skabeloner. Et bevidst skridt tilbage er stadig muligt via **Installer alligevel**.\n\n**Se og ændre CV-værdier:** I vinduet **Dekoderskabeloner** åbner **Rediger dekoder-CV'er** - eller et dobbeltklik på linjen - den markerede skabelon i den store CV-tabel. Der kan værdierne ses og ændres; **Gem** skriver dem tilbage til samme fil, **Gem som...** opretter en yderligere skabelon under et nyt navn. Værdierne for et køretøj redigerer du på samme måde via dataudforskeren: vælg knuden **configuration** og klik på **Rediger dekoder-CV'er**.\n\n**Bemærkning om skabelonerne:** De medfølgende skabeloner er udledt af producenternes pdf-vejledninger og indeholder ofte kun dele af den samlede dekoderkonfiguration - i tilfældet ZIMO for eksempel meget lange tekster, der næsten ikke passer ind i en beskrivelse. Alligevel er der allerede noget brugbart: dekoderen kan forespørges omfattende i iTrain via POM eller programmeringssporet. Kommer der ingen information tilbage på nogle punkter, er dekoderen muligvis ikke fuldt kompatibel med skabelonen. Netop derfor kan skabelonerne justeres og gemmes under et andet navn.\n\n**Ikke alle protokoller kender CV-værdier:** Hvilken digitalprotokol et køretøj bruger, står i dataudforskeren under **decoder** i feltet **protocol**. Det afgør, hvad en import må overtage:\n- **dcc**, **fmz**, **ctc** og **sx2**: hele skabelonen.\n- **sx1**: højst 5 værdier. Indeholder skabelonen flere, spørger programmet og overtager kun de første 5.\n- **mot**, **multi** og **analog**: ingen import. Disse protokoller har ingen CV-konfiguration; programmet afviser forsøget med en meddelelse.\n\nReglen gælder ens for begge veje - for **Importer dekoder** i værktøjslinjen såvel som for **Indlæs skabelon** i redigeringsvinduet. Manuelt indtastede værdier påvirkes ikke af dette.\n\n**Vogne uden dekoder:** Mange vogne har i iTrain slet ingen dekoder angivet. Der er det **ikke** nok blot at indsætte konfigurationen - uden en tilhørende dekoder viser iTrain slet ikke CV-værdierne. Programmet spørger derfor og opretter efter ønske straks en dekoder med; protokollen vælges i den forbindelse (dcc, fmz, ctc, sx2, sx1). Ved lokomotiver forbliver det ved en advarsel - et lokomotiv uden dekoder tyder snarere på en fejl i filen.
help.decoderText.sv=I flikarna **Lok** och **Vagnar** beskriver underområdet **configuration** i datautforskaren den inbyggda dekodern: dess CV-värden tillsammans med beskrivningar. Eftersom dessa uppgifter är samma för en given dekodertyp kan de sparas som en **mall** och föras över till andra fordon. För detta finns i **Dekoder-fönstret** (knappen **Dekoder** till höger i huvudfönstrets menyfliksområde) två knappar i verktygsfältet:\n\n- **Exportera dekoder** sparar configuration-området för det valda fordonet som mall i mappen för dekodermallar. Programmet frågar efter ett namn (som senare visas i urvalet) och valfritt en beskrivning.\n- **Importera dekoder** för över en mall till det valda fordonet. En lista över alla installerade mallar öppnas med sökfält; ett tangenttryck hoppar till den första mallen med den bokstaven, och via kolumnrubrikerna kan man sortera om. Med **Välj fil...** kan man i stället läsa in en godtycklig mallfil från disken.\n\nDet måste alltid vara **exakt ett** fordon markerat, eftersom en dekoderkonfiguration hör till exakt ett fordon.\n\n**En iTrain-fil för alla programdelar:** Dekoder-fönstret arbetar med samma iTrain-fil som huvudfönstret och System-fönstret. Oavsett i vilken programdel en .tcdz/.tcd läses in gäller den i alla delar tills programmet avslutas (eller en annan läses in). I menyfliksområdet och menyn **Arkiv** i Dekoder-fönstret finns två knappar för detta:\n- **Läs in iTrain-fil** läser in en fil; den visas genast även i huvudfönstret och System-fönstret.\n- **Skriv till iTrain-fil** sparar efter en bekräftelse alla ändringar direkt i den inlästa filen. Innan dess gör programmet en säkerhetskopia i säkerhetskopiemappen. iTrain får inte ha filen öppen.\n\n**Kolumnerna Dekoder och Dekodermall:** I flikarna Lok och Vagnar visar två extra kolumner vilken dekoder som är angiven och vilken mall som passar till den. Mallen känns igen på CV-numren i den befintliga konfigurationen. Passar ingen installerad mall står det **egen (n CV:er)**; utan konfiguration förblir kolumnen tom.\n\n**Hopp till konfigurationen:** Efter inläsning är det första fordonet markerat i Dekoder-fönstret, och i datautforskaren är dess nod **configuration** framhävd och har fokus - likaså vid varje byte till ett annat fordon. **Redigera dekoderns CV** öppnar då värdena direkt.\n\n**Tilldela mall i redigeringsfönstret:** Ett dubbelklick eller högerklick på en rad öppnar redigeringsfönstret. Raden **Dekodermall** visar den mall som för närvarande känns igen och erbjuder ett val bland alla installerade mallar. Vid **oförändrad** förblir konfigurationen som den är. Väljs en mall ersätter den vid övertagandet den befintliga konfigurationen. Saknar fordonet en dekoder skapas den med protokollet dcc. Samma protokollregler som vid import gäller (se nedan): vid sx1 tas bara de första 5 värdena över, vid mot, multi och analog avvisas tilldelningen. Därefter visas anmärkningen om den digitala adressen. Även detta steg kan ångras med **Ångra**.\n\nSå kan ett lok först skapas och sparas i iTrain med standardvärden; dekoderdata läggs sedan till här på rätt plats.\nSaknas configuration-området helt i fordonet, skapas det på nytt vid importen. Finns det redan, blir det **helt utbytt** - programmet frågar innan, och **Ångra** gör åtgärden ogjord igen.\n\n**Medföljande mallar:** Sedan version 2.5 ingår dekodermallarna i programmet. Vid den första starten - och efter varje ny programversion - förs de över till mappen för dekodermallar; mappen efterfrågas vid förstagångsinställningen och kan när som helst ändras under Alternativ → Sökvägar. Vilken version som anländer beror på programspråket: tyska och nederländska får de tyska mallarna, alla andra språk de engelska; fler översättningar följer. Vid överföringen ersätts filer med samma namn från en tidigare leverans - egna mallar med andra namn förblir orörda.\n\n**Uppdatera och komplettera mallar:** Menyn **Dekoder** i Dekoder-fönstret har två punkter. **Installera dekodermallar** läser in enskilda, nyare eller ändrade mallar - de tillhandahålls via samma Proton Drive-länk som programmet, som .csv eller .zip. Likaså kan man läsa in en själv registrerad eller mottagen mall, även flera på en gång; varje kontrolleras innan kopieringen, så att ingen vanlig exportfil hamnar i mallmappen. **Dekodermallar** öppnar ett eget, storleksändringsbart fönster med alla befintliga mallar plus sökfält. Där syns medvetet bara namn, beskrivning och antal CV-poster - själva värdena visas först vid import till ett fordon. Längst ner i fönstret står status och överföringsdatum för den medföljande samlingen.\n\nNedladdningen sker med operativsystemets medel: **Ladda ner** öppnar Proton Drive-delningen i webbläsaren, som innehåller mappen **Decoder** med uppdateringarna. I de flesta webbläsare hamnar filen i operativsystemets mapp **Nedladdningar**.\n\nEn mallfil innehåller bara configuration-området, inte en fullständig post. Den vanliga knappen **Importera till kategori** avvisar därför sådana filer med ett meddelande.\n\n**Viktigt - digitaladressen:** En mall innehåller alltid även digitaladressen (CV 1 resp. CV 17/18) för det fordon den ursprungligen kommer från. Efter importen visar programmet därför ett meddelande: värdet i målfordonets dekoder är ett annat och måste rättas efter start av iTrain via POM (programmering på huvudspåret) eller för hand. Annars adresserar iTrain fordonet med fel adress.\n\n**Version av ett mallarkiv:** Innehåller en nedladdad .zip en versionsuppgift, jämförs den vid installationen med den redan befintliga statusen. Är det valda arkivet inte nyare, frågar programmet och erbjuder **Behåll gammal** - så att en av misstag vald äldre fil inte i tysthet skriver över de nyare mallarna. Ett medvetet steg tillbaka är fortfarande möjligt via **Installera trots allt**.\n\n**Visa och ändra CV-värden:** I fönstret **Dekodermallar** öppnar **Redigera dekoderns CV** - eller ett dubbelklick på raden - den markerade mallen i den stora CV-tabellen. Där kan värdena visas och ändras; **Spara** skriver dem tillbaka till samma fil, **Spara som...** skapar en ytterligare mall under ett nytt namn. Värdena för ett fordon redigerar du på samma sätt via datautforskaren: välj noden **configuration** och klicka på **Redigera dekoderns CV**.\n\n**Anmärkning om mallarna:** De medföljande mallarna har härletts från tillverkarnas PDF-manualer och innehåller ofta bara delar av hela dekoderkonfigurationen - i fallet ZIMO exempelvis mycket långa texter som knappt får plats i en beskrivning. Trots det är redan en hel del användbart: dekodern kan avfrågas omfattande i iTrain via POM eller programmeringsspåret. Kommer det ingen information tillbaka på vissa ställen, är dekodern möjligen inte helt kompatibel med mallen. Just därför är mallarna anpassningsbara och kan sparas under ett annat namn.\n\n**Inte alla protokoll känner till CV-värden:** Vilket digitalprotokoll ett fordon använder står i datautforskaren under **decoder** i fältet **protocol**. Det avgör vad en import får ta över:\n- **dcc**, **fmz**, **ctc** och **sx2**: hela mallen.\n- **sx1**: högst 5 värden. Innehåller mallen fler, frågar programmet och tar bara över de första 5.\n- **mot**, **multi** och **analog**: ingen import. Dessa protokoll har ingen CV-konfiguration; programmet avvisar försöket med ett meddelande.\n\nRegeln gäller lika för båda vägarna - för **Importera dekoder** i verktygsfältet såväl som för **Läs in mall** i redigeringsfönstret. Manuellt inmatade värden påverkas inte av detta.\n\n**Vagnar utan dekoder:** Många vagnar har i iTrain ingen dekoder alls angiven. Där räcker det **inte** att bara infoga konfigurationen - utan en tillhörande dekoder visar iTrain inte alls CV-värdena. Programmet frågar därför och skapar på önskemål genast en dekoder också; protokollet väljer man då själv (dcc, fmz, ctc, sx2, sx1). För lok stannar det vid en varning - ett lok utan dekoder tyder snarare på ett fel i filen.

editor.decoderNoDecoderElement.de="{0}" hat in iTrain gar keinen Decoder zugewiesen (kein <decoder>-Element).\n\nEine CV-Konfiguration ohne zugewiesenen Decoder ist eigentlich widersprüchlich - der Decoder sollte zuerst in iTrain eingetragen werden.\n\nTrotzdem fortfahren?
editor.decoderNoDecoderElement.en="{0}" has no decoder assigned in iTrain (no <decoder> element).\n\nA CV configuration without an assigned decoder is contradictory - the decoder should be entered in iTrain first.\n\nContinue anyway?
editor.decoderNoDecoderElement.nl="{0}" heeft in iTrain helemaal geen decoder toegewezen (geen <decoder>-element).\n\nEen CV-configuratie zonder toegewezen decoder is eigenlijk tegenstrijdig - de decoder zou eerst in iTrain moeten worden ingevoerd.\n\nToch doorgaan?
editor.decoderNoDecoderElement.fr=« {0} » n'a aucun décodeur attribué dans iTrain (pas d'élément <decoder>).\n\nUne configuration CV sans décodeur attribué est en fait contradictoire - le décodeur devrait d'abord être renseigné dans iTrain.\n\nContinuer quand même ?
editor.decoderNoDecoderElement.es=«{0}» no tiene ningún decoder asignado en iTrain (falta el elemento <decoder>).\n\nUna configuración CV sin decoder asignado es en realidad contradictoria: el decoder debería introducirse primero en iTrain.\n\n¿Continuar de todos modos?
editor.decoderNoDecoderElement.it=«{0}» non ha alcun decoder assegnato in iTrain (nessun elemento <decoder>).\n\nUna configurazione CV senza decoder assegnato è in realtà contraddittoria: il decoder andrebbe prima inserito in iTrain.\n\nContinuare comunque?
editor.decoderNoDecoderElement.pt="{0}" não tem qualquer descodificador atribuído no iTrain (sem elemento <decoder>).\n\nUma configuração CV sem descodificador atribuído é contraditória - o descodificador deveria ser introduzido primeiro no iTrain.\n\nContinuar mesmo assim?
editor.decoderNoDecoderElement.pl=„{0}” nie ma w iTrain przypisanego żadnego dekodera (brak elementu <decoder>).\n\nKonfiguracja CV bez przypisanego dekodera jest w istocie sprzeczna - dekoder należałoby najpierw wprowadzić w iTrain.\n\nMimo to kontynuować?
editor.decoderNoDecoderElement.da="{0}" har slet ingen dekoder tildelt i iTrain (intet <decoder>-element).\n\nEn CV-konfiguration uden tildelt dekoder er egentlig modstridende - dekoderen bør først indtastes i iTrain.\n\nFortsæt alligevel?
editor.decoderNoDecoderElement.sv="{0}" har ingen dekoder tilldelad i iTrain (inget <decoder>-element).\n\nEn CV-konfiguration utan tilldelad dekoder är egentligen motsägelsefull - dekodern bör först anges i iTrain.\n\nFortsätta ändå?

editor.decoderAddressWarning.de=Achtung! Die Digital-Adresse stammt aus einer Vorlage und entspricht nicht dem tatsächlichen Wert!\nNach dem Start von iTrain muss der Wert über POM oder manuell geändert werden.
editor.decoderAddressWarning.en=Attention! The digital address comes from a template and does not match the actual value!\nAfter starting iTrain, the value must be changed via POM or manually.
editor.decoderAddressWarning.nl=Let op! Het digitale adres komt uit een sjabloon en komt niet overeen met de werkelijke waarde!\nNa het starten van iTrain moet de waarde via POM of handmatig worden gewijzigd.
editor.decoderAddressWarning.fr=Attention ! L'adresse numérique provient d'un modèle et ne correspond pas à la valeur réelle !\nAprès le démarrage d'iTrain, la valeur doit être modifiée via POM ou manuellement.
editor.decoderAddressWarning.es=¡Atención! La dirección digital procede de una plantilla y no corresponde al valor real.\nTras iniciar iTrain, el valor debe cambiarse mediante POM o manualmente.
editor.decoderAddressWarning.it=Attenzione! L'indirizzo digitale proviene da un modello e non corrisponde al valore reale!\nDopo l'avvio di iTrain, il valore deve essere modificato tramite POM o manualmente.
editor.decoderAddressWarning.pt=Atenção! O endereço digital vem de um modelo e não corresponde ao valor real!\nApós iniciar o iTrain, o valor tem de ser alterado através de POM ou manualmente.
editor.decoderAddressWarning.pl=Uwaga! Adres cyfrowy pochodzi z szablonu i nie odpowiada rzeczywistej wartości!\nPo uruchomieniu iTrain wartość należy zmienić za pomocą POM lub ręcznie.
editor.decoderAddressWarning.da=Bemærk! Den digitale adresse stammer fra en skabelon og svarer ikke til den faktiske værdi!\nEfter start af iTrain skal værdien ændres via POM eller manuelt.
editor.decoderAddressWarning.sv=Observera! Den digitala adressen kommer från en mall och motsvarar inte det faktiska värdet!\nEfter start av iTrain måste värdet ändras via POM eller manuellt.

