bidib.connectFailedBusy.de=Wahrscheinlich besteht bereits eine Verbindung mit einem anderen Programm (z.B. iTrain oder BiDiB-Wizard) - das Gerät lässt nur eine Verbindung gleichzeitig zu.
bidib.connectFailedBusy.en=Probably another program (e.g. iTrain or BiDiB-Wizard) is already connected - the device allows only one connection at a time.
bidib.connectFailedBusy.nl=Waarschijnlijk is er al een verbinding met een ander programma (bijv. iTrain of BiDiB-Wizard) - het apparaat staat maar één verbinding tegelijk toe.
bidib.connectFailedBusy.fr=Un autre programme (p. ex. iTrain ou BiDiB-Wizard) est probablement déjà connecté - l'appareil n'accepte qu'une seule connexion à la fois.
