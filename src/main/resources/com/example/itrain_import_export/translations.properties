ecos.dialogTitle.sv=ESU ECoS-anslutning
ecos.hint.de=Das Programm sucht beim Öffnen automatisch nach ECoS-Geräten im lokalen Netz (Port 15471, ohne echtes Discovery-Protokoll - siehe Hilfe).\nGefundene Geräte erscheinen in der Liste, oder die IP-Adresse von Hand eintragen.\nDie ECoS muss eingeschaltet und im selben Netz sein.\nGelesen wird nur - es wird nichts an der ECoS verändert.
ecos.hint.en=The program automatically searches for ECoS devices on the local network when opened (port 15471, no real discovery protocol - see help).\nFound devices appear in the list, or enter the IP address manually.\nThe ECoS must be switched on and in the same network.\nRead only - nothing on the ECoS is changed.
ecos.hint.nl=Het programma zoekt bij het openen automatisch naar ECoS-apparaten in het lokale netwerk (poort 15471, geen echt discovery-protocol - zie help).\nGevonden apparaten verschijnen in de lijst, of voer het IP-adres handmatig in.\nDe ECoS moet aan staan en in hetzelfde netwerk zijn.\nEr wordt alleen gelezen - er wordt niets aan de ECoS gewijzigd.
ecos.hint.fr=Le programme recherche automatiquement les ECoS sur le réseau local à l'ouverture (port 15471, sans véritable protocole de découverte - voir l'aide).\nLes appareils trouvés apparaissent dans la liste, ou saisissez l'adresse IP manuellement.\nL'ECoS doit être allumée et dans le même réseau.\nLecture seule - rien n'est modifié sur l'ECoS.
ecos.hint.es=El programa busca automáticamente dispositivos ECoS en la red local al abrirse (puerto 15471, sin un protocolo de descubrimiento real - véase la ayuda).\nLos dispositivos encontrados aparecen en la lista, o introduzca la dirección IP manualmente.\nLa ECoS debe estar encendida y en la misma red.\nSolo lectura - no se cambia nada en la ECoS.
ecos.hint.it=Il programma cerca automaticamente dispositivi ECoS nella rete locale all'apertura (porta 15471, senza un vero protocollo di discovery - vedi la guida).\nI dispositivi trovati appaiono nell'elenco, oppure inserire l'indirizzo IP manualmente.\nLa ECoS deve essere accesa e nella stessa rete.\nSola lettura - nulla viene modificato sulla ECoS.
ecos.hint.pt=O programa procura automaticamente dispositivos ECoS na rede local ao abrir (porta 15471, sem um verdadeiro protocolo de descoberta - ver a ajuda).\nOs dispositivos encontrados aparecem na lista, ou introduza o endereço IP manualmente.\nA ECoS tem de estar ligada e na mesma rede.\nApenas leitura - nada é alterado na ECoS.
ecos.hint.pl=Program przy otwarciu automatycznie szuka urządzeń ECoS w sieci lokalnej (port 15471, bez rzeczywistego protokołu wykrywania - zob. pomoc).\nZnalezione urządzenia pojawiają się na liście, albo wpisz adres IP ręcznie.\nECoS musi być włączony i w tej samej sieci.\nTylko odczyt - nic w ECoS nie jest zmieniane.
ecos.hint.da=Programmet søger automatisk efter ECoS-enheder på det lokale netværk, når det åbnes (port 15471, uden en rigtig discovery-protokol - se hjælpen).\nFundne enheder vises i listen, eller indtast IP-adressen manuelt.\nECoS skal være tændt og i samme netværk.\nDer læses kun - intet ændres på ECoS.
ecos.hint.sv=Programmet söker automatiskt efter ECoS-enheter i det lokala nätverket när det öppnas (port 15471, utan ett riktigt discovery-protokoll - se hjälpen).\nHittade enheter visas i listan, eller ange IP-adressen manuellt.\nECoS måste vara påslagen och i samma nätverk.\nEndast läsning - inget ändras på ECoS.
