help.threeWindowsText.de=Seit Version 3.0 beta besteht das Programm aus drei Teilen, die jeweils ein eigenes Fenster haben. \nImport/Export ist das Hauptfenster; Decoder und Systeme öffnest du über die beiden Knöpfe **rechts im Ribbon** des Hauptfensters. \nAlle drei arbeiten auf **derselben** iTrain-Datei: Egal in welchem Programmteil eine .tcdz/.tcd geladen wird, sie gilt bis zum Beenden des Programms (oder bis eine andere geladen wird) in allen Teilen. Änderungen aus einem Fenster sind in den anderen sofort sichtbar; Speichern und Rückgängig gelten für alle.\n\n**iTrain Import/Export - Teil 1**\nDieser Programmteil dient dazu, vorhandene iTrain-Dateien zu ergänzen oder einzelne Kategorien zu exportieren, damit andere das importieren können.\nHier passiert alles, was in den vorigen Abschnitten beschrieben ist: Datei öffnen, Kategorien ansehen und bearbeiten, Einträge exportieren und importieren. \nNur hier gibt es das Menü **Einstellungen**; **Datei → Programm beenden** schließt das ganze Programm, **Datei → Aktuelle schließen** nur die Datei.\n\n**iTrain Import/Export Decoder - Teil 2**\nDieser Programmteil dient dazu, Decoder-Vorlagen zu den Lokomotiven oder Wagen in einer iTrain-Datei hinzuzufügen. Grundlage ist immer eine bereits vorhandene iTrain-Datei.\nIst eine Datei geladen, zeigt das Decoder-Fenster sie sofort; **iTrain-Datei laden** lädt eine andere für alle Programmteile, **In iTrain-Datei schreiben** speichert sie mit vorheriger Sicherung. Gezeigt werden nur die Reiter **Lokomotiven** und **Wagen**, ergänzt um die Spalten **Decoder** und **Decoder-Vorlage**. Ein Doppelklick oder Rechtsklick auf eine Zeile (oder das **+**) öffnet ein Bearbeitungsfenster mit den wichtigsten Angaben (Name, Beschreibung, Loktyp bzw. Wagentyp, Länge, Decoder-Typ, UID, Adresse, Schnittstelle, Knoten) und der Auswahl einer **Decoder-Vorlage**. Loktyp (Sonstiges, Dampf, Diesel, Elektrisch, Wasserstoff, Batterie) und Decoder-Typ (DCC 14 bis Analog) bieten dieselbe Auswahl wie iTrain; alle übrigen Felder bleiben, wie im Hauptfenster, über **Daten ändern** erreichbar. Das Fenster hat eigene Menüs (Datei, Bearbeiten, Decoder, Hilfe) und ein eigenes Ribbon mit Öffnen, Speichern, Rückgängig, Wiederholen, **Decoder exportieren**, **Decoder importieren**, **Decoder erfassen** sowie rechts **iTrain-Datei laden** und **In iTrain-Datei schreiben**. Das Menü **Decoder** enthält dieselben drei Funktionen sowie **Decoder-Vorlagen** und **Decoder-Vorlagen installieren**; die Hilfe zu Decodern steht im Menü **Hilfe** dieses Fensters.\n\n**iTrain Import/Export Systeme - Teil 3**\nDieser Programmteil dient dazu, ein BiDiB- oder ESU-(ECoS-)System auszulesen und die darin enthaltenen Daten in eine iTrain-Datei zu überführen.\nAndere Systeme werden folgen.\nEin System lässt sich auslesen, Teile oder der gesamte Inhalt lassen sich exportieren und anschließend in eine iTrain-Datei einfügen - das klappt auch mit einer fast leeren Datei zum Start: Datei in iTrain nur rudimentär anlegen, über den Programmteil **Systeme** alles Nötige auslesen und als Import in die rudimentäre Datei übertragen, danach von Hand nachbearbeiten.\nIm Menü **Systeme** stehen die Untermenüs für die einzelnen Digitalsysteme (BiDiB, ESU ECoS; Märklin, Z21, Lokstore und ZIMO sind vorbereitet, aber noch ohne Funktion): **Verbinden**, **Auslesen** und, bei BiDiB zusätzlich, **System-Datei laden**. Aus dem Auslesen entsteht ein Knotenbaum bzw. eine Objektliste mit **Schnittstelle**, **Booster**, **Rückmelder** und **Zubehör** (bei ECoS zusätzlich **Lokomotiven**) - diese Tabelle lässt sich bearbeiten, als System-Datei speichern und schließlich in die geöffnete iTrain-Datei übernehmen.\n\nAlle drei Fenster merken sich Größe, Position und Bildschirm jeweils für sich. **Bearbeiten → Alle Fenster zentrieren** im Hauptfenster holt die Zusatzfenster zum Hauptfenster zurück. Beim Beenden des Programms werden die Zusatzfenster mitgeschlossen.
help.threeWindowsText.en=Since version 3.0 beta the program consists of three parts, each with its own window.\nImport/Export is the main window; you open Decoder and Systems via the two buttons **on the right of the ribbon** in the main window.\nAll three work on the **same** iTrain file: no matter in which part a .tcdz/.tcd is loaded, it applies in all parts until the program is closed (or another file is loaded). Changes made in one window are immediately visible in the others; Save and Undo apply to all.\n\n**iTrain Import/Export - Part 1**\nThis part is used to complete existing iTrain files or to export individual categories so that others can import them.\nEverything described in the previous sections happens here: open a file, view and edit categories, export and import entries.\nOnly here is there a **Settings** menu; **File → Quit program** closes the whole program, **File → Close current** closes only the file.\n\n**iTrain Import/Export Decoder - Part 2**\nThis part is used to add decoder templates to the locomotives or wagons in an iTrain file. It always requires an already existing iTrain file as its basis.\nIf a file is loaded, the Decoder window shows it immediately; **Load iTrain file** loads another one for all program parts, **Write to iTrain file** saves it after making a backup. Only the **Locomotives** and **Wagons** tabs are shown, extended by the **Decoder** and **Decoder template** columns. Double-clicking or right-clicking a row (or the **+**) opens an editing window with the most important details (name, description, locomotive or wagon type, length, decoder type, UID, address, interface, node) and the choice of a **Decoder template**. Locomotive type (Other, Steam, Diesel, Electric, Hydrogen, Battery) and decoder type (DCC 14 to Analog) offer the same choice as iTrain; all other fields remain reachable, as in the main window, via **Change data**. The window has its own menus (File, Edit, Decoder, Help) and its own ribbon with Open, Save, Undo, Redo, **Export decoder**, **Import decoder**, **Capture decoder** and, on the right, **Load iTrain file** and **Write to iTrain file**. The **Decoder** menu contains the same three functions plus **Decoder templates** and **Install decoder templates**; help on decoders is in this window's **Help** menu.\n\n**iTrain Import/Export Systems - Part 3**\nThis part is used to read out a BiDiB or ESU (ECoS) system and transfer the data it contains into an iTrain file.\nOther systems will follow.\nA system can be read out, and parts or all of its content can be exported and then inserted into an iTrain file - this also works with an almost empty file to start with: create the file in iTrain only rudimentarily, read out everything needed via the **Systems** part and transfer it as an import into the rudimentary file, then finish it by hand.\nThe **Systems** menu has submenus for the individual digital systems (BiDiB, ESU ECoS; Märklin, Z21, Lokstore and ZIMO are prepared but not yet functional): **Connect**, **Read out** and, additionally for BiDiB, **Load system file**. Reading out produces a node tree or an object list with **Interface**, **Booster**, **Feedback** and **Accessory** (for ECoS also **Locomotives**) - this table can be edited, saved as a system file, and finally applied to the open iTrain file.\n\nAll three windows remember their size, position and screen individually. **Edit → Center all windows** in the main window brings the additional windows back to the main window. When the program is closed, the additional windows are closed as well.
help.threeWindowsText.nl=Sinds versie 3.0 beta bestaat het programma uit drie onderdelen, die elk een eigen venster hebben.\nImport/Export is het hoofdvenster; Decoder en Systemen open je via de twee knoppen **rechts in het lint** van het hoofdvenster.\nAlle drie werken op **hetzelfde** iTrain-bestand: ongeacht in welk programmadeel een .tcdz/.tcd wordt geladen, het geldt tot het afsluiten van het programma (of tot een ander bestand wordt geladen) in alle delen. Wijzigingen in het ene venster zijn in de andere direct zichtbaar; Opslaan en Ongedaan maken gelden voor alle.\n\n**iTrain Import/Export - Deel 1**\nDit onderdeel dient om bestaande iTrain-bestanden aan te vullen of afzonderlijke categorieën te exporteren, zodat anderen dit kunnen importeren.\nHier gebeurt alles wat in de vorige hoofdstukken is beschreven: bestand openen, categorieën bekijken en bewerken, items exporteren en importeren.\nAlleen hier is het menu **Instellingen** te vinden; **Bestand → Programma afsluiten** sluit het hele programma, **Bestand → Huidige sluiten** alleen het bestand.\n\n**iTrain Import/Export Decoder - Deel 2**\nDit onderdeel dient om decodersjablonen toe te voegen aan de locomotieven of wagons in een iTrain-bestand. De basis is altijd een reeds bestaand iTrain-bestand.\nIs er een bestand geladen, dan toont het Decoder-venster dit direct; **iTrain-bestand laden** laadt een ander voor alle programmadelen, **Naar iTrain-bestand schrijven** slaat het op na een back-up. Getoond worden alleen de tabbladen **Locomotieven** en **Wagons**, aangevuld met de kolommen **Decoder** en **Decodersjabloon**. Een dubbelklik of rechtsklik op een rij (of de **+**) opent een bewerkingsvenster met de belangrijkste gegevens (naam, beschrijving, loctype of wagontype, lengte, decodertype, UID, adres, interface, knooppunt) en de keuze van een **Decodersjabloon**. Loctype (Overig, Stoom, Diesel, Elektrisch, Waterstof, Batterij) en decodertype (DCC 14 tot Analog) bieden dezelfde keuze als iTrain; alle overige velden blijven, net als in het hoofdvenster, bereikbaar via **Gegevens wijzigen**. Het venster heeft eigen menu's (Bestand, Bewerken, Decoder, Help) en een eigen lint met Openen, Opslaan, Ongedaan maken, Opnieuw, **Decoder exporteren**, **Decoder importeren**, **Decoder vastleggen** en rechts **iTrain-bestand laden** en **Naar iTrain-bestand schrijven**. Het menu **Decoder** bevat dezelfde drie functies plus **Decodersjablonen** en **Decodersjablonen installeren**; de help over decoders staat in het menu **Help** van dit venster.\n\n**iTrain Import/Export Systemen - Deel 3**\nDit onderdeel dient om een BiDiB- of ESU-(ECoS-)systeem uit te lezen en de daarin aanwezige gegevens over te brengen naar een iTrain-bestand.\nAndere systemen volgen later.\nEen systeem kan worden uitgelezen, delen of de volledige inhoud kunnen worden geëxporteerd en vervolgens in een iTrain-bestand worden ingevoegd - dit werkt ook met een bijna leeg bestand om mee te beginnen: bestand in iTrain slechts rudimentair aanmaken, via het onderdeel **Systemen** alles benodigde uitlezen en als import naar het rudimentaire bestand overbrengen, daarna handmatig afwerken.\nIn het menu **Systemen** staan de submenu's voor de afzonderlijke digitale systemen (BiDiB, ESU ECoS; Märklin, Z21, Lokstore en ZIMO zijn al aangelegd, maar nog zonder functie): **Verbinden**, **Uitlezen** en, bij BiDiB extra, **Systeembestand laden**. Het uitlezen levert een knooppuntstructuur resp. een objectlijst op met **Interface**, **Booster**, **Terugmelder** en **Toebehoren** (bij ECoS ook **Locomotieven**) - deze tabel kan worden bewerkt, als systeembestand worden opgeslagen en ten slotte worden overgenomen in het geopende iTrain-bestand.\n\nAlle drie de vensters onthouden grootte, positie en scherm elk voor zich. **Bewerken → Alle vensters centreren** in het hoofdvenster haalt de extra vensters terug naar het hoofdvenster. Bij het afsluiten van het programma worden de extra vensters mee gesloten.
help.threeWindowsText.fr=Depuis la version 3.0 beta, le programme se compose de trois parties, chacune dotée de sa propre fenêtre.\nImport/Export est la fenêtre principale ; tu ouvres Décodeur et Systèmes via les deux boutons **à droite du ruban** de la fenêtre principale.\nLes trois travaillent sur le **même** fichier iTrain : quelle que soit la partie dans laquelle un .tcdz/.tcd est chargé, il vaut dans toutes les parties jusqu'à la fermeture du programme (ou jusqu'au chargement d'un autre fichier). Les modifications faites dans une fenêtre sont immédiatement visibles dans les autres ; Enregistrer et Annuler s'appliquent à toutes.\n\n**iTrain Import/Export - Partie 1**\nCette partie sert à compléter des fichiers iTrain existants ou à exporter certaines catégories afin que d'autres puissent les importer.\nC'est ici que se déroule tout ce qui a été décrit dans les sections précédentes : ouvrir un fichier, consulter et modifier des catégories, exporter et importer des entrées.\nSeule cette partie possède le menu **Paramètres** ; **Fichier → Quitter le programme** ferme tout le programme, **Fichier → Fermer le fichier actuel** ne ferme que le fichier.\n\n**iTrain Import/Export Décodeur - Partie 2**\nCette partie sert à ajouter des modèles de décodeur aux locomotives ou aux wagons d'un fichier iTrain. Elle nécessite toujours un fichier iTrain déjà existant comme base.\nSi un fichier est chargé, la fenêtre Décodeur l'affiche immédiatement ; **Charger un fichier iTrain** en charge un autre pour toutes les parties du programme, **Écrire dans le fichier iTrain** l'enregistre après une sauvegarde. Seuls les onglets **Locomotives** et **Wagons** sont affichés, complétés par les colonnes **Décodeur** et **Modèle de décodeur**. Un double clic ou un clic droit sur une ligne (ou le **+**) ouvre une fenêtre d'édition avec les informations les plus importantes (nom, description, type de locomotive ou de wagon, longueur, type de décodeur, UID, adresse, interface, nœud) et le choix d'un **Modèle de décodeur**. Le type de locomotive (Autre, Vapeur, Diesel, Électrique, Hydrogène, Batterie) et le type de décodeur (DCC 14 à Analog) offrent le même choix que dans iTrain ; tous les autres champs restent accessibles, comme dans la fenêtre principale, via **Modifier les données**. La fenêtre possède ses propres menus (Fichier, Édition, Décodeur, Aide) et son propre ruban avec Ouvrir, Enregistrer, Annuler, Rétablir, **Exporter le décodeur**, **Importer le décodeur**, **Saisir le décodeur** et, à droite, **Charger un fichier iTrain** et **Écrire dans le fichier iTrain**. Le menu **Décodeur** contient les mêmes trois fonctions ainsi que **Modèles de décodeur** et **Installer des modèles de décodeur** ; l'aide sur les décodeurs se trouve dans le menu **Aide** de cette fenêtre.\n\n**iTrain Import/Export Systèmes - Partie 3**\nCette partie sert à lire un système BiDiB ou ESU (ECoS) et à transférer les données qu'il contient dans un fichier iTrain.\nD'autres systèmes suivront.\nUn système peut être lu, tout ou partie de son contenu peut être exporté puis inséré dans un fichier iTrain - cela fonctionne même en partant d'un fichier presque vide : créer le fichier dans iTrain de façon seulement rudimentaire, lire tout ce qui est nécessaire via la partie **Systèmes** et le transférer par import dans le fichier rudimentaire, puis le retravailler à la main.\nLe menu **Systèmes** contient les sous-menus des différents systèmes numériques (BiDiB, ESU ECoS ; Märklin, Z21, Lokstore et ZIMO sont préparés mais pas encore fonctionnels) : **Connecter**, **Lire** et, pour BiDiB en plus, **Charger un fichier système**. La lecture produit un arbre de nœuds ou une liste d'objets avec **Interface**, **Booster**, **Rétrosignalisation** et **Accessoire** (pour ECoS également **Locomotives**) - ce tableau peut être modifié, enregistré comme fichier système, puis finalement repris dans le fichier iTrain ouvert.\n\nLes trois fenêtres mémorisent chacune leur taille, leur position et leur écran. **Édition → Centrer toutes les fenêtres** dans la fenêtre principale ramène les fenêtres supplémentaires vers la fenêtre principale. À la fermeture du programme, les fenêtres supplémentaires sont fermées avec lui.
help.threeWindowsText.es=Desde la versión 3.0 beta el programa consta de tres partes, cada una con su propia ventana.\nImport/Export es la ventana principal; Decoder y Sistemas se abren mediante los dos botones **a la derecha de la cinta** de la ventana principal.\nLas tres trabajan sobre el **mismo** archivo de iTrain: no importa en qué parte se cargue un .tcdz/.tcd, vale en todas las partes hasta cerrar el programa (o hasta cargar otro). Los cambios hechos en una ventana son visibles de inmediato en las demás; Guardar y Deshacer se aplican a todas.\n\n**iTrain Import/Export - Parte 1**\nEsta parte sirve para completar archivos iTrain existentes o exportar categorías individuales para que otros puedan importarlas.\nAquí sucede todo lo descrito en las secciones anteriores: abrir archivo, ver y editar categorías, exportar e importar entradas.\nSolo aquí existe el menú **Configuración**; **Archivo → Salir del programa** cierra todo el programa, **Archivo → Cerrar actual** cierra solo el archivo.\n\n**iTrain Import/Export Decoder - Parte 2**\nEsta parte sirve para añadir plantillas de decodificador a las locomotoras o vagones de un archivo iTrain. Siempre requiere como base un archivo iTrain ya existente.\nSi hay un archivo cargado, la ventana Decoder lo muestra de inmediato; **Cargar archivo de iTrain** carga otro para todas las partes del programa, **Escribir en el archivo de iTrain** lo guarda tras hacer una copia de seguridad. Solo se muestran las pestañas **Locomotoras** y **Vagones**, ampliadas con las columnas **Decoder** y **Plantilla de decoder**. Un doble clic o clic derecho en una fila (o el **+**) abre una ventana de edición con los datos más importantes (nombre, descripción, tipo de locomotora o de vagón, longitud, tipo de decodificador, UID, dirección, interfaz, nodo) y la elección de una **Plantilla de decoder**. El tipo de locomotora (Otro, Vapor, Diésel, Eléctrica, Hidrógeno, Batería) y el tipo de decodificador (DCC 14 a Analog) ofrecen la misma selección que iTrain; todos los demás campos siguen siendo accesibles, igual que en la ventana principal, mediante **Cambiar datos**. La ventana tiene sus propios menús (Archivo, Editar, Decoder, Ayuda) y su propia cinta con Abrir, Guardar, Deshacer, Rehacer, **Exportar decodificador**, **Importar decodificador**, **Capturar decodificador** y, a la derecha, **Cargar archivo de iTrain** y **Escribir en el archivo de iTrain**. El menú **Decoder** contiene las mismas tres funciones además de **Plantillas de decodificador** e **Instalar plantillas de decodificador**; la ayuda sobre decodificadores está en el menú **Ayuda** de esta ventana.\n\n**iTrain Import/Export Sistemas - Parte 3**\nEsta parte sirve para leer un sistema BiDiB o ESU (ECoS) y transferir los datos que contiene a un archivo iTrain.\nMás adelante seguirán otros sistemas.\nUn sistema se puede leer, y partes o todo su contenido se pueden exportar e insertar después en un archivo iTrain - esto también funciona partiendo de un archivo casi vacío: crear el archivo en iTrain de forma solo rudimentaria, leer todo lo necesario a través de la parte **Sistemas** y transferirlo como importación al archivo rudimentario, y luego retocarlo a mano.\nEl menú **Sistemas** contiene los submenús para los distintos sistemas digitales (BiDiB, ESU ECoS; Märklin, Z21, Lokstore y ZIMO están preparados pero todavía sin función): **Conectar**, **Leer** y, para BiDiB además, **Cargar archivo de sistema**. La lectura genera un árbol de nodos o una lista de objetos con **Interfaz**, **Booster**, **Retroseñalización** y **Accesorio** (para ECoS también **Locomotoras**) - esta tabla se puede editar, guardar como archivo de sistema y finalmente aplicar al archivo iTrain abierto.\n\nLas tres ventanas recuerdan tamaño, posición y pantalla cada una por su cuenta. **Editar → Centrar todas las ventanas** en la ventana principal devuelve las ventanas adicionales a la ventana principal. Al cerrar el programa se cierran también las ventanas adicionales.
help.threeWindowsText.it=Dalla versione 3.0 beta il programma è composto da tre parti, ciascuna con una propria finestra.\nImport/Export è la finestra principale; Decoder e Sistemi si aprono tramite i due pulsanti **a destra nella barra multifunzione** della finestra principale.\nTutte e tre lavorano sullo **stesso** file iTrain: in qualunque parte venga caricato un .tcdz/.tcd, vale in tutte le parti fino alla chiusura del programma (o finché non se ne carica un altro). Le modifiche fatte in una finestra sono subito visibili nelle altre; Salva e Annulla valgono per tutte.\n\n**iTrain Import/Export - Parte 1**\nQuesta parte serve a completare file iTrain esistenti o a esportare singole categorie affinché altri possano importarle.\nQui avviene tutto ciò che è stato descritto nelle sezioni precedenti: aprire un file, visualizzare e modificare le categorie, esportare e importare voci.\nSolo qui è presente il menu **Impostazioni**; **File → Esci dal programma** chiude l'intero programma, **File → Chiudi corrente** chiude solo il file.\n\n**iTrain Import/Export Decoder - Parte 2**\nQuesta parte serve ad aggiungere modelli di decoder alle locomotive o ai carri di un file iTrain. Richiede sempre come base un file iTrain già esistente.\nSe è caricato un file, la finestra Decoder lo mostra subito; **Carica file iTrain** ne carica un altro per tutte le parti del programma, **Scrivi nel file iTrain** lo salva dopo averne fatto una copia. Vengono mostrate solo le schede **Locomotive** e **Carri**, ampliate con le colonne **Decoder** e **Modello decoder**. Un doppio clic o un clic destro su una riga (o il **+**) apre una finestra di modifica con i dati principali (nome, descrizione, tipo di locomotiva o di carro, lunghezza, tipo di decoder, UID, indirizzo, interfaccia, nodo) e la scelta di un **Modello decoder**. Il tipo di locomotiva (Altro, Vapore, Diesel, Elettrica, Idrogeno, Batteria) e il tipo di decoder (da DCC 14 ad Analog) offrono la stessa scelta di iTrain; tutti gli altri campi restano raggiungibili, come nella finestra principale, tramite **Modifica dati**. La finestra ha menu propri (File, Modifica, Decoder, Aiuto) e una propria barra con Apri, Salva, Annulla, Ripeti, **Esporta decoder**, **Importa decoder**, **Rileva decoder** e, a destra, **Carica file iTrain** e **Scrivi nel file iTrain**. Il menu **Decoder** contiene le stesse tre funzioni più **Modelli di decoder** e **Installa modelli di decoder**; la guida sui decoder si trova nel menu **Aiuto** di questa finestra.\n\n**iTrain Import/Export Sistemi - Parte 3**\nQuesta parte serve a leggere un sistema BiDiB o ESU (ECoS) e a trasferire i dati in esso contenuti in un file iTrain.\nAltri sistemi seguiranno.\nUn sistema può essere letto, e parti o l'intero contenuto possono essere esportati e successivamente inseriti in un file iTrain - questo funziona anche partendo da un file quasi vuoto: creare il file in iTrain solo in modo rudimentale, leggere tutto il necessario tramite la parte **Sistemi** e trasferirlo come importazione nel file rudimentale, per poi rifinirlo a mano.\nNel menu **Sistemi** si trovano i sottomenu per i singoli sistemi digitali (BiDiB, ESU ECoS; Märklin, Z21, Lokstore e ZIMO sono predisposti ma non ancora funzionanti): **Connetti**, **Leggi** e, per BiDiB in aggiunta, **Carica file di sistema**. La lettura produce un albero di nodi o un elenco di oggetti con **Interfaccia**, **Booster**, **Sensore di retroazione** e **Accessorio** (per ECoS anche **Locomotive**) - questa tabella può essere modificata, salvata come file di sistema e infine applicata al file iTrain aperto.\n\nTutte e tre le finestre ricordano dimensione, posizione e schermo ciascuna per sé. **Modifica → Centra tutte le finestre** nella finestra principale riporta le finestre aggiuntive alla finestra principale. Alla chiusura del programma vengono chiuse anche le finestre aggiuntive.
help.threeWindowsText.pt=Desde a versão 3.0 beta o programa é composto por três partes, cada uma com a sua própria janela.\nImport/Export é a janela principal; Descodificador e Sistemas abrem-se através dos dois botões **à direita na faixa** da janela principal.\nAs três trabalham sobre o **mesmo** ficheiro iTrain: seja qual for a parte em que um .tcdz/.tcd é carregado, vale em todas as partes até o programa ser fechado (ou até ser carregado outro). As alterações feitas numa janela são imediatamente visíveis nas outras; Guardar e Anular aplicam-se a todas.\n\n**iTrain Import/Export - Parte 1**\nEsta parte serve para completar ficheiros iTrain existentes ou exportar categorias individuais para que outros as possam importar.\nAqui acontece tudo o que foi descrito nas secções anteriores: abrir ficheiro, ver e editar categorias, exportar e importar entradas.\nSó aqui existe o menu **Definições**; **Ficheiro → Sair do programa** fecha todo o programa, **Ficheiro → Fechar atual** fecha apenas o ficheiro.\n\n**iTrain Import/Export Descodificador - Parte 2**\nEsta parte serve para adicionar modelos de descodificador às locomotivas ou vagões de um ficheiro iTrain. Requer sempre como base um ficheiro iTrain já existente.\nSe estiver carregado um ficheiro, a janela Descodificador mostra-o de imediato; **Carregar ficheiro iTrain** carrega outro para todas as partes do programa, **Escrever no ficheiro iTrain** grava-o depois de fazer uma cópia de segurança. Só são mostrados os separadores **Locomotivas** e **Vagões**, complementados pelas colunas **Descodificador** e **Modelo de descodificador**. Um duplo clique ou clique direito numa linha (ou o **+**) abre uma janela de edição com os dados mais importantes (nome, descrição, tipo de locomotiva ou de vagão, comprimento, tipo de descodificador, UID, endereço, interface, nó) e a escolha de um **Modelo de descodificador**. O tipo de locomotiva (Outro, Vapor, Diesel, Elétrica, Hidrogénio, Bateria) e o tipo de descodificador (DCC 14 a Analog) oferecem a mesma escolha que o iTrain; todos os outros campos continuam acessíveis, tal como na janela principal, através de **Alterar dados**. A janela tem menus próprios (Ficheiro, Editar, Descodificador, Ajuda) e uma faixa própria com Abrir, Guardar, Anular, Refazer, **Exportar descodificador**, **Importar descodificador**, **Registar descodificador** e, à direita, **Carregar ficheiro iTrain** e **Escrever no ficheiro iTrain**. O menu **Descodificador** contém as mesmas três funções mais **Modelos de descodificador** e **Instalar modelos de descodificador**; a ajuda sobre descodificadores está no menu **Ajuda** desta janela.\n\n**iTrain Import/Export Sistemas - Parte 3**\nEsta parte serve para ler um sistema BiDiB ou ESU (ECoS) e transferir os dados nele contidos para um ficheiro iTrain.\nOutros sistemas seguir-se-ão.\nUm sistema pode ser lido, e partes ou todo o conteúdo podem ser exportados e depois inseridos num ficheiro iTrain - isto também funciona partindo de um ficheiro quase vazio: criar o ficheiro no iTrain apenas de forma rudimentar, ler tudo o que é necessário através da parte **Sistemas** e transferi-lo como importação para o ficheiro rudimentar, depois retocando à mão.\nO menu **Sistemas** contém os submenus para os diferentes sistemas digitais (BiDiB, ESU ECoS; Märklin, Z21, Lokstore e ZIMO estão preparados mas ainda sem função): **Ligar**, **Ler** e, no caso do BiDiB adicionalmente, **Carregar ficheiro de sistema**. A leitura produz uma árvore de nós ou uma lista de objetos com **Interface**, **Booster**, **Retrossinalização** e **Acessório** (no ECoS também **Locomotivas**) - esta tabela pode ser editada, guardada como ficheiro de sistema e finalmente aplicada ao ficheiro iTrain aberto.\n\nAs três janelas lembram tamanho, posição e ecrã cada uma por si. **Editar → Centrar todas as janelas** na janela principal traz as janelas adicionais de volta à janela principal. Ao fechar o programa, as janelas adicionais são fechadas também.
help.threeWindowsText.pl=Od wersji 3.0 beta program składa się z trzech części, z których każda ma własne okno.\nImport/Export to okno główne; Dekoder i Systemy otwierasz dwoma przyciskami **po prawej stronie wstążki** w oknie głównym.\nWszystkie trzy pracują na **tym samym** pliku iTrain: niezależnie od tego, w której części wczytano plik .tcdz/.tcd, obowiązuje on we wszystkich częściach aż do zamknięcia programu (lub wczytania innego). Zmiany wprowadzone w jednym oknie są od razu widoczne w pozostałych; Zapisz i Cofnij dotyczą wszystkich.\n\n**iTrain Import/Export - Część 1**\nTa część służy do uzupełniania istniejących plików iTrain lub eksportowania pojedynczych kategorii, aby inni mogli je zaimportować.\nTu dzieje się wszystko, co opisano w poprzednich rozdziałach: otwieranie pliku, przeglądanie i edycja kategorii, eksport i import wpisów.\nTylko tutaj znajduje się menu **Ustawienia**; **Plik → Zakończ program** zamyka cały program, **Plik → Zamknij bieżący** zamyka tylko plik.\n\n**iTrain Import/Export Dekoder - Część 2**\nTa część służy do dodawania szablonów dekoderów do lokomotyw lub wagonów w pliku iTrain. Zawsze wymaga jako podstawy już istniejącego pliku iTrain.\nJeśli plik jest wczytany, okno Dekoder pokazuje go od razu; **Wczytaj plik iTrain** wczytuje inny dla wszystkich części programu, **Zapisz do pliku iTrain** zapisuje go po wykonaniu kopii zapasowej. Pokazywane są tylko zakładki **Lokomotywy** i **Wagony**, uzupełnione o kolumny **Dekoder** i **Szablon dekodera**. Dwuklik lub prawy klik na wierszu (lub **+**) otwiera okno edycji z najważniejszymi danymi (nazwa, opis, typ lokomotywy lub wagonu, długość, typ dekodera, UID, adres, interfejs, węzeł) oraz wyborem **Szablonu dekodera**. Typ lokomotywy (Inne, Parowa, Spalinowa, Elektryczna, Wodorowa, Akumulatorowa) i typ dekodera (od DCC 14 do Analog) oferują ten sam wybór co iTrain; wszystkie pozostałe pola pozostają dostępne, tak jak w oknie głównym, przez **Zmień dane**. Okno ma własne menu (Plik, Edycja, Dekoder, Pomoc) i własną wstążkę z Otwórz, Zapisz, Cofnij, Ponów, **Eksportuj dekoder**, **Importuj dekoder**, **Zarejestruj dekoder** oraz po prawej **Wczytaj plik iTrain** i **Zapisz do pliku iTrain**. Menu **Dekoder** zawiera te same trzy funkcje oraz **Szablony dekoderów** i **Zainstaluj szablony dekoderów**; pomoc dotycząca dekoderów znajduje się w menu **Pomoc** tego okna.\n\n**iTrain Import/Export Systemy - Część 3**\nTa część służy do odczytu systemu BiDiB lub ESU (ECoS) i przeniesienia zawartych w nim danych do pliku iTrain.\nKolejne systemy pojawią się później.\nSystem można odczytać, a części lub całą zawartość wyeksportować i następnie wstawić do pliku iTrain - działa to również przy niemal pustym pliku na start: utworzyć plik w iTrain tylko szczątkowo, przez część **Systemy** odczytać wszystko, co potrzebne, i przenieść jako import do szczątkowego pliku, a następnie dopracować ręcznie.\nW menu **Systemy** znajdują się podmenu dla poszczególnych systemów cyfrowych (BiDiB, ESU ECoS; Märklin, Z21, Lokstore i ZIMO są przygotowane, ale jeszcze bez funkcji): **Połącz**, **Odczytaj** oraz, dodatkowo dla BiDiB, **Wczytaj plik systemowy**. Odczyt tworzy drzewo węzłów lub listę obiektów z **Interfejsem**, **Boosterem**, **Czujnikiem zwrotnym** i **Akcesoriami** (dla ECoS dodatkowo **Lokomotywami**) - tę tabelę można edytować, zapisać jako plik systemowy i ostatecznie zastosować do otwartego pliku iTrain.\n\nWszystkie trzy okna zapamiętują rozmiar, położenie i ekran każde z osobna. **Edycja → Wyśrodkuj wszystkie okna** w oknie głównym sprowadza okna dodatkowe z powrotem do okna głównego. Przy zamykaniu programu okna dodatkowe są zamykane razem z nim.
help.threeWindowsText.da=Siden version 3.0 beta består programmet af tre dele, som hver har sit eget vindue.\nImport/Export er hovedvinduet; Dekoder og Systemer åbner du via de to knapper **til højre i båndet** i hovedvinduet.\nAlle tre arbejder på **samme** iTrain-fil: uanset i hvilken programdel en .tcdz/.tcd indlæses, gælder den i alle dele, indtil programmet afsluttes (eller en anden indlæses). Ændringer i ét vindue er straks synlige i de andre; Gem og Fortryd gælder for alle.\n\n**iTrain Import/Export - Del 1**\nDenne del bruges til at supplere eksisterende iTrain-filer eller eksportere enkelte kategorier, så andre kan importere dem.\nHer sker alt, hvad der er beskrevet i de foregående afsnit: åbne fil, se og redigere kategorier, eksportere og importere poster.\nKun her findes menuen **Indstillinger**; **Fil → Afslut program** lukker hele programmet, **Fil → Luk aktuel** lukker kun filen.\n\n**iTrain Import/Export Dekoder - Del 2**\nDenne del bruges til at tilføje dekoderskabeloner til lokomotiverne eller vognene i en iTrain-fil. Den kræver altid en allerede eksisterende iTrain-fil som grundlag.\nEr der indlæst en fil, viser Dekoder-vinduet den straks; **Indlæs iTrain-fil** indlæser en anden for alle programdele, **Skriv til iTrain-fil** gemmer den efter en sikkerhedskopi. Kun fanerne **Lokomotiver** og **Vogne** vises, suppleret med kolonnerne **Dekoder** og **Dekoderskabelon**. Et dobbeltklik eller højreklik på en linje (eller **+**) åbner et redigeringsvindue med de vigtigste oplysninger (navn, beskrivelse, lokomotiv- eller vogntype, længde, dekodertype, UID, adresse, interface, knude) og valget af en **Dekoderskabelon**. Lokomotivtype (Andet, Damp, Diesel, Elektrisk, Brint, Batteri) og dekodertype (DCC 14 til Analog) giver samme valg som iTrain; alle øvrige felter forbliver, ligesom i hovedvinduet, tilgængelige via **Rediger data**. Vinduet har egne menuer (Fil, Rediger, Dekoder, Hjælp) og et eget bånd med Åbn, Gem, Fortryd, Gentag, **Eksporter dekoder**, **Importer dekoder**, **Registrer dekoder** og til højre **Indlæs iTrain-fil** og **Skriv til iTrain-fil**. Menuen **Dekoder** indeholder de samme tre funktioner samt **Dekoderskabeloner** og **Installer dekoderskabeloner**; hjælpen til dekodere findes i dette vindues menu **Hjælp**.\n\n**iTrain Import/Export Systemer - Del 3**\nDenne del bruges til at udlæse et BiDiB- eller ESU-(ECoS-)system og overføre de deri indeholdte data til en iTrain-fil.\nAndre systemer følger senere.\nEt system kan udlæses, dele af eller hele indholdet kan eksporteres og derefter indsættes i en iTrain-fil - det virker også med en næsten tom fil som start: opret filen i iTrain kun rudimentært, udlæs alt nødvendigt via delen **Systemer** og overfør det som import til den rudimentære fil, efterbearbejd derefter i hånden.\nI menuen **Systemer** findes undermenuerne for de enkelte digitalsystemer (BiDiB, ESU ECoS; Märklin, Z21, Lokstore og ZIMO er forberedt, men endnu uden funktion): **Forbind**, **Udlæs** og, for BiDiB desuden, **Indlæs systemfil**. Udlæsningen resulterer i et knudetræ eller en objektliste med **Interface**, **Booster**, **Tilbagemelder** og **Tilbehør** (for ECoS også **Lokomotiver**) - denne tabel kan redigeres, gemmes som systemfil og til sidst overføres til den åbnede iTrain-fil.\n\nAlle tre vinduer husker størrelse, placering og skærm hver for sig. **Rediger → Centrer alle vinduer** i hovedvinduet henter de ekstra vinduer tilbage til hovedvinduet. Når programmet afsluttes, lukkes de ekstra vinduer med.
help.threeWindowsText.sv=Sedan version 3.0 beta består programmet av tre delar, som var och en har ett eget fönster.\nImport/Export är huvudfönstret; Dekoder och System öppnar du via de två knapparna **till höger i menyfliksområdet** i huvudfönstret.\nAlla tre arbetar med **samma** iTrain-fil: oavsett i vilken programdel en .tcdz/.tcd läses in gäller den i alla delar tills programmet avslutas (eller en annan läses in). Ändringar i ett fönster syns genast i de andra; Spara och Ångra gäller för alla.\n\n**iTrain Import/Export - Del 1**\nDen här delen används för att komplettera befintliga iTrain-filer eller exportera enskilda kategorier så att andra kan importera dem.\nHär sker allt som beskrivits i föregående avsnitt: öppna fil, visa och redigera kategorier, exportera och importera poster.\nEndast här finns menyn **Inställningar**; **Arkiv → Avsluta programmet** stänger hela programmet, **Arkiv → Stäng aktuell** stänger bara filen.\n\n**iTrain Import/Export Dekoder - Del 2**\nDen här delen används för att lägga till dekodermallar till loken eller vagnarna i en iTrain-fil. Den kräver alltid en redan befintlig iTrain-fil som grund.\nÄr en fil inläst visar Dekoder-fönstret den genast; **Läs in iTrain-fil** läser in en annan för alla programdelar, **Skriv till iTrain-fil** sparar den efter en säkerhetskopia. Endast flikarna **Lok** och **Vagnar** visas, kompletterade med kolumnerna **Dekoder** och **Dekodermall**. Ett dubbelklick eller högerklick på en rad (eller **+**) öppnar ett redigeringsfönster med de viktigaste uppgifterna (namn, beskrivning, lok- eller vagntyp, längd, dekodertyp, UID, adress, gränssnitt, nod) och valet av en **Dekodermall**. Loktyp (Övrigt, Ånga, Diesel, Elektrisk, Vätgas, Batteri) och dekodertyp (DCC 14 till Analog) erbjuder samma val som iTrain; alla övriga fält förblir, precis som i huvudfönstret, tillgängliga via **Ändra data**. Fönstret har egna menyer (Arkiv, Redigera, Dekoder, Hjälp) och ett eget menyfliksområde med Öppna, Spara, Ångra, Gör om, **Exportera dekoder**, **Importera dekoder**, **Registrera dekoder** samt till höger **Läs in iTrain-fil** och **Skriv till iTrain-fil**. Menyn **Dekoder** innehåller samma tre funktioner samt **Dekodermallar** och **Installera dekodermallar**; hjälpen om dekodrar finns i det här fönstrets meny **Hjälp**.\n\n**iTrain Import/Export System - Del 3**\nDen här delen används för att läsa av ett BiDiB- eller ESU-(ECoS-)system och föra över de data det innehåller till en iTrain-fil.\nFler system kommer senare.\nEtt system kan läsas av, delar av eller hela innehållet kan exporteras och sedan infogas i en iTrain-fil - det fungerar även med en nästan tom fil som start: skapa filen i iTrain bara rudimentärt, läs av allt nödvändigt via delen **System** och för över det som import till den rudimentära filen, bearbeta sedan för hand.\nI menyn **System** finns undermenyerna för de enskilda digitalsystemen (BiDiB, ESU ECoS; Märklin, Z21, Lokstore och ZIMO är förberedda men ännu utan funktion): **Anslut**, **Läs av** och, för BiDiB dessutom, **Läs in systemfil**. Avläsningen ger ett nodträd resp. en objektlista med **Gränssnitt**, **Booster**, **Återkoppling** och **Tillbehör** (för ECoS även **Lok**) - denna tabell kan redigeras, sparas som systemfil och slutligen tillämpas på den öppna iTrain-filen.\n\nAlla tre fönster kommer ihåg storlek, position och skärm var för sig. **Redigera → Centrera alla fönster** i huvudfönstret hämtar tillbaka de extra fönstren till huvudfönstret. När programmet avslutas stängs de extra fönstren med.

