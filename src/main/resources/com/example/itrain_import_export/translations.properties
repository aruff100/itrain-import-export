systems.writeItrainConfirm.de={0} markierte Zeile(n) direkt in {1} schreiben?\nZugeordnete Einträge werden aktualisiert, neue angehängt. Vorher wird eine Sicherung im Sicherungsordner angelegt.\niTrain sollte die Datei dabei NICHT geöffnet haben - sonst überschreibt iTrain sie beim nächsten Speichern wieder.
systems.writeItrainConfirm.en=Write {0} marked row(s) directly into {1}?\nMatched entries are updated, new ones appended. A backup is made in the backup folder first.\niTrain should NOT have the file open - otherwise iTrain overwrites it again on its next save.
systems.writeItrainConfirm.nl={0} gemarkeerde regel(s) direct in {1} schrijven?\nGekoppelde items worden bijgewerkt, nieuwe toegevoegd. Eerst wordt een back-up in de back-upmap gemaakt.\niTrain mag het bestand daarbij NIET open hebben - anders overschrijft iTrain het bij de volgende keer opslaan.
systems.writeItrainConfirm.fr=Écrire {0} ligne(s) cochée(s) directement dans {1} ?\nLes entrées associées sont mises à jour, les nouvelles ajoutées. Une sauvegarde est d'abord faite dans le dossier de sauvegarde.\niTrain ne doit PAS avoir le fichier ouvert - sinon iTrain l'écrase à nouveau lors de son prochain enregistrement.
systems.writeItrainConfirm.es=¿Escribir {0} fila(s) marcada(s) directamente en {1}?\nLas entradas asignadas se actualizan, las nuevas se añaden. Antes se hace una copia de seguridad en la carpeta de copias.\niTrain NO debe tener el archivo abierto; si no, iTrain lo sobrescribirá al guardar la próxima vez.
systems.writeItrainConfirm.it=Scrivere {0} riga/e selezionata/e direttamente in {1}?\nLe voci abbinate vengono aggiornate, le nuove aggiunte. Prima viene creata una copia nella cartella di backup.\niTrain NON deve avere il file aperto - altrimenti iTrain lo sovrascrive al prossimo salvataggio.
systems.writeItrainConfirm.pt=Escrever {0} linha(s) marcada(s) diretamente em {1}?\nAs entradas associadas são atualizadas, as novas acrescentadas. Antes é feita uma cópia na pasta de cópias de segurança.\nO iTrain NÃO deve ter o ficheiro aberto - caso contrário volta a substituí-lo ao gravar.
systems.writeItrainConfirm.pl=Zapisać {0} zaznaczony(ch) wiersz(y) bezpośrednio do {1}?\nPrzypisane wpisy zostaną zaktualizowane, nowe dodane. Najpierw tworzona jest kopia w folderze kopii zapasowych.\niTrain NIE powinien mieć otwartego pliku - inaczej nadpisze go przy następnym zapisie.
systems.writeItrainConfirm.da=Skriv {0} markeret/markerede række(r) direkte i {1}?\nTilknyttede poster opdateres, nye tilføjes. Først laves en sikkerhedskopi i backup-mappen.\niTrain må IKKE have filen åben - ellers overskriver iTrain den igen ved næste gem.
systems.writeItrainConfirm.sv=Skriva {0} markerad(e) rad(er) direkt till {1}?\nKopplade poster uppdateras, nya läggs till. Först görs en säkerhetskopia i säkerhetskopiemappen.\niTrain får INTE ha filen öppen - annars skriver iTrain över den igen vid nästa sparande.

systems.writeItrainConfirmMain.de={0} markierte Zeile(n) in {1} übernehmen?\nDie Datei ist im Hauptfenster geöffnet - die Änderungen landen dort; gespeichert wird wie gewohnt im Hauptfenster.
systems.writeItrainConfirmMain.en=Apply {0} marked row(s) to {1}?\nThe file is open in the main window - the changes go there; save as usual in the main window.
systems.writeItrainConfirmMain.nl={0} gemarkeerde regel(s) in {1} overnemen?\nHet bestand is geopend in het hoofdvenster - de wijzigingen komen daar; opslaan zoals gewoonlijk in het hoofdvenster.
systems.writeItrainConfirmMain.fr=Reporter {0} ligne(s) cochée(s) dans {1} ?\nLe fichier est ouvert dans la fenêtre principale - les modifications y sont reportées ; enregistrer comme d'habitude dans la fenêtre principale.
systems.writeItrainConfirmMain.es=¿Pasar {0} fila(s) marcada(s) a {1}?\nEl archivo está abierto en la ventana principal: los cambios van allí; guardar como siempre en la ventana principal.
systems.writeItrainConfirmMain.it=Trasferire {0} riga/e selezionata/e in {1}?\nIl file è aperto nella finestra principale - le modifiche finiscono lì; salvare come al solito nella finestra principale.
systems.writeItrainConfirmMain.pt=Passar {0} linha(s) marcada(s) para {1}?\nO ficheiro está aberto na janela principal - as alterações vão para lá; gravar como habitualmente na janela principal.
systems.writeItrainConfirmMain.pl=Przenieść {0} zaznaczony(ch) wiersz(y) do {1}?\nPlik jest otwarty w oknie głównym - zmiany trafią tam; zapisz jak zwykle w oknie głównym.
systems.writeItrainConfirmMain.da=Overfør {0} markeret/markerede række(r) til {1}?\nFilen er åben i hovedvinduet - ændringerne havner der; gem som sædvanligt i hovedvinduet.
systems.writeItrainConfirmMain.sv=För över {0} markerad(e) rad(er) till {1}?\nFilen är öppen i huvudfönstret - ändringarna hamnar där; spara som vanligt i huvudfönstret.

