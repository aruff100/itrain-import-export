help.esuTitle.de=ESU ECoS: Suchen, Verbinden, Auslesen
help.esuText.de=Über **Systeme → ESU → Verbinden...** (oder das System-Feld "ESU ECoS" im Ribbon) wird eine ECoS über das Netz angesprochen.\n\n**Automatische Suche im Netz:** Das Verbindungsfenster tastet beim Öffnen selbsttätig das lokale Netz ab (Port 15471) und zeigt gefundene ECoS-Geräte in einer Liste - anklicken übernimmt Adresse in das Feld darunter, ein Doppelklick verbindet sofort. **Erneut suchen** startet die Abtastung neu.\n\n**Wichtig - das ist kein echtes Discovery wie bei BiDiB:** Die ECoS kennt kein mDNS/Bonjour und keinen dokumentierten Netzwerk-Announce. Das Programm tastet deshalb statt einer echten Gerätesuche das gesamte lokale /24-Netz ab (typisch 254 Adressen) und bestätigt jeden Treffer mit einer kurzen ECoS-Protokollanfrage - das dauert etwas länger als BiDiBs sofortige mDNS-Suche (meist 1-2 Sekunden), findet die ECoS aber auch ohne dass ihre IP-Adresse vorher bekannt sein muss. Steht die ECoS in einem anderen Teilnetz (z.B. über VPN oder ein größeres Firmennetz), bleibt die Suche erfolglos - dann die IP-Adresse von Hand eintragen, zu finden zum Beispiel:\n- am Display bzw. im Einstellungsmenü der ECoS selbst,\n- in der Geräteliste des Routers (DHCP-Client-/Netzwerkübersicht) - dort meist unter einem Namen wie "ecos" zu finden.\n\nDie eingetragene bzw. ausgewählte Adresse wird für den nächsten Aufruf gemerkt.\n\n**Verbinden:** Die ECoS muss eingeschaltet und im selben Netz erreichbar sein. Nach dem Verbinden zeigt die Statuszeile Version und Hardware-Angabe der ECoS an; die Verbindung liest nur - es wird nichts auf der ECoS verändert. Mehrere ECoS gleichzeitig sind möglich, jede mit eigenem Namen und einem grün/rot leuchtenden Kreis in der Statuszeile.\n\n**Auslesen:** Genau wie bei BiDiB öffnet **Auslesen** einen Knotenbaum mit Ankreuzkästen - hier aus dem Bestand der ECoS: Schnittstelle, Zubehör (Weichen/Signale) und Lokomotiven. **Auswahl übernehmen** überträgt die markierten Einträge in die Tabellen des Systeme-Fensters - Markieren, Übernehmen, Bearbeiten, Exportieren laufen für ESU genauso ab wie im ersten Hilfeabschnitt beschrieben.
help.esuTitle.en=ESU ECoS: search, connect, read out
help.esuTitle.nl=ESU ECoS: zoeken, verbinden, uitlezen
help.esuTitle.fr=ESU ECoS : rechercher, connecter, lire
help.esuTitle.es=ESU ECoS: buscar, conectar, leer
help.esuTitle.it=ESU ECoS: cercare, connettersi, leggere
help.esuTitle.pt=ESU ECoS: procurar, ligar, ler
help.esuTitle.pl=ESU ECoS: wyszukiwanie, łączenie, odczyt
help.esuTitle.da=ESU ECoS: søg, forbind, udlæs
help.esuTitle.sv=ESU ECoS: sök, anslut, läs av
help.esuText.en=Via **Systems → ESU → Connect...** (or the "ESU ECoS" system field in the ribbon), an ECoS is addressed over the network.\n\n**Automatic network search:** When opened, the connection window automatically scans the local network (port 15471) and shows found ECoS devices in a list - clicking one transfers the address into the field below, a double-click connects immediately. **Search again** restarts the scan.\n\n**Important - this is not real discovery like with BiDiB:** The ECoS has no mDNS/Bonjour and no documented network announcement. Instead of a real device search, the program therefore scans the entire local /24 network (typically 254 addresses) and confirms each hit with a short ECoS protocol request - this takes a bit longer than BiDiB's immediate mDNS search (usually 1-2 seconds), but it finds the ECoS even without its IP address being known beforehand. If the ECoS is on a different subnet (e.g. via VPN or a larger corporate network), the search remains unsuccessful - in that case, enter the IP address by hand, which can be found, for example:\n- on the display or in the settings menu of the ECoS itself,\n- in the router's device list (DHCP client/network overview) - usually found there under a name such as "ecos".\n\nThe entered or selected address is remembered for the next call.\n\n**Connect:** The ECoS must be switched on and reachable on the same network. After connecting, the status bar shows the version and hardware information of the ECoS; the connection only reads - nothing is changed on the ECoS. Several ECoS units at the same time are possible, each with its own name and a green/red circle in the status bar.\n\n**Read out:** Just as with BiDiB, **Read out** opens a node tree with checkboxes - here from the contents of the ECoS: interface, accessories (turnouts/signals) and locomotives. **Apply selection** transfers the marked entries into the tables of the Systems window - select, apply, edit, export work for ESU exactly the same way as described in the first help section.
help.esuText.nl=Via **Systemen → ESU → Verbinden...** (of het systeemveld "ESU ECoS" in het lint) wordt een ECoS via het netwerk aangesproken.\n\n**Automatisch zoeken in het netwerk:** Het verbindingsvenster doorzoekt bij het openen automatisch het lokale netwerk (poort 15471) en toont gevonden ECoS-apparaten in een lijst - aanklikken neemt het adres over in het veld daaronder, een dubbelklik verbindt meteen. **Opnieuw zoeken** start de zoekactie opnieuw.\n\n**Belangrijk - dit is geen echte discovery zoals bij BiDiB:** De ECoS kent geen mDNS/Bonjour en geen gedocumenteerde netwerk-announce. Het programma doorzoekt daarom, in plaats van een echte apparaatzoekactie, het hele lokale /24-netwerk (doorgaans 254 adressen) en bevestigt elke treffer met een korte ECoS-protocolaanvraag - dat duurt iets langer dan BiDiB's directe mDNS-zoekactie (meestal 1-2 seconden), maar vindt de ECoS ook zonder dat het IP-adres vooraf bekend hoeft te zijn. Staat de ECoS in een ander subnet (bijv. via VPN of een groter bedrijfsnetwerk), dan blijft de zoekactie zonder resultaat - voer dan het IP-adres handmatig in, te vinden bijvoorbeeld:\n- op het display resp. in het instellingenmenu van de ECoS zelf,\n- in de apparatenlijst van de router (DHCP-client-/netwerkoverzicht) - daar meestal te vinden onder een naam als "ecos".\n\nHet ingevoerde resp. gekozen adres wordt voor de volgende keer onthouden.\n\n**Verbinden:** De ECoS moet ingeschakeld en in hetzelfde netwerk bereikbaar zijn. Na het verbinden toont de statusbalk versie en hardware-informatie van de ECoS; de verbinding leest alleen uit - er wordt niets op de ECoS gewijzigd. Meerdere ECoS-apparaten tegelijk zijn mogelijk, elk met een eigen naam en een groen/rood brandende cirkel in de statusbalk.\n\n**Uitlezen:** Net als bij BiDiB opent **Uitlezen** een knooppuntenboom met aankruisvakjes - hier uit de gegevens van de ECoS: interface, accessoires (wissels/signalen) en locomotieven. **Selectie overnemen** brengt de gemarkeerde items over naar de tabellen van het Systemen-venster - markeren, overnemen, bewerken, exporteren verlopen voor ESU precies zoals beschreven in de eerste hulpparagraaf.
help.esuText.fr=Via **Systèmes → ESU → Connecter...** (ou le champ système « ESU ECoS » du ruban), une ECoS est contactée via le réseau.\n\n**Recherche automatique sur le réseau :** À l'ouverture, la fenêtre de connexion balaie automatiquement le réseau local (port 15471) et affiche les appareils ECoS trouvés dans une liste - un clic reprend l'adresse dans le champ ci-dessous, un double-clic connecte immédiatement. **Rechercher à nouveau** relance le balayage.\n\n**Important - ce n'est pas une véritable découverte comme avec BiDiB :** L'ECoS ne connaît ni mDNS/Bonjour ni annonce réseau documentée. Le programme balaie donc, au lieu d'une véritable recherche d'appareil, tout le réseau local /24 (typiquement 254 adresses) et confirme chaque résultat par une brève requête de protocole ECoS - cela prend un peu plus de temps que la recherche mDNS immédiate de BiDiB (généralement 1 à 2 secondes), mais trouve l'ECoS même sans connaître son adresse IP au préalable. Si l'ECoS se trouve sur un autre sous-réseau (par ex. via VPN ou un réseau d'entreprise plus vaste), la recherche reste infructueuse - saisir alors l'adresse IP à la main, que l'on trouve par exemple :\n- sur l'écran ou dans le menu de configuration de l'ECoS elle-même,\n- dans la liste des appareils du routeur (vue d'ensemble client DHCP/réseau) - généralement sous un nom tel que « ecos ».\n\nL'adresse saisie ou sélectionnée est mémorisée pour le prochain appel.\n\n**Connecter :** L'ECoS doit être allumée et accessible sur le même réseau. Après la connexion, la barre d'état affiche la version et les informations matérielles de l'ECoS ; la connexion se contente de lire - rien n'est modifié sur l'ECoS. Plusieurs ECoS simultanées sont possibles, chacune avec son propre nom et un cercle vert/rouge dans la barre d'état.\n\n**Lire :** Exactement comme avec BiDiB, **Lire** ouvre un arbre de nœuds avec des cases à cocher - ici à partir du contenu de l'ECoS : interface, accessoires (aiguillages/signaux) et locomotives. **Appliquer la sélection** transfère les entrées marquées dans les tableaux de la fenêtre Systèmes - marquer, appliquer, modifier, exporter se déroulent pour ESU exactement comme décrit dans la première section d'aide.
help.esuText.es=A través de **Sistemas → ESU → Conectar...** (o el campo de sistema "ESU ECoS" en la cinta) se contacta con una ECoS a través de la red.\n\n**Búsqueda automática en la red:** Al abrirse, la ventana de conexión rastrea automáticamente la red local (puerto 15471) y muestra los dispositivos ECoS encontrados en una lista - al hacer clic se traslada la dirección al campo de abajo, un doble clic conecta de inmediato. **Buscar de nuevo** reinicia el rastreo.\n\n**Importante - esto no es un descubrimiento real como en BiDiB:** La ECoS no conoce mDNS/Bonjour ni ningún anuncio de red documentado. Por eso, en lugar de una búsqueda real de dispositivos, el programa rastrea toda la red local /24 (típicamente 254 direcciones) y confirma cada coincidencia con una breve solicitud del protocolo ECoS - esto tarda algo más que la búsqueda mDNS inmediata de BiDiB (normalmente 1-2 segundos), pero encuentra la ECoS incluso sin conocer previamente su dirección IP. Si la ECoS está en otra subred (p. ej. a través de VPN o de una red corporativa más grande), la búsqueda no tendrá éxito - en ese caso, introduzca la dirección IP a mano, que se puede encontrar, por ejemplo:\n- en la pantalla o en el menú de configuración de la propia ECoS,\n- en la lista de dispositivos del router (resumen de clientes DHCP/red) - normalmente se encuentra allí bajo un nombre como "ecos".\n\nLa dirección introducida o seleccionada se recuerda para la próxima vez.\n\n**Conectar:** La ECoS debe estar encendida y ser accesible en la misma red. Tras la conexión, la barra de estado muestra la versión y los datos de hardware de la ECoS; la conexión solo lee - no se modifica nada en la ECoS. Son posibles varias ECoS al mismo tiempo, cada una con su propio nombre y un círculo verde/rojo en la barra de estado.\n\n**Leer:** Igual que con BiDiB, **Leer** abre un árbol de nodos con casillas - aquí a partir del contenido de la ECoS: interfaz, accesorios (agujas/señales) y locomotoras. **Aplicar selección** transfiere las entradas marcadas a las tablas de la ventana Sistemas - marcar, aplicar, editar, exportar funcionan para ESU exactamente igual que lo descrito en la primera sección de ayuda.
help.esuText.it=Tramite **Sistemi → ESU → Connetti...** (oppure il campo di sistema "ESU ECoS" nella barra multifunzione) viene contattata una ECoS attraverso la rete.\n\n**Ricerca automatica in rete:** All'apertura, la finestra di connessione esamina automaticamente la rete locale (porta 15471) e mostra i dispositivi ECoS trovati in un elenco - un clic trasferisce l'indirizzo nel campo sottostante, un doppio clic connette immediatamente. **Cerca di nuovo** riavvia la scansione.\n\n**Importante - non è una vera discovery come con BiDiB:** La ECoS non conosce mDNS/Bonjour né alcun annuncio di rete documentato. Il programma, invece di una vera ricerca di dispositivi, esamina quindi l'intera rete locale /24 (tipicamente 254 indirizzi) e conferma ogni risultato con una breve richiesta del protocollo ECoS - questo richiede un po' più tempo rispetto alla ricerca mDNS immediata di BiDiB (di solito 1-2 secondi), ma trova la ECoS anche senza che il suo indirizzo IP sia noto in anticipo. Se la ECoS si trova in un'altra sottorete (ad es. tramite VPN o una rete aziendale più grande), la ricerca resta infruttuosa - in tal caso inserire manualmente l'indirizzo IP, reperibile ad esempio:\n- sul display o nel menu delle impostazioni della ECoS stessa,\n- nell'elenco dei dispositivi del router (panoramica client DHCP/rete) - lì solitamente reperibile sotto un nome come "ecos".\n\nL'indirizzo inserito o selezionato viene memorizzato per la volta successiva.\n\n**Connetti:** La ECoS deve essere accesa e raggiungibile nella stessa rete. Dopo la connessione, la barra di stato mostra la versione e i dati hardware della ECoS; la connessione si limita a leggere - non viene modificato nulla sulla ECoS. Sono possibili più ECoS contemporaneamente, ciascuna con un proprio nome e un cerchio verde/rosso nella barra di stato.\n\n**Leggi:** Esattamente come con BiDiB, **Leggi** apre un albero di nodi con caselle di spunta - qui a partire dal contenuto della ECoS: interfaccia, accessori (scambi/segnali) e locomotive. **Applica selezione** trasferisce le voci contrassegnate nelle tabelle della finestra Sistemi - contrassegnare, trasferire, modificare, esportare funzionano per ESU esattamente come descritto nella prima sezione di aiuto.
help.esuText.pt=Através de **Sistemas → ESU → Ligar...** (ou o campo de sistema "ESU ECoS" na faixa) é contactada uma ECoS através da rede.\n\n**Pesquisa automática na rede:** Ao abrir, a janela de ligação percorre automaticamente a rede local (porta 15471) e mostra os dispositivos ECoS encontrados numa lista - clicar transfere o endereço para o campo abaixo, um duplo clique liga de imediato. **Procurar novamente** reinicia a pesquisa.\n\n**Importante - isto não é uma descoberta real como no BiDiB:** A ECoS não conhece mDNS/Bonjour nem qualquer anúncio de rede documentado. Por isso, em vez de uma pesquisa real de dispositivos, o programa percorre toda a rede local /24 (tipicamente 254 endereços) e confirma cada resultado com um breve pedido do protocolo ECoS - isto demora um pouco mais do que a pesquisa mDNS imediata do BiDiB (normalmente 1-2 segundos), mas encontra a ECoS mesmo sem o seu endereço IP ser previamente conhecido. Se a ECoS estiver noutra sub-rede (por exemplo, via VPN ou uma rede empresarial maior), a pesquisa não terá êxito - nesse caso, introduza o endereço IP manualmente, que pode ser encontrado, por exemplo:\n- no visor ou no menu de definições da própria ECoS,\n- na lista de dispositivos do router (visão geral de clientes DHCP/rede) - geralmente encontrado aí sob um nome como "ecos".\n\nO endereço introduzido ou selecionado é memorizado para a próxima vez.\n\n**Ligar:** A ECoS tem de estar ligada e acessível na mesma rede. Após a ligação, a barra de estado mostra a versão e as informações de hardware da ECoS; a ligação apenas lê - nada é alterado na ECoS. São possíveis várias ECoS em simultâneo, cada uma com o seu próprio nome e um círculo verde/vermelho na barra de estado.\n\n**Ler:** Tal como no BiDiB, **Ler** abre uma árvore de nós com caixas de verificação - aqui a partir do conteúdo da ECoS: interface, acessórios (agulhas/sinais) e locomotivas. **Aplicar seleção** transfere as entradas marcadas para as tabelas da janela Sistemas - marcar, aplicar, editar, exportar funcionam para a ESU exatamente como descrito na primeira secção de ajuda.
help.esuText.pl=Za pomocą **Systemy → ESU → Połącz...** (lub pola systemowego "ESU ECoS" na wstążce) nawiązywany jest kontakt z ECoS przez sieć.\n\n**Automatyczne wyszukiwanie w sieci:** Po otwarciu okno połączenia automatycznie przeszukuje sieć lokalną (port 15471) i wyświetla znalezione urządzenia ECoS na liście - kliknięcie przenosi adres do pola poniżej, dwuklik od razu łączy. **Szukaj ponownie** ponownie uruchamia skanowanie.\n\n**Ważne - to nie jest prawdziwe wykrywanie jak w BiDiB:** ECoS nie zna mDNS/Bonjour ani żadnego udokumentowanego ogłoszenia sieciowego. Dlatego zamiast prawdziwego wyszukiwania urządzeń program skanuje całą lokalną sieć /24 (zwykle 254 adresy) i potwierdza każde trafienie krótkim zapytaniem protokołu ECoS - trwa to nieco dłużej niż natychmiastowe wyszukiwanie mDNS w BiDiB (zwykle 1-2 sekundy), ale znajduje ECoS również bez wcześniejszej znajomości jej adresu IP. Jeśli ECoS znajduje się w innej podsieci (np. przez VPN lub większą sieć firmową), wyszukiwanie pozostanie bezskuteczne - wtedy należy wpisać adres IP ręcznie, który można znaleźć na przykład:\n- na wyświetlaczu lub w menu ustawień samej ECoS,\n- na liście urządzeń routera (przegląd klientów DHCP/sieci) - zwykle widoczny tam pod nazwą taką jak "ecos".\n\nWpisany lub wybrany adres jest zapamiętywany na następny raz.\n\n**Połącz:** ECoS musi być włączona i dostępna w tej samej sieci. Po połączeniu pasek stanu pokazuje wersję i informacje sprzętowe ECoS; połączenie tylko odczytuje - na ECoS nic nie jest zmieniane. Możliwych jest kilka ECoS jednocześnie, każda z własną nazwą i zielonym/czerwonym kółkiem na pasku stanu.\n\n**Odczytaj:** Dokładnie tak jak w BiDiB, **Odczytaj** otwiera drzewo węzłów z polami wyboru - tutaj na podstawie zawartości ECoS: interfejs, akcesoria (zwrotnice/sygnały) i lokomotywy. **Zastosuj wybór** przenosi zaznaczone wpisy do tabel okna Systemy - zaznaczanie, przenoszenie, edycja, eksport przebiegają dla ESU dokładnie tak samo, jak opisano w pierwszym rozdziale pomocy.
help.esuText.da=Via **Systemer → ESU → Forbind...** (eller systemfeltet "ESU ECoS" i båndet) kontaktes en ECoS via netværket.\n\n**Automatisk søgning på netværket:** Ved åbning afsøger forbindelsesvinduet automatisk det lokale netværk (port 15471) og viser fundne ECoS-enheder i en liste - et klik overtager adressen i feltet nedenfor, et dobbeltklik forbinder straks. **Søg igen** genstarter afsøgningen.\n\n**Vigtigt - dette er ikke en rigtig discovery som ved BiDiB:** ECoS kender ikke mDNS/Bonjour eller nogen dokumenteret netværksannoncering. Programmet afsøger derfor, i stedet for en rigtig enhedssøgning, hele det lokale /24-netværk (typisk 254 adresser) og bekræfter hvert træf med en kort ECoS-protokolforespørgsel - det tager lidt længere tid end BiDiBs øjeblikkelige mDNS-søgning (som regel 1-2 sekunder), men finder ECoS'en, selv uden at dens IP-adresse skal være kendt på forhånd. Står ECoS'en i et andet undernet (f.eks. via VPN eller et større firmanetværk), forbliver søgningen resultatløs - indtast da IP-adressen manuelt, som f.eks. kan findes:\n- på displayet eller i indstillingsmenuen på selve ECoS'en,\n- i routerens enhedsliste (DHCP-klient-/netværksoversigt) - der som regel findes under et navn som "ecos".\n\nDen indtastede eller valgte adresse huskes til næste gang.\n\n**Forbind:** ECoS'en skal være tændt og tilgængelig på samme netværk. Efter forbindelsen viser statuslinjen version og hardwareoplysninger for ECoS'en; forbindelsen læser kun - der ændres intet på ECoS'en. Flere ECoS samtidig er muligt, hver med sit eget navn og en grøn/rød lysende cirkel i statuslinjen.\n\n**Udlæs:** Ganske som ved BiDiB åbner **Udlæs** et knudetræ med afkrydsningsfelter - her ud fra ECoS'ens indhold: interface, tilbehør (sporskifter/signaler) og lokomotiver. **Anvend markering** overfører de markerede poster til tabellerne i Systemer-vinduet - markere, overføre, redigere, eksportere foregår for ESU præcis som beskrevet i det første hjælpeafsnit.
help.esuText.sv=Via **System → ESU → Anslut...** (eller systemfältet "ESU ECoS" i menyfliksområdet) kontaktas en ECoS via nätverket.\n\n**Automatisk sökning i nätverket:** Vid öppning avsöker anslutningsfönstret automatiskt det lokala nätverket (port 15471) och visar hittade ECoS-enheter i en lista - ett klick för över adressen till fältet nedanför, en dubbelklickning ansluter direkt. **Sök igen** startar avsökningen på nytt.\n\n**Viktigt - detta är ingen riktig discovery som med BiDiB:** ECoS känner inte till mDNS/Bonjour eller någon dokumenterad nätverksannonsering. Programmet avsöker därför, i stället för en riktig enhetssökning, hela det lokala /24-nätverket (vanligtvis 254 adresser) och bekräftar varje träff med en kort ECoS-protokollförfrågan - det tar lite längre tid än BiDiBs omedelbara mDNS-sökning (oftast 1-2 sekunder), men hittar ECoS:en även utan att dess IP-adress behöver vara känd i förväg. Står ECoS:en i ett annat subnät (t.ex. via VPN eller ett större företagsnätverk), förblir sökningen resultatlös - ange då IP-adressen för hand, som t.ex. kan hittas:\n- på displayen eller i inställningsmenyn på själva ECoS:en,\n- i routerns enhetslista (DHCP-klient-/nätverksöversikt) - där den oftast finns under ett namn som "ecos".\n\nDen angivna eller valda adressen sparas till nästa gång.\n\n**Anslut:** ECoS:en måste vara påslagen och nåbar i samma nätverk. Efter anslutningen visar statusfältet version och hårdvaruinformation för ECoS:en; anslutningen läser bara av - ingenting ändras på ECoS:en. Flera ECoS samtidigt är möjligt, var och en med eget namn och en grön/röd lysande cirkel i statusfältet.\n\n**Läs av:** Precis som med BiDiB öppnar **Läs av** ett nodträd med kryssrutor - här utifrån ECoS:ens innehåll: gränssnitt, tillbehör (växlar/signaler) och lok. **Tillämpa markering** för över de markerade posterna till tabellerna i System-fönstret - markera, tillämpa, redigera, exportera fungerar för ESU precis som beskrivet i det första hjälpavsnittet.

