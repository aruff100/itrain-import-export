bidib.statusNoLogon.de=Gepaart, aber das Gerät meldet sich nicht an (kein MSG_LOCAL_LOGON). Meist ist es schon bei einem anderen Programm angemeldet (iTrain, Wizard) - dort trennen, dann hier erneut verbinden.
bidib.statusNoLogon.en=Paired, but the device does not log on (no MSG_LOCAL_LOGON). Usually it is already logged on to another program (iTrain, Wizard) - disconnect there, then connect again here.
bidib.statusNoLogon.nl=Gekoppeld, maar het apparaat meldt zich niet aan (geen MSG_LOCAL_LOGON). Meestal is het al aangemeld bij een ander programma (iTrain, Wizard) - daar verbreken en hier opnieuw verbinden.
bidib.statusNoLogon.fr=Appairé, mais l'appareil ne se connecte pas (pas de MSG_LOCAL_LOGON). En général il est déjà connecté à un autre programme (iTrain, Wizard) - déconnectez-le là-bas, puis reconnectez ici.
bidib.statusNoLogon.es=Emparejado, pero el dispositivo no inicia sesión (sin MSG_LOCAL_LOGON). Normalmente ya está conectado a otro programa (iTrain, Wizard): desconéctelo allí y vuelva a conectar aquí.
bidib.statusNoLogon.it=Accoppiato, ma il dispositivo non effettua il logon (nessun MSG_LOCAL_LOGON). Di solito è già collegato a un altro programma (iTrain, Wizard): scollegarlo lì, poi ricollegare qui.
bidib.statusNoLogon.pt=Emparelhado, mas o dispositivo não inicia sessão (sem MSG_LOCAL_LOGON). Normalmente já está ligado a outro programa (iTrain, Wizard) - desligue lá e volte a ligar aqui.
bidib.statusNoLogon.pl=Sparowano, ale urządzenie się nie loguje (brak MSG_LOCAL_LOGON). Zwykle jest już zalogowane w innym programie (iTrain, Wizard) - rozłącz tam, potem połącz ponownie tutaj.
bidib.statusNoLogon.da=Parret, men enheden logger ikke på (ingen MSG_LOCAL_LOGON). Den er som regel allerede logget på i et andet program (iTrain, Wizard) - afbryd dér, og forbind igen her.
bidib.statusNoLogon.sv=Parad, men enheten loggar inte på (ingen MSG_LOCAL_LOGON). Oftast är den redan påloggad i ett annat program (iTrain, Wizard) - koppla från där och anslut igen här.

