help.editMenuText.de=**Rückgängig** macht die letzte Änderung an den Daten rückgängig (Eintrag hinzugefügt/gelöscht, Attribut/Text geändert, Import...).\n**Wiederholen** stellt eine so rückgängig gemachte Änderung wieder her.\nBeides funktioniert auch über die beiden Symbole im Ribbon. Der Verlauf wird beim Öffnen einer neuen Datei geleert.\n\n**Alle Fenster zentrieren** holt alle offenen Fenster und Dialoge auf den Bildschirm des Hauptfensters zurück - der Ausweg, wenn ein Fenster nicht mehr auffindbar ist, weil es über den Bildschirmrand geschoben wurde oder auf einem inzwischen abgezogenen zweiten Bildschirm lag. Mehrere Fenster werden dabei leicht versetzt gestapelt, damit keines hinter einem anderen verschwindet. Dialoge und Meldungsfenster erscheinen ohnehin immer über dem Hauptfenster - auch bei mehreren Bildschirmen. Wird ein Dialog beiseite geschoben, merkt sich das Programm die Stelle und öffnet die folgenden wieder dort; **Alle Fenster zentrieren** setzt auch das zurück.
help.editMenuText.en=**Undo** reverts the last change made to the data (entry added/deleted, attribute/text changed, import...).\n**Redo** restores a change that was undone in this way.\nBoth are also available through the two icons in the ribbon. The history is cleared whenever a new file is opened.\n\n**Centre all windows** brings every open window and dialog back onto the screen of the main window - the way out when a window can no longer be found because it was pushed beyond the edge of the screen or was left on a second monitor that has since been disconnected. Several windows are stacked slightly offset so that none disappears behind another. Dialogs and message windows always appear over the main window anyway, even with several screens. If a dialog is moved aside, the program remembers the spot and opens the following ones there again; **Centre all windows** resets that as well.
help.editMenuText.nl=**Ongedaan maken** maakt de laatste wijziging aan de gegevens ongedaan (item toegevoegd/verwijderd, attribuut/tekst gewijzigd, import...).\n**Opnieuw** herstelt een zo ongedaan gemaakte wijziging.\nBeide werken ook via de twee symbolen in het lint. De geschiedenis wordt gewist zodra een nieuw bestand geopend wordt.\n\n**Alle vensters centreren** haalt alle geopende vensters en dialoogvensters terug naar het scherm van het hoofdvenster - de uitweg wanneer een venster niet meer te vinden is omdat het over de schermrand is geschoven of op een intussen losgekoppeld tweede scherm stond. Meerdere vensters worden licht verspringend gestapeld, zodat er geen achter een ander verdwijnt. Dialoogvensters en meldingen verschijnen sowieso altijd boven het hoofdvenster, ook bij meerdere schermen. Wordt een dialoogvenster opzijgeschoven, dan onthoudt het programma die plek en opent de volgende daar weer; **Alle vensters centreren** zet ook dat terug.
help.editMenuText.fr=**Annuler** annule la dernière modification apportée aux données (entrée ajoutée/supprimée, attribut/texte modifié, import...).\n**Rétablir** restaure une modification ainsi annulée.\nLes deux fonctionnent également via les deux icônes du ruban. L'historique est vidé à l'ouverture d'un nouveau fichier.\n\n**Centrer toutes les fenêtres** ramène toutes les fenêtres et boîtes de dialogue ouvertes sur l'écran de la fenêtre principale - la solution lorsqu'une fenêtre est introuvable parce qu'elle a été déplacée au-delà du bord de l'écran ou qu'elle se trouvait sur un second écran depuis débranché. Plusieurs fenêtres sont empilées avec un léger décalage afin qu'aucune ne disparaisse derrière une autre. Les boîtes de dialogue et les messages apparaissent de toute façon toujours au-dessus de la fenêtre principale, même avec plusieurs écrans. Si une boîte de dialogue est déplacée, le programme retient l'endroit et y ouvre les suivantes ; **Centrer toutes les fenêtres** réinitialise cela également.
help.editMenuText.es=**Deshacer** deshace el último cambio en los datos (entrada añadida/eliminada, atributo/texto modificado, importación...).\n**Rehacer** restablece un cambio deshecho de ese modo.\nAmbas funciones están también disponibles en los dos símbolos de la cinta. El historial se vacía al abrir un archivo nuevo.\n\n**Centrar todas las ventanas** devuelve todas las ventanas y diálogos abiertos a la pantalla de la ventana principal: la salida cuando una ventana ya no se encuentra porque se desplazó más allá del borde de la pantalla o quedó en un segundo monitor ya desconectado. Varias ventanas se apilan ligeramente desplazadas para que ninguna desaparezca detrás de otra. Los diálogos y las ventanas de aviso aparecen siempre sobre la ventana principal, también con varias pantallas. Si se aparta un diálogo, el programa recuerda el sitio y abre allí los siguientes; **Centrar todas las ventanas** también restablece eso.
help.editMenuText.it=**Annulla** annulla l'ultima modifica ai dati (voce aggiunta/eliminata, attributo/testo modificato, importazione...).\n**Ripeti** ripristina una modifica annullata in questo modo.\nEntrambi funzionano anche tramite i due simboli nella barra multifunzione. La cronologia viene svuotata all'apertura di un nuovo file.\n\n**Centra tutte le finestre** riporta tutte le finestre e le finestre di dialogo aperte sullo schermo della finestra principale: la via d'uscita quando una finestra non si trova più perché è stata spostata oltre il bordo dello schermo o è rimasta su un secondo monitor nel frattempo scollegato. Più finestre vengono impilate leggermente sfalsate, in modo che nessuna scompaia dietro un'altra. Le finestre di dialogo e i messaggi compaiono comunque sempre sopra la finestra principale, anche con più schermi. Se una finestra di dialogo viene spostata, il programma ricorda il punto e vi apre le successive; **Centra tutte le finestre** ripristina anche questo.
help.editMenuText.pt=**Desfazer** anula a última alteração aos dados (entrada adicionada/eliminada, atributo/texto alterado, importação...).\n**Refazer** repõe uma alteração assim anulada.\nAmbos funcionam também através dos dois símbolos no friso. O histórico é limpo sempre que é aberto um novo ficheiro.\n\n**Centrar todas as janelas** traz todas as janelas e caixas de diálogo abertas de volta para o ecrã da janela principal - a saída quando uma janela já não é encontrada por ter sido deslocada para além da margem do ecrã ou por ter ficado num segundo monitor entretanto desligado. Várias janelas são empilhadas ligeiramente desfasadas, para que nenhuma desapareça por trás de outra. As caixas de diálogo e janelas de mensagem aparecem sempre sobre a janela principal, mesmo com vários ecrãs. Se uma caixa de diálogo for afastada, o programa memoriza o local e abre aí as seguintes; **Centrar todas as janelas** repõe também isso.
help.editMenuText.pl=**Cofnij** cofa ostatnią zmianę danych (dodanie/usunięcie wpisu, zmiana atrybutu/tekstu, import...).\n**Ponów** przywraca tak cofniętą zmianę.\nObie funkcje działają również poprzez dwie ikony na wstążce. Historia jest czyszczona przy otwarciu nowego pliku.\n\n**Wyśrodkuj wszystkie okna** sprowadza wszystkie otwarte okna i okna dialogowe z powrotem na ekran okna głównego - to wyjście awaryjne, gdy okna nie da się już odnaleźć, bo zostało przesunięte poza krawędź ekranu albo pozostało na odłączonym w międzyczasie drugim monitorze. Kilka okien układanych jest z lekkim przesunięciem, aby żadne nie zniknęło za innym. Okna dialogowe i komunikaty i tak zawsze pojawiają się nad oknem głównym, również przy kilku ekranach. Jeśli okno dialogowe zostanie przesunięte, program zapamiętuje to miejsce i tam otwiera kolejne; **Wyśrodkuj wszystkie okna** cofa również to.
help.editMenuText.da=**Fortryd** fortryder den seneste ændring af dataene (post tilføjet/slettet, attribut/tekst ændret, import...).\n**Gentag** genskaber en ændring, der er fortrudt på den måde.\nBegge dele fungerer også via de to symboler på båndet. Historikken ryddes, når en ny fil åbnes.\n\n**Centrér alle vinduer** henter alle åbne vinduer og dialoger tilbage til hovedvinduets skærm - udvejen, når et vindue ikke længere kan findes, fordi det er skubbet ud over skærmkanten eller lå på en anden skærm, der siden er koblet fra. Flere vinduer stables let forskudt, så ingen forsvinder bag et andet. Dialoger og meddelelsesvinduer vises under alle omstændigheder altid over hovedvinduet, også ved flere skærme. Flyttes en dialog til side, husker programmet stedet og åbner de følgende dér igen; **Centrér alle vinduer** nulstiller også det.
help.editMenuText.sv=**Ångra** ångrar den senaste ändringen av data (post tillagd/borttagen, attribut/text ändrad, import...).\n**Gör om** återställer en ändring som ångrats på det sättet.\nBåda fungerar även via de två symbolerna i menyfliksområdet. Historiken töms när en ny fil öppnas.\n\n**Centrera alla fönster** hämtar tillbaka alla öppna fönster och dialogrutor till huvudfönstrets skärm - utvägen när ett fönster inte längre går att hitta för att det skjutits utanför skärmkanten eller låg kvar på en andra skärm som sedan kopplats bort. Flera fönster staplas något förskjutna så att inget försvinner bakom ett annat. Dialogrutor och meddelandefönster visas alltid över huvudfönstret, även med flera skärmar. Flyttas en dialogruta åt sidan minns programmet platsen och öppnar de följande där igen; **Centrera alla fönster** återställer även det.

