help.captureText.de=Mit **Decoder erfassen** legst du eine neue Decoder-Vorlage an, ohne dass eine iTrain-Datei geöffnet sein muss. Es öffnet sich ein eigenes, in der Größe veränderbares Fenster mit einer CV-Tabelle - mit denselben Spalten wie bei einer Lokomotive (Aktiv, Nr., Wert, Typ, Bezeichnung).\n\nDie Tabelle steht mit 1000 leeren Zeilen bereit und hängt selbsttätig weitere an, sobald du dich dem Ende näherst - die Zahl ist eine Vorgabe, keine Obergrenze. Was davon gespeichert wird, entscheidet allein der Haken in der Spalte **Aktiv**: Er setzt sich beim Ausfüllen einer Zeile von selbst und verschwindet wieder, sobald du sie leerst. Der ungenutzte Rest wird beim Speichern verworfen.\n\n**Werte eintragen:** Eine Zelle anklicken und einfach lostippen - die Eingabe beginnt sofort. **Tabulator** und die **Pfeiltasten** übernehmen den Wert und springen zur Nachbarzelle, die Eingabetaste geht eine Zeile tiefer. So lässt sich eine ganze CV-Liste in einem Zug eintippen. **X** leert die markierte Zeile wieder, **+** hängt hundert Zeilen an.\n\n**Werte aus der Anleitung übernehmen:** Die Anleitung des Herstellers öffnest du in deinem gewohnten PDF-Programm. Dort die gewünschten Zeilen markieren und kopieren, hier einfügen: **Strg+V** setzt den Text in die ausgewählte Zelle, **Ab hier einfügen** verteilt eine größere Markierung ab der ausgewählten Zeile auf mehrere Zeilen. Beginnt eine Zeile mit einer Zahl, gilt diese als CV-Nummer, eine darauf folgende kurze Zahl als Wert, der Rest wird zur Bezeichnung - bitte prüfen, das ist eine einfache Regel und trifft nicht jede Anleitung.\n\n**Vorlage einlesen:** Der gleichnamige Knopf übernimmt die CV-Liste einer vorhandenen Decoder-Vorlage in die Tabelle - mit Typ und Bezeichnung. Stehen einzelne CV-Nummern schon darin, fragt das Programm nach: **Werte behalten** lässt deine eigenen Werte stehen und ergänzt nur Typ und Bezeichnung aus der Vorlage, **Werte überschreiben** holt auch die Werte von dort. Das ist der schnelle Weg, ein Fahrzeug mit wenigen gepflegten CVs auf die vollständige Liste des Herstellers zu bringen, ohne die eigene Adresse zu verlieren.\n\n**Speichern** legt die Vorlage als CSV-Datei im Ordner für Decoder-Vorlagen ab - danach steht sie unter **Decoder importieren** zur Auswahl. **Speichern als...** fragt nach einer neuen Bezeichnung und legt zusätzlich eine zweite Vorlage an. **Speichern & Senden** speichert ebenso und öffnet dein E-Mail-Programm mit fertigem Betreff und Text, damit du die Vorlage einsenden kannst. Die Datei muss dabei von Hand angehängt werden: ihr Pfad liegt bereits in der Zwischenablage und der Ordner wird geöffnet. Ein automatisches Anhängen ist über das E-Mail-Verfahren "mailto" technisch nicht möglich; deine Signatur ergänzt dein E-Mail-Programm wie gewohnt selbst.\n\n**Dasselbe Fenster für vorhandene Fahrzeuge:** Ist eine Datei geöffnet, findest du bei **Lokomotiven** und **Wagen** im Daten-Explorer den Knoten **configuration**. Wählst du ihn aus, erscheint unter der CV-Tabelle der Knopf **In eigenem Fenster bearbeiten** - er öffnet genau dieselbe große Tabelle mit den Werten dieses Fahrzeugs. **Übernehmen** schreibt sie zurück ins Dokument (mit **Rückgängig** zurücknehmbar), **Abbrechen** verwirft alles.\n\n**Lange Beschreibungen ansehen und ändern:** Ein **Doppelklick** auf ein Feld der Spalte Beschreibung öffnet den Text in einem eigenen Fenster - mehrzeilig und mit automatischem Zeilenumbruch. Beschreibungen aus Hersteller-Anleitungen sind oft länger, als die Spalte zeigen kann; hier stehen sie vollständig da. **Speichern** übernimmt die Änderung, **Abbruch** verwirft sie. Zum Eintippen eines kurzen Textes bleibt der bisherige Weg: einfach lostippen oder die Eingabetaste drücken.\n\nBeim Bearbeiten einer **vorhandenen Vorlage** (Einstellungen → Decoder-Vorlagen → **In eigenem Fenster bearbeiten**) fehlt dieser Knopf. Dort ist die Vorlage bereits geöffnet; eine zweite darüberzuladen würde die gerade bearbeitete kommentarlos ersetzen.\n\n**Die Spalte Nr. ist die Zeile:** Zeile 1 ist CV 1, Zeile 8 ist CV 8. Die Nummer lässt sich deshalb nicht eintippen - sie steht fest. Beim Einlesen einer Vorlage und beim Einfügen aus der Anleitung landet jeder Eintrag in der Zeile seiner CV-Nummer; Lücken dazwischen bleiben leer. Welche Zeilen in die Vorlage wandern, entscheidet allein der Haken in **Aktiv**, und der setzt sich von selbst, sobald in Wert, Typ oder Bezeichnung etwas steht.
help.captureText.en=With **Capture decoder** you create a new decoder template without any iTrain file having to be open. A separate, resizable window opens with a CV table - the same columns as for a locomotive (Active, No., Value, Type, Name).\n\nThe table comes with 1000 empty rows and adds more by itself as you approach the end - the number is a starting point, not a limit. What gets saved is decided solely by the tick in the **Active** column: it appears by itself as you fill a row in and disappears again once you clear it. The unused remainder is discarded when saving.\n\n**Entering values:** Click a cell and simply start typing - the entry begins at once. **Tab** and the **arrow keys** take over the value and jump to the neighbouring cell, Enter moves down one row. A whole CV list can thus be typed in one go. **X** clears the selected row again, **+** appends a hundred rows.\n\n**Taking values from the manual:** Open the manufacturer's manual in your usual PDF program. Select and copy the lines you want there, then insert them here: **Ctrl+V** puts the text into the selected cell, **Paste from here** spreads a larger selection across several rows starting at the selected one. If a line begins with a number, that is taken as the CV number, a short number following it as the value, and the rest becomes the name - please check, this is a simple rule and does not fit every manual.\n\n**Load template:** The button of that name takes the CV list of an existing decoder template into the table - with type and name. If some CV numbers are already there, the program asks: **Keep values** leaves your own values in place and only adds type and name from the template, **Replace values** takes the values from there as well. This is the quick way to bring a vehicle with a handful of maintained CVs up to the manufacturer's full list without losing its own address.\n\n**Save** stores the template as a CSV file in the decoder templates folder - it is then available under **Import decoder**. **Save as...** asks for a new name and creates a second template in addition. **Save & send** saves it as well and opens your e-mail program with a ready-made subject and text so you can submit the template. The file has to be attached by hand: its path is already in the clipboard and the folder is opened. Automatic attachment is technically impossible with the "mailto" e-mail method; your signature is added by your e-mail program as usual.\n\n**The same window for existing vehicles:** With a file open, the data explorer shows a **configuration** node under **Locomotives** and **Wagons**. Selecting it makes the button **Edit in a separate window** appear below the CV table - it opens exactly the same large table with that vehicle's values. **Apply** writes them back into the document (revertible with **Undo**), **Cancel** discards everything.\n\n**Viewing and changing long descriptions:** A **double-click** on a field in the Description column opens the text in a window of its own - multi-line and with automatic word wrap. Descriptions from manufacturer manuals are often longer than the column can show; here they appear in full. **Save** applies the change, **Cancel** discards it. For typing something short the previous route remains: just start typing or press Enter.\n\nWhen editing an **existing template** (Settings → Decoder templates → **Edit in separate window**) this button is absent. The template is already open there; loading a second one over it would replace the one you are working on without warning.\n\n**The Nr. column is the row:** row 1 is CV 1, row 8 is CV 8. The number therefore cannot be typed - it is fixed. When loading a template or pasting from a manual, every entry lands in the row of its CV number; the gaps in between stay empty. Which rows go into the template is decided solely by the tick in **Active**, and that sets itself as soon as there is something in Value, Type or Name.
help.captureText.nl=Met **Decoder vastleggen** maak je een nieuw decodersjabloon aan, zonder dat er een iTrain-bestand geopend hoeft te zijn. Er opent een eigen venster met instelbare grootte met een CV-tabel - met dezelfde kolommen als bij een locomotief (Actief, Nr., Waarde, Type, Naam).\n\nDe tabel staat klaar met 1000 lege regels en voegt er vanzelf meer toe zodra je het einde nadert - het getal is een uitgangspunt, geen bovengrens. Wat er wordt opgeslagen, bepaalt alleen het vinkje in de kolom **Actief**: het verschijnt vanzelf zodra je een regel invult en verdwijnt weer zodra je die leegmaakt. De ongebruikte rest vervalt bij het opslaan.\n\n**Waarden invoeren:** Klik op een cel en begin gewoon te typen - de invoer start meteen. **Tab** en de **pijltjestoetsen** nemen de waarde over en springen naar de volgende cel, Enter gaat een regel omlaag. Zo typ je een hele CV-lijst in één keer in. **X** maakt de geselecteerde regel weer leeg, **+** voegt honderd regels toe.\n\n**Waarden uit de handleiding overnemen:** De handleiding van de fabrikant open je in je vertrouwde PDF-programma. Selecteer en kopieer daar de gewenste regels, voeg ze hier in: **Ctrl+V** zet de tekst in de geselecteerde cel, **Vanaf hier plakken** verdeelt een grotere selectie vanaf de geselecteerde regel over meerdere regels. Begint een regel met een getal, dan geldt dat als CV-nummer, een daaropvolgend kort getal als waarde en de rest wordt de naam - controleer dit, het is een eenvoudige regel en past niet bij elke handleiding.\n\n**Sjabloon inlezen:** De gelijknamige knop neemt de CV-lijst van een bestaand decodersjabloon over in de tabel - met type en naam. Staan er al enkele CV-nummers in, dan vraagt het programma: **Waarden behouden** laat je eigen waarden staan en vult alleen type en naam uit het sjabloon aan, **Waarden overschrijven** haalt ook de waarden daarvandaan. Dat is de snelle manier om een voertuig met enkele bijgehouden CV's op de volledige lijst van de fabrikant te brengen zonder het eigen adres te verliezen.\n\n**Opslaan** legt het sjabloon als CSV-bestand in de map voor decodersjablonen - daarna staat het onder **Decoder importeren** ter keuze. **Opslaan als...** vraagt om een nieuwe naam en maakt bovendien een tweede sjabloon aan. **Opslaan & verzenden** slaat het eveneens op en opent je e-mailprogramma met kant-en-klaar onderwerp en tekst, zodat je het sjabloon kunt insturen. Het bestand moet daarbij handmatig worden bijgevoegd: het pad staat al op het klembord en de map wordt geopend. Automatisch bijvoegen is via de e-mailmethode "mailto" technisch niet mogelijk; je handtekening voegt je e-mailprogramma zoals gewoonlijk zelf toe.\n\n**Hetzelfde venster voor bestaande voertuigen:** Is er een bestand geopend, dan vind je bij **Locomotieven** en **Wagons** in de data-explorer het knooppunt **configuration**. Selecteer je dat, dan verschijnt onder de CV-tabel de knop **In eigen venster bewerken** - die opent precies dezelfde grote tabel met de waarden van dit voertuig. **Overnemen** schrijft ze terug in het document (met **Ongedaan maken** terug te nemen), **Annuleren** verwerpt alles.\n\n**Lange beschrijvingen bekijken en wijzigen:** Een **dubbelklik** op een veld in de kolom Beschrijving opent de tekst in een eigen venster - meerdere regels en met automatische regelafbreking. Beschrijvingen uit handleidingen van fabrikanten zijn vaak langer dan de kolom kan tonen; hier staan ze volledig. **Opslaan** neemt de wijziging over, **Annuleren** verwerpt haar. Voor een korte tekst blijft de bestaande weg: gewoon typen of op Enter drukken.\n\nBij het bewerken van een **bestaand sjabloon** (Instellingen → Decodersjablonen → **In eigen venster bewerken**) ontbreekt deze knop. Het sjabloon is daar al geopend; er een tweede overheen laden zou het sjabloon waaraan je werkt zonder melding vervangen.\n\n**De kolom Nr. is de regel:** regel 1 is CV 1, regel 8 is CV 8. Het nummer is daarom niet in te typen - het ligt vast. Bij het inlezen van een sjabloon en bij het plakken uit de handleiding komt elke vermelding in de regel van zijn CV-nummer terecht; de gaten ertussen blijven leeg. Welke regels in het sjabloon belanden bepaalt alleen het vinkje in **Actief**, en dat zet zichzelf zodra er iets in Waarde, Type of Naam staat.
help.captureText.fr=Avec **Saisir un décodeur**, vous créez un nouveau modèle de décodeur sans qu'aucun fichier iTrain doive être ouvert. Une fenêtre distincte et redimensionnable s'ouvre avec un tableau CV - les mêmes colonnes que pour une locomotive (Actif, N°, Valeur, Type, Nom).\n\nLe tableau propose d'emblée 1000 lignes vides et en ajoute de lui-même dès que vous approchez de la fin - ce nombre est un point de départ, pas une limite. Ce qui sera enregistré dépend uniquement de la coche dans la colonne **Actif** : elle apparaît d'elle-même dès que vous remplissez une ligne et disparaît lorsque vous la videz. Le reste inutilisé est écarté à l'enregistrement.\n\n**Saisir les valeurs :** Cliquez une cellule et commencez simplement à taper - la saisie démarre aussitôt. La **tabulation** et les **flèches** valident la valeur et passent à la cellule voisine, Entrée descend d'une ligne. Une liste CV entière se saisit ainsi d'un trait. **X** vide la ligne sélectionnée, **+** ajoute cent lignes.\n\n**Reprendre les valeurs de la notice :** Ouvrez la notice du fabricant dans votre logiciel PDF habituel. Sélectionnez-y les lignes voulues et copiez-les, puis insérez-les ici : **Ctrl+V** place le texte dans la cellule sélectionnée, **Coller à partir d'ici** répartit une sélection plus grande sur plusieurs lignes à partir de la ligne sélectionnée. Si une ligne commence par un nombre, celui-ci est pris comme numéro de CV, un court nombre suivant comme valeur, et le reste devient le nom - vérifiez, c'est une règle simple qui ne convient pas à toutes les notices.\n\n**Charger un modèle :** Le bouton du même nom reprend la liste CV d'un modèle de décodeur existant dans le tableau - avec type et nom. Si certains numéros de CV s'y trouvent déjà, le programme demande : **Conserver les valeurs** laisse vos propres valeurs en place et n'ajoute que le type et le nom du modèle, **Remplacer les valeurs** en reprend aussi les valeurs. C'est le moyen rapide d'amener un véhicule ne comportant que quelques CV renseignées à la liste complète du fabricant, sans perdre sa propre adresse.\n\n**Enregistrer** dépose le modèle sous forme de fichier CSV dans le dossier des modèles de décodeur - il est ensuite proposé sous **Importer le décodeur**. **Enregistrer sous...** demande un nouveau nom et crée un second modèle. **Enregistrer et envoyer** l'enregistre également et ouvre votre logiciel de messagerie avec objet et texte prêts, afin que vous puissiez soumettre le modèle. Le fichier doit alors être joint à la main : son chemin est déjà dans le presse-papiers et le dossier s'ouvre. Une pièce jointe automatique est techniquement impossible avec la méthode « mailto » ; votre signature est ajoutée comme d'habitude par votre logiciel de messagerie.\n\n**La même fenêtre pour les véhicules existants :** Un fichier étant ouvert, l'explorateur de données affiche un nœud **configuration** sous **Locomotives** et **Wagons**. En le sélectionnant, le bouton **Modifier dans une fenêtre séparée** apparaît sous le tableau CV - il ouvre exactement le même grand tableau avec les valeurs de ce véhicule. **Appliquer** les réécrit dans le document (réversible par **Annuler** dans le menu Édition), **Annuler** abandonne tout.\n\n**Voir et modifier les longues descriptions :** Un **double-clic** sur un champ de la colonne Description ouvre le texte dans une fenêtre à part - sur plusieurs lignes et avec retour à la ligne automatique. Les descriptions des notices de fabricants sont souvent plus longues que ce que la colonne peut montrer ; ici elles apparaissent en entier. **Enregistrer** applique la modification, **Annuler** l'abandonne. Pour saisir un texte court, l'ancien chemin subsiste : taper directement ou appuyer sur Entrée.\n\nLors de la modification d'un **modèle existant** (Réglages → Modèles de décodeur → **Modifier dans une fenêtre séparée**), ce bouton est absent. Le modèle y est déjà ouvert ; en charger un second par-dessus remplacerait sans avertissement celui en cours de modification.\n\n**La colonne N° est la ligne :** la ligne 1 est le CV 1, la ligne 8 le CV 8. Le numéro ne peut donc pas être saisi - il est fixe. Lors du chargement d'un modèle et du collage depuis la notice, chaque entrée se place sur la ligne de son numéro de CV ; les trous restent vides. Ce qui part dans le modèle est décidé uniquement par la coche **Actif**, laquelle se met d'elle-même dès qu'il y a quelque chose dans Valeur, Type ou Désignation.
help.captureText.es=Con **Capturar decoder** se crea una nueva plantilla de decoder sin que tenga que haber ningún archivo iTrain abierto. Se abre una ventana propia y redimensionable con una tabla CV, con las mismas columnas que en una locomotora (Activo, N.º, Valor, Tipo, Nombre).\n\nLa tabla se abre con 1000 filas vacías y añade más por sí sola en cuanto se acerca al final: la cifra es un punto de partida, no un límite. Lo que se guarda lo decide únicamente la marca de la columna **Activo**: aparece sola al rellenar una fila y desaparece en cuanto se vacía. El resto sin usar se descarta al guardar.\n\n**Introducir valores:** Haga clic en una celda y empiece a teclear; la entrada comienza de inmediato. El **tabulador** y las **flechas** aceptan el valor y saltan a la celda contigua, Intro baja una fila. Así se teclea una lista CV completa de una vez. **X** vacía la fila seleccionada, **+** añade cien filas.\n\n**Tomar valores del manual:** Abra el manual del fabricante en su programa de PDF habitual. Marque y copie allí las líneas deseadas e insértelas aquí: **Ctrl+V** pone el texto en la celda seleccionada; **Pegar desde aquí** reparte una selección mayor en varias filas a partir de la seleccionada. Si una línea empieza por un número, este se toma como número de CV, un número corto a continuación como valor, y el resto pasa a ser el nombre; compruébelo, es una regla sencilla y no encaja con todos los manuales.\n\n**Cargar plantilla:** El botón del mismo nombre lleva la lista CV de una plantilla de decoder existente a la tabla, con tipo y nombre. Si ya hay algunos números de CV, el programa pregunta: **Conservar valores** deja sus propios valores y solo añade tipo y nombre de la plantilla; **Sustituir valores** toma también los valores de allí. Es la forma rápida de llevar un vehículo con unas pocas CV cuidadas a la lista completa del fabricante sin perder su propia dirección.\n\n**Guardar** deposita la plantilla como archivo CSV en la carpeta de plantillas de decoder; después queda disponible en **Importar decoder**. **Guardar como...** pide un nombre nuevo y crea además una segunda plantilla. **Guardar y enviar** la guarda igualmente y abre su programa de correo con asunto y texto ya preparados para que pueda enviar la plantilla. El archivo debe adjuntarse a mano: su ruta ya está en el portapapeles y la carpeta se abre. Adjuntar automáticamente no es técnicamente posible con el método de correo «mailto»; su firma la añade su programa de correo como de costumbre.\n\n**La misma ventana para vehículos existentes:** Con un archivo abierto, el explorador de datos muestra un nodo **configuration** en **Locomotoras** y **Vagones**. Al seleccionarlo aparece bajo la tabla CV el botón **Editar en una ventana propia**, que abre exactamente la misma tabla grande con los valores de ese vehículo. **Aplicar** los devuelve al documento (reversible con **Deshacer**), **Cancelar** descarta todo.\n\n**Ver y cambiar descripciones largas:** Un **doble clic** en un campo de la columna Descripción abre el texto en una ventana propia, en varias líneas y con salto de línea automático. Las descripciones de los manuales del fabricante suelen ser más largas de lo que la columna puede mostrar; aquí aparecen completas. **Guardar** aplica el cambio, **Cancelar** lo descarta. Para escribir algo corto sigue valiendo el camino anterior: empezar a teclear o pulsar Intro.\n\nAl editar una **plantilla existente** (Ajustes → Plantillas de decoder → **Editar en ventana propia**) este botón no aparece. Allí la plantilla ya está abierta; cargar una segunda encima sustituiría sin avisar la que se está editando.\n\n**La columna N.º es la fila:** la fila 1 es el CV 1, la fila 8 el CV 8. Por eso el número no se puede teclear: es fijo. Al leer una plantilla y al pegar desde el manual, cada entrada va a la fila de su número de CV; los huecos quedan vacíos. Qué filas pasan a la plantilla lo decide solo la marca de **Activo**, que se pone sola en cuanto hay algo en Valor, Tipo o Denominación.
help.captureText.it=Con **Acquisisci decoder** crei un nuovo modello di decoder senza che debba essere aperto alcun file iTrain. Si apre una finestra a sé, ridimensionabile, con una tabella CV - le stesse colonne di una locomotiva (Attivo, N., Valore, Tipo, Nome).\n\nLa tabella si apre con 1000 righe vuote e ne aggiunge altre da sola quando ti avvicini alla fine: il numero è un punto di partenza, non un limite. Ciò che viene salvato lo decide unicamente la spunta nella colonna **Attivo**: compare da sola quando compili una riga e sparisce non appena la svuoti. Il resto inutilizzato viene scartato al salvataggio.\n\n**Inserire i valori:** Fai clic su una cella e inizia semplicemente a digitare - l'inserimento parte subito. Il **tabulatore** e le **frecce** confermano il valore e passano alla cella accanto, Invio scende di una riga. Così un'intera lista CV si digita in un colpo solo. **X** svuota la riga selezionata, **+** aggiunge cento righe.\n\n**Riprendere i valori dal manuale:** Apri il manuale del produttore nel tuo solito programma PDF. Lì seleziona e copia le righe desiderate, quindi inseriscile qui: **Ctrl+V** mette il testo nella cella selezionata, **Incolla da qui** distribuisce una selezione più ampia su più righe a partire da quella selezionata. Se una riga inizia con un numero, questo vale come numero CV, un successivo numero breve come valore e il resto diventa il nome - da controllare, è una regola semplice e non si adatta a ogni manuale.\n\n**Carica modello:** Il pulsante omonimo riprende nella tabella l'elenco CV di un modello di decoder esistente - con tipo e nome. Se alcuni numeri CV sono già presenti, il programma chiede: **Mantieni i valori** lascia i tuoi valori e aggiunge soltanto tipo e nome dal modello, **Sostituisci i valori** prende da lì anche i valori. È il modo rapido per portare un veicolo con poche CV curate all'elenco completo del produttore senza perdere il proprio indirizzo.\n\n**Salva** deposita il modello come file CSV nella cartella dei modelli di decoder: da quel momento è disponibile in **Importa decoder**. **Salva con nome...** chiede un nuovo nome e crea in più un secondo modello. **Salva e invia** lo salva ugualmente e apre il tuo programma di posta con oggetto e testo già pronti, così puoi inviare il modello. Il file va allegato a mano: il suo percorso è già negli appunti e la cartella viene aperta. L'allegato automatico non è tecnicamente possibile con il metodo di posta "mailto"; la tua firma viene aggiunta come sempre dal tuo programma di posta.\n\n**La stessa finestra per i veicoli esistenti:** Con un file aperto, l'esploratore dati mostra un nodo **configuration** in **Locomotive** e **Carrozze**. Selezionandolo compare sotto la tabella CV il pulsante **Modifica in una finestra separata**, che apre esattamente la stessa tabella grande con i valori di quel veicolo. **Applica** li riscrive nel documento (reversibile con **Annulla**), **Annulla** scarta tutto.\n\n**Vedere e modificare descrizioni lunghe:** Un **doppio clic** su un campo della colonna Descrizione apre il testo in una finestra propria - su più righe e con ritorno a capo automatico. Le descrizioni dei manuali dei costruttori sono spesso più lunghe di quanto la colonna possa mostrare; qui compaiono per intero. **Salva** applica la modifica, **Annulla** la scarta. Per inserire un testo breve resta la via di prima: iniziare a digitare o premere Invio.\n\nQuando si modifica un **modello esistente** (Impostazioni → Modelli di decoder → **Modifica in una finestra propria**) questo pulsante non c'è. Lì il modello è già aperto; caricarne un secondo sopra sostituirebbe senza preavviso quello in lavorazione.\n\n**La colonna N. è la riga:** la riga 1 è la CV 1, la riga 8 la CV 8. Il numero non si può quindi digitare: è fisso. Caricando un modello e incollando dal manuale, ogni voce finisce nella riga del proprio numero di CV; i vuoti restano vuoti. Quali righe entrano nel modello lo decide solo la spunta **Attivo**, che si mette da sola non appena c'è qualcosa in Valore, Tipo o Denominazione.
help.captureText.pt=Com **Recolher descodificador** cria um novo modelo de descodificador sem que tenha de estar aberto qualquer ficheiro iTrain. Abre-se uma janela própria e redimensionável com uma tabela CV - com as mesmas colunas que numa locomotiva (Ativo, N.º, Valor, Tipo, Nome).\n\nA tabela abre com 1000 linhas vazias e acrescenta mais sozinha assim que se aproxima do fim - o número é um ponto de partida, não um limite. O que é guardado depende apenas da marca na coluna **Ativo**: aparece sozinha ao preencher uma linha e desaparece assim que a esvazia. O resto não utilizado é descartado ao guardar.\n\n**Introduzir valores:** Clique numa célula e comece simplesmente a escrever - a introdução começa de imediato. O **tabulador** e as **setas** aceitam o valor e saltam para a célula ao lado, Enter desce uma linha. Assim escreve-se uma lista CV inteira de uma vez. **X** esvazia a linha selecionada, **+** acrescenta cem linhas.\n\n**Retirar valores do manual:** Abra o manual do fabricante no seu programa de PDF habitual. Aí marque e copie as linhas pretendidas e insira-as aqui: **Ctrl+V** coloca o texto na célula selecionada, **Colar a partir daqui** distribui uma seleção maior por várias linhas a partir da selecionada. Se uma linha começar por um número, este é tomado como número CV, um número curto a seguir como valor, e o resto passa a ser o nome - verifique, é uma regra simples e não serve para todos os manuais.\n\n**Carregar modelo:** O botão com esse nome traz para a tabela a lista CV de um modelo de descodificador existente - com tipo e nome. Se já lá estiverem alguns números CV, o programa pergunta: **Manter valores** deixa os seus próprios valores e acrescenta apenas o tipo e o nome do modelo; **Substituir valores** traz de lá também os valores. É a forma rápida de levar um veículo com poucas CV tratadas até à lista completa do fabricante sem perder o seu próprio endereço.\n\n**Guardar** coloca o modelo como ficheiro CSV na pasta de modelos de descodificador - depois fica disponível em **Importar descodificador**. **Guardar como...** pede um novo nome e cria adicionalmente um segundo modelo. **Guardar e enviar** guarda-o igualmente e abre o seu programa de e-mail com assunto e texto prontos, para que possa enviar o modelo. O ficheiro tem de ser anexado à mão: o seu caminho já está na área de transferência e a pasta é aberta. Anexar automaticamente não é tecnicamente possível com o método de e-mail "mailto"; a sua assinatura é acrescentada como habitualmente pelo seu programa de e-mail.\n\n**A mesma janela para veículos existentes:** Com um ficheiro aberto, o explorador de dados mostra um nó **configuration** em **Locomotivas** e **Vagões**. Ao selecioná-lo aparece por baixo da tabela CV o botão **Editar numa janela própria**, que abre exatamente a mesma tabela grande com os valores desse veículo. **Aplicar** volta a escrevê-los no documento (reversível com **Anular**), **Cancelar** descarta tudo.\n\n**Ver e alterar descrições longas:** Um **duplo clique** num campo da coluna Descrição abre o texto numa janela própria - em várias linhas e com mudança de linha automática. As descrições dos manuais do fabricante são muitas vezes mais longas do que a coluna consegue mostrar; aqui aparecem por completo. **Guardar** aplica a alteração, **Cancelar** descarta-a. Para escrever algo curto mantém-se o caminho anterior: começar a escrever ou premir Enter.\n\nAo editar um **modelo existente** (Definições → Modelos de decoder → **Editar em janela própria**) este botão não aparece. Aí o modelo já está aberto; carregar um segundo por cima substituiria sem aviso aquele que está a ser editado.\n\n**A coluna N.º é a linha:** a linha 1 é o CV 1, a linha 8 o CV 8. Por isso o número não se pode escrever: está fixo. Ao ler um modelo e ao colar do manual, cada entrada vai para a linha do seu número de CV; os intervalos ficam vazios. Que linhas entram no modelo decide-o apenas a marca de **Ativo**, que se põe sozinha assim que houver algo em Valor, Tipo ou Designação.
help.captureText.pl=Poleceniem **Rejestruj dekoder** tworzysz nowy szablon dekodera bez potrzeby otwierania pliku iTrain. Otwiera się osobne okno o zmiennej wielkości z tabelą CV - o tych samych kolumnach co przy lokomotywie (Aktywny, Nr, Wartość, Typ, Nazwa).\n\nTabela zawiera od razu 1000 pustych wierszy i sama dokłada kolejne, gdy zbliżasz się do końca - liczba ta jest punktem wyjścia, a nie górną granicą. O tym, co zostanie zapisane, decyduje wyłącznie znacznik w kolumnie **Aktywny**: pojawia się sam przy wypełnianiu wiersza i znika, gdy wiersz zostanie wyczyszczony. Niewykorzystana reszta jest przy zapisie pomijana.\n\n**Wprowadzanie wartości:** Kliknij komórkę i po prostu zacznij pisać - wprowadzanie rozpoczyna się natychmiast. **Tabulator** i **strzałki** zatwierdzają wartość i przechodzą do sąsiedniej komórki, Enter schodzi o wiersz niżej. W ten sposób całą listę CV wpisuje się za jednym razem. **X** czyści zaznaczony wiersz, **+** dodaje sto wierszy.\n\n**Przejmowanie wartości z instrukcji:** Instrukcję producenta otwórz w swoim zwykłym programie PDF. Zaznacz tam i skopiuj potrzebne wiersze, a następnie wstaw je tutaj: **Ctrl+V** wstawia tekst do zaznaczonej komórki, **Wstaw od tego miejsca** rozdziela większe zaznaczenie na kilka wierszy, począwszy od zaznaczonego. Jeśli wiersz zaczyna się liczbą, jest ona traktowana jako numer CV, następująca po niej krótka liczba jako wartość, a reszta staje się nazwą - sprawdź to, jest to prosta reguła i nie pasuje do każdej instrukcji.\n\n**Wczytaj szablon:** Przycisk o tej nazwie przenosi do tabeli listę CV istniejącego szablonu dekodera - wraz z typem i nazwą. Jeśli niektóre numery CV już w niej są, program pyta: **Zachowaj wartości** pozostawia Twoje własne wartości i uzupełnia jedynie typ oraz nazwę z szablonu, **Nadpisz wartości** pobiera stamtąd również wartości. To szybki sposób, by pojazd z kilkoma uzupełnionymi CV doprowadzić do pełnej listy producenta, nie tracąc własnego adresu.\n\n**Zapisz** umieszcza szablon jako plik CSV w folderze szablonów dekoderów - potem jest dostępny w **Importuj dekoder**. **Zapisz jako...** pyta o nową nazwę i tworzy dodatkowo drugi szablon. **Zapisz i wyślij** zapisuje tak samo i dodatkowo otwiera program pocztowy z gotowym tematem i tekstem, abyś mógł przesłać szablon. Plik trzeba przy tym dołączyć ręcznie: jego ścieżka jest już w schowku, a folder zostaje otwarty. Automatyczne dołączanie nie jest technicznie możliwe metodą pocztową „mailto”; podpis dodaje jak zwykle Twój program pocztowy.\n\n**To samo okno dla istniejących pojazdów:** Gdy plik jest otwarty, w eksploratorze danych przy **Lokomotywach** i **Wagonach** znajdziesz węzeł **configuration**. Po jego zaznaczeniu pod tabelą CV pojawia się przycisk **Edytuj w osobnym oknie** - otwiera dokładnie tę samą dużą tabelę z wartościami tego pojazdu. **Zastosuj** zapisuje je z powrotem do dokumentu (można cofnąć poleceniem **Cofnij**), **Anuluj** odrzuca wszystko.\n\n**Podgląd i zmiana długich opisów:** **Dwuklik** na polu w kolumnie Opis otwiera tekst we własnym oknie - wielowierszowo i z automatycznym zawijaniem. Opisy z instrukcji producentów bywają dłuższe, niż kolumna jest w stanie pokazać; tutaj widać je w całości. **Zapisz** przyjmuje zmianę, **Anuluj** ją odrzuca. Do wpisania czegoś krótkiego pozostaje dotychczasowa droga: po prostu zacząć pisać albo nacisnąć Enter.\n\nPodczas edycji **istniejącego szablonu** (Ustawienia → Szablony dekoderów → **Edytuj we własnym oknie**) tego przycisku nie ma. Szablon jest tam już otwarty; wczytanie drugiego na wierzch zastąpiłoby bez ostrzeżenia ten właśnie edytowany.\n\n**Kolumna Nr to wiersz:** wiersz 1 to CV 1, wiersz 8 to CV 8. Numeru nie da się więc wpisać - jest stały. Przy wczytywaniu szablonu i wklejaniu z instrukcji każda pozycja trafia do wiersza swojego numeru CV; luki pozostają puste. O tym, które wiersze wejdą do szablonu, decyduje wyłącznie znacznik **Aktywny**, a ten stawia się sam, gdy tylko coś pojawi się w polu Wartość, Typ lub Nazwa.
help.captureText.da=Med **Registrér dekoder** opretter du en ny dekoderskabelon, uden at der skal være åbnet en iTrain-fil. Der åbnes et separat vindue i variabel størrelse med en CV-tabel - med de samme kolonner som ved et lokomotiv (Aktiv, Nr., Værdi, Type, Navn).\n\nTabellen står klar med 1000 tomme rækker og tilføjer selv flere, når du nærmer dig slutningen - tallet er et udgangspunkt, ikke en grænse. Hvad der bliver gemt, afgøres alene af markeringen i kolonnen **Aktiv**: den sættes af sig selv, når du udfylder en række, og forsvinder igen, når du rydder den. Resten, der ikke er brugt, kasseres ved gemningen.\n\n**Indtastning af værdier:** Klik på en celle, og begynd bare at skrive - indtastningen starter med det samme. **Tabulator** og **piletasterne** overtager værdien og springer til nabocellen, Enter går en række ned. Sådan skrives en hel CV-liste i ét træk. **X** rydder den markerede række, **+** tilføjer hundrede rækker.\n\n**Overtagelse af værdier fra vejledningen:** Producentens vejledning åbner du i dit vante PDF-program. Marker og kopier de ønskede linjer dér, og indsæt dem her: **Ctrl+V** sætter teksten i den markerede celle, **Indsæt herfra** fordeler en større markering over flere rækker fra den markerede. Begynder en linje med et tal, opfattes det som CV-nummer, et efterfølgende kort tal som værdi, og resten bliver navnet - kontroller det, det er en enkel regel, som ikke passer til enhver vejledning.\n\n**Indlæs skabelon:** Knappen af samme navn henter CV-listen fra en eksisterende dekoderskabelon ind i tabellen - med type og navn. Står nogle CV-numre der allerede, spørger programmet: **Behold værdier** lader dine egne værdier stå og tilføjer kun type og navn fra skabelonen, **Overskriv værdier** henter også værdierne derfra. Det er den hurtige måde at bringe et køretøj med få vedligeholdte CV'er op på producentens fulde liste uden at miste sin egen adresse.\n\n**Gem** lægger skabelonen som CSV-fil i mappen til dekoderskabeloner - derefter er den tilgængelig under **Importér dekoder**. **Gem som...** spørger om et nyt navn og opretter yderligere en anden skabelon. **Gem & send** gemmer den ligeledes og åbner dit e-mailprogram med færdigt emne og tekst, så du kan indsende skabelonen. Filen skal her vedhæftes manuelt: dens sti ligger allerede i udklipsholderen, og mappen åbnes. Automatisk vedhæftning er teknisk ikke mulig via e-mailmetoden "mailto"; din signatur tilføjer dit e-mailprogram som sædvanligt selv.\n\n**Det samme vindue til eksisterende køretøjer:** Er en fil åbnet, finder du under **Lokomotiver** og **Vogne** i datastifinderen knuden **configuration**. Vælger du den, kommer knappen **Rediger i et separat vindue** frem under CV-tabellen - den åbner præcis den samme store tabel med dette køretøjs værdier. **Anvend** skriver dem tilbage i dokumentet (kan tages tilbage med **Fortryd**), **Annuller** kasserer det hele.\n\n**Se og ændre lange beskrivelser:** Et **dobbeltklik** på et felt i kolonnen Beskrivelse åbner teksten i et vindue for sig - flere linjer og med automatisk linjeombrydning. Beskrivelser fra producenternes vejledninger er tit længere, end kolonnen kan vise; her står de fuldt ud. **Gem** overtager ændringen, **Afbryd** kasserer den. Til en kort tekst gælder den hidtidige vej fortsat: bare begynd at skrive eller tryk Enter.\n\nVed redigering af en **eksisterende skabelon** (Indstillinger → Dekoderskabeloner → **Rediger i eget vindue**) mangler denne knap. Skabelonen er allerede åben der; at indlæse endnu en oven i ville uden varsel erstatte den, du arbejder på.\n\n**Kolonnen Nr. er linjen:** linje 1 er CV 1, linje 8 er CV 8. Nummeret kan derfor ikke tastes - det ligger fast. Ved indlæsning af en skabelon og ved indsættelse fra vejledningen havner hver post i linjen for sit CV-nummer; hullerne imellem bliver stående tomme. Hvilke linjer der kommer med i skabelonen, afgøres alene af fluebenet i **Aktiv**, og det sætter sig selv, så snart der står noget i Værdi, Type eller Betegnelse.
help.captureText.sv=Med **Registrera dekoder** skapar du en ny dekodermall utan att någon iTrain-fil behöver vara öppen. Ett eget, storleksändringsbart fönster öppnas med en CV-tabell - med samma kolumner som för ett lok (Aktiv, Nr, Värde, Typ, Namn).\n\nTabellen står redo med 1000 tomma rader och lägger själv till fler när du närmar dig slutet - siffran är en utgångspunkt, inte en gräns. Vad som sparas avgörs enbart av krysset i kolumnen **Aktiv**: det sätts av sig självt när du fyller i en rad och försvinner igen när du tömmer den. Resten som inte används kasseras vid sparandet.\n\n**Ange värden:** Klicka på en cell och börja bara skriva - inmatningen startar direkt. **Tabb** och **piltangenterna** tar över värdet och hoppar till grannecellen, Retur går en rad ned. På så vis skrivs en hel CV-lista in i ett svep. **X** tömmer den markerade raden, **+** lägger till hundra rader.\n\n**Hämta värden ur manualen:** Tillverkarens manual öppnar du i ditt vanliga PDF-program. Markera och kopiera de rader du vill ha där, och infoga dem här: **Ctrl+V** sätter texten i den markerade cellen, **Klistra in härifrån** fördelar en större markering över flera rader med start i den markerade. Börjar en rad med en siffra tolkas den som CV-nummer, ett kort tal därefter som värde, och resten blir namnet - kontrollera det, det är en enkel regel som inte passar varje manual.\n\n**Läs in mall:** Knappen med samma namn hämtar CV-listan från en befintlig dekodermall till tabellen - med typ och namn. Finns några CV-nummer redan där frågar programmet: **Behåll värden** låter dina egna värden stå kvar och kompletterar bara med typ och namn från mallen, **Ersätt värden** hämtar även värdena därifrån. Det är det snabba sättet att lyfta ett fordon med några få skötta CV:er till tillverkarens fullständiga lista utan att förlora sin egen adress.\n\n**Spara** lägger mallen som CSV-fil i mappen för dekodermallar - därefter finns den att välja under **Importera dekoder**. **Spara som...** frågar efter ett nytt namn och skapar dessutom en andra mall. **Spara & skicka** sparar den likaså och öppnar ditt e-postprogram med färdigt ämne och text, så att du kan skicka in mallen. Filen måste då bifogas för hand: dess sökväg finns redan i urklipp och mappen öppnas. Automatisk bifogning är tekniskt inte möjlig via e-postmetoden "mailto"; din signatur lägger ditt e-postprogram till som vanligt.\n\n**Samma fönster för befintliga fordon:** Med en fil öppen visar datautforskaren en **configuration**-nod under **Lok** och **Vagnar**. Väljer du den dyker knappen **Redigera i eget fönster** upp under CV-tabellen - den öppnar exakt samma stora tabell med det fordonets värden. **Använd** skriver tillbaka dem i dokumentet (kan tas tillbaka med **Ångra**), **Avbryt** förkastar allt.\n\n**Se och ändra långa beskrivningar:** Ett **dubbelklick** på ett fält i kolumnen Beskrivning öppnar texten i ett eget fönster - flera rader och med automatisk radbrytning. Beskrivningar ur tillverkarnas anvisningar är ofta längre än vad kolumnen kan visa; här står de i sin helhet. **Spara** tar över ändringen, **Avbryt** förkastar den. För en kort text gäller den tidigare vägen fortfarande: börja bara skriva eller tryck Enter.\n\nVid redigering av en **befintlig mall** (Inställningar → Dekodermallar → **Redigera i eget fönster**) saknas den här knappen. Mallen är redan öppen där; att läsa in en andra ovanpå skulle utan förvarning ersätta den du arbetar med.\n\n**Kolumnen Nr är raden:** rad 1 är CV 1, rad 8 är CV 8. Numret går därför inte att skriva in - det ligger fast. Vid inläsning av en mall och vid inklistring ur anvisningen hamnar varje post på raden för sitt CV-nummer; luckorna däremellan förblir tomma. Vilka rader som följer med in i mallen avgörs enbart av bocken i **Aktiv**, och den sätter sig själv så snart det står något i Värde, Typ eller Beteckning.

