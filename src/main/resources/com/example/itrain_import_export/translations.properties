help.captureText.de=Mit **Decoder erfassen** (im Ribbon des Decoder-Fensters) legst du eine neue Decoder-Vorlage an, ohne dass eine iTrain-Datei geöffnet sein muss. Es öffnet sich ein eigenes, in der Größe veränderbares Fenster mit einer CV-Tabelle - mit denselben Spalten wie bei einer Lokomotive (Aktiv, Nr., Wert, Typ, Bezeichnung).\n\nDie Tabelle steht mit 1000 leeren Zeilen bereit und hängt selbsttätig weitere an, sobald du dich dem Ende näherst - die Zahl ist eine Vorgabe, keine Obergrenze. Was davon gespeichert wird, entscheidet allein der Haken in der Spalte **Aktiv**: Er setzt sich beim Ausfüllen einer Zeile von selbst und verschwindet wieder, sobald du sie leerst. Der ungenutzte Rest wird beim Speichern verworfen.\n\n**Werte eintragen:** Eine Zelle anklicken und einfach lostippen - die Eingabe beginnt sofort. **Tabulator** und die **Pfeiltasten** übernehmen den Wert und springen zur Nachbarzelle, die Eingabetaste geht eine Zeile tiefer. So lässt sich eine ganze CV-Liste in einem Zug eintippen. **X** leert die markierte Zeile wieder, **+** hängt hundert Zeilen an.\n\n**Werte aus der Anleitung übernehmen:** Die Anleitung des Herstellers öffnest du in deinem gewohnten PDF-Programm. Dort die gewünschten Zeilen markieren und kopieren, hier einfügen: **Strg+V** setzt den Text in die ausgewählte Zelle, **Ab hier einfügen** verteilt eine größere Markierung ab der ausgewählten Zeile auf mehrere Zeilen. Beginnt eine Zeile mit einer Zahl, gilt diese als CV-Nummer, eine darauf folgende kurze Zahl als Wert, der Rest wird zur Bezeichnung - bitte prüfen, das ist eine einfache Regel und trifft nicht jede Anleitung.\n\n**Vorlage einlesen:** Der gleichnamige Knopf übernimmt die CV-Liste einer vorhandenen Decoder-Vorlage in die Tabelle - mit Typ und Bezeichnung. Stehen einzelne CV-Nummern schon darin, fragt das Programm nach: **Werte behalten** lässt deine eigenen Werte stehen und ergänzt nur Typ und Bezeichnung aus der Vorlage, **Werte überschreiben** holt auch die Werte von dort. Das ist der schnelle Weg, ein Fahrzeug mit wenigen gepflegten CVs auf die vollständige Liste des Herstellers zu bringen, ohne die eigene Adresse zu verlieren.\n\n**Speichern** legt die Vorlage als CSV-Datei im Ordner für Decoder-Vorlagen ab - danach steht sie unter **Decoder importieren** zur Auswahl.\n**Speichern als...** fragt nach einer neuen Bezeichnung und legt zusätzlich eine zweite Vorlage an. **Speichern & Senden** speichert ebenso und öffnet dein E-Mail-Programm mit fertigem Betreff und Text, damit du die Vorlage einsenden kannst. Zum Versand wird die Vorlage in eine .zip-Datei gepackt (im Export-Ordner), denn eine .csv nehmen viele Mailprogramme nicht an.\nDie Datei muss dabei von Hand angehängt werden: ihr Pfad liegt bereits in der Zwischenablage und der Ordner wird geöffnet.\nEin automatisches Anhängen ist über das E-Mail-Verfahren "mailto" technisch nicht möglich; deine Signatur ergänzt dein E-Mail-Programm wie gewohnt selbst.\nWenn die Dateien bei mir eintreffen, sammle ich die Decoder-Vorlagen und nehme sie in die nächste Programmversion auf; bis dahin stelle ich sie einzeln zum Herunterladen bereit.\nSo sollten, über die Zeit hinweg, viele einzelne Decoder zu den universellen Vorlagen dazukommen.\n\n**Dasselbe Fenster für vorhandene Fahrzeuge:** Ist eine Datei geöffnet, findest du bei **Lokomotiven** und **Wagen** im Daten-Explorer den Knoten **configuration**.\nDer **configuration** wird blau hervorgehoben.\nWählst du ihn aus, erscheint über der CV-Tabelle der Knopf **Decoder-CVs bearbeiten** - er öffnet genau dieselbe große Tabelle mit den Werten dieses Fahrzeugs.\n**Übernehmen** schreibt sie zurück ins Dokument (mit **Rückgängig** zurücknehmbar), **Abbrechen** verwirft alles.\n\n**Lange Beschreibungen ansehen und ändern:** Ein **Doppelklick** auf ein Feld der Spalte Beschreibung öffnet den Text in einem eigenen Fenster - mehrzeilig und mit automatischem Zeilenumbruch.\nBeschreibungen aus Hersteller-Anleitungen sind oft länger, als die Spalte zeigen kann; hier stehen sie vollständig da.\n**Speichern** übernimmt die Änderung, **Abbruch** verwirft sie. Zum Eintippen eines kurzen Textes bleibt der bisherige Weg: einfach lostippen oder die Eingabetaste drücken.\n\nBeim Bearbeiten einer **vorhandenen Vorlage** (Decoder-Fenster → Menü Decoder → Decoder-Vorlagen → **Decoder-CVs bearbeiten**) fehlt dieser Knopf. Dort ist die Vorlage bereits geöffnet; eine zweite darüberzuladen würde die gerade bearbeitete kommentarlos ersetzen.\n\n**Die Spalte Nr. ist die Zeile:** Zeile 1 ist CV 1, Zeile 8 ist CV 8. Die Nummer lässt sich deshalb nicht eintippen - sie steht fest.\nBeim Einlesen einer Vorlage und beim Einfügen aus der Anleitung landet jeder Eintrag in der Zeile seiner CV-Nummer; Lücken dazwischen bleiben leer.\nWelche Zeilen in die Vorlage wandern, entscheidet allein der Haken in **Aktiv**, und der setzt sich von selbst, sobald in Wert, Typ oder Bezeichnung etwas steht.\n\nBei der **Eingabe** in die CV Tabellen bitte alle Felder mit der TAB Taste ansteuern. Nur diese führt weiter.\nBei einem Klick kann der vorherigen Inhalt verloren gehen.
help.captureText.en=With **Capture decoder** (in the Decoder window's ribbon) you create a new decoder template without an iTrain file having to be open. A dedicated, resizable window opens with a CV table - with the same columns as for a locomotive (Active, No., Value, Type, Label).\n\nThe table comes ready with 1000 empty rows and automatically appends more as you approach the end - the number is a default, not an upper limit. What gets saved from it is decided solely by the check mark in the **Active** column: it sets itself when you fill in a row and disappears again as soon as you clear it. The unused rest is discarded on saving.\n\n**Entering values:** Click a cell and just start typing - input begins immediately. **Tab** and the **arrow keys** apply the value and jump to the neighboring cell; Enter moves one row down. This way, a whole CV list can be typed in one go. **X** clears the selected row again, **+** appends a hundred rows.\n\n**Taking over values from the manual:** Open the manufacturer's manual in your usual PDF program. Select and copy the desired lines there, then paste here: **Ctrl+V** puts the text into the selected cell, **Paste from here** distributes a larger selection across several rows starting from the selected row. If a line starts with a number, it is treated as the CV number, a short number following it as the value, the rest becomes the label - please check, this is a simple rule and doesn't fit every manual.\n\n**Read in template:** The button of the same name applies the CV list of an existing decoder template to the table - with type and label. If individual CV numbers are already present, the program asks: **Keep values** leaves your own values in place and only adds type and label from the template, **Overwrite values** also takes the values from there. This is the quick way to bring a vehicle with a few maintained CVs up to the manufacturer's complete list, without losing your own address.\n\n**Save** stores the template as a CSV file in the decoder templates folder - it is then available for selection under **Import decoder**.\n**Save as...** asks for a new label and additionally creates a second template. **Save & Send** saves the same way and opens your email program with a ready-made subject and text, so you can send in the template. For sending, the template is packed into a .zip file (in the export folder), because many mail programs won't accept a .csv.\nThe file must be attached by hand: its path is already on the clipboard and the folder is opened.\nAutomatic attaching is technically not possible via the "mailto" email method; your signature is added by your email program as usual.\nWhen the files reach me, I collect the decoder templates and include them in the next program version; until then I make them available individually for download.\nThis way, over time, many individual decoders should be added to the universal templates.\n\n**The same window for existing vehicles:** If a file is open, you'll find the **configuration** node for **locomotives** and **wagons** in the data explorer.\n**configuration** is highlighted in blue.\nIf you select it, the **Edit decoder CVs** button appears above the CV table - it opens exactly the same large table with this vehicle's values.\n**Apply** writes them back into the document (can be undone with **Undo**), **Cancel** discards everything.\n\n**Viewing and changing long descriptions:** A **double-click** on a field in the Description column opens the text in its own window - multi-line and with automatic word wrap.\nDescriptions from manufacturer manuals are often longer than the column can show; here they appear in full.\n**Save** applies the change, **Cancel** discards it. For typing a short text the previous way remains available: just start typing or press Enter.\n\nWhen editing an **existing template** (Decoder window → Decoder menu → Decoder templates → **Edit decoder CVs**), this button is missing. There the template is already open; loading a second one on top would silently replace the one currently being edited.\n\n**The No. column is the row:** row 1 is CV 1, row 8 is CV 8. The number can therefore not be typed in - it is fixed.\nWhen reading in a template and when pasting from the manual, each entry lands on the row of its CV number; gaps in between stay empty.\nWhich rows end up in the template is decided solely by the check mark in **Active**, and it sets itself as soon as something is entered in Value, Type or Label.\n\nWhen **entering data** into the CV tables, please move between all fields using the TAB key. Only that key moves you forward correctly.\nA click can lose the previous content.
help.captureText.nl=Met **Decoder vastleggen** (in het lint van het Decoder-venster) leg je een nieuw decodersjabloon aan, zonder dat er een iTrain-bestand geopend hoeft te zijn. Er opent zich een eigen, in grootte aanpasbaar venster met een CV-tabel - met dezelfde kolommen als bij een locomotief (Actief, Nr., Waarde, Type, Benaming).\n\nDe tabel staat klaar met 1000 lege rijen en hangt er automatisch meer aan zodra je het einde nadert - het aantal is een voorinstelling, geen bovengrens. Wat daarvan wordt opgeslagen, bepaalt uitsluitend het vinkje in de kolom **Actief**: het gaat vanzelf aan bij het invullen van een rij en verdwijnt weer zodra je die leegmaakt. De ongebruikte rest wordt bij het opslaan verworpen.\n\n**Waarden invoeren:** Klik op een cel en typ meteen - de invoer begint direct. **Tab** en de **pijltoetsen** nemen de waarde over en springen naar de aangrenzende cel, de Enter-toets gaat een rij lager. Zo laat zich een hele CV-lijst in één keer intypen. **X** maakt de gemarkeerde rij weer leeg, **+** hangt honderd rijen aan.\n\n**Waarden uit de handleiding overnemen:** De handleiding van de fabrikant open je in je gebruikelijke pdf-programma. Markeer en kopieer daar de gewenste regels, plak ze hier: **Ctrl+V** zet de tekst in de geselecteerde cel, **Vanaf hier invoegen** verdeelt een grotere selectie vanaf de geselecteerde rij over meerdere rijen. Begint een regel met een getal, dan geldt dit als CV-nummer, een daaropvolgend kort getal als waarde, de rest wordt de benaming - controleer dit, het is een eenvoudige regel en past niet bij elke handleiding.\n\n**Sjabloon inlezen:** De gelijknamige knop neemt de CV-lijst van een bestaand decodersjabloon over in de tabel - met type en benaming. Staan er al afzonderlijke CV-nummers in, dan vraagt het programma: **Waarden behouden** laat je eigen waarden staan en vult alleen type en benaming uit het sjabloon aan, **Waarden overschrijven** haalt ook de waarden daarvandaan. Dat is de snelle manier om een voertuig met een paar bijgehouden CV's op de volledige lijst van de fabrikant te brengen, zonder je eigen adres te verliezen.\n\n**Opslaan** legt het sjabloon als CSV-bestand vast in de map voor decodersjablonen - daarna staat het onder **Decoder importeren** ter beschikking.\n**Opslaan als...** vraagt om een nieuwe benaming en legt daarnaast een tweede sjabloon aan. **Opslaan & Versturen** slaat eveneens op en opent je e-mailprogramma met een kant-en-klaar onderwerp en tekst, zodat je het sjabloon kunt insturen. Voor de verzending wordt het sjabloon in een .zip-bestand verpakt (in de exportmap), want veel mailprogramma's accepteren geen .csv.\nHet bestand moet daarbij met de hand worden bijgevoegd: het pad staat al in het klembord en de map wordt geopend.\nAutomatisch bijvoegen is via de e-mailmethode "mailto" technisch niet mogelijk; je handtekening vult je e-mailprogramma zoals gebruikelijk zelf aan.\nAls de bestanden bij mij binnenkomen, verzamel ik de decodersjablonen en neem ze op in de volgende programmaversie; tot die tijd stel ik ze afzonderlijk beschikbaar om te downloaden.\nZo zouden er, na verloop van tijd, veel individuele decoders bij de universele sjablonen moeten komen.\n\n**Hetzelfde venster voor bestaande voertuigen:** Is er een bestand geopend, dan vind je bij **Locomotieven** en **Wagons** in de data-explorer het knooppunt **configuration**.\nDe **configuration** wordt blauw gemarkeerd.\nSelecteer je die, dan verschijnt boven de CV-tabel de knop **Decoder-CV's bewerken** - deze opent precies dezelfde grote tabel met de waarden van dit voertuig.\n**Overnemen** schrijft ze terug in het document (met **Ongedaan maken** terug te draaien), **Annuleren** verwerpt alles.\n\n**Lange beschrijvingen bekijken en wijzigen:** Een **dubbelklik** op een veld in de kolom Beschrijving opent de tekst in een eigen venster - meerregelig en met automatische tekstterugloop.\nBeschrijvingen uit fabrieks­handleidingen zijn vaak langer dan de kolom kan tonen; hier staan ze volledig.\n**Opslaan** neemt de wijziging over, **Annuleren** verwerpt deze. Voor het intypen van een korte tekst blijft de bestaande manier bestaan: gewoon lostikken of de Enter-toets indrukken.\n\nBij het bewerken van een **bestaand sjabloon** (Decoder-venster → menu Decoder → Decodersjablonen → **Decoder-CV's bewerken**) ontbreekt deze knop. Daar is het sjabloon al geopend; er een tweede overheen laden zou het net bewerkte zonder waarschuwing vervangen.\n\n**De kolom Nr. is de rij:** rij 1 is CV 1, rij 8 is CV 8. Het nummer kan daarom niet worden ingetypt - het ligt vast.\nBij het inlezen van een sjabloon en bij het invoegen vanuit de handleiding komt elk item terecht op de rij van zijn CV-nummer; tussenliggende gaten blijven leeg.\nWelke rijen naar het sjabloon gaan, bepaalt uitsluitend het vinkje bij **Actief**, en dat gaat vanzelf aan zodra er in Waarde, Type of Benaming iets staat.\n\nStuur bij de **invoer** in de CV-tabellen alle velden aan met de TAB-toets. Alleen die brengt je verder.\nBij een klik kan de vorige inhoud verloren gaan.
help.captureText.fr=Avec **Saisir le décodeur** (dans le ruban de la fenêtre Décodeur), tu crées un nouveau modèle de décodeur sans qu'un fichier iTrain doive être ouvert. Une fenêtre à part, redimensionnable, s'ouvre avec un tableau de CV - avec les mêmes colonnes que pour une locomotive (Actif, N°, Valeur, Type, Désignation).\n\nLe tableau est disponible avec 1000 lignes vides et en ajoute automatiquement d'autres à mesure que tu approches de la fin - ce nombre est une valeur par défaut, pas une limite. Ce qui est enregistré est déterminé uniquement par la coche de la colonne **Actif** : elle se met d'elle-même en remplissant une ligne et disparaît de nouveau dès que tu la vides. Le reste inutilisé est abandonné à l'enregistrement.\n\n**Saisir des valeurs :** Clique sur une cellule et tape directement - la saisie commence aussitôt. **Tabulation** et les **flèches** valident la valeur et passent à la cellule voisine, la touche Entrée descend d'une ligne. On peut ainsi saisir toute une liste de CV d'un seul trait. **X** vide de nouveau la ligne sélectionnée, **+** ajoute cent lignes.\n\n**Reprendre des valeurs depuis la notice :** Ouvre la notice du fabricant dans ton programme PDF habituel. Sélectionne et copie les lignes voulues, puis colle-les ici : **Ctrl+V** place le texte dans la cellule sélectionnée, **Coller à partir d'ici** répartit une sélection plus grande sur plusieurs lignes à partir de la ligne sélectionnée. Si une ligne commence par un nombre, celui-ci est considéré comme le numéro de CV, un petit nombre qui suit comme la valeur, le reste devient la désignation - à vérifier, c'est une règle simple qui ne correspond pas à toutes les notices.\n\n**Lire un modèle :** Le bouton du même nom reprend la liste de CV d'un modèle de décodeur existant dans le tableau - avec type et désignation. Si certains numéros de CV y figurent déjà, le programme demande : **Conserver les valeurs** laisse tes propres valeurs en place et ne complète que le type et la désignation à partir du modèle, **Écraser les valeurs** en reprend aussi les valeurs. C'est le moyen rapide d'amener un véhicule ne comportant que quelques CV entretenus à la liste complète du fabricant, sans perdre ta propre adresse.\n\n**Enregistrer** dépose le modèle sous forme de fichier CSV dans le dossier des modèles de décodeur - il est ensuite disponible dans la sélection sous **Importer le décodeur**.\n**Enregistrer sous...** demande une nouvelle désignation et crée en plus un second modèle. **Enregistrer et envoyer** enregistre de la même façon et ouvre ton logiciel de messagerie avec un objet et un texte déjà prêts, afin que tu puisses envoyer le modèle. Pour l'envoi, le modèle est mis dans un fichier .zip (dans le dossier d'export), car beaucoup de logiciels de messagerie n'acceptent pas les .csv.\nLe fichier doit être joint à la main : son chemin se trouve déjà dans le presse-papiers et le dossier s'ouvre.\nUne pièce jointe automatique n'est techniquement pas possible via le procédé de messagerie « mailto » ; ta signature est ajoutée comme d'habitude par ton logiciel de messagerie.\nQuand les fichiers m'arrivent, je rassemble les modèles de décodeur et les intègre dans la version suivante du programme ; en attendant, je les mets à disposition individuellement au téléchargement.\nAinsi, au fil du temps, de nombreux décodeurs individuels devraient venir enrichir les modèles universels.\n\n**La même fenêtre pour des véhicules existants :** Si un fichier est ouvert, tu trouves pour les **locomotives** et les **wagons** dans l'explorateur de données le nœud **configuration**.\nLe nœud **configuration** est mis en évidence en bleu.\nSi tu le sélectionnes, le bouton **Modifier les CV du décodeur** apparaît au-dessus du tableau de CV - il ouvre exactement le même grand tableau avec les valeurs de ce véhicule.\n**Appliquer** les réécrit dans le document (annulable avec **Annuler**), **Annuler** rejette le tout.\n\n**Consulter et modifier de longues descriptions :** Un **double clic** sur un champ de la colonne Description ouvre le texte dans une fenêtre à part - sur plusieurs lignes et avec retour à la ligne automatique.\nLes descriptions issues des notices des fabricants sont souvent plus longues que ce que la colonne peut afficher ; ici elles apparaissent en entier.\n**Enregistrer** applique la modification, **Annuler** la rejette. Pour saisir un texte court, l'ancienne méthode reste disponible : taper directement ou appuyer sur Entrée.\n\nLors de la modification d'un **modèle existant** (fenêtre Décodeur → menu Décodeur → Modèles de décodeur → **Modifier les CV du décodeur**), ce bouton est absent. Là, le modèle est déjà ouvert ; en charger un second par-dessus remplacerait sans avertissement celui en cours de modification.\n\n**La colonne N° est la ligne :** la ligne 1 est CV 1, la ligne 8 est CV 8. Le numéro ne peut donc pas être saisi - il est fixe.\nLors de la lecture d'un modèle et du collage depuis la notice, chaque entrée atterrit sur la ligne de son numéro de CV ; les écarts entre elles restent vides.\nQuelles lignes passent dans le modèle est décidé uniquement par la coche dans **Actif**, qui se met d'elle-même dès qu'une valeur, un type ou une désignation est renseigné.\n\nLors de la **saisie** dans les tableaux de CV, merci de parcourir tous les champs avec la touche TAB. Seule celle-ci fait avancer correctement.\nUn clic peut faire perdre le contenu précédent.
help.captureText.es=Con **Capturar decodificador** (en la cinta de la ventana Decodificador) creas una nueva plantilla de decodificador sin necesidad de tener abierto un archivo iTrain. Se abre una ventana propia, de tamaño ajustable, con una tabla de CV - con las mismas columnas que en una locomotora (Activo, N.º, Valor, Tipo, Denominación).\n\nLa tabla está disponible con 1000 filas vacías y añade más automáticamente a medida que te acercas al final - el número es un valor predeterminado, no un límite máximo. Lo que se guarda de ella lo decide únicamente la marca en la columna **Activo**: se activa sola al rellenar una fila y desaparece de nuevo en cuanto la vacías. El resto no utilizado se descarta al guardar.\n\n**Introducir valores:** Haz clic en una celda y empieza a escribir directamente - la entrada comienza de inmediato. **Tabulador** y las **teclas de flecha** aplican el valor y saltan a la celda vecina, la tecla Intro baja una fila. Así se puede escribir toda una lista de CV de un tirón. **X** vuelve a vaciar la fila marcada, **+** añade cien filas.\n\n**Tomar valores del manual:** Abre el manual del fabricante en tu programa PDF habitual. Marca y copia allí las líneas deseadas, pégalas aquí: **Ctrl+V** coloca el texto en la celda seleccionada, **Pegar desde aquí** reparte una selección más grande en varias filas a partir de la fila seleccionada. Si una línea empieza con un número, se considera el número de CV, un número corto que le siga como valor, y el resto pasa a ser la denominación - compruébalo, es una regla simple y no encaja con todos los manuales.\n\n**Leer plantilla:** El botón del mismo nombre traslada la lista de CV de una plantilla de decodificador existente a la tabla - con tipo y denominación. Si ya hay números de CV individuales, el programa pregunta: **Conservar valores** deja tus propios valores y solo completa tipo y denominación desde la plantilla, **Sobrescribir valores** también toma los valores de allí. Es la forma rápida de llevar un vehículo con pocos CV mantenidos a la lista completa del fabricante, sin perder tu propia dirección.\n\n**Guardar** deposita la plantilla como archivo CSV en la carpeta de plantillas de decodificador - a partir de entonces está disponible en **Importar decodificador**.\n**Guardar como...** pide una nueva denominación y crea además una segunda plantilla. **Guardar y enviar** guarda igualmente y abre tu programa de correo con un asunto y texto ya preparados, para que puedas enviar la plantilla. Para el envío, la plantilla se empaqueta en un archivo .zip (en la carpeta de exportación), porque muchos programas de correo no aceptan .csv.\nEl archivo debe adjuntarse a mano: su ruta ya está en el portapapeles y se abre la carpeta.\nAdjuntarlo automáticamente no es técnicamente posible mediante el procedimiento de correo "mailto"; tu firma la añade tu programa de correo como de costumbre.\nCuando los archivos me llegan, recopilo las plantillas de decodificador y las incluyo en la siguiente versión del programa; hasta entonces las pongo a disposición individualmente para descargar.\nAsí, con el tiempo, deberían añadirse muchos decodificadores individuales a las plantillas universales.\n\n**La misma ventana para vehículos existentes:** Si hay un archivo abierto, encuentras en **Locomotoras** y **Vagones**, en el explorador de datos, el nodo **configuration**.\nEl nodo **configuration** se resalta en azul.\nSi lo seleccionas, aparece encima de la tabla de CV el botón **Editar CV del decodificador** - abre exactamente la misma tabla grande con los valores de ese vehículo.\n**Aplicar** los escribe de nuevo en el documento (se puede deshacer con **Deshacer**), **Cancelar** descarta todo.\n\n**Ver y cambiar descripciones largas:** Un **doble clic** en un campo de la columna Descripción abre el texto en una ventana propia - de varias líneas y con ajuste de línea automático.\nLas descripciones de los manuales de los fabricantes suelen ser más largas de lo que la columna puede mostrar; aquí aparecen completas.\n**Guardar** aplica el cambio, **Cancelar** lo descarta. Para escribir un texto corto sigue disponible el método anterior: escribir directamente o pulsar Intro.\n\nAl editar una **plantilla existente** (ventana Decodificador → menú Decodificador → Plantillas de decodificador → **Editar CV del decodificador**), este botón no aparece. Allí la plantilla ya está abierta; cargar una segunda encima sustituiría sin previo aviso la que se está editando.\n\n**La columna N.º es la fila:** la fila 1 es CV 1, la fila 8 es CV 8. Por eso el número no se puede escribir - es fijo.\nAl leer una plantilla y al pegar desde el manual, cada entrada aterriza en la fila de su número de CV; los huecos intermedios quedan vacíos.\nQué filas pasan a la plantilla lo decide únicamente la marca en **Activo**, que se activa sola en cuanto hay algo en Valor, Tipo o Denominación.\n\nAl **introducir datos** en las tablas de CV, por favor desplázate por todos los campos con la tecla TAB. Solo esta avanza correctamente.\nCon un clic se puede perder el contenido anterior.
help.captureText.it=Con **Rileva decoder** (nella barra multifunzione della finestra Decoder) crei un nuovo modello di decoder senza che debba essere aperto un file iTrain. Si apre una finestra propria, ridimensionabile, con una tabella CV - con le stesse colonne di una locomotiva (Attivo, N., Valore, Tipo, Denominazione).\n\nLa tabella è pronta con 1000 righe vuote e ne aggiunge altre automaticamente man mano che ti avvicini alla fine - il numero è un valore predefinito, non un limite massimo. Ciò che viene salvato è deciso esclusivamente dal segno di spunta nella colonna **Attivo**: si imposta da solo compilando una riga e scompare di nuovo non appena la svuoti. Il resto non utilizzato viene scartato al salvataggio.\n\n**Inserire valori:** Clicca su una cella e digita direttamente - l'inserimento inizia subito. **Tab** e i **tasti freccia** confermano il valore e saltano alla cella vicina, il tasto Invio scende di una riga. Così si può digitare un'intera lista di CV in un'unica passata. **X** svuota di nuovo la riga selezionata, **+** aggiunge cento righe.\n\n**Recuperare valori dal manuale:** Apri il manuale del produttore nel tuo programma PDF abituale. Seleziona e copia lì le righe desiderate, incollale qui: **Ctrl+V** inserisce il testo nella cella selezionata, **Incolla da qui** distribuisce una selezione più ampia su più righe a partire da quella selezionata. Se una riga inizia con un numero, questo viene considerato il numero di CV, un breve numero successivo come valore, il resto diventa la denominazione - da verificare, è una regola semplice che non si adatta a ogni manuale.\n\n**Leggi modello:** Il pulsante omonimo trasferisce nella tabella l'elenco CV di un modello di decoder esistente - con tipo e denominazione. Se sono già presenti singoli numeri di CV, il programma chiede: **Mantieni valori** lascia i tuoi valori così come sono e completa solo tipo e denominazione dal modello, **Sovrascrivi valori** riprende anche i valori da lì. È il modo rapido per portare un veicolo con pochi CV curati all'elenco completo del produttore, senza perdere il proprio indirizzo.\n\n**Salva** deposita il modello come file CSV nella cartella dei modelli di decoder - da quel momento è disponibile in **Importa decoder**.\n**Salva come...** chiede una nuova denominazione e crea in più un secondo modello. **Salva e invia** salva allo stesso modo e apre il tuo programma di posta con oggetto e testo già pronti, così puoi inviare il modello. Per l'invio, il modello viene compresso in un file .zip (nella cartella di esportazione), perché molti programmi di posta non accettano i .csv.\nIl file deve essere allegato manualmente: il suo percorso è già negli appunti e la cartella viene aperta.\nL'allegato automatico non è tecnicamente possibile tramite la procedura di posta "mailto"; la tua firma viene aggiunta come al solito dal tuo programma di posta.\nQuando i file mi arrivano, raccolgo i modelli di decoder e li includo nella versione successiva del programma; fino ad allora li metto a disposizione singolarmente per il download.\nCosì, nel tempo, molti decoder singoli dovrebbero aggiungersi ai modelli universali.\n\n**La stessa finestra per veicoli esistenti:** Se un file è aperto, trovi per **Locomotive** e **Carri** nell'esploratore dati il nodo **configuration**.\nIl nodo **configuration** è evidenziato in blu.\nSelezionandolo, sopra la tabella CV compare il pulsante **Modifica CV del decoder** - apre esattamente la stessa grande tabella con i valori di questo veicolo.\n**Applica** li riscrive nel documento (annullabile con **Annulla**), **Annulla** scarta tutto.\n\n**Visualizzare e modificare descrizioni lunghe:** Un **doppio clic** su un campo della colonna Descrizione apre il testo in una finestra propria - su più righe e con a capo automatico.\nLe descrizioni dai manuali dei produttori sono spesso più lunghe di quanto la colonna possa mostrare; qui compaiono per intero.\n**Salva** applica la modifica, **Annulla** la scarta. Per digitare un testo breve resta disponibile il modo consueto: digitare direttamente oppure premere Invio.\n\nModificando un **modello esistente** (finestra Decoder → menu Decoder → Modelli di decoder → **Modifica CV del decoder**), questo pulsante manca. Lì il modello è già aperto; caricarne uno secondo sopra sostituirebbe senza avviso quello in fase di modifica.\n\n**La colonna N. è la riga:** la riga 1 è CV 1, la riga 8 è CV 8. Il numero non può quindi essere digitato - è fisso.\nDurante la lettura di un modello e durante l'incolla dal manuale, ogni voce finisce nella riga del proprio numero di CV; gli spazi vuoti tra di essi restano vuoti.\nQuali righe finiscono nel modello è deciso esclusivamente dal segno di spunta in **Attivo**, che si imposta da solo non appena in Valore, Tipo o Denominazione compare qualcosa.\n\nDurante l'**inserimento** nelle tabelle CV, spostarsi tra tutti i campi con il tasto TAB. Solo questo procede correttamente.\nCon un clic il contenuto precedente può andare perso.
help.captureText.pt=Com **Registar descodificador** (na faixa da janela Descodificador) crias um novo modelo de descodificador sem ser necessário ter um ficheiro iTrain aberto. Abre-se uma janela própria, redimensionável, com uma tabela CV - com as mesmas colunas de uma locomotiva (Ativo, N.º, Valor, Tipo, Designação).\n\nA tabela está disponível com 1000 linhas vazias e acrescenta automaticamente mais à medida que te aproximas do fim - o número é uma predefinição, não um limite máximo. O que é guardado é decidido exclusivamente pela marca na coluna **Ativo**: acende-se sozinha ao preencher uma linha e desaparece de novo assim que a esvazias. O resto não utilizado é descartado ao guardar.\n\n**Inserir valores:** Clica numa célula e começa logo a escrever - a introdução começa de imediato. **Tab** e as **teclas de seta** aplicam o valor e saltam para a célula vizinha, a tecla Enter desce uma linha. Assim é possível escrever toda uma lista de CV de uma só vez. **X** volta a esvaziar a linha marcada, **+** acrescenta cem linhas.\n\n**Aproveitar valores do manual:** Abre o manual do fabricante no teu programa PDF habitual. Marca e copia aí as linhas pretendidas, cola-as aqui: **Ctrl+V** coloca o texto na célula selecionada, **Colar a partir daqui** distribui uma seleção maior por várias linhas a partir da linha selecionada. Se uma linha começar por um número, este é considerado o número de CV, um número curto seguinte como valor, o resto passa a ser a designação - por favor verifica, é uma regra simples e não se aplica a todos os manuais.\n\n**Ler modelo:** O botão do mesmo nome transfere para a tabela a lista de CV de um modelo de descodificador existente - com tipo e designação. Se já existirem números de CV individuais, o programa pergunta: **Manter valores** deixa os teus próprios valores como estão e completa apenas tipo e designação a partir do modelo, **Substituir valores** também traz os valores de lá. É a forma rápida de levar um veículo com poucos CV cuidados até à lista completa do fabricante, sem perder o teu próprio endereço.\n\n**Guardar** deposita o modelo como ficheiro CSV na pasta de modelos de descodificador - depois fica disponível para seleção em **Importar descodificador**.\n**Guardar como...** pede uma nova designação e cria adicionalmente um segundo modelo. **Guardar e enviar** guarda da mesma forma e abre o teu programa de correio com assunto e texto já prontos, para que possas enviar o modelo. Para o envio, o modelo é embalado num ficheiro .zip (na pasta de exportação), porque muitos programas de correio não aceitam .csv.\nO ficheiro tem de ser anexado à mão: o seu caminho já está na área de transferência e a pasta é aberta.\nUm anexo automático não é tecnicamente possível através do procedimento de correio "mailto"; a tua assinatura é acrescentada pelo teu programa de correio como de costume.\nQuando os ficheiros me chegam, reúno os modelos de descodificador e incluo-os na versão seguinte do programa; até lá, disponibilizo-os individualmente para descarregar.\nAssim, com o tempo, deverão juntar-se muitos descodificadores individuais aos modelos universais.\n\n**A mesma janela para veículos existentes:** Se houver um ficheiro aberto, encontras em **Locomotivas** e **Vagões**, no explorador de dados, o nó **configuration**.\nO nó **configuration** é destacado a azul.\nSe o selecionares, aparece acima da tabela CV o botão **Editar CVs do descodificador** - abre exatamente a mesma tabela grande com os valores deste veículo.\n**Aplicar** volta a escrevê-los no documento (reversível com **Anular**), **Cancelar** descarta tudo.\n\n**Ver e alterar descrições longas:** Um **duplo clique** num campo da coluna Descrição abre o texto numa janela própria - multilinha e com quebra automática de linha.\nAs descrições dos manuais dos fabricantes são muitas vezes mais longas do que a coluna pode mostrar; aqui aparecem na íntegra.\n**Guardar** aplica a alteração, **Cancelar** descarta-a. Para escrever um texto curto continua disponível o método anterior: escrever diretamente ou premir Enter.\n\nAo editar um **modelo existente** (janela Descodificador → menu Descodificador → Modelos de descodificador → **Editar CVs do descodificador**), este botão não aparece. Aí o modelo já está aberto; carregar um segundo por cima substituiria sem aviso o que está a ser editado.\n\n**A coluna N.º é a linha:** a linha 1 é CV 1, a linha 8 é CV 8. Por isso o número não pode ser escrito - é fixo.\nAo ler um modelo e ao colar a partir do manual, cada entrada vai parar à linha do seu número de CV; os espaços entre elas ficam vazios.\nQue linhas passam para o modelo é decidido exclusivamente pela marca em **Ativo**, que se ativa sozinha assim que há algo em Valor, Tipo ou Designação.\n\nAo **introduzir dados** nas tabelas de CV, percorre todos os campos com a tecla TAB. Só essa avança corretamente.\nCom um clique o conteúdo anterior pode perder-se.
help.captureText.pl=Za pomocą **Zarejestruj dekoder** (na wstążce okna Dekoder) tworzysz nowy szablon dekodera bez konieczności otwierania pliku iTrain. Otwiera się osobne, skalowalne okno z tabelą CV - z tymi samymi kolumnami co przy lokomotywie (Aktywny, Nr, Wartość, Typ, Oznaczenie).\n\nTabela jest gotowa z 1000 pustymi wierszami i automatycznie dodaje kolejne, gdy zbliżasz się do końca - liczba ta jest wartością domyślną, a nie górnym limitem. To, co zostanie zapisane, decyduje wyłącznie znacznik w kolumnie **Aktywny**: ustawia się sam przy wypełnianiu wiersza i znika ponownie, gdy go opróżnisz. Nieużyta reszta jest odrzucana przy zapisie.\n\n**Wprowadzanie wartości:** Kliknij komórkę i od razu zacznij pisać - wpisywanie zaczyna się natychmiast. **Tab** i **klawisze strzałek** zatwierdzają wartość i przechodzą do sąsiedniej komórki, klawisz Enter przechodzi wiersz niżej. W ten sposób można wpisać całą listę CV jednym ciągiem. **X** ponownie opróżnia zaznaczony wiersz, **+** dodaje sto wierszy.\n\n**Przejmowanie wartości z instrukcji:** Instrukcję producenta otwórz w swoim zwykłym programie PDF. Zaznacz i skopiuj tam potrzebne wiersze, wklej je tutaj: **Ctrl+V** wstawia tekst do zaznaczonej komórki, **Wklej od tego miejsca** rozdziela większe zaznaczenie na kilka wierszy, zaczynając od zaznaczonego wiersza. Jeśli wiersz zaczyna się liczbą, jest ona traktowana jako numer CV, następująca po niej krótka liczba jako wartość, a reszta staje się oznaczeniem - proszę sprawdzić, to prosta reguła i nie pasuje do każdej instrukcji.\n\n**Wczytaj szablon:** Przycisk o tej samej nazwie przenosi listę CV istniejącego szablonu dekodera do tabeli - wraz z typem i oznaczeniem. Jeśli pojedyncze numery CV już tam są, program pyta: **Zachowaj wartości** pozostawia twoje własne wartości i uzupełnia tylko typ i oznaczenie z szablonu, **Nadpisz wartości** pobiera stamtąd również wartości. To szybki sposób, by doprowadzić pojazd z kilkoma pielęgnowanymi CV do pełnej listy producenta, nie tracąc własnego adresu.\n\n**Zapisz** zapisuje szablon jako plik CSV w folderze szablonów dekoderów - potem jest dostępny do wyboru w **Importuj dekoder**.\n**Zapisz jako...** pyta o nowe oznaczenie i dodatkowo tworzy drugi szablon. **Zapisz i wyślij** zapisuje tak samo i otwiera twój program pocztowy z gotowym tematem i tekstem, abyś mógł przesłać szablon. Do wysyłki szablon jest pakowany do pliku .zip (w folderze eksportu), ponieważ wiele programów pocztowych nie akceptuje .csv.\nPlik trzeba dołączyć ręcznie: jego ścieżka jest już w schowku, a folder zostaje otwarty.\nAutomatyczne dołączanie nie jest technicznie możliwe przez metodę pocztową "mailto"; twój podpis dodaje program pocztowy jak zwykle sam.\nGdy pliki do mnie dotrą, zbieram szablony dekoderów i włączam je do kolejnej wersji programu; do tego czasu udostępniam je pojedynczo do pobrania.\nW ten sposób z czasem wiele pojedynczych dekoderów powinno dołączyć do uniwersalnych szablonów.\n\n**To samo okno dla istniejących pojazdów:** Jeśli plik jest otwarty, znajdziesz przy **Lokomotywach** i **Wagonach** w eksploratorze danych węzeł **configuration**.\nWęzeł **configuration** jest wyróżniony na niebiesko.\nGdy go wybierzesz, nad tabelą CV pojawia się przycisk **Edytuj CV dekodera** - otwiera on dokładnie tę samą dużą tabelę z wartościami tego pojazdu.\n**Zastosuj** zapisuje je z powrotem w dokumencie (można cofnąć przez **Cofnij**), **Anuluj** odrzuca wszystko.\n\n**Przeglądanie i zmiana długich opisów:** **Dwuklik** na polu w kolumnie Opis otwiera tekst w osobnym oknie - wielowierszowym i z automatycznym zawijaniem tekstu.\nOpisy z instrukcji producentów są często dłuższe, niż może pokazać kolumna; tutaj widać je w całości.\n**Zapisz** zatwierdza zmianę, **Anuluj** ją odrzuca. Do wpisania krótkiego tekstu pozostaje dotychczasowy sposób: po prostu zacząć pisać albo nacisnąć Enter.\n\nPrzy edycji **istniejącego szablonu** (okno Dekoder → menu Dekoder → Szablony dekoderów → **Edytuj CV dekodera**) tego przycisku brakuje. Tam szablon jest już otwarty; wczytanie drugiego na wierzch zastąpiłoby bez ostrzeżenia właśnie edytowany.\n\n**Kolumna Nr to wiersz:** wiersz 1 to CV 1, wiersz 8 to CV 8. Dlatego numeru nie da się wpisać - jest on stały.\nPodczas wczytywania szablonu i wklejania z instrukcji każdy wpis trafia do wiersza swojego numeru CV; luki między nimi pozostają puste.\nKtóre wiersze trafiają do szablonu, decyduje wyłącznie znacznik w **Aktywny**, a ten ustawia się sam, gdy tylko w polu Wartość, Typ lub Oznaczenie coś się pojawi.\n\nPrzy **wprowadzaniu** danych do tabel CV proszę poruszać się między wszystkimi polami klawiszem TAB. Tylko on prowadzi dalej poprawnie.\nKliknięcie może spowodować utratę poprzedniej zawartości.
help.captureText.da=Med **Registrer dekoder** (i Dekoder-vinduets bånd) opretter du en ny dekoderskabelon, uden at en iTrain-fil skal være åben. Der åbnes et eget, størrelsesændringsbart vindue med en CV-tabel - med samme kolonner som ved et lokomotiv (Aktiv, Nr., Værdi, Type, Betegnelse).\n\nTabellen er klar med 1000 tomme linjer og tilføjer automatisk flere, efterhånden som du nærmer dig slutningen - tallet er en standardværdi, ikke en øvre grænse. Hvad der gemmes af det, afgøres udelukkende af afkrydsningen i kolonnen **Aktiv**: den sættes af sig selv, når en linje udfyldes, og forsvinder igen, så snart du tømmer den. Den ubrugte rest kasseres ved gemning.\n\n**Indtaste værdier:** Klik på en celle og begynd bare at skrive - indtastningen starter straks. **Tabulator** og **piletasterne** overtager værdien og springer til nabocellen, Enter-tasten går en linje ned. Sådan kan en hel CV-liste tastes ind i ét stræk. **X** tømmer den markerede linje igen, **+** tilføjer hundrede linjer.\n\n**Overtage værdier fra vejledningen:** Producentens vejledning åbner du i dit sædvanlige pdf-program. Markér og kopiér de ønskede linjer dér, indsæt her: **Ctrl+V** sætter teksten i den valgte celle, **Indsæt herfra** fordeler en større markering ud over flere linjer fra den valgte linje og fremefter. Begynder en linje med et tal, gælder dette som CV-nummer, et efterfølgende kort tal som værdi, resten bliver til betegnelsen - kontrollér venligst, det er en simpel regel og passer ikke til enhver vejledning.\n\n**Indlæs skabelon:** Den samnavngivne knap overtager CV-listen fra en eksisterende dekoderskabelon til tabellen - med type og betegnelse. Står der allerede enkelte CV-numre i den, spørger programmet: **Behold værdier** lader dine egne værdier stå og supplerer kun type og betegnelse fra skabelonen, **Overskriv værdier** henter også værdierne derfra. Det er den hurtige måde at bringe et køretøj med få vedligeholdte CV'er op på producentens fulde liste, uden at miste sin egen adresse.\n\n**Gem** placerer skabelonen som CSV-fil i mappen til dekoderskabeloner - derefter er den tilgængelig under **Importer dekoder**.\n**Gem som...** spørger om en ny betegnelse og opretter desuden en anden skabelon. **Gem & send** gemmer på samme måde og åbner dit e-mailprogram med færdigt emne og tekst, så du kan indsende skabelonen. Til afsendelsen pakkes skabelonen i en .zip-fil (i eksportmappen), for mange mailprogrammer accepterer ikke .csv.\nFilen skal vedhæftes manuelt: dens sti ligger allerede i udklipsholderen, og mappen åbnes.\nAutomatisk vedhæftning er teknisk ikke muligt via e-mail-metoden "mailto"; din signatur tilføjer dit e-mailprogram som sædvanligt selv.\nNår filerne når frem til mig, samler jeg dekoderskabelonerne og optager dem i den næste programversion; indtil da stiller jeg dem enkeltvis til rådighed til download.\nSådan skulle mange enkelte dekodere over tid gerne komme til de universelle skabeloner.\n\n**Det samme vindue til eksisterende køretøjer:** Er en fil åben, finder du ved **Lokomotiver** og **Vogne** i dataudforskeren knuden **configuration**.\n**configuration** fremhæves med blåt.\nVælger du den, dukker knappen **Rediger dekoder-CV'er** op over CV-tabellen - den åbner netop den samme store tabel med værdierne for dette køretøj.\n**Overtag** skriver dem tilbage til dokumentet (kan fortrydes med **Fortryd**), **Annuller** kasserer alt.\n\n**Se og ændre lange beskrivelser:** Et **dobbeltklik** på et felt i kolonnen Beskrivelse åbner teksten i et eget vindue - flerlinjet og med automatisk linjeskift.\nBeskrivelser fra producenternes vejledninger er ofte længere, end kolonnen kan vise; her står de fuldt ud.\n**Gem** overtager ændringen, **Annuller** kasserer den. Til indtastning af en kort tekst forbliver den hidtidige metode: bare skrive løs eller trykke på Enter.\n\nVed redigering af en **eksisterende skabelon** (Dekoder-vindue → menuen Dekoder → Dekoderskabeloner → **Rediger dekoder-CV'er**) mangler denne knap. Der er skabelonen allerede åben; at indlæse en anden ovenpå ville uden varsel erstatte den, der lige er ved at blive redigeret.\n\n**Kolonnen Nr. er linjen:** linje 1 er CV 1, linje 8 er CV 8. Nummeret kan derfor ikke tastes ind - det ligger fast.\nVed indlæsning af en skabelon og ved indsættelse fra vejledningen havner hver post på linjen for sit CV-nummer; huller ind imellem forbliver tomme.\nHvilke linjer der havner i skabelonen, afgøres udelukkende af afkrydsningen i **Aktiv**, og den sættes af sig selv, så snart der står noget i Værdi, Type eller Betegnelse.\n\nVed **indtastning** i CV-tabellerne bedes du navigere gennem alle felter med TAB-tasten. Kun den fører videre korrekt.\nEt klik kan medføre, at det tidligere indhold går tabt.
help.captureText.sv=Med **Registrera dekoder** (i Dekoder-fönstrets menyfliksområde) skapar du en ny dekodermall utan att en iTrain-fil behöver vara öppen. Ett eget, storleksändringsbart fönster öppnas med en CV-tabell - med samma kolumner som för ett lok (Aktiv, Nr, Värde, Typ, Beteckning).\n\nTabellen är klar med 1000 tomma rader och lägger automatiskt till fler allteftersom du närmar dig slutet - antalet är ett standardvärde, ingen övre gräns. Vad som sparas av detta avgörs enbart av kryssrutan i kolumnen **Aktiv**: den kryssas i automatiskt när du fyller i en rad och försvinner igen så snart du tömmer den. Den oanvända resten kasseras vid sparande.\n\n**Ange värden:** Klicka på en cell och börja bara skriva - inmatningen börjar genast. **Tabb** och **piltangenterna** godkänner värdet och hoppar till grannens cell, Enter-tangenten går en rad nedåt. På så vis kan en hel CV-lista skrivas in i ett svep. **X** tömmer den markerade raden igen, **+** lägger till hundra rader.\n\n**Ta över värden från manualen:** Tillverkarens manual öppnar du i ditt vanliga PDF-program. Markera och kopiera de önskade raderna där, klistra in här: **Ctrl+V** sätter texten i den valda cellen, **Klistra in härifrån** fördelar en större markering på flera rader med början från den valda raden. Börjar en rad med ett tal, gäller detta som CV-nummer, ett efterföljande kort tal som värde, resten blir beteckningen - kontrollera gärna, det är en enkel regel som inte passar alla manualer.\n\n**Läs in mall:** Knappen med samma namn för över CV-listan från en befintlig dekodermall till tabellen - med typ och beteckning. Finns det redan enstaka CV-nummer där, frågar programmet: **Behåll värden** lämnar dina egna värden orörda och kompletterar bara typ och beteckning från mallen, **Skriv över värden** hämtar även värdena därifrån. Det är det snabba sättet att få ett fordon med få underhållna CV upp till tillverkarens fullständiga lista, utan att förlora sin egen adress.\n\n**Spara** placerar mallen som en CSV-fil i mappen för dekodermallar - därefter finns den tillgänglig under **Importera dekoder**.\n**Spara som...** frågar efter en ny beteckning och skapar dessutom en andra mall. **Spara & skicka** sparar likadant och öppnar ditt e-postprogram med färdigt ämne och text, så att du kan skicka in mallen. Vid utskicket packas mallen i en .zip-fil (i exportmappen), eftersom många e-postprogram inte tar emot .csv.\nFilen måste bifogas för hand: dess sökväg finns redan i urklipp och mappen öppnas.\nAutomatisk bifogning är tekniskt inte möjlig via e-postmetoden "mailto"; din signatur läggs till av ditt e-postprogram som vanligt.\nNär filerna når mig samlar jag ihop dekodermallarna och tar med dem i nästa programversion; fram till dess gör jag dem tillgängliga en och en för nedladdning.\nPå så vis bör många enskilda dekodrar med tiden tillkomma till de universella mallarna.\n\n**Samma fönster för befintliga fordon:** Är en fil öppen hittar du för **Lok** och **Vagnar** i datautforskaren noden **configuration**.\n**configuration** markeras med blått.\nVäljer du den, dyker knappen **Redigera dekoderns CV** upp ovanför CV-tabellen - den öppnar exakt samma stora tabell med detta fordons värden.\n**Tillämpa** skriver tillbaka dem i dokumentet (kan ångras med **Ångra**), **Avbryt** förkastar allt.\n\n**Visa och ändra långa beskrivningar:** Ett **dubbelklick** på ett fält i kolumnen Beskrivning öppnar texten i ett eget fönster - flerradig och med automatisk radbrytning.\nBeskrivningar från tillverkarnas manualer är ofta längre än vad kolumnen kan visa; här står de i sin helhet.\n**Spara** tillämpar ändringen, **Avbryt** förkastar den. För att skriva en kort text finns den tidigare metoden kvar: bara börja skriva eller trycka på Enter.\n\nVid redigering av en **befintlig mall** (Dekoder-fönstret → menyn Dekoder → Dekodermallar → **Redigera dekoderns CV**) saknas denna knapp. Där är mallen redan öppen; att läsa in en andra ovanpå skulle utan varning ersätta den som just redigeras.\n\n**Kolumnen Nr är raden:** rad 1 är CV 1, rad 8 är CV 8. Numret går därför inte att skriva in - det ligger fast.\nVid inläsning av en mall och vid inklistring från manualen hamnar varje post på raden för sitt CV-nummer; luckor däremellan förblir tomma.\nVilka rader som hamnar i mallen avgörs enbart av kryssrutan i **Aktiv**, och den kryssas i automatiskt så snart något står i Värde, Typ eller Beteckning.\n\nVid **inmatning** i CV-tabellerna, flytta mellan alla fält med TAB-tangenten. Endast den för dig korrekt vidare.\nEtt klick kan medföra att det tidigare innehållet går förlorat.

