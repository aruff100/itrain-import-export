decoder.singleNotATemplate.de="{0}" ist keine Decoder-Vorlage und wurde übersprungen. Vorlagen erkennt das Programm an der ersten Spalte der Datei; eine gewöhnliche Export-Datei aus Import/Export gehört nicht in den Vorlagen-Ordner.
decoder.singleNotATemplate.en="{0}" is not a decoder template and was skipped. The program recognises templates by the first column of the file; an ordinary export file from import/export does not belong in the templates folder.
decoder.singleNotATemplate.nl="{0}" is geen decodersjabloon en is overgeslagen. Het programma herkent sjablonen aan de eerste kolom van het bestand; een gewoon exportbestand uit import/export hoort niet in de sjabloonmap.
decoder.singleNotATemplate.fr=« {0} » n'est pas un modèle de décodeur et a été ignoré. Le programme reconnaît les modèles à la première colonne du fichier ; un fichier d'export ordinaire n'a pas sa place dans le dossier des modèles.
decoder.singleNotATemplate.es=«{0}» no es una plantilla de decoder y se ha omitido. El programa reconoce las plantillas por la primera columna del archivo; un archivo de exportación normal no pertenece a la carpeta de plantillas.
decoder.singleNotATemplate.it=«{0}» non è un modello di decoder ed è stato saltato. Il programma riconosce i modelli dalla prima colonna del file; un normale file di esportazione non va nella cartella dei modelli.
decoder.singleNotATemplate.pt="{0}" não é um modelo de descodificador e foi ignorado. O programa reconhece os modelos pela primeira coluna do ficheiro; um ficheiro de exportação normal não pertence à pasta de modelos.
decoder.singleNotATemplate.pl=„{0}” nie jest szablonem dekodera i został pominięty. Program rozpoznaje szablony po pierwszej kolumnie pliku; zwykły plik eksportu nie należy do folderu szablonów.
decoder.singleNotATemplate.da="{0}" er ikke en dekoderskabelon og blev sprunget over. Programmet genkender skabeloner på filens første kolonne; en almindelig eksportfil hører ikke hjemme i skabelonmappen.
decoder.singleNotATemplate.sv="{0}" är ingen dekodermall och hoppades över. Programmet känner igen mallar på filens första kolumn; en vanlig exportfil hör inte hemma i mallmappen.

