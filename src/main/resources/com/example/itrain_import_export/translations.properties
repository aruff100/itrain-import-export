help.settingsMenuText.de=**Voreinstellungen** öffnet ein Fenster mit zwei Reitern.\n\n**Ansicht** - alles, was die Darstellung betrifft:\n- **Sprache** wechselt die Oberflächensprache (mit Flagge) unter den 10 verfügbaren Sprachen - wirkt sofort auf das ganze Programm, auch auf die Zusatzfenster.\n- **Farbschema** öffnet über den Knopf **Farbkombination** ein Fenster, in dem Hintergrund- und Textfarbe frei gewählt werden (Hell/Dunkel als Vorbelegung); jede Änderung ist sofort im ganzen Programm sichtbar, **Speichern** übernimmt sie dauerhaft, **Zurück** stellt den vorherigen Zustand wieder her.\n- **Bildschirm** legt fest, wo neu geöffnete Fenster erscheinen: "wie zuletzt" (Vorgabe) oder ein fester Bildschirm. Ist nur ein Bildschirm angeschlossen, ist die Auswahl abgeschaltet - sie hätte dort nichts zu entscheiden.\n\nDazu vier Kontrollkästchen:\n- die Typ-Spalte\n- die Auswahlbox-Spalte\n- Daten ändern\n- Decoder-Hinweise anzeigen (der Hinweistext vor der ersten Decoder-Bearbeitung; er lässt sich auch im Dialog selbst abschalten)\n\nUnd schließlich:\n- Beim Start automatisch nach Updates suchen\n\n**Pfade:**\n- **Pfad für iTrain-Dateien** (Standardordner, der beim Öffnen/Speichern vorgeschlagen wird)\n- **Pfad für Exports** (Standardordner für die .zip-Exporte/-Importe der Kategorie-Ansicht)\n- **Pfad für Decoder-Vorlagen** (Ordner, in dem die Decoder-Vorlagen liegen - die mitgelieferten Vorlagen werden beim Start dorthin übertragen, siehe eigener Abschnitt weiter unten)\n- **Pfad für Backups** (ist er gesetzt, wird beim Öffnen einer Datei automatisch eine unveränderte Sicherheitskopie dort abgelegt)\n\nBackups, bevor irgendetwas bearbeitet wird - bis zu 10 Generationen je Datei, danach wird die älteste überschrieben. Ungenutzte Backups werden beim Schließen/Ersetzen der Datei wieder gelöscht.\nFür alle vier Pfade lässt sich über "Durchsuchen..." ein Ordner wählen.\nSind bei der allerersten Programmnutzung noch keine Pfade gesetzt, fragt das Programm einmalig danach.\n\n**Fenster merken sich ihre Lage:** Größe und Position werden beim Schließen gemerkt und beim nächsten Öffnen wiederhergestellt - Hauptfenster, Decoder-Fenster, Systeme-Fenster, Erfassungsfenster und Vorlagen-Übersicht jeweils für sich.\nZeigt eine gemerkte Position ins Leere, weil ein Bildschirm abgezogen oder die Auflösung geändert wurde, erscheint das Fenster wieder mittig auf einem vorhandenen Bildschirm.\n\nDas Menü **Einstellungen** gibt es nur im Hauptfenster; die Voreinstellungen gelten für das ganze Programm.
help.settingsMenuText.en=**Preferences** opens a window with two tabs.\n\n**View** - everything concerning the display:\n- **Language** switches the interface language (with flag) among the 10 available languages - takes effect immediately across the whole program, including the additional windows.\n- **Color scheme** opens, via the **Color combination** button, a window in which background and text color can be freely chosen (light/dark as presets); every change is immediately visible throughout the program, **Save** applies it permanently, **Back** restores the previous state.\n- **Screen** determines where newly opened windows appear: "as last time" (default) or a fixed screen. If only one screen is connected, the choice is disabled - there would be nothing to decide there.\n\nPlus four checkboxes:\n- the type column\n- the checkbox column\n- change data\n- show decoder hints (the notice shown before the first decoder edit; it can also be switched off in the dialog itself)\n\nAnd finally:\n- automatically check for updates at startup\n\n**Paths:**\n- **Path for iTrain files** (default folder suggested when opening/saving)\n- **Path for exports** (default folder for the .zip exports/imports of the category view)\n- **Path for decoder templates** (folder where the decoder templates are kept - the bundled templates are transferred there at startup, see its own section further below)\n- **Path for backups** (if set, an unmodified safety copy is automatically placed there when opening a file)\n\nBackups are made before anything is edited - up to 10 generations per file, after which the oldest is overwritten. Unused backups are deleted again when the file is closed/replaced.\nFor all four paths, a folder can be chosen via "Browse...".\nIf no paths are set yet the very first time the program is used, it asks for them once.\n\n**Windows remember their position:** size and position are remembered on closing and restored the next time they are opened - main window, Decoder window, Systems window, capture window and template overview each on their own.\nIf a remembered position points into empty space, because a screen was disconnected or the resolution was changed, the window reappears centered on an existing screen.\n\nThe **Settings** menu only exists in the main window; the preferences apply to the whole program.
help.settingsMenuText.nl=**Voorkeuren** opent een venster met twee tabbladen.\n\n**Weergave** - alles wat de weergave betreft:\n- **Taal** wisselt de interfacetaal (met vlag) tussen de 10 beschikbare talen - werkt direct door in het hele programma, ook in de extra vensters.\n- **Kleurenschema** opent via de knop **Kleurcombinatie** een venster waarin achtergrond- en tekstkleur vrij gekozen kunnen worden (licht/donker als voorinstelling); elke wijziging is direct in het hele programma zichtbaar, **Opslaan** past deze blijvend toe, **Terug** herstelt de vorige toestand.\n- **Scherm** bepaalt waar nieuw geopende vensters verschijnen: "zoals de laatste keer" (standaard) of een vast scherm. Is er maar één scherm aangesloten, dan is de keuze uitgeschakeld - er is daar niets te beslissen.\n\nDaarnaast vier aankruisvakjes:\n- de type-kolom\n- de selectievakje-kolom\n- gegevens wijzigen\n- decoderhints tonen (de hinttekst vóór de eerste decoderbewerking; kan ook in het dialoogvenster zelf worden uitgeschakeld)\n\nEn ten slotte:\n- bij het starten automatisch op updates controleren\n\n**Paden:**\n- **Pad voor iTrain-bestanden** (standaardmap die bij openen/opslaan wordt voorgesteld)\n- **Pad voor exports** (standaardmap voor de .zip-exports/-imports van de categorieweergave)\n- **Pad voor decodersjablonen** (map waarin de decodersjablonen staan - de meegeleverde sjablonen worden bij het starten daarheen overgezet, zie het eigen hoofdstuk hieronder)\n- **Pad voor backups** (indien ingesteld, wordt bij het openen van een bestand automatisch een ongewijzigde reservekopie daar opgeslagen)\n\nBackups, voordat er iets bewerkt wordt - tot 10 generaties per bestand, daarna wordt de oudste overschreven. Ongebruikte backups worden bij het sluiten/vervangen van het bestand weer verwijderd.\nVoor alle vier paden kan via "Bladeren..." een map worden gekozen.\nZijn er bij het allereerste gebruik van het programma nog geen paden ingesteld, dan vraagt het programma daar eenmalig naar.\n\n**Vensters onthouden hun positie:** grootte en positie worden bij het sluiten onthouden en bij de volgende keer openen herstelt - hoofdvenster, Decoder-venster, Systemen-venster, vastlegvenster en sjablonenoverzicht elk voor zich.\nWijst een onthouden positie naar het niets, omdat een scherm is losgekoppeld of de resolutie is gewijzigd, dan verschijnt het venster weer gecentreerd op een bestaand scherm.\n\nHet menu **Instellingen** is er alleen in het hoofdvenster; de voorkeuren gelden voor het hele programma.
help.settingsMenuText.fr=**Préférences** ouvre une fenêtre à deux onglets.\n\n**Affichage** - tout ce qui concerne la présentation :\n- **Langue** change la langue de l'interface (avec drapeau) parmi les 10 langues disponibles - s'applique immédiatement à tout le programme, y compris aux fenêtres supplémentaires.\n- **Palette de couleurs** ouvre, via le bouton **Combinaison de couleurs**, une fenêtre où la couleur de fond et de texte peuvent être choisies librement (clair/sombre en préréglage) ; chaque modification est immédiatement visible dans tout le programme, **Enregistrer** l'applique durablement, **Retour** rétablit l'état précédent.\n- **Écran** définit où apparaissent les fenêtres nouvellement ouvertes : « comme la dernière fois » (par défaut) ou un écran fixe. Si un seul écran est connecté, le choix est désactivé - il n'y aurait rien à décider.\n\nS'ajoutent quatre cases à cocher :\n- la colonne Type\n- la colonne case à cocher\n- modifier les données\n- afficher les indications sur les décodeurs (le texte affiché avant la première modification d'un décodeur ; peut aussi être désactivé dans la boîte de dialogue elle-même)\n\nEt enfin :\n- rechercher automatiquement des mises à jour au démarrage\n\n**Chemins :**\n- **Chemin pour les fichiers iTrain** (dossier par défaut proposé à l'ouverture/l'enregistrement)\n- **Chemin pour les exports** (dossier par défaut pour les exports/imports .zip de la vue par catégorie)\n- **Chemin pour les modèles de décodeur** (dossier où se trouvent les modèles de décodeur - les modèles fournis y sont transférés au démarrage, voir la section correspondante plus bas)\n- **Chemin pour les sauvegardes** (s'il est défini, une copie de sécurité non modifiée y est automatiquement déposée à l'ouverture d'un fichier)\n\nSauvegardes, avant toute modification - jusqu'à 10 générations par fichier, la plus ancienne étant ensuite écrasée. Les sauvegardes inutilisées sont supprimées à la fermeture/au remplacement du fichier.\nPour les quatre chemins, un dossier peut être choisi via « Parcourir... ».\nSi aucun chemin n'est encore défini lors de la toute première utilisation du programme, celui-ci les demande une fois.\n\n**Les fenêtres mémorisent leur position :** taille et position sont mémorisées à la fermeture et rétablies à la prochaine ouverture - fenêtre principale, fenêtre Décodeur, fenêtre Systèmes, fenêtre de saisie et aperçu des modèles, chacune séparément.\nSi une position mémorisée pointe dans le vide, parce qu'un écran a été déconnecté ou la résolution modifiée, la fenêtre réapparaît centrée sur un écran existant.\n\nLe menu **Paramètres** n'existe que dans la fenêtre principale ; les préférences s'appliquent à tout le programme.
help.settingsMenuText.es=**Preferencias** abre una ventana con dos pestañas.\n\n**Vista** - todo lo relacionado con la presentación:\n- **Idioma** cambia el idioma de la interfaz (con bandera) entre los 10 idiomas disponibles - se aplica de inmediato a todo el programa, también a las ventanas adicionales.\n- **Combinación de colores** abre, mediante el botón **Combinación de colores**, una ventana en la que se elige libremente el color de fondo y de texto (claro/oscuro como valores predeterminados); cada cambio es visible de inmediato en todo el programa, **Guardar** lo aplica de forma permanente, **Atrás** restaura el estado anterior.\n- **Pantalla** determina dónde aparecen las ventanas recién abiertas: "como la última vez" (predeterminado) o una pantalla fija. Si solo hay una pantalla conectada, la opción está deshabilitada - no habría nada que decidir ahí.\n\nAdemás, cuatro casillas de verificación:\n- la columna de tipo\n- la columna de casillas\n- cambiar datos\n- mostrar avisos de decodificador (el texto de aviso antes de la primera edición de un decodificador; también se puede desactivar en el propio diálogo)\n\nY finalmente:\n- buscar actualizaciones automáticamente al iniciar\n\n**Rutas:**\n- **Ruta para archivos iTrain** (carpeta predeterminada que se sugiere al abrir/guardar)\n- **Ruta para exportaciones** (carpeta predeterminada para las exportaciones/importaciones .zip de la vista de categorías)\n- **Ruta para plantillas de decodificador** (carpeta donde se guardan las plantillas de decodificador - las plantillas incluidas se transfieren allí al iniciar, véase el apartado correspondiente más abajo)\n- **Ruta para copias de seguridad** (si está definida, al abrir un archivo se coloca allí automáticamente una copia de seguridad sin modificar)\n\nCopias de seguridad, antes de que se edite nada - hasta 10 generaciones por archivo, después de lo cual se sobrescribe la más antigua. Las copias de seguridad no usadas se eliminan al cerrar/reemplazar el archivo.\nPara las cuatro rutas se puede elegir una carpeta mediante "Examinar...".\nSi en el primer uso del programa aún no hay rutas definidas, este las pregunta una vez.\n\n**Las ventanas recuerdan su posición:** el tamaño y la posición se recuerdan al cerrar y se restauran la próxima vez que se abren - ventana principal, ventana Decoder, ventana Sistemas, ventana de captura y vista general de plantillas, cada una por su cuenta.\nSi una posición recordada apunta al vacío, porque se desconectó una pantalla o se cambió la resolución, la ventana vuelve a aparecer centrada en una pantalla existente.\n\nEl menú **Configuración** solo existe en la ventana principal; las preferencias se aplican a todo el programa.
help.settingsMenuText.it=**Preferenze** apre una finestra con due schede.\n\n**Visualizzazione** - tutto ciò che riguarda la presentazione:\n- **Lingua** cambia la lingua dell'interfaccia (con bandiera) tra le 10 lingue disponibili - ha effetto immediato su tutto il programma, anche sulle finestre aggiuntive.\n- **Schema colori** apre, tramite il pulsante **Combinazione colori**, una finestra in cui colore di sfondo e testo possono essere scelti liberamente (chiaro/scuro come preimpostazione); ogni modifica è immediatamente visibile in tutto il programma, **Salva** la applica in modo permanente, **Indietro** ripristina lo stato precedente.\n- **Schermo** stabilisce dove appaiono le finestre appena aperte: "come l'ultima volta" (predefinito) oppure uno schermo fisso. Se è collegato un solo schermo, la scelta è disattivata - non ci sarebbe nulla da decidere.\n\nInoltre quattro caselle di controllo:\n- la colonna Tipo\n- la colonna casella di selezione\n- modifica dati\n- mostra suggerimenti sui decoder (il testo di avviso prima della prima modifica di un decoder; può essere disattivato anche nella finestra stessa)\n\nE infine:\n- verifica automaticamente gli aggiornamenti all'avvio\n\n**Percorsi:**\n- **Percorso per i file iTrain** (cartella predefinita proposta durante l'apertura/il salvataggio)\n- **Percorso per le esportazioni** (cartella predefinita per le esportazioni/importazioni .zip della vista categorie)\n- **Percorso per i modelli di decoder** (cartella in cui si trovano i modelli di decoder - i modelli forniti vengono trasferiti lì all'avvio, vedi la sezione dedicata più avanti)\n- **Percorso per i backup** (se impostato, all'apertura di un file viene automaticamente depositata lì una copia di sicurezza non modificata)\n\nBackup, prima che venga modificato qualcosa - fino a 10 generazioni per file, dopo di che il più vecchio viene sovrascritto. I backup non utilizzati vengono eliminati alla chiusura/sostituzione del file.\nPer tutti e quattro i percorsi è possibile scegliere una cartella tramite "Sfoglia...".\nSe al primissimo utilizzo del programma non sono ancora impostati percorsi, il programma li richiede una volta.\n\n**Le finestre ricordano la loro posizione:** dimensione e posizione vengono memorizzate alla chiusura e ripristinate alla successiva apertura - finestra principale, finestra Decoder, finestra Sistemi, finestra di acquisizione e panoramica dei modelli, ciascuna per sé.\nSe una posizione memorizzata punta nel vuoto, perché uno schermo è stato scollegato o la risoluzione è cambiata, la finestra riappare centrata su uno schermo esistente.\n\nIl menu **Impostazioni** esiste solo nella finestra principale; le preferenze valgono per tutto il programma.
help.settingsMenuText.pt=**Preferências** abre uma janela com dois separadores.\n\n**Visualização** - tudo o que diz respeito à apresentação:\n- **Idioma** muda o idioma da interface (com bandeira) entre os 10 idiomas disponíveis - aplica-se de imediato a todo o programa, também às janelas adicionais.\n- **Esquema de cores** abre, através do botão **Combinação de cores**, uma janela onde a cor de fundo e de texto podem ser escolhidas livremente (claro/escuro como predefinição); cada alteração é visível de imediato em todo o programa, **Guardar** aplica-a de forma permanente, **Voltar** restaura o estado anterior.\n- **Ecrã** determina onde aparecem as janelas recém-abertas: "como da última vez" (predefinição) ou um ecrã fixo. Se estiver ligado apenas um ecrã, a opção está desativada - não haveria nada a decidir aí.\n\nAlém disso, quatro caixas de verificação:\n- a coluna de tipo\n- a coluna de caixas de seleção\n- alterar dados\n- mostrar dicas de descodificador (o texto de aviso antes da primeira edição de um descodificador; também pode ser desativado na própria janela)\n\nE, por fim:\n- procurar atualizações automaticamente ao iniciar\n\n**Caminhos:**\n- **Caminho para ficheiros iTrain** (pasta predefinida sugerida ao abrir/guardar)\n- **Caminho para exportações** (pasta predefinida para as exportações/importações .zip da vista de categorias)\n- **Caminho para modelos de descodificador** (pasta onde estão os modelos de descodificador - os modelos incluídos são transferidos para lá ao iniciar, ver secção própria mais abaixo)\n- **Caminho para cópias de segurança** (se definido, ao abrir um ficheiro é automaticamente colocada aí uma cópia de segurança não modificada)\n\nCópias de segurança, antes de qualquer edição - até 10 gerações por ficheiro, depois das quais a mais antiga é substituída. As cópias de segurança não utilizadas são eliminadas ao fechar/substituir o ficheiro.\nPara os quatro caminhos pode escolher-se uma pasta através de "Procurar...".\nSe, na primeiríssima utilização do programa, ainda não houver caminhos definidos, o programa pergunta-os uma vez.\n\n**As janelas lembram a sua posição:** o tamanho e a posição são memorizados ao fechar e restaurados na próxima abertura - janela principal, janela Descodificador, janela Sistemas, janela de captura e vista geral de modelos, cada uma por si.\nSe uma posição memorizada apontar para o vazio, porque um ecrã foi desligado ou a resolução foi alterada, a janela volta a aparecer centrada num ecrã existente.\n\nO menu **Definições** só existe na janela principal; as preferências aplicam-se a todo o programa.
help.settingsMenuText.pl=**Preferencje** otwierają okno z dwiema zakładkami.\n\n**Widok** - wszystko, co dotyczy wyświetlania:\n- **Język** zmienia język interfejsu (z flagą) spośród 10 dostępnych języków - działa od razu w całym programie, także w oknach dodatkowych.\n- **Schemat kolorów** otwiera, przyciskiem **Kombinacja kolorów**, okno, w którym kolor tła i tekstu można wybrać dowolnie (jasny/ciemny jako ustawienie domyślne); każda zmiana jest od razu widoczna w całym programie, **Zapisz** wprowadza ją na stałe, **Wstecz** przywraca poprzedni stan.\n- **Ekran** określa, gdzie pojawiają się nowo otwierane okna: "jak ostatnio" (domyślnie) lub stały ekran. Jeśli podłączony jest tylko jeden ekran, wybór jest wyłączony - nie ma tam nic do zdecydowania.\n\nDo tego cztery pola wyboru:\n- kolumna typu\n- kolumna pola wyboru\n- zmiana danych\n- pokazywanie wskazówek o dekoderach (tekst wskazówki przed pierwszą edycją dekodera; można go też wyłączyć w samym oknie dialogowym)\n\nI na koniec:\n- automatyczne sprawdzanie aktualizacji przy starcie\n\n**Ścieżki:**\n- **Ścieżka do plików iTrain** (domyślny folder proponowany przy otwieraniu/zapisywaniu)\n- **Ścieżka do eksportów** (domyślny folder dla eksportów/importów .zip widoku kategorii)\n- **Ścieżka do szablonów dekoderów** (folder, w którym znajdują się szablony dekoderów - dołączone szablony są tam przenoszone przy starcie, patrz osobny rozdział poniżej)\n- **Ścieżka do kopii zapasowych** (jeśli ustawiona, przy otwieraniu pliku automatycznie zapisywana jest tam niezmodyfikowana kopia zapasowa)\n\nKopie zapasowe, zanim cokolwiek zostanie edytowane - do 10 generacji na plik, potem nadpisywana jest najstarsza. Nieużywane kopie zapasowe są usuwane przy zamykaniu/zastępowaniu pliku.\nDla wszystkich czterech ścieżek można wybrać folder przez "Przeglądaj...".\nJeśli przy pierwszym użyciu programu nie są jeszcze ustawione żadne ścieżki, program pyta o nie jednorazowo.\n\n**Okna zapamiętują swoje położenie:** rozmiar i położenie są zapamiętywane przy zamykaniu i przywracane przy następnym otwarciu - okno główne, okno Dekoder, okno Systemy, okno rejestracji i podgląd szablonów, każde z osobna.\nJeśli zapamiętane położenie wskazuje w pustkę, bo odłączono ekran albo zmieniono rozdzielczość, okno pojawia się ponownie wyśrodkowane na istniejącym ekranie.\n\nMenu **Ustawienia** istnieje tylko w oknie głównym; preferencje obowiązują dla całego programu.
help.settingsMenuText.da=**Præferencer** åbner et vindue med to faner.\n\n**Visning** - alt hvad der handler om fremstillingen:\n- **Sprog** skifter grænsefladesproget (med flag) mellem de 10 tilgængelige sprog - virker straks på hele programmet, også på de ekstra vinduer.\n- **Farveskema** åbner via knappen **Farvekombination** et vindue, hvor baggrunds- og tekstfarve vælges frit (lys/mørk som forudindstilling); hver ændring er straks synlig i hele programmet, **Gem** overtager den permanent, **Tilbage** gendanner den forrige tilstand.\n- **Skærm** fastlægger, hvor nyligt åbnede vinduer vises: "som sidst" (standard) eller en fast skærm. Er kun én skærm tilsluttet, er valget deaktiveret - der er intet at afgøre der.\n\nDertil fire afkrydsningsfelter:\n- typekolonnen\n- afkrydsningsboks-kolonnen\n- rediger data\n- vis dekoder-hints (hint-teksten før den første dekoderredigering; kan også slås fra i selve dialogen)\n\nOg til sidst:\n- søg automatisk efter opdateringer ved start\n\n**Stier:**\n- **Sti til iTrain-filer** (standardmappe, der foreslås ved åbning/gemning)\n- **Sti til eksporter** (standardmappe til .zip-eksporterne/-importerne fra kategorivisningen)\n- **Sti til dekoderskabeloner** (mappe, hvor dekoderskabelonerne ligger - de medfølgende skabeloner overføres dertil ved start, se eget afsnit nedenfor)\n- **Sti til sikkerhedskopier** (hvis angivet, placeres der automatisk en uændret sikkerhedskopi, når en fil åbnes)\n\nSikkerhedskopier, før noget redigeres - op til 10 generationer pr. fil, hvorefter den ældste overskrives. Ubrugte sikkerhedskopier slettes igen, når filen lukkes/udskiftes.\nFor alle fire stier kan der vælges en mappe via "Gennemse...".\nEr der ved den allerførste brug af programmet endnu ingen stier angivet, spørger programmet én gang om det.\n\n**Vinduer husker deres placering:** størrelse og position huskes ved lukning og gendannes ved næste åbning - hovedvindue, Dekoder-vindue, Systemer-vindue, registreringsvindue og skabelonoversigt hver for sig.\nPeger en husket position ud i det tomme, fordi en skærm er frakoblet eller opløsningen ændret, vises vinduet igen centreret på en eksisterende skærm.\n\nMenuen **Indstillinger** findes kun i hovedvinduet; præferencerne gælder for hele programmet.
help.settingsMenuText.sv=**Alternativ** öppnar ett fönster med två flikar.\n\n**Visning** - allt som rör presentationen:\n- **Språk** växlar gränssnittsspråket (med flagga) mellan de 10 tillgängliga språken - verkar direkt på hela programmet, även på de extra fönstren.\n- **Färgschema** öppnar via knappen **Färgkombination** ett fönster där bakgrunds- och textfärg väljs fritt (ljust/mörkt som förinställning); varje ändring syns genast i hela programmet, **Spara** gör den permanent, **Tillbaka** återställer föregående tillstånd.\n- **Skärm** avgör var nyligen öppnade fönster visas: "som senast" (standard) eller en fast skärm. Är endast en skärm ansluten är valet inaktiverat - det finns inget att avgöra där.\n\nDessutom fyra kryssrutor:\n- typkolumnen\n- kryssrutekolumnen\n- ändra data\n- visa dekodertips (texten som visas innan den första dekoderredigeringen; kan också stängas av i själva dialogrutan)\n\nOch slutligen:\n- sök automatiskt efter uppdateringar vid start\n\n**Sökvägar:**\n- **Sökväg för iTrain-filer** (standardmapp som föreslås vid öppning/sparande)\n- **Sökväg för exporter** (standardmapp för .zip-exporterna/-importerna i kategorivyn)\n- **Sökväg för dekodermallar** (mapp där dekodermallarna finns - de medföljande mallarna förs över dit vid start, se eget avsnitt längre ner)\n- **Sökväg för säkerhetskopior** (om angiven placeras automatiskt en oförändrad säkerhetskopia där när en fil öppnas)\n\nSäkerhetskopior, innan något redigeras - upp till 10 generationer per fil, därefter skrivs den äldsta över. Oanvända säkerhetskopior tas bort igen när filen stängs/ersätts.\nFör alla fyra sökvägar kan en mapp väljas via "Bläddra...".\nOm det vid allra första användningen av programmet ännu inte finns några sökvägar inställda, frågar programmet en gång om dem.\n\n**Fönster kommer ihåg sin placering:** storlek och position sparas vid stängning och återställs nästa gång de öppnas - huvudfönster, Dekoder-fönster, System-fönster, registreringsfönster och mallöversikt var för sig.\nPekar en sparad position ut i tomma intet, eftersom en skärm har kopplats bort eller upplösningen ändrats, visas fönstret igen centrerat på en befintlig skärm.\n\nMenyn **Inställningar** finns bara i huvudfönstret; alternativen gäller för hela programmet.

