editor.decoderSelectOne.pl=Zaznacz dokładnie jeden wpis - konfiguracja dekodera należy zawsze do dokładnie jednego pojazdu.
editor.decoderSelectOne.da=Vælg venligst præcis én post - en dekoderkonfiguration hører altid til præcis ét køretøj.
