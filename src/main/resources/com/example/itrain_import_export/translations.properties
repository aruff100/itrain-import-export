capture.hintsText.de=**Empfehlung: die Hersteller-Anleitung daneben öffnen**\n\nWenn du neue Decoder erfassen oder vorhandene Vorlagen mit zusätzlichen Angaben versehen willst, hilft ein Blick in die PDF-Datei des Herstellers.\n\nÖffne dazu einfach zusätzlich zu diesem Programm dein PDF-Programm (zum Beispiel den Acrobat Reader) mit der Hersteller-Datei und ordne beide Fenster **nebeneinander** auf dem Bildschirm an.\n\n**So übernimmst du die Werte**\n\nMarkiere in der CV-Übersicht der Anleitung den gewünschten Text mit der Maus und übernimm ihn über die Zwischenablage in diese Tabelle. Das geht ganz mit der Maus oder über die Tastatur:\n\n- **Windows und Linux:** Strg+C zum Kopieren, Strg+V zum Einfügen\n- **macOS:** Command (⌘)+C zum Kopieren, Command (⌘)+V zum Einfügen\n\nHier im Fenster setzt **Strg+V** den Text in die ausgewählte Zelle. **Ab hier einfügen** verteilt eine größere Markierung ab der ausgewählten Zeile auf mehrere Zeilen.\n\n**Warum kein eingebauter PDF-Betrachter?**\n\nIch habe versucht, diese Möglichkeit im Programm selbst abzubilden. An die Anzeige und das Markieren eines Acrobat Readers oder eines Browsers komme ich damit nicht heran - mit der oben beschriebenen Methode funktioniert es dagegen einwandfrei.
capture.hintsText.en=**Recommendation: open the manufacturer's manual alongside**\n\nWhen you want to record new decoders or add further details to existing templates, a look into the manufacturer's PDF file helps.\n\nSimply open your PDF program (for example Acrobat Reader) with the manufacturer's file in addition to this program, and arrange both windows **side by side** on the screen.\n\n**How to take the values over**\n\nIn the CV table of the manual, select the text you want with the mouse and take it over into this table via the clipboard. This works entirely with the mouse or with the keyboard:\n\n- **Windows and Linux:** Ctrl+C to copy, Ctrl+V to paste\n- **macOS:** Command (⌘)+C to copy, Command (⌘)+V to paste\n\nHere in the window, **Ctrl+V** puts the text into the selected cell. **Paste from here** spreads a larger selection across several rows, starting at the selected one.\n\n**Why no built-in PDF viewer?**\n\nI did try to provide this inside the program itself. It cannot match the display and selection of an Acrobat Reader or a browser - whereas the method described above works flawlessly.
capture.hintsText.nl=**Aanbeveling: de handleiding van de fabrikant ernaast openen**\n\nWil je nieuwe decoders vastleggen of bestaande sjablonen van extra gegevens voorzien, dan helpt een blik in het PDF-bestand van de fabrikant.\n\nOpen daarvoor eenvoudig, naast dit programma, je PDF-programma (bijvoorbeeld Acrobat Reader) met het bestand van de fabrikant en zet beide vensters **naast elkaar** op het scherm.\n\n**Zo neem je de waarden over**\n\nSelecteer in het CV-overzicht van de handleiding de gewenste tekst met de muis en neem die via het klembord over in deze tabel. Dat kan volledig met de muis of met het toetsenbord:\n\n- **Windows en Linux:** Ctrl+C om te kopiëren, Ctrl+V om te plakken\n- **macOS:** Command (⌘)+C om te kopiëren, Command (⌘)+V om te plakken\n\nHier in het venster zet **Ctrl+V** de tekst in de geselecteerde cel. **Vanaf hier plakken** verdeelt een grotere selectie vanaf de geselecteerde regel over meerdere regels.\n\n**Waarom geen ingebouwde PDF-weergave?**\n\nIk heb geprobeerd dit in het programma zelf te bieden. Aan de weergave en de selectie van een Acrobat Reader of een browser kom ik daarmee niet - met de hierboven beschreven methode werkt het daarentegen prima.
capture.hintsText.fr=**Recommandation : ouvrir la notice du fabricant à côté**\n\nPour saisir de nouveaux décodeurs ou compléter des modèles existants, un coup d'œil dans le fichier PDF du fabricant est précieux.\n\nOuvrez simplement, en plus de ce programme, votre logiciel PDF (par exemple Acrobat Reader) avec le fichier du fabricant, et disposez les deux fenêtres **côte à côte** sur l'écran.\n\n**Comment reprendre les valeurs**\n\nDans le tableau CV de la notice, sélectionnez le texte voulu à la souris et reprenez-le dans ce tableau via le presse-papiers. Cela fonctionne entièrement à la souris ou au clavier :\n\n- **Windows et Linux :** Ctrl+C pour copier, Ctrl+V pour coller\n- **macOS :** Command (⌘)+C pour copier, Command (⌘)+V pour coller\n\nIci dans la fenêtre, **Ctrl+V** place le texte dans la cellule sélectionnée. **Coller à partir d'ici** répartit une sélection plus grande sur plusieurs lignes à partir de la ligne sélectionnée.\n\n**Pourquoi pas de visionneuse PDF intégrée ?**\n\nJ'ai essayé de proposer cela dans le programme lui-même. Je n'arrive pas à égaler l'affichage et la sélection d'un Acrobat Reader ou d'un navigateur - alors que la méthode décrite ci-dessus fonctionne parfaitement.
capture.hintsText.es=**Recomendación: abrir el manual del fabricante al lado**\n\nSi quiere registrar nuevos decoders o completar plantillas existentes con más datos, conviene consultar el archivo PDF del fabricante.\n\nAbra simplemente, además de este programa, su programa de PDF (por ejemplo Acrobat Reader) con el archivo del fabricante y coloque ambas ventanas **una al lado de la otra** en la pantalla.\n\n**Así se toman los valores**\n\nEn la tabla de CV del manual, marque con el ratón el texto deseado y páselo a esta tabla a través del portapapeles. Puede hacerse por completo con el ratón o con el teclado:\n\n- **Windows y Linux:** Ctrl+C para copiar, Ctrl+V para pegar\n- **macOS:** Command (⌘)+C para copiar, Command (⌘)+V para pegar\n\nAquí en la ventana, **Ctrl+V** pone el texto en la celda seleccionada. **Pegar desde aquí** reparte una selección mayor en varias filas a partir de la seleccionada.\n\n**¿Por qué no hay un visor de PDF integrado?**\n\nIntenté ofrecer esta posibilidad dentro del propio programa. No alcanzo la visualización ni el marcado de un Acrobat Reader o de un navegador; en cambio, con el método descrito arriba funciona perfectamente.
capture.hintsText.it=**Consiglio: aprire il manuale del produttore accanto**\n\nSe vuoi acquisire nuovi decoder o arricchire modelli esistenti con ulteriori dati, uno sguardo al file PDF del produttore aiuta molto.\n\nApri semplicemente, oltre a questo programma, il tuo programma PDF (per esempio Acrobat Reader) con il file del produttore e disponi le due finestre **affiancate** sullo schermo.\n\n**Come riprendere i valori**\n\nNella tabella CV del manuale seleziona con il mouse il testo desiderato e riprendilo in questa tabella tramite gli appunti. Funziona interamente con il mouse oppure da tastiera:\n\n- **Windows e Linux:** Ctrl+C per copiare, Ctrl+V per incollare\n- **macOS:** Command (⌘)+C per copiare, Command (⌘)+V per incollare\n\nQui nella finestra **Ctrl+V** mette il testo nella cella selezionata. **Incolla da qui** distribuisce una selezione più ampia su più righe a partire da quella selezionata.\n\n**Perché nessun visualizzatore PDF integrato?**\n\nHo provato a offrire questa possibilità nel programma stesso. Non riesco a eguagliare la visualizzazione e la selezione di un Acrobat Reader o di un browser: con il metodo descritto sopra funziona invece perfettamente.
capture.hintsText.pt=**Recomendação: abrir o manual do fabricante ao lado**\n\nSe quiser recolher novos descodificadores ou completar modelos existentes com mais dados, vale a pena consultar o ficheiro PDF do fabricante.\n\nAbra simplesmente, além deste programa, o seu programa de PDF (por exemplo o Acrobat Reader) com o ficheiro do fabricante e coloque as duas janelas **lado a lado** no ecrã.\n\n**Como assumir os valores**\n\nNa tabela CV do manual, marque com o rato o texto pretendido e passe-o para esta tabela através da área de transferência. Pode fazer-se totalmente com o rato ou pelo teclado:\n\n- **Windows e Linux:** Ctrl+C para copiar, Ctrl+V para colar\n- **macOS:** Command (⌘)+C para copiar, Command (⌘)+V para colar\n\nAqui na janela, **Ctrl+V** coloca o texto na célula selecionada. **Colar a partir daqui** distribui uma seleção maior por várias linhas a partir da selecionada.\n\n**Porquê nenhum visualizador de PDF integrado?**\n\nTentei oferecer esta possibilidade no próprio programa. Não consigo igualar a apresentação nem a marcação de um Acrobat Reader ou de um navegador - já com o método descrito acima funciona na perfeição.
capture.hintsText.pl=**Zalecenie: otwórz obok instrukcję producenta**\n\nGdy chcesz zarejestrować nowe dekodery albo uzupełnić istniejące szablony o dodatkowe informacje, pomocny jest wgląd w plik PDF producenta.\n\nOtwórz po prostu, obok tego programu, swój program PDF (na przykład Acrobat Reader) z plikiem producenta i ustaw oba okna **obok siebie** na ekranie.\n\n**Tak przejmujesz wartości**\n\nW zestawieniu CV w instrukcji zaznacz myszą potrzebny tekst i przenieś go przez schowek do tej tabeli. Można to zrobić w całości myszą albo klawiaturą:\n\n- **Windows i Linux:** Ctrl+C aby skopiować, Ctrl+V aby wkleić\n- **macOS:** Command (⌘)+C aby skopiować, Command (⌘)+V aby wkleić\n\nTutaj w oknie **Ctrl+V** wstawia tekst do zaznaczonej komórki. **Wstaw od tego miejsca** rozdziela większe zaznaczenie na kilka wierszy, począwszy od zaznaczonego.\n\n**Dlaczego nie ma wbudowanej przeglądarki PDF?**\n\nPróbowałem odwzorować tę możliwość w samym programie. Nie dorównam wyświetlaniu i zaznaczaniu w Acrobat Readerze ani w przeglądarce - natomiast opisana wyżej metoda działa bez zarzutu.
capture.hintsText.da=**Anbefaling: åbn producentens vejledning ved siden af**\n\nVil du registrere nye dekodere eller supplere eksisterende skabeloner med flere oplysninger, hjælper et blik i producentens PDF-fil.\n\nÅbn blot, ud over dette program, dit PDF-program (for eksempel Acrobat Reader) med producentens fil, og placer begge vinduer **ved siden af hinanden** på skærmen.\n\n**Sådan overtager du værdierne**\n\nMarker den ønskede tekst med musen i vejledningens CV-oversigt, og overtag den via udklipsholderen i denne tabel. Det kan gøres helt med musen eller med tastaturet:\n\n- **Windows og Linux:** Ctrl+C for at kopiere, Ctrl+V for at indsætte\n- **macOS:** Command (⌘)+C for at kopiere, Command (⌘)+V for at indsætte\n\nHer i vinduet sætter **Ctrl+V** teksten i den markerede celle. **Indsæt herfra** fordeler en større markering over flere rækker fra den markerede.\n\n**Hvorfor ingen indbygget PDF-visning?**\n\nJeg har forsøgt at tilbyde dette i selve programmet. Jeg kan ikke måle mig med visningen og markeringen i en Acrobat Reader eller en browser - med metoden ovenfor fungerer det derimod fejlfrit.
capture.hintsText.sv=**Rekommendation: öppna tillverkarens manual bredvid**\n\nVill du registrera nya dekodrar eller komplettera befintliga mallar med fler uppgifter är en titt i tillverkarens PDF-fil till stor hjälp.\n\nÖppna helt enkelt, utöver det här programmet, ditt PDF-program (till exempel Acrobat Reader) med tillverkarens fil och placera båda fönstren **bredvid varandra** på skärmen.\n\n**Så tar du över värdena**\n\nMarkera önskad text med musen i manualens CV-översikt och för över den till den här tabellen via urklipp. Det går helt med musen eller med tangentbordet:\n\n- **Windows och Linux:** Ctrl+C för att kopiera, Ctrl+V för att klistra in\n- **macOS:** Command (⌘)+C för att kopiera, Command (⌘)+V för att klistra in\n\nHär i fönstret sätter **Ctrl+V** texten i den markerade cellen. **Klistra in härifrån** fördelar en större markering över flera rader med start i den markerade.\n\n**Varför ingen inbyggd PDF-visning?**\n\nJag har försökt erbjuda detta i programmet självt. Jag kommer inte i närheten av visningen och markeringen i en Acrobat Reader eller en webbläsare - med metoden ovan fungerar det däremot utmärkt.

