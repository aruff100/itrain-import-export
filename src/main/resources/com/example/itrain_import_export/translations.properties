help.windowsText.de=Das Programm merkt sich, wo seine Fenster stehen - **jedes für sich**. Hauptfenster, Erfassungsfenster für Decoder, das Fenster zum Bearbeiten einer Fahrzeug-Konfiguration und die Vorlagen-Übersicht haben jeweils einen eigenen Merker für Größe und Position. Beim nächsten Öffnen erscheint das Fenster wieder dort, wo du es zuletzt hattest.\nGetrennte Merker sind Absicht: Wer eine Vorlage erfasst, will das Fenster meist anders stehen haben als beim Nachbessern der Konfiguration eines einzelnen Fahrzeugs.\n\n**Mehrere Bildschirme**\n\n- **Voreinstellungen → Ansicht → Bildschirm** legt fest, wo neu geöffnete Fenster erscheinen. Vorgabe ist **wie zuletzt**: Jedes Fenster kehrt an seine gemerkte Stelle zurück, und Zusatzfenster gehen dorthin, wo das Fenster steht, aus dem sie aufgerufen wurden. Alternativ lässt sich ein fester Bildschirm wählen - sinnvoll, wenn das Programm immer auf demselben Monitor starten soll. Bei nur einem angeschlossenen Bildschirm ist die Auswahl abgeschaltet.\n- **Dialoge erscheinen über dem Hauptfenster.** Früher landeten sie mitunter auf dem Hauptbildschirm des Betriebssystems, also womöglich auf einem ganz anderen Monitor als das Programm - man suchte den Dialog, während das Fenster auf eine Antwort wartete.\n\n**Verschieben wird gemerkt**\n\nRückst du einen Dialog beiseite, erscheint der nächste wieder an derselben Stelle. Gemerkt wird der **Abstand zur Mitte des Hauptfensters**, nicht die feste Bildschirmposition: Dialoge sind unterschiedlich groß, und das Hauptfenster kann inzwischen auf einem anderen Monitor stehen. Eine gemerkte absolute Lage zeigte nach einem solchen Umzug ins Leere.\n\n**Alles wieder einsammeln**\n\n**Bearbeiten → Alle Fenster zentrieren** holt sämtliche offenen Fenster mittig auf den Bildschirm des Hauptfensters und vergisst dabei die gemerkte Verschiebung der Dialoge. Das ist der Ausweg, wenn ein Fenster unauffindbar ist - etwa weil ein Monitor abgezogen wurde oder sich die Auflösung geändert hat. Unabhängig davon prüft das Programm eine gemerkte Position beim Öffnen gegen die heute angeschlossenen Bildschirme; zeigt sie ins Leere, erscheint das Fenster mittig auf einem vorhandenen Bildschirm.
help.windowsText.en=The program remembers where its windows are - **each one separately**. The main window, the decoder capture window, the window for editing a vehicle configuration and the template overview each have their own record of size and position. Next time you open one, it appears where you last left it.\nSeparate records are deliberate: someone capturing a template usually wants the window somewhere other than when touching up the configuration of a single vehicle.\n\n**Multiple screens**\n\n- **Preferences → View → Screen** determines where newly opened windows appear. The default is **as last time**: every window returns to its remembered place, and secondary windows go to wherever the window they were called from is standing. Alternatively you can pick a fixed screen - useful if the program should always start on the same monitor. With only one screen connected the setting is disabled.\n- **Dialogs appear over the main window.** They used to land on the operating system's primary screen at times, possibly on a completely different monitor from the program - you went looking for the dialog while the window waited for an answer.\n\n**Moving them is remembered**\n\nIf you push a dialog aside, the next one appears in the same place. What is remembered is the **offset from the centre of the main window**, not a fixed screen position: dialogs differ in size, and the main window may meanwhile be on another monitor. A remembered absolute position pointed nowhere after such a move.\n\n**Gathering everything back in**\n\n**Edit → Centre all windows** brings every open window back to the middle of the main window's screen and forgets the remembered dialog offset while doing so. That is the way out when a window cannot be found - because a monitor was unplugged, say, or the resolution changed. Independently of that, the program checks a remembered position against the screens actually connected today; if it points nowhere, the window appears centred on an existing screen.
help.windowsText.nl=Het programma onthoudt waar zijn vensters staan - **elk apart**. Het hoofdvenster, het opnamevenster voor decoders, het venster om een voertuigconfiguratie te bewerken en het sjabloonoverzicht hebben elk een eigen geheugen voor grootte en positie. Bij het volgende openen verschijnt het venster weer waar je het liet.\nAparte geheugens zijn opzet: wie een sjabloon opneemt, wil het venster meestal anders hebben staan dan bij het bijwerken van de configuratie van één voertuig.\n\n**Meerdere schermen**\n\n- **Voorkeuren → Weergave → Scherm** bepaalt waar nieuw geopende vensters verschijnen. Standaard is **zoals de vorige keer**: elk venster keert terug naar zijn onthouden plek, en extra vensters gaan naar waar het venster staat van waaruit ze zijn opgeroepen. Je kunt ook een vast scherm kiezen - handig als het programma altijd op dezelfde monitor moet starten. Bij slechts één aangesloten scherm is de keuze uitgeschakeld.\n- **Dialoogvensters verschijnen boven het hoofdvenster.** Vroeger belandden ze soms op het hoofdscherm van het besturingssysteem, dus mogelijk op een heel andere monitor dan het programma - je zocht het venster terwijl het op antwoord wachtte.\n\n**Verschuiven wordt onthouden**\n\nSchuif je een dialoogvenster opzij, dan verschijnt het volgende op dezelfde plek. Onthouden wordt de **afstand tot het midden van het hoofdvenster**, niet de vaste schermpositie: dialoogvensters zijn verschillend van grootte, en het hoofdvenster kan inmiddels op een andere monitor staan. Een onthouden absolute positie wees na zo'n verhuizing in het niets.\n\n**Alles weer bij elkaar halen**\n\n**Bewerken → Alle vensters centreren** haalt alle open vensters naar het midden van het scherm van het hoofdvenster en vergeet daarbij de onthouden verschuiving van de dialoogvensters. Dat is de uitweg als een venster onvindbaar is - bijvoorbeeld omdat een monitor is losgekoppeld of de resolutie is gewijzigd. Los daarvan controleert het programma een onthouden positie bij het openen tegen de vandaag aangesloten schermen; wijst die in het niets, dan verschijnt het venster gecentreerd op een bestaand scherm.
help.windowsText.fr=Le programme retient où se trouvent ses fenêtres - **chacune séparément**. La fenêtre principale, la fenêtre de saisie des décodeurs, la fenêtre de modification d'une configuration de véhicule et l'aperçu des modèles ont chacune leur propre repère de taille et de position. À la prochaine ouverture, la fenêtre revient là où vous l'aviez laissée.\nDes repères séparés sont voulus : qui saisit un modèle veut le plus souvent la fenêtre ailleurs que pour retoucher la configuration d'un seul véhicule.\n\n**Écrans multiples**\n\n- **Préférences → Affichage → Écran** détermine où apparaissent les fenêtres nouvellement ouvertes. Par défaut **comme la dernière fois** : chaque fenêtre retrouve sa place mémorisée, et les fenêtres secondaires vont là où se trouve celle depuis laquelle elles ont été appelées. On peut aussi choisir un écran fixe - utile si le programme doit toujours démarrer sur le même moniteur. Avec un seul écran raccordé, le réglage est désactivé.\n- **Les boîtes de dialogue apparaissent au-dessus de la fenêtre principale.** Auparavant, elles atterrissaient parfois sur l'écran principal du système, donc éventuellement sur un tout autre moniteur que le programme - on cherchait la boîte pendant que la fenêtre attendait une réponse.\n\n**Le déplacement est retenu**\n\nSi vous écartez une boîte de dialogue, la suivante réapparaît au même endroit. Ce qui est retenu, c'est l'**écart par rapport au centre de la fenêtre principale**, non une position d'écran fixe : les boîtes ont des tailles différentes, et la fenêtre principale peut entre-temps être sur un autre moniteur. Une position absolue mémorisée ne menait nulle part après un tel déménagement.\n\n**Tout rassembler**\n\n**Édition → Centrer toutes les fenêtres** ramène toutes les fenêtres ouvertes au milieu de l'écran de la fenêtre principale et oublie au passage l'écart mémorisé des boîtes de dialogue. C'est l'issue quand une fenêtre reste introuvable - parce qu'un moniteur a été débranché, par exemple, ou que la résolution a changé. Indépendamment de cela, le programme confronte à l'ouverture une position mémorisée aux écrans effectivement raccordés ; si elle ne mène nulle part, la fenêtre apparaît centrée sur un écran existant.
help.windowsText.es=El programa recuerda dónde están sus ventanas - **cada una por separado**. La ventana principal, la de captura de decoders, la de edición de la configuración de un vehículo y el resumen de plantillas tienen cada una su propio registro de tamaño y posición. La próxima vez aparecen donde las dejaste.\nLos registros separados son intencionados: quien captura una plantilla suele querer la ventana en otro sitio que al retocar la configuración de un solo vehículo.\n\n**Varias pantallas**\n\n- **Preferencias → Vista → Pantalla** determina dónde aparecen las ventanas nuevas. Por defecto **como la última vez**: cada ventana vuelve a su sitio recordado, y las ventanas secundarias van adonde esté aquella desde la que se abrieron. También puede fijarse una pantalla concreta, útil si el programa debe arrancar siempre en el mismo monitor. Con una sola pantalla conectada la opción queda desactivada.\n- **Los diálogos aparecen sobre la ventana principal.** Antes acababan a veces en la pantalla principal del sistema, quizá en un monitor muy distinto del programa: uno buscaba el diálogo mientras la ventana esperaba respuesta.\n\n**El desplazamiento se recuerda**\n\nSi apartas un diálogo, el siguiente aparece en el mismo sitio. Lo que se recuerda es la **distancia al centro de la ventana principal**, no una posición fija de pantalla: los diálogos tienen tamaños distintos y la ventana principal puede estar ya en otro monitor. Una posición absoluta recordada apuntaba al vacío tras esa mudanza.\n\n**Recogerlo todo de nuevo**\n\n**Editar → Centrar todas las ventanas** trae todas las ventanas abiertas al centro de la pantalla de la ventana principal y olvida de paso el desplazamiento recordado de los diálogos. Es la salida cuando una ventana no aparece: porque se ha desconectado un monitor, por ejemplo, o ha cambiado la resolución. Al margen de eso, el programa coteja al abrir una posición recordada con las pantallas conectadas hoy; si apunta al vacío, la ventana aparece centrada en una pantalla existente.
help.windowsText.it=Il programma ricorda dove stanno le sue finestre - **ognuna per conto suo**. La finestra principale, quella di acquisizione dei decoder, quella per modificare la configurazione di un rotabile e il riepilogo dei modelli hanno ciascuna un proprio segnaposto per dimensione e posizione. Alla riapertura la finestra ricompare dove l'avevi lasciata.\nSegnaposti separati sono voluti: chi acquisisce un modello di solito vuole la finestra altrove rispetto a quando ritocca la configurazione di un singolo rotabile.\n\n**Più schermi**\n\n- **Preferenze → Vista → Schermo** stabilisce dove compaiono le finestre appena aperte. Il valore predefinito è **come l'ultima volta**: ogni finestra torna al posto ricordato e le finestre secondarie vanno dove sta quella da cui sono state richiamate. In alternativa si può scegliere uno schermo fisso, utile se il programma deve avviarsi sempre sullo stesso monitor. Con un solo schermo collegato la scelta è disattivata.\n- **Le finestre di dialogo compaiono sopra la finestra principale.** Prima finivano a volte sullo schermo principale del sistema, quindi magari su un monitor del tutto diverso da quello del programma: si cercava il dialogo mentre la finestra attendeva una risposta.\n\n**Lo spostamento viene ricordato**\n\nSe sposti di lato un dialogo, il successivo ricompare nello stesso punto. Viene ricordata la **distanza dal centro della finestra principale**, non una posizione fissa dello schermo: i dialoghi hanno dimensioni diverse e la finestra principale può nel frattempo trovarsi su un altro monitor. Una posizione assoluta ricordata non portava da nessuna parte dopo un simile trasloco.\n\n**Rimettere tutto insieme**\n\n**Modifica → Centra tutte le finestre** riporta tutte le finestre aperte al centro dello schermo della finestra principale, dimenticando al contempo lo spostamento ricordato dei dialoghi. È la via d'uscita quando una finestra non si trova: perché è stato staccato un monitor, per esempio, o è cambiata la risoluzione. A prescindere da ciò, all'apertura il programma confronta una posizione ricordata con gli schermi collegati oggi; se non porta da nessuna parte, la finestra compare centrata su uno schermo esistente.
help.windowsText.pt=O programa lembra-se de onde estão as suas janelas - **cada uma por si**. A janela principal, a de captura de descodificadores, a de edição da configuração de um veículo e o resumo de modelos têm cada uma o seu próprio registo de tamanho e posição. Da próxima vez aparecem onde as deixaste.\nRegistos separados são intencionais: quem capta um modelo costuma querer a janela noutro sítio que ao retocar a configuração de um único veículo.\n\n**Vários ecrãs**\n\n- **Preferências → Vista → Ecrã** determina onde aparecem as janelas recém-abertas. Por omissão **como da última vez**: cada janela regressa ao lugar memorizado e as janelas secundárias vão para onde está aquela a partir da qual foram chamadas. Em alternativa pode fixar-se um ecrã, útil se o programa deve arrancar sempre no mesmo monitor. Com apenas um ecrã ligado a opção fica desativada.\n- **Os diálogos aparecem sobre a janela principal.** Antes iam por vezes parar ao ecrã principal do sistema, talvez num monitor completamente diferente do programa - procurava-se o diálogo enquanto a janela esperava resposta.\n\n**A deslocação é memorizada**\n\nSe afastares um diálogo, o seguinte aparece no mesmo sítio. O que é memorizado é a **distância ao centro da janela principal**, não uma posição fixa de ecrã: os diálogos têm tamanhos diferentes e a janela principal pode entretanto estar noutro monitor. Uma posição absoluta memorizada apontava para o vazio depois dessa mudança.\n\n**Juntar tudo outra vez**\n\n**Editar → Centrar todas as janelas** traz todas as janelas abertas para o meio do ecrã da janela principal e esquece de caminho a deslocação memorizada dos diálogos. É a saída quando uma janela não se encontra - por se ter desligado um monitor, por exemplo, ou por ter mudado a resolução. Independentemente disso, ao abrir o programa confronta uma posição memorizada com os ecrãs hoje ligados; se apontar para o vazio, a janela aparece centrada num ecrã existente.
help.windowsText.pl=Program pamięta, gdzie stoją jego okna - **każde z osobna**. Okno główne, okno rejestracji dekoderów, okno edycji konfiguracji pojazdu i przegląd szablonów mają własny zapis rozmiaru i położenia. Przy kolejnym otwarciu okno pojawia się tam, gdzie je zostawiłeś.\nOsobne zapisy są zamierzone: kto rejestruje szablon, zwykle chce mieć okno gdzie indziej niż przy poprawianiu konfiguracji pojedynczego pojazdu.\n\n**Kilka monitorów**\n\n- **Ustawienia → Widok → Monitor** określa, gdzie pojawiają się nowo otwierane okna. Domyślnie **jak ostatnio**: każde okno wraca na zapamiętane miejsce, a okna dodatkowe trafiają tam, gdzie stoi to, z którego je wywołano. Można też wybrać stały monitor - przydatne, jeśli program ma zawsze startować na tym samym ekranie. Przy jednym podłączonym monitorze opcja jest wyłączona.\n- **Okna dialogowe pojawiają się nad oknem głównym.** Wcześniej trafiały czasem na główny ekran systemu, a więc być może na całkiem inny monitor niż program - szukało się okna, podczas gdy ono czekało na odpowiedź.\n\n**Przesunięcie jest zapamiętywane**\n\nJeśli odsuniesz okno dialogowe, następne pojawi się w tym samym miejscu. Zapamiętywana jest **odległość od środka okna głównego**, a nie stała pozycja ekranowa: okna dialogowe mają różne rozmiary, a okno główne może już stać na innym monitorze. Zapamiętana pozycja bezwzględna po takiej przeprowadzce prowadziła donikąd.\n\n**Zebrać wszystko z powrotem**\n\n**Edycja → Wyśrodkuj wszystkie okna** sprowadza wszystkie otwarte okna na środek ekranu okna głównego i zapomina przy tym zapamiętane przesunięcie okien dialogowych. To wyjście, gdy okna nie da się znaleźć - bo odłączono monitor albo zmieniła się rozdzielczość. Niezależnie od tego program przy otwieraniu porównuje zapamiętaną pozycję z dziś podłączonymi ekranami; jeśli prowadzi donikąd, okno pojawia się wyśrodkowane na istniejącym ekranie.
help.windowsText.da=Programmet husker, hvor dets vinduer står - **hvert for sig**. Hovedvinduet, dekoderregistreringsvinduet, vinduet til redigering af et køretøjs konfiguration og skabelonoversigten har hver deres eget notat om størrelse og placering. Næste gang dukker vinduet op, hvor du forlod det.\nAdskilte notater er med vilje: den, der registrerer en skabelon, vil som regel have vinduet et andet sted end ved finpudsning af et enkelt køretøjs konfiguration.\n\n**Flere skærme**\n\n- **Indstillinger → Visning → Skærm** afgør, hvor nyåbnede vinduer viser sig. Standard er **som sidst**: hvert vindue vender tilbage til sin huskede plads, og ekstravinduer går derhen, hvor det vindue står, de blev kaldt fra. Alternativt kan man vælge en fast skærm - nyttigt, hvis programmet altid skal starte på samme monitor. Med kun én tilsluttet skærm er valget slået fra.\n- **Dialoger viser sig over hovedvinduet.** Før landede de undertiden på systemets primære skærm, altså muligvis på en helt anden monitor end programmet - man ledte efter dialogen, mens vinduet ventede på svar.\n\n**Flytning bliver husket**\n\nSkubber du en dialog til side, dukker den næste op samme sted. Det, der huskes, er **afstanden til midten af hovedvinduet**, ikke en fast skærmposition: dialoger har forskellig størrelse, og hovedvinduet kan i mellemtiden stå på en anden monitor. En husket absolut placering pegede ud i ingenting efter sådan en flytning.\n\n**Samle det hele igen**\n\n**Rediger → Centrer alle vinduer** henter alle åbne vinduer ind på midten af hovedvinduets skærm og glemmer undervejs dialogernes huskede forskydning. Det er udvejen, når et vindue ikke kan findes - fordi en monitor er trukket ud, for eksempel, eller opløsningen er ændret. Uafhængigt af det holder programmet ved åbning en husket placering op mod de skærme, der faktisk er tilsluttet i dag; peger den ud i ingenting, dukker vinduet op centreret på en eksisterende skærm.
help.windowsText.sv=Programmet minns var dess fönster står - **vart och ett för sig**. Huvudfönstret, dekoderregistreringsfönstret, fönstret för att redigera ett fordons konfiguration och mallöversikten har var sitt minne för storlek och läge. Nästa gång dyker fönstret upp där du lämnade det.\nSeparata minnen är avsiktliga: den som registrerar en mall vill oftast ha fönstret någon annanstans än när ett enskilt fordons konfiguration ska putsas till.\n\n**Flera skärmar**\n\n- **Inställningar → Vy → Skärm** avgör var nyöppnade fönster visas. Förval är **som senast**: varje fönster återvänder till sin ihågkomna plats, och extrafönster går dit där det fönster står som de anropades från. Alternativt går det att välja en fast skärm - lämpligt om programmet alltid ska starta på samma bildskärm. Med bara en ansluten skärm är valet avstängt.\n- **Dialogrutor visas över huvudfönstret.** Tidigare hamnade de ibland på systemets primära skärm, alltså möjligen på en helt annan bildskärm än programmet - man letade efter dialogrutan medan fönstret väntade på svar.\n\n**Förflyttning kommas ihåg**\n\nSkjuter du undan en dialogruta dyker nästa upp på samma ställe. Det som kommas ihåg är **avståndet till huvudfönstrets mitt**, inte ett fast skärmläge: dialogrutor är olika stora, och huvudfönstret kan under tiden stå på en annan bildskärm. Ett ihågkommet absolut läge pekade ut i tomma intet efter en sådan flytt.\n\n**Samla in allt igen**\n\n**Redigera → Centrera alla fönster** hämtar in samtliga öppna fönster mitt på huvudfönstrets skärm och glömmer på köpet dialogrutornas ihågkomna förskjutning. Det är utvägen när ett fönster inte går att hitta - för att en bildskärm kopplats ur, till exempel, eller upplösningen ändrats. Oberoende av det stämmer programmet vid öppning av ett ihågkommet läge mot de skärmar som faktiskt är anslutna i dag; pekar det ut i tomma intet visas fönstret centrerat på en befintlig skärm.


