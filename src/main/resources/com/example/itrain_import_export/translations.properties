help.helpMenuText.de=**Hilfe** zeigt diesen Text.\n**Handbuch** öffnet die Proton-Drive-Freigabe im Browser, in der das ausführliche Handbuch als PDF bereitliegt.\n**Update** prüft manuell auf neue Programmversionen (siehe Abschnitt "Update" unten).\n**Über** zeigt Programmname, Autor und die aktuelle Versions-/Build-Nummer. Dort steht auch, welche freien Komponenten Dritter das Programm verwendet; **Lizenzhinweise...** zeigt deren vollständige Lizenzbedingungen.
help.helpMenuText.en=**Help** shows this text.\n**Manual** opens the Proton Drive share in the browser, where the detailed manual is available as a PDF.\n**Update** checks manually for new program versions (see the "Update" section below).\n**About** shows the program name, the author and the current version/build number. It also states which free third-party components the program uses; **Licence notices...** shows their full licence terms.
help.helpMenuText.nl=**Help** toont deze tekst.\n**Handboek** opent de Proton Drive-map in de browser, waar het uitgebreide handboek als PDF klaarstaat.\n**Update** controleert handmatig op nieuwe programmaversies (zie het hoofdstuk "Update" hieronder).\n**Over** toont de programmanaam, de auteur en het huidige versie-/buildnummer. Daar staat ook welke vrije componenten van derden het programma gebruikt; **Licentievermeldingen...** toont de volledige licentievoorwaarden.
help.helpMenuText.fr=**Aide** affiche ce texte.\n**Manuel** ouvre le partage Proton Drive dans le navigateur, où le manuel détaillé est disponible en PDF.\n**Mise à jour** recherche manuellement de nouvelles versions du programme (voir la section "Mise à jour" ci-dessous).\n**À propos** affiche le nom du programme, l'auteur ainsi que le numéro de version/de build actuel. On y trouve aussi les composants libres de tiers utilisés par le programme ; **Mentions de licence...** affiche leurs conditions de licence complètes.
help.helpMenuText.es=**Ayuda** muestra este texto.\n**Manual** abre el recurso compartido de Proton Drive en el navegador, donde el manual detallado está disponible en PDF.\n**Actualización** comprueba manualmente si hay nuevas versiones del programa (véase el apartado "Actualización" más abajo).\n**Acerca de** muestra el nombre del programa, el autor y el número de versión/compilación actual. Allí también se indica qué componentes libres de terceros utiliza el programa; **Avisos de licencia...** muestra sus condiciones de licencia completas.
help.helpMenuText.it=**Guida** mostra questo testo.\n**Manuale** apre la condivisione Proton Drive nel browser, dove il manuale dettagliato è disponibile in PDF.\n**Aggiornamento** verifica manualmente la presenza di nuove versioni del programma (vedi la sezione "Aggiornamento" più sotto).\n**Informazioni** mostra il nome del programma, l'autore e il numero di versione/build attuale. Lì è indicato anche quali componenti liberi di terzi utilizza il programma; **Note di licenza...** mostra le relative condizioni di licenza complete.
help.helpMenuText.pt=**Ajuda** mostra este texto.\n**Manual** abre a partilha do Proton Drive no navegador, onde o manual detalhado está disponível em PDF.\n**Atualização** verifica manualmente se existem novas versões do programa (ver a secção "Atualização" mais abaixo).\n**Sobre** mostra o nome do programa, o autor e o número de versão/compilação atual. Aí consta também que componentes livres de terceiros o programa utiliza; **Avisos de licença...** mostra as respetivas condições de licença completas.
help.helpMenuText.pl=**Pomoc** wyświetla ten tekst.\n**Podręcznik** otwiera udostępnienie Proton Drive w przeglądarce, gdzie obszerny podręcznik jest dostępny jako PDF.\n**Aktualizacja** ręcznie sprawdza dostępność nowych wersji programu (patrz rozdział "Aktualizacja" poniżej).\n**O programie** pokazuje nazwę programu, autora oraz aktualny numer wersji/kompilacji. Znajduje się tam także informacja, jakich wolnych komponentów innych podmiotów używa program; **Informacje licencyjne...** pokazują ich pełne warunki licencyjne.
help.helpMenuText.da=**Hjælp** viser denne tekst.\n**Håndbog** åbner Proton Drive-delingen i browseren, hvor den udførlige håndbog ligger klar som PDF.\n**Opdatering** søger manuelt efter nye programversioner (se afsnittet "Opdatering" nedenfor).\n**Om** viser programnavn, forfatter og det aktuelle versions-/buildnummer. Der står også, hvilke frie tredjepartskomponenter programmet anvender; **Licensoplysninger...** viser deres fuldstændige licensbetingelser.
help.helpMenuText.sv=**Hjälp** visar den här texten.\n**Handbok** öppnar Proton Drive-delningen i webbläsaren, där den utförliga handboken finns som PDF.\n**Uppdatering** söker manuellt efter nya programversioner (se avsnittet "Uppdatering" nedan).\n**Om** visar programnamn, upphovsman samt aktuellt versions-/buildnummer. Där anges också vilka fria tredjepartskomponenter programmet använder; **Licensinformation...** visar deras fullständiga licensvillkor.

