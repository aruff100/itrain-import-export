mail.prepared.de=Die Vorlage wurde gespeichert und Ihr E-Mail-Programm geöffnet.\n\nDie Datei "{0}" muss noch angehängt werden - ihr Pfad liegt bereits in der Zwischenablage, der Ordner wurde geöffnet:\n{1}\n\n(Ein automatisches Anhängen ist über das E-Mail-Verfahren "mailto" technisch nicht möglich.)
mail.prepared.en=The template was saved and your e-mail program has been opened.\n\nThe file "{0}" still needs to be attached - its path is already in the clipboard and the folder has been opened:\n{1}\n\n(Automatic attaching is technically not possible via the "mailto" e-mail method.)
mail.prepared.nl=Het sjabloon is opgeslagen en uw e-mailprogramma is geopend.\n\nHet bestand "{0}" moet nog worden bijgevoegd - het pad staat al op het klembord en de map is geopend:\n{1}\n\n(Automatisch bijvoegen is via de e-mailmethode "mailto" technisch niet mogelijk.)
mail.prepared.fr=Le modèle a été enregistré et votre programme de messagerie a été ouvert.\n\nLe fichier « {0} » doit encore être joint - son chemin se trouve déjà dans le presse-papiers et le dossier a été ouvert :\n{1}\n\n(L'ajout automatique d'une pièce jointe n'est techniquement pas possible avec le procédé « mailto ».)
mail.prepared.es=La plantilla se guardó y se abrió su programa de correo.\n\nEl archivo «{0}» aún debe adjuntarse: su ruta ya está en el portapapeles y se abrió la carpeta:\n{1}\n\n(Adjuntar automáticamente no es técnicamente posible con el método de correo «mailto».)
