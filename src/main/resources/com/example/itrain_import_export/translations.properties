editor.decoderProtocolBlocked.de=Das Fahrzeug "{0}" verwendet das Digital-Protokoll "{1}".\n\nDieses Protokoll kennt keine CV-Konfiguration - eine Decoder-Vorlage lässt sich hier nicht einlesen.
editor.decoderProtocolBlocked.en=The vehicle "{0}" uses the digital protocol "{1}".\n\nThis protocol has no CV configuration - a decoder template cannot be loaded here.
editor.decoderProtocolBlocked.nl=Het voertuig "{0}" gebruikt het digitale protocol "{1}".\n\nDit protocol kent geen CV-configuratie - een decodersjabloon kan hier niet worden ingelezen.
editor.decoderProtocolBlocked.fr=Le véhicule "{0}" utilise le protocole numérique "{1}".\n\nCe protocole ne connaît pas de configuration CV - un modèle de décodeur ne peut pas être chargé ici.
editor.decoderProtocolBlocked.es=El vehículo "{0}" utiliza el protocolo digital "{1}".\n\nEste protocolo no tiene configuración de CV: aquí no se puede cargar una plantilla de decoder.
editor.decoderProtocolBlocked.it=Il veicolo "{0}" utilizza il protocollo digitale "{1}".\n\nQuesto protocollo non prevede una configurazione CV: qui non è possibile caricare un modello di decoder.
editor.decoderProtocolBlocked.pt=O veículo "{0}" utiliza o protocolo digital "{1}".\n\nEste protocolo não possui configuração de CV - não é possível carregar aqui um modelo de descodificador.
editor.decoderProtocolBlocked.pl=Pojazd "{0}" używa protokołu cyfrowego "{1}".\n\nTen protokół nie obsługuje konfiguracji CV - nie można tu wczytać szablonu dekodera.
editor.decoderProtocolBlocked.da=Køretøjet "{0}" bruger den digitale protokol "{1}".\n\nDenne protokol har ingen CV-konfiguration - en dekodershablon kan ikke indlæses her.
editor.decoderProtocolBlocked.sv=Fordonet "{0}" använder det digitala protokollet "{1}".\n\nDetta protokoll har ingen CV-konfiguration - en avkodarmall kan inte läsas in här.

editor.decoderProtocolLimited.de=Das Protokoll "{0}" nimmt höchstens {3} Konfigurationswerte auf.\n\nDie Vorlage "{1}" enthält {2} Einträge. Übernommen werden nur die ersten {3}, alle weiteren werden verworfen.\n\nFortfahren?
editor.decoderProtocolLimited.en=The protocol "{0}" holds at most {3} configuration values.\n\nThe template "{1}" contains {2} entries. Only the first {3} will be applied; all further ones are discarded.\n\nContinue?
editor.decoderProtocolLimited.nl=Het protocol "{0}" bevat hoogstens {3} configuratiewaarden.\n\nHet sjabloon "{1}" bevat {2} items. Alleen de eerste {3} worden overgenomen, alle overige vervallen.\n\nDoorgaan?
editor.decoderProtocolLimited.fr=Le protocole "{0}" accepte au maximum {3} valeurs de configuration.\n\nLe modèle "{1}" contient {2} entrées. Seules les {3} premières seront reprises, toutes les autres sont abandonnées.\n\nContinuer ?
editor.decoderProtocolLimited.es=El protocolo "{0}" admite como máximo {3} valores de configuración.\n\nLa plantilla "{1}" contiene {2} entradas. Solo se aplicarán las primeras {3}; las demás se descartan.\n\n¿Continuar?
editor.decoderProtocolLimited.it=Il protocollo "{0}" accetta al massimo {3} valori di configurazione.\n\nIl modello "{1}" contiene {2} voci. Verranno applicate solo le prime {3}, tutte le altre vengono scartate.\n\nContinuare?
editor.decoderProtocolLimited.pt=O protocolo "{0}" aceita no máximo {3} valores de configuração.\n\nO modelo "{1}" contém {2} entradas. Apenas as primeiras {3} serão aplicadas; todas as restantes são descartadas.\n\nContinuar?
editor.decoderProtocolLimited.pl=Protokół "{0}" przyjmuje najwyżej {3} wartości konfiguracyjnych.\n\nSzablon "{1}" zawiera {2} wpisów. Przejęte zostanie tylko pierwsze {3}, pozostałe zostaną odrzucone.\n\nKontynuować?
editor.decoderProtocolLimited.da=Protokollen "{0}" rummer højst {3} konfigurationsværdier.\n\nShablonen "{1}" indeholder {2} poster. Kun de første {3} overtages, alle øvrige kasseres.\n\nFortsæt?
editor.decoderProtocolLimited.sv=Protokollet "{0}" rymmer högst {3} konfigurationsvärden.\n\nMallen "{1}" innehåller {2} poster. Endast de första {3} tas över, alla övriga förkastas.\n\nFortsätta?

