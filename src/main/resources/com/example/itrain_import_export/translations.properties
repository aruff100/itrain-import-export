help.selectionText.de=- Ein einfacher Mausklick auf eine Zeile wählt genau diese eine Zeile aus (alle anderen werden abgewählt).\n- Mausklick zusammen mit **Strg** (Windows/Linux) bzw. **Cmd** (macOS) fügt eine einzelne weitere Zeile zur bestehenden Auswahl hinzu bzw. entfernt eine bereits ausgewählte Zeile wieder daraus - so lassen sich beliebige, nicht zusammenhängende Zeilen kombinieren.\n- Mausklick zusammen mit **Umschalt/Shift** wählt den kompletten Bereich zwischen der zuletzt angeklickten und der neu angeklickten Zeile aus.\n\n**Diese Mehrfachauswahl ist die Grundlage für "Markierte exportieren" sowie für das Löschen mehrerer Einträge auf einmal.**
help.selectionText.en=- A single mouse click on a row selects exactly that one row (all others are deselected).\n- A mouse click together with **Ctrl** (Windows/Linux) or **Cmd** (macOS) adds one further row to the existing selection, or removes a row that was already selected - this way any combination of non-adjacent rows can be built.\n- A mouse click together with **Shift** selects the whole range between the row clicked last and the row clicked now.\n\n**This multiple selection is the basis for "Export Selected" as well as for deleting several entries at once.**
help.selectionText.nl=- Een enkele muisklik op een rij selecteert precies die ene rij (alle andere worden gedeselecteerd).\n- Een muisklik samen met **Ctrl** (Windows/Linux) resp. **Cmd** (macOS) voegt één extra rij aan de bestaande selectie toe of haalt een al geselecteerde rij er weer uit - zo zijn willekeurige, niet-aaneengesloten rijen te combineren.\n- Een muisklik samen met **Shift** selecteert het volledige bereik tussen de laatst aangeklikte en de nu aangeklikte rij.\n\n**Deze meervoudige selectie is de basis voor "Selectie exporteren" en voor het verwijderen van meerdere items tegelijk.**
help.selectionText.fr=- Un simple clic de souris sur une ligne sélectionne exactement cette ligne (toutes les autres sont désélectionnées).\n- Un clic de souris combiné à **Ctrl** (Windows/Linux) ou **Cmd** (macOS) ajoute une ligne supplémentaire à la sélection existante ou retire une ligne déjà sélectionnée - on peut ainsi combiner des lignes quelconques, non contiguës.\n- Un clic de souris combiné à **Maj/Shift** sélectionne toute la plage entre la dernière ligne cliquée et la ligne cliquée maintenant.\n\n**Cette sélection multiple est la base de "Exporter la sélection" ainsi que de la suppression de plusieurs entrées à la fois.**
help.selectionText.es=- Un clic simple del ratón sobre una fila selecciona exactamente esa fila (todas las demás se deseleccionan).\n- Un clic del ratón junto con **Ctrl** (Windows/Linux) o **Cmd** (macOS) añade una fila más a la selección existente o retira una fila ya seleccionada - así pueden combinarse filas cualesquiera, no contiguas.\n- Un clic del ratón junto con **Mayús/Shift** selecciona todo el rango entre la última fila pulsada y la fila pulsada ahora.\n\n**Esta selección múltiple es la base de "Exportar selección" y también de la eliminación de varias entradas a la vez.**
help.selectionText.it=- Un semplice clic del mouse su una riga seleziona esattamente quella riga (tutte le altre vengono deselezionate).\n- Un clic del mouse insieme a **Ctrl** (Windows/Linux) o **Cmd** (macOS) aggiunge una singola riga alla selezione esistente oppure rimuove una riga già selezionata - così è possibile combinare righe qualsiasi, anche non contigue.\n- Un clic del mouse insieme a **Maiusc/Shift** seleziona l'intero intervallo tra l'ultima riga cliccata e quella appena cliccata.\n\n**Questa selezione multipla è la base per "Esporta selezionati" e per l'eliminazione di più voci contemporaneamente.**
help.selectionText.pt=- Um simples clique do rato sobre uma linha seleciona exatamente essa linha (todas as outras são desmarcadas).\n- Um clique do rato em conjunto com **Ctrl** (Windows/Linux) ou **Cmd** (macOS) acrescenta mais uma linha à seleção existente ou retira dela uma linha já selecionada - assim é possível combinar quaisquer linhas, mesmo não contíguas.\n- Um clique do rato em conjunto com **Shift** seleciona todo o intervalo entre a linha clicada por último e a linha agora clicada.\n\n**Esta seleção múltipla é a base de "Exportar Selecionados" e também da eliminação de várias entradas de uma só vez.**
help.selectionText.pl=- Zwykłe kliknięcie myszą w wiersz zaznacza dokładnie ten jeden wiersz (wszystkie pozostałe zostają odznaczone).\n- Kliknięcie myszą z klawiszem **Ctrl** (Windows/Linux) lub **Cmd** (macOS) dodaje pojedynczy kolejny wiersz do istniejącego zaznaczenia albo usuwa z niego wiersz już zaznaczony - w ten sposób można łączyć dowolne, nieprzylegające do siebie wiersze.\n- Kliknięcie myszą z klawiszem **Shift** zaznacza cały zakres pomiędzy ostatnio klikniętym a właśnie klikniętym wierszem.\n\n**To wielokrotne zaznaczenie jest podstawą funkcji "Eksportuj Zaznaczone" oraz usuwania kilku wpisów naraz.**
help.selectionText.da=- Et enkelt museklik på en række markerer præcis den ene række (alle andre fravælges).\n- Museklik sammen med **Ctrl** (Windows/Linux) hhv. **Cmd** (macOS) føjer en enkelt yderligere række til den eksisterende markering eller fjerner en allerede markeret række igen - på den måde kan vilkårlige, ikke sammenhængende rækker kombineres.\n- Museklik sammen med **Skift/Shift** markerer hele området mellem den senest klikkede og den netop klikkede række.\n\n**Denne flervalgsmarkering er grundlaget for "Eksportér Markerede" samt for at slette flere poster på én gang.**
help.selectionText.sv=- Ett enkelt musklick på en rad markerar exakt den raden (alla andra avmarkeras).\n- Musklick tillsammans med **Ctrl** (Windows/Linux) respektive **Cmd** (macOS) lägger till ytterligare en enskild rad till den befintliga markeringen eller tar bort en redan markerad rad ur den - på så sätt kan godtyckliga, icke sammanhängande rader kombineras.\n- Musklick tillsammans med **Skift/Shift** markerar hela området mellan den senast klickade och den nu klickade raden.\n\n**Denna flermarkering är grunden för "Exportera Markerade" samt för att ta bort flera poster på en gång.**

