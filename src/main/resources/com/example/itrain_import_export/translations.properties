editor.renameReferencesQuestion.de=Auf "{1}" wird an {0} Stellen verwiesen. Sollen diese Verweise auf "{2}" mit umbenannt werden?\n\nOhne Umbenennen zeigen die Verweise ins Leere und iTrain kann die Datei danach möglicherweise nicht mehr öffnen.
editor.renameReferencesQuestion.en="{1}" is referenced in {0} places. Should those references be renamed to "{2}" as well?\n\nWithout renaming them the references point to nothing and iTrain may no longer be able to open the file.
editor.renameReferencesQuestion.nl=Naar "{1}" wordt op {0} plaatsen verwezen. Moeten die verwijzingen mee worden hernoemd naar "{2}"?\n\nZonder hernoemen wijzen de verwijzingen nergens naar en kan iTrain het bestand daarna mogelijk niet meer openen.
editor.renameReferencesQuestion.fr="{1}" est référencé à {0} endroits. Ces références doivent-elles également être renommées en "{2}" ?\n\nSans les renommer, elles ne pointent plus sur rien et iTrain risque de ne plus pouvoir ouvrir le fichier.
editor.renameReferencesQuestion.es=Se hace referencia a "{1}" en {0} lugares. ¿Deben renombrarse también esas referencias a "{2}"?\n\nSin renombrarlas, las referencias no apuntan a nada e iTrain podría no poder abrir el archivo después.
editor.renameReferencesQuestion.it="{1}" è referenziato in {0} punti. Rinominare anche questi riferimenti in "{2}"?\n\nSenza rinominarli i riferimenti puntano nel vuoto e iTrain potrebbe non riuscire più ad aprire il file.
editor.renameReferencesQuestion.pt="{1}" é referenciado em {0} locais. Estas referências devem ser igualmente renomeadas para "{2}"?\n\nSem as renomear, as referências deixam de apontar para algo e o iTrain poderá deixar de conseguir abrir o ficheiro.
editor.renameReferencesQuestion.pl=Do "{1}" istnieje {0} odwołań. Czy zmienić także te odwołania na "{2}"?\n\nBez zmiany odwołania będą prowadzić donikąd i iTrain może nie być w stanie otworzyć pliku.
editor.renameReferencesQuestion.da=Der henvises til "{1}" {0} steder. Skal disse henvisninger også omdøbes til "{2}"?\n\nUden omdøbning peger henvisningerne ud i ingenting, og iTrain kan muligvis ikke længere åbne filen.
editor.renameReferencesQuestion.sv="{1}" refereras på {0} ställen. Ska dessa referenser också byta namn till "{2}"?\n\nUtan namnbyte pekar referenserna på ingenting och iTrain kanske inte längre kan öppna filen.

