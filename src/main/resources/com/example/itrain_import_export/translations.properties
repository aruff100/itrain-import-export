decoder.versionSame.de=Dieses Archiv enthält dieselbe Fassung der Vorlagen, die bereits installiert ist (Version {0}).\n\nErneut installieren? Gleichnamige Vorlagen werden dabei überschrieben - eigene Änderungen daran gehen verloren.
decoder.versionSame.en=This archive contains the same set of templates that is already installed (version {0}).\n\nInstall again? Templates with the same name will be overwritten - your own changes to them will be lost.
decoder.versionSame.nl=Dit archief bevat dezelfde versie van de sjablonen die al is geïnstalleerd (versie {0}).\n\nOpnieuw installeren? Gelijknamige sjablonen worden daarbij overschreven - eigen wijzigingen daarin gaan verloren.
decoder.versionSame.fr=Cette archive contient la même version des modèles que celle déjà installée (version {0}).\n\nInstaller à nouveau ? Les modèles de même nom seront écrasés - vos modifications y seront perdues.
decoder.versionSame.es=Este archivo contiene la misma versión de las plantillas que ya está instalada (versión {0}).\n\n¿Instalar de nuevo? Las plantillas con el mismo nombre se sobrescribirán y se perderán los cambios propios.
decoder.versionSame.it=Questo archivio contiene la stessa versione dei modelli già installata (versione {0}).\n\nInstallare di nuovo? I modelli con lo stesso nome verranno sovrascritti e le modifiche personali andranno perse.
decoder.versionSame.pt=Este arquivo contém a mesma versão dos modelos que já está instalada (versão {0}).\n\nInstalar de novo? Os modelos com o mesmo nome serão substituídos e as suas alterações perder-se-ão.
decoder.versionSame.pl=To archiwum zawiera tę samą wersję szablonów, która jest już zainstalowana (wersja {0}).\n\nZainstalować ponownie? Szablony o tych samych nazwach zostaną nadpisane, a własne zmiany w nich przepadną.
decoder.versionSame.da=Dette arkiv indeholder den samme udgave af skabelonerne, som allerede er installeret (version {0}).\n\nInstaller igen? Skabeloner med samme navn overskrives - dine egne ændringer i dem går tabt.
decoder.versionSame.sv=Det här arkivet innehåller samma version av mallarna som redan är installerad (version {0}).\n\nInstallera igen? Mallar med samma namn skrivs över - dina egna ändringar i dem går förlorade.

decoder.versionOlder.de=Dieses Archiv ist ÄLTER als das bereits installierte: Archiv Version {0}, installiert ist Version {1}.\n\nBeim Installieren werden gleichnamige Vorlagen durch die älteren ersetzt.
decoder.versionOlder.en=This archive is OLDER than the one already installed: archive version {0}, installed is version {1}.\n\nInstalling will replace templates of the same name with the older ones.
decoder.versionOlder.nl=Dit archief is OUDER dan het reeds geïnstalleerde: archief versie {0}, geïnstalleerd is versie {1}.\n\nBij het installeren worden gelijknamige sjablonen door de oudere vervangen.
decoder.versionOlder.fr=Cette archive est PLUS ANCIENNE que celle déjà installée : archive version {0}, version installée {1}.\n\nL'installation remplacera les modèles de même nom par les plus anciens.
decoder.versionOlder.es=Este archivo es MÁS ANTIGUO que el ya instalado: versión del archivo {0}, instalada está la versión {1}.\n\nAl instalar, las plantillas con el mismo nombre se sustituirán por las más antiguas.
decoder.versionOlder.it=Questo archivio è PIÙ VECCHIO di quello già installato: archivio versione {0}, installata è la versione {1}.\n\nInstallando, i modelli con lo stesso nome verranno sostituiti da quelli più vecchi.
decoder.versionOlder.pt=Este arquivo é MAIS ANTIGO do que o já instalado: arquivo versão {0}, instalada está a versão {1}.\n\nAo instalar, os modelos com o mesmo nome serão substituídos pelos mais antigos.
decoder.versionOlder.pl=To archiwum jest STARSZE niż już zainstalowane: wersja archiwum {0}, zainstalowana jest wersja {1}.\n\nPodczas instalacji szablony o tych samych nazwach zostaną zastąpione starszymi.
decoder.versionOlder.da=Dette arkiv er ÆLDRE end det allerede installerede: arkivets version {0}, installeret er version {1}.\n\nVed installation erstattes skabeloner med samme navn af de ældre.
decoder.versionOlder.sv=Det här arkivet är ÄLDRE än det redan installerade: arkivets version {0}, installerad är version {1}.\n\nVid installation ersätts mallar med samma namn av de äldre.

decoder.versionUnknown.de=Dieses Archiv enthält keine Versionsangabe; installiert ist derzeit Version {0}.\n\nOb es neuer oder älter ist, lässt sich deshalb nicht feststellen. Beim Installieren werden gleichnamige Vorlagen ersetzt.
decoder.versionUnknown.en=This archive contains no version information; version {0} is currently installed.\n\nWhether it is newer or older therefore cannot be determined. Installing will replace templates of the same name.
decoder.versionUnknown.nl=Dit archief bevat geen versieaanduiding; momenteel is versie {0} geïnstalleerd.\n\nOf het nieuwer of ouder is, valt daardoor niet vast te stellen. Bij het installeren worden gelijknamige sjablonen vervangen.
decoder.versionUnknown.fr=Cette archive ne contient aucune indication de version ; la version {0} est actuellement installée.\n\nImpossible donc de savoir si elle est plus récente ou plus ancienne. L'installation remplacera les modèles de même nom.
decoder.versionUnknown.es=Este archivo no contiene indicación de versión; actualmente está instalada la versión {0}.\n\nPor tanto no se puede determinar si es más nueva o más antigua. Al instalar se sustituirán las plantillas con el mismo nombre.
decoder.versionUnknown.it=Questo archivio non contiene alcuna indicazione di versione; attualmente è installata la versione {0}.\n\nNon è quindi possibile stabilire se sia più recente o più vecchio. Installando, i modelli con lo stesso nome verranno sostituiti.
decoder.versionUnknown.pt=Este arquivo não contém indicação de versão; está atualmente instalada a versão {0}.\n\nPor isso não é possível determinar se é mais recente ou mais antigo. Ao instalar, os modelos com o mesmo nome serão substituídos.
decoder.versionUnknown.pl=To archiwum nie zawiera informacji o wersji; obecnie zainstalowana jest wersja {0}.\n\nNie da się więc ustalić, czy jest nowsze, czy starsze. Podczas instalacji szablony o tych samych nazwach zostaną zastąpione.
decoder.versionUnknown.da=Dette arkiv indeholder ingen versionsangivelse; i øjeblikket er version {0} installeret.\n\nDerfor kan det ikke afgøres, om det er nyere eller ældre. Ved installation erstattes skabeloner med samme navn.
decoder.versionUnknown.sv=Det här arkivet innehåller ingen versionsuppgift; för närvarande är version {0} installerad.\n\nDärför går det inte att avgöra om det är nyare eller äldre. Vid installation ersätts mallar med samma namn.

decoder.editHint.de=Öffnet die markierte Vorlage im großen Fenster - dort lassen sich die CV-Werte ansehen und ändern. "Speichern" schreibt sie zurück, "Speichern als..." legt unter neuem Namen eine zusätzliche Vorlage an. Ein Doppelklick auf die Zeile bewirkt dasselbe.
decoder.editHint.en=Opens the selected template in the large window - there the CV values can be viewed and changed. "Save" writes them back, "Save as..." creates an additional template under a new name. A double-click on the row does the same.
decoder.editHint.nl=Opent het geselecteerde sjabloon in het grote venster - daar kunt u de CV-waarden bekijken en wijzigen. "Opslaan" schrijft ze terug, "Opslaan als..." maakt onder een nieuwe naam een extra sjabloon aan. Dubbelklikken op de regel doet hetzelfde.
decoder.editHint.fr=Ouvre le modèle sélectionné dans la grande fenêtre - vous pouvez y consulter et modifier les valeurs CV. « Enregistrer » les réécrit, « Enregistrer sous... » crée un modèle supplémentaire sous un nouveau nom. Un double-clic sur la ligne fait de même.
decoder.editHint.es=Abre la plantilla marcada en la ventana grande: allí se pueden ver y cambiar los valores CV. «Guardar» los reescribe, «Guardar como...» crea una plantilla adicional con un nombre nuevo. Un doble clic en la fila hace lo mismo.
decoder.editHint.it=Apre il modello selezionato nella finestra grande: lì i valori CV si possono vedere e modificare. «Salva» li riscrive, «Salva con nome...» crea un modello aggiuntivo con un nuovo nome. Un doppio clic sulla riga fa lo stesso.
decoder.editHint.pt=Abre o modelo marcado na janela grande - aí é possível ver e alterar os valores CV. "Guardar" volta a escrevê-los, "Guardar como..." cria um modelo adicional com um novo nome. Um duplo clique na linha faz o mesmo.
decoder.editHint.pl=Otwiera zaznaczony szablon w dużym oknie - można tam obejrzeć i zmienić wartości CV. „Zapisz” zapisuje je z powrotem, „Zapisz jako...” tworzy dodatkowy szablon pod nową nazwą. Podwójne kliknięcie wiersza działa tak samo.
decoder.editHint.da=Åbner den markerede skabelon i det store vindue - dér kan CV-værdierne ses og ændres. "Gem" skriver dem tilbage, "Gem som..." opretter en ekstra skabelon under et nyt navn. Et dobbeltklik på rækken gør det samme.
decoder.editHint.sv=Öppnar den markerade mallen i det stora fönstret - där kan CV-värdena visas och ändras. "Spara" skriver tillbaka dem, "Spara som..." skapar en extra mall under ett nytt namn. Ett dubbelklick på raden gör detsamma.

