capture.importTemplateHint.de=Übernimmt die CV-Liste einer Decoder-Vorlage in diese Tabelle - mit Typ und Bezeichnung. Bei CV-Nummern, die hier schon stehen, können Sie wählen, ob Ihre eigenen Werte erhalten bleiben.
capture.importTemplateHint.en=Takes the CV list of a decoder template into this table - with type and name. For CV numbers already present here you can choose whether your own values are kept.
capture.importTemplateHint.nl=Neemt de CV-lijst van een decodersjabloon over in deze tabel - met type en naam. Bij CV-nummers die hier al staan kunt u kiezen of uw eigen waarden behouden blijven.
capture.importTemplateHint.fr=Reprend la liste CV d'un modèle de décodeur dans ce tableau - avec type et nom. Pour les numéros de CV déjà présents, vous pouvez choisir de conserver vos propres valeurs.
capture.importTemplateHint.es=Toma la lista CV de una plantilla de decoder en esta tabla, con tipo y nombre. Para los números de CV ya presentes puede elegir si se conservan sus propios valores.
capture.importTemplateHint.it=Riprende in questa tabella l'elenco CV di un modello di decoder - con tipo e nome. Per i numeri CV già presenti puoi scegliere se mantenere i tuoi valori.
capture.importTemplateHint.pt=Traz a lista CV de um modelo de descodificador para esta tabela - com tipo e nome. Para os números CV já presentes pode escolher se os seus valores são mantidos.
capture.importTemplateHint.pl=Przenosi listę CV z szablonu dekodera do tej tabeli - wraz z typem i nazwą. Przy numerach CV, które już tu są, można wybrać, czy zachować własne wartości.
capture.importTemplateHint.da=Henter CV-listen fra en dekoderskabelon ind i denne tabel - med type og navn. Ved CV-numre, der allerede står her, kan du vælge, om dine egne værdier bevares.
capture.importTemplateHint.sv=Hämtar CV-listan från en dekodermall till den här tabellen - med typ och namn. För CV-nummer som redan finns här kan du välja om dina egna värden behålls.

capture.importQuestion.de=Die Vorlage "{0}" enthält {1} CV-Einträge. Davon stehen {2} bereits in dieser Tabelle.\n\nWerte behalten: Ihre Werte bleiben, Typ und Bezeichnung kommen aus der Vorlage.\n\nWerte überschreiben: auch die Werte stammen danach aus der Vorlage.
capture.importQuestion.en=The template "{0}" contains {1} CV entries, {2} of which are already in this table.\n\nKeep values: your values remain, type and name come from the template.\n\nReplace values: the values will come from the template as well.
capture.importQuestion.nl=Het sjabloon "{0}" bevat {1} CV-items, waarvan er {2} al in deze tabel staan.\n\nWaarden behouden: uw waarden blijven, type en naam komen uit het sjabloon.\n\nWaarden overschrijven: ook de waarden komen daarna uit het sjabloon.
capture.importQuestion.fr=Le modèle « {0} » contient {1} entrées CV, dont {2} figurent déjà dans ce tableau.\n\nConserver les valeurs : vos valeurs restent, le type et le nom viennent du modèle.\n\nRemplacer les valeurs : les valeurs proviendront elles aussi du modèle.
capture.importQuestion.es=La plantilla «{0}» contiene {1} entradas CV, de las cuales {2} ya están en esta tabla.\n\nConservar valores: sus valores permanecen; el tipo y el nombre vienen de la plantilla.\n\nSustituir valores: también los valores procederán de la plantilla.
capture.importQuestion.it=Il modello «{0}» contiene {1} voci CV, di cui {2} già presenti in questa tabella.\n\nMantieni i valori: i tuoi valori restano, tipo e nome vengono dal modello.\n\nSostituisci i valori: anche i valori proverranno dal modello.
capture.importQuestion.pt=O modelo "{0}" contém {1} entradas CV, das quais {2} já estão nesta tabela.\n\nManter valores: os seus valores permanecem; o tipo e o nome vêm do modelo.\n\nSubstituir valores: também os valores passarão a vir do modelo.
capture.importQuestion.pl=Szablon „{0}” zawiera {1} wpisów CV, z czego {2} są już w tej tabeli.\n\nZachowaj wartości: Twoje wartości pozostają, typ i nazwa pochodzą z szablonu.\n\nNadpisz wartości: również wartości będą pochodzić z szablonu.
capture.importQuestion.da=Skabelonen "{0}" indeholder {1} CV-poster, hvoraf {2} allerede står i denne tabel.\n\nBehold værdier: dine værdier bevares, type og navn kommer fra skabelonen.\n\nOverskriv værdier: også værdierne kommer derefter fra skabelonen.
capture.importQuestion.sv=Mallen "{0}" innehåller {1} CV-poster, varav {2} redan finns i den här tabellen.\n\nBehåll värden: dina värden är kvar, typ och namn kommer från mallen.\n\nErsätt värden: även värdena kommer då från mallen.

