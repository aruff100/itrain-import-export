capture.importResult.da={0} CV-poster tilføjet, {1} eksisterende suppleret ({2}).\n\nVed lukning overtages kun det, der er markeret under "Aktiv".
capture.importResult.sv={0} CV-poster tillagda, {1} befintliga kompletterade ({2}).\n\nVid stängning tas bara det över som är ikryssat under "Aktiv".

