help.introText.de=**iTrain Import/Export ist ein Werkzeug zum Betrachten und Bearbeiten von iTrain-Modellbahn-Steuerungsdateien (.tcd/.tcdz).**\nDer Hauptzweck ist der kategorienweise Import und Export einzelner Einträge zwischen bestehenden iTrain-Dateien - zum Beispiel um ein Gleisbild-Element, eine Aktion oder eine Lokomotive aus einer Datei in eine andere zu übernehmen.\nReferenzierte Einträge (z.B. die Rückmeldungen und Signale, die eine Aktion oder ein Gleisabschnitt verwendet) werden dabei automatisch erkannt und mit exportiert bzw. importiert, damit die Zieldatei in iTrain vollständig und ohne Fehlermeldung geöffnet werden kann.\n\nDer Export erfolgt als **.zip-Datei**, die genau eine .csv-Datei enthält. Der Grund für die Verpackung: Eine .csv lässt sich in vielen Foren und Mailprogrammen nicht anhängen, eine .zip schon. Die .csv darin ist zwar in einer Tabellenkalkulation sichtbar und bearbeitbar. Das ist aber, aufgrund der vielen Referenzen, fast unmöglich und sollte nur von sehr erfahrenen Anwendern benutzt werden.\n\nDer **richtige** Weg ist:\n- Datei öffnen\n- Datensätze markieren (siehe unten)\n- Exportieren\n- Andere Datei öffnen\n- Den Export wieder importieren\n\nDabei werden alle Referenzen mit exportiert und auch wieder importiert. Ältere Exporte als reine .csv-Datei lassen sich weiterhin importieren.\n\nAb der Version **2.0** kommt Decoder Bearbeitung und Decoder-Vorlagen dazu. Ab der Version **3.0 beta** ist das Programm in drei Programmteile gegliedert - siehe den nächsten Abschnitt.
help.introText.en=**iTrain Import/Export is a tool for viewing and editing iTrain model railway control files (.tcd/.tcdz).**\nIts main purpose is the category-by-category import and export of individual entries between existing iTrain files - for example to transfer a track diagram element, an action or a locomotive from one file into another.\nReferenced entries (e.g. the feedbacks and signals used by an action or a track section) are detected automatically and exported or imported along with it, so that the target file can be opened in iTrain completely and without an error message.\n\nThe export is written as a **.zip file** containing exactly one .csv file. The reason for the wrapping: many forums and mail programs won't let you attach a .csv, but a .zip is fine. The .csv inside is technically visible and editable in a spreadsheet program. However, because of the many references, that is almost impossible in practice and should only be attempted by very experienced users.\n\nThe **correct** way is:\n- Open the file\n- Select the records (see below)\n- Export\n- Open the other file\n- Import the export again\n\nAll references are exported and imported along with the selection this way. Older exports as a plain .csv file can still be imported.\n\nFrom version **2.0** onwards, decoder editing and decoder templates are added. From version **3.0 beta** onwards, the program is organized into three parts - see the next section.
help.introText.nl=**iTrain Import/Export is een hulpmiddel om iTrain-modelspoorbesturingsbestanden (.tcd/.tcdz) te bekijken en te bewerken.**\nHet hoofddoel is het per categorie importeren en exporteren van afzonderlijke items tussen bestaande iTrain-bestanden - bijvoorbeeld om een spoorplanelement, een actie of een locomotief uit het ene bestand in het andere over te nemen.\nItems waarnaar wordt verwezen (bijv. de terugmeldingen en seinen die een actie of een blok gebruikt) worden daarbij automatisch herkend en mee geëxporteerd respectievelijk geïmporteerd, zodat het doelbestand in iTrain volledig en zonder foutmelding geopend kan worden.\n\nDe export gebeurt als **.zip-bestand**, dat precies één .csv-bestand bevat. De reden voor deze verpakking: een .csv laat zich in veel forums en mailprogramma's niet bijvoegen, een .zip wel. De .csv daarin is weliswaar zichtbaar en bewerkbaar in een spreadsheetprogramma. Door de vele verwijzingen is dat echter vrijwel onmogelijk en zou het alleen door zeer ervaren gebruikers gedaan moeten worden.\n\nDe **juiste** werkwijze is:\n- Bestand openen\n- Records selecteren (zie hieronder)\n- Exporteren\n- Ander bestand openen\n- De export weer importeren\n\nDaarbij worden alle verwijzingen mee geëxporteerd en ook weer geïmporteerd. Oudere exports als los .csv-bestand kunnen nog steeds geïmporteerd worden.\n\nVanaf versie **2.0** komen decoderbewerking en decodersjablonen erbij. Vanaf versie **3.0 beta** is het programma in drie onderdelen ingedeeld - zie het volgende hoofdstuk.
help.introText.fr=**iTrain Import/Export est un outil permettant de consulter et de modifier les fichiers de commande de réseau ferroviaire miniature d'iTrain (.tcd/.tcdz).**\nSon but principal est l'import et l'export, catégorie par catégorie, d'entrées individuelles entre des fichiers iTrain existants - par exemple pour reprendre un élément du plan de voies, une action ou une locomotive d'un fichier dans un autre.\nLes entrées référencées (p. ex. les rétrosignalisations et les signaux utilisés par une action ou par un canton) sont détectées automatiquement et exportées puis importées avec elles, afin que le fichier cible puisse être ouvert dans iTrain de manière complète et sans message d'erreur.\n\nL'export se fait sous forme de **fichier .zip** contenant exactement un fichier .csv. La raison de cet emballage : de nombreux forums et logiciels de messagerie n'acceptent pas les pièces jointes .csv, mais acceptent les .zip. Le fichier .csv qu'il contient est certes consultable et modifiable dans un tableur. En raison du grand nombre de références, cela est toutefois quasiment impossible et ne devrait être tenté que par des utilisateurs très expérimentés.\n\nLa **bonne** manière de procéder est :\n- Ouvrir le fichier\n- Sélectionner les enregistrements (voir ci-dessous)\n- Exporter\n- Ouvrir l'autre fichier\n- Réimporter l'export\n\nToutes les références sont alors exportées puis réimportées avec la sélection. Les anciens exports sous forme de simple fichier .csv peuvent toujours être importés.\n\nÀ partir de la version **2.0** s'ajoutent la modification des décodeurs et les modèles de décodeur. À partir de la version **3.0 beta**, le programme est organisé en trois parties - voir la section suivante.
help.introText.es=**iTrain Import/Export es una herramienta para ver y editar archivos de control de maquetas de tren de iTrain (.tcd/.tcdz).**\nSu finalidad principal es la importación y exportación, categoría por categoría, de entradas individuales entre archivos iTrain existentes - por ejemplo, para llevar un elemento del esquema de vías, una acción o una locomotora de un archivo a otro.\nLas entradas referenciadas (p. ej. las retroseñalizaciones y las señales que utiliza una acción o un tramo de vía) se detectan automáticamente y se exportan e importan junto con ellas, de modo que el archivo de destino pueda abrirse en iTrain de forma completa y sin mensajes de error.\n\nLa exportación se realiza como **archivo .zip** que contiene exactamente un archivo .csv. El motivo de este empaquetado: muchos foros y programas de correo no permiten adjuntar un .csv, pero sí un .zip. El .csv que contiene puede verse y editarse en una hoja de cálculo. Sin embargo, debido a la gran cantidad de referencias, eso resulta casi imposible en la práctica y solo deberían intentarlo usuarios muy experimentados.\n\nLa forma **correcta** de proceder es:\n- Abrir el archivo\n- Marcar los registros (véase más abajo)\n- Exportar\n- Abrir el otro archivo\n- Volver a importar la exportación\n\nDe este modo todas las referencias se exportan y se vuelven a importar junto con la selección. Las exportaciones antiguas como simple archivo .csv se pueden seguir importando.\n\nA partir de la versión **2.0** se añaden la edición de decodificadores y las plantillas de decodificador. A partir de la versión **3.0 beta** el programa se organiza en tres partes - véase el siguiente apartado.
help.introText.it=**iTrain Import/Export è uno strumento per visualizzare e modificare i file di controllo per modellismo ferroviario di iTrain (.tcd/.tcdz).**\nLo scopo principale è l'importazione e l'esportazione, categoria per categoria, di singole voci tra file iTrain esistenti - ad esempio per trasferire un elemento dello schema dei binari, un'azione o una locomotiva da un file a un altro.\nLe voci referenziate (ad es. i sensori di retroazione e i segnali usati da un'azione o da una sezione di binario) vengono riconosciute automaticamente ed esportate e importate insieme ad esse, in modo che il file di destinazione possa essere aperto in iTrain in modo completo e senza messaggi di errore.\n\nL'esportazione avviene come **file .zip** che contiene esattamente un file .csv. Il motivo dell'imballaggio: molti forum e programmi di posta non permettono di allegare un .csv, ma un .zip sì. Il .csv al suo interno è comunque visualizzabile e modificabile in un foglio di calcolo. A causa dei numerosi riferimenti ciò è però quasi impossibile nella pratica e dovrebbe essere fatto solo da utenti molto esperti.\n\nIl modo **corretto** di procedere è:\n- Aprire il file\n- Selezionare i record (vedi sotto)\n- Esportare\n- Aprire l'altro file\n- Importare di nuovo l'esportazione\n\nIn questo modo tutti i riferimenti vengono esportati e anche reimportati insieme alla selezione. Le esportazioni più vecchie come semplice file .csv possono ancora essere importate.\n\nDalla versione **2.0** si aggiungono la modifica dei decoder e i modelli di decoder. Dalla versione **3.0 beta** il programma è organizzato in tre parti - vedi la sezione successiva.
help.introText.pt=**iTrain Import/Export é uma ferramenta para ver e editar ficheiros de comando de modelismo ferroviário do iTrain (.tcd/.tcdz).**\nO objetivo principal é a importação e exportação, categoria a categoria, de entradas individuais entre ficheiros iTrain existentes - por exemplo, para transferir um elemento do diagrama de via, uma ação ou uma locomotiva de um ficheiro para outro.\nAs entradas referenciadas (p. ex. as retrossinalizações e os sinais utilizados por uma ação ou por um troço de via) são reconhecidas automaticamente e exportadas e importadas em conjunto, para que o ficheiro de destino possa ser aberto no iTrain de forma completa e sem mensagens de erro.\n\nA exportação é feita como **ficheiro .zip** contendo exatamente um ficheiro .csv. O motivo deste empacotamento: muitos fóruns e programas de correio não permitem anexar um .csv, mas permitem um .zip. O .csv lá dentro pode ser visto e editado numa folha de cálculo. Devido à grande quantidade de referências, isso é, no entanto, quase impossível na prática e só deveria ser feito por utilizadores muito experientes.\n\nA forma **correta** de proceder é:\n- Abrir o ficheiro\n- Marcar os registos (ver abaixo)\n- Exportar\n- Abrir o outro ficheiro\n- Voltar a importar a exportação\n\nDeste modo, todas as referências são exportadas e novamente importadas junto com a seleção. Exportações mais antigas como simples ficheiro .csv ainda podem ser importadas.\n\nA partir da versão **2.0** juntam-se a edição de descodificadores e os modelos de descodificador. A partir da versão **3.0 beta** o programa está organizado em três partes - ver a secção seguinte.
help.introText.pl=**iTrain Import/Export to narzędzie do przeglądania i edytowania plików sterowania kolejką modelarską programu iTrain (.tcd/.tcdz).**\nGłównym celem jest import i eksport pojedynczych wpisów - kategoria po kategorii - pomiędzy istniejącymi plikami iTrain, na przykład aby przenieść element planu torów, akcję lub lokomotywę z jednego pliku do drugiego.\nWpisy, do których istnieją odwołania (np. czujniki zwrotne i semafory używane przez akcję lub odcinek toru), są przy tym rozpoznawane automatycznie i eksportowane oraz importowane razem z nimi, dzięki czemu plik docelowy da się otworzyć w iTrain w komplecie i bez komunikatu o błędzie.\n\nEksport odbywa się jako **plik .zip** zawierający dokładnie jeden plik .csv. Powód tego opakowania: wielu forów i programów pocztowych nie pozwala załączyć pliku .csv, natomiast .zip - tak. Zawarty w nim plik .csv jest wprawdzie widoczny i edytowalny w arkuszu kalkulacyjnym. Ze względu na dużą liczbę odwołań jest to jednak w praktyce niemal niemożliwe i powinni to robić wyłącznie bardzo doświadczeni użytkownicy.\n\n**Właściwa** droga jest następująca:\n- Otworzyć plik\n- Zaznaczyć rekordy (patrz niżej)\n- Wyeksportować\n- Otworzyć drugi plik\n- Ponownie zaimportować eksport\n\nWszystkie odwołania są przy tym eksportowane i ponownie importowane razem z zaznaczeniem. Starsze eksporty jako zwykły plik .csv nadal można importować.\n\nOd wersji **2.0** dochodzą edycja dekoderów i szablony dekoderów. Od wersji **3.0 beta** program jest podzielony na trzy części - patrz kolejny rozdział.
help.introText.da=**iTrain Import/Export er et værktøj til at se og redigere iTrains styringsfiler til modeljernbaner (.tcd/.tcdz).**\nHovedformålet er import og eksport af enkelte poster kategori for kategori mellem eksisterende iTrain-filer - for eksempel for at overføre et sporplanelement, en handling eller et lokomotiv fra én fil til en anden.\nPoster, der henvises til (f.eks. de tilbagemeldinger og signaler, som en handling eller en sporsektion bruger), genkendes automatisk og eksporteres og importeres med, så målfilen kan åbnes komplet og uden fejlmeddelelse i iTrain.\n\nEksporten sker som **.zip-fil**, der indeholder præcis én .csv-fil. Grunden til denne indpakning: en .csv kan ikke vedhæftes i mange fora og mailprogrammer, en .zip derimod godt. Den .csv, der ligger i den, kan ganske vist ses og redigeres i et regneark. På grund af de mange henvisninger er det dog næsten umuligt i praksis og bør kun gøres af meget erfarne brugere.\n\nDen **rigtige** fremgangsmåde er:\n- Åbn filen\n- Markér posterne (se nedenfor)\n- Eksportér\n- Åbn den anden fil\n- Importér eksporten igen\n\nDerved bliver alle henvisninger eksporteret og også importeret igen sammen med markeringen. Ældre eksporter som ren .csv-fil kan stadig importeres.\n\nFra version **2.0** kommer dekoderredigering og dekoderskabeloner til. Fra version **3.0 beta** er programmet opdelt i tre dele - se næste afsnit.
help.introText.sv=**iTrain Import/Export är ett verktyg för att visa och redigera iTrains styrfiler för modelljärnväg (.tcd/.tcdz).**\nHuvudsyftet är import och export av enskilda poster kategori för kategori mellan befintliga iTrain-filer - till exempel för att föra över ett spårplanselement, en åtgärd eller ett lok från en fil till en annan.\nPoster som det hänvisas till (t.ex. de återkopplingar och signaler som en åtgärd eller ett spåravsnitt använder) känns automatiskt igen och exporteras respektive importeras med, så att målfilen kan öppnas fullständigt och utan felmeddelande i iTrain.\n\nExporten sker som **.zip-fil** som innehåller exakt en .csv-fil. Anledningen till förpackningen: en .csv går inte att bifoga i många forum och e-postprogram, en .zip går bra. Csv-filen i den går visserligen att se och redigera i ett kalkylprogram. På grund av de många hänvisningarna är det dock nästan omöjligt i praktiken och bör bara göras av mycket erfarna användare.\n\nDet **rätta** tillvägagångssättet är:\n- Öppna filen\n- Markera posterna (se nedan)\n- Exportera\n- Öppna den andra filen\n- Importera exporten igen\n\nDärvid exporteras och importeras alla hänvisningar med tillsammans med markeringen. Äldre exporter som ren .csv-fil går fortfarande att importera.\n\nFrån version **2.0** tillkommer dekoderredigering och dekodermallar. Från version **3.0 beta** är programmet indelat i tre delar - se nästa avsnitt.

