decoder.installQuestion.de=Haben Sie die Decoder-Vorlagen (decoder.zip) bereits heruntergeladen?\n\nDie Datei wird über denselben Link wie das Programm selbst bereitgestellt.\n\nMit "Decoder-Datei installieren" wählen Sie die heruntergeladene decoder.zip aus. Damit lassen sich ebenso einzelne Vorlagen einlesen - etwa eine selbst erstellte oder eine zugeschickte .csv-Datei - auch mehrere auf einmal.
decoder.installQuestion.en=Have you already downloaded the decoder templates (decoder.zip)?\n\nThe file is provided via the same link as the program itself.\n\nUse "Install decoder file" to select the downloaded decoder.zip. The same button also reads in individual templates - for example one you created yourself or a .csv file someone sent you - several at once if you like.
decoder.installQuestion.nl=Hebt u de decodersjablonen (decoder.zip) al gedownload?\n\nHet bestand wordt via dezelfde link als het programma zelf aangeboden.\n\nMet "Decoderbestand installeren" kiest u het gedownloade decoder.zip. Dezelfde knop leest ook losse sjablonen in - bijvoorbeeld een zelfgemaakt of een toegestuurd .csv-bestand - desgewenst meerdere tegelijk.
decoder.installQuestion.fr=Avez-vous déjà téléchargé les modèles de décodeur (decoder.zip) ?\n\nLe fichier est proposé via le même lien que le programme lui-même.\n\nAvec "Installer le fichier de décodeur", vous choisissez le decoder.zip téléchargé. Le même bouton charge aussi des modèles isolés - par exemple un modèle que vous avez créé ou un fichier .csv qui vous a été envoyé - et plusieurs à la fois si besoin.
decoder.installQuestion.es=¿Ya ha descargado las plantillas de decoder (decoder.zip)?\n\nEl archivo se ofrece a través del mismo enlace que el programa.\n\nCon "Instalar archivo de decoder" elige el decoder.zip descargado. El mismo botón carga también plantillas sueltas: por ejemplo una creada por usted o un archivo .csv que le hayan enviado, incluso varias a la vez.
decoder.installQuestion.it=Hai già scaricato i modelli di decoder (decoder.zip)?\n\nIl file viene fornito tramite lo stesso collegamento del programma stesso.\n\nCon "Installa file di decoder" scegli il decoder.zip scaricato. Lo stesso pulsante carica anche singoli modelli - per esempio uno creato da te o un file .csv che ti è stato inviato - anche più di uno alla volta.
decoder.installQuestion.pt=Já descarregou os modelos de descodificador (decoder.zip)?\n\nO ficheiro é disponibilizado através da mesma ligação que o programa.\n\nCom "Instalar ficheiro de descodificador" escolhe o decoder.zip descarregado. O mesmo botão carrega também modelos avulsos - por exemplo um criado por si ou um ficheiro .csv que lhe tenha sido enviado - vários de uma vez, se quiser.
decoder.installQuestion.pl=Czy pobrano już szablony dekoderów (decoder.zip)?\n\nPlik udostępniany jest pod tym samym odnośnikiem co sam program.\n\nPrzyciskiem "Zainstaluj plik dekodera" wybierasz pobrany decoder.zip. Ten sam przycisk wczytuje też pojedyncze szablony - na przykład własny albo przysłany plik .csv - w razie potrzeby kilka naraz.
decoder.installQuestion.da=Har du allerede hentet dekoderskabelonerne (decoder.zip)?\n\nFilen stilles til rådighed via samme link som programmet selv.\n\nMed "Installer dekoderfil" vælger du den hentede decoder.zip. Samme knap indlæser også enkelte skabeloner - for eksempel en, du selv har lavet, eller en tilsendt .csv-fil - gerne flere ad gangen.
decoder.installQuestion.sv=Har du redan hämtat dekodermallarna (decoder.zip)?\n\nFilen tillhandahålls via samma länk som programmet självt.\n\nMed "Installera dekoderfil" väljer du den hämtade decoder.zip. Samma knapp läser även in enstaka mallar - till exempel en du gjort själv eller en tillskickad .csv-fil - flera samtidigt om du vill.

