systems.writeItrainDoneMain.pt=Passado para a janela principal ({2}): {0} entrada(s) atualizada(s), {1} nova(s). Gravar lá para manter as alterações.
systems.writeItrainDoneMain.pl=Przeniesiono do okna głównego ({2}): zaktualizowano {0} wpis(ów), nowych {1}. Zapisz tam, aby zachować zmiany.
