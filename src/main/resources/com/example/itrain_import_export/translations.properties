bidib.statusPairingFromStore.de=Das Gerät kennt dieses Programm (noch) nicht und verlangt trotz gespeichertem Pairing eine Bestätigung am Gerät. Passiert das bei JEDEM Verbinden, ist im Gerät meist die Partnerliste voll (IFnet: max. 8 Partner) - PAIR-Taste am Gerät länger als 3 s drücken löscht sie, danach einmal neu pairen.
bidib.statusPairingFromStore.en=The device does not (yet) know this program and asks for confirmation on the device despite the stored pairing. If this happens on EVERY connection, the device's partner list is usually full (IFnet: max. 8 partners) - holding the PAIR button on the device for more than 3 s clears it; then pair once more.
bidib.statusPairingFromStore.nl=Het apparaat kent dit programma (nog) niet en vraagt ondanks de opgeslagen koppeling om bevestiging op het apparaat. Gebeurt dit bij ELKE verbinding, dan is de partnerlijst in het apparaat meestal vol (IFnet: max. 8 partners) - de PAIR-knop op het apparaat langer dan 3 s ingedrukt houden wist deze; daarna eenmaal opnieuw koppelen.
bidib.statusPairingFromStore.fr=L'appareil ne connaît pas (encore) ce programme et demande une confirmation sur l'appareil malgré l'appairage enregistré. Si cela se produit à CHAQUE connexion, la liste des partenaires de l'appareil est généralement pleine (IFnet : 8 partenaires max.) - maintenir la touche PAIR de l'appareil plus de 3 s l'efface ; ensuite, appairer une fois de plus.
bidib.statusPairingFromStore.es=El dispositivo (todavía) no conoce este programa y pide confirmación en el propio dispositivo pese al emparejamiento guardado. Si ocurre en CADA conexión, la lista de socios del dispositivo suele estar llena (IFnet: máx. 8) - mantener pulsado el botón PAIR del dispositivo más de 3 s la borra; después, emparejar una vez más.
bidib.statusPairingFromStore.it=Il dispositivo non conosce (ancora) questo programma e chiede conferma sul dispositivo nonostante l'associazione salvata. Se accade a OGNI connessione, l'elenco partner del dispositivo è di solito pieno (IFnet: max. 8) - tenere premuto il tasto PAIR del dispositivo per più di 3 s lo cancella; poi associare ancora una volta.
bidib.statusPairingFromStore.pt=O dispositivo (ainda) não conhece este programa e pede confirmação no próprio dispositivo apesar do emparelhamento guardado. Se isso acontecer em CADA ligação, a lista de parceiros do dispositivo está normalmente cheia (IFnet: máx. 8) - manter o botão PAIR do dispositivo premido mais de 3 s apaga-a; depois emparelhar mais uma vez.
bidib.statusPairingFromStore.pl=Urządzenie (jeszcze) nie zna tego programu i mimo zapisanego parowania prosi o potwierdzenie na urządzeniu. Jeśli dzieje się tak przy KAŻDYM połączeniu, lista partnerów w urządzeniu jest zwykle pełna (IFnet: maks. 8) - przytrzymanie przycisku PAIR na urządzeniu dłużej niż 3 s ją kasuje; potem sparować jeszcze raz.
bidib.statusPairingFromStore.da=Enheden kender (endnu) ikke dette program og beder om bekræftelse på enheden trods den gemte parring. Sker det ved HVER forbindelse, er enhedens partnerliste som regel fuld (IFnet: maks. 8) - hold PAIR-knappen på enheden inde i mere end 3 s for at slette den; par derefter én gang til.
bidib.statusPairingFromStore.sv=Enheten känner (ännu) inte till det här programmet och begär bekräftelse på enheten trots den sparade parkopplingen. Händer det vid VARJE anslutning är enhetens partnerlista oftast full (IFnet: max 8) - håll PAIR-knappen på enheten intryckt längre än 3 s för att rensa den; parkoppla sedan en gång till.

