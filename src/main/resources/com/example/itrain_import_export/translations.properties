bidib.hint.de=netBiDiB-Geräte im lokalen Netz erscheinen automatisch in der Liste - Gerät markieren und "Verbinden" drücken.\nBeim ersten Verbinden ist ein Pairing nötig, das am BiDiB-Gerät bestätigt werden muss.
bidib.hint.en=netBiDiB devices on the local network appear in the list automatically - select one and press "Connect".\nThe first connection requires a pairing, which has to be confirmed on the BiDiB device.
bidib.hint.nl=netBiDiB-apparaten in het lokale netwerk verschijnen automatisch in de lijst - apparaat markeren en op "Verbinden" drukken.\nBij de eerste verbinding is een koppeling nodig, die op het BiDiB-apparaat bevestigd moet worden.
bidib.hint.fr=Les appareils netBiDiB du réseau local apparaissent automatiquement dans la liste - sélectionnez-en un et appuyez sur « Connecter ».\nLa première connexion nécessite un appairage, à confirmer sur l'appareil BiDiB.
bidib.hint.es=Los dispositivos netBiDiB de la red local aparecen automáticamente en la lista: seleccione uno y pulse "Conectar".\nLa primera conexión requiere un emparejamiento, que debe confirmarse en el dispositivo BiDiB.
bidib.hint.it=I dispositivi netBiDiB della rete locale compaiono automaticamente nell'elenco - selezionarne uno e premere "Connetti".\nLa prima connessione richiede un'associazione, da confermare sul dispositivo BiDiB.
bidib.hint.pt=Os dispositivos netBiDiB da rede local aparecem automaticamente na lista - selecione um e prima "Ligar".\nA primeira ligação requer um emparelhamento, que tem de ser confirmado no dispositivo BiDiB.
bidib.hint.pl=Urządzenia netBiDiB w sieci lokalnej pojawiają się automatycznie na liście - zaznacz urządzenie i naciśnij "Połącz".\nPierwsze połączenie wymaga parowania, które trzeba potwierdzić na urządzeniu BiDiB.
bidib.hint.da=netBiDiB-enheder i det lokale netværk vises automatisk i listen - markér en enhed og tryk på "Forbind".\nDen første forbindelse kræver en parring, som skal bekræftes på BiDiB-enheden.
bidib.hint.sv=netBiDiB-enheter i det lokala nätverket visas automatiskt i listan - markera en enhet och tryck på "Anslut".\nDen första anslutningen kräver en parkoppling som måste bekräftas på BiDiB-enheten.
bidib.manualHint.de=IP-Adresse und Port eines netBiDiB-Geräts eingeben (Standard-Port 62875) und "Verbinden" drücken.
bidib.manualHint.en=Enter the IP address and port of a netBiDiB device (standard port 62875) and press "Connect".
bidib.manualHint.nl=Voer IP-adres en poort van een netBiDiB-apparaat in (standaardpoort 62875) en druk op "Verbinden".
bidib.manualHint.fr=Saisissez l'adresse IP et le port d'un appareil netBiDiB (port standard 62875) puis appuyez sur « Connecter ».
bidib.manualHint.es=Introduzca la dirección IP y el puerto de un dispositivo netBiDiB (puerto estándar 62875) y pulse "Conectar".
bidib.manualHint.it=Inserire indirizzo IP e porta di un dispositivo netBiDiB (porta standard 62875) e premere "Connetti".
bidib.manualHint.pt=Introduza o endereço IP e a porta de um dispositivo netBiDiB (porta padrão 62875) e prima "Ligar".
bidib.manualHint.pl=Wpisz adres IP i port urządzenia netBiDiB (standardowy port 62875) i naciśnij "Połącz".
bidib.manualHint.da=Indtast IP-adresse og port for en netBiDiB-enhed (standardport 62875) og tryk på "Forbind".
bidib.manualHint.sv=Ange IP-adress och port för en netBiDiB-enhet (standardport 62875) och tryck på "Anslut".

