help.fileMenuText.de=**Öffnen...** lädt eine bestehende .tcd- oder .tcdz-Datei.\n**Speichern unter...** speichert die aktuell geladene Datei unter einem neuen Namen bzw. Ort - bei .tcdz wird das Archiv dabei automatisch neu erzeugt.\n**Aktuelle schließen** verwirft die geladene Datei (ohne zu speichern) - das Programm bleibt offen und zeigt wieder "Keine Datei geladen.".\n**Zuletzt verwendete öffnen** listet die letzten 5 geöffneten Dateien zum schnellen erneuten Öffnen auf (die älteste wird verdrängt, sobald eine 6. hinzukommt).\n**Backup laden...** öffnet den Datei-Dialog direkt im eingestellten Backup-Ordner (siehe Einstellungen → Pfade), um eine automatisch angelegte Sicherheitskopie wieder zu laden.\n**Export Dateien** öffnet eine zuvor exportierte Datei (.zip, oder .csv aus älteren Versionen) aus dem Export-Ordner und importiert deren Einträge in das aktuell geöffnete Dokument - das entspricht dem Button "In Kategorie importieren" in der Kategorie-Ansicht, nur ohne dass zuerst zu einem bestimmten Reiter gewechselt werden muss.\n**Programm beenden** schließt das Programm samt Zusatzfenstern - genau wie das X des Hauptfensters.\n\nDas Decoder-Fenster hat ein eigenes Datei-Menü mit denselben Punkten (ohne Export Dateien und Programm beenden) - es arbeitet auf derselben Datei wie das Hauptfenster.
help.fileMenuText.en=**Open...** loads an existing .tcd or .tcdz file.\n**Save as...** saves the currently loaded file under a new name or location - for .tcdz the archive is recreated automatically.\n**Close Current** discards the loaded file (without saving) - the program stays open and shows "No file loaded." again.\n**Open Recent Files** lists the last 5 files opened, so they can be reopened quickly (the oldest one drops off as soon as a 6th is added).\n**Load Backup...** opens the file dialog directly in the configured backup folder (see Settings → Paths) in order to reload an automatically created safety copy.\n**Export Files** opens a previously exported file (.zip, or .csv from older versions) from the export folder and imports its entries into the currently open document - this is the same as the "Import into category" button in the category view, only without having to switch to a particular tab first.\n**Exit Program** closes the program together with its additional windows - just like the X of the main window.\n\nThe Decoder window has its own File menu with the same items (without Export Files and Exit Program) - it works on the same file as the main window.
help.fileMenuText.nl=**Openen...** laadt een bestaand .tcd- of .tcdz-bestand.\n**Opslaan als...** slaat het geladen bestand onder een nieuwe naam of locatie op - bij .tcdz wordt het archief daarbij automatisch opnieuw aangemaakt.\n**Huidige sluiten** verwerpt het geladen bestand (zonder op te slaan) - het programma blijft open en toont weer "Geen bestand geladen.".\n**Recent gebruikte openen** toont de laatste 5 geopende bestanden om ze snel opnieuw te openen (het oudste verdwijnt zodra er een 6e bij komt).\n**Back-up laden...** opent het bestandsvenster direct in de ingestelde back-upmap (zie Instellingen → Paden) om een automatisch aangemaakte veiligheidskopie weer te laden.\n**Exportbestanden** opent een eerder geëxporteerd bestand (.zip, of .csv uit oudere versies) uit de exportmap en importeert de items ervan in het geopende document - dat komt overeen met de knop "Importeren in categorie" in de categorieweergave, alleen zonder eerst naar een bepaald tabblad te wisselen.\n**Programma afsluiten** sluit het programma inclusief de extra vensters - precies zoals de X van het hoofdvenster.\n\nHet venster Decoder heeft een eigen menu Bestand met dezelfde punten (zonder Exportbestanden en Programma afsluiten) - het werkt met hetzelfde bestand als het hoofdvenster.
help.fileMenuText.fr=**Ouvrir...** charge un fichier .tcd ou .tcdz existant.\n**Enregistrer sous...** enregistre le fichier chargé sous un nouveau nom ou à un nouvel emplacement - pour un .tcdz, l'archive est automatiquement recréée.\n**Fermer le fichier actuel** abandonne le fichier chargé (sans enregistrer) - le programme reste ouvert et affiche de nouveau « Aucun fichier chargé. ».\n**Ouvrir les fichiers récents** liste les 5 derniers fichiers ouverts afin de les rouvrir rapidement (le plus ancien disparaît dès qu'un 6e s'ajoute).\n**Charger une sauvegarde...** ouvre la boîte de dialogue directement dans le dossier de sauvegarde configuré (voir Paramètres → Chemins) afin de recharger une copie de sécurité créée automatiquement.\n**Fichiers exportés** ouvre un fichier exporté auparavant (.zip, ou .csv des anciennes versions) depuis le dossier d'export et importe ses entrées dans le document ouvert - c'est l'équivalent du bouton « Importer dans la catégorie » de la vue de catégorie, sans devoir d'abord passer à un onglet précis.\n**Quitter le programme** ferme le programme avec ses fenêtres supplémentaires - exactement comme le X de la fenêtre principale.\n\nLa fenêtre Décodeur possède son propre menu Fichier avec les mêmes éléments (sans Fichiers exportés ni Quitter le programme) - elle travaille sur le même fichier que la fenêtre principale.
help.fileMenuText.es=**Abrir...** carga un archivo .tcd o .tcdz existente.\n**Guardar como...** guarda el archivo cargado con un nombre o en una ubicación nuevos - en el caso de .tcdz, el archivo comprimido se vuelve a generar automáticamente.\n**Cerrar actual** descarta el archivo cargado (sin guardar): el programa sigue abierto y vuelve a mostrar "Ningún archivo cargado.".\n**Abrir usados recientemente** muestra los últimos 5 archivos abiertos para volver a abrirlos rápidamente (el más antiguo desaparece en cuanto se añade un 6º).\n**Cargar copia de seguridad...** abre el diálogo de archivos directamente en la carpeta de copias de seguridad configurada (véase Ajustes → Rutas) para volver a cargar una copia creada automáticamente.\n**Archivos exportados** abre un archivo exportado anteriormente (.zip, o .csv de versiones antiguas) de la carpeta de exportación e importa sus entradas en el documento abierto; equivale al botón "Importar en categoría" de la vista de categoría, solo que sin tener que cambiar antes a una pestaña concreta.\n**Salir del programa** cierra el programa junto con sus ventanas adicionales, igual que la X de la ventana principal.\n\nLa ventana Decoder tiene su propio menú Archivo con los mismos elementos (sin Archivos exportados ni Salir del programa); trabaja con el mismo archivo que la ventana principal.
help.fileMenuText.it=**Apri...** carica un file .tcd o .tcdz esistente.\n**Salva con nome...** salva il file caricato con un nuovo nome o in una nuova posizione - per i .tcdz l'archivio viene ricreato automaticamente.\n**Chiudi corrente** scarta il file caricato (senza salvare) - il programma resta aperto e mostra di nuovo "Nessun file caricato.".\n**Apri utilizzati di recente** elenca gli ultimi 5 file aperti per riaprirli rapidamente (il più vecchio viene eliminato non appena se ne aggiunge un 6°).\n**Carica backup...** apre la finestra dei file direttamente nella cartella di backup impostata (vedi Impostazioni → Percorsi) per ricaricare una copia di sicurezza creata automaticamente.\n**File esportati** apre un file esportato in precedenza (.zip, oppure .csv delle versioni precedenti) dalla cartella di esportazione e ne importa le voci nel documento aperto - corrisponde al pulsante "Importa nella categoria" della vista categoria, senza dover prima passare a una scheda precisa.\n**Esci dal programma** chiude il programma insieme alle finestre aggiuntive - esattamente come la X della finestra principale.\n\nLa finestra Decoder ha un proprio menu File con le stesse voci (senza File esportati ed Esci dal programma) - lavora sullo stesso file della finestra principale.
help.fileMenuText.pt=**Abrir...** carrega um ficheiro .tcd ou .tcdz existente.\n**Guardar como...** guarda o ficheiro carregado com um novo nome ou noutra localização - no caso de .tcdz o arquivo é recriado automaticamente.\n**Fechar Atual** descarta o ficheiro carregado (sem gravar) - o programa continua aberto e volta a mostrar "Nenhum ficheiro carregado.".\n**Abrir ficheiros recentes** lista os últimos 5 ficheiros abertos, para os reabrir rapidamente (o mais antigo desaparece assim que é acrescentado um 6.º).\n**Carregar cópia de segurança...** abre a caixa de diálogo diretamente na pasta de cópias de segurança configurada (ver Definições → Caminhos), para voltar a carregar uma cópia criada automaticamente.\n**Ficheiros de exportação** abre um ficheiro exportado anteriormente (.zip, ou .csv de versões antigas) da pasta de exportação e importa as suas entradas para o documento aberto - corresponde ao botão "Importar na categoria" da vista de categoria, sem ter de mudar primeiro para um separador concreto.\n**Sair do Programa** fecha o programa juntamente com as janelas adicionais - tal como o X da janela principal.\n\nA janela Descodificador tem o seu próprio menu Ficheiro com os mesmos itens (sem Ficheiros de exportação e Sair do Programa) - trabalha com o mesmo ficheiro que a janela principal.
help.fileMenuText.pl=**Otwórz...** wczytuje istniejący plik .tcd lub .tcdz.\n**Zapisz jako...** zapisuje wczytany plik pod nową nazwą lub w nowym miejscu - w przypadku .tcdz archiwum jest przy tym tworzone na nowo automatycznie.\n**Zamknij Bieżący** odrzuca wczytany plik (bez zapisywania) - program pozostaje otwarty i ponownie pokazuje "Nie wczytano żadnego pliku.".\n**Otwórz ostatnio używane** wyświetla 5 ostatnio otwartych plików, aby szybko otworzyć je ponownie (najstarszy wypada, gdy tylko dojdzie 6.).\n**Wczytaj kopię zapasową...** otwiera okno wyboru plików bezpośrednio w ustawionym folderze kopii zapasowych (patrz Ustawienia → Ścieżki), aby ponownie wczytać automatycznie utworzoną kopię bezpieczeństwa.\n**Pliki eksportu** otwiera wcześniej wyeksportowany plik (.zip lub .csv ze starszych wersji) z folderu eksportu i importuje jego wpisy do otwartego dokumentu - odpowiada to przyciskowi "Importuj do kategorii" w widoku kategorii, tylko bez wcześniejszego przechodzenia na określoną kartę.\n**Zakończ Program** zamyka program razem z dodatkowymi oknami - dokładnie tak jak X okna głównego.\n\nOkno Dekoder ma własne menu Plik z tymi samymi pozycjami (bez Pliki eksportu i Zakończ Program) - pracuje na tym samym pliku co okno główne.
help.fileMenuText.da=**Åbn...** indlæser en eksisterende .tcd- eller .tcdz-fil.\n**Gem som...** gemmer den indlæste fil under et nyt navn eller sted - ved .tcdz oprettes arkivet automatisk på ny.\n**Luk aktuel** kasserer den indlæste fil (uden at gemme) - programmet forbliver åbent og viser igen "Ingen fil indlæst.".\n**Åbn senest brugte** viser de sidste 5 åbnede filer, så de hurtigt kan åbnes igen (den ældste falder fra, så snart en 6. kommer til).\n**Indlæs sikkerhedskopi...** åbner fildialogen direkte i den indstillede mappe til sikkerhedskopier (se Indstillinger → Stier) for at indlæse en automatisk oprettet sikkerhedskopi igen.\n**Eksportfiler** åbner en tidligere eksporteret fil (.zip eller .csv fra ældre versioner) fra eksportmappen og importerer dens poster i det åbne dokument - det svarer til knappen "Importer i kategori" i kategorivisningen, blot uden først at skifte til en bestemt fane.\n**Afslut program** lukker programmet sammen med ekstravinduerne - præcis som X i hovedvinduet.\n\nVinduet Dekoder har sin egen Filer-menu med de samme punkter (uden Eksportfiler og Afslut program) - det arbejder på den samme fil som hovedvinduet.
help.fileMenuText.sv=**Öppna...** läser in en befintlig .tcd- eller .tcdz-fil.\n**Spara som...** sparar den inlästa filen under ett nytt namn eller på en ny plats - vid .tcdz skapas arkivet automatiskt på nytt.\n**Stäng aktuell** förkastar den inlästa filen (utan att spara) - programmet förblir öppet och visar åter "Ingen fil inläst.".\n**Öppna senast använda** listar de 5 senast öppnade filerna så att de snabbt kan öppnas igen (den äldsta faller bort så snart en 6:e tillkommer).\n**Läs in säkerhetskopia...** öppnar fildialogen direkt i den inställda mappen för säkerhetskopior (se Inställningar → Sökvägar) för att läsa in en automatiskt skapad säkerhetskopia igen.\n**Exportfiler** öppnar en tidigare exporterad fil (.zip, eller .csv från äldre versioner) från exportmappen och importerar dess poster i det öppna dokumentet - det motsvarar knappen "Importera i kategori" i kategorivyn, bara utan att först byta till en viss flik.\n**Avsluta programmet** stänger programmet tillsammans med tilläggsfönstren - precis som X i huvudfönstret.\n\nFönstret Dekoder har en egen Arkiv-meny med samma punkter (utan Exportfiler och Avsluta programmet) - det arbetar med samma fil som huvudfönstret.

