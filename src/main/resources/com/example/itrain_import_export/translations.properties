capture.tableHint.de=Werte eintragen: Tippen beginnt die Eingabe, Tabulator und Pfeiltasten springen zur Nachbarzelle. Werte aus einer Hersteller-Anleitung im PDF-Programm markieren, kopieren und hier mit Strg+V oder "Ab hier einfügen" einsetzen. Übernommen wird nur, was in "Aktiv" angehakt ist.
capture.tableHint.en=Enter the values: typing starts the entry, Tab and the arrow keys jump to the neighbouring cell. Select values in the manufacturer's manual in your PDF program, copy them and insert them here with Ctrl+V or "Paste from here". Only what is ticked under "Active" is taken over.
capture.tableHint.nl=Waarden invoeren: typen begint de invoer, Tab en de pijltjestoetsen springen naar de volgende cel. Waarden uit de handleiding van de fabrikant in uw PDF-programma selecteren, kopiëren en hier met Ctrl+V of "Vanaf hier plakken" invoegen. Alleen wat onder "Actief" is aangevinkt wordt overgenomen.
capture.tableHint.fr=Saisissez les valeurs : la frappe démarre la saisie, la tabulation et les flèches passent à la cellule voisine. Sélectionnez les valeurs dans la notice du fabricant avec votre logiciel PDF, copiez-les et insérez-les ici avec Ctrl+V ou « Coller à partir d'ici ». Seul ce qui est coché sous « Actif » est repris.
capture.tableHint.es=Introduzca los valores: al teclear comienza la entrada; el tabulador y las flechas saltan a la celda contigua. Marque los valores en el manual del fabricante con su programa de PDF, cópielos e insértelos aquí con Ctrl+V o «Pegar desde aquí». Solo se toma lo marcado en «Activo».
capture.tableHint.it=Inserisci i valori: digitando inizia l'inserimento, il tabulatore e le frecce passano alla cella accanto. Seleziona i valori nel manuale del produttore con il tuo programma PDF, copiali e inseriscili qui con Ctrl+V o «Incolla da qui». Viene ripreso solo ciò che è spuntato in «Attivo».
capture.tableHint.pt=Introduza os valores: ao escrever inicia-se a introdução; o tabulador e as setas saltam para a célula ao lado. Marque os valores no manual do fabricante no seu programa de PDF, copie-os e insira-os aqui com Ctrl+V ou "Colar a partir daqui". Só é assumido o que estiver assinalado em "Ativo".
capture.tableHint.pl=Wpisuj wartości: pisanie rozpoczyna wprowadzanie, tabulator i strzałki przechodzą do sąsiedniej komórki. Wartości z instrukcji producenta zaznacz w programie PDF, skopiuj i wstaw tutaj przez Ctrl+V albo „Wstaw od tego miejsca”. Przejmowane jest tylko to, co zaznaczono w kolumnie „Aktywny”.
capture.tableHint.da=Indtast værdierne: indtastningen begynder, når du skriver; tabulator og piletaster springer til nabocellen. Marker værdierne i producentens vejledning i dit PDF-program, kopier dem, og indsæt dem her med Ctrl+V eller "Indsæt herfra". Kun det, der er markeret under "Aktiv", overtages.
capture.tableHint.sv=Ange värdena: inmatningen börjar när du skriver; tabb och piltangenter hoppar till grannecellen. Markera värdena i tillverkarens manual i ditt PDF-program, kopiera dem och infoga dem här med Ctrl+V eller "Klistra in härifrån". Bara det som är ikryssat under "Aktiv" tas över.

