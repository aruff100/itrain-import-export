help.updateText.de=**Hilfe → Update** prüft manuell, ob eine neuere Programmversion verfügbar ist.\nZusätzlich läuft beim Programmstart automatisch eine stille Prüfung im Hintergrund (abschaltbar unter Voreinstellungen → Ansicht → "Beim Start automatisch nach Updates suchen").\nIst eine neue Version verfügbar, öffnet der Knopf "Herunterladen" den Proton-Drive-Freigabelink im Standard-Browser.\nDer eigentliche Download läuft wie gewohnt über Proton Drive, die App selbst lädt nichts herunter und es werden auch keinerlei Anmeldedaten benötigt.\n\nDie heruntergeladene Datei:\n- .deb für Linux\n- .msi für Windows\n- .dmg für macOS\n\nmuss mit den **Mitteln des Betriebssystems** installiert werden. Ein entsprechender Installer ist im Download integriert.\n\n**Anmerkung:**\nEin so kleines Programm durchläuft nicht die üblichen Prozeduren bei den Betriebssystem-Herstellern. Deswegen kann es zu Warnhinweisen kommen.\nBeim Download kann "Scannen" aktiviert werden, Proton prüft dann auf Schadsoftware.
help.updateText.en=**Help → Update** checks manually whether a newer program version is available.\nIn addition, a silent check runs automatically in the background at program start (can be turned off under Preferences → View → "Automatically check for updates on startup").\nIf a new version is available, the "Download" button opens the Proton Drive share link in the default browser.\nThe actual download runs through Proton Drive as usual; the app itself does not download anything and no login credentials of any kind are required.\n\nThe downloaded file:\n- .deb for Linux\n- .msi for Windows\n- .dmg for macOS\n\nhas to be installed with the **means of the operating system**. A suitable installer is included in the download.\n\n**Note:**\nA program as small as this one does not go through the usual procedures at the operating system manufacturers. Warning messages may therefore appear.\nDuring the download "Scan" can be enabled; Proton then checks the file for malware.
help.updateText.nl=**Help → Update** controleert handmatig of er een nieuwere programmaversie beschikbaar is.\nDaarnaast loopt bij het starten van het programma automatisch een stille controle op de achtergrond (uit te schakelen onder Voorkeuren → Weergave → "Bij het starten automatisch naar updates zoeken").\nIs er een nieuwe versie beschikbaar, dan opent de knop "Downloaden" de Proton Drive-deellink in de standaardbrowser.\nHet eigenlijke downloaden verloopt zoals gewoonlijk via Proton Drive; de app zelf downloadt niets en er zijn ook geen enkele aanmeldgegevens nodig.\n\nHet gedownloade bestand:\n- .deb voor Linux\n- .msi voor Windows\n- .dmg voor macOS\n\nmoet met de **middelen van het besturingssysteem** geïnstalleerd worden. Een bijbehorend installatieprogramma zit in de download.\n\n**Opmerking:**\nZo'n klein programma doorloopt niet de gebruikelijke procedures bij de fabrikanten van besturingssystemen. Daarom kunnen er waarschuwingen verschijnen.\nBij het downloaden kan "Scannen" ingeschakeld worden; Proton controleert dan op schadelijke software.
help.updateText.fr=**Aide → Mise à jour** vérifie manuellement si une version plus récente du programme est disponible.\nDe plus, une vérification silencieuse s'exécute automatiquement en arrière-plan au démarrage du programme (désactivable sous Préférences → Affichage → "Rechercher automatiquement les mises à jour au démarrage").\nSi une nouvelle version est disponible, le bouton "Télécharger" ouvre le lien de partage Proton Drive dans le navigateur par défaut.\nLe téléchargement proprement dit passe comme d'habitude par Proton Drive ; l'application elle-même ne télécharge rien et aucune donnée de connexion n'est nécessaire.\n\nLe fichier téléchargé :\n- .deb pour Linux\n- .msi pour Windows\n- .dmg pour macOS\n\ndoit être installé avec les **moyens du système d'exploitation**. Un programme d'installation correspondant est intégré au téléchargement.\n\n**Remarque :**\nUn programme aussi petit ne passe pas par les procédures habituelles des fabricants de systèmes d'exploitation. Des avertissements peuvent donc apparaître.\nLors du téléchargement, l'option "Analyser" peut être activée ; Proton vérifie alors l'absence de logiciels malveillants.
help.updateText.es=**Ayuda → Actualización** comprueba manualmente si hay disponible una versión más reciente del programa.\nAdemás, al iniciar el programa se ejecuta automáticamente una comprobación silenciosa en segundo plano (se puede desactivar en Preferencias → Vista → "Buscar actualizaciones automáticamente al iniciar").\nSi hay una versión nueva disponible, el botón "Descargar" abre el enlace compartido de Proton Drive en el navegador predeterminado.\nLa descarga propiamente dicha se realiza como siempre a través de Proton Drive; la aplicación misma no descarga nada y tampoco se necesita ningún dato de acceso.\n\nEl archivo descargado:\n- .deb para Linux\n- .msi para Windows\n- .dmg para macOS\n\ndebe instalarse con los **medios del sistema operativo**. En la descarga va incluido el instalador correspondiente.\n\n**Nota:**\nUn programa tan pequeño como este no pasa por los procedimientos habituales de los fabricantes de sistemas operativos. Por eso pueden aparecer avisos de advertencia.\nDurante la descarga puede activarse "Analizar"; Proton comprueba entonces si hay software malicioso.
help.updateText.it=**Aiuto → Aggiornamento** verifica manualmente se è disponibile una versione più recente del programma.\nInoltre, all'avvio del programma viene eseguito automaticamente un controllo silenzioso in background (disattivabile in Preferenze → Visualizzazione → "Cerca automaticamente aggiornamenti all'avvio").\nSe è disponibile una nuova versione, il pulsante "Scarica" apre il link di condivisione di Proton Drive nel browser predefinito.\nIl download vero e proprio avviene come al solito tramite Proton Drive; l'app stessa non scarica nulla e non è necessaria alcuna credenziale di accesso.\n\nIl file scaricato:\n- .deb per Linux\n- .msi per Windows\n- .dmg per macOS\n\ndeve essere installato con i **mezzi del sistema operativo**. Nel download è integrato un programma di installazione adeguato.\n\n**Nota:**\nUn programma così piccolo non attraversa le consuete procedure presso i produttori dei sistemi operativi. Per questo possono comparire avvisi di avvertimento.\nDurante il download è possibile attivare "Scansione"; Proton verifica allora la presenza di software dannoso.
help.updateText.pt=**Ajuda → Atualização** verifica manualmente se está disponível uma versão mais recente do programa.\nAlém disso, ao iniciar o programa é executada automaticamente uma verificação silenciosa em segundo plano (desativável em Preferências → Vista → "Verificar automaticamente se há atualizações ao iniciar").\nSe houver uma versão nova disponível, o botão "Transferir" abre a ligação de partilha do Proton Drive no navegador predefinido.\nA transferência propriamente dita decorre como habitualmente através do Proton Drive; a própria aplicação não transfere nada e também não são necessários quaisquer dados de início de sessão.\n\nO ficheiro transferido:\n- .deb para Linux\n- .msi para Windows\n- .dmg para macOS\n\ntem de ser instalado com os **meios do sistema operativo**. Está integrado na transferência um instalador adequado.\n\n**Nota:**\nUm programa tão pequeno não passa pelos procedimentos habituais junto dos fabricantes de sistemas operativos. Por isso podem surgir avisos.\nDurante a transferência pode ativar-se "Analisar"; o Proton verifica então se existe software malicioso.
help.updateText.pl=**Pomoc → Aktualizacja** sprawdza ręcznie, czy dostępna jest nowsza wersja programu.\nDodatkowo przy uruchomieniu programu automatycznie wykonywane jest ciche sprawdzenie w tle (można je wyłączyć w Preferencje → Widok → "Automatycznie sprawdzaj dostępność aktualizacji przy uruchomieniu").\nJeśli dostępna jest nowa wersja, przycisk "Pobierz" otwiera link udostępniania Proton Drive w domyślnej przeglądarce.\nWłaściwe pobieranie odbywa się jak zwykle przez Proton Drive; sama aplikacja niczego nie pobiera i nie są potrzebne żadne dane logowania.\n\nPobrany plik:\n- .deb dla Linuksa\n- .msi dla Windows\n- .dmg dla macOS\n\nmusi zostać zainstalowany **środkami systemu operacyjnego**. Odpowiedni instalator jest wbudowany w pobierany plik.\n\n**Uwaga:**\nTak mały program nie przechodzi zwykłych procedur u producentów systemów operacyjnych. Dlatego mogą pojawiać się ostrzeżenia.\nPrzy pobieraniu można włączyć "Skanowanie"; Proton sprawdza wtedy plik pod kątem złośliwego oprogramowania.
help.updateText.da=**Hjælp → Opdatering** kontrollerer manuelt, om der findes en nyere programversion.\nDerudover kører der automatisk en tavs kontrol i baggrunden ved programstart (kan slås fra under Præferencer → Visning → "Søg automatisk efter opdateringer ved start").\nEr en ny version tilgængelig, åbner knappen "Download" Proton Drive-delelinket i standardbrowseren.\nSelve downloadet foregår som sædvanlig via Proton Drive; appen selv downloader ikke noget, og der kræves heller ingen form for loginoplysninger.\n\nDen downloadede fil:\n- .deb til Linux\n- .msi til Windows\n- .dmg til macOS\n\nskal installeres med **operativsystemets egne midler**. Et tilhørende installationsprogram er integreret i downloadet.\n\n**Bemærkning:**\nEt så lille program gennemgår ikke de sædvanlige procedurer hos operativsystemproducenterne. Derfor kan der komme advarsler.\nVed downloadet kan "Scanning" slås til; Proton kontrollerer så for skadelig software.
help.updateText.sv=**Hjälp → Uppdatering** kontrollerar manuellt om en nyare programversion finns tillgänglig.\nDessutom körs en tyst kontroll automatiskt i bakgrunden vid programstart (kan stängas av under Preferenser → Visning → "Sök automatiskt efter uppdateringar vid start").\nFinns en ny version tillgänglig öppnar knappen "Ladda ner" Proton Drive-delningslänken i standardwebbläsaren.\nSjälva nedladdningen sker som vanligt via Proton Drive; appen själv laddar inte ner något och det behövs inte heller några inloggningsuppgifter.\n\nDen nedladdade filen:\n- .deb för Linux\n- .msi för Windows\n- .dmg för macOS\n\nmåste installeras med **operativsystemets egna medel**. Ett motsvarande installationsprogram ingår i nedladdningen.\n\n**Anmärkning:**\nEtt så litet program genomgår inte de vanliga procedurerna hos operativsystemtillverkarna. Därför kan varningar dyka upp.\nVid nedladdningen kan "Skanning" aktiveras; Proton kontrollerar då om det finns skadlig programvara.

