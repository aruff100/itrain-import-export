help.explorerText.de=Die mittlere Spalte eines Kategorie-Reiters zeigt den **Daten-Explorer**: die vollständige Baumstruktur des links ausgewählten Eintrags, genau so, wie er in der Datei steht.\n\n- Ein Klick auf das **Dreieck** vor einer Zeile klappt die darunterliegenden Daten auf und wieder zu. Zeilen ohne Dreieck haben keine weiteren Unterdaten.\n- Ein Klick auf die **Zeile selbst** wählt sie aus. Ist unter Voreinstellungen → Ansicht der Punkt **Daten ändern** angehakt, zeigt der Bereich rechts daneben die Daten genau dieser Zeile - und dort sind sie auch änderbar.\n- **Rechtsklick** auf eine Zeile bietet **Bearbeiten** und **Export**. Bearbeiten lässt zu, dass diese Einträge verändert werden - bitte mit äußerster Vorsicht!\n\nIm Bereich **Daten ändern** werden angezeigt:\n- **Tag** - der Name des Elements, z.B. "interface".\n- **Textinhalt** - der Text innerhalb des Elements, sofern vorhanden, z.B. "22.0" bei einer Längenangabe.\n- **Attribute** - die eigentlichen Daten, als Tabelle aus Name und Wert. Bei der Zeile interface "~YD7001" address=37 stehen dort also die beiden Zeilen name = ~YD7001 und address = 37.\n\nEin Doppelklick in die Spalte **Wert** macht die Zelle bearbeitbar, die Eingabetaste übernimmt die Änderung. Geändert werden können ausschließlich die **Werte**: Tag und Attributname legen die Struktur der Datei fest und werden deshalb nur angezeigt. Aus demselben Grund lassen sich hier auch keine Attribute anlegen oder löschen. Ein leer gemachter Wert bleibt als leeres Attribut erhalten.\n\nEin festes Schema gibt es dabei nicht: jedes Element hat seine eigenen Attribute, manche haben zusätzlich einen Textinhalt. Deshalb ist die Tabelle bewusst allgemein gehalten und zeigt immer genau das, was an der ausgewählten Zeile tatsächlich vorhanden ist.\n\nEine Ausnahme ist der Knoten **configuration** bei **Lokomotiven** und **Wagen**: dort erscheint statt der Attributtabelle die spezialisierte Konfigurationstabelle mit Nr, Wert, Typ und Beschreibung. Zugleich taucht über dem Daten-Explorer der Knopf **In eigenem Fenster bearbeiten** auf - er öffnet dieselben Werte in einer großen Tabelle mit mehr Platz und Tastaturbedienung.
help.explorerText.en=The middle column of a category tab shows the **data explorer**: the complete tree structure of the entry selected on the left, exactly as it is stored in the file.\n\n- Clicking the **triangle** in front of a row expands and collapses the data below it. Rows without a triangle have no further sub-data.\n- Clicking the **row itself** selects it. If **Change Data** is ticked under Preferences → View, the area next to it shows the data of exactly that row - and that is where it can be changed.\n- **Right-clicking** a row offers **Edit** and **Export**. Editing allows these entries to be changed - please use with utmost care!\n\nThe **Change Data** area shows:\n- **Tag** - the name of the element, e.g. "interface".\n- **Text Content** - the text inside the element, if there is any, e.g. "22.0" for a length.\n- **Attributes** - the actual data, as a table of name and value. For the row interface "~YD7001" address=37 it therefore contains the two rows name = ~YD7001 and address = 37.\n\nA double click into the **Value** column makes the cell editable, Enter applies the change. Only the **values** can be changed: the tag and the attribute name define the structure of the file and are therefore only displayed. For the same reason attributes can neither be created nor deleted here. A value that has been emptied remains as an empty attribute.\n\nThere is no fixed schema here: every element has its own attributes, and some additionally have a text content. That is why the table is deliberately generic and always shows exactly what really is present on the selected row.\n\nOne exception is the **configuration** node under **Locomotives** and **Wagons**: there the specialised configuration table with No, Value, Type and Description appears instead of the attribute table. At the same time the button **Edit in a separate window** appears above the data explorer - it opens the same values in a large table with more room and keyboard operation.
help.explorerText.nl=De middelste kolom van een categorietabblad toont de **gegevensverkenner**: de volledige boomstructuur van het links geselecteerde item, precies zoals het in het bestand staat.\n\n- Een klik op het **driehoekje** vóór een regel klapt de daaronder liggende gegevens open en weer dicht. Regels zonder driehoekje hebben geen verdere subgegevens.\n- Een klik op de **regel zelf** selecteert hem. Is onder Voorkeuren → Weergave het punt **Gegevens wijzigen** aangevinkt, dan toont het gebied ernaast de gegevens van precies die regel - en daar zijn ze ook te wijzigen.\n- **Rechtsklikken** op een regel biedt **Bewerken** en **Export**. Bewerken staat toe dat deze items worden gewijzigd - alsjeblieft uiterst voorzichtig!\n\nIn het gebied **Gegevens wijzigen** worden getoond:\n- **Tag** - de naam van het element, bijv. "interface".\n- **Tekstinhoud** - de tekst binnen het element, voor zover aanwezig, bijv. "22.0" bij een lengte.\n- **Attributen** - de eigenlijke gegevens, als tabel van naam en waarde. Bij de regel interface "~YD7001" address=37 staan daar dus de twee regels name = ~YD7001 en address = 37.\n\nEen dubbelklik in de kolom **Waarde** maakt de cel bewerkbaar, Enter neemt de wijziging over. Alleen de **waarden** kunnen worden gewijzigd: de tag en de attribuutnaam leggen de structuur van het bestand vast en worden daarom alleen getoond. Om dezelfde reden kunnen hier ook geen attributen worden toegevoegd of verwijderd. Een leeggemaakte waarde blijft als leeg attribuut bestaan.\n\nEen vast schema is er daarbij niet: elk element heeft zijn eigen attributen, sommige hebben daarnaast een tekstinhoud. Daarom is de tabel bewust algemeen gehouden en toont ze altijd precies wat er op de geselecteerde regel werkelijk aanwezig is.\n\nEen uitzondering is de knoop **configuration** bij **Locomotieven** en **Wagons**: daar verschijnt in plaats van de attributentabel de gespecialiseerde configuratietabel met Nr, Waarde, Type en Beschrijving. Tegelijk verschijnt boven de data-explorer de knop **In eigen venster bewerken** - die opent dezelfde waarden in een grote tabel met meer ruimte en bediening via het toetsenbord.
help.explorerText.fr=La colonne centrale d'un onglet de catégorie affiche l'**explorateur de données** : l'arborescence complète de l'entrée sélectionnée à gauche, exactement telle qu'elle figure dans le fichier.\n\n- Un clic sur le **triangle** devant une ligne déplie et replie les données situées en dessous. Les lignes sans triangle n'ont pas de sous-données.\n- Un clic sur la **ligne elle-même** la sélectionne. Si l'option **Modifier les données** est cochée sous Préférences → Affichage, la zone voisine affiche les données de cette ligne précise - et c'est là qu'elles peuvent être modifiées.\n- Un **clic droit** sur une ligne propose **Modifier** et **Export**. Modifier permet de changer ces entrées - à utiliser avec la plus grande prudence !\n\nLa zone **Modifier les données** affiche :\n- **Balise** - le nom de l'élément, p. ex. "interface".\n- **Contenu texte** - le texte à l'intérieur de l'élément, s'il y en a un, p. ex. "22.0" pour une longueur.\n- **Attributs** - les données proprement dites, sous forme de tableau nom/valeur. Pour la ligne interface "~YD7001" address=37, on y trouve donc les deux lignes name = ~YD7001 et address = 37.\n\nUn double-clic dans la colonne **Valeur** rend la cellule modifiable, la touche Entrée valide la modification. Seules les **valeurs** peuvent être modifiées : la balise et le nom de l'attribut définissent la structure du fichier et ne sont donc qu'affichés. Pour la même raison, il n'est pas possible d'ajouter ni de supprimer des attributs ici. Une valeur vidée reste comme attribut vide.\n\nIl n'existe pas de schéma fixe : chaque élément a ses propres attributs, certains ont en plus un contenu texte. Le tableau est donc volontairement générique et affiche toujours exactement ce qui est réellement présent sur la ligne sélectionnée.\n\nLe nœud **configuration** sous **Locomotives** et **Wagons** fait exception : à la place du tableau des attributs y apparaît le tableau de configuration spécialisé avec N°, Valeur, Type et Description. Au même moment, le bouton **Modifier dans une fenêtre séparée** apparaît au-dessus de l'explorateur de données - il ouvre les mêmes valeurs dans un grand tableau offrant plus de place et un pilotage au clavier.
help.explorerText.es=La columna central de una pestaña de categoría muestra el **explorador de datos**: la estructura de árbol completa de la entrada seleccionada a la izquierda, exactamente tal y como está en el archivo.\n\n- Un clic en el **triángulo** delante de una fila despliega y vuelve a plegar los datos situados debajo. Las filas sin triángulo no tienen más subdatos.\n- Un clic en la **propia fila** la selecciona. Si en Preferencias → Vista está marcada la opción **Modificar datos**, la zona contigua muestra los datos exactamente de esa fila, y allí también pueden modificarse.\n- Un **clic derecho** sobre una fila ofrece **Editar** y **Exportar**. Editar permite modificar estas entradas: ¡utilícelo con sumo cuidado!\n\nLa zona **Modificar datos** muestra:\n- **Etiqueta**: el nombre del elemento, p. ej. "interface".\n- **Contenido de texto**: el texto dentro del elemento, si lo hay, p. ej. "22.0" en una longitud.\n- **Atributos**: los datos propiamente dichos, como tabla de nombre y valor. Para la fila interface "~YD7001" address=37 aparecen, por tanto, las dos filas name = ~YD7001 y address = 37.\n\nUn doble clic en la columna **Valor** hace editable la celda; la tecla Intro aplica el cambio. Solo pueden modificarse los **valores**: la etiqueta y el nombre del atributo definen la estructura del archivo y por eso únicamente se muestran. Por la misma razón, aquí tampoco pueden crearse ni eliminarse atributos. Un valor que se deja vacío se conserva como atributo vacío.\n\nNo existe un esquema fijo: cada elemento tiene sus propios atributos y algunos, además, un contenido de texto. Por eso la tabla es deliberadamente genérica y muestra siempre exactamente lo que realmente hay en la fila seleccionada.\n\nUna excepción es el nodo **configuration** en **Locomotoras** y **Vagones**: allí, en lugar de la tabla de atributos, aparece la tabla de configuración especializada con N.º, Valor, Tipo y Descripción. Al mismo tiempo aparece sobre el explorador de datos el botón **Editar en una ventana propia**, que abre esos mismos valores en una tabla grande con más espacio y manejo por teclado.
help.explorerText.it=La colonna centrale di una scheda di categoria mostra l'**Esplora dati**: l'intera struttura ad albero della voce selezionata a sinistra, esattamente come si trova nel file.\n\n- Un clic sul **triangolo** davanti a una riga apre e richiude i dati sottostanti. Le righe senza triangolo non hanno ulteriori sotto-dati.\n- Un clic sulla **riga stessa** la seleziona. Se in Preferenze → Visualizzazione è spuntata la voce **Modifica dati**, l'area accanto mostra i dati esattamente di quella riga - ed è lì che possono essere modificati.\n- Un **clic destro** su una riga offre **Modifica** ed **Esporta**. Modifica consente di cambiare queste voci: da usare con la massima cautela!\n\nL'area **Modifica dati** mostra:\n- **Tag**: il nome dell'elemento, ad es. "interface".\n- **Contenuto testo**: il testo all'interno dell'elemento, se presente, ad es. "22.0" per una lunghezza.\n- **Attributi**: i dati veri e propri, come tabella di nome e valore. Per la riga interface "~YD7001" address=37 vi si trovano quindi le due righe name = ~YD7001 e address = 37.\n\nUn doppio clic nella colonna **Valore** rende la cella modificabile, Invio conferma la modifica. Si possono modificare esclusivamente i **valori**: il tag e il nome dell'attributo definiscono la struttura del file e vengono quindi solo mostrati. Per lo stesso motivo qui non è possibile né creare né eliminare attributi. Un valore svuotato resta come attributo vuoto.\n\nNon esiste uno schema fisso: ogni elemento ha i propri attributi e alcuni hanno in più un contenuto testo. Per questo la tabella è volutamente generica e mostra sempre esattamente ciò che è realmente presente nella riga selezionata.\n\nFa eccezione il nodo **configuration** in **Locomotive** e **Vagoni**: lì, al posto della tabella degli attributi, compare la tabella di configurazione specializzata con Nr, Valore, Tipo e Descrizione. Allo stesso tempo, sopra l'esploratore dati compare il pulsante **Modifica in una finestra separata**, che apre gli stessi valori in una tabella grande con più spazio e uso da tastiera.
help.explorerText.pt=A coluna central de um separador de categoria mostra o **explorador de dados**: a estrutura em árvore completa da entrada selecionada à esquerda, exatamente como está no ficheiro.\n\n- Um clique no **triângulo** à frente de uma linha expande e volta a fechar os dados que estão por baixo. As linhas sem triângulo não têm mais subdados.\n- Um clique na **própria linha** seleciona-a. Se em Preferências → Vista estiver assinalada a opção **Alterar Dados**, a área ao lado mostra os dados exatamente dessa linha - e é aí que podem ser alterados.\n- Um **clique com o botão direito** numa linha oferece **Editar** e **Exportar**. Editar permite alterar estas entradas - use com a máxima precaução!\n\nA área **Alterar Dados** mostra:\n- **Tag** - o nome do elemento, p. ex. "interface".\n- **Conteúdo de Texto** - o texto dentro do elemento, caso exista, p. ex. "22.0" num comprimento.\n- **Atributos** - os dados propriamente ditos, como tabela de nome e valor. Para a linha interface "~YD7001" address=37 encontram-se aí, portanto, as duas linhas name = ~YD7001 e address = 37.\n\nUm duplo clique na coluna **Valor** torna a célula editável; a tecla Enter aplica a alteração. Só podem ser alterados os **valores**: a tag e o nome do atributo definem a estrutura do ficheiro e por isso são apenas apresentados. Pela mesma razão, aqui também não é possível criar nem eliminar atributos. Um valor deixado vazio mantém-se como atributo vazio.\n\nNão existe um esquema fixo: cada elemento tem os seus próprios atributos e alguns têm ainda um conteúdo de texto. Por isso a tabela é propositadamente genérica e mostra sempre exatamente aquilo que realmente existe na linha selecionada.\n\nUma exceção é o nó **configuration** em **Locomotivas** e **Vagões**: aí, em vez da tabela de atributos, aparece a tabela de configuração especializada com N.º, Valor, Tipo e Descrição. Ao mesmo tempo surge por cima do explorador de dados o botão **Editar numa janela própria**, que abre esses mesmos valores numa tabela grande com mais espaço e utilização pelo teclado.
help.explorerText.pl=Środkowa kolumna karty kategorii pokazuje **eksplorator danych**: pełną strukturę drzewa wpisu zaznaczonego po lewej stronie, dokładnie w takiej postaci, w jakiej znajduje się w pliku.\n\n- Kliknięcie **trójkąta** przed wierszem rozwija i ponownie zwija znajdujące się pod nim dane. Wiersze bez trójkąta nie mają dalszych danych podrzędnych.\n- Kliknięcie **samego wiersza** zaznacza go. Jeśli w Preferencje → Widok zaznaczona jest pozycja **Zmień Dane**, obszar obok pokazuje dane dokładnie tego wiersza - i tam można je również zmienić.\n- **Kliknięcie prawym przyciskiem** na wierszu daje **Edytuj** i **Eksportuj**. Edycja pozwala zmieniać te wpisy - proszę zachować najwyższą ostrożność!\n\nW obszarze **Zmień Dane** wyświetlane są:\n- **Tag** - nazwę elementu, np. "interface".\n- **Zawartość Tekstową** - tekst wewnątrz elementu, o ile występuje, np. "22.0" przy długości.\n- **Atrybuty** - właściwe dane, w postaci tabeli nazwa/wartość. Dla wiersza interface "~YD7001" address=37 znajdują się tam więc dwa wiersze: name = ~YD7001 oraz address = 37.\n\nDwukrotne kliknięcie w kolumnie **Wartość** umożliwia edycję komórki, klawisz Enter zatwierdza zmianę. Zmieniać można wyłącznie **wartości**: tag oraz nazwa atrybutu określają strukturę pliku i dlatego są tylko wyświetlane. Z tego samego powodu nie można tu również dodawać ani usuwać atrybutów. Opróżniona wartość pozostaje jako pusty atrybut.\n\nNie ma przy tym stałego schematu: każdy element ma własne atrybuty, a niektóre mają dodatkowo zawartość tekstową. Dlatego tabela jest celowo uniwersalna i pokazuje zawsze dokładnie to, co rzeczywiście występuje w zaznaczonym wierszu.\n\nWyjątkiem jest węzeł **configuration** przy **Lokomotywach** i **Wagonach**: zamiast tabeli atrybutów pojawia się tam wyspecjalizowana tabela konfiguracji z kolumnami Nr, Wartość, Typ i Opis. Jednocześnie nad eksploratorem danych pojawia się przycisk **Edytuj w osobnym oknie** - otwiera te same wartości w dużej tabeli z większą przestrzenią i obsługą klawiaturą.
help.explorerText.da=Den midterste kolonne i en kategorifane viser **datastifinderen**: hele træstrukturen for den post, der er valgt til venstre, præcis som den står i filen.\n\n- Et klik på **trekanten** foran en række folder de underliggende data ud og sammen igen. Rækker uden trekant har ingen yderligere underdata.\n- Et klik på **selve rækken** vælger den. Er punktet **Rediger Data** sat under Præferencer → Visning, viser området ved siden af netop denne rækkes data - og der kan de også ændres.\n- **Højreklik** på en række giver **Rediger** og **Eksport**. Rediger tillader, at disse poster ændres - vær yderst forsigtig!\n\nOmrådet **Rediger Data** viser:\n- **Tag** - elementets navn, f.eks. "interface".\n- **Tekstindhold** - teksten inde i elementet, hvis der er nogen, f.eks. "22.0" ved en længde.\n- **Attributter** - de egentlige data, som en tabel med navn og værdi. Ved rækken interface "~YD7001" address=37 står der altså de to rækker name = ~YD7001 og address = 37.\n\nEt dobbeltklik i kolonnen **Værdi** gør cellen redigerbar, Enter bekræfter ændringen. Kun **værdierne** kan ændres: tagget og attributnavnet fastlægger filens struktur og vises derfor kun. Af samme grund kan der her hverken oprettes eller slettes attributter. En værdi, der er gjort tom, bevares som en tom attribut.\n\nDer findes ikke noget fast skema: hvert element har sine egne attributter, og nogle har derudover et tekstindhold. Derfor er tabellen bevidst holdt generel og viser altid præcis det, der faktisk findes på den valgte række.\n\nEn undtagelse er knuden **configuration** ved **Lokomotiver** og **Vogne**: der vises i stedet for attributtabellen den specialiserede konfigurationstabel med Nr, Værdi, Type og Beskrivelse. Samtidig dukker knappen **Rediger i et separat vindue** op over datastifinderen - den åbner de samme værdier i en stor tabel med mere plads og betjening via tastaturet.
help.explorerText.sv=Mittkolumnen i en kategoriflik visar **datautforskaren**: hela trädstrukturen för den post som är vald till vänster, exakt som den står i filen.\n\n- Ett klick på **triangeln** framför en rad fäller ut och ihop de underliggande uppgifterna. Rader utan triangel har inga ytterligare underdata.\n- Ett klick på **själva raden** markerar den. Är punkten **Ändra Data** ikryssad under Preferenser → Visning visar området bredvid uppgifterna för just den raden - och där går de också att ändra.\n- **Högerklick** på en rad ger **Redigera** och **Export**. Redigera tillåter att dessa poster ändras - var ytterst försiktig!\n\nOmrådet **Ändra Data** visar:\n- **Tagg** - elementets namn, t.ex. "interface".\n- **Textinnehåll** - texten inuti elementet, om det finns någon, t.ex. "22.0" vid en längd.\n- **Attribut** - själva uppgifterna, som en tabell med namn och värde. Vid raden interface "~YD7001" address=37 står det alltså de två raderna name = ~YD7001 och address = 37.\n\nEtt dubbelklick i kolumnen **Värde** gör cellen redigerbar, Retur bekräftar ändringen. Endast **värdena** kan ändras: taggen och attributnamnet bestämmer filens struktur och visas därför bara. Av samma skäl går det inte heller att lägga till eller ta bort attribut här. Ett värde som tömts behålls som ett tomt attribut.\n\nNågot fast schema finns inte: varje element har sina egna attribut, och vissa har dessutom ett textinnehåll. Därför är tabellen medvetet allmänt hållen och visar alltid exakt det som faktiskt finns på den markerade raden.\n\nEtt undantag är noden **configuration** vid **Lok** och **Vagnar**: där visas i stället för attributtabellen den specialiserade konfigurationstabellen med Nr, Värde, Typ och Beskrivning. Samtidigt dyker knappen **Redigera i eget fönster** upp ovanför datautforskaren - den öppnar samma värden i en stor tabell med mer plats och tangentbordsstyrning.

