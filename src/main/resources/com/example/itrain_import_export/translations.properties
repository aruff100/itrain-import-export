editor.configEditWindowHint.de=Öffnet dieselben CV-Werte in einem großen Fenster: mehr Platz, Tastaturbedienung (Tippen beginnt die Eingabe, Tabulator und Pfeiltasten springen weiter) und Einfügen aus der Zwischenablage. Übernommen wird erst auf Knopfdruck; Rückgängig nimmt die Änderung zurück.
editor.configEditWindowHint.en=Opens the same CV values in a large window: more room, keyboard operation (typing starts the entry, Tab and the arrow keys move on) and pasting from the clipboard. Nothing is applied until you press the button; Undo reverts the change.
editor.configEditWindowHint.nl=Opent dezelfde CV-waarden in een groot venster: meer ruimte, bediening via het toetsenbord (typen begint de invoer, Tab en de pijltjestoetsen springen verder) en plakken vanaf het klembord. Er wordt pas overgenomen op knopdruk; Ongedaan maken neemt de wijziging terug.
editor.configEditWindowHint.fr=Ouvre les mêmes valeurs CV dans une grande fenêtre : plus de place, pilotage au clavier (la frappe démarre la saisie, tabulation et flèches poursuivent) et collage depuis le presse-papiers. Rien n'est appliqué avant d'appuyer sur le bouton ; Annuler revient en arrière.
editor.configEditWindowHint.es=Abre los mismos valores CV en una ventana grande: más espacio, manejo con el teclado (al teclear comienza la entrada; el tabulador y las flechas avanzan) y pegado desde el portapapeles. No se aplica nada hasta pulsar el botón; Deshacer revierte el cambio.
editor.configEditWindowHint.it=Apre gli stessi valori CV in una finestra grande: più spazio, uso da tastiera (digitando inizia l'inserimento, tabulatore e frecce proseguono) e incolla dagli appunti. Nulla viene applicato finché non premi il pulsante; Annulla ripristina la modifica.
editor.configEditWindowHint.pt=Abre os mesmos valores CV numa janela grande: mais espaço, utilização pelo teclado (ao escrever inicia-se a introdução; o tabulador e as setas avançam) e colagem da área de transferência. Nada é aplicado até premir o botão; Anular reverte a alteração.
editor.configEditWindowHint.pl=Otwiera te same wartości CV w dużym oknie: więcej miejsca, obsługa klawiaturą (pisanie rozpoczyna wprowadzanie, tabulator i strzałki idą dalej) oraz wstawianie ze schowka. Nic nie jest przejmowane, dopóki nie naciśniesz przycisku; Cofnij wycofuje zmianę.
editor.configEditWindowHint.da=Åbner de samme CV-værdier i et stort vindue: mere plads, betjening med tastaturet (indtastningen begynder, når du skriver; tabulator og piletaster går videre) og indsættelse fra udklipsholderen. Der overtages først ved tryk på knappen; Fortryd tager ændringen tilbage.
editor.configEditWindowHint.sv=Öppnar samma CV-värden i ett stort fönster: mer plats, tangentbordsstyrning (inmatningen börjar när du skriver; tabb och piltangenter går vidare) och inklistring från urklipp. Inget tas över förrän du trycker på knappen; Ångra tar tillbaka ändringen.

