help.decoderHintsText.de=Vor der ersten Decoder-Bearbeitung erscheint ein Hinweisfenster. Es fasst zusammen, was die Funktion tut und worauf zu achten ist.\nUnten steht ein Ankreuzfeld **Hinweise nicht mehr anzeigen**; wieder einschalten lässt sich der Text unter **Voreinstellungen → Ansicht → Decoder-Hinweise anzeigen**.\nBeide Stellen schreiben dieselbe Einstellung.\n\n**Was darin steht (Auszug)**\n\n- Decoder-Vorlagen sind CV-Tabellen eines Decoder-Typs. Statt jede CV von Hand einzutippen, übernimmst du eine Vorlage in eine Lokomotive oder einen Wagen und passt nur noch an, was bei deinem Fahrzeug abweicht.\n- Die mitgelieferten Vorlagen sind **über ein Skript aus den Hersteller-PDFs abgeleitet. Der Inhalt muss daher nicht stimmen. Bitte vor Gebrauch prüfen**\n- **Die Digital-Adresse bleibt deine Sache.** Eine Vorlage bringt die Werte des Decoder-Typs mit, nicht die deines Fahrzeugs. CV 1 - und bei langer Adresse CV 17/18 - nach dem Einlesen prüfen, sonst fahren mehrere Loks auf derselben Adresse. Zu korrigieren ist das in iTrain; empfehlenswert ist, alle Werte über das Programmiergleis oder mit POM auszulesen und damit zu aktualisieren.\n- **Das Programm schreibt nichts auf den Decoder und liest nichts aus ihm.** Geändert wird ausschließlich die iTrain-Datei; das Aufspielen übernimmt weiterhin iTrain oder deine Zentrale.\n- **Vor dem Ausprobieren eine Kopie der Anlagendatei anlegen.** Das Programm sichert zwar vor jedem Öffnen automatisch, aber eine eigene Kopie an einer Stelle, die du kennst, beruhigt beim ersten Mal mehr.
help.decoderHintsText.en=Before the first decoder edit, a notice window appears. It summarizes what the function does and what to watch out for.\nAt the bottom there is a checkbox **Don't show hints again**; the text can be switched back on under **Preferences → View → Show decoder hints**.\nBoth places write the same setting.\n\n**What it says (excerpt)**\n\n- Decoder templates are CV tables for a decoder type. Instead of typing in every CV by hand, you apply a template to a locomotive or wagon and only adjust what differs for your vehicle.\n- The bundled templates are **derived from the manufacturers' PDFs via a script. The content may therefore not be correct. Please check before use**\n- **The digital address remains your responsibility.** A template brings the values of the decoder type, not those of your vehicle. Check CV 1 - and, for a long address, CV 17/18 - after reading it in, otherwise several locomotives will run on the same address. This is corrected in iTrain; it is recommended to read out all values via the programming track or with POM and update them accordingly.\n- **The program writes nothing to the decoder and reads nothing from it.** Only the iTrain file is changed; uploading is still done by iTrain or your control station.\n- **Make a copy of the layout file before trying this out.** The program does back up automatically before every opening, but your own copy in a place you know is more reassuring the first time.
help.decoderHintsText.nl=Vóór de eerste decoderbewerking verschijnt een hintvenster. Het vat samen wat de functie doet en waar op gelet moet worden.\nOnderaan staat een aankruisvakje **Hints niet meer tonen**; de tekst kan weer worden aangezet onder **Voorkeuren → Weergave → Decoderhints tonen**.\nBeide plekken schrijven dezelfde instelling.\n\n**Wat erin staat (uittreksel)**\n\n- Decodersjablonen zijn CV-tabellen van een decodertype. In plaats van elke CV met de hand in te typen, neem je een sjabloon over in een locomotief of wagon en pas je alleen aan wat bij jouw voertuig afwijkt.\n- De meegeleverde sjablonen zijn **via een script afgeleid uit de fabrikants-pdf's. De inhoud hoeft daarom niet te kloppen. Controleer dit vóór gebruik**\n- **Het digitale adres blijft jouw zaak.** Een sjabloon brengt de waarden van het decodertype mee, niet die van jouw voertuig. Controleer CV 1 - en bij een lang adres CV 17/18 - na het inlezen, anders rijden meerdere locs op hetzelfde adres. Dit corrigeer je in iTrain; het is aan te raden alle waarden via het programmeerspoor of met POM uit te lezen en zo bij te werken.\n- **Het programma schrijft niets naar de decoder en leest er niets uit.** Alleen het iTrain-bestand wordt gewijzigd; het opspelen blijft de taak van iTrain of jouw centrale.\n- **Maak vóór het uitproberen een kopie van het anlagebestand.** Het programma maakt weliswaar automatisch een back-up vóór elke opening, maar een eigen kopie op een plek die je kent, stelt de eerste keer meer gerust.
help.decoderHintsText.fr=Avant la première modification de décodeur, une fenêtre d'information apparaît. Elle résume ce que fait la fonction et à quoi il faut faire attention.\nEn bas se trouve une case à cocher **Ne plus afficher les indications** ; le texte peut être réactivé sous **Préférences → Affichage → Afficher les indications sur les décodeurs**.\nLes deux endroits écrivent le même paramètre.\n\n**Ce qu'elle contient (extrait)**\n\n- Les modèles de décodeur sont des tableaux de CV pour un type de décodeur donné. Au lieu de taper chaque CV à la main, tu reprends un modèle dans une locomotive ou un wagon et tu n'ajustes plus que ce qui diffère pour ton véhicule.\n- Les modèles fournis sont **dérivés des PDF des fabricants via un script. Le contenu peut donc être inexact. Merci de vérifier avant utilisation**\n- **L'adresse numérique reste ton affaire.** Un modèle apporte les valeurs du type de décodeur, pas celles de ton véhicule. Vérifie CV 1 - et, pour une adresse longue, CV 17/18 - après la lecture, sinon plusieurs locomotives rouleront sur la même adresse. Cela se corrige dans iTrain ; il est recommandé de lire toutes les valeurs via la voie de programmation ou avec POM et de les mettre à jour en conséquence.\n- **Le programme n'écrit rien sur le décodeur et n'y lit rien.** Seul le fichier iTrain est modifié ; le chargement reste assuré par iTrain ou ta centrale.\n- **Fais une copie du fichier de réseau avant d'essayer.** Le programme effectue certes une sauvegarde automatique avant chaque ouverture, mais une copie personnelle dans un endroit que tu connais est plus rassurante la première fois.
help.decoderHintsText.es=Antes de la primera edición de un decodificador aparece una ventana de aviso. Resume lo que hace la función y en qué hay que fijarse.\nAbajo hay una casilla **No volver a mostrar avisos**; el texto se puede volver a activar en **Preferencias → Vista → Mostrar avisos de decodificador**.\nAmbos lugares escriben el mismo ajuste.\n\n**Lo que dice (extracto)**\n\n- Las plantillas de decodificador son tablas de CV de un tipo de decodificador. En lugar de escribir cada CV a mano, aplicas una plantilla a una locomotora o vagón y solo ajustas lo que difiera en tu vehículo.\n- Las plantillas incluidas se **derivan mediante un script a partir de los PDF de los fabricantes. Por eso el contenido puede no ser correcto. Compruébelo antes de usarlo**\n- **La dirección digital sigue siendo asunto tuyo.** Una plantilla trae los valores del tipo de decodificador, no los de tu vehículo. Comprueba CV 1 - y, con dirección larga, CV 17/18 - después de leerla, de lo contrario varias locomotoras circularán con la misma dirección. Esto se corrige en iTrain; se recomienda leer todos los valores mediante la vía de programación o con POM y actualizarlos en consecuencia.\n- **El programa no escribe nada en el decodificador ni lee nada de él.** Solo se modifica el archivo iTrain; la carga sigue siendo tarea de iTrain o de tu central.\n- **Haz una copia del archivo de la maqueta antes de probarlo.** El programa hace una copia de seguridad automática antes de cada apertura, pero tener tu propia copia en un lugar que conoces tranquiliza más la primera vez.
help.decoderHintsText.it=Prima della prima modifica di un decoder appare una finestra di avviso. Riassume ciò che fa la funzione e a cosa prestare attenzione.\nIn basso c'è una casella **Non mostrare più gli avvisi**; il testo può essere riattivato in **Preferenze → Visualizzazione → Mostra suggerimenti sui decoder**.\nEntrambi i punti scrivono la stessa impostazione.\n\n**Cosa contiene (estratto)**\n\n- I modelli di decoder sono tabelle CV di un tipo di decoder. Invece di digitare ogni CV a mano, applichi un modello a una locomotiva o a un carro e adatti solo ciò che è diverso nel tuo veicolo.\n- I modelli forniti sono **derivati tramite uno script dai PDF dei produttori. Il contenuto potrebbe quindi non essere corretto. Si prega di verificare prima dell'uso**\n- **L'indirizzo digitale resta un tuo compito.** Un modello porta i valori del tipo di decoder, non quelli del tuo veicolo. Controlla CV 1 - e, con indirizzo lungo, CV 17/18 - dopo la lettura, altrimenti più locomotive circoleranno con lo stesso indirizzo. Questo si corregge in iTrain; è consigliabile leggere tutti i valori tramite il binario di programmazione o con POM e aggiornarli di conseguenza.\n- **Il programma non scrive nulla sul decoder e non legge nulla da esso.** Viene modificato esclusivamente il file iTrain; il caricamento resta compito di iTrain o della tua centrale.\n- **Prima di provare, crea una copia del file dell'impianto.** Il programma esegue sì un backup automatico prima di ogni apertura, ma una copia personale in un luogo che conosci rassicura di più la prima volta.
help.decoderHintsText.pt=Antes da primeira edição de um descodificador aparece uma janela de aviso. Resume o que a função faz e a que se deve prestar atenção.\nEm baixo há uma caixa **Não mostrar mais os avisos**; o texto pode ser reativado em **Preferências → Visualização → Mostrar dicas de descodificador**.\nAmbos os locais gravam a mesma definição.\n\n**O que lá consta (excerto)**\n\n- Os modelos de descodificador são tabelas CV de um tipo de descodificador. Em vez de digitar cada CV à mão, aplicas um modelo a uma locomotiva ou vagão e ajustas apenas o que difere no teu veículo.\n- Os modelos incluídos são **derivados através de um script a partir dos PDF dos fabricantes. O conteúdo pode, por isso, não estar correto. Verifica antes de usar**\n- **O endereço digital continua a ser da tua responsabilidade.** Um modelo traz os valores do tipo de descodificador, não os do teu veículo. Verifica CV 1 - e, com endereço longo, CV 17/18 - depois de o ler, caso contrário várias locomotivas circularão com o mesmo endereço. Isto corrige-se no iTrain; recomenda-se ler todos os valores através da via de programação ou com POM e atualizá-los em conformidade.\n- **O programa não escreve nada no descodificador nem lê nada dele.** É alterado exclusivamente o ficheiro iTrain; o carregamento continua a ser feito pelo iTrain ou pela tua central.\n- **Faz uma cópia do ficheiro da maquete antes de experimentar.** O programa faz, de facto, uma cópia de segurança automática antes de cada abertura, mas ter a tua própria cópia num local que conheces tranquiliza mais da primeira vez.
help.decoderHintsText.pl=Przed pierwszą edycją dekodera pojawia się okno ze wskazówkami. Podsumowuje ono, co robi ta funkcja i na co należy zwrócić uwagę.\nU dołu znajduje się pole wyboru **Nie pokazuj już wskazówek**; tekst można ponownie włączyć w **Preferencjach → Widok → Pokazuj wskazówki o dekoderach**.\nOba miejsca zapisują to samo ustawienie.\n\n**Co tam napisano (fragment)**\n\n- Szablony dekoderów to tabele CV dla danego typu dekodera. Zamiast wpisywać każdą CV ręcznie, przenosisz szablon do lokomotywy lub wagonu i dostosowujesz tylko to, co różni się w twoim pojeździe.\n- Dołączone szablony zostały **wyprowadzone skryptem z PDF-ów producentów. Zawartość może więc być niepoprawna. Proszę sprawdzić przed użyciem**\n- **Adres cyfrowy pozostaje twoją sprawą.** Szablon przynosi wartości typu dekodera, a nie twojego pojazdu. Sprawdź CV 1 - a przy długim adresie CV 17/18 - po wczytaniu, w przeciwnym razie kilka lokomotyw będzie jeździć pod tym samym adresem. Poprawia się to w iTrain; zalecane jest odczytanie wszystkich wartości przez tor programujący lub przez POM i ich zaktualizowanie.\n- **Program niczego nie zapisuje w dekoderze ani z niego nie odczytuje.** Zmieniany jest wyłącznie plik iTrain; wgranie nadal wykonuje iTrain lub twoja centrala.\n- **Przed wypróbowaniem utwórz kopię pliku układu.** Program wprawdzie tworzy automatyczną kopię zapasową przed każdym otwarciem, ale własna kopia w znanym ci miejscu daje więcej spokoju za pierwszym razem.
help.decoderHintsText.da=Før den første dekoderredigering vises et hintvindue. Det opsummerer, hvad funktionen gør, og hvad man skal være opmærksom på.\nNederst er der et afkrydsningsfelt **Vis ikke hints igen**; teksten kan slås til igen under **Præferencer → Visning → Vis dekoder-hints**.\nBegge steder skriver den samme indstilling.\n\n**Hvad der står i den (uddrag)**\n\n- Dekoderskabeloner er CV-tabeller for en dekodertype. I stedet for at skrive hver CV ind manuelt overfører du en skabelon til et lokomotiv eller en vogn og tilpasser kun det, der afviger ved dit køretøj.\n- De medfølgende skabeloner er **udledt via et script fra producenternes pdf'er. Indholdet behøver derfor ikke være korrekt. Kontrollér venligst før brug**\n- **Digitaladressen er stadig dit ansvar.** En skabelon bringer værdierne for dekodertypen med, ikke dit køretøjs. Kontrollér CV 1 - og ved lang adresse CV 17/18 - efter indlæsningen, ellers kører flere lokomotiver på samme adresse. Det rettes i iTrain; det anbefales at udlæse alle værdier via programmeringssporet eller med POM og opdatere dem tilsvarende.\n- **Programmet skriver intet til dekoderen og læser intet fra den.** Kun iTrain-filen ændres; selve overførslen varetages fortsat af iTrain eller din centralenhed.\n- **Lav en kopi af anlægsfilen, før du prøver det.** Programmet sikkerhedskopierer ganske vist automatisk før hver åbning, men en egen kopi et sted, du kender, giver mere ro første gang.
help.decoderHintsText.sv=Innan den första dekoderredigeringen visas ett meddelandefönster. Det sammanfattar vad funktionen gör och vad man bör tänka på.\nNederst finns en kryssruta **Visa inte tips igen**; texten kan slås på igen under **Alternativ → Visning → Visa dekodertips**.\nBåda ställena skriver samma inställning.\n\n**Vad den innehåller (utdrag)**\n\n- Dekodermallar är CV-tabeller för en dekodertyp. I stället för att skriva in varje CV för hand för du över en mall till ett lok eller en vagn och anpassar bara det som avviker för ditt fordon.\n- De medföljande mallarna är **härledda via ett skript från tillverkarnas PDF-filer. Innehållet behöver därför inte stämma. Kontrollera före användning**\n- **Digitaladressen är fortfarande din sak.** En mall tar med sig värdena för dekodertypen, inte för ditt fordon. Kontrollera CV 1 - och vid lång adress CV 17/18 - efter inläsningen, annars kör flera lok på samma adress. Det korrigeras i iTrain; det rekommenderas att läsa av alla värden via programmeringsspåret eller med POM och uppdatera dem därefter.\n- **Programmet skriver inget till dekodern och läser inget från den.** Endast iTrain-filen ändras; uppspelningen sköts fortfarande av iTrain eller din central.\n- **Gör en kopia av anläggningsfilen innan du provar.** Programmet säkerhetskopierar visserligen automatiskt före varje öppning, men en egen kopia på ett ställe du känner till ger mer trygghet första gången.


