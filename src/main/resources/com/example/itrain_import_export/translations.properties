capture.pasteHereHint.de=Verteilt den markierten Bereich (sonst die Zwischenablage) ab der ausgewählten Zelle auf mehrere Zeilen. Beginnt eine Zeile mit einer Zahl, gilt diese als CV-Nummer, eine darauf folgende kurze Zahl als Wert, der Rest wird zur Bezeichnung.
