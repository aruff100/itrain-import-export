decoder.installQuestion.de=Die Decoder-Vorlagen sind seit Version 2.5 im Programm enthalten und liegen bereits in Ihrem Decoder-Ordner.\n\nNeuere oder geänderte Vorlagen werden über denselben Link wie das Programm selbst bereitgestellt - als einzelne .csv-Dateien oder als .zip. Nach dem Herunterladen wählen Sie sie mit "Decoder-Datei installieren" aus; ebenso eine selbst erstellte oder zugeschickte Vorlage, auch mehrere auf einmal.
decoder.installQuestion.en=Since version 2.5 the decoder templates are included in the program and are already in your decoder folder.\n\nNewer or changed templates are provided via the same link as the program itself - as individual .csv files or as a .zip. After downloading, select them with "Install decoder file"; likewise a template you created yourself or received, several at once if you like.
decoder.installQuestion.nl=Sinds versie 2.5 zijn de decodersjablonen in het programma opgenomen en staan ze al in uw decodermap.\n\nNieuwere of gewijzigde sjablonen worden via dezelfde link als het programma zelf aangeboden - als losse .csv-bestanden of als .zip. Na het downloaden kiest u ze met "Decoderbestand installeren"; net zo een zelfgemaakt of toegestuurd sjabloon, ook meerdere tegelijk.
decoder.installQuestion.fr=Depuis la version 2.5, les modèles de décodeur sont inclus dans le programme et se trouvent déjà dans votre dossier de décodeurs.\n\nLes modèles plus récents ou modifiés sont fournis via le même lien que le programme lui-même - sous forme de fichiers .csv individuels ou d'un .zip. Après le téléchargement, sélectionnez-les avec « Installer un fichier de décodeur » ; de même pour un modèle créé par vous-même ou reçu, plusieurs à la fois si vous le souhaitez.
decoder.installQuestion.es=Desde la versión 2.5, las plantillas de decodificador están incluidas en el programa y ya se encuentran en su carpeta de decodificadores.\n\nLas plantillas más recientes o modificadas se proporcionan a través del mismo enlace que el propio programa, como archivos .csv individuales o como .zip. Tras la descarga, selecciónelas con "Instalar archivo de decodificador"; igualmente una plantilla creada por usted o recibida, incluso varias a la vez.
decoder.installQuestion.it=Dalla versione 2.5 i modelli di decoder sono inclusi nel programma e si trovano già nella cartella dei decoder.\n\nI modelli più recenti o modificati vengono forniti tramite lo stesso link del programma stesso - come singoli file .csv o come .zip. Dopo il download selezionarli con "Installa file decoder"; allo stesso modo un modello creato da voi o ricevuto, anche più di uno alla volta.
decoder.installQuestion.pt=Desde a versão 2.5, os modelos de descodificador estão incluídos no programa e já se encontram na sua pasta de descodificadores.\n\nModelos mais recentes ou alterados são disponibilizados através da mesma ligação que o próprio programa - como ficheiros .csv individuais ou como .zip. Após a transferência, selecione-os com "Instalar ficheiro de descodificador"; do mesmo modo um modelo criado por si ou recebido, também vários de uma vez.
decoder.installQuestion.pl=Od wersji 2.5 szablony dekoderów są zawarte w programie i znajdują się już w Twoim folderze dekoderów.\n\nNowsze lub zmienione szablony są udostępniane pod tym samym linkiem co sam program - jako pojedyncze pliki .csv lub jako .zip. Po pobraniu wybierz je poleceniem "Zainstaluj plik dekodera"; tak samo szablon utworzony samodzielnie lub otrzymany, także kilka naraz.
decoder.installQuestion.da=Siden version 2.5 er dekoderskabelonerne inkluderet i programmet og ligger allerede i din dekodermappe.\n\nNyere eller ændrede skabeloner stilles til rådighed via det samme link som selve programmet - som enkelte .csv-filer eller som .zip. Efter download vælger du dem med "Installer dekoderfil"; ligeledes en skabelon, du selv har lavet eller fået tilsendt, også flere ad gangen.
decoder.installQuestion.sv=Sedan version 2.5 ingår dekodermallarna i programmet och finns redan i din dekodermapp.\n\nNyare eller ändrade mallar tillhandahålls via samma länk som programmet självt - som enskilda .csv-filer eller som .zip. Efter nedladdningen väljer du dem med "Installera dekoderfil"; likaså en mall du skapat själv eller fått skickad, även flera på en gång.

