editor.decoderSelectOne.de=Bitte genau einen Eintrag markieren - eine Decoder-Konfiguration gehört immer zu genau einem Fahrzeug.
editor.decoderSelectOne.en=Please select exactly one entry - a decoder configuration always belongs to exactly one vehicle.
editor.decoderSelectOne.nl=Selecteer precies één item - een decoderconfiguratie hoort altijd bij precies één voertuig.
editor.decoderSelectOne.fr=Veuillez sélectionner exactement une entrée - une configuration de décodeur appartient toujours à un seul véhicule.
editor.decoderSelectOne.es=Seleccione exactamente una entrada: una configuración de decoder pertenece siempre a un único vehículo.
editor.decoderSelectOne.it=Seleziona esattamente una voce: una configurazione di decoder appartiene sempre a un solo veicolo.
editor.decoderSelectOne.pt=Selecione exatamente uma entrada - uma configuração de descodificador pertence sempre a um único veículo.
editor.decoderSelectOne.pl=Zaznacz dokładnie jeden wpis - konfiguracja dekodera należy zawsze do dokładnie jednego pojazdu.
editor.decoderSelectOne.da=Vælg venligst præcis én post - en dekoderkonfiguration hører altid til præcis ét køretøj.
editor.decoderSelectOne.sv=Välj exakt en post - en dekoderkonfiguration hör alltid till exakt ett fordon.

