editor.decoderSelectOne.fr=Veuillez sélectionner exactement une entrée - une configuration de décodeur appartient toujours à un seul véhicule.
editor.decoderSelectOne.es=Seleccione exactamente una entrada: una configuración de decoder pertenece siempre a un único vehículo.
editor.decoderSelectOne.it=Seleziona esattamente una voce: una configurazione di decoder appartiene sempre a un solo veicolo.
