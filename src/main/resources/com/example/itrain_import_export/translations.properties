help.systemsText.de=Das Fenster **Systeme** liest den Bestand eines Digitalsystems (BiDiB oder ESU ECoS) aus und überführt ihn in eine iTrain-Datei. Oben in der Werkzeugleiste wählt die Klappliste das System (BiDiB/ESU ECoS), daneben stehen **Verbinden** und **Auslesen**; dieselben Funktionen stehen auch im Menü **Systeme** je in einem eigenen Untermenü für BiDiB und ESU. Märklin, Z21, Lokstore und ZIMO sind als Untermenüs schon angelegt, aber noch ohne Funktion.\n\n**1. Verbinden**\n**Systeme → BiDiB → Verbinden...** bzw. **ESU → Verbinden...** öffnet den passenden Verbindungsdialog (siehe die eigenen Hilfeabschnitte zu BiDiB weiter unten bzw. zu ECoS). Mehrere Verbindungen gleichzeitig sind möglich; jede erscheint mit Namen und einem grün/rot leuchtenden Kreis unten rechts in der Statuszeile.\n\n**2. Auslesen**\n**Auslesen** liest den Bestand der gewählten Verbindung:\n- Bei **BiDiB** öffnet sich der **Knotenbaum**: alle gemeldeten Knoten mit ihren Anschlüssen (Rückmelder-, Zubehör- und, bei einer mc2, auch Lokomotiv-Anschlüsse), aufklappbar wie ein Ordnerbaum.\n- Bei **ESU ECoS** entsteht derselbe Baum aus dem gelesenen ECoS-Bestand - Schnittstelle, Zubehör (Weichen/Signale) und Lokomotiven.\n- Sind mehrere Verbindungen offen, fragt ein kleines Klappmenü am Knopf zuerst, welche gemeint ist.\n- Auch ohne aktive Verbindung lässt sich der Baum aus einer bereits gespeicherten System-Datei oder, bei BiDiB, aus der Simulationsdatei des BiDiB-Wizard (.xml) öffnen: **Systeme → BiDiB/ESU → System-Datei laden...**.\n\n**3. Markieren (auswählen)**\nIm Knotenbaum steht vor jedem Knoten, jedem Anschluss-Ordner und jedem einzelnen Anschluss ein **Ankreuzkasten** - nur bei den Merkmalen fehlt er, die sind reine Anzeige. Ein Haken am Knoten oder am Ordner markiert alle seine Anschlüsse gleich mit; der Kasten **Alle auswählen** über dem Baum markiert oder hebt die Markierung für den ganzen Baum auf. Die Statuszeile zählt mit, wie viele Anschlüsse gerade markiert sind.\n\n**4. In die iTrain-Objekte übernehmen**\nDer Knopf **Auswahl übernehmen** macht aus den markierten Anschlüssen fertige iTrain-Objekte und trägt sie in die Tabellen des Systeme-Fensters ein: die Schnittstelle immer, je markiertem Rückmelder-Anschluss einen Rückmelder, je Zubehör-Anschluss ein Zubehör (die Bauform wird dabei einmal abgefragt), je markiertem Booster-Knoten einen Booster, bei ECoS zusätzlich die Lokomotiven. Bereits übernommene Anschlüsse (an derselben iTrain-Kennung erkannt) werden beim erneuten Übernehmen nicht doppelt angelegt.\n\n**5. Objekte bearbeiten**\nUnterhalb der Werkzeugleiste erscheint je Kategorie ein eigener, nur bei vorhandenen Zeilen sichtbarer Abschnitt - **Schnittstelle**, **Booster**, **Rückmelder**, **Zubehör** und, bei ECoS, **Lokomotiven** - jeder mit eigenem Kasten **Alles auswählen** und den Spalten Name im System, Ausgewählt, Neuer Name in iTrain, Beschreibung (landet beim Import im gleichnamigen iTrain-Feld), Zuordnung in iTrain (siehe 5a), Typ (und bei Rückmeldern zusätzlich Länge), Schnittstelle. Typ und Schnittstelle sind bewusst schmal gehalten und lassen sich mit der Maus verbreitern. Bearbeitet wird nicht direkt in der Tabelle (außer dem Haken "Ausgewählt"), sondern in einem eigenen Bearbeitungsfenster - Zeile markieren, dann Eingabetaste, Doppelklick oder der Knopf **Zeile bearbeiten** rechts über der Tabelle. Je Kategorie stehen dort die passenden Felder (z.B. bei Zubehör die zehn iTrain-Weichenbauformen und die Grundstellung, bei Rückmeldern Typ/Seite/Länge, bei Boostern die Grenzwerte für Gleisspannung, Hauptgleis-Strom und Temperatur). Entf oder **Zeile löschen** entfernt markierte Zeilen wieder, **Tabellen löschen** leert alle Tabellen auf einmal (mit Rückfrage) - die geöffnete System-Datei bleibt dabei zugeordnet.\n\n**5a. Mit einer vorhandenen iTrain-Datei abgleichen**\nDer Knopf **iTrain-Datei laden...** (auch im Menü **Datei**) lädt eine vorhandene .tcdz/.tcd als gemeinsame Datei aller Programmteile - sie erscheint auch im Hauptfenster und im Decoder-Fenster. Ist dort bereits eine Datei geladen, gilt sie hier automatisch. Danach ordnet das Programm jede Zeile, die in dieser Datei schon existiert, automatisch zu: Rückmelder, Zubehör und Booster an ihrer BiDiB-Kennung, die Schnittstelle an Namen oder Adresse. Alles andere steht auf **Neu**. In der Spalte **Zuordnung in iTrain** lässt sich jede Zeile von Hand einem vorhandenen Eintrag derselben Kategorie zuordnen oder wieder auf "Neu" stellen.\n- Eine zugeordnete Zeile übernimmt den iTrain-Namen (er ist dann im Bearbeitungsfenster gesperrt, sonst würde der Import den Eintrag nicht wiedererkennen). Beim Export wird der VORHANDENE iTrain-Eintrag geschrieben, in dem nur die BiDiB-Verknüpfung (Kennung, Schnittstelle) und die Beschreibung aktualisiert sind - in iTrain gepflegte Angaben wie Typ, Länge, Optionen oder Belegungen bleiben erhalten. Im Hauptfenster beim Import "Synchronisieren" wählen.\n- Wird die Schnittstelle zugeordnet, übernehmen alle Zeilen den iTrain-Namen der Schnittstelle.\n- "Neu"-Zeilen werden mit dem Namen aus der Spalte **Neuer Name in iTrain** angelegt.\n- **In iTrain-Datei schreiben** übernimmt die markierten Zeilen direkt in die geladene Datei - ganz ohne Exportdateien: zugeordnete Einträge werden an ihrer Stelle aktualisiert, neue angehängt (gleichnamige bekommen "(2)" usw.). Vorher legt das Programm eine Sicherung im Sicherungsordner an; iTrain sollte die Datei dabei nicht geöffnet haben. Die Änderungen sind danach in allen Programmteilen sichtbar und lassen sich mit **Rückgängig** im Hauptfenster zurücknehmen.\n\nDie Spaltenbreiten aller Tabellen lassen sich mit der Maus verändern und werden gemerkt.\n\n**6. Als System-Datei speichern**\nDas Menü **Datei** dieses Fensters (Öffnen/Speichern/Aktuelle schließen) arbeitet auf einer eigenen **System-Datei** (Endung `.bidibsys`, technisch ein ZIP mit einer CSV darin) - nicht auf der iTrain-Datei des Hauptfensters. Darin stehen sowohl der ausgelesene Knotenbaum als auch die schon übernommenen iTrain-Objekte; **Speichern** legt sie im eingestellten Pfad für System-Dateien ab (Voreinstellungen → Pfade), **Öffnen** lädt eine gespeicherte Datei später wieder - praktisch, um ein Auslesen nicht wiederholen zu müssen oder um es an einem anderen Rechner weiterzubearbeiten.\n\n**7. Exportieren und in eine vorhandene iTrain-Datei einfügen**\nWenn die Tabellen die gewünschten Objekte enthalten:\n- **Markierte exportieren** schreibt nur die Zeilen mit Haken in "Ausgewählt" (die Schnittstelle ist immer dabei), **Alles exportieren** schreibt unabhängig vom Haken alle Zeilen.\n- Je Kategorie (Schnittstelle, Booster, Rückmelder, Zubehör, Lokomotiven) entsteht dabei eine eigene **.zip-Datei** - genau das Format, das der Knopf **In Kategorie importieren** im Hauptfenster erwartet. Gefragt wird einmal - mit vorgeschlagenem Namen, der sich ändern lässt und dann als Namensanfang aller Dateien dient. Alle Dateien eines Exports bilden einen **Exportsatz** und sind am gemeinsamen Namensanfang (Schnittstelle + Datum/Uhrzeit) und der Nummer erkennbar, z.B. "IFnet_20261009-1430_1von2_interfaces.zip" und "IFnet_20261009-1430_2von2_feedbacks.zip". Die Nummer ist zugleich die empfohlene Import-Reihenfolge (Schnittstelle zuerst).\n- Im Hauptfenster: die Ziel-iTrain-Datei öffnen (oder eine fast leere Datei rudimentär anlegen, wenn es die erste Übernahme ist), zum passenden Reiter wechseln und dort **In Kategorie importieren** auf die exportierte .zip anwenden - eine Datei je Kategorie, in beliebiger Reihenfolge.\n- Referenzierte Einträge (z.B. die Schnittstelle, auf die ein Rückmelder verweist) sind in jeder Export-Datei mit enthalten, damit iTrain die Zieldatei anschließend ohne Fehlermeldung öffnet.\n\nSo lässt sich auch eine fast leere iTrain-Datei zum Start verwenden: Datei in iTrain nur rudimentär anlegen, hier alles Nötige auslesen und als Import übertragen, danach in iTrain von Hand nachbearbeiten (z.B. die Rückmelder in Gleisabschnitte einbauen).\n\nGröße, Position und Bildschirm des Fensters werden wie bei allen Fenstern gemerkt (siehe Hilfe des Hauptfensters, Abschnitt Fensterverwaltung). Beim Beenden des Programms wird das Fenster mitgeschlossen; sind noch Verbindungen offen, fragt das Programm vorher nach, ob alle getrennt werden sollen.
help.systemsText.en=The **Systems** window reads out the contents of a digital system (BiDiB or ESU ECoS) and transfers them into an iTrain file. At the top of the toolbar, a drop-down list selects the system (BiDiB/ESU ECoS); next to it are **Connect** and **Read out**. The same functions are also available in the **Systems** menu, each in its own submenu for BiDiB and ESU. Märklin, Z21, Lokstore and ZIMO already exist as submenus but are not yet functional.\n\n**1. Connect**\n**Systems → BiDiB → Connect...** or **ESU → Connect...** opens the matching connection dialog (see the dedicated help sections on BiDiB below, or on ECoS). Several connections at the same time are possible; each appears with a name and a green/red circle at the bottom right of the status bar.\n\n**2. Read out**\n**Read out** reads the contents of the selected connection:\n- With **BiDiB**, the **node tree** opens: all reported nodes with their ports (feedback, accessory and, for an mc2, also locomotive ports), expandable like a folder tree.\n- With **ESU ECoS**, the same tree is built from the ECoS data that was read - interface, accessories (turnouts/signals) and locomotives.\n- If several connections are open, a small drop-down menu on the button first asks which one is meant.\n- Even without an active connection, the tree can be opened from an already saved system file, or, for BiDiB, from the simulation file (.xml) of the BiDiB Wizard: **Systems → BiDiB/ESU → Load system file...**.\n\n**3. Select (mark)**\nIn the node tree, a **checkbox** appears in front of every node, every port folder and every individual port - only the properties have none, since those are display-only. A checkmark on the node or on the folder marks all its ports along with it; the **Select all** box above the tree marks or unmarks the whole tree. The status bar keeps a running count of how many ports are currently marked.\n\n**4. Apply to the iTrain objects**\nThe **Apply selection** button turns the marked ports into finished iTrain objects and enters them into the tables of the Systems window: the interface always, one feedback module for each marked feedback port, one accessory for each accessory port (the type is asked for once), one booster for each marked booster node, and for ECoS also the locomotives. Ports that have already been applied (recognized by the same iTrain identifier) are not created a second time when applying again.\n\n**5. Edit objects**\nBelow the toolbar, a separate section appears for each category, shown only when rows exist - **Interface**, **Booster**, **Feedback**, **Accessory** and, for ECoS, **Locomotives** - each with its own **Select all** box and the columns Name in system, Selected, New name in iTrain, Description (goes into the iTrain field of the same name on import), Match in iTrain (see 5a), Type (and, for feedback modules, also Length), Interface. Type and Interface are deliberately kept narrow and can be widened with the mouse. Editing is not done directly in the table (apart from the "Selected" checkmark), but in a separate editing window - mark the row, then press Enter, double-click, or use the **Edit row** button above the table on the right. Each category offers the matching fields there (for example, for accessories the ten iTrain turnout types and the default position; for feedback modules type/side/length; for boosters the limits for track voltage, main track current and temperature). Delete or **Delete row** removes marked rows again, **Clear tables** empties all tables at once (with a confirmation prompt) - the open system file stays associated.\n\n**5a. Matching with an existing iTrain file**\nThe **Load iTrain file...** button (also in the **File** menu) loads an existing .tcdz/.tcd as the shared file of all program parts - it also appears in the main window and the Decoder window. If a file is already loaded there, it applies here automatically. The program then automatically matches every row that already exists in this file: feedback modules, accessories and boosters by their BiDiB identifier, the interface by name or address. Everything else is set to **New**. In the **Match in iTrain** column, every row can be matched by hand to an existing entry of the same category, or set back to "New".\n- A matched row takes over the iTrain name (it is then locked in the editing window, otherwise the import would not recognise the entry). On export, the EXISTING iTrain entry is written, with only the BiDiB link (identifier, interface) and the description updated - settings maintained in iTrain such as type, length, options or occupancy are kept. In the main window, choose "Synchronise" when importing.\n- If the interface is matched, all rows take over the iTrain name of the interface.\n- "New" rows are created with the name from the **New name in iTrain** column.\n- **Write to iTrain file** writes the marked rows directly into the loaded file - without any export files: matched entries are updated in place, new ones appended (entries with the same name get "(2)" etc.). Beforehand the program makes a backup in the backup folder; iTrain should not have the file open. The changes are then visible in all program parts and can be reverted with **Undo** in the main window.\n\nThe column widths of all tables can be changed with the mouse and are remembered.\n\n**6. Save as system file**\nThis window's **File** menu (Open/Save/Close current) works on its own **system file** (extension `.bidibsys`, technically a ZIP containing a CSV) - not on the main window's iTrain file. It holds both the node tree that was read out and the iTrain objects already applied; **Save** stores it in the configured path for system files (Preferences → Paths), **Open** loads a saved file again later - handy so a read-out does not have to be repeated, or so work can continue on a different computer.\n\n**7. Export and insert into an existing iTrain file**\nOnce the tables contain the desired objects:\n- **Export marked** writes only the rows checked as "Selected" (the interface is always included); **Export all** writes all rows regardless of the checkmark.\n- For each category (Interface, Booster, Feedback, Accessory, Locomotives) this creates its own **.zip file** - exactly the format that the **Import into category** button in the main window expects. You are asked only once - with a suggested name, which can be changed and then serves as the start of all file names. All files of one export form an **export set** and can be recognised by the common start of their names (interface + date/time) and the number, e.g. "IFnet_20261009-1430_1of2_interfaces.zip" and "IFnet_20261009-1430_2of2_feedbacks.zip". The number is also the recommended import order (interface first).\n- In the main window: open the target iTrain file (or, if this is the first transfer, create an almost empty file only rudimentarily), switch to the matching tab and there apply **Import into category** to the exported .zip - one file per category, in any order.\n- Referenced entries (e.g. the interface that a feedback module points to) are included in every export file, so that iTrain can afterwards open the target file without an error message.\n\nThis also makes it possible to start from an almost empty iTrain file: create the file in iTrain only rudimentarily, read out everything needed here and transfer it as an import, then finish it by hand in iTrain (e.g. fitting the feedback modules into track sections).\n\nSize, position and screen of the window are remembered as with all windows (see the main window's help, section Window management). When the program is closed, the window is closed along with it; if connections are still open, the program asks beforehand whether all of them should be disconnected.
help.systemsText.nl=Het venster **Systemen** leest de inhoud van een digitaal systeem (BiDiB of ESU ECoS) uit en zet deze over naar een iTrain-bestand. Boven in de werkbalk kiest de keuzelijst het systeem (BiDiB/ESU ECoS), ernaast staan **Verbinden** en **Uitlezen**; dezelfde functies staan ook in het menu **Systemen**, elk in een eigen submenu voor BiDiB en ESU. Märklin, Z21, Lokstore en ZIMO zijn als submenu's al aangelegd, maar nog zonder functie.\n\n**1. Verbinden**\n**Systemen → BiDiB → Verbinden...** resp. **ESU → Verbinden...** opent het bijbehorende verbindingsvenster (zie de eigen hulpparagrafen over BiDiB hieronder resp. over ECoS). Meerdere verbindingen tegelijk zijn mogelijk; elke verbinding verschijnt met naam en een groen/rood brandende cirkel rechtsonder in de statusbalk.\n\n**2. Uitlezen**\n**Uitlezen** leest de inhoud van de gekozen verbinding uit:\n- Bij **BiDiB** opent de **knooppuntenboom**: alle gemelde knooppunten met hun aansluitingen (terugmeld-, accessoire- en, bij een mc2, ook locomotiefaansluitingen), uitklapbaar als een mappenboom.\n- Bij **ESU ECoS** ontstaat dezelfde boom uit het uitgelezen ECoS-bestand - interface, accessoires (wissels/signalen) en locomotieven.\n- Zijn er meerdere verbindingen open, dan vraagt een klein keuzemenu bij de knop eerst welke verbinding bedoeld is.\n- Ook zonder actieve verbinding kan de boom worden geopend vanuit een al opgeslagen systeembestand of, bij BiDiB, vanuit het simulatiebestand (.xml) van de BiDiB Wizard: **Systemen → BiDiB/ESU → Systeembestand laden...**.\n\n**3. Markeren (selecteren)**\nIn de knooppuntenboom staat voor elk knooppunt, elke aansluitingsmap en elke afzonderlijke aansluiting een **aankruisvakje** - alleen bij de kenmerken ontbreekt dit, want die zijn puur ter weergave. Een vinkje bij het knooppunt of bij de map markeert meteen ook al zijn aansluitingen; het vakje **Alles selecteren** boven de boom markeert of demarkeert de hele boom. De statusbalk telt mee hoeveel aansluitingen er op dat moment gemarkeerd zijn.\n\n**4. Overnemen naar iTrain-objecten**\nDe knop **Selectie overnemen** maakt van de gemarkeerde aansluitingen kant-en-klare iTrain-objecten en zet ze in de tabellen van het Systemen-venster: de interface altijd, per gemarkeerde terugmeldaansluiting een terugmelder, per accessoire-aansluiting een accessoire (het bouwtype wordt daarbij eenmalig gevraagd), per gemarkeerd booster-knooppunt een booster, bij ECoS ook nog de locomotieven. Aansluitingen die al eerder zijn overgenomen (herkend aan dezelfde iTrain-code) worden bij opnieuw overnemen niet dubbel aangemaakt.\n\n**5. Objecten bewerken**\nOnder de werkbalk verschijnt per categorie een eigen sectie, die alleen zichtbaar is als er rijen zijn - **Interface**, **Booster**, **Terugmelder**, **Accessoire** en, bij ECoS, **Locomotieven** - elk met een eigen vakje **Alles selecteren** en de kolommen Naam in systeem, Geselecteerd, Nieuwe naam in iTrain, Beschrijving (komt bij het importeren in het gelijknamige iTrain-veld), Koppeling in iTrain (zie 5a), Type (en bij terugmelders ook Lengte), Interface. Type en Interface zijn bewust smal gehouden en kunnen met de muis breder worden gemaakt. Bewerken gebeurt niet rechtstreeks in de tabel (behalve het vinkje "Geselecteerd"), maar in een eigen bewerkingsvenster - rij markeren, dan Enter, dubbelklikken of de knop **Rij bewerken** rechtsboven de tabel. Per categorie staan daar de passende velden (bijv. bij accessoires de tien iTrain-wisselbouwtypes en de basisstand, bij terugmelders type/zijde/lengte, bij boosters de grenswaarden voor railspanning, hoofdrailstroom en temperatuur). Delete of **Rij verwijderen** verwijdert gemarkeerde rijen weer, **Tabellen wissen** maakt alle tabellen in één keer leeg (met bevestigingsvraag) - het geopende systeembestand blijft daarbij gekoppeld.\n\n**5a. Afstemmen met een bestaand iTrain-bestand**\nDe knop **iTrain-bestand laden...** (ook in het menu **Bestand**) laadt een bestaand .tcdz/.tcd als gemeenschappelijk bestand van alle programmadelen - het verschijnt ook in het hoofdvenster en het Decoder-venster. Is daar al een bestand geladen, dan geldt het hier automatisch. Daarna koppelt het programma elke regel die al in dit bestand bestaat automatisch: terugmelders, accessoires en boosters op hun BiDiB-kenmerk, de interface op naam of adres. Al het andere staat op **Nieuw**. In de kolom **Koppeling in iTrain** kan elke regel handmatig aan een bestaand item van dezelfde categorie worden gekoppeld of weer op "Nieuw" worden gezet.\n- Een gekoppelde regel neemt de iTrain-naam over (die is dan in het bewerkingsvenster vergrendeld, anders zou de import het item niet herkennen). Bij het exporteren wordt het BESTAANDE iTrain-item geschreven, waarin alleen de BiDiB-koppeling (kenmerk, interface) en de beschrijving zijn bijgewerkt - in iTrain onderhouden gegevens zoals type, lengte, opties of bezettingen blijven behouden. Kies in het hoofdvenster bij het importeren "Synchroniseren".\n- Wordt de interface gekoppeld, dan nemen alle regels de iTrain-naam van de interface over.\n- "Nieuw"-regels worden aangemaakt met de naam uit de kolom **Nieuwe naam in iTrain**.\n- **Naar iTrain-bestand schrijven** neemt de gemarkeerde regels direct over in het geladen bestand - helemaal zonder exportbestanden: gekoppelde items worden op hun plaats bijgewerkt, nieuwe toegevoegd (gelijknamige krijgen "(2)" enz.). Vooraf maakt het programma een back-up in de back-upmap; iTrain mag het bestand daarbij niet geopend hebben. De wijzigingen zijn daarna in alle programmadelen zichtbaar en kunnen met **Ongedaan maken** in het hoofdvenster worden teruggedraaid.\n\nDe kolombreedtes van alle tabellen kunnen met de muis worden gewijzigd en worden onthouden.\n\n**6. Opslaan als systeembestand**\nHet menu **Bestand** van dit venster (Openen/Opslaan/Huidige sluiten) werkt op een eigen **systeembestand** (extensie `.bidibsys`, technisch een ZIP met daarin een CSV) - niet op het iTrain-bestand van het hoofdvenster. Daarin staan zowel de uitgelezen knooppuntenboom als de al overgenomen iTrain-objecten; **Opslaan** legt het bestand vast in het ingestelde pad voor systeembestanden (Voorkeuren → Paden), **Openen** laadt een opgeslagen bestand later weer - handig om een uitlezing niet te hoeven herhalen of om er op een andere computer aan verder te werken.\n\n**7. Exporteren en invoegen in een bestaand iTrain-bestand**\nWanneer de tabellen de gewenste objecten bevatten:\n- **Gemarkeerde exporteren** schrijft alleen de rijen met een vinkje bij "Geselecteerd" (de interface is altijd mee), **Alles exporteren** schrijft alle rijen, los van het vinkje.\n- Per categorie (Interface, Booster, Terugmelder, Accessoire, Locomotieven) ontstaat daarbij een eigen **.zip-bestand** - precies het formaat dat de knop **Importeren in categorie** in het hoofdvenster verwacht. Er wordt maar één keer gevraagd - met een voorgestelde naam, die kan worden gewijzigd en dan als begin van alle bestandsnamen dient. Alle bestanden van één export vormen een **exportset** en zijn te herkennen aan het gemeenschappelijke naambegin (interface + datum/tijd) en het nummer, bijv. "IFnet_20261009-1430_1van2_interfaces.zip" en "IFnet_20261009-1430_2van2_feedbacks.zip". Het nummer is tevens de aanbevolen importvolgorde (interface eerst).\n- In het hoofdvenster: het doel-iTrain-bestand openen (of, als het de eerste overname is, een bijna leeg bestand rudimentair aanmaken), naar het bijbehorende tabblad gaan en daar **Importeren in categorie** toepassen op het geëxporteerde .zip-bestand - één bestand per categorie, in willekeurige volgorde.\n- Gerefereerde items (bijv. de interface waarnaar een terugmelder verwijst) zitten in elk exportbestand mee, zodat iTrain het doelbestand daarna zonder foutmelding kan openen.\n\nZo kan ook een bijna leeg iTrain-bestand als start worden gebruikt: bestand in iTrain slechts rudimentair aanmaken, hier alles benodigde uitlezen en als import overbrengen, daarna in iTrain handmatig afwerken (bijv. de terugmelders in blokken inbouwen).\n\nGrootte, positie en scherm van het venster worden, zoals bij alle vensters, onthouden (zie de hulp van het hoofdvenster, paragraaf Vensterbeheer). Bij het afsluiten van het programma wordt dit venster mee gesloten; zijn er nog verbindingen open, dan vraagt het programma eerst of alle verbindingen verbroken moeten worden.
help.systemsText.fr=La fenêtre **Systèmes** lit le contenu d'un système numérique (BiDiB ou ESU ECoS) et le transfère dans un fichier iTrain. En haut de la barre d'outils, une liste déroulante permet de choisir le système (BiDiB/ESU ECoS) ; à côté se trouvent **Connecter** et **Lire**. Les mêmes fonctions se trouvent aussi dans le menu **Systèmes**, chacune dans son propre sous-menu pour BiDiB et pour ESU. Märklin, Z21, Lokstore et ZIMO existent déjà comme sous-menus, mais ne sont pas encore fonctionnels.\n\n**1. Connecter**\n**Systèmes → BiDiB → Connecter...** ou **ESU → Connecter...** ouvre la fenêtre de connexion correspondante (voir les sections d'aide dédiées à BiDiB plus bas, ou à l'ECoS). Plusieurs connexions simultanées sont possibles ; chacune apparaît avec un nom et un cercle vert/rouge en bas à droite de la barre d'état.\n\n**2. Lire**\n**Lire** lit le contenu de la connexion sélectionnée :\n- Avec **BiDiB**, l'**arbre de nœuds** s'ouvre : tous les nœuds signalés avec leurs ports (rétrosignalisation, accessoires et, pour un mc2, aussi les ports locomotives), dépliable comme une arborescence de dossiers.\n- Avec **ESU ECoS**, le même arbre se construit à partir des données ECoS lues - interface, accessoires (aiguillages/signaux) et locomotives.\n- Si plusieurs connexions sont ouvertes, un petit menu déroulant sur le bouton demande d'abord de laquelle il s'agit.\n- Même sans connexion active, l'arbre peut s'ouvrir à partir d'un fichier système déjà enregistré ou, pour BiDiB, à partir du fichier de simulation (.xml) du BiDiB Wizard : **Systèmes → BiDiB/ESU → Charger un fichier système...**.\n\n**3. Marquer (sélectionner)**\nDans l'arbre de nœuds, une **case à cocher** précède chaque nœud, chaque dossier de ports et chaque port individuel - seules les caractéristiques n'en ont pas, car elles sont purement informatives. Une coche sur le nœud ou sur le dossier marque du même coup tous ses ports ; la case **Tout sélectionner** au-dessus de l'arbre marque ou démarque tout l'arbre. La barre d'état compte en continu le nombre de ports actuellement marqués.\n\n**4. Reprendre dans les objets iTrain**\nLe bouton **Appliquer la sélection** transforme les ports marqués en objets iTrain complets et les inscrit dans les tableaux de la fenêtre Systèmes : l'interface systématiquement, un module de rétrosignalisation par port de rétrosignalisation marqué, un accessoire par port d'accessoire marqué (le type est alors demandé une fois), un booster par nœud booster marqué, et pour l'ECoS également les locomotives. Les ports déjà repris (reconnus au même identifiant iTrain) ne sont pas créés une seconde fois lors d'une nouvelle reprise.\n\n**5. Modifier les objets**\nSous la barre d'outils apparaît, pour chaque catégorie, une section propre, visible seulement s'il existe des lignes - **Interface**, **Booster**, **Rétrosignalisation**, **Accessoire** et, pour l'ECoS, **Locomotives** - chacune avec sa propre case **Tout sélectionner** et les colonnes Nom dans le système, Sélectionné, Nouveau nom dans iTrain, Description (est reprise à l'import dans le champ iTrain du même nom), Correspondance dans iTrain (voir 5a), Type (et, pour les modules de rétrosignalisation, également Longueur), Interface. Type et Interface sont volontairement étroites et peuvent être élargies à la souris. La modification ne se fait pas directement dans le tableau (à l'exception de la coche « Sélectionné »), mais dans une fenêtre d'édition dédiée - marquer la ligne, puis appuyer sur Entrée, double-cliquer, ou utiliser le bouton **Modifier la ligne** au-dessus du tableau à droite. Chaque catégorie propose là les champs correspondants (par exemple, pour les accessoires, les dix types d'aiguillage iTrain et la position par défaut ; pour les modules de rétrosignalisation, type/côté/longueur ; pour les boosters, les limites de tension de voie, de courant de voie principale et de température). Suppr ou **Supprimer la ligne** retire les lignes marquées, **Vider les tableaux** vide tous les tableaux en une fois (avec confirmation) - le fichier système ouvert reste associé.\n\n**5a. Rapprochement avec un fichier iTrain existant**\nLe bouton **Charger un fichier iTrain...** (aussi dans le menu **Fichier**) charge un .tcdz/.tcd existant comme fichier commun à toutes les parties du programme - il apparaît aussi dans la fenêtre principale et la fenêtre Décodeur. Si un fichier y est déjà chargé, il vaut ici automatiquement. Le programme associe ensuite automatiquement chaque ligne qui existe déjà dans ce fichier : modules de rétrosignalisation, accessoires et boosters par leur identifiant BiDiB, l'interface par son nom ou son adresse. Tout le reste est sur **Nouveau**. Dans la colonne **Correspondance dans iTrain**, chaque ligne peut être associée à la main à une entrée existante de la même catégorie, ou remise sur « Nouveau ».\n- Une ligne associée reprend le nom iTrain (il est alors verrouillé dans la fenêtre d'édition, sinon l'import ne reconnaîtrait pas l'entrée). À l'export, c'est l'entrée iTrain EXISTANTE qui est écrite, avec seulement le lien BiDiB (identifiant, interface) et la description mis à jour - les réglages faits dans iTrain comme le type, la longueur, les options ou les occupations sont conservés. Dans la fenêtre principale, choisir « Synchroniser » lors de l'import.\n- Si l'interface est associée, toutes les lignes reprennent le nom iTrain de l'interface.\n- Les lignes « Nouveau » sont créées avec le nom de la colonne **Nouveau nom dans iTrain**.\n- **Écrire dans le fichier iTrain** reporte les lignes cochées directement dans le fichier chargé - sans aucun fichier d'export : les entrées associées sont mises à jour à leur place, les nouvelles ajoutées (les homonymes reçoivent « (2) » etc.). Auparavant, le programme fait une sauvegarde dans le dossier de sauvegarde ; iTrain ne doit pas avoir le fichier ouvert. Les modifications sont ensuite visibles dans toutes les parties du programme et peuvent être annulées avec **Annuler** dans la fenêtre principale.\n\nLes largeurs de colonnes de tous les tableaux se modifient à la souris et sont mémorisées.\n\n**6. Enregistrer comme fichier système**\nLe menu **Fichier** de cette fenêtre (Ouvrir/Enregistrer/Fermer le fichier actuel) travaille sur son propre **fichier système** (extension `.bidibsys`, techniquement un ZIP contenant un CSV) - et non sur le fichier iTrain de la fenêtre principale. Il contient à la fois l'arbre de nœuds lu et les objets iTrain déjà repris ; **Enregistrer** le dépose dans le chemin configuré pour les fichiers système (Paramètres → Chemins), **Ouvrir** recharge plus tard un fichier enregistré - pratique pour ne pas devoir répéter une lecture, ou pour continuer à y travailler sur un autre ordinateur.\n\n**7. Exporter et insérer dans un fichier iTrain existant**\nLorsque les tableaux contiennent les objets souhaités :\n- **Exporter les éléments marqués** n'écrit que les lignes cochées « Sélectionné » (l'interface est toujours incluse), **Tout exporter** écrit toutes les lignes, indépendamment de la coche.\n- Pour chaque catégorie (Interface, Booster, Rétrosignalisation, Accessoire, Locomotives), cela crée un **fichier .zip** distinct - exactement le format attendu par le bouton **Importer dans la catégorie** de la fenêtre principale. La question n'est posée qu'une fois - avec un nom proposé, modifiable, qui sert ensuite de début à tous les noms de fichier. Tous les fichiers d'un export forment un **lot d'export** et se reconnaissent au début de nom commun (interface + date/heure) et au numéro, p. ex. « IFnet_20261009-1430_1sur2_interfaces.zip » et « IFnet_20261009-1430_2sur2_feedbacks.zip ». Le numéro donne aussi l'ordre d'import recommandé (l'interface d'abord).\n- Dans la fenêtre principale : ouvrir le fichier iTrain cible (ou, s'il s'agit de la première reprise, créer un fichier presque vide de façon seulement rudimentaire), passer à l'onglet correspondant et y appliquer **Importer dans la catégorie** sur le .zip exporté - un fichier par catégorie, dans n'importe quel ordre.\n- Les entrées référencées (p. ex. l'interface à laquelle renvoie un module de rétrosignalisation) sont incluses dans chaque fichier d'export, afin qu'iTrain puisse ensuite ouvrir le fichier cible sans message d'erreur.\n\nCela permet aussi de démarrer avec un fichier iTrain presque vide : créer le fichier dans iTrain seulement de façon rudimentaire, lire ici tout ce qui est nécessaire et le transférer par import, puis le retravailler à la main dans iTrain (p. ex. intégrer les modules de rétrosignalisation dans des cantons).\n\nTaille, position et écran de la fenêtre sont mémorisés comme pour toutes les fenêtres (voir l'aide de la fenêtre principale, section Gestion des fenêtres). À la fermeture du programme, cette fenêtre se ferme avec lui ; si des connexions sont encore ouvertes, le programme demande au préalable si elles doivent toutes être déconnectées.
help.systemsText.es=La ventana **Sistemas** lee el contenido de un sistema digital (BiDiB o ESU ECoS) y lo transfiere a un archivo iTrain. En la parte superior de la barra de herramientas, una lista desplegable permite elegir el sistema (BiDiB/ESU ECoS); junto a ella están **Conectar** y **Leer**. Las mismas funciones también están en el menú **Sistemas**, cada una en su propio submenú para BiDiB y para ESU. Märklin, Z21, Lokstore y ZIMO ya existen como submenús, pero todavía sin función.\n\n**1. Conectar**\n**Sistemas → BiDiB → Conectar...** o **ESU → Conectar...** abre el cuadro de conexión correspondiente (ver las secciones de ayuda propias de BiDiB más abajo, o de ECoS). Son posibles varias conexiones al mismo tiempo; cada una aparece con un nombre y un círculo verde/rojo abajo a la derecha en la barra de estado.\n\n**2. Leer**\n**Leer** lee el contenido de la conexión seleccionada:\n- Con **BiDiB** se abre el **árbol de nodos**: todos los nodos notificados con sus puertos (de retroseñalización, de accesorio y, en una mc2, también de locomotora), desplegable como un árbol de carpetas.\n- Con **ESU ECoS** se genera el mismo árbol a partir de los datos leídos de la ECoS - interfaz, accesorios (agujas/señales) y locomotoras.\n- Si hay varias conexiones abiertas, un pequeño menú desplegable en el botón pregunta primero a cuál se refiere.\n- Incluso sin una conexión activa, el árbol puede abrirse desde un archivo de sistema ya guardado o, en BiDiB, desde el archivo de simulación (.xml) del BiDiB Wizard: **Sistemas → BiDiB/ESU → Cargar archivo de sistema...**.\n\n**3. Marcar (seleccionar)**\nEn el árbol de nodos aparece una **casilla** delante de cada nodo, cada carpeta de puertos y cada puerto individual - solo falta en las propiedades, que son de solo visualización. Una marca en el nodo o en la carpeta marca también todos sus puertos; la casilla **Seleccionar todo** encima del árbol marca o desmarca todo el árbol. La barra de estado cuenta cuántos puertos están marcados en cada momento.\n\n**4. Aplicar a los objetos de iTrain**\nEl botón **Aplicar selección** convierte los puertos marcados en objetos iTrain completos y los introduce en las tablas de la ventana Sistemas: la interfaz siempre, un módulo de retroseñalización por cada puerto de retroseñalización marcado, un accesorio por cada puerto de accesorio (se pregunta una vez el tipo de construcción), un booster por cada nodo booster marcado, y en ECoS además las locomotoras. Los puertos ya aplicados (reconocidos por el mismo identificador de iTrain) no se crean por segunda vez al aplicar de nuevo.\n\n**5. Editar objetos**\nDebajo de la barra de herramientas aparece, por categoría, una sección propia, visible solo si existen filas - **Interfaz**, **Booster**, **Retroseñalización**, **Accesorio** y, en ECoS, **Locomotoras** - cada una con su propia casilla **Seleccionar todo** y las columnas Nombre en el sistema, Seleccionado, Nuevo nombre en iTrain, Descripción (pasa al importar al campo de iTrain del mismo nombre), Asignación en iTrain (véase 5a), Tipo (y, en los módulos de retroseñalización, también Longitud), Interfaz. Tipo e Interfaz son estrechas a propósito y pueden ensancharse con el ratón. La edición no se hace directamente en la tabla (salvo la marca "Seleccionado"), sino en una ventana de edición propia - marcar la fila y luego pulsar Intro, doble clic o el botón **Editar fila** encima de la tabla, a la derecha. Cada categoría ofrece allí los campos correspondientes (por ejemplo, en accesorios los diez tipos de aguja de iTrain y la posición básica; en módulos de retroseñalización tipo/lado/longitud; en boosters los límites de tensión de vía, corriente de vía principal y temperatura). Supr o **Eliminar fila** vuelve a quitar las filas marcadas, **Vaciar tablas** vacía todas las tablas de una vez (con confirmación) - el archivo de sistema abierto sigue asociado.\n\n**5a. Comparar con un archivo de iTrain existente**\nEl botón **Cargar archivo de iTrain...** (también en el menú **Archivo**) carga un .tcdz/.tcd existente como archivo común de todas las partes del programa; aparece también en la ventana principal y en la ventana Decoder. Si ya hay un archivo cargado allí, aquí se aplica automáticamente. Después, el programa asigna automáticamente cada fila que ya existe en ese archivo: módulos de retroseñalización, accesorios y boosters por su identificador BiDiB, la interfaz por nombre o dirección. Todo lo demás queda en **Nuevo**. En la columna **Asignación en iTrain** cada fila puede asignarse a mano a una entrada existente de la misma categoría o volver a ponerse en "Nuevo".\n- Una fila asignada adopta el nombre de iTrain (queda bloqueado en la ventana de edición; si no, la importación no reconocería la entrada). Al exportar se escribe la entrada de iTrain EXISTENTE, en la que solo se actualizan el enlace BiDiB (identificador, interfaz) y la descripción; los datos mantenidos en iTrain, como tipo, longitud, opciones u ocupaciones, se conservan. En la ventana principal, elegir "Sincronizar" al importar.\n- Si se asigna la interfaz, todas las filas adoptan el nombre de iTrain de la interfaz.\n- Las filas "Nuevo" se crean con el nombre de la columna **Nuevo nombre en iTrain**.\n- **Escribir en el archivo de iTrain** pasa las filas marcadas directamente al archivo cargado, sin ningún archivo de exportación: las entradas asignadas se actualizan en su sitio y las nuevas se añaden (las de igual nombre reciben "(2)", etc.). Antes, el programa hace una copia de seguridad en la carpeta de copias; iTrain no debe tener el archivo abierto. Después, los cambios son visibles en todas las partes del programa y pueden revertirse con **Deshacer** en la ventana principal.\n\nLos anchos de columna de todas las tablas se pueden cambiar con el ratón y se recuerdan.\n\n**6. Guardar como archivo de sistema**\nEl menú **Archivo** de esta ventana (Abrir/Guardar/Cerrar actual) trabaja sobre un **archivo de sistema** propio (extensión `.bidibsys`, técnicamente un ZIP con un CSV dentro) - no sobre el archivo iTrain de la ventana principal. En él están tanto el árbol de nodos leído como los objetos iTrain ya aplicados; **Guardar** lo deposita en la ruta configurada para archivos de sistema (Preferencias → Rutas), **Abrir** vuelve a cargar más tarde un archivo guardado - útil para no tener que repetir una lectura o para seguir trabajando en otro ordenador.\n\n**7. Exportar e insertar en un archivo iTrain existente**\nCuando las tablas contienen los objetos deseados:\n- **Exportar marcados** escribe solo las filas con marca en "Seleccionado" (la interfaz siempre se incluye), **Exportar todo** escribe todas las filas, con independencia de la marca.\n- Por cada categoría (Interfaz, Booster, Retroseñalización, Accesorio, Locomotoras) se crea así un **archivo .zip** propio, exactamente el formato que espera el botón **Importar en categoría** de la ventana principal. Solo se pregunta una vez, con un nombre propuesto que puede cambiarse y que sirve luego como inicio de todos los nombres de archivo. Todos los archivos de una exportación forman un **conjunto de exportación** y se reconocen por el inicio común del nombre (interfaz + fecha/hora) y el número, p. ej. "IFnet_20261009-1430_1de2_interfaces.zip" y "IFnet_20261009-1430_2de2_feedbacks.zip". El número es también el orden de importación recomendado (primero la interfaz).\n- En la ventana principal: abrir el archivo iTrain de destino (o, si es la primera transferencia, crear un archivo casi vacío solo de forma rudimentaria), cambiar a la pestaña correspondiente y aplicar allí **Importar en categoría** sobre el .zip exportado - un archivo por categoría, en cualquier orden.\n- Las entradas referenciadas (p. ej. la interfaz a la que apunta un módulo de retroseñalización) se incluyen en cada archivo de exportación, para que iTrain pueda abrir después el archivo de destino sin mensaje de error.\n\nAsí también se puede usar como punto de partida un archivo iTrain casi vacío: crear el archivo en iTrain solo de forma rudimentaria, leer aquí todo lo necesario y transferirlo como importación, y después retocarlo a mano en iTrain (p. ej. incorporando los módulos de retroseñalización en los cantones de vía).\n\nTamaño, posición y pantalla de la ventana se recuerdan como en todas las ventanas (ver la ayuda de la ventana principal, sección Gestión de ventanas). Al cerrar el programa, esta ventana se cierra con él; si aún hay conexiones abiertas, el programa pregunta antes si deben desconectarse todas.
help.systemsText.it=La finestra **Sistemi** legge il contenuto di un sistema digitale (BiDiB o ESU ECoS) e lo trasferisce in un file iTrain. In alto nella barra degli strumenti, un elenco a discesa permette di scegliere il sistema (BiDiB/ESU ECoS); accanto si trovano **Connetti** e **Leggi**. Le stesse funzioni si trovano anche nel menu **Sistemi**, ciascuna in un proprio sottomenu per BiDiB e per ESU. Märklin, Z21, Lokstore e ZIMO esistono già come sottomenu, ma non sono ancora funzionanti.\n\n**1. Connetti**\n**Sistemi → BiDiB → Connetti...** oppure **ESU → Connetti...** apre la finestra di connessione corrispondente (vedi le sezioni di aiuto dedicate a BiDiB più sotto, o a ECoS). Sono possibili più connessioni contemporaneamente; ognuna appare con un nome e un cerchio verde/rosso in basso a destra nella barra di stato.\n\n**2. Leggi**\n**Leggi** legge il contenuto della connessione selezionata:\n- Con **BiDiB** si apre l'**albero dei nodi**: tutti i nodi segnalati con le loro porte (di retroazione, di accessorio e, per una mc2, anche di locomotiva), espandibile come un albero di cartelle.\n- Con **ESU ECoS** si crea lo stesso albero a partire dai dati letti dalla ECoS - interfaccia, accessori (scambi/segnali) e locomotive.\n- Se sono aperte più connessioni, un piccolo menu a discesa sul pulsante chiede prima a quale ci si riferisce.\n- Anche senza una connessione attiva, l'albero può essere aperto da un file di sistema già salvato oppure, per BiDiB, dal file di simulazione (.xml) del BiDiB Wizard: **Sistemi → BiDiB/ESU → Carica file di sistema...**.\n\n**3. Contrassegnare (selezionare)**\nNell'albero dei nodi compare una **casella di spunta** davanti a ogni nodo, ogni cartella di porte e ogni singola porta - solo le caratteristiche non l'hanno, poiché sono di sola visualizzazione. Un segno di spunta sul nodo o sulla cartella contrassegna anche tutte le sue porte; la casella **Seleziona tutto** sopra l'albero contrassegna o toglie il contrassegno a tutto l'albero. La barra di stato conta quante porte sono attualmente contrassegnate.\n\n**4. Trasferire negli oggetti iTrain**\nIl pulsante **Applica selezione** trasforma le porte contrassegnate in oggetti iTrain completi e le inserisce nelle tabelle della finestra Sistemi: l'interfaccia sempre, un sensore di retroazione per ogni porta di retroazione contrassegnata, un accessorio per ogni porta accessorio (il tipo costruttivo viene chiesto una volta), un booster per ogni nodo booster contrassegnato, e per ECoS anche le locomotive. Le porte già trasferite (riconosciute dallo stesso identificativo iTrain) non vengono create una seconda volta se si trasferisce di nuovo.\n\n**5. Modificare gli oggetti**\nSotto la barra degli strumenti compare, per ogni categoria, una sezione propria, visibile solo se esistono righe - **Interfaccia**, **Booster**, **Sensore di retroazione**, **Accessorio** e, per ECoS, **Locomotive** - ognuna con una propria casella **Seleziona tutto** e le colonne Nome nel sistema, Selezionato, Nuovo nome in iTrain, Descrizione (all'importazione finisce nel campo iTrain omonimo), Abbinamento in iTrain (vedi 5a), Tipo (e, per i sensori di retroazione, anche Lunghezza), Interfaccia. Tipo e Interfaccia sono volutamente strette e si possono allargare con il mouse. La modifica non avviene direttamente nella tabella (a parte il segno di spunta "Selezionato"), ma in una finestra di modifica dedicata - contrassegnare la riga, poi Invio, doppio clic o il pulsante **Modifica riga** sopra la tabella a destra. Per ogni categoria vi sono i campi corrispondenti (ad es. per gli accessori i dieci tipi di scambio iTrain e la posizione base; per i sensori di retroazione tipo/lato/lunghezza; per i booster i limiti di tensione di binario, corrente del binario principale e temperatura). Canc o **Elimina riga** rimuove le righe contrassegnate, **Svuota tabelle** vuota tutte le tabelle in una volta (con richiesta di conferma) - il file di sistema aperto resta comunque associato.\n\n**5a. Confronto con un file iTrain esistente**\nIl pulsante **Carica file iTrain...** (anche nel menu **File**) carica un .tcdz/.tcd esistente come file comune a tutte le parti del programma - compare anche nella finestra principale e nella finestra Decoder. Se lì è già caricato un file, qui vale automaticamente. Il programma abbina poi automaticamente ogni riga che esiste già in quel file: sensori di retroazione, accessori e booster tramite il loro identificativo BiDiB, l'interfaccia tramite nome o indirizzo. Tutto il resto è impostato su **Nuovo**. Nella colonna **Abbinamento in iTrain** ogni riga può essere abbinata a mano a una voce esistente della stessa categoria o reimpostata su "Nuovo".\n- Una riga abbinata assume il nome iTrain (che è poi bloccato nella finestra di modifica, altrimenti l'importazione non riconoscerebbe la voce). All'esportazione viene scritta la voce iTrain ESISTENTE, in cui vengono aggiornati solo il collegamento BiDiB (identificativo, interfaccia) e la descrizione - i dati gestiti in iTrain come tipo, lunghezza, opzioni od occupazioni restano invariati. Nella finestra principale scegliere "Sincronizza" durante l'importazione.\n- Se viene abbinata l'interfaccia, tutte le righe assumono il nome iTrain dell'interfaccia.\n- Le righe "Nuovo" vengono create con il nome della colonna **Nuovo nome in iTrain**.\n- **Scrivi nel file iTrain** trasferisce le righe selezionate direttamente nel file caricato - senza alcun file di esportazione: le voci abbinate vengono aggiornate al loro posto, quelle nuove aggiunte (quelle con lo stesso nome ricevono "(2)" ecc.). Prima il programma crea una copia nella cartella di backup; iTrain non deve avere il file aperto. Le modifiche sono poi visibili in tutte le parti del programma e si possono annullare con **Annulla** nella finestra principale.\n\nLe larghezze delle colonne di tutte le tabelle si possono modificare con il mouse e vengono memorizzate.\n\n**6. Salvare come file di sistema**\nIl menu **File** di questa finestra (Apri/Salva/Chiudi corrente) lavora su un proprio **file di sistema** (estensione `.bidibsys`, tecnicamente uno ZIP contenente un CSV) - non sul file iTrain della finestra principale. Contiene sia l'albero dei nodi letto sia gli oggetti iTrain già trasferiti; **Salva** lo deposita nel percorso configurato per i file di sistema (Preferenze → Percorsi), **Apri** ricarica in seguito un file salvato - utile per non dover ripetere una lettura o per continuare a lavorarci su un altro computer.\n\n**7. Esportare e inserire in un file iTrain esistente**\nQuando le tabelle contengono gli oggetti desiderati:\n- **Esporta contrassegnati** scrive solo le righe con il segno di spunta su "Selezionato" (l'interfaccia è sempre inclusa), **Esporta tutto** scrive tutte le righe, indipendentemente dal segno di spunta.\n- Per ogni categoria (Interfaccia, Booster, Sensore di retroazione, Accessorio, Locomotive) si crea così un proprio **file .zip** - esattamente il formato che il pulsante **Importa nella categoria** nella finestra principale si aspetta. La domanda viene posta una sola volta - con un nome proposto, modificabile, che diventa poi l'inizio di tutti i nomi di file. Tutti i file di un'esportazione formano un **set di esportazione** e si riconoscono dall'inizio comune del nome (interfaccia + data/ora) e dal numero, ad es. "IFnet_20261009-1430_1di2_interfaces.zip" e "IFnet_20261009-1430_2di2_feedbacks.zip". Il numero è anche l'ordine di importazione consigliato (prima l'interfaccia).\n- Nella finestra principale: aprire il file iTrain di destinazione (o, se è il primo trasferimento, creare un file quasi vuoto solo in modo rudimentale), passare alla scheda corrispondente e lì applicare **Importa nella categoria** al file .zip esportato - un file per categoria, in qualsiasi ordine.\n- Le voci referenziate (ad es. l'interfaccia a cui rimanda un sensore di retroazione) sono incluse in ogni file di esportazione, affinché iTrain possa poi aprire il file di destinazione senza messaggio di errore.\n\nCosì si può usare come base di partenza anche un file iTrain quasi vuoto: creare il file in iTrain solo in modo rudimentale, leggere qui tutto il necessario e trasferirlo come importazione, poi rifinirlo a mano in iTrain (ad es. inserendo i sensori di retroazione nelle sezioni di binario).\n\nDimensione, posizione e schermo della finestra vengono memorizzati come per tutte le finestre (vedi la guida della finestra principale, sezione Gestione delle finestre). Alla chiusura del programma questa finestra viene chiusa insieme ad esso; se sono ancora aperte connessioni, il programma chiede prima se disconnetterle tutte.
help.systemsText.pt=A janela **Sistemas** lê o conteúdo de um sistema digital (BiDiB ou ESU ECoS) e transfere-o para um ficheiro iTrain. No topo da barra de ferramentas, uma lista pendente permite escolher o sistema (BiDiB/ESU ECoS); ao lado encontram-se **Ligar** e **Ler**. As mesmas funções também estão no menu **Sistemas**, cada uma no seu próprio submenu para BiDiB e para ESU. Märklin, Z21, Lokstore e ZIMO já existem como submenus, mas ainda sem função.\n\n**1. Ligar**\n**Sistemas → BiDiB → Ligar...** ou **ESU → Ligar...** abre a caixa de ligação correspondente (ver as secções de ajuda próprias do BiDiB mais abaixo, ou da ECoS). São possíveis várias ligações em simultâneo; cada uma aparece com um nome e um círculo verde/vermelho no canto inferior direito da barra de estado.\n\n**2. Ler**\n**Ler** lê o conteúdo da ligação selecionada:\n- Com **BiDiB** abre-se a **árvore de nós**: todos os nós comunicados com as respetivas portas (de retrossinalização, de acessório e, numa mc2, também de locomotiva), expansível como uma árvore de pastas.\n- Com **ESU ECoS** surge a mesma árvore a partir dos dados lidos da ECoS - interface, acessórios (agulhas/sinais) e locomotivas.\n- Se houver várias ligações abertas, um pequeno menu pendente no botão pergunta primeiro a qual delas se refere.\n- Mesmo sem ligação ativa, a árvore pode ser aberta a partir de um ficheiro de sistema já guardado ou, no BiDiB, a partir do ficheiro de simulação (.xml) do BiDiB Wizard: **Sistemas → BiDiB/ESU → Carregar ficheiro de sistema...**.\n\n**3. Marcar (selecionar)**\nNa árvore de nós há uma **caixa de verificação** antes de cada nó, cada pasta de portas e cada porta individual - só as propriedades não a têm, pois são apenas visuais. Uma marca no nó ou na pasta marca também todas as suas portas; a caixa **Selecionar tudo** acima da árvore marca ou desmarca toda a árvore. A barra de estado conta quantas portas estão atualmente marcadas.\n\n**4. Transferir para os objetos iTrain**\nO botão **Aplicar seleção** transforma as portas marcadas em objetos iTrain prontos e insere-os nas tabelas da janela Sistemas: a interface sempre, um módulo de retrossinalização por cada porta de retrossinalização marcada, um acessório por cada porta de acessório (pergunta-se uma vez o tipo de construção), um booster por cada nó booster marcado e, na ECoS, também as locomotivas. As portas já transferidas (reconhecidas pelo mesmo identificador iTrain) não são criadas de novo ao transferir outra vez.\n\n**5. Editar objetos**\nAbaixo da barra de ferramentas aparece, por categoria, uma secção própria, visível apenas se existirem linhas - **Interface**, **Booster**, **Retrossinalização**, **Acessório** e, na ECoS, **Locomotivas** - cada uma com a sua própria caixa **Selecionar tudo** e as colunas Nome no sistema, Selecionado, Novo nome no iTrain, Descrição (passa, na importação, para o campo iTrain com o mesmo nome), Correspondência no iTrain (ver 5a), Tipo (e, nos módulos de retrossinalização, também Comprimento), Interface. Tipo e Interface são propositadamente estreitas e podem ser alargadas com o rato. A edição não é feita diretamente na tabela (à exceção da marca "Selecionado"), mas numa janela de edição própria - marcar a linha e depois Enter, duplo clique ou o botão **Editar linha** acima da tabela, à direita. Cada categoria oferece aí os campos correspondentes (por exemplo, nos acessórios os dez tipos de agulha iTrain e a posição base; nos módulos de retrossinalização tipo/lado/comprimento; nos boosters os limites de tensão de via, corrente da via principal e temperatura). Delete ou **Eliminar linha** remove novamente as linhas marcadas, **Limpar tabelas** esvazia todas as tabelas de uma vez (com confirmação) - o ficheiro de sistema aberto continua associado.\n\n**5a. Comparar com um ficheiro iTrain existente**\nO botão **Carregar ficheiro iTrain...** (também no menu **Ficheiro**) carrega um .tcdz/.tcd existente como ficheiro comum a todas as partes do programa - aparece também na janela principal e na janela Descodificador. Se já houver aí um ficheiro carregado, vale aqui automaticamente. Depois, o programa associa automaticamente cada linha que já existe nesse ficheiro: módulos de retrossinalização, acessórios e boosters pelo seu identificador BiDiB, a interface pelo nome ou endereço. Tudo o resto fica em **Novo**. Na coluna **Correspondência no iTrain**, cada linha pode ser associada manualmente a uma entrada existente da mesma categoria ou voltar a "Novo".\n- Uma linha associada adota o nome do iTrain (fica então bloqueado na janela de edição, caso contrário a importação não reconheceria a entrada). Na exportação é escrita a entrada iTrain EXISTENTE, em que só a ligação BiDiB (identificador, interface) e a descrição são atualizadas - os dados mantidos no iTrain, como tipo, comprimento, opções ou ocupações, são preservados. Na janela principal, escolher "Sincronizar" ao importar.\n- Se a interface for associada, todas as linhas adotam o nome iTrain da interface.\n- As linhas "Novo" são criadas com o nome da coluna **Novo nome no iTrain**.\n- **Escrever no ficheiro iTrain** passa as linhas marcadas diretamente para o ficheiro carregado - sem quaisquer ficheiros de exportação: as entradas associadas são atualizadas no seu lugar, as novas acrescentadas (as com o mesmo nome recebem "(2)" etc.). Antes, o programa faz uma cópia na pasta de cópias de segurança; o iTrain não deve ter o ficheiro aberto. As alterações ficam depois visíveis em todas as partes do programa e podem ser revertidas com **Anular** na janela principal.\n\nAs larguras das colunas de todas as tabelas podem ser alteradas com o rato e são memorizadas.\n\n**6. Guardar como ficheiro de sistema**\nO menu **Ficheiro** desta janela (Abrir/Guardar/Fechar atual) trabalha sobre um **ficheiro de sistema** próprio (extensão `.bidibsys`, tecnicamente um ZIP com um CSV dentro) - não sobre o ficheiro iTrain da janela principal. Nele estão tanto a árvore de nós lida como os objetos iTrain já transferidos; **Guardar** coloca-o no caminho configurado para ficheiros de sistema (Definições → Caminhos), **Abrir** volta a carregar mais tarde um ficheiro guardado - útil para não ter de repetir uma leitura ou para continuar a trabalhar noutro computador.\n\n**7. Exportar e inserir num ficheiro iTrain existente**\nQuando as tabelas contêm os objetos desejados:\n- **Exportar marcados** escreve apenas as linhas com marca em "Selecionado" (a interface está sempre incluída), **Exportar tudo** escreve todas as linhas, independentemente da marca.\n- Por cada categoria (Interface, Booster, Retrossinalização, Acessório, Locomotivas) cria-se assim um **ficheiro .zip** próprio - exatamente o formato que o botão **Importar na categoria** da janela principal espera. A pergunta é feita uma única vez - com um nome sugerido, que pode ser alterado e serve depois de início a todos os nomes de ficheiro. Todos os ficheiros de uma exportação formam um **conjunto de exportação** e reconhecem-se pelo início comum do nome (interface + data/hora) e pelo número, p. ex. "IFnet_20261009-1430_1de2_interfaces.zip" e "IFnet_20261009-1430_2de2_feedbacks.zip". O número é também a ordem de importação recomendada (primeiro a interface).\n- Na janela principal: abrir o ficheiro iTrain de destino (ou, se for a primeira transferência, criar um ficheiro quase vazio apenas de forma rudimentar), mudar para o separador correspondente e aí aplicar **Importar na categoria** ao .zip exportado - um ficheiro por categoria, por qualquer ordem.\n- As entradas referenciadas (por exemplo, a interface para a qual um módulo de retrossinalização aponta) estão incluídas em cada ficheiro de exportação, para que o iTrain possa depois abrir o ficheiro de destino sem mensagem de erro.\n\nAssim também se pode usar como ponto de partida um ficheiro iTrain quase vazio: criar o ficheiro no iTrain apenas de forma rudimentar, ler aqui tudo o necessário e transferi-lo como importação, e depois retocá-lo à mão no iTrain (por exemplo, incorporando os módulos de retrossinalização nas secções de via).\n\nTamanho, posição e ecrã da janela são memorizados como em todas as janelas (ver a ajuda da janela principal, secção Gestão de janelas). Ao fechar o programa, esta janela fecha-se com ele; se ainda houver ligações abertas, o programa pergunta antes se todas devem ser desligadas.
help.systemsText.pl=Okno **Systemy** odczytuje zawartość systemu cyfrowego (BiDiB lub ESU ECoS) i przenosi ją do pliku iTrain. W górnej części paska narzędzi lista rozwijana wybiera system (BiDiB/ESU ECoS), obok znajdują się **Połącz** i **Odczytaj**; te same funkcje są też w menu **Systemy**, każda we własnym podmenu dla BiDiB i dla ESU. Märklin, Z21, Lokstore i ZIMO są już przygotowane jako podmenu, ale jeszcze bez funkcji.\n\n**1. Połącz**\n**Systemy → BiDiB → Połącz...** lub **ESU → Połącz...** otwiera odpowiednie okno połączenia (patrz własne rozdziały pomocy o BiDiB poniżej lub o ECoS). Możliwych jest kilka połączeń jednocześnie; każde pojawia się z nazwą i zielonym/czerwonym kółkiem w prawym dolnym rogu paska stanu.\n\n**2. Odczytaj**\n**Odczytaj** odczytuje zawartość wybranego połączenia:\n- W przypadku **BiDiB** otwiera się **drzewo węzłów**: wszystkie zgłoszone węzły z ich portami (zwrotnymi, akcesoriów oraz, w przypadku mc2, także portami lokomotyw), rozwijalne jak drzewo folderów.\n- W przypadku **ESU ECoS** powstaje to samo drzewo z odczytanych danych ECoS - interfejs, akcesoria (zwrotnice/sygnały) i lokomotywy.\n- Jeśli otwartych jest kilka połączeń, małe menu rozwijane przy przycisku najpierw pyta, o które chodzi.\n- Nawet bez aktywnego połączenia drzewo można otworzyć z już zapisanego pliku systemowego lub, w przypadku BiDiB, z pliku symulacji (.xml) BiDiB Wizard: **Systemy → BiDiB/ESU → Wczytaj plik systemowy...**.\n\n**3. Zaznaczanie (wybieranie)**\nW drzewie węzłów przed każdym węzłem, każdym folderem portów i każdym pojedynczym portem znajduje się **pole wyboru** - brakuje go tylko przy właściwościach, które są jedynie do wglądu. Zaznaczenie węzła lub folderu zaznacza jednocześnie wszystkie jego porty; pole **Wybierz wszystko** nad drzewem zaznacza lub odznacza całe drzewo. Pasek stanu na bieżąco liczy, ile portów jest aktualnie zaznaczonych.\n\n**4. Przeniesienie do obiektów iTrain**\nPrzycisk **Zastosuj wybór** zamienia zaznaczone porty w gotowe obiekty iTrain i wpisuje je do tabel okna Systemy: interfejs zawsze, jeden czujnik zwrotny na każdy zaznaczony port zwrotny, jedno akcesorium na każdy port akcesoriów (typ konstrukcji jest wtedy pytany jednorazowo), jeden booster na każdy zaznaczony węzeł boostera, a w ECoS dodatkowo lokomotywy. Porty już przeniesione (rozpoznane po tym samym identyfikatorze iTrain) nie są tworzone ponownie przy kolejnym przenoszeniu.\n\n**5. Edycja obiektów**\nPod paskiem narzędzi pojawia się dla każdej kategorii własna sekcja, widoczna tylko gdy istnieją wiersze - **Interfejs**, **Booster**, **Czujnik zwrotny**, **Akcesoria** oraz, w ECoS, **Lokomotywy** - każda z własnym polem **Wybierz wszystko** i kolumnami Nazwa w systemie, Wybrane, Nowa nazwa w iTrain, Opis (przy imporcie trafia do pola iTrain o tej samej nazwie), Przypisanie w iTrain (zob. 5a), Typ (a przy czujnikach zwrotnych dodatkowo Długość), Interfejs. Typ i Interfejs są celowo wąskie i można je poszerzyć myszą. Edycja nie odbywa się bezpośrednio w tabeli (poza zaznaczeniem "Wybrane"), lecz we własnym oknie edycji - zaznaczyć wiersz, a potem Enter, dwuklik lub przycisk **Edytuj wiersz** po prawej stronie nad tabelą. W każdej kategorii znajdują się tam odpowiednie pola (np. przy akcesoriach dziesięć typów zwrotnic iTrain i pozycja podstawowa, przy czujnikach zwrotnych typ/strona/długość, przy boosterach wartości graniczne napięcia szyny, prądu głównej szyny i temperatury). Delete lub **Usuń wiersz** ponownie usuwa zaznaczone wiersze, **Wyczyść tabele** czyści wszystkie tabele jednocześnie (z potwierdzeniem) - otwarty plik systemowy pozostaje przy tym przypisany.\n\n**5a. Porównanie z istniejącym plikiem iTrain**\nPrzycisk **Wczytaj plik iTrain...** (także w menu **Plik**) wczytuje istniejący plik .tcdz/.tcd jako wspólny plik wszystkich części programu - pojawia się on także w oknie głównym i w oknie Dekoder. Jeśli plik jest już tam wczytany, obowiązuje tu automatycznie. Następnie program automatycznie przypisuje każdy wiersz, który już istnieje w tym pliku: czujniki zwrotne, akcesoria i boostery po ich identyfikatorze BiDiB, interfejs po nazwie lub adresie. Wszystko inne jest ustawione na **Nowy**. W kolumnie **Przypisanie w iTrain** każdy wiersz można ręcznie przypisać do istniejącego wpisu tej samej kategorii lub z powrotem ustawić na "Nowy".\n- Przypisany wiersz przejmuje nazwę z iTrain (jest ona wtedy zablokowana w oknie edycji, w przeciwnym razie import nie rozpoznałby wpisu). Przy eksporcie zapisywany jest ISTNIEJĄCY wpis iTrain, w którym aktualizowane jest tylko powiązanie BiDiB (identyfikator, interfejs) i opis - ustawienia prowadzone w iTrain, takie jak typ, długość, opcje czy zajętości, pozostają zachowane. W oknie głównym przy imporcie wybrać "Synchronizuj".\n- Jeśli przypisany zostanie interfejs, wszystkie wiersze przejmują nazwę interfejsu z iTrain.\n- Wiersze "Nowy" są tworzone z nazwą z kolumny **Nowa nazwa w iTrain**.\n- **Zapisz do pliku iTrain** przenosi zaznaczone wiersze bezpośrednio do wczytanego pliku - zupełnie bez plików eksportu: przypisane wpisy są aktualizowane na swoim miejscu, nowe dodawane (wpisy o tej samej nazwie otrzymują "(2)" itd.). Wcześniej program tworzy kopię zapasową w folderze kopii; iTrain nie powinien mieć wtedy otwartego pliku. Zmiany są potem widoczne we wszystkich częściach programu i można je wycofać przez **Cofnij** w oknie głównym.\n\nSzerokości kolumn wszystkich tabel można zmieniać myszą i są one zapamiętywane.\n\n**6. Zapisz jako plik systemowy**\nMenu **Plik** tego okna (Otwórz/Zapisz/Zamknij bieżący) działa na własnym **pliku systemowym** (rozszerzenie `.bidibsys`, technicznie ZIP z plikiem CSV wewnątrz) - a nie na pliku iTrain okna głównego. Zawiera on zarówno odczytane drzewo węzłów, jak i już przeniesione obiekty iTrain; **Zapisz** umieszcza go w ustawionej ścieżce dla plików systemowych (Preferencje → Ścieżki), **Otwórz** wczytuje później zapisany plik ponownie - przydatne, aby nie powtarzać odczytu lub kontynuować pracę na innym komputerze.\n\n**7. Eksport i wstawienie do istniejącego pliku iTrain**\nGdy tabele zawierają żądane obiekty:\n- **Eksportuj zaznaczone** zapisuje tylko wiersze zaznaczone jako "Wybrane" (interfejs jest zawsze uwzględniony), **Eksportuj wszystko** zapisuje wszystkie wiersze, niezależnie od zaznaczenia.\n- Dla każdej kategorii (Interfejs, Booster, Czujnik zwrotny, Akcesoria, Lokomotywy) powstaje przy tym własny **plik .zip** - dokładnie w formacie, którego oczekuje przycisk **Importuj do kategorii** w oknie głównym. Pytanie pada tylko raz - z proponowaną nazwą, którą można zmienić i która staje się początkiem nazw wszystkich plików. Wszystkie pliki jednego eksportu tworzą **zestaw eksportu** i rozpoznaje się je po wspólnym początku nazwy (interfejs + data/godzina) i numerze, np. "IFnet_20261009-1430_1z2_interfaces.zip" i "IFnet_20261009-1430_2z2_feedbacks.zip". Numer jest zarazem zalecaną kolejnością importu (najpierw interfejs).\n- W oknie głównym: otworzyć docelowy plik iTrain (lub, jeśli jest to pierwsze przeniesienie, utworzyć jedynie szczątkowo prawie pusty plik), przełączyć się na odpowiednią zakładkę i zastosować tam **Importuj do kategorii** do wyeksportowanego pliku .zip - jeden plik na kategorię, w dowolnej kolejności.\n- Wpisy odwołujące się do innych (np. interfejs, do którego odnosi się czujnik zwrotny) są zawarte w każdym pliku eksportu, aby iTrain mógł następnie otworzyć plik docelowy bez komunikatu o błędzie.\n\nDzięki temu można też zacząć od prawie pustego pliku iTrain: utworzyć plik w iTrain tylko szczątkowo, odczytać tutaj wszystko potrzebne i przenieść jako import, a potem dopracować ręcznie w iTrain (np. wbudowując czujniki zwrotne w odcinki torów).\n\nRozmiar, pozycja i ekran okna są zapamiętywane jak we wszystkich oknach (patrz pomoc okna głównego, rozdział Zarządzanie oknami). Przy zamykaniu programu to okno jest zamykane wraz z nim; jeśli są jeszcze otwarte połączenia, program najpierw pyta, czy wszystkie mają zostać rozłączone.
help.systemsText.da=Vinduet **Systemer** udlæser indholdet af et digitalt system (BiDiB eller ESU ECoS) og overfører det til en iTrain-fil. Øverst i værktøjslinjen vælger rullelisten systemet (BiDiB/ESU ECoS), ved siden af findes **Forbind** og **Udlæs**; de samme funktioner findes også i menuen **Systemer**, hver i sin egen undermenu for BiDiB og for ESU. Märklin, Z21, Lokstore og ZIMO er allerede oprettet som undermenuer, men endnu uden funktion.\n\n**1. Forbind**\n**Systemer → BiDiB → Forbind...** eller **ESU → Forbind...** åbner det tilhørende forbindelsesvindue (se de egne hjælpeafsnit om BiDiB nedenfor, eller om ECoS). Flere forbindelser samtidig er muligt; hver vises med et navn og en grøn/rød lysende cirkel nederst til højre i statuslinjen.\n\n**2. Udlæs**\n**Udlæs** udlæser indholdet af den valgte forbindelse:\n- Med **BiDiB** åbnes **knudetræet**: alle meldte knuder med deres porte (tilbagemelde-, tilbehørs- og, ved en mc2, også lokomotivporte), der kan udfoldes som et mappetræ.\n- Med **ESU ECoS** opstår samme træ ud fra de udlæste ECoS-data - interface, tilbehør (sporskifter/signaler) og lokomotiver.\n- Er der flere forbindelser åbne, spørger en lille rulleliste på knappen først, hvilken der er tale om.\n- Selv uden en aktiv forbindelse kan træet åbnes fra en allerede gemt systemfil eller, ved BiDiB, fra simuleringsfilen (.xml) fra BiDiB Wizard: **Systemer → BiDiB/ESU → Indlæs systemfil...**.\n\n**3. Markere (vælge)**\nI knudetræet står der et **afkrydsningsfelt** foran hver knude, hver portmappe og hver enkelt port - kun ved egenskaberne mangler det, da de kun er til visning. Et flueben ved knuden eller mappen markerer samtidig alle dens porte; feltet **Vælg alle** over træet markerer eller fjerner markeringen for hele træet. Statuslinjen tæller løbende, hvor mange porte der aktuelt er markeret.\n\n**4. Overfør til iTrain-objekter**\nKnappen **Anvend markering** gør de markerede porte til færdige iTrain-objekter og indfører dem i tabellerne i Systemer-vinduet: interfacet altid, en tilbagemelder for hver markeret tilbagemeldeport, et tilbehør for hver tilbehørsport (byggetypen spørges der om én gang), en booster for hver markeret boosterknude, og ved ECoS desuden lokomotiverne. Porte, der allerede er overført (genkendt på samme iTrain-id), oprettes ikke igen ved en ny overførsel.\n\n**5. Rediger objekter**\nUnder værktøjslinjen vises for hver kategori en egen sektion, der kun er synlig, når der findes rækker - **Interface**, **Booster**, **Tilbagemelder**, **Tilbehør** og, ved ECoS, **Lokomotiver** - hver med sit eget felt **Vælg alle** og kolonnerne Navn i system, Valgt, Nyt navn i iTrain, Beskrivelse (havner ved import i iTrain-feltet med samme navn), Tilknytning i iTrain (se 5a), Type (og ved tilbagemeldere desuden Længde), Interface. Type og Interface er bevidst holdt smalle og kan gøres bredere med musen. Redigering sker ikke direkte i tabellen (bortset fra fluebenet "Valgt"), men i et eget redigeringsvindue - marker linjen, tryk derefter Enter, dobbeltklik eller knappen **Rediger linje** til højre over tabellen. For hver kategori findes de passende felter der (f.eks. ved tilbehør de ti iTrain-sporskiftetyper og grundstillingen, ved tilbagemeldere type/side/længde, ved boostere grænseværdierne for skinnespænding, hovedskinnestrøm og temperatur). Delete eller **Slet linje** fjerner markerede linjer igen, **Ryd tabeller** tømmer alle tabeller på én gang (med bekræftelse) - den åbnede systemfil forbliver koblet til.\n\n**5a. Afstemning med en eksisterende iTrain-fil**\nKnappen **Indlæs iTrain-fil...** (også i menuen **Filer**) indlæser en eksisterende .tcdz/.tcd som fælles fil for alle programdele - den vises også i hovedvinduet og Dekoder-vinduet. Er der allerede indlæst en fil der, gælder den automatisk her. Derefter knytter programmet automatisk hver række, der allerede findes i filen: tilbagemeldere, tilbehør og boostere via deres BiDiB-id, interfacet via navn eller adresse. Alt andet står på **Ny**. I kolonnen **Tilknytning i iTrain** kan hver række knyttes manuelt til en eksisterende post i samme kategori eller sættes tilbage til "Ny".\n- En tilknyttet række overtager iTrain-navnet (det er så låst i redigeringsvinduet, ellers ville importen ikke genkende posten). Ved eksport skrives den EKSISTERENDE iTrain-post, hvor kun BiDiB-tilknytningen (id, interface) og beskrivelsen opdateres - data, der vedligeholdes i iTrain, som type, længde, indstillinger eller belægninger, bevares. Vælg "Synkroniser" ved import i hovedvinduet.\n- Knyttes interfacet, overtager alle rækker interfacets iTrain-navn.\n- "Ny"-rækker oprettes med navnet fra kolonnen **Nyt navn i iTrain**.\n- **Skriv til iTrain-fil** overfører de markerede rækker direkte til den indlæste fil - helt uden eksportfiler: tilknyttede poster opdateres på deres plads, nye tilføjes (poster med samme navn får "(2)" osv.). Forinden laver programmet en sikkerhedskopi i backup-mappen; iTrain må ikke have filen åben. Ændringerne er derefter synlige i alle programdele og kan fortrydes med **Fortryd** i hovedvinduet.\n\nKolonnebredderne i alle tabeller kan ændres med musen og huskes.\n\n**6. Gem som systemfil**\nMenuen **Fil** i dette vindue (Åbn/Gem/Luk aktuel) arbejder på en egen **systemfil** (filtype `.bidibsys`, teknisk en ZIP med en CSV indeni) - ikke på hovedvinduets iTrain-fil. Den indeholder både det udlæste knudetræ og de allerede overførte iTrain-objekter; **Gem** placerer den i den indstillede sti for systemfiler (Præferencer → Stier), **Åbn** indlæser senere en gemt fil igen - praktisk for ikke at skulle gentage en udlæsning eller for at fortsætte arbejdet på en anden computer.\n\n**7. Eksportere og indsætte i en eksisterende iTrain-fil**\nNår tabellerne indeholder de ønskede objekter:\n- **Eksporter markerede** skriver kun de linjer, der er markeret som "Valgt" (interfacet er altid inkluderet), **Eksporter alle** skriver alle linjer uanset markering.\n- For hver kategori (Interface, Booster, Tilbagemelder, Tilbehør, Lokomotiver) opstår der derved en egen **.zip-fil** - præcis det format, som knappen **Importer i kategori** i hovedvinduet forventer. Der spørges kun én gang - med et foreslået navn, som kan ændres og derefter bruges som begyndelse på alle filnavne. Alle filer fra én eksport udgør et **eksportsæt** og kan genkendes på den fælles navnestart (interface + dato/klokkeslæt) og nummeret, f.eks. "IFnet_20261009-1430_1af2_interfaces.zip" og "IFnet_20261009-1430_2af2_feedbacks.zip". Nummeret er samtidig den anbefalede importrækkefølge (interfacet først).\n- I hovedvinduet: åbn den ønskede iTrain-fil (eller, hvis det er den første overførsel, opret kun en næsten tom fil rudimentært), skift til den passende fane og anvend der **Importer i kategori** på den eksporterede .zip - en fil pr. kategori, i hvilken som helst rækkefølge.\n- Refererede poster (f.eks. det interface, en tilbagemelder henviser til) er inkluderet i hver eksportfil, så iTrain bagefter kan åbne målfilen uden fejlmeddelelse.\n\nSådan kan man også starte med en næsten tom iTrain-fil: opret filen i iTrain kun rudimentært, udlæs alt det nødvendige her og overfør det som import, og efterbearbejd det derefter i hånden i iTrain (f.eks. ved at indbygge tilbagemelderne i sporafsnit).\n\nStørrelse, position og skærm for vinduet huskes som ved alle vinduer (se hovedvinduets hjælp, afsnittet Vindueshåndtering). Når programmet afsluttes, lukkes dette vindue med; er der stadig åbne forbindelser, spørger programmet først, om de alle skal afbrydes.
help.systemsText.sv=Fönstret **System** läser av innehållet i ett digitalt system (BiDiB eller ESU ECoS) och för det över till en iTrain-fil. Överst i verktygsfältet väljer rullistan systemet (BiDiB/ESU ECoS), bredvid finns **Anslut** och **Läs av**; samma funktioner finns även i menyn **System**, var och en i en egen undermeny för BiDiB och för ESU. Märklin, Z21, Lokstore och ZIMO finns redan som undermenyer, men ännu utan funktion.\n\n**1. Anslut**\n**System → BiDiB → Anslut...** resp. **ESU → Anslut...** öppnar motsvarande anslutningsfönster (se de egna hjälpavsnitten om BiDiB nedan resp. om ECoS). Flera anslutningar samtidigt är möjligt; varje visas med ett namn och en grön/röd lysande cirkel nere till höger i statusfältet.\n\n**2. Läs av**\n**Läs av** läser av innehållet i den valda anslutningen:\n- Med **BiDiB** öppnas **nodträdet**: alla anmälda noder med sina portar (återkopplings-, tillbehörs- och, för en mc2, även lokportar), expanderbart som ett mappträd.\n- Med **ESU ECoS** byggs samma träd upp från de avlästa ECoS-uppgifterna - gränssnitt, tillbehör (växlar/signaler) och lok.\n- Är flera anslutningar öppna frågar en liten rullmeny på knappen först vilken som avses.\n- Även utan aktiv anslutning kan trädet öppnas från en redan sparad systemfil eller, för BiDiB, från simuleringsfilen (.xml) från BiDiB Wizard: **System → BiDiB/ESU → Läs in systemfil...**.\n\n**3. Markera (välja)**\nI nodträdet finns en **kryssruta** framför varje nod, varje portmapp och varje enskild port - endast egenskaperna saknar den, eftersom de bara är för visning. En bock vid noden eller mappen markerar samtidigt alla dess portar; rutan **Markera allt** ovanför trädet markerar eller avmarkerar hela trädet. Statusfältet räknar löpande hur många portar som just nu är markerade.\n\n**4. Föra över till iTrain-objekt**\nKnappen **Tillämpa markering** gör de markerade portarna till färdiga iTrain-objekt och för dem in i tabellerna i System-fönstret: gränssnittet alltid, en återmelder per markerad återkopplingsport, ett tillbehör per tillbehörsport (typen frågas då efter en gång), en booster per markerad boosternod, och för ECoS dessutom loken. Portar som redan har förts över (igenkända på samma iTrain-id) skapas inte en gång till vid en ny överföring.\n\n**5. Redigera objekt**\nUnder verktygsfältet visas för varje kategori ett eget avsnitt, som bara syns när det finns rader - **Gränssnitt**, **Booster**, **Återkoppling**, **Tillbehör** och, för ECoS, **Lok** - vardera med en egen ruta **Markera allt** och kolumnerna Namn i systemet, Markerad, Nytt namn i iTrain, Beskrivning (hamnar vid import i iTrain-fältet med samma namn), Koppling i iTrain (se 5a), Typ (och för återmeldare även Längd), Gränssnitt. Typ och Gränssnitt är medvetet smala och kan göras bredare med musen. Redigering sker inte direkt i tabellen (bortsett från bocken "Markerad"), utan i ett eget redigeringsfönster - markera raden, tryck sedan Enter, dubbelklicka eller knappen **Redigera rad** ovanför tabellen till höger. För varje kategori finns där de passande fälten (t.ex. för tillbehör de tio iTrain-växeltyperna och grundläget, för återmeldare typ/sida/längd, för boostrar gränsvärdena för spänning, huvudspårsström och temperatur). Delete eller **Ta bort rad** tar bort markerade rader igen, **Rensa tabeller** tömmer alla tabeller på en gång (med bekräftelse) - den öppna systemfilen förblir kopplad.\n\n**5a. Jämförelse med en befintlig iTrain-fil**\nKnappen **Läs in iTrain-fil...** (även i menyn **Arkiv**) läser in en befintlig .tcdz/.tcd som gemensam fil för alla programdelar - den visas även i huvudfönstret och Dekoder-fönstret. Är en fil redan inläst där gäller den automatiskt här. Därefter kopplar programmet automatiskt varje rad som redan finns i filen: återmeldare, tillbehör och boostrar via sitt BiDiB-id, gränssnittet via namn eller adress. Allt annat står på **Ny**. I kolumnen **Koppling i iTrain** kan varje rad kopplas för hand till en befintlig post i samma kategori eller åter sättas på "Ny".\n- En kopplad rad tar över iTrain-namnet (det är då låst i redigeringsfönstret, annars skulle importen inte känna igen posten). Vid export skrivs den BEFINTLIGA iTrain-posten, där bara BiDiB-kopplingen (id, gränssnitt) och beskrivningen uppdateras - uppgifter som underhålls i iTrain, som typ, längd, alternativ eller beläggningar, behålls. Välj "Synkronisera" vid import i huvudfönstret.\n- Kopplas gränssnittet tar alla rader över gränssnittets iTrain-namn.\n- "Ny"-rader skapas med namnet från kolumnen **Nytt namn i iTrain**.\n- **Skriv till iTrain-fil** för över de markerade raderna direkt till den inlästa filen - helt utan exportfiler: kopplade poster uppdateras på sin plats, nya läggs till (poster med samma namn får "(2)" osv.). Innan dess gör programmet en säkerhetskopia i säkerhetskopiemappen; iTrain får inte ha filen öppen. Ändringarna syns sedan i alla programdelar och kan ångras med **Ångra** i huvudfönstret.\n\nKolumnbredderna i alla tabeller kan ändras med musen och sparas.\n\n**6. Spara som systemfil**\nMenyn **Arkiv** i det här fönstret (Öppna/Spara/Stäng aktuell) arbetar med en egen **systemfil** (filtyp `.bidibsys`, tekniskt en ZIP med en CSV inuti) - inte med huvudfönstrets iTrain-fil. Den innehåller både det avlästa nodträdet och de redan överförda iTrain-objekten; **Spara** lägger den i den inställda sökvägen för systemfiler (Inställningar → Sökvägar), **Öppna** läser senare in en sparad fil igen - praktiskt för att inte behöva upprepa en avläsning eller för att fortsätta arbeta på en annan dator.\n\n**7. Exportera och infoga i en befintlig iTrain-fil**\nNär tabellerna innehåller de önskade objekten:\n- **Exportera markerade** skriver bara raderna med bock i "Markerad" (gränssnittet ingår alltid), **Exportera allt** skriver alla rader, oavsett bock.\n- För varje kategori (Gränssnitt, Booster, Återkoppling, Tillbehör, Lok) skapas därmed en egen **.zip-fil** - exakt det format som knappen **Importera i kategori** i huvudfönstret förväntar sig. Frågan ställs bara en gång - med ett föreslaget namn som kan ändras och sedan blir början på alla filnamn. Alla filer från en export bildar en **exportsats** och känns igen på den gemensamma namnbörjan (gränssnitt + datum/tid) och numret, t.ex. "IFnet_20261009-1430_1av2_interfaces.zip" och "IFnet_20261009-1430_2av2_feedbacks.zip". Numret är också den rekommenderade importordningen (gränssnittet först).\n- I huvudfönstret: öppna mål-iTrain-filen (eller, om det är den första överföringen, skapa endast en nästan tom fil rudimentärt), växla till motsvarande flik och tillämpa där **Importera i kategori** på den exporterade .zip-filen - en fil per kategori, i valfri ordning.\n- Refererade poster (t.ex. gränssnittet som en återmelder pekar på) ingår i varje exportfil, så att iTrain sedan kan öppna målfilen utan felmeddelande.\n\nSå kan man även starta med en nästan tom iTrain-fil: skapa filen i iTrain bara rudimentärt, läs av allt nödvändigt här och för över det som import, bearbeta det sedan för hand i iTrain (t.ex. genom att bygga in återmeldarna i spåravsnitt).\n\nStorlek, position och skärm för fönstret sparas som för alla fönster (se huvudfönstrets hjälp, avsnittet Fönsterhantering). När programmet avslutas stängs det här fönstret med; finns det fortfarande öppna anslutningar frågar programmet först om alla ska kopplas ner.

