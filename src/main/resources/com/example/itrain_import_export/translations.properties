help.decoderText.de=In den Reitern **Lokomotiven** und **Wagen** beschreibt der Unterbereich **configuration** im Daten-Explorer den eingebauten Decoder: seine CV-Werte samt Beschreibungen. Weil diese Angaben je Decoder-Typ gleich sind, lassen sie sich als **Vorlage** speichern und in andere Fahrzeuge übernehmen. Dafür gibt es in der Werkzeugleiste oben im Fenster zwei weitere Schaltflächen, die nur bei diesen beiden Reitern benutzbar sind:\n\n- **Decoder exportieren** speichert den configuration-Bereich des markierten Fahrzeugs als Vorlage im Ordner für Decoder-Vorlagen. Abgefragt werden eine Bezeichnung (sie erscheint später in der Auswahl) und wahlweise eine Beschreibung.\n- **Decoder importieren** übernimmt eine Vorlage in das markierte Fahrzeug. Es öffnet sich eine Liste aller installierten Vorlagen mit Suchfeld; ein Tastendruck springt zur ersten Vorlage mit diesem Anfangsbuchstaben, und über die Spaltenköpfe lässt sich umsortieren. Mit **Datei wählen...** kann stattdessen eine beliebige Vorlagen-Datei von der Festplatte geladen werden.\n\nEs muss dabei immer **genau ein** Fahrzeug markiert sein, denn eine Decoder-Konfiguration gehört zu genau einem Fahrzeug.\n\nSo lässt sich eine Lokomotive zunächst in iTrain mit Standardwerten anlegen und speichern; die Decoder-Daten kommen anschließend hier an der richtigen Stelle hinzu. Fehlt der configuration-Bereich im Fahrzeug noch ganz, wird er beim Import neu angelegt. Ist er bereits vorhanden, wird er **vollständig ersetzt** - das Programm fragt vorher nach, und **Rückgängig** macht den Vorgang wieder rückgängig.\n\n**Vorlagen installieren:** Unter Einstellungen gibt es zwei weitere Menüpunkte. **Decoder-Vorlagen installieren** liest eine zuvor heruntergeladene Sammlung (decoder.zip) ein: nach einer Rückfrage wird die Datei ausgewählt und ihr Inhalt in den Ordner für Decoder-Vorlagen entpackt. Der Ordner wird beim allerersten Programmstart abgefragt und lässt sich jederzeit unter Voreinstellungen → Pfade ändern. **Decoder-Vorlagen** öffnet ein eigenes, in der Größe veränderbares Fenster mit allen installierten Vorlagen samt Suchfeld. Dort sind bewusst nur Bezeichnung, Beschreibung und die Anzahl der CV-Einträge zu sehen - die Werte selbst zeigt erst der Import in ein Fahrzeug. Unten im Fenster stehen Version und Installationsdatum der eingelesenen Sammlung. Neben der Sammlung lassen sich über **Decoder-Datei...** auch einzelne Vorlagen einlesen - eine selbst erfasste, eine zugeschickte .csv-Datei oder mehrere auf einmal; jede wird vor dem Kopieren geprüft, damit keine gewöhnliche Export-Datei im Vorlagen-Ordner landet.\n\nEine Vorlagen-Datei enthält nur den configuration-Bereich, keinen vollständigen Eintrag. Der normale Knopf **In Kategorie importieren** weist solche Dateien deshalb mit einem Hinweis ab.\n\n**Wichtig - die Digital-Adresse:** Eine Vorlage enthält immer auch die Digital-Adresse (CV 1 bzw. CV 17/18) des Fahrzeugs, aus dem sie ursprünglich stammt. Nach dem Import zeigt das Programm deshalb einen Hinweis: Der Wert im Decoder des Zielfahrzeugs ist ein anderer und muss nach dem Start von iTrain über POM (Programmierung auf dem Hauptgleis) oder von Hand richtiggestellt werden. Andernfalls spricht iTrain das Fahrzeug unter einer falschen Adresse an.\n\n**Fassung der Vorlagen-Sammlung:** Enthält die decoder.zip eine Versionsangabe, wird sie beim Installieren mit der bereits vorhandenen verglichen. Ist das gewählte Archiv nicht neuer, fragt das Programm nach und bietet **Alte behalten** an - so überschreibt eine versehentlich gewählte ältere Datei nicht stillschweigend die neueren Vorlagen. Ein bewusster Schritt zurück bleibt über **Trotzdem installieren** möglich.\n\n**CV-Werte ansehen und ändern:** Im Fenster **Decoder-Vorlagen** öffnet **In eigenem Fenster bearbeiten** - oder ein Doppelklick auf die Zeile - die markierte Vorlage in der großen CV-Tabelle. Dort lassen sich die Werte ansehen und ändern; **Speichern** schreibt sie in dieselbe Datei zurück, **Speichern als...** legt unter neuem Namen eine zusätzliche Vorlage an. Die Werte eines Fahrzeugs bearbeitest du auf demselben Weg über den Daten-Explorer: Knoten **configuration** auswählen und **In eigenem Fenster bearbeiten** anklicken.\n\n**Anmerkung zu den Vorlagen:** Es stehen verschiedene Vorlagen zum Herunterladen bereit. Sie wurden aus den .pdf-Anleitungen der Hersteller abgeleitet und enthalten oft nur Teile der gesamten Decoder-Konfiguration - im Fall von ZIMO etwa sehr lange Texte, die kaum in eine Beschreibung passen. Trotzdem ist damit schon einiges brauchbar: Der Decoder lässt sich in iTrain über POM oder das Programmiergleis umfänglich abfragen. Kommt dabei an manchen Stellen keine Information zurück, ist der Decoder mit der Vorlage womöglich nicht vollständig kompatibel. Genau deshalb sind die Vorlagen anpassbar und unter anderem Namen speicherbar.\n\n**Nicht jedes Protokoll kennt CV-Werte:** Welches Digital-Protokoll ein Fahrzeug verwendet, steht im Daten-Explorer unter **decoder** im Feld **protocol**. Davon hängt ab, was ein Import übernehmen darf:\n- **dcc**, **fmz**, **ctc** und **sx2**: die vollständige Vorlage.\n- **sx1**: höchstens 5 Werte. Enthält die Vorlage mehr, fragt das Programm nach und übernimmt nur die ersten 5.\n- **mot**, **multi** und **analog**: kein Import. Diese Protokolle haben keine CV-Konfiguration; das Programm weist den Versuch mit einer Meldung ab.\n\nDie Regel gilt für beide Wege gleichermaßen - für **Decoder importieren** in der Werkzeugleiste wie für **Vorlage einlesen** im Bearbeiten-Fenster. Von Hand eingetragene Werte bleiben davon unberührt.\n\n**Wagen ohne Decoder:** Viele Wagen haben in iTrain gar keinen Decoder eingetragen. Dort genügt es **nicht**, nur die Konfiguration einzufügen - ohne zugehörigen Decoder zeigt iTrain die CV-Werte überhaupt nicht an. Das Programm fragt deshalb nach und legt auf Wunsch gleich einen Decoder mit an; das Protokoll wählst du dabei aus (dcc, fmz, ctc, sx2, sx1). Bei Lokomotiven bleibt es bei einer Warnung - eine Lok ohne Decoder deutet eher auf einen Fehler in der Datei hin.
help.decoderText.en=In the **Locomotives** and **Wagons** tabs, the **configuration** sub-area in the Data Explorer describes the built-in decoder: its CV values along with their descriptions. Since this information is the same for a given decoder type, it can be saved as a **template** and applied to other vehicles. For this, the toolbar at the top of the window holds two further buttons, usable only on these two tabs:\n\n- **Export decoder** saves the configuration area of the selected vehicle as a template in the decoder templates folder. You are asked for a name (it appears in the selection later) and optionally a description.\n- **Import decoder** applies a template to the selected vehicle. A list of all installed templates opens with a search field; pressing a key jumps to the first template starting with that letter, and the column headers allow re-sorting. With **Choose file...** you can instead load any template file from disk.\n\nExactly **one** vehicle must be selected, because a decoder configuration belongs to exactly one vehicle.\n\nThis lets you first create a locomotive in iTrain with default values and save it; the decoder data is then added here in the right place. If the vehicle has no configuration area yet, it is created during import. If one already exists, it is **completely replaced** - the program asks first, and **Undo** reverts the operation.\n\n**Installing templates:** Two further menu items are available under Settings. **Install decoder templates** reads in a previously downloaded collection (decoder.zip): after a confirmation you select the file and its contents are unpacked into the decoder templates folder. The folder is requested on the very first program start and can be changed at any time under Preferences → Paths. **Decoder templates** opens a separate, resizable window listing all installed templates with a search field. Deliberately only the name, description and number of CV entries are shown there - the values themselves only become visible after importing into a vehicle. At the bottom of the window you find the version and installation date of the collection. Besides the collection, **Decoder file...** reads in individual templates as well - one you created yourself, a .csv someone sent you, or several at once; each is checked before copying so that no ordinary export file ends up in the templates folder.\n\nA template file only contains the configuration area, not a complete entry. The regular **Import into category** button therefore rejects such files with a note.\n\n**Important - the digital address:** A template always also contains the digital address (CV 1 or CV 17/18) of the vehicle it originally came from. After the import the program therefore shows a note: the value in the target vehicle's decoder is a different one and must be corrected after starting iTrain, via POM (programming on the main) or by hand. Otherwise iTrain will address the vehicle under a wrong address.\n\n**Version of the template collection:** If decoder.zip carries a version, it is compared with the one already installed. If the chosen archive is not newer, the program asks and offers **Keep the old ones** - so an accidentally chosen older file does not silently overwrite the newer templates. A deliberate step back remains possible via **Install anyway**.\n\n**Viewing and changing CV values:** In the **Decoder templates** window, **Edit in a separate window** - or a double-click on the row - opens the selected template in the large CV table. There the values can be viewed and changed; **Save** writes them back into the same file, **Save as...** creates an additional template under a new name. A vehicle's values are edited the same way via the data explorer: select the **configuration** node and click **Edit in a separate window**.\n\n**Note on the templates:** Various templates are available for download. They were derived from the manufacturers' .pdf manuals and often cover only parts of the full decoder configuration - with ZIMO, for instance, very long texts that hardly fit into a description. Even so, much of it is usable: the decoder can be read out thoroughly in iTrain via POM or the programming track. If no information comes back at some points, the decoder may not be fully compatible with the template. That is precisely why templates can be adapted and saved under a different name.\n\n**Not every protocol has CV values:** The digital protocol a vehicle uses is shown in the data explorer under **decoder** in the field **protocol**. It determines what an import may apply:\n- **dcc**, **fmz**, **ctc** and **sx2**: the complete template.\n- **sx1**: at most 5 values. If the template holds more, the program asks and applies only the first 5.\n- **mot**, **multi** and **analog**: no import. These protocols have no CV configuration; the program rejects the attempt with a message.\n\nThe rule applies to both routes alike - to **Import decoder** in the toolbar as well as to **Load template** in the editing window. Values entered by hand are not affected.\n\n**Wagons without a decoder:** Many wagons have no decoder recorded in iTrain at all. There it is **not** enough to insert only the configuration - without a matching decoder, iTrain does not show the CV values at all. The program therefore asks and, if you want, creates a decoder as well; you pick the protocol (dcc, fmz, ctc, sx2, sx1). For locomotives it stays at a warning - a locomotive without a decoder points to an error in the file rather than a missing entry.
help.decoderText.nl=In de tabbladen **Locomotieven** en **Wagons** beschrijft het subgebied **configuration** in de Gegevensverkenner de ingebouwde decoder: de CV-waarden met hun beschrijvingen. Omdat deze gegevens per decodertype gelijk zijn, kunnen ze als **sjabloon** worden opgeslagen en in andere voertuigen worden overgenomen. Daarvoor staan in de werkbalk bovenaan het venster twee extra knoppen, die alleen bij deze twee tabbladen bruikbaar zijn:\n\n- **Decoder exporteren** slaat het configuration-gebied van het geselecteerde voertuig op als sjabloon in de map voor decodersjablonen. Gevraagd worden een naam (die later in de keuzelijst verschijnt) en eventueel een beschrijving.\n- **Decoder importeren** neemt een sjabloon over in het geselecteerde voertuig. Er opent een lijst met alle geïnstalleerde sjablonen met zoekveld; een toetsaanslag springt naar het eerste sjabloon met die beginletter, en via de kolomkoppen kan worden gesorteerd. Met **Bestand kiezen...** kan in plaats daarvan een willekeurig sjabloonbestand van de schijf worden geladen.\n\nEr moet altijd **precies één** voertuig geselecteerd zijn, want een decoderconfiguratie hoort bij precies één voertuig.\n\nZo kan een locomotief eerst in iTrain met standaardwaarden worden aangemaakt en opgeslagen; de decodergegevens komen daarna hier op de juiste plek erbij. Ontbreekt het configuration-gebied nog helemaal, dan wordt het bij het importeren aangemaakt. Bestaat het al, dan wordt het **volledig vervangen** - het programma vraagt vooraf om bevestiging, en **Ongedaan maken** draait de handeling weer terug.\n\n**Sjablonen installeren:** Onder Instellingen staan twee extra menupunten. **Decodersjablonen installeren** leest een eerder gedownloade verzameling (decoder.zip) in: na een bevestiging wordt het bestand gekozen en de inhoud uitgepakt in de map voor decodersjablonen. De map wordt bij de allereerste programmastart gevraagd en kan altijd worden gewijzigd via Voorkeuren → Paden. **Decodersjablonen** opent een apart, in grootte aanpasbaar venster met alle geïnstalleerde sjablonen en een zoekveld. Daar zijn bewust alleen naam, beschrijving en het aantal CV-items te zien - de waarden zelf toont pas de import in een voertuig. Onderin het venster staan versie en installatiedatum van de ingelezen verzameling. Naast de verzameling kunnen via **Decoderbestand...** ook losse sjablonen worden ingelezen - een zelf vastgelegd sjabloon, een toegestuurd .csv-bestand of meerdere tegelijk; elk wordt vóór het kopiëren gecontroleerd, zodat geen gewoon exportbestand in de sjabloonmap belandt.\n\nEen sjabloonbestand bevat alleen het configuration-gebied, geen volledig item. De gewone knop **In categorie importeren** wijst zulke bestanden daarom met een melding af.\n\n**Belangrijk - het digitale adres:** Een sjabloon bevat altijd ook het digitale adres (CV 1 of CV 17/18) van het voertuig waar het oorspronkelijk vandaan komt. Na het importeren toont het programma daarom een melding: de waarde in de decoder van het doelvoertuig is een andere en moet na het starten van iTrain via POM (programmeren op het hoofdspoor) of handmatig worden gecorrigeerd. Anders spreekt iTrain het voertuig op een verkeerd adres aan.\n\n**Versie van de sjabloonverzameling:** Bevat de decoder.zip een versieaanduiding, dan wordt die bij het installeren vergeleken met de reeds aanwezige. Is het gekozen archief niet nieuwer, dan vraagt het programma na en biedt **Oude behouden** aan - zo overschrijft een per ongeluk gekozen ouder bestand niet stilzwijgend de nieuwere sjablonen. Een bewuste stap terug blijft mogelijk via **Toch installeren**.\n\n**CV-waarden bekijken en wijzigen:** In het venster **Decodersjablonen** opent **In eigen venster bewerken** - of dubbelklikken op de regel - het geselecteerde sjabloon in de grote CV-tabel. Daar kunnen de waarden worden bekeken en gewijzigd; **Opslaan** schrijft ze terug naar hetzelfde bestand, **Opslaan als...** maakt onder een nieuwe naam een extra sjabloon aan. De waarden van een voertuig bewerk je op dezelfde manier via de data-explorer: knooppunt **configuration** selecteren en op **In eigen venster bewerken** klikken.\n\n**Opmerking over de sjablonen:** Er staan verschillende sjablonen klaar om te downloaden. Ze zijn afgeleid van de .pdf-handleidingen van de fabrikanten en bevatten vaak slechts delen van de volledige decoderconfiguratie - bij ZIMO bijvoorbeeld zeer lange teksten die nauwelijks in een beschrijving passen. Toch is er al veel bruikbaar: de decoder kan in iTrain via POM of het programmeerspoor uitgebreid worden uitgelezen. Komt op sommige punten geen informatie terug, dan is de decoder mogelijk niet volledig compatibel met het sjabloon. Juist daarom zijn de sjablonen aanpasbaar en onder een andere naam op te slaan.\n\n**Niet elk protocol kent CV-waarden:** Welk digitaal protocol een voertuig gebruikt, staat in de gegevensverkenner onder **decoder** in het veld **protocol**. Daarvan hangt af wat een import mag overnemen:\n- **dcc**, **fmz**, **ctc** en **sx2**: het volledige sjabloon.\n- **sx1**: hoogstens 5 waarden. Bevat het sjabloon er meer, dan vraagt het programma na en neemt alleen de eerste 5 over.\n- **mot**, **multi** en **analog**: geen import. Deze protocollen hebben geen CV-configuratie; het programma wijst de poging met een melding af.\n\nDe regel geldt voor beide wegen gelijk - voor **Decoder importeren** in de werkbalk zowel als voor **Sjabloon inlezen** in het bewerkvenster. Met de hand ingevoerde waarden blijven onaangetast.\n\n**Wagens zonder decoder:** Veel wagens hebben in iTrain helemaal geen decoder ingevuld. Daar is het **niet** genoeg om alleen de configuratie in te voegen - zonder bijbehorende decoder toont iTrain de CV-waarden helemaal niet. Het programma vraagt daarom en maakt desgewenst meteen een decoder aan; het protocol kies je daarbij (dcc, fmz, ctc, sx2, sx1). Bij locomotieven blijft het bij een waarschuwing - een loc zonder decoder wijst eerder op een fout in het bestand.
help.decoderText.fr=Dans les onglets **Locomotives** et **Wagons**, la sous-partie **configuration** de l'Explorateur de données décrit le décodeur installé : ses valeurs CV et leurs descriptions. Comme ces indications sont identiques pour un même type de décodeur, elles peuvent être enregistrées comme **modèle** et reprises dans d'autres véhicules. Pour cela, la barre d'outils en haut de la fenêtre comporte deux boutons supplémentaires, utilisables uniquement sur ces deux onglets :\n\n- **Exporter le décodeur** enregistre la partie configuration du véhicule sélectionné comme modèle dans le dossier des modèles de décodeur. Un nom est demandé (il apparaîtra ensuite dans la sélection) ainsi qu'une description facultative.\n- **Importer le décodeur** applique un modèle au véhicule sélectionné. Une liste de tous les modèles installés s'ouvre avec un champ de recherche ; une frappe au clavier saute au premier modèle commençant par cette lettre, et les en-têtes de colonnes permettent de trier. Avec **Choisir un fichier...**, on peut à la place charger n'importe quel fichier de modèle depuis le disque.\n\nIl faut toujours qu'**exactement un** véhicule soit sélectionné, car une configuration de décodeur appartient à un seul véhicule.\n\nAinsi, une locomotive peut d'abord être créée dans iTrain avec des valeurs par défaut puis enregistrée ; les données du décodeur sont ajoutées ensuite ici, au bon endroit. Si la partie configuration manque encore totalement, elle est créée lors de l'import. Si elle existe déjà, elle est **entièrement remplacée** - le programme demande confirmation au préalable, et **Annuler** revient en arrière.\n\n**Installer des modèles :** Deux autres entrées figurent dans le menu Paramètres. **Installer les modèles de décodeur** lit une collection téléchargée au préalable (decoder.zip) : après une confirmation, le fichier est choisi et son contenu décompressé dans le dossier des modèles de décodeur. Ce dossier est demandé au tout premier démarrage du programme et peut être modifié à tout moment sous Préférences → Chemins. **Modèles de décodeur** ouvre une fenêtre distincte et redimensionnable listant tous les modèles installés avec un champ de recherche. Seuls le nom, la description et le nombre d'entrées CV y sont volontairement affichés - les valeurs elles-mêmes n'apparaissent qu'après import dans un véhicule. En bas de la fenêtre figurent la version et la date d'installation de la collection. Outre la collection, **Fichier de décodeur...** permet aussi de charger des modèles isolés - un modèle que vous avez saisi, un fichier .csv qu'on vous a envoyé, ou plusieurs à la fois ; chacun est vérifié avant la copie afin qu'aucun fichier d'export ordinaire n'atterrisse dans le dossier des modèles.\n\nUn fichier de modèle ne contient que la partie configuration, pas une entrée complète. Le bouton habituel **Importer dans la catégorie** rejette donc ces fichiers avec un message.\n\n**Important - l'adresse numérique :** Un modèle contient toujours aussi l'adresse numérique (CV 1 ou CV 17/18) du véhicule dont il provient à l'origine. Après l'import, le programme affiche donc un avertissement : la valeur dans le décodeur du véhicule cible est différente et doit être corrigée après le démarrage d'iTrain, via POM (programmation sur la voie principale) ou manuellement. Sinon, iTrain s'adressera au véhicule avec une mauvaise adresse.\n\n**Version de la collection de modèles :** Si le fichier decoder.zip porte une indication de version, elle est comparée lors de l'installation à celle déjà présente. Si l'archive choisie n'est pas plus récente, le programme demande confirmation et propose **Conserver les anciens** - ainsi un fichier plus ancien choisi par mégarde n'écrase pas silencieusement les modèles plus récents. Un retour en arrière volontaire reste possible via **Installer quand même**.\n\n**Consulter et modifier les valeurs CV :** Dans la fenêtre **Modèles de décodeur**, **Modifier dans une fenêtre séparée** - ou un double-clic sur la ligne - ouvre le modèle sélectionné dans le grand tableau CV. Les valeurs s'y consultent et se modifient ; **Enregistrer** les réécrit dans le même fichier, **Enregistrer sous...** crée un modèle supplémentaire sous un nouveau nom. Les valeurs d'un véhicule se modifient de la même façon via l'explorateur de données : sélectionner le nœud **configuration** et cliquer sur **Modifier dans une fenêtre séparée**.\n\n**Remarque sur les modèles :** Différents modèles sont proposés au téléchargement. Ils ont été tirés des notices .pdf des fabricants et ne couvrent souvent qu'une partie de la configuration complète du décodeur - chez ZIMO par exemple des textes très longs qui tiennent difficilement dans une description. Beaucoup reste néanmoins exploitable : le décodeur peut être interrogé en détail dans iTrain via POM ou la voie de programmation. Si aucune information ne revient à certains endroits, le décodeur n'est peut-être pas entièrement compatible avec le modèle. C'est précisément pour cela que les modèles sont modifiables et enregistrables sous un autre nom.\n\n**Tous les protocoles ne connaissent pas les CV :** Le protocole numérique utilisé par un véhicule figure dans l'explorateur de données sous **decoder**, dans le champ **protocol**. Il détermine ce qu'un import peut reprendre :\n- **dcc**, **fmz**, **ctc** et **sx2** : le modèle complet.\n- **sx1** : au maximum 5 valeurs. Si le modèle en contient davantage, le programme demande confirmation et ne reprend que les 5 premières.\n- **mot**, **multi** et **analog** : aucun import. Ces protocoles n'ont pas de configuration CV ; le programme refuse la tentative avec un message.\n\nLa règle s'applique aux deux chemins de la même manière - à **Importer décodeur** dans la barre d'outils comme à **Charger un modèle** dans la fenêtre d'édition. Les valeurs saisies à la main ne sont pas concernées.\n\n**Wagons sans décodeur :** Beaucoup de wagons n'ont aucun décodeur inscrit dans iTrain. Là, il ne suffit **pas** d'insérer seulement la configuration - sans décodeur associé, iTrain n'affiche pas du tout les valeurs de CV. Le programme pose donc la question et crée au besoin un décodeur ; vous choisissez le protocole (dcc, fmz, ctc, sx2, sx1). Pour les locomotives, un avertissement subsiste - une locomotive sans décodeur signale plutôt une erreur dans le fichier.
help.decoderText.es=En las pestañas **Locomotoras** y **Vagones**, la subárea **configuration** del Explorador de datos describe el decoder instalado: sus valores CV junto con sus descripciones. Como estos datos son iguales para cada tipo de decoder, pueden guardarse como **plantilla** y aplicarse a otros vehículos. Para ello, la barra de herramientas en la parte superior de la ventana tiene dos botones adicionales, utilizables solo en estas dos pestañas:\n\n- **Exportar decoder** guarda el área configuration del vehículo seleccionado como plantilla en la carpeta de plantillas de decoder. Se solicita un nombre (aparecerá luego en la selección) y opcionalmente una descripción.\n- **Importar decoder** aplica una plantilla al vehículo seleccionado. Se abre una lista de todas las plantillas instaladas con campo de búsqueda; una pulsación de tecla salta a la primera plantilla que empieza por esa letra, y los encabezados de columna permiten reordenar. Con **Elegir archivo...** se puede cargar en su lugar cualquier archivo de plantilla del disco.\n\nDebe haber siempre **exactamente un** vehículo seleccionado, ya que una configuración de decoder pertenece a un único vehículo.\n\nAsí, una locomotora puede crearse primero en iTrain con valores estándar y guardarse; los datos del decoder se añaden después aquí, en el lugar correcto. Si el área configuration aún no existe, se crea durante la importación. Si ya existe, se **reemplaza por completo**: el programa pregunta antes, y **Deshacer** revierte la operación.\n\n**Instalar plantillas:** En Configuración hay dos entradas de menú adicionales. **Instalar plantillas de decoder** lee una colección descargada previamente (decoder.zip): tras una confirmación se elige el archivo y su contenido se descomprime en la carpeta de plantillas de decoder. La carpeta se solicita en el primerísimo inicio del programa y puede cambiarse en cualquier momento en Preferencias → Rutas. **Plantillas de decoder** abre una ventana propia y redimensionable con todas las plantillas instaladas y un campo de búsqueda. Allí se muestran deliberadamente solo el nombre, la descripción y el número de entradas CV: los valores en sí solo se ven tras importarlos en un vehículo. En la parte inferior de la ventana figuran la versión y la fecha de instalación de la colección. Además de la colección, con **Archivo de decoder...** también se pueden cargar plantillas sueltas: una creada por usted, un archivo .csv que le hayan enviado o varios a la vez; cada uno se comprueba antes de copiarlo para que ningún archivo de exportación normal acabe en la carpeta de plantillas.\n\nUn archivo de plantilla contiene solo el área configuration, no una entrada completa. Por eso el botón normal **Importar en la categoría** rechaza esos archivos con un aviso.\n\n**Importante: la dirección digital.** Una plantilla contiene siempre también la dirección digital (CV 1 o CV 17/18) del vehículo del que procede originalmente. Por eso, tras la importación el programa muestra un aviso: el valor en el decoder del vehículo de destino es distinto y debe corregirse tras iniciar iTrain, mediante POM (programación en la vía principal) o a mano. De lo contrario, iTrain se dirigirá al vehículo con una dirección equivocada.\n\n**Versión de la colección de plantillas:** Si el archivo decoder.zip contiene una indicación de versión, al instalar se compara con la ya presente. Si el archivo elegido no es más nuevo, el programa pregunta y ofrece **Mantener las antiguas**, de modo que un archivo antiguo elegido por error no sobrescriba en silencio las plantillas más nuevas. Un paso atrás deliberado sigue siendo posible con **Instalar de todos modos**.\n\n**Ver y modificar los valores CV:** En la ventana **Plantillas de decoder**, **Editar en una ventana propia** - o un doble clic en la fila - abre la plantilla marcada en la tabla CV grande. Allí se pueden ver y cambiar los valores; **Guardar** los reescribe en el mismo archivo y **Guardar como...** crea una plantilla adicional con un nombre nuevo. Los valores de un vehículo se editan del mismo modo a través del explorador de datos: seleccionar el nodo **configuration** y hacer clic en **Editar en una ventana propia**.\n\n**Nota sobre las plantillas:** Hay varias plantillas disponibles para descargar. Se derivaron de los manuales .pdf de los fabricantes y a menudo abarcan solo partes de la configuración completa del decoder; en el caso de ZIMO, por ejemplo, textos muy largos que apenas caben en una descripción. Aun así, mucho resulta aprovechable: el decoder puede consultarse a fondo en iTrain mediante POM o la vía de programación. Si en algunos puntos no llega información, puede que el decoder no sea del todo compatible con la plantilla. Precisamente por eso las plantillas se pueden adaptar y guardar con otro nombre.\n\n**No todos los protocolos tienen valores CV:** El protocolo digital que usa un vehículo aparece en el explorador de datos bajo **decoder**, en el campo **protocol**. De él depende lo que una importación puede aplicar:\n- **dcc**, **fmz**, **ctc** y **sx2**: la plantilla completa.\n- **sx1**: como máximo 5 valores. Si la plantilla contiene más, el programa pregunta y aplica solo los primeros 5.\n- **mot**, **multi** y **analog**: sin importación. Estos protocolos no tienen configuración de CV; el programa rechaza el intento con un mensaje.\n\nLa regla vale igual para ambos caminos: para **Importar decoder** en la barra de herramientas y para **Cargar plantilla** en la ventana de edición. Los valores introducidos a mano no se ven afectados.\n\n**Vagones sin decoder:** Muchos vagones no tienen ningún decoder anotado en iTrain. Ahí **no** basta con insertar solo la configuración: sin decoder asociado, iTrain no muestra los valores de CV en absoluto. Por eso el programa pregunta y, si quieres, crea también un decoder; el protocolo lo eliges tú (dcc, fmz, ctc, sx2, sx1). En las locomotoras se queda en una advertencia: una locomotora sin decoder apunta más bien a un error del archivo.
help.decoderText.it=Nelle schede **Locomotive** e **Vagoni**, la sottosezione **configuration** nell'Esplora dati descrive il decoder installato: i suoi valori CV con le relative descrizioni. Poiché questi dati sono uguali per ogni tipo di decoder, possono essere salvati come **modello** e applicati ad altri veicoli. A tale scopo, la barra degli strumenti in alto nella finestra contiene due ulteriori pulsanti, utilizzabili solo in queste due schede:\n\n- **Esporta decoder** salva la sezione configuration del veicolo selezionato come modello nella cartella dei modelli di decoder. Vengono richiesti un nome (apparirà poi nella selezione) e facoltativamente una descrizione.\n- **Importa decoder** applica un modello al veicolo selezionato. Si apre un elenco di tutti i modelli installati con un campo di ricerca; premendo un tasto si salta al primo modello che inizia con quella lettera, e le intestazioni delle colonne consentono di riordinare. Con **Scegli file...** è invece possibile caricare un qualsiasi file di modello dal disco.\n\nDeve essere sempre selezionato **esattamente un** veicolo, poiché una configurazione di decoder appartiene a un solo veicolo.\n\nIn questo modo una locomotiva può essere creata prima in iTrain con valori predefiniti e salvata; i dati del decoder vengono aggiunti successivamente qui, nel punto giusto. Se la sezione configuration manca del tutto, viene creata durante l'importazione. Se esiste già, viene **completamente sostituita**: il programma chiede prima conferma e **Annulla** ripristina l'operazione.\n\n**Installare i modelli:** In Impostazioni sono presenti due ulteriori voci di menu. **Installa modelli di decoder** legge una raccolta scaricata in precedenza (decoder.zip): dopo una conferma si sceglie il file e il suo contenuto viene estratto nella cartella dei modelli di decoder. La cartella viene richiesta al primissimo avvio del programma e può essere modificata in qualsiasi momento in Preferenze → Percorsi. **Modelli di decoder** apre una finestra separata e ridimensionabile con tutti i modelli installati e un campo di ricerca. Lì sono volutamente visibili solo nome, descrizione e numero di voci CV: i valori stessi si vedono solo dopo l'importazione in un veicolo. In fondo alla finestra sono indicati versione e data di installazione della raccolta. Oltre alla raccolta, con **File di decoder...** si possono caricare anche singoli modelli: uno creato da te, un file .csv che ti è stato inviato o più insieme; ognuno viene controllato prima della copia, così nessun normale file di esportazione finisce nella cartella dei modelli.\n\nUn file di modello contiene solo la sezione configuration, non una voce completa. Il pulsante normale **Importa nella categoria** rifiuta quindi tali file con un avviso.\n\n**Importante - l'indirizzo digitale:** Un modello contiene sempre anche l'indirizzo digitale (CV 1 o CV 17/18) del veicolo da cui proviene originariamente. Dopo l'importazione il programma mostra quindi un avviso: il valore nel decoder del veicolo di destinazione è diverso e va corretto dopo l'avvio di iTrain, tramite POM (programmazione sul binario principale) o manualmente. Altrimenti iTrain si rivolgerà al veicolo con un indirizzo errato.\n\n**Versione della raccolta di modelli:** Se decoder.zip contiene un'indicazione di versione, all'installazione viene confrontata con quella già presente. Se l'archivio scelto non è più recente, il programma chiede conferma e offre **Mantieni i vecchi**: così un file più vecchio scelto per errore non sovrascrive in silenzio i modelli più recenti. Un passo indietro consapevole resta possibile con **Installa comunque**.\n\n**Vedere e modificare i valori CV:** Nella finestra **Modelli di decoder**, **Modifica in una finestra separata** - o un doppio clic sulla riga - apre il modello selezionato nella grande tabella CV. Lì i valori si possono vedere e modificare; **Salva** li riscrive nello stesso file, **Salva con nome...** crea un modello aggiuntivo con un nuovo nome. I valori di un veicolo si modificano allo stesso modo tramite l'esploratore dati: selezionare il nodo **configuration** e fare clic su **Modifica in una finestra separata**.\n\n**Nota sui modelli:** Sono disponibili al download diversi modelli. Sono stati ricavati dai manuali .pdf dei produttori e spesso coprono solo parti dell'intera configurazione del decoder - con ZIMO, per esempio, testi molto lunghi che a stento entrano in una descrizione. Molto resta comunque utilizzabile: il decoder può essere interrogato a fondo in iTrain tramite POM o il binario di programmazione. Se in alcuni punti non torna alcuna informazione, il decoder potrebbe non essere del tutto compatibile con il modello. Proprio per questo i modelli si possono adattare e salvare con un altro nome.\n\n**Non tutti i protocolli conoscono i valori CV:** Il protocollo digitale usato da un veicolo è indicato nell'esplora dati sotto **decoder**, nel campo **protocol**. Da esso dipende ciò che un'importazione può applicare:\n- **dcc**, **fmz**, **ctc** e **sx2**: il modello completo.\n- **sx1**: al massimo 5 valori. Se il modello ne contiene di più, il programma chiede conferma e applica solo i primi 5.\n- **mot**, **multi** e **analog**: nessuna importazione. Questi protocolli non hanno una configurazione CV; il programma rifiuta il tentativo con un messaggio.\n\nLa regola vale allo stesso modo per entrambe le strade - per **Importa decoder** nella barra degli strumenti come per **Carica modello** nella finestra di modifica. I valori inseriti a mano non ne sono toccati.\n\n**Carri senza decoder:** Molti carri non hanno alcun decoder registrato in iTrain. Lì **non** basta inserire solo la configurazione: senza decoder corrispondente, iTrain non mostra affatto i valori delle CV. Il programma chiede quindi e, se vuoi, crea anche il decoder; il protocollo lo scegli tu (dcc, fmz, ctc, sx2, sx1). Per le locomotive resta un avviso: una locomotiva senza decoder indica piuttosto un errore nel file.
help.decoderText.pt=Nos separadores **Locomotivas** e **Vagões**, a subárea **configuration** no Explorador de Dados descreve o descodificador instalado: os seus valores CV juntamente com as descrições. Como estes dados são iguais para cada tipo de descodificador, podem ser guardados como **modelo** e aplicados a outros veículos. Para isso, a barra de ferramentas no topo da janela tem dois botões adicionais, utilizáveis apenas nestes dois separadores:\n\n- **Exportar descodificador** guarda a área configuration do veículo selecionado como modelo na pasta de modelos de descodificador. São pedidos um nome (aparecerá depois na seleção) e, opcionalmente, uma descrição.\n- **Importar descodificador** aplica um modelo ao veículo selecionado. Abre-se uma lista de todos os modelos instalados com campo de pesquisa; premir uma tecla salta para o primeiro modelo começado por essa letra, e os cabeçalhos das colunas permitem reordenar. Com **Escolher ficheiro...** pode em vez disso carregar-se qualquer ficheiro de modelo a partir do disco.\n\nTem de estar sempre selecionado **exatamente um** veículo, pois uma configuração de descodificador pertence a um único veículo.\n\nAssim, uma locomotiva pode primeiro ser criada no iTrain com valores predefinidos e guardada; os dados do descodificador são acrescentados depois aqui, no sítio certo. Se a área configuration ainda não existir, é criada durante a importação. Se já existir, é **completamente substituída** - o programa pergunta antes, e **Desfazer** reverte a operação.\n\n**Instalar modelos:** Em Definições existem mais duas entradas de menu. **Instalar modelos de descodificador** lê uma coleção transferida previamente (decoder.zip): após uma confirmação, escolhe-se o ficheiro e o seu conteúdo é extraído para a pasta de modelos de descodificador. A pasta é pedida no primeiríssimo arranque do programa e pode ser alterada a qualquer momento em Preferências → Caminhos. **Modelos de descodificador** abre uma janela própria e redimensionável com todos os modelos instalados e um campo de pesquisa. Aí são mostrados deliberadamente apenas o nome, a descrição e o número de entradas CV - os valores em si só se veem após a importação num veículo. No fundo da janela figuram a versão e a data de instalação da coleção. Além da coleção, através de **Ficheiro de descodificador...** também se podem carregar modelos avulsos - um criado por si, um ficheiro .csv que lhe tenham enviado ou vários de uma vez; cada um é verificado antes de ser copiado, para que nenhum ficheiro de exportação normal vá parar à pasta de modelos.\n\nUm ficheiro de modelo contém apenas a área configuration, não uma entrada completa. Por isso o botão normal **Importar para a categoria** rejeita esses ficheiros com um aviso.\n\n**Importante - o endereço digital:** Um modelo contém sempre também o endereço digital (CV 1 ou CV 17/18) do veículo de onde provém originalmente. Por isso, após a importação o programa mostra um aviso: o valor no descodificador do veículo de destino é outro e tem de ser corrigido após iniciar o iTrain, através de POM (programação na via principal) ou manualmente. Caso contrário, o iTrain dirigir-se-á ao veículo com um endereço errado.\n\n**Versão da coleção de modelos:** Se o decoder.zip contiver uma indicação de versão, esta é comparada na instalação com a já existente. Se o arquivo escolhido não for mais recente, o programa pergunta e oferece **Manter os antigos** - assim, um ficheiro mais antigo escolhido por engano não substitui em silêncio os modelos mais recentes. Um passo atrás deliberado continua possível através de **Instalar mesmo assim**.\n\n**Ver e alterar os valores CV:** Na janela **Modelos de descodificador**, **Editar numa janela própria** - ou um duplo clique na linha - abre o modelo marcado na tabela CV grande. Aí é possível ver e alterar os valores; **Guardar** volta a escrevê-los no mesmo ficheiro e **Guardar como...** cria um modelo adicional com um novo nome. Os valores de um veículo editam-se do mesmo modo através do explorador de dados: selecionar o nó **configuration** e clicar em **Editar numa janela própria**.\n\n**Nota sobre os modelos:** Estão disponíveis vários modelos para descarregar. Foram derivados dos manuais .pdf dos fabricantes e cobrem muitas vezes apenas partes da configuração completa do descodificador - no caso da ZIMO, por exemplo, textos muito longos que dificilmente cabem numa descrição. Ainda assim, muito é aproveitável: o descodificador pode ser consultado em detalhe no iTrain através de POM ou da via de programação. Se nalguns pontos não vier informação, o descodificador poderá não ser totalmente compatível com o modelo. É precisamente por isso que os modelos são adaptáveis e podem ser guardados com outro nome.\n\n**Nem todos os protocolos têm valores CV:** O protocolo digital que um veículo usa aparece no explorador de dados em **decoder**, no campo **protocol**. Dele depende o que uma importação pode aplicar:\n- **dcc**, **fmz**, **ctc** e **sx2**: o modelo completo.\n- **sx1**: no máximo 5 valores. Se o modelo contiver mais, o programa pergunta e aplica apenas os primeiros 5.\n- **mot**, **multi** e **analog**: sem importação. Estes protocolos não têm configuração de CV; o programa recusa a tentativa com uma mensagem.\n\nA regra vale igualmente para ambos os caminhos - para **Importar descodificador** na barra de ferramentas e para **Carregar modelo** na janela de edição. Os valores introduzidos à mão não são afetados.\n\n**Vagões sem descodificador:** Muitos vagões não têm qualquer descodificador registado no iTrain. Aí **não** basta inserir apenas a configuração: sem descodificador associado, o iTrain não mostra de todo os valores de CV. Por isso o programa pergunta e, se quiseres, cria também um descodificador; o protocolo escolhe-lo tu (dcc, fmz, ctc, sx2, sx1). Nas locomotivas fica-se por um aviso: uma locomotiva sem descodificador aponta antes para um erro no ficheiro.
help.decoderText.pl=W kartach **Lokomotywy** i **Wagony** podobszar **configuration** w Eksploratorze Danych opisuje wbudowany dekoder: jego wartości CV wraz z opisami. Ponieważ dane te są takie same dla danego typu dekodera, można je zapisać jako **szablon** i przenieść do innych pojazdów. Służą do tego dwa dodatkowe przyciski na pasku narzędzi u góry okna, dostępne tylko przy tych dwóch kartach:\n\n- **Eksportuj dekoder** zapisuje obszar configuration zaznaczonego pojazdu jako szablon w folderze szablonów dekoderów. Wymagane są nazwa (pojawi się później przy wyborze) oraz opcjonalnie opis.\n- **Importuj dekoder** przenosi szablon do zaznaczonego pojazdu. Otwiera się lista wszystkich zainstalowanych szablonów z polem wyszukiwania; naciśnięcie klawisza przeskakuje do pierwszego szablonu zaczynającego się tą literą, a nagłówki kolumn pozwalają zmienić sortowanie. Za pomocą **Wybierz plik...** można zamiast tego wczytać dowolny plik szablonu z dysku.\n\nZawsze musi być zaznaczony **dokładnie jeden** pojazd, ponieważ konfiguracja dekodera należy do dokładnie jednego pojazdu.\n\nDzięki temu lokomotywę można najpierw utworzyć w iTrain z wartościami domyślnymi i zapisać; dane dekodera dodaje się następnie tutaj, we właściwym miejscu. Jeśli obszaru configuration jeszcze w ogóle nie ma, zostaje utworzony podczas importu. Jeśli już istnieje, zostaje **całkowicie zastąpiony** - program pyta wcześniej, a **Cofnij** przywraca poprzedni stan.\n\n**Instalowanie szablonów:** W Ustawieniach znajdują się dwie kolejne pozycje menu. **Zainstaluj szablony dekoderów** wczytuje wcześniej pobrany zbiór (decoder.zip): po potwierdzeniu wybiera się plik, a jego zawartość zostaje rozpakowana do folderu szablonów dekoderów. Folder jest pytany przy pierwszym uruchomieniu programu i można go zmienić w każdej chwili w Preferencje → Ścieżki. **Szablony dekoderów** otwiera osobne okno o zmiennej wielkości ze wszystkimi zainstalowanymi szablonami i polem wyszukiwania. Celowo widoczne są tam tylko nazwa, opis i liczba wpisów CV - same wartości pokazuje dopiero import do pojazdu. Na dole okna podane są wersja i data instalacji wczytanego zbioru. Poza zbiorem można przyciskiem **Plik dekodera...** wczytać także pojedyncze szablony - własny, przysłany plik .csv albo kilka naraz; każdy jest sprawdzany przed skopiowaniem, aby do folderu szablonów nie trafił zwykły plik eksportu.\n\nPlik szablonu zawiera tylko obszar configuration, a nie pełny wpis. Zwykły przycisk **Importuj do kategorii** odrzuca zatem takie pliki ze stosownym komunikatem.\n\n**Ważne - adres cyfrowy:** Szablon zawiera zawsze również adres cyfrowy (CV 1 lub CV 17/18) pojazdu, z którego pierwotnie pochodzi. Dlatego po imporcie program wyświetla komunikat: wartość w dekoderze pojazdu docelowego jest inna i po uruchomieniu iTrain musi zostać poprawiona za pomocą POM (programowanie na torze głównym) lub ręcznie. W przeciwnym razie iTrain będzie adresował pojazd pod błędnym adresem.\n\n**Wersja zbioru szablonów:** Jeśli plik decoder.zip zawiera informację o wersji, przy instalacji jest ona porównywana z już zainstalowaną. Gdy wybrane archiwum nie jest nowsze, program pyta i proponuje **Zachowaj stare** - dzięki temu przypadkowo wybrany starszy plik nie nadpisze po cichu nowszych szablonów. Świadomy krok wstecz pozostaje możliwy przez **Zainstaluj mimo to**.\n\n**Przeglądanie i zmiana wartości CV:** W oknie **Szablony dekoderów** przycisk **Edytuj w osobnym oknie** - albo podwójne kliknięcie wiersza - otwiera zaznaczony szablon w dużej tabeli CV. Można tam obejrzeć i zmienić wartości; **Zapisz** zapisuje je z powrotem do tego samego pliku, a **Zapisz jako...** tworzy dodatkowy szablon pod nową nazwą. Wartości pojazdu edytuje się tak samo przez eksplorator danych: zaznaczyć węzeł **configuration** i kliknąć **Edytuj w osobnym oknie**.\n\n**Uwaga do szablonów:** Do pobrania dostępne są różne szablony. Powstały na podstawie instrukcji .pdf producentów i często obejmują tylko część pełnej konfiguracji dekodera - w przypadku ZIMO na przykład bardzo długie teksty, które ledwo mieszczą się w opisie. Mimo to wiele jest użyteczne: dekoder można w iTrain dokładnie odpytać przez POM lub tor programujący. Jeśli w niektórych miejscach nie wraca żadna informacja, dekoder może nie być w pełni zgodny z szablonem. Właśnie dlatego szablony można dostosowywać i zapisywać pod inną nazwą.\n\n**Nie każdy protokół obsługuje wartości CV:** Protokół cyfrowy używany przez pojazd widnieje w eksploratorze danych pod **decoder** w polu **protocol**. Od niego zależy, co może przejąć import:\n- **dcc**, **fmz**, **ctc** i **sx2**: pełny szablon.\n- **sx1**: najwyżej 5 wartości. Jeśli szablon zawiera więcej, program pyta i przejmuje tylko pierwsze 5.\n- **mot**, **multi** i **analog**: brak importu. Te protokoły nie mają konfiguracji CV; program odrzuca próbę komunikatem.\n\nReguła obowiązuje jednakowo dla obu dróg - dla **Importuj dekoder** na pasku narzędzi oraz dla **Wczytaj szablon** w oknie edycji. Wartości wpisane ręcznie pozostają nienaruszone.\n\n**Wagony bez dekodera:** Wiele wagonów nie ma w iTrain wpisanego żadnego dekodera. Tam **nie** wystarczy wstawić samą konfigurację - bez przypisanego dekodera iTrain w ogóle nie pokazuje wartości CV. Dlatego program pyta i na życzenie zakłada od razu dekoder; protokół wybierasz sam (dcc, fmz, ctc, sx2, sx1). Przy lokomotywach pozostaje ostrzeżenie - lokomotywa bez dekodera wskazuje raczej na błąd w pliku.
help.decoderText.da=I fanerne **Lokomotiver** og **Vogne** beskriver underområdet **configuration** i Dataudforskeren den indbyggede dekoder: dens CV-værdier sammen med beskrivelserne. Da disse oplysninger er ens for en given dekodertype, kan de gemmes som **skabelon** og overføres til andre køretøjer. Dertil findes to ekstra knapper i værktøjslinjen øverst i vinduet, som kun kan bruges ved disse to faner:\n\n- **Eksportér dekoder** gemmer det markerede køretøjs configuration-område som skabelon i mappen til dekoderskabeloner. Der spørges om et navn (det vises senere i valglisten) og eventuelt en beskrivelse.\n- **Importér dekoder** overfører en skabelon til det markerede køretøj. Der åbnes en liste over alle installerede skabeloner med søgefelt; et tastetryk springer til den første skabelon med det begyndelsesbogstav, og kolonneoverskrifterne gør det muligt at sortere om. Med **Vælg fil...** kan man i stedet indlæse en vilkårlig skabelonfil fra disken.\n\nDer skal altid være markeret **præcis ét** køretøj, da en dekoderkonfiguration hører til præcis ét køretøj.\n\nSådan kan et lokomotiv først oprettes i iTrain med standardværdier og gemmes; dekoderdataene kommer bagefter til her, på det rigtige sted. Mangler configuration-området helt, oprettes det ved importen. Findes det allerede, bliver det **fuldstændigt erstattet** - programmet spørger først, og **Fortryd** ruller handlingen tilbage igen.\n\n**Installation af skabeloner:** Under Indstillinger findes to yderligere menupunkter. **Installer dekoderskabeloner** indlæser en tidligere downloadet samling (decoder.zip): efter en bekræftelse vælges filen, og dens indhold pakkes ud i mappen til dekoderskabeloner. Mappen efterspørges ved allerførste programstart og kan til enhver tid ændres under Præferencer → Stier. **Dekoderskabeloner** åbner et separat vindue i variabel størrelse med alle installerede skabeloner og et søgefelt. Der vises bevidst kun navn, beskrivelse og antallet af CV-poster - selve værdierne ses først efter import i et køretøj. Nederst i vinduet står version og installationsdato for den indlæste samling. Ud over samlingen kan man via **Dekoderfil...** også indlæse enkelte skabeloner - en, du selv har lavet, en tilsendt .csv-fil eller flere på én gang; hver enkelt kontrolleres før kopieringen, så ingen almindelig eksportfil havner i skabelonmappen.\n\nEn skabelonfil indeholder kun configuration-området, ikke en fuldstændig post. Den almindelige knap **Importér i kategori** afviser derfor sådanne filer med en besked.\n\n**Vigtigt - den digitale adresse:** En skabelon indeholder altid også den digitale adresse (CV 1 eller CV 17/18) for det køretøj, den oprindeligt stammer fra. Efter importen viser programmet derfor en besked: værdien i målkøretøjets dekoder er en anden og skal rettes efter start af iTrain, via POM (programmering på hovedsporet) eller manuelt. Ellers vil iTrain tiltale køretøjet under en forkert adresse.\n\n**Udgave af skabelonsamlingen:** Indeholder decoder.zip en versionsangivelse, sammenlignes den ved installationen med den allerede installerede. Er det valgte arkiv ikke nyere, spørger programmet og tilbyder **Behold de gamle** - sådan overskriver en ved et uheld valgt ældre fil ikke stiltiende de nyere skabeloner. Et bevidst skridt tilbage er fortsat muligt via **Installer alligevel**.\n\n**Se og ændre CV-værdier:** I vinduet **Dekoderskabeloner** åbner **Rediger i et separat vindue** - eller et dobbeltklik på rækken - den markerede skabelon i den store CV-tabel. Dér kan værdierne ses og ændres; **Gem** skriver dem tilbage til den samme fil, **Gem som...** opretter en ekstra skabelon under et nyt navn. Et køretøjs værdier redigeres på samme måde via datastifinderen: vælg knuden **configuration**, og klik på **Rediger i et separat vindue**.\n\n**Bemærkning om skabelonerne:** Der er forskellige skabeloner til download. De er udledt af producenternes .pdf-vejledninger og dækker ofte kun dele af hele dekoderkonfigurationen - hos ZIMO for eksempel meget lange tekster, der næppe passer ind i en beskrivelse. Alligevel er meget brugbart: dekoderen kan aflæses grundigt i iTrain via POM eller programmeringssporet. Kommer der nogle steder ingen information tilbage, er dekoderen måske ikke helt kompatibel med skabelonen. Netop derfor kan skabelonerne tilpasses og gemmes under et andet navn.\n\n**Ikke alle protokoller kender CV-værdier:** Hvilken digital protokol et køretøj bruger, står i datastifinderen under **decoder** i feltet **protocol**. Deraf afhænger, hvad en import må overtage:\n- **dcc**, **fmz**, **ctc** og **sx2**: hele skabelonen.\n- **sx1**: højst 5 værdier. Indeholder skabelonen flere, spørger programmet og overtager kun de første 5.\n- **mot**, **multi** og **analog**: ingen import. Disse protokoller har ingen CV-konfiguration; programmet afviser forsøget med en meddelelse.\n\nReglen gælder ens for begge veje - for **Importér dekoder** på værktøjslinjen såvel som for **Indlæs skabelon** i redigeringsvinduet. Værdier indtastet i hånden berøres ikke.\n\n**Vogne uden dekoder:** Mange vogne har slet ingen dekoder anført i iTrain. Der er det **ikke** nok kun at indsætte konfigurationen - uden tilhørende dekoder viser iTrain overhovedet ikke CV-værdierne. Programmet spørger derfor og opretter om ønsket en dekoder med det samme; protokollen vælger du selv (dcc, fmz, ctc, sx2, sx1). Ved lokomotiver bliver det ved en advarsel - et lokomotiv uden dekoder tyder snarere på en fejl i filen.
help.decoderText.sv=I flikarna **Lok** och **Vagnar** beskriver underområdet **configuration** i Datautforskaren den inbyggda dekodern: dess CV-värden tillsammans med beskrivningarna. Eftersom dessa uppgifter är lika för en viss dekodertyp kan de sparas som **mall** och överföras till andra fordon. För detta finns två extra knappar i verktygsfältet högst upp i fönstret, som bara går att använda på dessa två flikar:\n\n- **Exportera dekoder** sparar det markerade fordonets configuration-område som mall i mappen för dekodermallar. Ett namn efterfrågas (det visas senare i urvalet) samt eventuellt en beskrivning.\n- **Importera dekoder** överför en mall till det markerade fordonet. En lista över alla installerade mallar öppnas med sökfält; en tangenttryckning hoppar till den första mallen som börjar med den bokstaven, och kolumnrubrikerna gör det möjligt att sortera om. Med **Välj fil...** kan man i stället läsa in en godtycklig mallfil från hårddisken.\n\nExakt **ett** fordon måste alltid vara markerat, eftersom en dekoderkonfiguration hör till exakt ett fordon.\n\nPå så sätt kan ett lok först skapas i iTrain med standardvärden och sparas; dekoderdata läggs sedan till här, på rätt plats. Saknas configuration-området helt skapas det vid importen. Finns det redan ersätts det **helt och hållet** - programmet frågar först, och **Ångra** återställer åtgärden.\n\n**Installera mallar:** Under Inställningar finns ytterligare två menyalternativ. **Installera dekodermallar** läser in en tidigare nedladdad samling (decoder.zip): efter en bekräftelse väljs filen och dess innehåll packas upp i mappen för dekodermallar. Mappen efterfrågas vid allra första programstarten och kan när som helst ändras under Inställningar → Sökvägar. **Dekodermallar** öppnar ett eget, storleksändringsbart fönster med alla installerade mallar och ett sökfält. Där visas medvetet bara namn, beskrivning och antalet CV-poster - själva värdena syns först efter import i ett fordon. Längst ner i fönstret står version och installationsdatum för den inlästa samlingen. Utöver samlingen kan man via **Dekoderfil...** även läsa in enstaka mallar - en du gjort själv, en tillskickad .csv-fil eller flera på en gång; var och en kontrolleras före kopieringen så att ingen vanlig exportfil hamnar i mallmappen.\n\nEn mallfil innehåller bara configuration-området, inte en fullständig post. Den vanliga knappen **Importera till kategori** avvisar därför sådana filer med ett meddelande.\n\n**Viktigt - den digitala adressen:** En mall innehåller alltid även den digitala adressen (CV 1 eller CV 17/18) för det fordon den ursprungligen kommer från. Efter importen visar programmet därför ett meddelande: värdet i målfordonets dekoder är ett annat och måste rättas efter start av iTrain, via POM (programmering på huvudspåret) eller för hand. Annars tilltalar iTrain fordonet under fel adress.\n\n**Version av mallsamlingen:** Innehåller decoder.zip en versionsuppgift jämförs den vid installationen med den redan installerade. Är det valda arkivet inte nyare frågar programmet och erbjuder **Behåll de gamla** - så skriver en av misstag vald äldre fil inte tyst över de nyare mallarna. Ett medvetet steg tillbaka är fortfarande möjligt via **Installera ändå**.\n\n**Visa och ändra CV-värden:** I fönstret **Dekodermallar** öppnar **Redigera i eget fönster** - eller ett dubbelklick på raden - den markerade mallen i den stora CV-tabellen. Där kan värdena visas och ändras; **Spara** skriver tillbaka dem till samma fil, **Spara som...** skapar en extra mall under ett nytt namn. Ett fordons värden redigeras på samma sätt via datautforskaren: markera noden **configuration** och klicka på **Redigera i eget fönster**.\n\n**Anmärkning om mallarna:** Olika mallar finns att hämta. De har härletts ur tillverkarnas .pdf-manualer och täcker ofta bara delar av hela dekoderkonfigurationen - hos ZIMO till exempel mycket långa texter som knappt får plats i en beskrivning. Ändå är mycket användbart: dekodern kan läsas av utförligt i iTrain via POM eller programmeringsspåret. Kommer ingen information tillbaka på vissa punkter är dekodern kanske inte helt kompatibel med mallen. Just därför går mallarna att anpassa och spara under ett annat namn.\n\n**Alla protokoll har inte CV-värden:** Vilket digitalt protokoll ett fordon använder framgår i datautforskaren under **decoder** i fältet **protocol**. Av det beror vad en import får överta:\n- **dcc**, **fmz**, **ctc** och **sx2**: hela mallen.\n- **sx1**: högst 5 värden. Innehåller mallen fler frågar programmet och tar bara över de första 5.\n- **mot**, **multi** och **analog**: ingen import. Dessa protokoll har ingen CV-konfiguration; programmet avvisar försöket med ett meddelande.\n\nRegeln gäller lika för båda vägarna - för **Importera avkodare** i verktygsfältet såväl som för **Läs in mall** i redigeringsfönstret. Värden som matats in för hand berörs inte.\n\n**Vagnar utan dekoder:** Många vagnar har ingen dekoder alls angiven i iTrain. Där räcker det **inte** att bara infoga konfigurationen - utan tillhörande dekoder visar iTrain inte CV-värdena alls. Programmet frågar därför och lägger på begäran upp en dekoder direkt; protokollet väljer du själv (dcc, fmz, ctc, sx2, sx1). Vid lok stannar det vid en varning - ett lok utan dekoder tyder snarare på ett fel i filen.

editor.decoderNoDecoderElement.de="{0}" hat in iTrain gar keinen Decoder zugewiesen (kein <decoder>-Element).\n\nEine CV-Konfiguration ohne zugewiesenen Decoder ist eigentlich widersprüchlich - der Decoder sollte zuerst in iTrain eingetragen werden.\n\nTrotzdem fortfahren?
editor.decoderNoDecoderElement.en="{0}" has no decoder assigned in iTrain (no <decoder> element).\n\nA CV configuration without an assigned decoder is contradictory - the decoder should be entered in iTrain first.\n\nContinue anyway?
editor.decoderNoDecoderElement.nl="{0}" heeft in iTrain helemaal geen decoder toegewezen (geen <decoder>-element).\n\nEen CV-configuratie zonder toegewezen decoder is eigenlijk tegenstrijdig - de decoder zou eerst in iTrain moeten worden ingevoerd.\n\nToch doorgaan?
editor.decoderNoDecoderElement.fr=« {0} » n'a aucun décodeur attribué dans iTrain (pas d'élément <decoder>).\n\nUne configuration CV sans décodeur attribué est en fait contradictoire - le décodeur devrait d'abord être renseigné dans iTrain.\n\nContinuer quand même ?
editor.decoderNoDecoderElement.es=«{0}» no tiene ningún decoder asignado en iTrain (falta el elemento <decoder>).\n\nUna configuración CV sin decoder asignado es en realidad contradictoria: el decoder debería introducirse primero en iTrain.\n\n¿Continuar de todos modos?
editor.decoderNoDecoderElement.it=«{0}» non ha alcun decoder assegnato in iTrain (nessun elemento <decoder>).\n\nUna configurazione CV senza decoder assegnato è in realtà contraddittoria: il decoder andrebbe prima inserito in iTrain.\n\nContinuare comunque?
editor.decoderNoDecoderElement.pt="{0}" não tem qualquer descodificador atribuído no iTrain (sem elemento <decoder>).\n\nUma configuração CV sem descodificador atribuído é contraditória - o descodificador deveria ser introduzido primeiro no iTrain.\n\nContinuar mesmo assim?
editor.decoderNoDecoderElement.pl=„{0}” nie ma w iTrain przypisanego żadnego dekodera (brak elementu <decoder>).\n\nKonfiguracja CV bez przypisanego dekodera jest w istocie sprzeczna - dekoder należałoby najpierw wprowadzić w iTrain.\n\nMimo to kontynuować?
editor.decoderNoDecoderElement.da="{0}" har slet ingen dekoder tildelt i iTrain (intet <decoder>-element).\n\nEn CV-konfiguration uden tildelt dekoder er egentlig modstridende - dekoderen bør først indtastes i iTrain.\n\nFortsæt alligevel?
editor.decoderNoDecoderElement.sv="{0}" har ingen dekoder tilldelad i iTrain (inget <decoder>-element).\n\nEn CV-konfiguration utan tilldelad dekoder är egentligen motsägelsefull - dekodern bör först anges i iTrain.\n\nFortsätta ändå?

editor.decoderAddressWarning.de=Achtung! Die Digital-Adresse stammt aus einer Vorlage und entspricht nicht dem tatsächlichen Wert!\nNach dem Start von iTrain muss der Wert über POM oder manuell geändert werden.
editor.decoderAddressWarning.en=Attention! The digital address comes from a template and does not match the actual value!\nAfter starting iTrain, the value must be changed via POM or manually.
editor.decoderAddressWarning.nl=Let op! Het digitale adres komt uit een sjabloon en komt niet overeen met de werkelijke waarde!\nNa het starten van iTrain moet de waarde via POM of handmatig worden gewijzigd.
editor.decoderAddressWarning.fr=Attention ! L'adresse numérique provient d'un modèle et ne correspond pas à la valeur réelle !\nAprès le démarrage d'iTrain, la valeur doit être modifiée via POM ou manuellement.
editor.decoderAddressWarning.es=¡Atención! La dirección digital procede de una plantilla y no corresponde al valor real.\nTras iniciar iTrain, el valor debe cambiarse mediante POM o manualmente.
editor.decoderAddressWarning.it=Attenzione! L'indirizzo digitale proviene da un modello e non corrisponde al valore reale!\nDopo l'avvio di iTrain, il valore deve essere modificato tramite POM o manualmente.
editor.decoderAddressWarning.pt=Atenção! O endereço digital vem de um modelo e não corresponde ao valor real!\nApós iniciar o iTrain, o valor tem de ser alterado através de POM ou manualmente.
editor.decoderAddressWarning.pl=Uwaga! Adres cyfrowy pochodzi z szablonu i nie odpowiada rzeczywistej wartości!\nPo uruchomieniu iTrain wartość należy zmienić za pomocą POM lub ręcznie.
editor.decoderAddressWarning.da=Bemærk! Den digitale adresse stammer fra en skabelon og svarer ikke til den faktiske værdi!\nEfter start af iTrain skal værdien ændres via POM eller manuelt.
editor.decoderAddressWarning.sv=Observera! Den digitala adressen kommer från en mall och motsvarar inte det faktiska värdet!\nEfter start av iTrain måste värdet ändras via POM eller manuellt.

