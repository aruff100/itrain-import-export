capture.importQuestion.nl=Het sjabloon "{0}" bevat {1} CV-items, waarvan er {2} al in deze tabel staan.\n\nWaarden behouden: uw waarden blijven, type en naam komen uit het sjabloon.\n\nWaarden overschrijven: ook de waarden komen daarna uit het sjabloon.
capture.importQuestion.fr=Le modèle « {0} » contient {1} entrées CV, dont {2} figurent déjà dans ce tableau.\n\nConserver les valeurs : vos valeurs restent, le type et le nom viennent du modèle.\n\nRemplacer les valeurs : les valeurs proviendront elles aussi du modèle.
capture.importQuestion.es=La plantilla «{0}» contiene {1} entradas CV, de las cuales {2} ya están en esta tabla.\n\nConservar valores: sus valores permanecen; el tipo y el nombre vienen de la plantilla.\n\nSustituir valores: también los valores procederán de la plantilla.
capture.importQuestion.it=Il modello «{0}» contiene {1} voci CV, di cui {2} già presenti in questa tabella.\n\nMantieni i valori: i tuoi valori restano, tipo e nome vengono dal modello.\n\nSostituisci i valori: anche i valori proverranno dal modello.
capture.importQuestion.pt=O modelo "{0}" contém {1} entradas CV, das quais {2} já estão nesta tabela.\n\nManter valores: os seus valores permanecem; o tipo e o nome vêm do modelo.\n\nSubstituir valores: também os valores passarão a vir do modelo.
capture.importQuestion.pl=Szablon „{0}” zawiera {1} wpisów CV, z czego {2} są już w tej tabeli.\n\nZachowaj wartości: Twoje wartości pozostają, typ i nazwa pochodzą z szablonu.\n\nNadpisz wartości: również wartości będą pochodzić z szablonu.
capture.importQuestion.da=Skabelonen "{0}" indeholder {1} CV-poster, hvoraf {2} allerede står i denne tabel.\n\nBehold værdier: dine værdier bevares, type og navn kommer fra skabelonen.\n\nOverskriv værdier: også værdierne kommer derefter fra skabelonen.
capture.importQuestion.sv=Mallen "{0}" innehåller {1} CV-poster, varav {2} redan finns i den här tabellen.\n\nBehåll värden: dina värden är kvar, typ och namn kommer från mallen.\n\nErsätt värden: även värdena kommer då från mallen.

