help.referenceRenameTitle.sv=Länkade poster: märkning med "~"

help.referenceRenameText.de=Damit referenzierte Einträge nicht mit gleichnamigen, bereits in der Zieldatei vorhandenen Einträgen kollidieren, werden sie beim Export **umbenannt**: Sowohl ihr eigener Name als auch jede Stelle, an der sie referenziert werden, bekommen ein vorangestelltes **"~"** (z.B. wird aus "RM1" überall "~RM1").\nDie Zieldatei bleibt dadurch nach dem Import in iTrain vollständig funktionsfähig, vorhandene Daten werden nicht verändert. Referenz und Definition passen weiterhin zusammen, die Datei lässt sich also öffnen und ausführen.\n\nDie **"~"**-Namen sind aber nur ein **Provisorium**: der Anwender muss sie anschließend in iTrain selbst und manuell in aussagekräftige Namen zurückändern - iTrain aktualisiert dabei automatisch alle Stellen, an denen der Eintrag verwendet wird.\n\nImportiert der Anwender innerhalb derselben Sitzung (**solange dieselbe Datei geöffnet bleibt**) mehrere solcher Export-Dateien nacheinander, würde der erste "~RM1" sonst mit einem zweiten, eigentlich anderen "~RM1" kollidieren. Deshalb bekommt jeder weitere Import in derselben Sitzung zusätzlich eine laufende Nummer direkt nach dem "~": der erste Import bleibt bei "~", der zweite wird zu "~1", der dritte zu "~2" und so weiter. Diese Nummer wird beim Öffnen einer neuen Datei wieder zurückgesetzt.\nAuch das muss der Anwender manuell bereinigen. Bei der Bereinigung kann/sollte der Anwender dann seine eigenen Einträge einsetzen.\n\n**Beispiel:**\nEs wird eine Aktion importiert, die als Auslöser 2 Rückmelder enthält: ~RM1 und ~RM2.\nDer Anwender hat aber seine eigenen Rückmelder, bezeichnet mit Rück1 und Rück2.\nUm die Aktion funktionsfähig zu machen, muss der Anwender innerhalb von iTrain (nicht im Import/Export-Tool) die ~RM-Einträge durch "seine" Rück-Einträge ändern. Nur dann wird diese Funktion auch funktionieren.\n\n**Beispiel Lokomotive:**\nBei allen Lokomotiven wird auch das Interface angegeben - eben das Interface, mit dem iTrain diese Lokomotive fahren kann.\nEs kann nun sein, dass der ursprüngliche Anwender seine Lokomotiven mit einer ESU ECoS erfasst hat. Beim Import in eine andere Datei kann es sein, dass der Anwender eine Z21 besitzt. Trotzdem werden alle Lokomotiven mit dem Zusatz ESU importiert, sogar das Interface ESU wird auftauchen.\nDamit iTrain diese Lokomotiven fahren kann, muss der Anwender diese Einträge alle auf seine Z21 ändern.
help.referenceRenameText.en=So that referenced entries do not collide with entries of the same name already present in the target file, they are **renamed** during export: both their own name and every place where they are referenced receive a leading **"~"** (e.g. "RM1" becomes "~RM1" everywhere).\nThis keeps the target file fully functional in iTrain after the import, and existing data is not modified. Reference and definition still match, so the file can be opened and run.\n\nThe **"~"** names are, however, only a **temporary solution**: afterwards the user has to rename them manually in iTrain itself, back into meaningful names - iTrain automatically updates every place where the entry is used.\n\nIf the user imports several such export files one after another within the same session (**as long as the same file stays open**), the first "~RM1" would otherwise collide with a second, actually different "~RM1". For that reason every further import in the same session additionally receives a sequential number directly after the "~": the first import stays at "~", the second becomes "~1", the third "~2" and so on. This number is reset when a new file is opened.\nThis too has to be cleaned up manually by the user. During that clean-up the user can and should put in their own entries.\n\n**Example:**\nAn action is imported that contains 2 feedback sensors as its trigger: ~RM1 and ~RM2.\nThe user, however, has their own feedback sensors, named Rück1 and Rück2.\nTo make the action work, the user has to replace the ~RM entries with "their" Rück entries inside iTrain (not in the Import/Export tool). Only then will this function actually work.\n\n**Locomotive example:**\nFor every locomotive the interface is specified as well - the interface with which iTrain can run this locomotive.\nIt may now be that the original user recorded their locomotives with an ESU ECoS. When importing into another file it may be that the user owns a Z21. All locomotives are nevertheless imported with the ESU entry, and even the ESU interface itself will show up.\nFor iTrain to be able to run these locomotives, the user has to change all of these entries to their Z21.
help.referenceRenameText.nl=Om te voorkomen dat items waarnaar verwezen wordt botsen met gelijknamige items die al in het doelbestand aanwezig zijn, worden ze bij de export **hernoemd**: zowel hun eigen naam als elke plek waar naar ze verwezen wordt krijgt een voorgeplaatste **"~"** (zo wordt "RM1" overal "~RM1").\nHet doelbestand blijft daardoor na de import in iTrain volledig bruikbaar en bestaande gegevens worden niet gewijzigd. Verwijzing en definitie blijven bij elkaar passen, het bestand kan dus geopend en uitgevoerd worden.\n\nDe **"~"**-namen zijn echter slechts een **noodoplossing**: de gebruiker moet ze daarna in iTrain zelf handmatig terugveranderen in betekenisvolle namen - iTrain werkt daarbij automatisch alle plekken bij waar het item gebruikt wordt.\n\nImporteert de gebruiker binnen dezelfde sessie (**zolang hetzelfde bestand geopend blijft**) meerdere van zulke exportbestanden na elkaar, dan zou de eerste "~RM1" anders botsen met een tweede, eigenlijk andere "~RM1". Daarom krijgt elke volgende import in dezelfde sessie bovendien een volgnummer direct achter de "~": de eerste import blijft "~", de tweede wordt "~1", de derde "~2" enzovoort. Dit nummer wordt bij het openen van een nieuw bestand weer teruggezet.\nOok dat moet de gebruiker handmatig opschonen. Bij het opschonen kan/moet de gebruiker dan zijn eigen items invoegen.\n\n**Voorbeeld:**\nEr wordt een actie geïmporteerd die als trigger 2 terugmelders bevat: ~RM1 en ~RM2.\nDe gebruiker heeft echter zijn eigen terugmelders, aangeduid met Rück1 en Rück2.\nOm de actie werkend te krijgen moet de gebruiker binnen iTrain (niet in het Import/Export-hulpmiddel) de ~RM-items vervangen door "zijn" Rück-items. Alleen dan zal deze functie ook werken.\n\n**Voorbeeld locomotief:**\nBij alle locomotieven wordt ook de interface vermeld - juist de interface waarmee iTrain deze locomotief kan laten rijden.\nHet kan nu zo zijn dat de oorspronkelijke gebruiker zijn locomotieven met een ESU ECoS heeft vastgelegd. Bij de import in een ander bestand kan het zo zijn dat de gebruiker een Z21 bezit. Toch worden alle locomotieven met de toevoeging ESU geïmporteerd, zelfs de interface ESU zal opduiken.\nOm iTrain deze locomotieven te kunnen laten rijden, moet de gebruiker al deze items op zijn Z21 wijzigen.
help.referenceRenameText.fr=Afin que les entrées référencées n'entrent pas en conflit avec des entrées de même nom déjà présentes dans le fichier cible, elles sont **renommées** lors de l'export : leur propre nom ainsi que chaque endroit où elles sont référencées reçoivent un **"~"** en préfixe (ainsi "RM1" devient partout "~RM1").\nLe fichier cible reste de ce fait entièrement fonctionnel dans iTrain après l'import, et les données existantes ne sont pas modifiées. La référence et la définition continuent de correspondre, le fichier peut donc être ouvert et exécuté.\n\nLes noms en **"~"** ne sont toutefois qu'une **solution provisoire** : l'utilisateur doit ensuite les renommer lui-même, manuellement, dans iTrain, en noms parlants - iTrain met alors automatiquement à jour tous les endroits où l'entrée est utilisée.\n\nSi l'utilisateur importe plusieurs de ces fichiers d'export à la suite au cours de la même session (**tant que le même fichier reste ouvert**), le premier "~RM1" entrerait sinon en conflit avec un second "~RM1", en réalité différent. C'est pourquoi chaque import supplémentaire de la même session reçoit en plus un numéro d'ordre juste après le "~" : le premier import reste "~", le deuxième devient "~1", le troisième "~2" et ainsi de suite. Ce numéro est réinitialisé à l'ouverture d'un nouveau fichier.\nCela aussi doit être nettoyé manuellement par l'utilisateur. Lors de ce nettoyage, l'utilisateur peut et devrait insérer ses propres entrées.\n\n**Exemple :**\nUne action est importée qui contient 2 rétrosignalisations comme déclencheur : ~RM1 et ~RM2.\nL'utilisateur possède toutefois ses propres rétrosignalisations, nommées Rück1 et Rück2.\nPour rendre l'action fonctionnelle, l'utilisateur doit remplacer, dans iTrain (et non dans l'outil Import/Export), les entrées ~RM par "ses" entrées Rück. Ce n'est qu'alors que cette fonction marchera réellement.\n\n**Exemple d'une locomotive :**\nPour toutes les locomotives, l'interface est également indiquée - précisément l'interface avec laquelle iTrain peut faire rouler cette locomotive.\nIl se peut que l'utilisateur d'origine ait saisi ses locomotives avec une ESU ECoS. Lors de l'import dans un autre fichier, il se peut que l'utilisateur possède une Z21. Toutes les locomotives sont néanmoins importées avec la mention ESU, et même l'interface ESU apparaîtra.\nPour qu'iTrain puisse faire rouler ces locomotives, l'utilisateur doit modifier toutes ces entrées vers sa Z21.
help.referenceRenameText.es=Para que las entradas referenciadas no choquen con entradas del mismo nombre ya presentes en el archivo de destino, se **renombran** durante la exportación: tanto su propio nombre como cada lugar en el que se las referencia reciben una **"~"** delante (así "RM1" pasa a ser "~RM1" en todas partes).\nGracias a ello el archivo de destino sigue siendo plenamente funcional en iTrain después de la importación y los datos existentes no se modifican. La referencia y la definición siguen coincidiendo, por lo que el archivo puede abrirse y ejecutarse.\n\nSin embargo, los nombres con **"~"** son solo una **solución provisional**: después el usuario debe cambiarlos manualmente en el propio iTrain por nombres significativos - iTrain actualiza automáticamente todos los lugares en los que se utiliza la entrada.\n\nSi el usuario importa varios de esos archivos de exportación uno tras otro dentro de la misma sesión (**mientras siga abierto el mismo archivo**), el primer "~RM1" chocaría con un segundo "~RM1" que en realidad es distinto. Por eso cada importación adicional dentro de la misma sesión recibe además un número correlativo justo detrás de la "~": la primera importación se queda en "~", la segunda pasa a "~1", la tercera a "~2" y así sucesivamente. Este número se restablece al abrir un archivo nuevo.\nEso también tiene que limpiarlo el usuario manualmente. Durante esa limpieza el usuario puede y debería insertar sus propias entradas.\n\n**Ejemplo:**\nSe importa una acción que contiene 2 retroseñalizaciones como disparador: ~RM1 y ~RM2.\nEl usuario, sin embargo, tiene sus propias retroseñalizaciones, llamadas Rück1 y Rück2.\nPara que la acción funcione, el usuario debe sustituir dentro de iTrain (no en la herramienta Import/Export) las entradas ~RM por "sus" entradas Rück. Solo entonces funcionará realmente esta función.\n\n**Ejemplo de una locomotora:**\nEn todas las locomotoras se indica también la interfaz - precisamente la interfaz con la que iTrain puede hacer circular esa locomotora.\nPuede ocurrir que el usuario original registrara sus locomotoras con una ESU ECoS. Al importarlas en otro archivo puede ser que el usuario tenga una Z21. Aun así, todas las locomotoras se importan con la indicación ESU, e incluso aparecerá la interfaz ESU.\nPara que iTrain pueda hacer circular esas locomotoras, el usuario debe cambiar todas esas entradas a su Z21.
help.referenceRenameText.it=Affinché le voci referenziate non entrino in conflitto con voci omonime già presenti nel file di destinazione, durante l'esportazione vengono **rinominate**: sia il loro nome sia ogni punto in cui vengono referenziate ricevono una **"~"** anteposta (così "RM1" diventa ovunque "~RM1").\nIn questo modo il file di destinazione resta pienamente funzionante in iTrain dopo l'importazione e i dati esistenti non vengono modificati. Riferimento e definizione continuano a corrispondere, quindi il file può essere aperto ed eseguito.\n\nI nomi con **"~"** sono però solo una **soluzione provvisoria**: successivamente l'utente deve rinominarli manualmente in iTrain con nomi significativi - iTrain aggiorna automaticamente tutti i punti in cui la voce viene utilizzata.\n\nSe l'utente importa più file di esportazione di questo tipo uno dopo l'altro nella stessa sessione (**finché resta aperto lo stesso file**), il primo "~RM1" entrerebbe altrimenti in conflitto con un secondo "~RM1", in realtà diverso. Per questo ogni ulteriore importazione nella stessa sessione riceve in più un numero progressivo subito dopo la "~": la prima importazione resta "~", la seconda diventa "~1", la terza "~2" e così via. Questo numero viene azzerato all'apertura di un nuovo file.\nAnche questo deve essere ripulito manualmente dall'utente. Durante la pulizia l'utente può e dovrebbe inserire le proprie voci.\n\n**Esempio:**\nViene importata un'azione che come attivatore contiene 2 sensori di retroazione: ~RM1 e ~RM2.\nL'utente ha però i propri sensori di retroazione, denominati Rück1 e Rück2.\nPer rendere funzionante l'azione, l'utente deve sostituire all'interno di iTrain (non nello strumento Import/Export) le voci ~RM con le "sue" voci Rück. Solo allora questa funzione funzionerà davvero.\n\n**Esempio locomotiva:**\nPer tutte le locomotive viene indicata anche l'interfaccia - appunto l'interfaccia con cui iTrain può far viaggiare quella locomotiva.\nPuò darsi che l'utente originario abbia registrato le sue locomotive con una ESU ECoS. All'importazione in un altro file può darsi che l'utente possieda una Z21. Ciononostante tutte le locomotive vengono importate con l'indicazione ESU, e comparirà persino l'interfaccia ESU.\nAffinché iTrain possa far viaggiare queste locomotive, l'utente deve modificare tutte queste voci con la sua Z21.
help.referenceRenameText.pt=Para que as entradas referenciadas não colidam com entradas com o mesmo nome já existentes no ficheiro de destino, são **renomeadas** durante a exportação: tanto o seu próprio nome como cada local onde são referenciadas recebem um **"~"** à frente (assim "RM1" passa a ser "~RM1" em todo o lado).\nDeste modo o ficheiro de destino continua totalmente funcional no iTrain depois da importação e os dados existentes não são alterados. Referência e definição continuam a corresponder, pelo que o ficheiro pode ser aberto e executado.\n\nOs nomes com **"~"** são, no entanto, apenas uma **solução provisória**: em seguida o utilizador tem de os alterar manualmente, dentro do próprio iTrain, para nomes significativos - o iTrain atualiza automaticamente todos os locais onde a entrada é utilizada.\n\nSe o utilizador importar vários desses ficheiros de exportação seguidos dentro da mesma sessão (**enquanto o mesmo ficheiro se mantiver aberto**), o primeiro "~RM1" colidiria com um segundo "~RM1", na realidade diferente. Por isso, cada importação adicional na mesma sessão recebe ainda um número sequencial logo a seguir ao "~": a primeira importação fica em "~", a segunda passa a "~1", a terceira a "~2" e assim sucessivamente. Este número é reposto ao abrir um novo ficheiro.\nTambém isso tem de ser limpo manualmente pelo utilizador. Durante essa limpeza o utilizador pode e deve inserir as suas próprias entradas.\n\n**Exemplo:**\nÉ importada uma ação que contém 2 retrossinalizações como acionador: ~RM1 e ~RM2.\nO utilizador tem, porém, as suas próprias retrossinalizações, designadas Rück1 e Rück2.\nPara tornar a ação funcional, o utilizador tem de substituir dentro do iTrain (não na ferramenta Import/Export) as entradas ~RM pelas "suas" entradas Rück. Só então esta função irá realmente funcionar.\n\n**Exemplo de uma locomotiva:**\nEm todas as locomotivas é indicada também a interface - precisamente a interface com a qual o iTrain pode fazer circular essa locomotiva.\nPode acontecer que o utilizador original tenha registado as suas locomotivas com uma ESU ECoS. Ao importar para outro ficheiro pode acontecer que o utilizador tenha uma Z21. Ainda assim, todas as locomotivas são importadas com a indicação ESU e até a interface ESU irá aparecer.\nPara que o iTrain possa fazer circular estas locomotivas, o utilizador tem de alterar todas estas entradas para a sua Z21.
help.referenceRenameText.pl=Aby wpisy, do których istnieją odwołania, nie kolidowały z wpisami o tej samej nazwie obecnymi już w pliku docelowym, podczas eksportu są one **zmieniane nazwą**: zarówno ich własna nazwa, jak i każde miejsce, w którym się do nich odwołano, otrzymują poprzedzający znak **"~"** (np. z "RM1" wszędzie powstaje "~RM1").\nDzięki temu plik docelowy pozostaje po imporcie w pełni funkcjonalny w iTrain, a istniejące dane nie są zmieniane. Odwołanie i definicja nadal do siebie pasują, plik można więc otworzyć i uruchomić.\n\nNazwy z **"~"** są jednak tylko **rozwiązaniem tymczasowym**: użytkownik musi je następnie sam, ręcznie, zmienić w iTrain na nazwy mówiące coś sensownego - iTrain aktualizuje przy tym automatycznie wszystkie miejsca, w których dany wpis jest używany.\n\nJeśli użytkownik zaimportuje w tej samej sesji (**dopóki ten sam plik pozostaje otwarty**) kilka takich plików eksportu jeden po drugim, pierwsze "~RM1" kolidowałoby z drugim, w rzeczywistości innym "~RM1". Dlatego każdy kolejny import w tej samej sesji otrzymuje dodatkowo numer kolejny bezpośrednio po znaku "~": pierwszy import pozostaje przy "~", drugi staje się "~1", trzeci "~2" i tak dalej. Numer ten jest zerowany przy otwarciu nowego pliku.\nTo również użytkownik musi uporządkować ręcznie. Przy porządkowaniu użytkownik może i powinien wstawić własne wpisy.\n\n**Przykład:**\nImportowana jest akcja, która jako wyzwalacz zawiera 2 czujniki zwrotne: ~RM1 i ~RM2.\nUżytkownik ma jednak własne czujniki zwrotne, oznaczone Rück1 i Rück2.\nAby akcja działała, użytkownik musi wewnątrz iTrain (a nie w narzędziu Import/Export) zastąpić wpisy ~RM "swoimi" wpisami Rück. Dopiero wtedy ta funkcja rzeczywiście zadziała.\n\n**Przykład lokomotywy:**\nPrzy wszystkich lokomotywach podawany jest również interfejs - właśnie ten interfejs, za pomocą którego iTrain może prowadzić daną lokomotywę.\nMoże się zdarzyć, że pierwotny użytkownik wprowadził swoje lokomotywy z centralką ESU ECoS. Przy imporcie do innego pliku może się okazać, że użytkownik ma Z21. Mimo to wszystkie lokomotywy zostaną zaimportowane z oznaczeniem ESU, pojawi się nawet sam interfejs ESU.\nAby iTrain mógł prowadzić te lokomotywy, użytkownik musi zmienić wszystkie te wpisy na swoją Z21.
help.referenceRenameText.da=For at poster, der henvises til, ikke kolliderer med poster af samme navn, som allerede findes i målfilen, bliver de **omdøbt** ved eksporten: både deres eget navn og hvert sted, hvor der henvises til dem, får et foranstillet **"~"** (f.eks. bliver "RM1" overalt til "~RM1").\nDerved forbliver målfilen fuldt funktionsdygtig i iTrain efter importen, og eksisterende data ændres ikke. Henvisning og definition passer stadig sammen, filen kan altså åbnes og køres.\n\n**"~"**-navnene er dog kun en **midlertidig løsning**: brugeren skal derefter selv omdøbe dem manuelt i iTrain til sigende navne - iTrain opdaterer samtidig automatisk alle de steder, hvor posten bruges.\n\nImporterer brugeren flere af den slags eksportfiler efter hinanden inden for samme session (**så længe den samme fil forbliver åben**), ville den første "~RM1" ellers kollidere med en anden, i virkeligheden anderledes "~RM1". Derfor får hver yderligere import i samme session desuden et løbenummer umiddelbart efter "~": den første import forbliver ved "~", den anden bliver til "~1", den tredje til "~2" og så videre. Dette nummer nulstilles, når en ny fil åbnes.\nOgså det skal brugeren rydde op i manuelt. Ved oprydningen kan/bør brugeren så indsætte sine egne poster.\n\n**Eksempel:**\nDer importeres en handling, som indeholder 2 tilbagemeldinger som udløser: ~RM1 og ~RM2.\nBrugeren har dog sine egne tilbagemeldinger, betegnet Rück1 og Rück2.\nFor at gøre handlingen funktionsdygtig skal brugeren inde i iTrain (ikke i Import/Export-værktøjet) erstatte ~RM-posterne med "sine" Rück-poster. Kun så vil denne funktion også virke.\n\n**Eksempel lokomotiv:**\nVed alle lokomotiver angives også interfacet - netop det interface, som iTrain kan køre dette lokomotiv med.\nDet kan nu være, at den oprindelige bruger har oprettet sine lokomotiver med en ESU ECoS. Ved import i en anden fil kan det være, at brugeren har en Z21. Alligevel importeres alle lokomotiver med tilføjelsen ESU, ja selv interfacet ESU vil dukke op.\nFor at iTrain kan køre disse lokomotiver, skal brugeren ændre alle disse poster til sin Z21.
help.referenceRenameText.sv=För att poster som det hänvisas till inte ska krocka med likanamnade poster som redan finns i målfilen **byter de namn** vid exporten: både deras eget namn och varje ställe där det hänvisas till dem får ett inledande **"~"** (så blir "RM1" överallt "~RM1").\nDärigenom förblir målfilen fullt funktionsduglig i iTrain efter importen, och befintliga data ändras inte. Hänvisning och definition stämmer fortfarande överens, filen går alltså att öppna och köra.\n\n**"~"**-namnen är dock bara en **provisorisk lösning**: användaren måste därefter själv byta tillbaka dem manuellt i iTrain till talande namn - iTrain uppdaterar då automatiskt alla ställen där posten används.\n\nImporterar användaren flera sådana exportfiler efter varandra inom samma session (**så länge samma fil förblir öppen**) skulle den första "~RM1" annars krocka med en andra, egentligen annan "~RM1". Därför får varje ytterligare import i samma session dessutom ett löpnummer direkt efter "~": den första importen förblir "~", den andra blir "~1", den tredje "~2" och så vidare. Detta nummer nollställs när en ny fil öppnas.\nÄven det måste användaren rensa upp manuellt. Vid uppstädningen kan/bör användaren sedan sätta in sina egna poster.\n\n**Exempel:**\nEn åtgärd importeras som innehåller 2 återkopplingar som utlösare: ~RM1 och ~RM2.\nAnvändaren har dock sina egna återkopplingar, betecknade Rück1 och Rück2.\nFör att göra åtgärden funktionsduglig måste användaren inne i iTrain (inte i Import/Export-verktyget) ersätta ~RM-posterna med "sina" Rück-poster. Först då kommer den här funktionen faktiskt att fungera.\n\n**Exempel lok:**\nFör alla lok anges även gränssnittet - just det gränssnitt som iTrain kan köra loket med.\nDet kan nu vara så att den ursprungliga användaren har registrerat sina lok med en ESU ECoS. Vid import till en annan fil kan det vara så att användaren har en Z21. Ändå importeras alla lok med tillägget ESU, till och med gränssnittet ESU kommer att dyka upp.\nFör att iTrain ska kunna köra dessa lok måste användaren ändra alla dessa poster till sin Z21.

