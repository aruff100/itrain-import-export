decoder.noTemplates.de=Keine Decoder-Vorlagen vorhanden. Bitte im Hauptfenster unter Einstellungen → Voreinstellungen → Pfade den Decoder-Ordner prüfen; die mitgelieferten Vorlagen werden beim nächsten Start dorthin übertragen.
decoder.noTemplates.en=No decoder templates available. Please check the decoder folder in the main window under Settings → Preferences → Paths; the bundled templates are copied there at the next start.
decoder.noTemplates.nl=Geen decodersjablonen aanwezig. Controleer in het hoofdvenster onder Instellingen → Voorkeuren → Paden de decodermap; de meegeleverde sjablonen worden bij de volgende start daarheen gekopieerd.
decoder.noTemplates.fr=Aucun modèle de décodeur disponible. Vérifiez le dossier de décodeurs dans la fenêtre principale sous Paramètres → Préférences → Chemins ; les modèles fournis y seront copiés au prochain démarrage.
decoder.noTemplates.es=No hay plantillas de decodificador. Compruebe la carpeta de decodificadores en la ventana principal en Configuración → Preferencias → Rutas; las plantillas incluidas se copiarán allí en el próximo inicio.
decoder.noTemplates.it=Nessun modello di decoder disponibile. Controllare la cartella dei decoder nella finestra principale in Impostazioni → Preferenze → Percorsi; i modelli forniti vi verranno copiati al prossimo avvio.
decoder.noTemplates.pt=Não há modelos de descodificador. Verifique a pasta de descodificadores na janela principal em Definições → Preferências → Caminhos; os modelos incluídos serão copiados para lá no próximo arranque.
decoder.noTemplates.pl=Brak szablonów dekoderów. Sprawdź folder dekoderów w oknie głównym w Ustawienia → Preferencje → Ścieżki; dołączone szablony zostaną tam skopiowane przy następnym uruchomieniu.
decoder.noTemplates.da=Ingen dekoderskabeloner tilgængelige. Kontrollér dekodermappen i hovedvinduet under Indstillinger → Præferencer → Stier; de medfølgende skabeloner kopieres dertil ved næste start.
decoder.noTemplates.sv=Inga dekodermallar tillgängliga. Kontrollera dekodermappen i huvudfönstret under Inställningar → Inställningar → Sökvägar; de medföljande mallarna kopieras dit vid nästa start.

