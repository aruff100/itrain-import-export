capture.pasteHereHint.de=Verteilt den markierten Bereich (sonst die Zwischenablage) ab der ausgewählten Zelle auf mehrere Zeilen. Beginnt eine Zeile mit einer Zahl, gilt diese als CV-Nummer, eine darauf folgende kurze Zahl als Wert, der Rest wird zur Bezeichnung.
capture.pasteHereHint.en=Spreads the selected region (otherwise the clipboard) across several rows, starting at the selected cell. If a line begins with a number, that is taken as the CV number, a short number following it as the value, and the rest becomes the name.
capture.pasteHereHint.nl=Verdeelt het geselecteerde gebied (anders het klembord) vanaf de geselecteerde cel over meerdere regels. Begint een regel met een getal, dan geldt dat als CV-nummer, een daaropvolgend kort getal als waarde en de rest wordt de naam.
capture.pasteHereHint.fr=Répartit la zone sélectionnée (sinon le presse-papiers) sur plusieurs lignes à partir de la cellule sélectionnée. Si une ligne commence par un nombre, celui-ci est pris comme numéro de CV, un court nombre suivant comme valeur, et le reste devient le nom.
capture.pasteHereHint.es=Reparte el área seleccionada (si no, el portapapeles) en varias filas a partir de la celda seleccionada. Si una línea empieza por un número, este se toma como número de CV, un número corto a continuación como valor, y el resto pasa a ser el nombre.
capture.pasteHereHint.it=Distribuisce l'area selezionata (altrimenti gli appunti) su più righe a partire dalla cella selezionata. Se una riga inizia con un numero, questo vale come numero CV, un successivo numero breve come valore e il resto diventa il nome.
capture.pasteHereHint.pt=Distribui a área selecionada (caso contrário, a área de transferência) por várias linhas a partir da célula selecionada. Se uma linha começar por um número, este é tomado como número CV, um número curto a seguir como valor, e o resto passa a ser o nome.
capture.pasteHereHint.pl=Rozdziela zaznaczony obszar (w przeciwnym razie zawartość schowka) na kilka wierszy, począwszy od zaznaczonej komórki. Jeśli wiersz zaczyna się liczbą, jest ona traktowana jako numer CV, następująca po niej krótka liczba jako wartość, a reszta staje się nazwą.
capture.pasteHereHint.da=Fordeler det markerede område (ellers udklipsholderen) over flere rækker fra den markerede celle. Begynder en linje med et tal, opfattes det som CV-nummer, et efterfølgende kort tal som værdi, og resten bliver navnet.
capture.pasteHereHint.sv=Fördelar det markerade området (annars urklipp) över flera rader med start i den markerade cellen. Börjar en rad med en siffra tolkas den som CV-nummer, ett kort tal därefter som värde, och resten blir namnet.

capture.pasteNoTarget.de=Bitte zuerst die Zelle anklicken, ab der eingefügt werden soll.
capture.pasteNoTarget.en=Please click the cell where the pasting should start.
capture.pasteNoTarget.nl=Klik eerst op de cel waar het plakken moet beginnen.
capture.pasteNoTarget.fr=Cliquez d'abord sur la cellule où le collage doit commencer.
capture.pasteNoTarget.es=Haga clic primero en la celda a partir de la cual se debe pegar.
capture.pasteNoTarget.it=Fai prima clic sulla cella da cui iniziare a incollare.
capture.pasteNoTarget.pt=Clique primeiro na célula a partir da qual se deve colar.
capture.pasteNoTarget.pl=Kliknij najpierw komórkę, od której ma się zacząć wstawianie.
capture.pasteNoTarget.da=Klik først på den celle, der skal indsættes fra.
capture.pasteNoTarget.sv=Klicka först på cellen där inklistringen ska börja.

capture.pasteResult.de={0} Zeilen eingefügt.\n\nBitte die Aufteilung auf Nr., Wert und Bezeichnung prüfen - sie folgt einer einfachen Regel und trifft nicht jede Anleitung.
capture.pasteResult.en={0} rows pasted.\n\nPlease check how they were split into No., Value and Name - the rule is a simple one and does not fit every manual.
capture.pasteResult.nl={0} regels geplakt.\n\nControleer de verdeling over Nr., Waarde en Naam - die volgt een eenvoudige regel en past niet bij elke handleiding.
capture.pasteResult.fr={0} lignes collées.\n\nVérifiez la répartition entre N°, Valeur et Nom : elle suit une règle simple et ne convient pas à toutes les notices.
capture.pasteResult.es={0} filas pegadas.\n\nCompruebe el reparto entre N.º, Valor y Nombre: sigue una regla sencilla y no encaja con todos los manuales.
capture.pasteResult.it={0} righe incollate.\n\nControlla la suddivisione in N., Valore e Nome: segue una regola semplice e non si adatta a ogni manuale.
capture.pasteResult.pt={0} linhas coladas.\n\nVerifique a divisão em N.º, Valor e Nome: segue uma regra simples e não serve para todos os manuais.
capture.pasteResult.pl=Wstawiono {0} wierszy.\n\nSprawdź podział na Nr, Wartość i Nazwę - opiera się na prostej regule i nie pasuje do każdej instrukcji.
capture.pasteResult.da={0} rækker indsat.\n\nKontroller fordelingen på Nr., Værdi og Navn - den følger en enkel regel og passer ikke til enhver vejledning.
capture.pasteResult.sv={0} rader inklistrade.\n\nKontrollera uppdelningen i Nr, Värde och Namn - den följer en enkel regel och passar inte varje manual.

