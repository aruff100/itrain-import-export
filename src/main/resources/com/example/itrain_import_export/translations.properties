help.explorerText.de=Die mittlere Spalte eines Kategorie-Reiters zeigt den **Daten-Explorer**: die vollständige Baumstruktur des links ausgewählten Eintrags, genau so, wie er in der Datei steht.\n\n- Ein Klick auf das **Dreieck** vor einer Zeile klappt die darunterliegenden Daten auf und wieder zu. Zeilen ohne Dreieck haben keine weiteren Unterdaten.\n- Ein Klick auf die **Zeile selbst** wählt sie aus. Ist unter Voreinstellungen → Ansicht der Punkt **Daten ändern** angehakt, zeigt der Bereich rechts daneben die Daten genau dieser Zeile - und dort sind sie auch änderbar.\n- **Rechtsklick** auf eine Zeile bietet **Bearbeiten** und **Export**. Bearbeiten lässt zu, dass diese Einträge verändert werden - bitte mit äußerster Vorsicht!\n\nIm Bereich **Daten ändern** werden angezeigt:\n- **Tag** - der Name des Elements, z.B. "interface".\n- **Textinhalt** - der Text innerhalb des Elements, sofern vorhanden, z.B. "22.0" bei einer Längenangabe.\n- **Attribute** - die eigentlichen Daten, als Tabelle aus Name und Wert. Bei der Zeile interface "~YD7001" address=37 stehen dort also die beiden Zeilen name = ~YD7001 und address = 37.\n\nEin Doppelklick in die Spalte **Wert** macht die Zelle bearbeitbar, die Eingabetaste übernimmt die Änderung. Geändert werden können ausschließlich die **Werte**: Tag und Attributname legen die Struktur der Datei fest und werden deshalb nur angezeigt. Aus demselben Grund lassen sich hier auch keine Attribute anlegen oder löschen. Ein leer gemachter Wert bleibt als leeres Attribut erhalten.\n\nEin festes Schema gibt es dabei nicht: jedes Element hat seine eigenen Attribute, manche haben zusätzlich einen Textinhalt. Deshalb ist die Tabelle bewusst allgemein gehalten und zeigt immer genau das, was an der ausgewählten Zeile tatsächlich vorhanden ist.\n\nEine Ausnahme sind Lokomotiven und Wagen: ein Doppelklick auf eine Zeile links (oder das "+") öffnet statt dessen ein eigenes Bearbeitungsfenster mit den wichtigsten Feldern (Name, Beschreibung, Typ, Länge, Decoder-Typ, UID, Adresse, Schnittstelle, Knoten) - siehe den Abschnitt "Die drei Programmteile" oben. Alle übrigen Felder bleiben trotzdem hier im Daten-Explorer erreichbar.\n\nEine weitere Ausnahme ist der Knoten **configuration** bei **Lokomotiven** und **Wagen**: dort erscheint statt der Attributtabelle die spezialisierte Konfigurationstabelle mit Nr, Wert, Typ und Beschreibung.\n**configuration** ist farblich hervorgehoben.\nZugleich taucht über dem Daten-Explorer der Knopf **Decoder-CVs bearbeiten** auf - er öffnet dieselben Werte in einer großen Tabelle mit mehr Platz und Tastaturbedienung.
help.explorerText.en=The middle column of a category tab shows the **data explorer**: the complete tree structure of the entry selected on the left, exactly as it stands in the file.\n\n- Clicking the **triangle** in front of a row expands and collapses the data below it. Rows without a triangle have no further sub-data.\n- Clicking the **row itself** selects it. If **Change data** is checked under Preferences → View, the area next to it shows the data of exactly this row - and it can be edited there too.\n- **Right-click** on a row offers **Edit** and **Export**. Edit allows these entries to be modified - please use extreme caution!\n\nThe **Change data** area shows:\n- **Tag** - the name of the element, e.g. "interface".\n- **Text content** - the text inside the element, if present, e.g. "22.0" for a length value.\n- **Attributes** - the actual data, as a table of name and value. For the row interface "~YD7001" address=37, this shows the two lines name = ~YD7001 and address = 37.\n\nDouble-clicking in the **Value** column makes the cell editable; Enter applies the change. Only the **values** can be changed: tag and attribute name define the structure of the file and are therefore only displayed. For the same reason, attributes cannot be created or deleted here. A value that has been cleared remains as an empty attribute.\n\nThere is no fixed scheme here: every element has its own attributes, and some also have text content. That's why the table is deliberately kept generic and always shows exactly what is actually present on the selected row.\n\nOne exception are locomotives and wagons: double-clicking a row on the left (or the "+") instead opens a dedicated editing window with the most important fields (name, description, type, length, decoder type, UID, address, interface, node) - see the section "The three parts" above. All other fields still remain reachable here in the data explorer.\n\nAnother exception is the **configuration** node for **locomotives** and **wagons**: there, instead of the attribute table, the specialized configuration table with number, value, type and description appears.\n**configuration** is highlighted in color.\nAt the same time, the **Edit decoder CVs** button appears above the data explorer - it opens the same values in a large table with more room and keyboard operation.
help.explorerText.nl=De middelste kolom van een categorietab toont de **data-explorer**: de volledige boomstructuur van het links geselecteerde item, precies zoals het in het bestand staat.\n\n- Een klik op de **driehoek** voor een rij vouwt de onderliggende gegevens open en weer dicht. Rijen zonder driehoek hebben geen verdere subgegevens.\n- Een klik op de **rij zelf** selecteert deze. Is onder Voorkeuren → Weergave het punt **Gegevens wijzigen** aangevinkt, dan toont het gebied ernaast de gegevens van precies deze rij - en zijn ze daar ook wijzigbaar.\n- **Rechtsklik** op een rij biedt **Bewerken** en **Export**. Bewerken staat toe dat deze items worden gewijzigd - graag met de grootste voorzichtigheid!\n\nIn het gebied **Gegevens wijzigen** wordt getoond:\n- **Tag** - de naam van het element, bijv. "interface".\n- **Tekstinhoud** - de tekst binnen het element, indien aanwezig, bijv. "22.0" bij een lengteopgave.\n- **Attributen** - de eigenlijke gegevens, als tabel van naam en waarde. Bij de rij interface "~YD7001" address=37 staan er dus de twee regels name = ~YD7001 en address = 37.\n\nEen dubbelklik in de kolom **Waarde** maakt de cel bewerkbaar, de Enter-toets past de wijziging toe. Alleen de **waarden** kunnen worden gewijzigd: tag en attribuutnaam leggen de structuur van het bestand vast en worden daarom alleen getoond. Om dezelfde reden kunnen hier ook geen attributen worden aangemaakt of verwijderd. Een leeggemaakte waarde blijft bestaan als leeg attribuut.\n\nEen vast schema is er daarbij niet: elk element heeft zijn eigen attributen, sommige hebben daarnaast een tekstinhoud. Daarom is de tabel bewust algemeen gehouden en toont steeds precies wat er bij de geselecteerde rij daadwerkelijk aanwezig is.\n\nEen uitzondering zijn locomotieven en wagons: een dubbelklik op een rij links (of de "+") opent in plaats daarvan een eigen bewerkingsvenster met de belangrijkste velden (naam, beschrijving, type, lengte, decodertype, UID, adres, interface, knooppunt) - zie het hoofdstuk "De drie onderdelen" hierboven. Alle overige velden blijven desondanks hier in de data-explorer bereikbaar.\n\nEen andere uitzondering is het knooppunt **configuration** bij **locomotieven** en **wagons**: daar verschijnt in plaats van de attributentabel de gespecialiseerde configuratietabel met nr, waarde, type en beschrijving.\n**configuration** is qua kleur gemarkeerd.\nTegelijk verschijnt boven de data-explorer de knop **Decoder-CV's bewerken** - deze opent dezelfde waarden in een grote tabel met meer ruimte en toetsenbordbediening.
help.explorerText.fr=La colonne du milieu d'un onglet de catégorie affiche l'**explorateur de données** : la structure arborescente complète de l'entrée sélectionnée à gauche, exactement telle qu'elle figure dans le fichier.\n\n- Un clic sur le **triangle** devant une ligne déplie puis replie les données situées dessous. Les lignes sans triangle n'ont pas d'autres sous-données.\n- Un clic sur la **ligne elle-même** la sélectionne. Si l'option **Modifier les données** est cochée sous Préférences → Affichage, la zone à côté affiche les données de cette ligne précise - et elles y sont également modifiables.\n- Un **clic droit** sur une ligne propose **Modifier** et **Export**. Modifier permet de changer ces entrées - à faire avec la plus grande prudence !\n\nLa zone **Modifier les données** affiche :\n- **Tag** - le nom de l'élément, p. ex. « interface ».\n- **Contenu texte** - le texte à l'intérieur de l'élément, s'il existe, p. ex. « 22.0 » pour une longueur.\n- **Attributs** - les données proprement dites, sous forme de tableau nom/valeur. Pour la ligne interface « ~YD7001 » address=37, on trouve donc les deux lignes name = ~YD7001 et address = 37.\n\nUn double clic dans la colonne **Valeur** rend la cellule modifiable, la touche Entrée applique la modification. Seules les **valeurs** peuvent être modifiées : le tag et le nom d'attribut définissent la structure du fichier et ne sont donc qu'affichés. Pour la même raison, il n'est pas possible ici de créer ou de supprimer des attributs. Une valeur vidée reste sous forme d'attribut vide.\n\nIl n'existe pas de schéma fixe : chaque élément a ses propres attributs, certains ont en plus un contenu texte. C'est pourquoi le tableau est volontairement générique et montre toujours exactement ce qui est réellement présent sur la ligne sélectionnée.\n\nUne exception concerne les locomotives et les wagons : un double clic sur une ligne à gauche (ou le « + ») ouvre à la place une fenêtre d'édition dédiée avec les champs les plus importants (nom, description, type, longueur, type de décodeur, UID, adresse, interface, nœud) - voir la section « Les trois parties » ci-dessus. Tous les autres champs restent malgré tout accessibles ici dans l'explorateur de données.\n\nUne autre exception est le nœud **configuration** pour les **locomotives** et les **wagons** : à cet endroit, au lieu du tableau d'attributs, apparaît le tableau de configuration spécialisé avec numéro, valeur, type et description.\n**configuration** est mis en évidence par une couleur.\nEn même temps, le bouton **Modifier les CV du décodeur** apparaît au-dessus de l'explorateur de données - il ouvre les mêmes valeurs dans un grand tableau offrant plus de place et une utilisation au clavier.
help.explorerText.es=La columna central de una pestaña de categoría muestra el **explorador de datos**: la estructura completa en árbol de la entrada seleccionada a la izquierda, exactamente como figura en el archivo.\n\n- Un clic en el **triángulo** delante de una fila despliega y vuelve a plegar los datos situados debajo. Las filas sin triángulo no tienen más subdatos.\n- Un clic en la **propia fila** la selecciona. Si en Preferencias → Vista está marcada la opción **Cambiar datos**, el área contigua muestra los datos de exactamente esa fila - y allí también se pueden modificar.\n- El **clic derecho** en una fila ofrece **Editar** y **Exportar**. Editar permite modificar estas entradas - ¡hágalo con la máxima precaución!\n\nEn el área **Cambiar datos** se muestran:\n- **Etiqueta** - el nombre del elemento, p. ej. "interface".\n- **Contenido de texto** - el texto dentro del elemento, si existe, p. ej. "22.0" en una indicación de longitud.\n- **Atributos** - los datos propiamente dichos, como tabla de nombre y valor. En la fila interface "~YD7001" address=37 aparecen así las dos líneas name = ~YD7001 y address = 37.\n\nUn doble clic en la columna **Valor** hace editable la celda, y la tecla Intro aplica el cambio. Solo se pueden modificar los **valores**: la etiqueta y el nombre del atributo determinan la estructura del archivo y por eso solo se muestran. Por el mismo motivo, aquí tampoco se pueden crear ni eliminar atributos. Un valor vaciado se conserva como atributo vacío.\n\nNo existe un esquema fijo: cada elemento tiene sus propios atributos, y algunos tienen además contenido de texto. Por eso la tabla se mantiene deliberadamente genérica y muestra siempre exactamente lo que realmente está presente en la fila seleccionada.\n\nUna excepción son las locomotoras y los vagones: un doble clic en una fila a la izquierda (o el "+") abre en su lugar una ventana de edición propia con los campos más importantes (nombre, descripción, tipo, longitud, tipo de decodificador, UID, dirección, interfaz, nodo) - véase el apartado "Las tres partes" más arriba. Todos los demás campos siguen siendo accesibles aquí, en el explorador de datos.\n\nOtra excepción es el nodo **configuration** en **locomotoras** y **vagones**: allí, en lugar de la tabla de atributos, aparece la tabla de configuración especializada con número, valor, tipo y descripción.\n**configuration** está resaltado con color.\nAl mismo tiempo aparece encima del explorador de datos el botón **Editar CV del decodificador** - abre los mismos valores en una tabla grande con más espacio y manejo mediante teclado.
help.explorerText.it=La colonna centrale di una scheda categoria mostra l'**esploratore dati**: la struttura ad albero completa della voce selezionata a sinistra, esattamente come si trova nel file.\n\n- Un clic sul **triangolo** davanti a una riga espande e richiude i dati sottostanti. Le righe senza triangolo non hanno ulteriori sotto-dati.\n- Un clic sulla **riga stessa** la seleziona. Se in Preferenze → Visualizzazione è selezionata la voce **Modifica dati**, l'area accanto mostra i dati esattamente di quella riga - e lì sono anche modificabili.\n- Il **clic destro** su una riga offre **Modifica** ed **Esporta**. Modifica consente di cambiare queste voci - da usare con estrema cautela!\n\nNell'area **Modifica dati** vengono mostrati:\n- **Tag** - il nome dell'elemento, ad es. "interface".\n- **Contenuto testuale** - il testo all'interno dell'elemento, se presente, ad es. "22.0" per un'indicazione di lunghezza.\n- **Attributi** - i dati veri e propri, come tabella di nome e valore. Per la riga interface "~YD7001" address=37 compaiono quindi le due righe name = ~YD7001 e address = 37.\n\nUn doppio clic nella colonna **Valore** rende la cella modificabile, il tasto Invio applica la modifica. Possono essere modificati esclusivamente i **valori**: tag e nome dell'attributo definiscono la struttura del file e vengono quindi solo mostrati. Per lo stesso motivo qui non è possibile creare o eliminare attributi. Un valore svuotato resta come attributo vuoto.\n\nNon esiste uno schema fisso: ogni elemento ha i propri attributi, alcuni hanno inoltre un contenuto testuale. Per questo la tabella è volutamente generica e mostra sempre esattamente ciò che è effettivamente presente nella riga selezionata.\n\nUn'eccezione sono le locomotive e i carri: un doppio clic su una riga a sinistra (o il "+") apre invece una finestra di modifica dedicata con i campi principali (nome, descrizione, tipo, lunghezza, tipo di decoder, UID, indirizzo, interfaccia, nodo) - vedi la sezione "Le tre parti" più sopra. Tutti gli altri campi restano comunque raggiungibili qui nell'esploratore dati.\n\nUn'altra eccezione è il nodo **configuration** per **locomotive** e **carri**: lì, invece della tabella degli attributi, compare la tabella di configurazione specializzata con numero, valore, tipo e descrizione.\n**configuration** è evidenziato a colori.\nContemporaneamente sopra l'esploratore dati compare il pulsante **Modifica CV del decoder** - apre gli stessi valori in una grande tabella con più spazio e utilizzo da tastiera.
help.explorerText.pt=A coluna do meio de um separador de categoria mostra o **explorador de dados**: a estrutura em árvore completa da entrada selecionada à esquerda, exatamente como consta no ficheiro.\n\n- Um clique no **triângulo** antes de uma linha expande e volta a fechar os dados subjacentes. Linhas sem triângulo não têm mais subdados.\n- Um clique na **própria linha** seleciona-a. Se em Preferências → Visualização estiver marcada a opção **Alterar dados**, a área ao lado mostra os dados exatamente dessa linha - e aí também são editáveis.\n- O **clique direito** numa linha oferece **Editar** e **Exportar**. Editar permite que estas entradas sejam alteradas - por favor com o máximo cuidado!\n\nNa área **Alterar dados** são mostrados:\n- **Tag** - o nome do elemento, p. ex. "interface".\n- **Conteúdo de texto** - o texto dentro do elemento, se existir, p. ex. "22.0" numa indicação de comprimento.\n- **Atributos** - os dados propriamente ditos, como tabela de nome e valor. Na linha interface "~YD7001" address=37 aparecem assim as duas linhas name = ~YD7001 e address = 37.\n\nUm duplo clique na coluna **Valor** torna a célula editável, a tecla Enter aplica a alteração. Só podem ser alterados os **valores**: a tag e o nome do atributo definem a estrutura do ficheiro e por isso são apenas mostrados. Pelo mesmo motivo, aqui também não é possível criar ou eliminar atributos. Um valor esvaziado permanece como atributo vazio.\n\nNão existe aqui um esquema fixo: cada elemento tem os seus próprios atributos, alguns têm também conteúdo de texto. Por isso a tabela é deliberadamente genérica e mostra sempre exatamente o que realmente existe na linha selecionada.\n\nUma exceção são as locomotivas e os vagões: um duplo clique numa linha à esquerda (ou o "+") abre em vez disso uma janela de edição própria com os campos mais importantes (nome, descrição, tipo, comprimento, tipo de descodificador, UID, endereço, interface, nó) - ver a secção "As três partes" acima. Todos os outros campos continuam, ainda assim, acessíveis aqui no explorador de dados.\n\nOutra exceção é o nó **configuration** em **locomotivas** e **vagões**: aí aparece, em vez da tabela de atributos, a tabela de configuração especializada com número, valor, tipo e descrição.\n**configuration** está destacado a cores.\nAo mesmo tempo aparece acima do explorador de dados o botão **Editar CVs do descodificador** - abre os mesmos valores numa grande tabela com mais espaço e utilização pelo teclado.
help.explorerText.pl=Środkowa kolumna zakładki kategorii pokazuje **eksplorator danych**: pełną strukturę drzewa wybranego po lewej wpisu, tak jak stoi ona w pliku.\n\n- Kliknięcie **trójkąta** przed wierszem rozwija i ponownie zwija znajdujące się pod nim dane. Wiersze bez trójkąta nie mają dalszych poddanych.\n- Kliknięcie **samego wiersza** wybiera go. Jeśli w Preferencjach → Widok zaznaczona jest opcja **Zmiana danych**, obszar po prawej stronie pokazuje dane właśnie tego wiersza - i tam też można je zmieniać.\n- **Kliknięcie prawym przyciskiem** na wierszu oferuje **Edytuj** i **Eksport**. Edytuj pozwala zmieniać te wpisy - proszę z najwyższą ostrożnością!\n\nW obszarze **Zmiana danych** wyświetlane są:\n- **Tag** - nazwa elementu, np. "interface".\n- **Zawartość tekstowa** - tekst wewnątrz elementu, jeśli istnieje, np. "22.0" przy podaniu długości.\n- **Atrybuty** - właściwe dane, jako tabela nazwa-wartość. Dla wiersza interface "~YD7001" address=37 pojawiają się więc dwa wiersze name = ~YD7001 i address = 37.\n\nDwuklik w kolumnie **Wartość** umożliwia edycję komórki, klawisz Enter zatwierdza zmianę. Zmieniać można wyłącznie **wartości**: tag i nazwa atrybutu określają strukturę pliku i dlatego są tylko wyświetlane. Z tego samego powodu nie można tu też tworzyć ani usuwać atrybutów. Opróżniona wartość pozostaje jako pusty atrybut.\n\nNie ma tu jednego stałego schematu: każdy element ma swoje własne atrybuty, niektóre mają dodatkowo zawartość tekstową. Dlatego tabela jest celowo ogólna i zawsze pokazuje właśnie to, co faktycznie znajduje się w wybranym wierszu.\n\nWyjątkiem są lokomotywy i wagony: dwuklik na wierszu po lewej (lub "+") otwiera natomiast osobne okno edycji z najważniejszymi polami (nazwa, opis, typ, długość, typ dekodera, UID, adres, interfejs, węzeł) - patrz rozdział "Trzy części" powyżej. Wszystkie pozostałe pola pozostają jednak dostępne tutaj, w eksploratorze danych.\n\nKolejnym wyjątkiem jest węzeł **configuration** przy **lokomotywach** i **wagonach**: tam zamiast tabeli atrybutów pojawia się wyspecjalizowana tabela konfiguracji z numerem, wartością, typem i opisem.\n**configuration** jest wyróżniony kolorem.\nJednocześnie nad eksploratorem danych pojawia się przycisk **Edytuj CV dekodera** - otwiera te same wartości w dużej tabeli z większą ilością miejsca i obsługą klawiaturą.
help.explorerText.da=Den midterste kolonne i en kategorifane viser **dataudforskeren**: den fuldstændige trædatastruktur for den til venstre valgte post, nøjagtig som den står i filen.\n\n- Et klik på **trekanten** foran en linje folder de underliggende data ud og sammen igen. Linjer uden trekant har ingen yderligere underdata.\n- Et klik på **selve linjen** vælger den. Er punktet **Rediger data** afkrydset under Præferencer → Visning, viser området lige til højre for netop denne linjes data - og der kan de også redigeres.\n- **Højreklik** på en linje giver **Rediger** og **Eksport**. Rediger tillader, at disse poster ændres - gør det med den største forsigtighed!\n\nI området **Rediger data** vises:\n- **Tag** - elementets navn, f.eks. "interface".\n- **Tekstindhold** - teksten inde i elementet, hvis den findes, f.eks. "22.0" ved en længdeangivelse.\n- **Attributter** - de egentlige data, som en tabel af navn og værdi. Ved linjen interface "~YD7001" address=37 står der altså de to linjer name = ~YD7001 og address = 37.\n\nEt dobbeltklik i kolonnen **Værdi** gør cellen redigerbar, Enter-tasten overtager ændringen. Kun **værdierne** kan ændres: tag og attributnavn fastlægger filens struktur og vises derfor kun. Af samme grund kan der her heller ikke oprettes eller slettes attributter. En tømt værdi forbliver som et tomt attribut.\n\nDer findes ikke noget fast skema: hvert element har sine egne attributter, nogle har desuden et tekstindhold. Derfor er tabellen med vilje holdt generel og viser altid præcis det, der reelt findes ved den valgte linje.\n\nEn undtagelse er lokomotiver og vogne: et dobbeltklik på en linje til venstre (eller "+") åbner i stedet et eget redigeringsvindue med de vigtigste felter (navn, beskrivelse, type, længde, dekodertype, UID, adresse, interface, knude) - se afsnittet "De tre dele" ovenfor. Alle øvrige felter forbliver alligevel tilgængelige her i dataudforskeren.\n\nEn anden undtagelse er knuden **configuration** ved **lokomotiver** og **vogne**: der vises i stedet for attributtabellen den specialiserede konfigurationstabel med nr., værdi, type og beskrivelse.\n**configuration** er farvemarkeret.\nSamtidig dukker knappen **Rediger dekoder-CV'er** op over dataudforskeren - den åbner de samme værdier i en stor tabel med mere plads og tastaturbetjening.
help.explorerText.sv=Den mittersta kolumnen i en kategoriflik visar **datautforskaren**: den fullständiga trädstrukturen för den till vänster valda posten, exakt som den står i filen.\n\n- Ett klick på **triangeln** framför en rad fäller ut och ihop de underliggande data. Rader utan triangel har inga fler underdata.\n- Ett klick på **själva raden** väljer den. Är punkten **Ändra data** ikryssad under Alternativ → Visning, visar området bredvid data för just denna rad - och där går de också att ändra.\n- **Högerklick** på en rad erbjuder **Redigera** och **Exportera**. Redigera tillåter att dessa poster ändras - använd yttersta försiktighet!\n\nI området **Ändra data** visas:\n- **Tag** - elementets namn, t.ex. "interface".\n- **Textinnehåll** - texten inuti elementet, om sådant finns, t.ex. "22.0" vid en längdangivelse.\n- **Attribut** - de egentliga data, som en tabell med namn och värde. För raden interface "~YD7001" address=37 står det alltså de två raderna name = ~YD7001 och address = 37.\n\nEtt dubbelklick i kolumnen **Värde** gör cellen redigerbar, Enter-tangenten godkänner ändringen. Endast **värdena** kan ändras: tag och attributnamn fastställer filens struktur och visas därför bara. Av samma skäl går det inte att skapa eller ta bort attribut här. Ett tömt värde finns kvar som ett tomt attribut.\n\nDet finns inget fast schema: varje element har sina egna attribut, vissa har dessutom textinnehåll. Därför hålls tabellen medvetet generell och visar alltid exakt det som faktiskt finns på den valda raden.\n\nEtt undantag är lok och vagnar: ett dubbelklick på en rad till vänster (eller "+") öppnar istället ett eget redigeringsfönster med de viktigaste fälten (namn, beskrivning, typ, längd, dekodertyp, UID, adress, gränssnitt, nod) - se avsnittet "De tre delarna" ovan. Alla övriga fält förblir trots det tillgängliga här i datautforskaren.\n\nEtt annat undantag är noden **configuration** för **lok** och **vagnar**: där visas i stället för attributtabellen den specialiserade konfigurationstabellen med nr, värde, typ och beskrivning.\n**configuration** är färgmarkerad.\nSamtidigt dyker knappen **Redigera dekoderns CV** upp ovanför datautforskaren - den öppnar samma värden i en stor tabell med mer plats och tangentbordshantering.

help.referenceRenameTitle.de=Verknüpfte Einträge: Kennzeichnung mit "~"
help.referenceRenameTitle.en=Linked entries: marked with "~"
help.referenceRenameTitle.nl=Gekoppelde items: aanduiding met "~"
help.referenceRenameTitle.fr=Entrées liées : marquage par "~"
help.referenceRenameTitle.es=Entradas vinculadas: marcado con "~"
help.referenceRenameTitle.it=Voci collegate: contrassegno con "~"
help.referenceRenameTitle.pt=Entradas ligadas: identificação com "~"
help.referenceRenameTitle.pl=Powiązane wpisy: oznaczenie znakiem "~"
