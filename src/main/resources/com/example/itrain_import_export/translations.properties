help.bidibText.de=Über **Systeme → BiDiB → Verbinden...** wird eine netBiDiB-Zentrale im Netz angesprochen.\n\n**Geräte finden:** Das Fenster sucht beim Öffnen selbsttätig nach Geräten im lokalen Netz (mDNS) und listet sie in zwei Spalten auf. Links steht das gefundene Gerät, rechts, ob dafür schon ein Pairing vorliegt:\n- **Pairing verfügbar** - das Gerät ist bereits bekannt. Beim Verbinden wird die gespeicherte Vertrauensstellung benutzt, es erscheint keine Pairing-Abfrage mehr.\n- **Pairing erforderlich** - das Gerät ist neu. Beim Verbinden erscheint das Pairing-Fenster; die Anfrage muss zusätzlich am Gerät selbst bestätigt werden.\n\nEin Klick auf eine Zeile übernimmt Adresse und Port in die Felder darunter; beide lassen sich auch von Hand eintragen (Standard-Port 62875). Der Name, mit dem sich das Programm vorstellt, und die zuletzt verwendete Adresse werden gemerkt. **Erneut suchen** startet die Suche neu.\n\n**Zusätzliche Suche für die Tams mc2 (per FTP):** Meldet sich eine mc2 gerade nicht zuverlässig per mDNS, tastet das Verbindungsfenster zusätzlich das lokale Netz auf ihren FTP-Zugang ab (genau wie bei der ECoS-Suche weiter unten: keine echte Gerätesuche, sondern eine Abtastung des /24-Netzes mit anschließender Bestätigung) und zeigt einen Fund in einer eigenen kleinen Liste "mc2 per FTP gefunden" unterhalb der manuellen Adresseingabe. Ein Klick übernimmt nur die IP-Adresse (mit dem Standard-Port); verbunden wird trotzdem ganz normal per netBiDiB, nicht per FTP - die FTP-Prüfung dient ausschließlich dem Auffinden der Adresse. Meldet sich dieselbe mc2 gleichzeitig auch per mDNS, erscheint sie absichtlich zweimal: oben in der Netz-Liste als BiDiB-Gerät, und hier zusätzlich als "mc2 (FTP)".\n\n**BiDiB-Weiterleitung von iTrain:** iTrain kann den BiDiB-Verkehr an andere Programme weiterreichen (in iTrain einstellbarer Port, z.B. 62800). Das ist kein netBiDiB, sondern BiDiB im seriellen Format über TCP - deshalb gibt es dafür den Ankreuzkasten **BiDiB seriell über TCP** unter der manuellen Adresse und eine eigene Fundliste **BiDiB-Weiterleitung (iTrain) gefunden**. Gesucht wird auf dem eigenen Rechner (127.0.0.1 und eigene Netzadresse) und im lokalen /24-Netz auf Port 62800; ein Haken ✔ zeigt, dass dort tatsächlich BiDiB-Verkehr gesehen wurde. Lauscht iTrain nur an seiner Netzadresse (z.B. 192.168.0.171), funktioniert 127.0.0.1 nicht - dann die Netzadresse des iTrain-Rechners verwenden. Ein Pairing gibt es hier nicht.\n\n**Rückmeldung beim Verbinden:** Eine erfolgreiche Verbindung erscheint grün in der vertieften Statuszeile, und der Knopf **Weiter zur Bearbeitung** blinkt rot als Hinweis, wo es weitergeht. Scheitert die Verbindung, öffnet sich ein Fenster mit Gerätename und Adresse - lehnt das Gerät die Verbindung ab, besteht fast immer schon eine Verbindung mit einem anderen Programm (iTrain, BiDiB-Wizard), denn ein netBiDiB-Gerät lässt nur eine Verbindung zu. Dann die BiDiB-Weiterleitung von iTrain nutzen (siehe oben) oder das andere Programm trennen.\n\n**Pairing-Speicher:** Der Knopf im Verbindungsfenster zeigt alle bekannten Geräte mit Kennung, Produkt- und Benutzername, Pairing-Zustand und dem Zeitpunkt der letzten Verbindung. Einzelne Einträge oder der ganze Speicher lassen sich löschen - danach verlangt das betroffene Gerät beim nächsten Verbinden wieder ein Pairing.\n\n**Offene Verbindungen** stehen im selben Fenster und unten rechts in der Statuszeile, je mit einem Kreis: grün heißt verbunden, rot abgebrochen oder getrennt. Mehrere Interfaces gleichzeitig sind möglich.\n\n**Knoten und RX/TX:** Unter **Systeme → BiDiB** gibt es zu jeder offenen Verbindung einen Eintrag unter **Knoten** (Baum aller gemeldeten Knoten mit Kennung, Produkt und Rolle) und unter **RX/TX** (mitlaufendes Protokoll der gesendeten und empfangenen Nachrichten - hilfreich, wenn eine Verbindung nicht zustande kommt). Der Knopf **Ansicht: Lesbar / Ansicht: Hex** schaltet zwischen den rohen Bytes und der lesbaren Auswertung um (Nachrichtenname, Knotenadresse, laufende Nummer, Nutzdaten, bei seriellen Rahmen auch die CRC-Prüfung).\n\n**iTrain-Einträge erzeugen:** Im Knotenbaum lassen sich aus den gefundenen Knoten fertige Einträge für die iTrain-Datei erzeugen - **iTrain Schnittstelle erzeugen** für den Knoten selbst samt Boostern und Gleisausgängen, **iTrain Rückmelder erzeugen** für die Rückmelde-Anschlüsse. Die Kennungen werden dabei in die iTrain-Schreibweise umgerechnet (Bytefolge umgedreht, Typ-Byte angehängt, Ports ab 1 gezählt).
help.bidibText.en=Via **Systems → BiDiB → Connect...**, a netBiDiB central unit on the network is addressed.\n\n**Find devices:** When opened, the window automatically searches for devices on the local network (mDNS) and lists them in two columns. On the left is the device found, on the right whether a pairing already exists for it:\n- **Pairing available** - the device is already known. When connecting, the stored trust relationship is used; no pairing prompt appears anymore.\n- **Pairing required** - the device is new. When connecting, the pairing window appears; the request must additionally be confirmed on the device itself.\n\nClicking a row transfers the address and port into the fields below; both can also be entered by hand (default port 62875). The name with which the program introduces itself, and the last address used, are remembered. **Search again** restarts the search.\n\n**Additional search for the Tams mc2 (via FTP):** If an mc2 is currently not reporting reliably via mDNS, the connection window additionally scans the local network for its FTP access (exactly as with the ECoS search further below: not a real device search, but a scan of the /24 network followed by a confirmation) and shows a find in its own small list "mc2 found via FTP" below the manual address entry. Clicking it transfers only the IP address (with the default port); the connection itself is still made completely normally via netBiDiB, not via FTP - the FTP check serves solely to locate the address. If the same mc2 also reports via mDNS at the same time, it deliberately appears twice: above in the network list as a BiDiB device, and here additionally as "mc2 (FTP)".\n\n**BiDiB forwarding from iTrain:** iTrain can pass the BiDiB traffic on to other programs (port configurable in iTrain, e.g. 62800). This is not netBiDiB but BiDiB in serial format over TCP - which is why there is the **BiDiB serial over TCP** checkbox below the manual address and a separate list **BiDiB forwarding (iTrain) found**. The search covers the own computer (127.0.0.1 and the own network address) and the local /24 network on port 62800; a checkmark ✔ shows that BiDiB traffic was actually seen there. If iTrain only listens on its network address (e.g. 192.168.0.171), 127.0.0.1 does not work - then use the network address of the iTrain computer. There is no pairing here.\n\n**Feedback when connecting:** A successful connection appears in green in the recessed status line, and the **Continue to editing** button flashes red as a hint where to continue. If the connection fails, a window opens with device name and address - if the device refuses the connection, there is almost always already a connection with another program (iTrain, BiDiB Wizard), because a netBiDiB device allows only one connection. Then use the BiDiB forwarding of iTrain (see above) or disconnect the other program.\n\n**Pairing store:** The button in the connection window shows all known devices with identifier, product and user name, pairing status and the time of the last connection. Individual entries, or the whole store, can be deleted - the affected device will then require pairing again the next time it connects.\n\n**Open connections** appear in the same window and at the bottom right of the status bar, each with a circle: green means connected, red means aborted or disconnected. Several interfaces at the same time are possible.\n\n**Nodes and RX/TX:** Under **Systems → BiDiB**, there is an entry for every open connection under **Nodes** (a tree of all reported nodes with identifier, product and role) and under **RX/TX** (a running log of the messages sent and received - helpful when a connection does not come about). The **View: readable / View: hex** button switches between the raw bytes and the readable interpretation (message name, node address, sequence number, payload, and for serial frames also the CRC check).\n\n**Create iTrain entries:** In the node tree, ready-made entries for the iTrain file can be created from the found nodes - **Create iTrain interface** for the node itself, including boosters and track outputs, **Create iTrain feedback modules** for the feedback ports. The identifiers are converted to iTrain notation in the process (byte sequence reversed, type byte appended, ports counted from 1).
help.bidibText.nl=Via **Systemen → BiDiB → Verbinden...** wordt een netBiDiB-centrale in het netwerk aangesproken.\n\n**Apparaten zoeken:** Het venster zoekt bij het openen automatisch naar apparaten in het lokale netwerk (mDNS) en toont ze in twee kolommen. Links staat het gevonden apparaat, rechts of daarvoor al een pairing bestaat:\n- **Pairing beschikbaar** - het apparaat is al bekend. Bij het verbinden wordt de opgeslagen vertrouwensrelatie gebruikt, er verschijnt geen pairing-vraag meer.\n- **Pairing vereist** - het apparaat is nieuw. Bij het verbinden verschijnt het pairing-venster; de aanvraag moet daarnaast op het apparaat zelf worden bevestigd.\n\nEen klik op een rij neemt adres en poort over in de velden daaronder; beide kunnen ook handmatig worden ingevoerd (standaardpoort 62875). De naam waarmee het programma zich voorstelt en het laatst gebruikte adres worden onthouden. **Opnieuw zoeken** start de zoekactie opnieuw.\n\n**Extra zoekactie voor de Tams mc2 (via FTP):** Meldt een mc2 zich momenteel niet betrouwbaar via mDNS, dan doorzoekt het verbindingsvenster daarnaast het lokale netwerk op de FTP-toegang ervan (net als bij de ECoS-zoekactie verder hieronder: geen echte apparaatzoekactie, maar een aftasting van het /24-netwerk met daaropvolgende bevestiging) en toont een vondst in een eigen kleine lijst "mc2 via FTP gevonden" onder de handmatige adresinvoer. Een klik neemt alleen het IP-adres over (met de standaardpoort); er wordt desondanks helemaal normaal via netBiDiB verbonden, niet via FTP - de FTP-controle dient uitsluitend om het adres te vinden. Meldt dezelfde mc2 zich gelijktijdig ook via mDNS, dan verschijnt hij bewust twee keer: boven in de netwerklijst als BiDiB-apparaat, en hier extra als "mc2 (FTP)".\n\n**BiDiB-doorsturing van iTrain:** iTrain kan het BiDiB-verkeer doorgeven aan andere programma's (in iTrain instelbare poort, bijv. 62800). Dat is geen netBiDiB, maar BiDiB in serieel formaat via TCP - daarom is er het vakje **BiDiB serieel via TCP** onder het handmatige adres en een eigen lijst **BiDiB-doorsturing (iTrain) gevonden**. Er wordt gezocht op de eigen computer (127.0.0.1 en het eigen netwerkadres) en in het lokale /24-netwerk op poort 62800; een vinkje ✔ geeft aan dat daar werkelijk BiDiB-verkeer is gezien. Luistert iTrain alleen op zijn netwerkadres (bijv. 192.168.0.171), dan werkt 127.0.0.1 niet - gebruik dan het netwerkadres van de iTrain-computer. Een koppeling (pairing) is hier niet nodig.\n\n**Melding bij het verbinden:** Een geslaagde verbinding verschijnt groen in de verzonken statusregel, en de knop **Verder naar bewerken** knippert rood als hint waar het verder gaat. Mislukt de verbinding, dan opent een venster met apparaatnaam en adres - weigert het apparaat de verbinding, dan bestaat er bijna altijd al een verbinding met een ander programma (iTrain, BiDiB-Wizard), want een netBiDiB-apparaat staat maar één verbinding toe. Gebruik dan de BiDiB-doorsturing van iTrain (zie boven) of verbreek de verbinding van het andere programma.\n\n**Pairing-opslag:** De knop in het verbindingsvenster toont alle bekende apparaten met kenmerk, product- en gebruikersnaam, pairing-status en het tijdstip van de laatste verbinding. Afzonderlijke items of de hele opslag kunnen worden verwijderd - daarna vraagt het betreffende apparaat bij de volgende verbinding weer om een pairing.\n\n**Open verbindingen** staan in hetzelfde venster en rechtsonder in de statusbalk, elk met een cirkel: groen betekent verbonden, rood afgebroken of verbroken. Meerdere interfaces tegelijk zijn mogelijk.\n\n**Knooppunten en RX/TX:** Onder **Systemen → BiDiB** is er voor elke open verbinding een item onder **Knooppunten** (boom van alle gemelde knooppunten met kenmerk, product en rol) en onder **RX/TX** (meelopend protocol van de verzonden en ontvangen berichten - handig als een verbinding niet tot stand komt). De knop **Weergave: leesbaar / Weergave: hex** schakelt tussen de ruwe bytes en de leesbare interpretatie (berichtnaam, knooppuntadres, volgnummer, gegevens, bij seriële frames ook de CRC-controle).\n\n**iTrain-items aanmaken:** In de knooppuntenboom kunnen uit de gevonden knooppunten kant-en-klare items voor het iTrain-bestand worden aangemaakt - **iTrain-interface aanmaken** voor het knooppunt zelf inclusief boosters en spooruitgangen, **iTrain-terugmelders aanmaken** voor de terugmeldaansluitingen. De kenmerken worden daarbij omgerekend naar de iTrain-notatie (bytevolgorde omgedraaid, typebyte toegevoegd, poorten geteld vanaf 1).
help.bidibText.fr=Via **Systèmes → BiDiB → Connecter...**, une centrale netBiDiB sur le réseau est contactée.\n\n**Rechercher des appareils :** À l'ouverture, la fenêtre recherche automatiquement des appareils sur le réseau local (mDNS) et les liste en deux colonnes. À gauche figure l'appareil trouvé, à droite si un pairing existe déjà pour lui :\n- **Pairing disponible** - l'appareil est déjà connu. Lors de la connexion, la relation de confiance enregistrée est utilisée, aucune demande de pairing n'apparaît plus.\n- **Pairing requis** - l'appareil est nouveau. Lors de la connexion, la fenêtre de pairing apparaît ; la demande doit en outre être confirmée sur l'appareil lui-même.\n\nUn clic sur une ligne reprend l'adresse et le port dans les champs ci-dessous ; les deux peuvent aussi être saisis à la main (port par défaut 62875). Le nom sous lequel le programme se présente et la dernière adresse utilisée sont mémorisés. **Rechercher à nouveau** relance la recherche.\n\n**Recherche supplémentaire pour la Tams mc2 (via FTP) :** Si une mc2 ne se signale pas de façon fiable via mDNS, la fenêtre de connexion balaie en plus le réseau local à la recherche de son accès FTP (exactement comme pour la recherche ECoS plus bas : pas une véritable recherche d'appareil, mais un balayage du réseau /24 suivi d'une confirmation) et affiche une trouvaille dans une petite liste séparée « mc2 trouvée via FTP » sous la saisie manuelle de l'adresse. Un clic ne reprend que l'adresse IP (avec le port par défaut) ; la connexion se fait malgré tout tout à fait normalement via netBiDiB, et non via FTP - la vérification FTP sert uniquement à localiser l'adresse. Si la même mc2 se signale en même temps via mDNS, elle apparaît volontairement deux fois : en haut dans la liste réseau comme appareil BiDiB, et ici en plus comme « mc2 (FTP) ».\n\n**Transfert BiDiB d'iTrain :** iTrain peut transmettre le trafic BiDiB à d'autres programmes (port réglable dans iTrain, p. ex. 62800). Ce n'est pas du netBiDiB mais du BiDiB au format série sur TCP - c'est pourquoi il existe la case **BiDiB série sur TCP** sous l'adresse manuelle et une liste propre **Transfert BiDiB (iTrain) trouvé**. La recherche porte sur l'ordinateur local (127.0.0.1 et sa propre adresse réseau) et sur le réseau local /24 au port 62800 ; une coche ✔ indique qu'un trafic BiDiB y a réellement été vu. Si iTrain n'écoute que sur son adresse réseau (p. ex. 192.168.0.171), 127.0.0.1 ne fonctionne pas - utiliser alors l'adresse réseau de l'ordinateur iTrain. Il n'y a pas d'appairage ici.\n\n**Retour lors de la connexion :** Une connexion réussie s'affiche en vert dans la ligne d'état en creux, et le bouton **Continuer vers l'édition** clignote en rouge pour indiquer où continuer. Si la connexion échoue, une fenêtre s'ouvre avec le nom de l'appareil et l'adresse - si l'appareil refuse la connexion, il existe presque toujours déjà une connexion avec un autre programme (iTrain, BiDiB-Wizard), car un appareil netBiDiB n'accepte qu'une seule connexion. Utiliser alors le transfert BiDiB d'iTrain (voir ci-dessus) ou déconnecter l'autre programme.\n\n**Stockage des pairings :** Le bouton de la fenêtre de connexion affiche tous les appareils connus avec leur identifiant, leur nom de produit et d'utilisateur, l'état du pairing et l'heure de la dernière connexion. Des entrées individuelles ou tout le stockage peuvent être supprimés - l'appareil concerné demandera alors à nouveau un pairing lors de sa prochaine connexion.\n\n**Connexions ouvertes** figurent dans la même fenêtre et en bas à droite de la barre d'état, chacune avec un cercle : vert signifie connecté, rouge interrompu ou déconnecté. Plusieurs interfaces simultanées sont possibles.\n\n**Nœuds et RX/TX :** Sous **Systèmes → BiDiB**, il existe pour chaque connexion ouverte une entrée sous **Nœuds** (arbre de tous les nœuds signalés avec identifiant, produit et rôle) et sous **RX/TX** (journal en continu des messages envoyés et reçus - utile lorsqu'une connexion ne s'établit pas). Le bouton **Vue : lisible / Vue : hexa** bascule entre les octets bruts et l'interprétation lisible (nom du message, adresse du nœud, numéro de séquence, données et, pour les trames série, aussi le contrôle CRC).\n\n**Créer des entrées iTrain :** Dans l'arbre de nœuds, des entrées prêtes pour le fichier iTrain peuvent être créées à partir des nœuds trouvés - **Créer l'interface iTrain** pour le nœud lui-même, boosters et sorties de voie compris, **Créer les modules de rétrosignalisation iTrain** pour les ports de rétrosignalisation. Les identifiants sont alors convertis dans la notation iTrain (séquence d'octets inversée, octet de type ajouté, ports comptés à partir de 1).
help.bidibText.es=A través de **Sistemas → BiDiB → Conectar...** se contacta con una central netBiDiB en la red.\n\n**Buscar dispositivos:** Al abrirse, la ventana busca automáticamente dispositivos en la red local (mDNS) y los muestra en dos columnas. A la izquierda aparece el dispositivo encontrado, a la derecha si ya existe un pairing para él:\n- **Pairing disponible** - el dispositivo ya es conocido. Al conectar se utiliza la relación de confianza guardada, ya no aparece ninguna solicitud de pairing.\n- **Pairing necesario** - el dispositivo es nuevo. Al conectar aparece la ventana de pairing; la solicitud debe confirmarse además en el propio dispositivo.\n\nUn clic en una fila traslada la dirección y el puerto a los campos de abajo; ambos también pueden introducirse a mano (puerto predeterminado 62875). Se recuerdan el nombre con el que se presenta el programa y la última dirección utilizada. **Buscar de nuevo** reinicia la búsqueda.\n\n**Búsqueda adicional para la Tams mc2 (por FTP):** Si una mc2 no se anuncia de forma fiable por mDNS en ese momento, la ventana de conexión también rastrea la red local en busca de su acceso FTP (exactamente igual que en la búsqueda de ECoS más abajo: no es una búsqueda real de dispositivos, sino un rastreo de la red /24 con confirmación posterior) y muestra un hallazgo en una pequeña lista propia "mc2 encontrada por FTP" debajo de la entrada manual de dirección. Un clic traslada solo la dirección IP (con el puerto predeterminado); la conexión, no obstante, se realiza de forma completamente normal por netBiDiB, no por FTP - la comprobación FTP sirve exclusivamente para localizar la dirección. Si la misma mc2 se anuncia al mismo tiempo también por mDNS, aparece intencionadamente dos veces: arriba en la lista de red como dispositivo BiDiB, y aquí además como "mc2 (FTP)".\n\n**Reenvío BiDiB de iTrain:** iTrain puede pasar el tráfico BiDiB a otros programas (puerto configurable en iTrain, p. ej. 62800). No es netBiDiB, sino BiDiB en formato serie sobre TCP; por eso existe la casilla **BiDiB serie sobre TCP** bajo la dirección manual y una lista propia **Reenvío BiDiB (iTrain) encontrado**. Se busca en el propio ordenador (127.0.0.1 y la propia dirección de red) y en la red local /24 en el puerto 62800; una marca ✔ indica que allí se ha visto realmente tráfico BiDiB. Si iTrain solo escucha en su dirección de red (p. ej. 192.168.0.171), 127.0.0.1 no funciona; en ese caso, usar la dirección de red del ordenador de iTrain. Aquí no hay emparejamiento.\n\n**Aviso al conectar:** Una conexión correcta aparece en verde en la línea de estado hundida, y el botón **Continuar a la edición** parpadea en rojo para indicar dónde seguir. Si la conexión falla, se abre una ventana con el nombre del dispositivo y la dirección; si el dispositivo rechaza la conexión, casi siempre existe ya una conexión con otro programa (iTrain, BiDiB-Wizard), porque un dispositivo netBiDiB solo admite una conexión. En ese caso, usar el reenvío BiDiB de iTrain (véase arriba) o desconectar el otro programa.\n\n**Almacén de pairing:** El botón de la ventana de conexión muestra todos los dispositivos conocidos con identificador, nombre de producto y de usuario, estado del pairing y el momento de la última conexión. Se pueden eliminar entradas individuales o todo el almacén - después, el dispositivo afectado volverá a requerir un pairing en la próxima conexión.\n\n**Conexiones abiertas** aparecen en la misma ventana y abajo a la derecha en la barra de estado, cada una con un círculo: verde significa conectado, rojo interrumpido o desconectado. Son posibles varias interfaces al mismo tiempo.\n\n**Nodos y RX/TX:** Bajo **Sistemas → BiDiB** hay, para cada conexión abierta, una entrada bajo **Nodos** (árbol de todos los nodos notificados con identificador, producto y función) y bajo **RX/TX** (registro en curso de los mensajes enviados y recibidos - útil cuando una conexión no llega a establecerse). El botón **Vista: legible / Vista: hex** cambia entre los bytes en bruto y la interpretación legible (nombre del mensaje, dirección del nodo, número de secuencia, datos y, en las tramas serie, también la comprobación CRC).\n\n**Crear entradas de iTrain:** En el árbol de nodos se pueden crear entradas completas para el archivo iTrain a partir de los nodos encontrados - **Crear interfaz iTrain** para el propio nodo, incluidos boosters y salidas de vía, **Crear módulos de retroseñalización iTrain** para los puertos de retroseñalización. Los identificadores se convierten así a la notación de iTrain (secuencia de bytes invertida, byte de tipo añadido, puertos contados desde 1).
help.bidibText.it=Tramite **Sistemi → BiDiB → Connetti...** viene contattata una centrale netBiDiB in rete.\n\n**Trova dispositivi:** All'apertura, la finestra cerca automaticamente i dispositivi nella rete locale (mDNS) e li elenca in due colonne. A sinistra compare il dispositivo trovato, a destra se per esso esiste già un pairing:\n- **Pairing disponibile** - il dispositivo è già conosciuto. Alla connessione viene usata la relazione di fiducia salvata, non compare più alcuna richiesta di pairing.\n- **Pairing necessario** - il dispositivo è nuovo. Alla connessione compare la finestra di pairing; la richiesta deve inoltre essere confermata sul dispositivo stesso.\n\nUn clic su una riga trasferisce indirizzo e porta nei campi sottostanti; entrambi possono anche essere inseriti a mano (porta predefinita 62875). Vengono memorizzati il nome con cui il programma si presenta e l'ultimo indirizzo usato. **Cerca di nuovo** riavvia la ricerca.\n\n**Ricerca aggiuntiva per la Tams mc2 (via FTP):** Se una mc2 al momento non si annuncia in modo affidabile via mDNS, la finestra di connessione esamina inoltre la rete locale alla ricerca del suo accesso FTP (esattamente come per la ricerca ECoS più sotto: non una vera ricerca di dispositivi, ma una scansione della rete /24 seguita da una conferma) e mostra un risultato in un proprio piccolo elenco "mc2 trovata via FTP" sotto l'inserimento manuale dell'indirizzo. Un clic trasferisce solo l'indirizzo IP (con la porta predefinita); la connessione avviene comunque del tutto normalmente via netBiDiB, non via FTP - il controllo FTP serve esclusivamente a individuare l'indirizzo. Se la stessa mc2 si annuncia contemporaneamente anche via mDNS, compare intenzionalmente due volte: in alto nell'elenco di rete come dispositivo BiDiB, e qui in aggiunta come "mc2 (FTP)".\n\n**Inoltro BiDiB di iTrain:** iTrain può inoltrare il traffico BiDiB ad altri programmi (porta impostabile in iTrain, ad es. 62800). Non è netBiDiB, ma BiDiB in formato seriale su TCP - per questo esistono la casella **BiDiB seriale su TCP** sotto l'indirizzo manuale e un elenco proprio **Inoltro BiDiB (iTrain) trovato**. La ricerca avviene sul proprio computer (127.0.0.1 e il proprio indirizzo di rete) e nella rete locale /24 sulla porta 62800; un segno di spunta ✔ indica che lì è stato effettivamente visto traffico BiDiB. Se iTrain è in ascolto solo sul suo indirizzo di rete (ad es. 192.168.0.171), 127.0.0.1 non funziona - usare allora l'indirizzo di rete del computer con iTrain. Qui non c'è associazione.\n\n**Segnalazione alla connessione:** Una connessione riuscita compare in verde nella riga di stato incassata, e il pulsante **Avanti alla modifica** lampeggia in rosso per indicare dove proseguire. Se la connessione non riesce, si apre una finestra con nome del dispositivo e indirizzo - se il dispositivo rifiuta la connessione, esiste quasi sempre già una connessione con un altro programma (iTrain, BiDiB-Wizard), perché un dispositivo netBiDiB ammette una sola connessione. Usare allora l'inoltro BiDiB di iTrain (vedi sopra) o scollegare l'altro programma.\n\n**Archivio dei pairing:** Il pulsante nella finestra di connessione mostra tutti i dispositivi conosciuti con identificativo, nome del prodotto e dell'utente, stato del pairing e l'orario dell'ultima connessione. Singole voci o tutto l'archivio possono essere eliminati - dopodiché il dispositivo interessato richiederà di nuovo un pairing alla connessione successiva.\n\n**Connessioni aperte** compaiono nella stessa finestra e in basso a destra nella barra di stato, ognuna con un cerchio: verde significa connesso, rosso interrotto o disconnesso. Sono possibili più interfacce contemporaneamente.\n\n**Nodi e RX/TX:** Sotto **Sistemi → BiDiB** c'è, per ogni connessione aperta, una voce sotto **Nodi** (albero di tutti i nodi segnalati con identificativo, prodotto e ruolo) e sotto **RX/TX** (registro in tempo reale dei messaggi inviati e ricevuti - utile quando una connessione non si stabilisce). Il pulsante **Vista: leggibile / Vista: hex** passa dai byte grezzi all'interpretazione leggibile (nome del messaggio, indirizzo del nodo, numero progressivo, dati e, per i frame seriali, anche il controllo CRC).\n\n**Crea voci iTrain:** Nell'albero dei nodi si possono creare voci pronte per il file iTrain a partire dai nodi trovati - **Crea interfaccia iTrain** per il nodo stesso, booster e uscite di binario compresi, **Crea sensori di retroazione iTrain** per le porte di retroazione. Gli identificativi vengono così convertiti nella notazione iTrain (sequenza di byte invertita, byte di tipo aggiunto, porte numerate a partire da 1).
help.bidibText.pt=Através de **Sistemas → BiDiB → Ligar...** é contactada uma central netBiDiB na rede.\n\n**Encontrar dispositivos:** Ao abrir, a janela procura automaticamente dispositivos na rede local (mDNS) e lista-os em duas colunas. À esquerda está o dispositivo encontrado, à direita se já existe um pairing para ele:\n- **Pairing disponível** - o dispositivo já é conhecido. Ao ligar é usada a relação de confiança guardada, já não aparece nenhum pedido de pairing.\n- **Pairing necessário** - o dispositivo é novo. Ao ligar aparece a janela de pairing; o pedido tem de ser confirmado adicionalmente no próprio dispositivo.\n\nUm clique numa linha transfere o endereço e a porta para os campos abaixo; ambos também podem ser introduzidos manualmente (porta predefinida 62875). São memorizados o nome com que o programa se apresenta e o último endereço utilizado. **Procurar novamente** reinicia a procura.\n\n**Procura adicional para a Tams mc2 (via FTP):** Se uma mc2 não se anunciar de forma fiável via mDNS nesse momento, a janela de ligação também percorre a rede local à procura do seu acesso FTP (exatamente como na procura da ECoS mais abaixo: não é uma procura real de dispositivos, mas uma pesquisa da rede /24 seguida de confirmação) e mostra um resultado numa pequena lista própria "mc2 encontrada via FTP" abaixo da introdução manual do endereço. Um clique transfere apenas o endereço IP (com a porta predefinida); a ligação continua a ser feita de forma completamente normal via netBiDiB, não via FTP - a verificação FTP serve exclusivamente para localizar o endereço. Se a mesma mc2 se anunciar em simultâneo também via mDNS, aparece propositadamente duas vezes: acima na lista de rede como dispositivo BiDiB, e aqui adicionalmente como "mc2 (FTP)".\n\n**Reencaminhamento BiDiB do iTrain:** o iTrain pode passar o tráfego BiDiB a outros programas (porta configurável no iTrain, p. ex. 62800). Não é netBiDiB, mas BiDiB em formato série sobre TCP - por isso existe a caixa **BiDiB série sobre TCP** por baixo do endereço manual e uma lista própria **Reencaminhamento BiDiB (iTrain) encontrado**. A procura é feita no próprio computador (127.0.0.1 e o próprio endereço de rede) e na rede local /24 na porta 62800; uma marca ✔ indica que aí foi realmente visto tráfego BiDiB. Se o iTrain só escutar no seu endereço de rede (p. ex. 192.168.0.171), 127.0.0.1 não funciona - usar então o endereço de rede do computador do iTrain. Aqui não há emparelhamento.\n\n**Aviso ao ligar:** Uma ligação bem-sucedida aparece a verde na linha de estado rebaixada, e o botão **Continuar para a edição** pisca a vermelho para indicar onde continuar. Se a ligação falhar, abre-se uma janela com o nome do dispositivo e o endereço - se o dispositivo recusar a ligação, quase sempre já existe uma ligação com outro programa (iTrain, BiDiB-Wizard), pois um dispositivo netBiDiB só permite uma ligação. Usar então o reencaminhamento BiDiB do iTrain (ver acima) ou desligar o outro programa.\n\n**Armazenamento de pairing:** O botão na janela de ligação mostra todos os dispositivos conhecidos com identificador, nome de produto e de utilizador, estado do pairing e o momento da última ligação. Entradas individuais ou todo o armazenamento podem ser eliminados - depois disso, o dispositivo afetado voltará a exigir um pairing na próxima ligação.\n\n**Ligações abertas** aparecem na mesma janela e no canto inferior direito da barra de estado, cada uma com um círculo: verde significa ligado, vermelho interrompido ou desligado. São possíveis várias interfaces em simultâneo.\n\n**Nós e RX/TX:** Em **Sistemas → BiDiB** existe, para cada ligação aberta, uma entrada em **Nós** (árvore de todos os nós comunicados com identificador, produto e função) e em **RX/TX** (registo contínuo das mensagens enviadas e recebidas - útil quando uma ligação não se estabelece). O botão **Vista: legível / Vista: hex** alterna entre os bytes em bruto e a interpretação legível (nome da mensagem, endereço do nó, número de sequência, dados e, nas tramas série, também a verificação CRC).\n\n**Criar entradas iTrain:** Na árvore de nós podem ser criadas entradas prontas para o ficheiro iTrain a partir dos nós encontrados - **Criar interface iTrain** para o próprio nó, incluindo boosters e saídas de via, **Criar módulos de retrossinalização iTrain** para as portas de retrossinalização. Os identificadores são então convertidos para a notação iTrain (sequência de bytes invertida, byte de tipo adicionado, portas contadas a partir de 1).
help.bidibText.pl=Za pomocą **Systemy → BiDiB → Połącz...** wywoływana jest centrala netBiDiB w sieci.\n\n**Znajdź urządzenia:** Po otwarciu okno automatycznie wyszukuje urządzenia w sieci lokalnej (mDNS) i wyświetla je w dwóch kolumnach. Po lewej stronie znajduje się znalezione urządzenie, po prawej informacja, czy istnieje już dla niego parowanie:\n- **Parowanie dostępne** - urządzenie jest już znane. Podczas łączenia wykorzystywana jest zapisana relacja zaufania, nie pojawia się już żadne zapytanie o parowanie.\n- **Parowanie wymagane** - urządzenie jest nowe. Podczas łączenia pojawia się okno parowania; żądanie musi zostać dodatkowo potwierdzone na samym urządzeniu.\n\nKliknięcie wiersza przenosi adres i port do pól poniżej; oba można również wpisać ręcznie (domyślny port 62875). Zapamiętywana jest nazwa, pod którą program się przedstawia, oraz ostatnio używany adres. **Szukaj ponownie** ponownie uruchamia wyszukiwanie.\n\n**Dodatkowe wyszukiwanie dla Tams mc2 (przez FTP):** Jeśli mc2 aktualnie nie zgłasza się wiarygodnie przez mDNS, okno połączenia dodatkowo przeszukuje sieć lokalną w poszukiwaniu jej dostępu FTP (dokładnie tak jak przy wyszukiwaniu ECoS poniżej: nie jest to prawdziwe wyszukiwanie urządzeń, lecz przeskanowanie sieci /24 z następującym potwierdzeniem) i pokazuje znalezisko we własnej małej liście "mc2 znaleziona przez FTP" pod ręcznym wpisywaniem adresu. Kliknięcie przenosi tylko adres IP (z domyślnym portem); połączenie jest jednak nawiązywane całkowicie normalnie przez netBiDiB, a nie przez FTP - sprawdzenie FTP służy wyłącznie do znalezienia adresu. Jeśli ta sama mc2 zgłasza się jednocześnie także przez mDNS, celowo pojawia się dwukrotnie: powyżej na liście sieciowej jako urządzenie BiDiB, a tutaj dodatkowo jako "mc2 (FTP)".\n\n**Przekazywanie BiDiB z iTrain:** iTrain może przekazywać ruch BiDiB innym programom (port ustawiany w iTrain, np. 62800). To nie jest netBiDiB, lecz BiDiB w formacie szeregowym przez TCP - dlatego pod adresem ręcznym jest pole **BiDiB szeregowy przez TCP** oraz osobna lista **Znalezione przekazywanie BiDiB (iTrain)**. Wyszukiwanie obejmuje własny komputer (127.0.0.1 i własny adres sieciowy) oraz lokalną sieć /24 na porcie 62800; znaczek ✔ pokazuje, że rzeczywiście widziano tam ruch BiDiB. Jeśli iTrain nasłuchuje tylko na swoim adresie sieciowym (np. 192.168.0.171), 127.0.0.1 nie działa - wtedy użyć adresu sieciowego komputera z iTrain. Parowanie nie jest tu potrzebne.\n\n**Informacja przy łączeniu:** Udane połączenie pojawia się na zielono we wklęsłym wierszu stanu, a przycisk **Dalej do edycji** miga na czerwono jako wskazówka, gdzie dalej. Jeśli połączenie się nie uda, otwiera się okno z nazwą urządzenia i adresem - jeśli urządzenie odrzuca połączenie, prawie zawsze istnieje już połączenie z innym programem (iTrain, BiDiB-Wizard), bo urządzenie netBiDiB dopuszcza tylko jedno połączenie. Wtedy użyć przekazywania BiDiB z iTrain (patrz wyżej) lub rozłączyć drugi program.\n\n**Magazyn parowania:** Przycisk w oknie połączenia pokazuje wszystkie znane urządzenia z identyfikatorem, nazwą produktu i użytkownika, stanem parowania oraz czasem ostatniego połączenia. Można usunąć poszczególne wpisy lub cały magazyn - po tym dane urządzenie przy następnym połączeniu ponownie zażąda parowania.\n\n**Otwarte połączenia** widoczne są w tym samym oknie oraz w prawym dolnym rogu paska stanu, każde z kółkiem: zielone oznacza połączone, czerwone przerwane lub rozłączone. Możliwych jest kilka interfejsów jednocześnie.\n\n**Węzły i RX/TX:** W **Systemy → BiDiB** dla każdego otwartego połączenia znajduje się wpis pod **Węzły** (drzewo wszystkich zgłoszonych węzłów z identyfikatorem, produktem i rolą) oraz pod **RX/TX** (bieżący protokół wysyłanych i odbieranych komunikatów - przydatny, gdy połączenie nie zostaje nawiązane). Przycisk **Widok: czytelny / Widok: hex** przełącza między surowymi bajtami a czytelną interpretacją (nazwa komunikatu, adres węzła, numer kolejny, dane, a przy ramkach szeregowych także kontrola CRC).\n\n**Utwórz wpisy iTrain:** W drzewie węzłów można utworzyć gotowe wpisy dla pliku iTrain na podstawie znalezionych węzłów - **Utwórz interfejs iTrain** dla samego węzła wraz z boosterami i wyjściami torowymi, **Utwórz czujniki zwrotne iTrain** dla portów zwrotnych. Identyfikatory są przy tym przeliczane na notację iTrain (odwrócona sekwencja bajtów, dodany bajt typu, porty liczone od 1).
help.bidibText.da=Via **Systemer → BiDiB → Forbind...** kontaktes en netBiDiB-central i netværket.\n\n**Find enheder:** Ved åbning søger vinduet automatisk efter enheder i det lokale netværk (mDNS) og lister dem i to kolonner. Til venstre står den fundne enhed, til højre om der allerede findes en pairing for den:\n- **Pairing tilgængelig** - enheden er allerede kendt. Ved forbindelse bruges det gemte tillidsforhold, der vises ikke længere nogen pairing-forespørgsel.\n- **Pairing kræves** - enheden er ny. Ved forbindelse vises pairing-vinduet; anmodningen skal desuden bekræftes på selve enheden.\n\nEt klik på en linje overtager adresse og port i felterne nedenfor; begge kan også indtastes manuelt (standardport 62875). Navnet, som programmet præsenterer sig med, og den senest anvendte adresse huskes. **Søg igen** genstarter søgningen.\n\n**Ekstra søgning efter Tams mc2 (via FTP):** Melder en mc2 sig ikke aktuelt pålideligt via mDNS, gennemsøger forbindelsesvinduet desuden det lokale netværk for dens FTP-adgang (præcis som ved ECoS-søgningen nedenfor: ikke en rigtig enhedssøgning, men en afsøgning af /24-netværket med efterfølgende bekræftelse) og viser et fund i en egen lille liste "mc2 fundet via FTP" under den manuelle adresseindtastning. Et klik overtager kun IP-adressen (med standardporten); der forbindes alligevel helt normalt via netBiDiB, ikke via FTP - FTP-kontrollen tjener udelukkende til at finde adressen. Melder den samme mc2 sig samtidig også via mDNS, vises den bevidst to gange: øverst i netværkslisten som BiDiB-enhed, og her desuden som "mc2 (FTP)".\n\n**BiDiB-videresendelse fra iTrain:** iTrain kan give BiDiB-trafikken videre til andre programmer (port kan indstilles i iTrain, f.eks. 62800). Det er ikke netBiDiB, men BiDiB i seriel form over TCP - derfor findes feltet **BiDiB seriel over TCP** under den manuelle adresse og en egen liste **BiDiB-videresendelse (iTrain) fundet**. Der søges på den egen computer (127.0.0.1 og egen netværksadresse) og i det lokale /24-netværk på port 62800; et flueben ✔ viser, at der faktisk er set BiDiB-trafik der. Lytter iTrain kun på sin netværksadresse (f.eks. 192.168.0.171), virker 127.0.0.1 ikke - brug så netværksadressen på iTrain-computeren. Der er ingen parring her.\n\n**Tilbagemelding ved forbindelse:** En vellykket forbindelse vises med grønt i den forsænkede statuslinje, og knappen **Fortsæt til redigering** blinker rødt som tegn på, hvor man fortsætter. Mislykkes forbindelsen, åbnes et vindue med enhedsnavn og adresse - afviser enheden forbindelsen, er der næsten altid allerede en forbindelse med et andet program (iTrain, BiDiB-Wizard), for en netBiDiB-enhed tillader kun én forbindelse. Brug så BiDiB-videresendelsen fra iTrain (se ovenfor) eller afbryd det andet program.\n\n**Pairing-lager:** Knappen i forbindelsesvinduet viser alle kendte enheder med id, produkt- og brugernavn, pairing-status og tidspunktet for den seneste forbindelse. Enkelte poster eller hele lageret kan slettes - derefter kræver den pågældende enhed igen en pairing ved næste forbindelse.\n\n**Åbne forbindelser** står i samme vindue og nederst til højre i statuslinjen, hver med en cirkel: grøn betyder forbundet, rød afbrudt eller frakoblet. Flere interfaces samtidig er muligt.\n\n**Knuder og RX/TX:** Under **Systemer → BiDiB** findes for hver åben forbindelse et punkt under **Knuder** (træ over alle meldte knuder med id, produkt og rolle) og under **RX/TX** (løbende protokol over sendte og modtagne meddelelser - nyttigt, når en forbindelse ikke kommer i stand). Knappen **Visning: læsbar / Visning: hex** skifter mellem de rå bytes og den læsbare fortolkning (meddelelsesnavn, knudeadresse, løbenummer, data og ved serielle rammer også CRC-kontrollen).\n\n**Opret iTrain-poster:** I knudetræet kan der fra de fundne knuder oprettes færdige poster til iTrain-filen - **Opret iTrain-interface** for selve knuden inklusive boostere og sporudgange, **Opret iTrain-tilbagemeldere** for tilbagemeldeportene. Id'erne omregnes i den forbindelse til iTrain-notation (byte-sekvens vendt om, type-byte tilføjet, porte talt fra 1).
help.bidibText.sv=Via **System → BiDiB → Anslut...** kontaktas en netBiDiB-central i nätverket.\n\n**Hitta enheter:** Vid öppning söker fönstret automatiskt efter enheter i det lokala nätverket (mDNS) och listar dem i två kolumner. Till vänster står den hittade enheten, till höger om det redan finns en pairing för den:\n- **Pairing tillgänglig** - enheten är redan känd. Vid anslutning används den sparade förtroenderelationen, ingen pairing-fråga visas längre.\n- **Pairing krävs** - enheten är ny. Vid anslutning visas pairing-fönstret; begäran måste dessutom bekräftas på själva enheten.\n\nEtt klick på en rad för över adress och port till fälten nedanför; båda kan också anges manuellt (standardport 62875). Namnet som programmet presenterar sig med och den senast använda adressen sparas. **Sök igen** startar sökningen på nytt.\n\n**Extra sökning efter Tams mc2 (via FTP):** Om en mc2 för tillfället inte anmäler sig tillförlitligt via mDNS, avsöker anslutningsfönstret dessutom det lokala nätverket efter dess FTP-åtkomst (precis som vid ECoS-sökningen längre ner: ingen verklig enhetssökning, utan en avsökning av /24-nätverket med efterföljande bekräftelse) och visar ett fynd i en egen liten lista "mc2 hittad via FTP" under den manuella adressinmatningen. Ett klick för bara över IP-adressen (med standardporten); anslutningen sker trots det helt normalt via netBiDiB, inte via FTP - FTP-kontrollen används enbart för att hitta adressen. Om samma mc2 samtidigt även anmäler sig via mDNS visas den avsiktligt två gånger: överst i nätverkslistan som BiDiB-enhet, och här dessutom som "mc2 (FTP)".\n\n**BiDiB-vidarebefordran från iTrain:** iTrain kan lämna BiDiB-trafiken vidare till andra program (port som ställs in i iTrain, t.ex. 62800). Det är inte netBiDiB utan BiDiB i seriellt format över TCP - därför finns rutan **BiDiB seriellt över TCP** under den manuella adressen och en egen lista **BiDiB-vidarebefordran (iTrain) hittad**. Sökningen omfattar den egna datorn (127.0.0.1 och den egna nätverksadressen) och det lokala /24-nätverket på port 62800; en bock ✔ visar att BiDiB-trafik verkligen setts där. Lyssnar iTrain bara på sin nätverksadress (t.ex. 192.168.0.171) fungerar inte 127.0.0.1 - använd då nätverksadressen till iTrain-datorn. Här behövs ingen parkoppling.\n\n**Återkoppling vid anslutning:** En lyckad anslutning visas i grönt i den försänkta statusraden, och knappen **Fortsätt till redigering** blinkar rött som tips om var man går vidare. Misslyckas anslutningen öppnas ett fönster med enhetsnamn och adress - nekar enheten anslutningen finns nästan alltid redan en anslutning med ett annat program (iTrain, BiDiB-Wizard), eftersom en netBiDiB-enhet bara tillåter en anslutning. Använd då iTrains BiDiB-vidarebefordran (se ovan) eller koppla från det andra programmet.\n\n**Pairing-lager:** Knappen i anslutningsfönstret visar alla kända enheter med id, produkt- och användarnamn, pairing-status och tidpunkten för senaste anslutning. Enskilda poster eller hela lagret kan tas bort - därefter kräver den berörda enheten på nytt en pairing vid nästa anslutning.\n\n**Öppna anslutningar** visas i samma fönster och längst ner till höger i statusfältet, var och en med en cirkel: grön betyder ansluten, röd avbruten eller frånkopplad. Flera gränssnitt samtidigt är möjligt.\n\n**Noder och RX/TX:** Under **System → BiDiB** finns för varje öppen anslutning en post under **Noder** (träd över alla anmälda noder med id, produkt och roll) och under **RX/TX** (löpande protokoll över skickade och mottagna meddelanden - praktiskt när en anslutning inte kommer till stånd). Knappen **Vy: läsbar / Vy: hex** växlar mellan råa byte och den läsbara tolkningen (meddelandenamn, nodadress, löpnummer, data och för seriella ramar även CRC-kontrollen).\n\n**Skapa iTrain-poster:** I nodträdet kan färdiga poster för iTrain-filen skapas från de hittade noderna - **Skapa iTrain-gränssnitt** för själva noden inklusive boostrar och spårutgångar, **Skapa iTrain-återmeldare** för återkopplingsportarna. Id:erna räknas därvid om till iTrain-notation (byte-sekvensen vänds, typ-byte läggs till, portar räknas från 1).

bidib.statusRefused.de=Verbindung abgewiesen. Ist das Gerät bereits mit einem anderen Programm verbunden (es lässt nur eine Verbindung zu) oder der netBiDiB-Server dort ausgeschaltet?
bidib.statusRefused.en=Connection refused. Is the device already connected to another program (it allows only one connection) or is its netBiDiB server switched off?
bidib.statusRefused.nl=Verbinding geweigerd. Is het apparaat al met een ander programma verbonden (het staat maar één verbinding toe) of is de netBiDiB-server daar uitgeschakeld?
bidib.statusRefused.fr=Connexion refusée. L'appareil est-il déjà connecté à un autre programme (il n'accepte qu'une seule connexion) ou son serveur netBiDiB est-il désactivé ?
bidib.statusRefused.es=Conexión rechazada. ¿El dispositivo ya está conectado a otro programa (solo admite una conexión) o su servidor netBiDiB está apagado?
bidib.statusRefused.it=Connessione rifiutata. Il dispositivo è già collegato a un altro programma (ne ammette solo uno) o il suo server netBiDiB è spento?
bidib.statusRefused.pt=Ligação recusada. O dispositivo já está ligado a outro programa (só permite uma ligação) ou o servidor netBiDiB está desligado?
bidib.statusRefused.pl=Połączenie odrzucone. Czy urządzenie jest już połączone z innym programem (dopuszcza tylko jedno połączenie) albo serwer netBiDiB jest wyłączony?
bidib.statusRefused.da=Forbindelse afvist. Er enheden allerede forbundet med et andet program (den tillader kun én forbindelse), eller er netBiDiB-serveren slukket?
bidib.statusRefused.sv=Anslutning nekad. Är enheten redan ansluten till ett annat program (den tillåter bara en anslutning) eller är netBiDiB-servern avstängd?

