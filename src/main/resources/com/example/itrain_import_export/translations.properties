help.settingsMenuText.de=**Voreinstellungen** öffnet ein Fenster mit zwei Reitern.\n\n**Ansicht** - alles, was die Darstellung betrifft:\n- **Sprache** wechselt die Oberflächensprache (mit Flagge) unter den 10 verfügbaren Sprachen - wirkt sofort auf das ganze Programm.\n- **Farbschema** hell oder dunkel.\n- **Bildschirm** legt fest, wo neu geöffnete Fenster erscheinen: "wie zuletzt" (Vorgabe) oder ein fester Bildschirm. Ist nur ein Bildschirm angeschlossen, ist die Auswahl abgeschaltet - sie hätte dort nichts zu entscheiden.\n\nDazu drei Kontrollkästchen, ob\n- die Typ-Spalte\n- die Auswahlbox-Spalte\n- Daten ändern\n\nin der Kategorie-Ansicht angezeigt werden (alle standardmäßig ausgeblendet, um die Ansicht übersichtlich zu halten). Und schließlich:\n- Beim Start automatisch nach Updates suchen\n- Decoder-Hinweise anzeigen (der Hinweistext vor der ersten Decoder-Bearbeitung; er lässt sich auch im Dialog selbst abschalten)\n\n**Pfade:**\n- **Pfad für iTrain-Dateien** (Standardordner, der beim Öffnen/Speichern vorgeschlagen wird)\n- **Pfad für Exports** (Standardordner für CSV-Exporte/-Importe der Kategorie-Ansicht)\n- **Pfad für Decoder-Vorlagen** (Ordner, in dem die Decoder-Vorlagen liegen - siehe eigener Abschnitt weiter unten)\n- **Pfad für Backups** (ist er gesetzt, wird beim Öffnen einer Datei automatisch eine unveränderte Sicherheitskopie dort abgelegt)\n\nUnd das, bevor irgendetwas bearbeitet wird - bis zu 10 Generationen je Datei, danach wird die älteste überschrieben. Ungenutzte Backups werden beim Schließen/Ersetzen der Datei wieder gelöscht.\nFür alle vier Pfade lässt sich über "Durchsuchen..." ein Ordner wählen. Sind bei der allerersten Programmnutzung noch keine Pfade gesetzt, fragt das Programm einmalig danach.\n\n**Fenster merken sich ihre Lage:** Größe und Position werden beim Schließen gemerkt und beim nächsten Öffnen wiederhergestellt - Hauptfenster, Decoder-Fenster und Vorlagen-Übersicht jeweils für sich. Zeigt eine gemerkte Position ins Leere, weil ein Bildschirm abgezogen oder die Auflösung geändert wurde, erscheint das Fenster wieder mittig auf einem vorhandenen Bildschirm.\n\nUnterhalb von **Voreinstellungen** stehen im selben Menü noch **Decoder-Vorlagen installieren** und **Decoder-Vorlagen** - beide sind im Abschnitt zu den Decoder-Informationen beschrieben.
help.settingsMenuText.en=**Preferences** opens a window with two tabs.\n\n**View** - everything concerning the presentation:\n- **Language** switches the interface language (with flag) among the 10 available ones - takes effect immediately throughout the program.\n- **Colour scheme** light or dark.\n- **Screen** determines where newly opened windows appear: "as last time" (default) or a fixed screen. With only one screen connected the setting is disabled - there would be nothing to decide.\n\nPlus three check boxes for whether\n- the Type column\n- the selection box column\n- Change data\n\nare shown in the category view (all hidden by default to keep the view uncluttered). And finally:\n- Automatically check for updates on startup\n- Show decoder notes (the note shown before the first decoder edit; it can also be switched off in the dialog itself)\n\n**Paths:**\n- **Path for iTrain files** (default folder suggested when opening/saving)\n- **Path for exports** (default folder for CSV exports/imports of the category view)\n- **Path for decoder templates** (folder holding the decoder templates - see the separate section below)\n- **Path for backups** (if set, an unchanged safety copy is placed there automatically when a file is opened)\n\nAnd that before anything is edited - up to 10 generations per file, after which the oldest is overwritten. Unused backups are deleted again when the file is closed or replaced.\nA folder can be chosen for all four paths via "Browse...". If no paths are set the very first time the program is used, it asks for them once.\n\n**Windows remember their position:** Size and position are stored on closing and restored the next time - main window, decoder windows and template overview each separately. If a stored position points nowhere because a screen was disconnected or the resolution changed, the window reappears centred on an existing screen.\n\nBelow **Preferences**, the same menu also holds **Install decoder templates** and **Decoder templates** - both are described in the section on decoder information.
help.settingsMenuText.nl=**Voorkeuren** opent een venster met twee tabbladen.\n\n**Weergave** - alles wat de presentatie betreft:\n- **Taal** wisselt de taal van de gebruikersinterface (met vlag) onder de 10 beschikbare talen - werkt meteen op het hele programma.\n- **Kleurenschema** licht of donker.\n- **Scherm** bepaalt waar nieuw geopende vensters verschijnen: "zoals de vorige keer" (standaard) of een vast scherm. Is er maar één scherm aangesloten, dan is de keuze uitgeschakeld.\n\nDaarnaast drie selectievakjes of\n- de kolom Type\n- de kolom met selectievakje\n- Gegevens wijzigen\n\nin de categorieweergave worden getoond (alle standaard verborgen om de weergave overzichtelijk te houden). En ten slotte:\n- Bij het starten automatisch op updates controleren\n- Decoder-aanwijzingen tonen (de tekst voor de eerste decoderbewerking; hij is ook in het venster zelf uit te schakelen)\n\n**Paden:**\n- **Pad voor iTrain-bestanden** (standaardmap die bij openen/opslaan wordt voorgesteld)\n- **Pad voor exports** (standaardmap voor CSV-exports/-imports van de categorieweergave)\n- **Pad voor decodersjablonen** (map waarin de decodersjablonen staan - zie het aparte gedeelte hieronder)\n- **Pad voor back-ups** (is het ingesteld, dan wordt bij het openen van een bestand automatisch een ongewijzigde veiligheidskopie daar geplaatst)\n\nEn dat voordat er iets wordt bewerkt - tot 10 generaties per bestand, daarna wordt de oudste overschreven. Ongebruikte back-ups worden bij het sluiten/vervangen van het bestand weer verwijderd.\nVoor alle vier paden kan via "Bladeren..." een map worden gekozen. Zijn bij het allereerste gebruik nog geen paden ingesteld, dan vraagt het programma er eenmalig naar.\n\n**Vensters onthouden hun plaats:** Grootte en positie worden bij het sluiten onthouden en bij het volgende openen hersteld - hoofdvenster, decodervensters en sjabloonoverzicht elk afzonderlijk. Wijst een onthouden positie naar niets omdat een scherm is losgekoppeld of de resolutie is gewijzigd, dan verschijnt het venster weer gecentreerd op een bestaand scherm.\n\nOnder **Voorkeuren** staan in hetzelfde menu nog **Decodersjablonen installeren** en **Decodersjablonen** - beide worden beschreven in het gedeelte over decoderinformatie.
help.settingsMenuText.fr=**Préférences** ouvre une fenêtre comportant deux onglets.\n\n**Affichage** - tout ce qui concerne la présentation :\n- **Langue** change la langue de l'interface (avec drapeau) parmi les 10 disponibles - effet immédiat sur tout le programme.\n- **Thème de couleurs** clair ou sombre.\n- **Écran** détermine où apparaissent les fenêtres nouvellement ouvertes : « comme la dernière fois » (par défaut) ou un écran fixe. Avec un seul écran connecté, le réglage est désactivé.\n\nS'y ajoutent trois cases à cocher indiquant si\n- la colonne Type\n- la colonne de sélection\n- Modifier les données\n\nsont affichées dans la vue par catégorie (toutes masquées par défaut afin de garder la vue lisible). Et enfin :\n- Rechercher automatiquement les mises à jour au démarrage\n- Afficher les remarques sur le décodeur (le texte affiché avant la première modification ; il peut aussi être désactivé dans la fenêtre elle-même)\n\n**Chemins :**\n- **Chemin des fichiers iTrain** (dossier proposé par défaut à l'ouverture/l'enregistrement)\n- **Chemin des exports** (dossier par défaut des exports/imports CSV de la vue par catégorie)\n- **Chemin des modèles de décodeur** (dossier contenant les modèles - voir la section dédiée plus bas)\n- **Chemin des sauvegardes** (s'il est défini, une copie de sécurité inchangée y est déposée automatiquement à l'ouverture d'un fichier)\n\nEt ce avant toute modification - jusqu'à 10 générations par fichier, après quoi la plus ancienne est écrasée. Les sauvegardes inutilisées sont supprimées à la fermeture ou au remplacement du fichier.\nPour les quatre chemins, un dossier se choisit via « Parcourir... ». Si aucun chemin n'est défini lors de la toute première utilisation, le programme les demande une fois.\n\n**Les fenêtres retiennent leur position :** taille et position sont mémorisées à la fermeture et rétablies à la prochaine ouverture - fenêtre principale, fenêtres de décodeur et aperçu des modèles chacune séparément. Si une position mémorisée ne mène nulle part parce qu'un écran a été débranché ou la résolution modifiée, la fenêtre réapparaît centrée sur un écran existant.\n\nSous **Préférences**, le même menu contient encore **Installer des modèles de décodeur** et **Modèles de décodeur** - tous deux décrits dans la section sur les informations de décodeur.
help.settingsMenuText.es=**Preferencias** abre una ventana con dos pestañas.\n\n**Vista**: todo lo relativo a la presentación.\n- **Idioma** cambia el idioma de la interfaz (con bandera) entre los 10 disponibles; surte efecto de inmediato en todo el programa.\n- **Esquema de color** claro u oscuro.\n- **Pantalla** determina dónde aparecen las ventanas recién abiertas: «como la última vez» (predeterminado) o una pantalla fija. Con una sola pantalla conectada, la opción está desactivada.\n\nA ello se añaden tres casillas que indican si\n- la columna Tipo\n- la columna de selección\n- Cambiar datos\n\nse muestran en la vista por categorías (todas ocultas de forma predeterminada para mantener la vista despejada). Y por último:\n- Buscar actualizaciones automáticamente al iniciar\n- Mostrar notas del decoder (el texto previo a la primera edición; también se puede desactivar en el propio diálogo)\n\n**Rutas:**\n- **Ruta para archivos iTrain** (carpeta predeterminada que se propone al abrir/guardar)\n- **Ruta para exportaciones** (carpeta predeterminada para exportaciones/importaciones CSV de la vista por categorías)\n- **Ruta para plantillas de decoder** (carpeta donde están las plantillas; véase la sección propia más abajo)\n- **Ruta para copias de seguridad** (si está definida, al abrir un archivo se deposita allí automáticamente una copia sin modificar)\n\nY eso antes de editar nada: hasta 10 generaciones por archivo, después se sobrescribe la más antigua. Las copias no utilizadas se borran al cerrar o sustituir el archivo.\nPara las cuatro rutas puede elegirse una carpeta con «Examinar...». Si en el primer uso no hay rutas definidas, el programa las pide una sola vez.\n\n**Las ventanas recuerdan su posición:** tamaño y posición se guardan al cerrar y se restauran la próxima vez; ventana principal, ventanas de decoder y vista de plantillas por separado. Si una posición guardada no lleva a ninguna parte porque se desconectó una pantalla o cambió la resolución, la ventana reaparece centrada en una pantalla existente.\n\nDebajo de **Preferencias**, el mismo menú contiene además **Instalar plantillas de decoder** y **Plantillas de decoder**, ambos descritos en la sección sobre la información de decoder.
help.settingsMenuText.it=**Preferenze** apre una finestra con due schede.\n\n**Vista** - tutto ciò che riguarda la presentazione:\n- **Lingua** cambia la lingua dell'interfaccia (con bandiera) tra le 10 disponibili: ha effetto immediato su tutto il programma.\n- **Combinazione di colori** chiara o scura.\n- **Schermo** stabilisce dove compaiono le finestre appena aperte: «come l'ultima volta» (predefinito) oppure uno schermo fisso. Con un solo schermo collegato l'impostazione è disattivata.\n\nVi si aggiungono tre caselle che indicano se\n- la colonna Tipo\n- la colonna di selezione\n- Modifica dati\n\nvengano mostrate nella vista per categorie (tutte nascoste per impostazione predefinita, per mantenere la vista ordinata). E infine:\n- Cercare automaticamente aggiornamenti all'avvio\n- Mostra le note sul decoder (il testo prima della prima modifica; si può disattivare anche nella finestra stessa)\n\n**Percorsi:**\n- **Percorso per i file iTrain** (cartella predefinita proposta all'apertura/salvataggio)\n- **Percorso per le esportazioni** (cartella predefinita per esportazioni/importazioni CSV della vista per categorie)\n- **Percorso per i modelli di decoder** (cartella in cui si trovano i modelli - vedi la sezione dedicata più avanti)\n- **Percorso per i backup** (se impostato, all'apertura di un file vi viene depositata automaticamente una copia di sicurezza invariata)\n\nE questo prima che venga modificato alcunché: fino a 10 generazioni per file, poi la più vecchia viene sovrascritta. I backup inutilizzati vengono eliminati alla chiusura o sostituzione del file.\nPer tutti e quattro i percorsi si può scegliere una cartella con «Sfoglia...». Se al primo utilizzo non è impostato alcun percorso, il programma li chiede una volta.\n\n**Le finestre ricordano la loro posizione:** dimensione e posizione vengono memorizzate alla chiusura e ripristinate alla successiva apertura - finestra principale, finestre di decoder e panoramica dei modelli ciascuna per sé. Se una posizione memorizzata non porta da nessuna parte perché uno schermo è stato scollegato o la risoluzione è cambiata, la finestra ricompare centrata su uno schermo esistente.\n\nSotto **Preferenze**, lo stesso menu contiene ancora **Installa modelli di decoder** e **Modelli di decoder**, entrambi descritti nella sezione sulle informazioni del decoder.
help.settingsMenuText.pt=**Preferências** abre uma janela com dois separadores.\n\n**Vista** - tudo o que diz respeito à apresentação:\n- **Idioma** muda o idioma da interface (com bandeira) entre os 10 disponíveis - tem efeito imediato em todo o programa.\n- **Esquema de cores** claro ou escuro.\n- **Ecrã** determina onde aparecem as janelas recém-abertas: "como da última vez" (predefinição) ou um ecrã fixo. Com apenas um ecrã ligado, a opção está desativada.\n\nJuntam-se três caixas de seleção que indicam se\n- a coluna Tipo\n- a coluna de seleção\n- Alterar dados\n\nsão mostradas na vista por categorias (todas ocultas por predefinição, para manter a vista simples). E por fim:\n- Procurar atualizações automaticamente no arranque\n- Mostrar notas do decoder (o texto antes da primeira edição; também se pode desativar na própria janela)\n\n**Caminhos:**\n- **Caminho para ficheiros iTrain** (pasta predefinida proposta ao abrir/guardar)\n- **Caminho para exportações** (pasta predefinida para exportações/importações CSV da vista por categorias)\n- **Caminho para modelos de descodificador** (pasta onde estão os modelos - ver a secção própria mais abaixo)\n- **Caminho para cópias de segurança** (se definido, ao abrir um ficheiro é aí colocada automaticamente uma cópia inalterada)\n\nE isso antes de qualquer edição - até 10 gerações por ficheiro, depois a mais antiga é substituída. As cópias não utilizadas são apagadas ao fechar ou substituir o ficheiro.\nPara os quatro caminhos pode escolher-se uma pasta através de "Procurar...". Se na primeira utilização não houver caminhos definidos, o programa pergunta uma única vez.\n\n**As janelas guardam a sua posição:** tamanho e posição são memorizados ao fechar e repostos na abertura seguinte - janela principal, janelas de descodificador e vista geral de modelos, cada uma por si. Se uma posição memorizada não levar a lado nenhum porque um ecrã foi desligado ou a resolução mudou, a janela reaparece centrada num ecrã existente.\n\nPor baixo de **Preferências**, o mesmo menu contém ainda **Instalar modelos de descodificador** e **Modelos de descodificador** - ambos descritos na secção sobre a informação de descodificador.
help.settingsMenuText.pl=**Preferencje** otwierają okno z dwiema kartami.\n\n**Widok** - wszystko, co dotyczy prezentacji:\n- **Język** przełącza język interfejsu (z flagą) spośród 10 dostępnych - działa natychmiast w całym programie.\n- **Schemat kolorów** jasny lub ciemny.\n- **Ekran** określa, gdzie pojawiają się nowo otwierane okna: „jak ostatnio” (domyślnie) albo wybrany ekran. Przy jednym podłączonym ekranie ustawienie jest wyłączone.\n\nDo tego trzy pola wyboru, czy\n- kolumna Typ\n- kolumna zaznaczenia\n- Zmiana danych\n\nmają być widoczne w widoku kategorii (wszystkie domyślnie ukryte, aby zachować przejrzystość). I wreszcie:\n- Automatyczne sprawdzanie aktualizacji przy starcie\n- Pokazuj uwagi o dekoderze (tekst przed pierwszą edycją dekodera; można go wyłączyć także w samym oknie)\n\n**Ścieżki:**\n- **Ścieżka plików iTrain** (domyślny folder proponowany przy otwieraniu/zapisywaniu)\n- **Ścieżka eksportów** (domyślny folder eksportów/importów CSV w widoku kategorii)\n- **Ścieżka szablonów dekoderów** (folder z szablonami - patrz osobna sekcja poniżej)\n- **Ścieżka kopii zapasowych** (jeśli ustawiona, przy otwieraniu pliku odkładana jest tam automatycznie niezmieniona kopia)\n\nI to zanim cokolwiek zostanie zmienione - do 10 generacji na plik, potem najstarsza jest nadpisywana. Niewykorzystane kopie są usuwane przy zamykaniu lub zastępowaniu pliku.\nDla wszystkich czterech ścieżek folder wybiera się przyciskiem „Przeglądaj...”. Jeśli przy pierwszym użyciu żadna ścieżka nie jest ustawiona, program pyta o nie jednorazowo.\n\n**Okna zapamiętują swoje położenie:** rozmiar i pozycja są zapisywane przy zamykaniu i przywracane przy kolejnym otwarciu - okno główne, okna dekodera i przegląd szablonów każde osobno. Jeśli zapamiętana pozycja prowadzi donikąd, ponieważ odłączono ekran albo zmieniono rozdzielczość, okno pojawia się ponownie pośrodku istniejącego ekranu.\n\nPoniżej **Preferencji** w tym samym menu znajdują się jeszcze **Zainstaluj szablony dekoderów** oraz **Szablony dekoderów** - oba opisano w sekcji o informacjach dekodera.
help.settingsMenuText.da=**Præferencer** åbner et vindue med to faner.\n\n**Visning** - alt, hvad der vedrører fremstillingen:\n- **Sprog** skifter brugerfladens sprog (med flag) blandt de 10 tilgængelige - virker straks på hele programmet.\n- **Farveskema** lyst eller mørkt.\n- **Skærm** bestemmer, hvor nyåbnede vinduer vises: "som sidst" (standard) eller en fast skærm. Er kun én skærm tilsluttet, er indstillingen slået fra.\n\nDertil tre afkrydsningsfelter, om\n- Type-kolonnen\n- markeringskolonnen\n- Ret data\n\nvises i kategorivisningen (alle skjult som standard for at holde visningen overskuelig). Og endelig:\n- Søg automatisk efter opdateringer ved start\n- Vis dekoderbemærkninger (teksten før den første dekoderredigering; den kan også slås fra i dialogen selv)\n\n**Stier:**\n- **Sti til iTrain-filer** (standardmappe, der foreslås ved åbning/gemning)\n- **Sti til eksporter** (standardmappe til CSV-eksporter/-importer i kategorivisningen)\n- **Sti til dekoderskabeloner** (mappen med dekoderskabelonerne - se det særskilte afsnit længere nede)\n- **Sti til sikkerhedskopier** (er den sat, lægges der automatisk en uændret sikkerhedskopi dér, når en fil åbnes)\n\nOg det, før noget som helst redigeres - op til 10 generationer pr. fil, derefter overskrives den ældste. Ubrugte sikkerhedskopier slettes igen, når filen lukkes eller erstattes.\nFor alle fire stier kan en mappe vælges via "Gennemse...". Er der ved allerførste brug ingen stier sat, spørger programmet om dem én gang.\n\n**Vinduer husker deres placering:** størrelse og position gemmes ved lukning og gendannes næste gang - hovedvindue, dekodervinduer og skabelonoversigt hver for sig. Peger en gemt position ud i ingenting, fordi en skærm er koblet fra eller opløsningen ændret, vises vinduet igen midt på en eksisterende skærm.\n\nUnder **Præferencer** findes i samme menu desuden **Installér dekoderskabeloner** og **Dekoderskabeloner** - begge beskrevet i afsnittet om dekoderoplysninger.
help.settingsMenuText.sv=**Preferenser** öppnar ett fönster med två flikar.\n\n**Vy** - allt som rör presentationen:\n- **Språk** byter gränssnittets språk (med flagga) bland de 10 tillgängliga - verkar omedelbart i hela programmet.\n- **Färgschema** ljust eller mörkt.\n- **Skärm** avgör var nyöppnade fönster visas: "som senast" (standard) eller en fast skärm. Med bara en ansluten skärm är inställningen avstängd.\n\nDärtill tre kryssrutor för om\n- kolumnen Typ\n- markeringskolumnen\n- Ändra data\n\nska visas i kategorivyn (alla dolda som standard för att hålla vyn överskådlig). Och slutligen:\n- Sök automatiskt efter uppdateringar vid start\n- Visa dekoderanmärkningar (texten före den första dekoderredigeringen; den kan även stängas av i dialogrutan själv)\n\n**Sökvägar:**\n- **Sökväg för iTrain-filer** (standardmapp som föreslås vid öppning/sparande)\n- **Sökväg för exporter** (standardmapp för CSV-exporter/-importer i kategorivyn)\n- **Sökväg för dekodermallar** (mappen där dekodermallarna ligger - se eget avsnitt längre ned)\n- **Sökväg för säkerhetskopior** (om den är satt läggs en oförändrad säkerhetskopia dit automatiskt när en fil öppnas)\n\nOch det innan något alls redigeras - upp till 10 generationer per fil, därefter skrivs den äldsta över. Oanvända säkerhetskopior tas bort igen när filen stängs eller ersätts.\nFör alla fyra sökvägar kan en mapp väljas via "Bläddra...". Är inga sökvägar satta vid den allra första användningen frågar programmet efter dem en gång.\n\n**Fönster kommer ihåg sitt läge:** storlek och position sparas vid stängning och återställs nästa gång - huvudfönster, dekoderfönster och mallöversikt var för sig. Pekar ett sparat läge ut i tomma intet för att en skärm kopplats bort eller upplösningen ändrats visas fönstret åter mitt på en befintlig skärm.\n\nUnder **Preferenser** finns i samma meny även **Installera dekodermallar** och **Dekodermallar** - båda beskrivs i avsnittet om dekoderinformation.

