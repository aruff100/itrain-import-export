help.decoderHintsText.de=Vor der ersten Decoder-Bearbeitung erscheint ein Hinweisfenster. Es fasst zusammen, was die Funktion tut und worauf zu achten ist. Unten steht ein Ankreuzfeld **Hinweise nicht mehr anzeigen**; wieder einschalten lässt sich der Text unter **Voreinstellungen → Ansicht → Decoder-Hinweise anzeigen**. Beide Stellen schreiben dieselbe Einstellung.\n\n**Der Text gehört dir**\n\nEr steht nicht im Programm, sondern in einer Datei je Sprache: **decoder-hints_de.txt**, daneben die neun anderen Sprachen. Gesucht wird zuerst im Arbeitsverzeichnis des Programms, sonst wird die mitgelieferte Fassung genommen; fehlt die eingestellte Sprache, wird auf Deutsch zurückgefallen. Änderungen wirken ohne Neu-Übersetzung des Programms.\nDas Format ist dasselbe wie in dieser Hilfe: **\*\*fett\*\*** hebt hervor, eine Zeile mit "- " am Anfang wird zum Aufzählungspunkt, eine Leerzeile beginnt einen Absatz. Zeilen, die mit **#** beginnen, sind Kommentare für dich und erscheinen nicht im Fenster.\n\n**Was darin steht (Auszug)**\n\n- Decoder-Vorlagen sind CV-Tabellen eines Decoder-Typs. Statt jede CV von Hand einzutippen, übernimmst du eine Vorlage in eine Lokomotive oder einen Wagen und passt nur noch an, was bei deinem Fahrzeug abweicht.\n- Die mitgelieferten Vorlagen sind **über ein Skript aus den Hersteller-PDFs abgeleitet. Der Inhalt muss daher nicht stimmen.**\n- **Die Digital-Adresse bleibt deine Sache.** Eine Vorlage bringt die Werte des Decoder-Typs mit, nicht die deines Fahrzeugs. CV 1 - und bei langer Adresse CV 17/18 - nach dem Einlesen prüfen, sonst fahren mehrere Loks auf derselben Adresse. Zu korrigieren ist das in iTrain; empfehlenswert ist, alle Werte über das Programmiergleis oder mit POM auszulesen und damit zu aktualisieren.\n- **Das Programm schreibt nichts auf den Decoder und liest nichts aus ihm.** Geändert wird ausschließlich die iTrain-Datei; das Aufspielen übernimmt weiterhin iTrain oder deine Zentrale.\n- **Vor dem Ausprobieren eine Kopie der Anlagendatei anlegen.** Das Programm sichert zwar vor jedem Öffnen automatisch, aber eine eigene Kopie an einer Stelle, die du kennst, beruhigt beim ersten Mal mehr.
help.decoderHintsText.en=Before you edit a decoder for the first time, a notes window appears. It sums up what the function does and what to watch out for. At the bottom there is a tick box **Do not show these notes again**; you can switch the text back on under **Preferences → View → Show decoder notes**. Both places write the same setting.\n\n**The text is yours**\n\nIt is not held inside the program but in one file per language: **decoder-hints_en.txt**, alongside the nine others. The program's working directory is searched first, otherwise the bundled copy is used; if the selected language is missing it falls back to German. Changes take effect without rebuilding the program.\nThe format is the same as in this help: **\*\*bold\*\*** emphasises, a line starting with "- " becomes a bullet point, a blank line starts a paragraph. Lines beginning with **#** are comments for you and do not appear in the window.\n\n**What it says (extract)**\n\n- Decoder templates are CV tables for a decoder type. Instead of typing every CV by hand you apply a template to a locomotive or wagon and then only adjust what differs on your vehicle.\n- The templates supplied were **derived from the manufacturers' PDFs by a script. Their content is therefore not guaranteed to be correct.**\n- **The digital address stays your job.** A template carries the values of the decoder type, not those of your vehicle. Check CV 1 - and CV 17/18 for a long address - after loading, otherwise several locomotives end up on the same address. Correct it in iTrain; it is worth reading out all values via the programming track or with POM and updating from that.\n- **The program writes nothing to the decoder and reads nothing from it.** Only the iTrain file is changed; transferring the values remains the job of iTrain or your command station.\n- **Make a copy of your layout file before experimenting.** The program does back it up automatically before opening, but your own copy in a place you know is more reassuring the first time round.
help.decoderHintsText.nl=Voor de eerste decoderbewerking verschijnt een venster met aanwijzingen. Het vat samen wat de functie doet en waarop te letten is. Onderaan staat een vinkje **Deze aanwijzingen niet meer tonen**; weer inschakelen kan onder **Voorkeuren → Weergave → Decoder-aanwijzingen tonen**. Beide plekken schrijven dezelfde instelling.\n\n**De tekst is van jou**\n\nHij staat niet in het programma maar in een bestand per taal: **decoder-hints_nl.txt**, naast de negen andere. Eerst wordt in de werkmap van het programma gezocht, anders wordt de meegeleverde versie genomen; ontbreekt de ingestelde taal, dan wordt op Duits teruggevallen. Wijzigingen werken zonder het programma opnieuw te bouwen.\nDe opmaak is dezelfde als in deze hulp: **\*\*vet\*\*** benadrukt, een regel die met "- " begint wordt een opsommingsteken, een lege regel begint een alinea. Regels die met **#** beginnen zijn commentaar voor jou en verschijnen niet in het venster.\n\n**Wat erin staat (fragment)**\n\n- Decodersjablonen zijn CV-tabellen van een decodertype. In plaats van elke CV met de hand in te typen neem je een sjabloon over in een locomotief of wagen en pas je alleen nog aan wat bij jouw voertuig afwijkt.\n- De meegeleverde sjablonen zijn **met een script uit de pdf's van de fabrikanten afgeleid. De inhoud hoeft daarom niet te kloppen.**\n- **Het digitale adres blijft jouw zaak.** Een sjabloon bevat de waarden van het decodertype, niet die van jouw voertuig. Controleer CV 1 - en bij een lang adres CV 17/18 - na het inlezen, anders rijden meerdere locomotieven op hetzelfde adres. Corrigeren doe je in iTrain; aan te raden is alle waarden via het programmeerspoor of met POM uit te lezen en daarmee bij te werken.\n- **Het programma schrijft niets naar de decoder en leest er niets uit.** Alleen het iTrain-bestand wordt gewijzigd; het overzetten blijft de taak van iTrain of je centrale.\n- **Maak voor het uitproberen een kopie van je baanbestand.** Het programma maakt weliswaar automatisch een reservekopie voor elk openen, maar een eigen kopie op een plek die je kent stelt de eerste keer meer gerust.
help.decoderHintsText.fr=Avant la première modification d'un décodeur, une fenêtre de remarques apparaît. Elle résume ce que fait la fonction et ce à quoi il faut prendre garde. En bas se trouve une case **Ne plus afficher ces remarques** ; on peut réactiver le texte sous **Préférences → Affichage → Afficher les remarques sur le décodeur**. Les deux endroits écrivent le même réglage.\n\n**Le texte vous appartient**\n\nIl ne se trouve pas dans le programme mais dans un fichier par langue : **decoder-hints_fr.txt**, à côté des neuf autres. Le répertoire de travail du programme est consulté en premier, sinon la copie fournie est utilisée ; si la langue choisie manque, on retombe sur l'allemand. Les modifications prennent effet sans reconstruire le programme.\nLe format est celui de cette aide : **\*\*gras\*\*** met en valeur, une ligne commençant par « - » devient une puce, une ligne vide commence un paragraphe. Les lignes débutant par **#** sont des commentaires pour vous et n'apparaissent pas dans la fenêtre.\n\n**Ce qu'il contient (extrait)**\n\n- Les modèles de décodeur sont des tables de CV d'un type de décodeur. Plutôt que de saisir chaque CV à la main, vous appliquez un modèle à une locomotive ou à un wagon et n'ajustez que ce qui diffère sur votre véhicule.\n- Les modèles fournis ont été **tirés des notices PDF des fabricants par un script. Leur contenu n'est donc pas garanti exact.**\n- **L'adresse numérique reste votre affaire.** Un modèle apporte les valeurs du type de décodeur, pas celles de votre véhicule. Vérifiez CV 1 - et CV 17/18 en adresse longue - après le chargement, sinon plusieurs locomotives rouleront sur la même adresse. Cela se corrige dans iTrain ; il est conseillé de relire toutes les valeurs par la voie de programmation ou en POM et de les mettre à jour ainsi.\n- **Le programme n'écrit rien sur le décodeur et n'en lit rien.** Seul le fichier iTrain est modifié ; le transfert reste l'affaire d'iTrain ou de votre centrale.\n- **Faites une copie de votre fichier de réseau avant d'essayer.** Le programme sauvegarde certes automatiquement avant chaque ouverture, mais votre propre copie à un endroit que vous connaissez rassure davantage la première fois.
help.decoderHintsText.es=Antes de la primera edición de un decoder aparece una ventana de notas. Resume qué hace la función y a qué hay que atender. Abajo hay una casilla **No volver a mostrar estas notas**; el texto se reactiva en **Preferencias → Vista → Mostrar notas del decoder**. Ambos sitios escriben el mismo ajuste.\n\n**El texto es tuyo**\n\nNo está dentro del programa, sino en un archivo por idioma: **decoder-hints_es.txt**, junto a los otros nueve. Primero se busca en el directorio de trabajo del programa; si no, se usa la copia incluida, y si falta el idioma elegido se recurre al alemán. Los cambios surten efecto sin recompilar el programa.\nEl formato es el de esta ayuda: **\*\*negrita\*\*** resalta, una línea que empieza por «- » se convierte en viñeta, una línea vacía inicia un párrafo. Las líneas que empiezan por **#** son comentarios para ti y no aparecen en la ventana.\n\n**Qué dice (extracto)**\n\n- Las plantillas de decoder son tablas de CV de un tipo de decoder. En lugar de teclear cada CV a mano, aplicas una plantilla a una locomotora o a un vagón y solo ajustas lo que difiera en tu vehículo.\n- Las plantillas incluidas se han **extraído de los PDF de los fabricantes mediante un script. Por tanto, su contenido no tiene por qué ser correcto.**\n- **La dirección digital sigue siendo cosa tuya.** Una plantilla trae los valores del tipo de decoder, no los de tu vehículo. Comprueba CV 1 - y CV 17/18 con dirección larga - tras leerla; de lo contrario varias locomotoras circularán con la misma dirección. Se corrige en iTrain; conviene leer todos los valores por la vía de programación o con POM y actualizarlos así.\n- **El programa no escribe nada en el decoder ni lee nada de él.** Solo se modifica el archivo de iTrain; la transferencia sigue siendo tarea de iTrain o de tu central.\n- **Haz una copia de tu archivo de maqueta antes de experimentar.** El programa hace copia de seguridad automática antes de cada apertura, pero una copia propia en un lugar que conozcas tranquiliza más la primera vez.
help.decoderHintsText.it=Prima della prima modifica di un decoder compare una finestra di note. Riassume che cosa fa la funzione e a che cosa fare attenzione. In basso c'è una casella **Non mostrare più queste note**; il testo si riattiva in **Preferenze → Vista → Mostra le note sul decoder**. Entrambi i punti scrivono la stessa impostazione.\n\n**Il testo è tuo**\n\nNon sta dentro il programma ma in un file per lingua: **decoder-hints_it.txt**, accanto agli altri nove. Si cerca prima nella cartella di lavoro del programma, altrimenti si usa la copia fornita; se manca la lingua impostata si ripiega sul tedesco. Le modifiche hanno effetto senza ricompilare il programma.\nIl formato è quello di questa guida: **\*\*grassetto\*\*** evidenzia, una riga che inizia con "- " diventa un punto elenco, una riga vuota inizia un paragrafo. Le righe che iniziano con **#** sono commenti per te e non compaiono nella finestra.\n\n**Che cosa dice (estratto)**\n\n- I modelli di decoder sono tabelle CV di un tipo di decoder. Invece di digitare ogni CV a mano applichi un modello a una locomotiva o a un carro e adatti solo ciò che sul tuo rotabile è diverso.\n- I modelli forniti sono stati **ricavati dai PDF dei costruttori tramite uno script. Il loro contenuto non è quindi garantito corretto.**\n- **L'indirizzo digitale resta affare tuo.** Un modello porta i valori del tipo di decoder, non quelli del tuo rotabile. Dopo la lettura controlla CV 1 - e CV 17/18 con indirizzo lungo - altrimenti più locomotive circoleranno sullo stesso indirizzo. Si corregge in iTrain; conviene rileggere tutti i valori tramite binario di programmazione o con POM e aggiornarli di conseguenza.\n- **Il programma non scrive nulla sul decoder e non legge nulla da esso.** Viene modificato soltanto il file iTrain; il trasferimento resta compito di iTrain o della tua centrale.\n- **Prima di fare prove fai una copia del file del tuo impianto.** Il programma esegue un salvataggio automatico prima di ogni apertura, ma una copia tua in un posto che conosci la prima volta rassicura di più.
help.decoderHintsText.pt=Antes da primeira edição de um descodificador aparece uma janela de notas. Resume o que a função faz e a que se deve atender. Em baixo há uma caixa **Não mostrar mais estas notas**; o texto volta a ligar-se em **Preferências → Vista → Mostrar notas do decoder**. Ambos os sítios escrevem a mesma definição.\n\n**O texto é teu**\n\nNão está dentro do programa, mas num ficheiro por língua: **decoder-hints_pt.txt**, ao lado dos outros nove. Procura-se primeiro na pasta de trabalho do programa; caso contrário usa-se a cópia incluída, e se faltar a língua escolhida recorre-se ao alemão. As alterações fazem efeito sem recompilar o programa.\nO formato é o desta ajuda: **\*\*negrito\*\*** destaca, uma linha começada por "- " torna-se um ponto de lista, uma linha vazia começa um parágrafo. As linhas começadas por **#** são comentários para ti e não aparecem na janela.\n\n**O que diz (excerto)**\n\n- Os modelos de descodificador são tabelas de CV de um tipo de descodificador. Em vez de escrever cada CV à mão aplicas um modelo a uma locomotiva ou a um vagão e ajustas apenas o que difere no teu veículo.\n- Os modelos fornecidos foram **extraídos dos PDF dos fabricantes por um script. O seu conteúdo não tem, portanto, de estar correto.**\n- **O endereço digital continua a ser contigo.** Um modelo traz os valores do tipo de descodificador, não os do teu veículo. Verifica CV 1 - e CV 17/18 com endereço longo - depois de ler; caso contrário várias locomotivas andarão no mesmo endereço. Corrige-se no iTrain; convém ler todos os valores pela via de programação ou com POM e atualizá-los assim.\n- **O programa não escreve nada no descodificador nem lê nada dele.** Só o ficheiro do iTrain é alterado; a transferência continua a ser tarefa do iTrain ou da tua central.\n- **Faz uma cópia do ficheiro do teu layout antes de experimentares.** O programa faz cópia de segurança automática antes de cada abertura, mas uma cópia tua num sítio que conheces tranquiliza mais à primeira vez.
help.decoderHintsText.pl=Przed pierwszą edycją dekodera pojawia się okno z uwagami. Streszcza, co robi ta funkcja i na co zwrócić uwagę. Na dole jest pole **Nie pokazuj więcej tych uwag**; tekst można włączyć z powrotem w **Ustawienia → Widok → Pokazuj uwagi o dekoderze**. Oba miejsca zapisują to samo ustawienie.\n\n**Tekst należy do ciebie**\n\nNie tkwi w programie, lecz w pliku dla każdego języka: **decoder-hints_pl.txt**, obok dziewięciu pozostałych. Najpierw przeszukiwany jest katalog roboczy programu, w przeciwnym razie brana jest kopia dołączona; gdy brakuje ustawionego języka, następuje powrót do niemieckiego. Zmiany działają bez ponownego budowania programu.\nFormat jest ten sam co w tej pomocy: **\*\*pogrubienie\*\*** wyróżnia, wiersz zaczynający się od "- " staje się punktem listy, pusty wiersz zaczyna akapit. Wiersze zaczynające się od **#** to komentarze dla ciebie i nie pojawiają się w oknie.\n\n**Co w nim jest (fragment)**\n\n- Szablony dekoderów to tabele CV danego typu dekodera. Zamiast wpisywać każdą CV ręcznie, przenosisz szablon do lokomotywy lub wagonu i poprawiasz tylko to, co w twoim pojeździe jest inne.\n- Dołączone szablony zostały **wydobyte z plików PDF producentów za pomocą skryptu. Ich treść nie musi więc być poprawna.**\n- **Adres cyfrowy pozostaje twoją sprawą.** Szablon wnosi wartości typu dekodera, a nie twojego pojazdu. Po wczytaniu sprawdź CV 1 - a przy długim adresie CV 17/18 - inaczej kilka lokomotyw pojedzie na tym samym adresie. Poprawia się to w iTrain; warto odczytać wszystkie wartości torem programującym albo przez POM i tak je zaktualizować.\n- **Program niczego nie zapisuje w dekoderze ani niczego z niego nie odczytuje.** Zmieniany jest wyłącznie plik iTrain; przeniesienie pozostaje zadaniem iTrain lub twojej centrali.\n- **Przed próbami zrób kopię pliku swojej makiety.** Program wprawdzie tworzy kopię zapasową automatycznie przed każdym otwarciem, ale własna kopia w znanym ci miejscu za pierwszym razem uspokaja bardziej.
help.decoderHintsText.da=Før den første dekoderredigering dukker et bemærkningsvindue op. Det opsummerer, hvad funktionen gør, og hvad man skal være opmærksom på. Nederst står et afkrydsningsfelt **Vis ikke disse bemærkninger igen**; teksten kan slås til igen under **Indstillinger → Visning → Vis dekoderbemærkninger**. Begge steder skriver den samme indstilling.\n\n**Teksten er din**\n\nDen ligger ikke i programmet, men i en fil pr. sprog: **decoder-hints_da.txt** ved siden af de ni andre. Der søges først i programmets arbejdsmappe, ellers bruges den medfølgende kopi; mangler det valgte sprog, falder den tilbage på tysk. Ændringer virker uden at bygge programmet igen.\nFormatet er det samme som i denne hjælp: **\*\*fed\*\*** fremhæver, en linje der begynder med "- " bliver til et punkt, en tom linje begynder et afsnit. Linjer der begynder med **#** er kommentarer til dig og vises ikke i vinduet.\n\n**Hvad der står i den (uddrag)**\n\n- Dekoderskabeloner er CV-tabeller for en dekodertype. I stedet for at taste hver CV i hånden overfører du en skabelon til et lokomotiv eller en vogn og tilpasser kun det, der afviger på dit køretøj.\n- De medfølgende skabeloner er **udledt af fabrikanternes PDF-filer med et script. Indholdet behøver derfor ikke at være rigtigt.**\n- **Den digitale adresse er fortsat din sag.** En skabelon rummer dekodertypens værdier, ikke dit køretøjs. Kontroller CV 1 - og ved lang adresse CV 17/18 - efter indlæsningen, ellers kører flere lokomotiver på samme adresse. Det rettes i iTrain; det anbefales at læse alle værdier ud via programmeringssporet eller med POM og opdatere ud fra det.\n- **Programmet skriver intet til dekoderen og læser intet fra den.** Kun iTrain-filen ændres; overførslen er fortsat iTrains eller din centrals opgave.\n- **Lav en kopi af din anlægsfil, før du prøver dig frem.** Programmet tager ganske vist automatisk sikkerhedskopi før hver åbning, men din egen kopi et sted, du kender, beroliger mere første gang.
help.decoderHintsText.sv=Före den första dekoderredigeringen dyker ett anmärkningsfönster upp. Det sammanfattar vad funktionen gör och vad man ska se upp med. Längst ned finns en kryssruta **Visa inte dessa anmärkningar igen**; texten går att slå på igen under **Inställningar → Vy → Visa dekoderanmärkningar**. Båda ställena skriver samma inställning.\n\n**Texten är din**\n\nDen ligger inte i programmet utan i en fil per språk: **decoder-hints_sv.txt** vid sidan av de nio andra. Först söks programmets arbetskatalog, annars används den medföljande kopian; saknas det inställda språket faller den tillbaka på tyska. Ändringar verkar utan att programmet byggs om.\nFormatet är detsamma som i den här hjälpen: **\*\*fet\*\*** framhäver, en rad som börjar med "- " blir en punkt, en tom rad börjar ett stycke. Rader som börjar med **#** är kommentarer till dig och visas inte i fönstret.\n\n**Vad som står i den (utdrag)**\n\n- Dekodermallar är CV-tabeller för en dekodertyp. I stället för att knappa in varje CV för hand för du över en mall till ett lok eller en vagn och justerar bara det som skiljer sig på ditt fordon.\n- De medföljande mallarna har **härletts ur tillverkarnas PDF-filer med ett skript. Innehållet behöver därför inte stämma.**\n- **Den digitala adressen är fortfarande din sak.** En mall bär med sig dekodertypens värden, inte ditt fordons. Kontrollera CV 1 - och vid lång adress CV 17/18 - efter inläsningen, annars går flera lok på samma adress. Det rättas i iTrain; det är lämpligt att läsa ut alla värden via programmeringsspåret eller med POM och uppdatera utifrån det.\n- **Programmet skriver ingenting till dekodern och läser ingenting från den.** Bara iTrain-filen ändras; överföringen är fortfarande iTrains eller din centrals uppgift.\n- **Gör en kopia av din anläggningsfil innan du provar dig fram.** Programmet tar visserligen automatiskt säkerhetskopia före varje öppning, men en egen kopia på ett ställe du känner till lugnar mer första gången.

