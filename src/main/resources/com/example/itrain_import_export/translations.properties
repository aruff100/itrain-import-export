help.categoryViewText.de=Jeder Reiter zeigt eine der iTrain-Kategorien (z.B. Rückmeldungen, Blöcke, Aktionen). Die farbigen Schaltflächen in der Werkzeugleiste oben im Fenster (rechts vom Trennstrich) wirken immer auf den gerade sichtbaren Reiter:\n- **Markierte exportieren** speichert die ausgewählten Einträge als .zip-Datei (mit genau einer .csv darin), inklusive automatisch erkannter, referenzierter Einträge aus anderen Kategorien (siehe nächster Abschnitt zur "~"-Kennzeichnung). Der Dateiname wird abgefragt; eine eingetippte Endung .csv oder .zip wird durch .zip ersetzt.\n- **In Kategorie importieren** liest eine solche .zip-Datei (oder eine .csv aus älteren Versionen) wieder ein und verteilt jede Zeile automatisch in ihre passende Kategorie.\n- Ein **Rechtsklick** auf eine Zeile öffnet das Menü mit **Bearbeiten...** (Name und Beschreibung des Eintrags ändern, Eingabetaste bestätigt) und **Export...**. Wird ein Eintrag umbenannt, auf den andere Einträge verweisen, fragt das Programm, ob diese Verweise mit umbenannt werden sollen - ohne das könnte iTrain die Datei danach nicht mehr öffnen.\n- Ein neuer Eintrag wird über das **"+"**-Symbol angelegt.\n- Löschen über das rote **"X"** - beide rechts über der Tabelle.\n\nRechts davon, deutlich abgesetzt, stehen die beiden Knöpfe **Decoder** und **Systeme**, die die Zusatzfenster öffnen. **Decoder exportieren** und **Decoder importieren** findest du seit 2.5 im Decoder-Fenster - siehe den eigenen Abschnitt weiter unten.\n\n**Anmerkung:** Ein Hinzufügen von Daten oder ein Löschen einzelner Einträge ist möglich, sollte aber nur von erfahrenen Anwendern durchgeführt werden. Wenn der Datenzusammenhang beschädigt ist, wird die Datei unbrauchbar.\nDann funktioniert aber noch das Backup
help.categoryViewText.en=Each tab shows one of the iTrain categories (e.g. feedbacks, blocks, actions). The coloured buttons in the toolbar at the top of the window (to the right of the separator) always act on the currently visible tab:\n- **Export Selected** saves the selected entries as a CSV file, including automatically detected referenced entries from other categories (see the next section on the "~" marking).\n- **Import into category** reads such a CSV file back in and distributes every row automatically into its matching category.\n- A **right click** on a row opens the menu with **Edit...** (change the name and description of the entry, Enter confirms) and **Export...**. If an entry is renamed that other entries refer to, the program asks whether those references should be renamed as well - without that iTrain might no longer be able to open the file.\n- A new entry is created with the **"+"** symbol.\n- Deleting is done with the red **"X"** - both are located above the table on the right.\n\nUnder **Locomotives** and **Wagons** the same toolbar holds two more buttons: **Export decoder** and **Import decoder** - see the separate section further below.\n\n**Note:** Adding data or deleting individual entries is possible, but should only be done by experienced users. If the data coherence is damaged, the file becomes unusable.\nThe backup still works, though.
help.categoryViewText.nl=Elk tabblad toont een van de iTrain-categorieën (bijv. terugmeldingen, blokken, acties). De gekleurde knoppen in de werkbalk bovenaan het venster (rechts van de scheidingslijn) werken altijd op het momenteel zichtbare tabblad:\n- **Selectie exporteren** slaat de geselecteerde items op als CSV-bestand, inclusief automatisch herkende items uit andere categorieën waarnaar verwezen wordt (zie het volgende hoofdstuk over de "~"-aanduiding).\n- **In categorie importeren** leest zo'n CSV-bestand weer in en verdeelt elke regel automatisch over de bijbehorende categorie.\n- Een **rechtsklik** op een rij opent het menu met **Bewerken...** (naam en omschrijving van het item wijzigen, Enter bevestigt) en **Exporteren...**. Wordt een item hernoemd waarnaar andere items verwijzen, dan vraagt het programma of die verwijzingen mee moeten worden hernoemd - zonder dat zou iTrain het bestand daarna mogelijk niet meer kunnen openen.\n- Een nieuw item wordt aangemaakt via het **"+"**-symbool.\n- Verwijderen gaat via de rode **"X"** - beide rechts boven de tabel.\n\nBij **Locomotieven** en **Wagons** staan in dezelfde werkbalk bovendien **Decoder exporteren** en **Decoder importeren** - zie het aparte gedeelte verderop.\n\n**Opmerking:** Gegevens toevoegen of losse items verwijderen is mogelijk, maar zou alleen door ervaren gebruikers moeten gebeuren. Raakt de samenhang van de gegevens beschadigd, dan wordt het bestand onbruikbaar.\nDe reservekopie werkt dan echter nog.
help.categoryViewText.fr=Chaque onglet affiche l'une des catégories iTrain (p. ex. rétrosignalisations, cantons, actions). Les boutons colorés de la barre d'outils en haut de la fenêtre (à droite du trait de séparation) agissent toujours sur l'onglet actuellement visible :\n- **Exporter la sélection** enregistre les entrées sélectionnées dans un fichier CSV, y compris les entrées référencées d'autres catégories détectées automatiquement (voir la section suivante sur le marquage "~").\n- **Importer dans la catégorie** relit un tel fichier CSV et répartit automatiquement chaque ligne dans la catégorie qui lui correspond.\n- Un **clic droit** sur une ligne ouvre le menu avec **Modifier...** (changer le nom et la description de l'entrée, Entrée valide) et **Exporter...**. Si une entrée référencée par d'autres entrées est renommée, le programme demande si ces références doivent également être renommées - sans cela, iTrain risquerait de ne plus pouvoir ouvrir le fichier.\n- Une nouvelle entrée se crée via le symbole **"+"**.\n- La suppression se fait via le **"X"** rouge - les deux se trouvent en haut à droite du tableau.\n\nPour les **Locomotives** et les **Wagons**, deux boutons supplémentaires figurent dans la même barre d'outils : **Exporter le décodeur** et **Importer le décodeur** - voir la section distincte plus bas.\n\n**Remarque :** Ajouter des données ou supprimer des entrées isolées est possible, mais ne devrait être fait que par des utilisateurs expérimentés. Si la cohérence des données est rompue, le fichier devient inutilisable.\nLa sauvegarde fonctionne alors toujours.
help.categoryViewText.es=Cada pestaña muestra una de las categorías de iTrain (p. ej. retroseñalizaciones, bloques, acciones). Los botones de colores de la barra de herramientas en la parte superior de la ventana (a la derecha de la línea separadora) actúan siempre sobre la pestaña visible en ese momento:\n- **Exportar selección** guarda las entradas seleccionadas como archivo CSV, incluidas las entradas referenciadas de otras categorías detectadas automáticamente (véase el apartado siguiente sobre el marcado "~").\n- **Importar en la categoría** vuelve a leer un archivo CSV de ese tipo y reparte cada línea automáticamente en la categoría que le corresponde.\n- Un **clic derecho** sobre una fila abre el menú con **Editar...** (cambiar el nombre y la descripción de la entrada; Intro confirma) y **Exportar...**. Si se renombra una entrada a la que hacen referencia otras, el programa pregunta si esas referencias deben renombrarse también; sin ello, iTrain podría no poder abrir el archivo después.\n- Una entrada nueva se crea con el símbolo **"+"**.\n- Se elimina con la **"X"** roja - ambos se encuentran arriba a la derecha de la tabla.\n\nEn **Locomotoras** y **Vagones** hay en la misma barra de herramientas además **Exportar decoder** e **Importar decoder**: véase la sección aparte más abajo.\n\n**Nota:** Añadir datos o borrar entradas sueltas es posible, pero solo deberían hacerlo usuarios con experiencia. Si se daña la coherencia de los datos, el archivo queda inservible.\nLa copia de seguridad sigue funcionando.
help.categoryViewText.it=Ogni scheda mostra una delle categorie di iTrain (ad es. sensori di retroazione, blocchi, azioni). I pulsanti colorati nella barra degli strumenti in alto nella finestra (a destra della linea di separazione) agiscono sempre sulla scheda attualmente visibile:\n- **Esporta selezionati** salva le voci selezionate come file CSV, comprese le voci referenziate di altre categorie riconosciute automaticamente (vedi la sezione seguente sul contrassegno "~").\n- **Importa nella categoria** rilegge un file CSV di questo tipo e distribuisce ogni riga automaticamente nella categoria corrispondente.\n- Un **clic destro** su una riga apre il menu con **Modifica...** (cambiare nome e descrizione della voce, Invio conferma) ed **Esporta...**. Se viene rinominata una voce a cui altre voci fanno riferimento, il programma chiede se rinominare anche quei riferimenti: senza, iTrain potrebbe non riuscire più ad aprire il file.\n- Una nuova voce si crea con il simbolo **"+"**.\n- L'eliminazione avviene con la **"X"** rossa - entrambi si trovano in alto a destra sopra la tabella.\n\nIn **Locomotive** e **Vagoni** sono presenti nella stessa barra degli strumenti anche **Esporta decoder** e **Importa decoder**: vedi la sezione dedicata più avanti.\n\n**Nota:** Aggiungere dati o eliminare singole voci è possibile, ma dovrebbe farlo solo chi ha esperienza. Se la coerenza dei dati viene compromessa, il file diventa inutilizzabile.\nIl salvataggio funziona comunque ancora.
help.categoryViewText.pt=Cada separador mostra uma das categorias do iTrain (p. ex. retrossinalizações, blocos, ações). Os botões coloridos na barra de ferramentas no topo da janela (à direita do traço separador) atuam sempre sobre o separador atualmente visível:\n- **Exportar Selecionados** guarda as entradas selecionadas como ficheiro CSV, incluindo as entradas referenciadas de outras categorias reconhecidas automaticamente (ver a secção seguinte sobre a identificação "~").\n- **Importar para a categoria** volta a ler um ficheiro CSV desse tipo e distribui cada linha automaticamente pela categoria correspondente.\n- Um **clique com o botão direito** numa linha abre o menu com **Editar...** (alterar o nome e a descrição da entrada; Enter confirma) e **Exportar...**. Se for renomeada uma entrada referenciada por outras, o programa pergunta se essas referências devem ser renomeadas também - sem isso, o iTrain poderá deixar de conseguir abrir o ficheiro.\n- Uma nova entrada é criada através do símbolo **"+"**.\n- A eliminação faz-se através do **"X"** vermelho - ambos se encontram por cima da tabela, à direita.\n\nEm **Locomotivas** e **Vagões** existem na mesma barra de ferramentas ainda **Exportar descodificador** e **Importar descodificador** - ver a secção própria mais abaixo.\n\n**Nota:** Acrescentar dados ou apagar entradas isoladas é possível, mas só deve ser feito por utilizadores experientes. Se a coerência dos dados for danificada, o ficheiro fica inutilizável.\nA cópia de segurança continua a funcionar.
help.categoryViewText.pl=Każda karta pokazuje jedną z kategorii iTrain (np. czujniki zwrotne, bloki, akcje). Kolorowe przyciski na pasku narzędzi u góry okna (na prawo od kreski oddzielającej) działają zawsze na aktualnie widoczną kartę:\n- **Eksportuj Zaznaczone** zapisuje wybrane wpisy jako plik CSV, wraz z automatycznie rozpoznanymi wpisami z innych kategorii, do których istnieją odwołania (patrz następny rozdział o oznaczeniu "~").\n- **Importuj do kategorii** wczytuje taki plik CSV z powrotem i automatycznie rozdziela każdy wiersz do pasującej mu kategorii.\n- **Kliknięcie prawym przyciskiem** na wierszu otwiera menu z pozycjami **Edytuj...** (zmiana nazwy i opisu wpisu, Enter zatwierdza) oraz **Eksportuj...**. Jeśli zmieniana jest nazwa wpisu, do którego odwołują się inne wpisy, program pyta, czy zmienić także te odwołania - bez tego iTrain mógłby nie otworzyć już pliku.\n- Nowy wpis tworzy się symbolem **"+"**.\n- Usuwanie odbywa się czerwonym **"X"** - oba znajdują się po prawej stronie nad tabelą.\n\nPrzy **Lokomotywach** i **Wagonach** znajdują się na tym samym pasku narzędzi dodatkowo **Eksportuj dekoder** oraz **Importuj dekoder** - zob. osobną sekcję poniżej.\n\n**Uwaga:** Dodawanie danych lub usuwanie pojedynczych wpisów jest możliwe, ale powinni to robić wyłącznie doświadczeni użytkownicy. Jeśli spójność danych zostanie naruszona, plik stanie się bezużyteczny.\nKopia zapasowa działa jednak nadal.
help.categoryViewText.da=Hver fane viser en af iTrain-kategorierne (f.eks. tilbagemeldinger, blokke, handlinger). De farvede knapper i værktøjslinjen øverst i vinduet (til højre for skillestregen) virker altid på den aktuelt synlige fane:\n- **Eksportér Markerede** gemmer de valgte poster som CSV-fil, inklusive automatisk genkendte poster fra andre kategorier, som der henvises til (se næste afsnit om "~"-markeringen).\n- **Importér i kategori** indlæser en sådan CSV-fil igen og fordeler hver linje automatisk til den kategori, den hører til.\n- Et **højreklik** på en række åbner menuen med **Rediger...** (ændr postens navn og beskrivelse, Enter bekræfter) og **Eksportér...**. Omdøbes en post, som andre poster henviser til, spørger programmet, om disse henvisninger skal omdøbes med - uden det kunne iTrain muligvis ikke åbne filen bagefter.\n- En ny post oprettes med **"+"**-symbolet.\n- Sletning sker med det røde **"X"** - begge findes til højre over tabellen.\n\nVed **Lokomotiver** og **Vogne** findes i samme værktøjslinje desuden **Eksportér dekoder** og **Importér dekoder** - se det særskilte afsnit længere nede.\n\n**Bemærk:** Det er muligt at tilføje data eller slette enkelte poster, men det bør kun gøres af erfarne brugere. Bliver datasammenhængen beskadiget, bliver filen ubrugelig.\nSikkerhedskopien virker dog stadig.
help.categoryViewText.sv=Varje flik visar en av iTrain-kategorierna (t.ex. återkopplingar, block, åtgärder). De färgade knapparna i verktygsfältet högst upp i fönstret (till höger om skiljelinjen) verkar alltid på den flik som just nu visas:\n- **Exportera Markerade** sparar de valda posterna som CSV-fil, inklusive automatiskt igenkända poster från andra kategorier som det hänvisas till (se nästa avsnitt om "~"-märkningen).\n- **Importera till kategori** läser in en sådan CSV-fil igen och fördelar varje rad automatiskt till den kategori den hör till.\n- Ett **högerklick** på en rad öppnar menyn med **Redigera...** (ändra postens namn och beskrivning, Retur bekräftar) och **Exportera...**. Byter man namn på en post som andra poster hänvisar till frågar programmet om även dessa referenser ska byta namn - utan det skulle iTrain kanske inte längre kunna öppna filen.\n- En ny post skapas via symbolen **"+"**.\n- Borttagning sker via det röda **"X"** - båda finns till höger ovanför tabellen.\n\nVid **Lok** och **Vagnar** finns i samma verktygsfält dessutom **Exportera dekoder** och **Importera dekoder** - se det separata avsnittet längre ned.\n\n**Observera:** Att lägga till data eller ta bort enskilda poster går, men bör bara göras av erfarna användare. Skadas datasammanhanget blir filen oanvändbar.\nSäkerhetskopian fungerar dock fortfarande.

